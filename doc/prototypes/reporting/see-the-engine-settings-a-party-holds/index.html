<body>

<!--
  PROTOTYPE. Throwaway. Mock data, no backend, no build step, no session.

  The engine run settings list and one configuration's page, drawn as the Record screen
  standard (doc/knowledge/ui/record_screen_standard.org) draws a record screen, and
  beside the pricing engines prototype: breadcrumb, plural title, one sentence, Refresh
  and Add, search, a filter, the table, the pager and the four states; then the record
  page with the access mark and the tabs Details, the three sections, Used by and History.

  Each group has a tab of its own, and each group is one part table with its own version.
  A write to any group makes the next version of the whole, and History shows one
  entry for each group changed.

  Addresses: ?screen=list | record&id=e1|e2|e3&tab=details|dates|fixings|building|execution|output|reports|history
  Switches in the bottom bar (they reload and reset the mock data):
    ?state=all|empty|error|loading
    ?edit=fixings|building|execution   opens that group of the record in edit mode
    ?actor=viewer|analyst|admin   a viewer reads, an analyst adds and edits, only the administrator deletes
  The Simple and Advanced switch is in the page, as on the feed screens. ?mode=simple or advanced sets it, and it is remembered.
-->

<div class="proto-note" id="note"></div>
<div class="wrap" id="app"></div>
<div class="proto-bar" id="bar"></div>
<div id="layer"></div>

<script>
// Every setting that the ORE user guide (Docs/UserGuide/parameterisation/ore.tex and the examples chapter) describes as an engine
// choice appears here. A setting seen in sample files or in the source, but not in the guide, is left out. Where the guide and the
// source disagree, the default is the one in the source. dv is the default as a person reads it.
const GROUPS = [
  { id: 'fixings', title: 'Fixings and cash flows', table: 'engine_settings_fixings', changes: true, what: 'Which fixings and cash flows count.', fields: [
    { key: 'imply_todays_fixings', ore: 'implyTodaysFixings', label: 'Imply today’s fixings', kind: 'bool', dv: 'No', help: 'Whether today’s fixings are implied.',
      desc: 'Decides what the run does about the fixing of the valuation date. When it is No, the fixing for the valuation date is loaded from the fixing file like any earlier fixing. When it is Yes, that fixing is not loaded and the engine implies it from the curves. Use Yes when the run prices off hypothetical market data, as in scenario analysis and stress testing, because a fixing from the real market would not match the hypothetical curves.',
      dflt: 'No. Today’s fixing is loaded.' },
    { key: 'include_todays_cash_flows', ore: 'includeTodaysCashFlows', label: 'Include today’s cash flows', kind: 'bool', dv: 'No', help: 'Whether cash flows that pay today count.',
      desc: 'Decides whether a cash flow that pays on the valuation date is part of the NPV or is treated as matured and excluded. It is one of two QuantLib flags that ORE exposes. A choice here applies to every analytic of the run. The simulation analytic has its own parameter of the same name, which applies to the XVA, XVA sensitivity and XVA stress analytics. Change it only when the NPV must agree with a system that treats payments on the valuation date the other way.',
      dflt: 'No. A cash flow that pays on the valuation date is treated as matured.' },
    { key: 'include_reference_date_events', ore: 'includeReferenceDateEvents', label: 'Include reference date events', kind: 'bool', dv: 'No', help: 'Whether events on the reference date count.',
      desc: 'Decides whether an event that falls on the valuation date is still counted in the NPV or is treated as matured and excluded. It is the companion of Include today’s cash flows, and the two together decide how a trade is valued on the day of its payment or event. A choice here applies to every analytic of the run, and the simulation analytic has its own parameter of the same name.',
      dflt: 'No. An event on the valuation date is treated as matured.' },
    { key: 'enrich_index_fixings', ore: 'enrichIndexFixings', label: 'Enrich index fixings', kind: 'bool', dv: 'No', help: 'Whether gaps in index fixings are filled.',
      desc: 'Fills gaps in the history of an index. When it is Yes, a missing fixing is replaced by a fallback: the previous fixing first, and the next fixing when there is no previous one. Ignore fixing lag and Ignore fixing lead limit how far the fallback may be from the gap. Use it when the fixing file has gaps. It changes the numbers, because a trade that reads a filled fixing is valued with it.',
      dflt: 'No. A gap stays a gap.' },
    { key: 'ignore_fixing_lag', ore: 'ignoreFixingLag', label: 'Ignore fixing lag', kind: 'number', dv: '0', help: 'A number of days. Zero turns the check off.',
      desc: 'Works with Enrich index fixings. When the engine fills a gap in an index’s fixings with the previous fixing, this setting limits how old that previous fixing may be. If the previous fixing is more days older than the gap than this number, the engine does not use it as the fallback. A value of zero turns the check off, so a fixing of any age can fill the gap.',
      dflt: '0. The check is off.' },
    { key: 'ignore_fixing_lead', ore: 'ignoreFixingLead', label: 'Ignore fixing lead', kind: 'number', dv: '0', help: 'A number of days. Zero turns the check off.',
      desc: 'Works with Enrich index fixings. When the engine fills a gap in an index’s fixings with the next fixing, this setting limits how far ahead that next fixing may be. If the next fixing date leads the gap by more days than this number, the engine does not use it as the fallback. A value of zero turns the check off, so a fixing of any distance can fill the gap.',
      dflt: '0. The check is off.' }] },
  { id: 'building', title: 'Market and trade building', table: 'engine_settings_building', changes: true, what: 'How the engine builds the market and the trades, and what it does when that fails.', fields: [
    { key: 'observation_model', ore: 'observationModel', label: 'Observation model', kind: 'select', opts: ['None', 'Disable', 'Defer', 'Unregister'], dv: 'None', help: 'How the engine handles QuantLib notifications.',
      desc: 'Controls how many QuantLib observer notifications the engine uses when market data and fixings are updated and when the evaluation date moves. Notifications keep every dependent object up to date, and they cost time in a simulation. None is the normal QuantLib behaviour, where every update notifies every dependent object. The other three choices cut that cost in different ways and give a similar speed up. Disable switches all notifications off during market and fixing updates and when the evaluation date moves along a path, and the engine triggers the needed recalculations itself. Defer switches notifications off during market and fixing updates and runs the updates when notifications are on again. Unregister keeps notifications on but unregisters floating rate coupons from their indices, which removes most of them. The ORE user guide describes the setting as a control of performance during simulation.',
