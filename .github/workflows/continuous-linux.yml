# yamllint disable rule:line-length
---
name: Continuous Linux

env:
  VCPKG_BINARY_SOURCES: 'clear;files,${{ github.workspace }}/vcpkg-cache,readwrite'
  SCCACHE_DIR: '${{ github.workspace }}/.sccache'

on:  # yamllint disable-line rule:truthy
  schedule:
    # The matrix is linux-clang debug and release only. The slower job ran in
    # 2h54m on the last green run (2026-09-08, run 34218351651), so three hours
    # is the tightest interval that does not queue a run behind its predecessor.
    # The relevance-guard below skips runs when no code changed.
    - cron: '0 */3 * * *'
  push:
    tags:
      - '*'
  workflow_dispatch:

jobs:
  guard:
    name: relevance-guard
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check if code changed since last successful run
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "should_build=true" >> "$GITHUB_OUTPUT"
          if [[ "${{ github.event_name }}" != "schedule" ]]; then
            exit 0
          fi
          workflow_file=$(basename "${GITHUB_WORKFLOW_REF%%@*}")
          last_sha=$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow_file}/runs?branch=main&status=success&per_page=1" \
            --jq '.workflow_runs[0].head_sha // empty')
          if [[ -z "$last_sha" ]]; then
            echo "No prior successful run — building"
            exit 0
          fi
          if [[ "$last_sha" == "$GITHUB_SHA" ]]; then
            echo "No new commits since last run — skipping"
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          non_doc=$(git diff --name-only "$last_sha" "$GITHUB_SHA" \
            | { grep -vE '^(doc/|assets/|\.claude/|\.gemini/|projects/ores\.codegen/)' || true; } \
            | { grep -vE '\.(md|org)$' || true; } \
            | { grep -vE '^projects/([^/]*/)*modeling/' || true; })
          if [[ -n "$non_doc" ]]; then
            echo "Code changes found — building"
          else
            echo "Doc-only changes — skipping"
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: guard
    if: needs.guard.outputs.should_build == 'true'
    name: ${{matrix.family}}-${{matrix.compiler}}-${{matrix.buildtype}}-ninja
    concurrency:
      group: ci-${{github.ref}}-${{github.job}}-${{matrix.family}}-${{matrix.compiler}}-${{matrix.buildtype}}-ninja
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    environment: CI
    # The repository's default token is read-only; deleting the sccache entry
    # before saving its replacement needs actions: write.
    permissions:
      contents: read
      actions: write
    strategy:
      fail-fast: false
      matrix:
        name: [linux-clang]
        buildtype: [debug, release]
        include:
          - name: linux-clang
            family: linux
            compiler: clang
    steps:
      - name: Free disk space
        run: |
          echo "=== Disk space before cleanup ==="
          df -h
          # Language runtimes and SDKs not needed by this build
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/lib/jvm
          sudo rm -rf /home/linuxbrew/.linuxbrew
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /usr/share/miniconda
          sudo rm -rf /usr/share/miniconda3
          # Cloud CLIs
          sudo rm -rf /opt/az
          sudo rm -rf /opt/pipx/venvs/azure-cli
          sudo rm -rf /usr/lib/google-cloud-sdk
          sudo rm -rf /usr/share/google-cloud-sdk
          sudo rm -rf /usr/local/share/powershell
          # Browser bundles
          sudo rm -rf /usr/local/share/chromium
          sudo rm -rf /usr/local/share/chrome_beta
          sudo rm -rf /opt/google/chrome
          # Pre-installed toolchain caches we don't use
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /opt/hostedtoolcache/Ruby
          sudo rm -rf /opt/hostedtoolcache/node
          sudo rm -rf /opt/hostedtoolcache/go
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/local/lib/node_modules
          # Snap packages
          sudo snap remove lxd 2>/dev/null || true
          sudo rm -rf /var/cache/snapd
          # Docker images
          sudo docker image prune --all --force || true
          # apt cache
          sudo apt-get clean
          echo "=== Disk space after cleanup ==="
          df -h

      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # The disk cleanup above deletes the image's Node.js, and ores.web needs
      # npm. Without this step the component skips itself with a warning and the
      # build still reports success, so the TypeScript is never compiled here.
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Validate SQL Schema
        run: |
          pip install --quiet pystache
          ./projects/ores.sql/utility/validate_schemas.sh

      - name: Check every Boost header has a vcpkg port behind it
        # Boost arrives as per-library ports, so a new library compiles for
        # whoever added it and fails on a clean install with a missing header.
        # That turned every continuous build red at one translation unit on
        # 2026-09-28. This runs before the build so the failure names the port
        # in seconds instead of after twenty minutes of compiling.
        run: python3 build/scripts/check_boost_dependencies.py

      - name: Install Clang
        uses: KyleMayes/install-llvm-action@v2
        if: ${{ matrix.compiler == 'clang' }}
        with:
          version: "19"
          arch: x64

      - name: Restore sccache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.SCCACHE_DIR }}
          # Saves use a run-unique key, pruned to the newest entry per variant,
          # so restore by prefix and take that entry.
          #
          # The key is deliberately not scoped to this workflow. Continuous and
          # the Nightly Build compile the same variant with the same settings —
          # both pass code_coverage=1 on debug and neither passes anything on
          # release — so one entry serves both, and scoping it would store the
          # same objects twice. See nightly-linux.yml for the differences
          # between the two tiers and why none of them reaches a compile line.
          key: sccache-${{matrix.family}}-${{matrix.compiler}}-${{matrix.buildtype}}-ninja-${{ github.run_id }}
          restore-keys: |
            sccache-${{matrix.family}}-${{matrix.compiler}}-${{matrix.buildtype}}-ninja-

      - name: Ccache for gh actions
        uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          variant: sccache
          key: ${{matrix.family}}-${{matrix.compiler}}-${{matrix.buildtype}}-ninja
          max-size: 2500M
          save: false

      - name: Install dev packages
        run: ./projects/ores.compass/compass.sh env install-packages

      - name: Generate postgres password
        id: pg_password
        run: |
          PG_PASS="$(openssl rand -base64 24 | tr -dc 'a-zA-Z0-9')"
          echo "admin_password=${PG_PASS}" >> $GITHUB_OUTPUT
          echo "PGPASSWORD=${PG_PASS}" >> $GITHUB_ENV

      - name: Install PostgreSQL extensions
        run: |
          ./build/scripts/setup_postgres_extensions.sh --pg-version 18

      - name: Setup postgres
        uses: ikalnytskyi/action-setup-postgres@v8
        with:
          username: postgres
          password: ${{ steps.pg_password.outputs.admin_password }}
          database: oresdb
          port: 5432
          postgres-version: "18"
        id: postgres

      - name: Configure shared_preload_libraries
        run: |
          PGDATA="$RUNNER_TEMP/pgdata"
          echo "shared_preload_libraries = 'timescaledb'" >> "$PGDATA/postgresql.conf"
          pg_ctl restart --pgdata="$PGDATA" --wait

      - name: Init environment
        env:
          ORES_DATABASE_NAME: ores_ci
        run: |
          ./projects/ores.compass/compass.sh --no-deps env configure -y
          grep -v '^[[:space:]]*#' .env | grep -v '^[[:space:]]*$' \
            | grep -v 'ORES_IAM_SERVICE_JWT_PRIVATE_KEY' >> $GITHUB_ENV

      - name: Setup NATS server
        # Same setup on every CI platform: unpack the vendored nats-server
        # release (external/nats, pinned v2.14.3) and put it on PATH, so
        # every platform runs the same binary instead of its package
        # manager's version -- no brew, no apt, no GitHub download.
        run: ./build/scripts/setup_nats_server.sh

      - name: Start NATS server
        # env configure already generated the per-checkout TLS certs and
        # nats-<label>.conf (compass nats certs / compass nats init) --
        # start it with that config, matching local dev exactly, so tests
        # that need a live NATS (eventing integration tests) don't hang or
        # fail with a connection error.
        run: |
          nats_conf="$(ls build/config/nats-*.conf | head -n1)"
          nats-server --config "$nats_conf" &
          monitor_port="$(grep '^ORES_NATS_MONITOR_PORT=' .env | cut -d= -f2- | tr -d '"')"
          ready=false
          for i in $(seq 1 30); do
            if curl -sf "http://localhost:${monitor_port}/varz" > /dev/null; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != "true" ]; then
            echo "::error::nats-server did not become ready within 30s"
            exit 1
          fi

      - name: Setup Database
        run: |
          ./projects/ores.compass/compass.sh db recreate -y -D ores_ci

      - name: get-cmake
        uses: lukka/get-cmake@v4.4.4

      - name: Cache vcpkg binary packages
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/vcpkg-cache
          key: vcpkg-${{matrix.family}}-${{matrix.compiler}}-${{matrix.buildtype}}-ninja-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-${{matrix.family}}-${{matrix.compiler}}-${{matrix.buildtype}}-ninja-

      - name: run-vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          doNotCache: false

      - name: Run CTest workflow
        id: ctest
        # The job limit is 360 minutes. A job that reaches it is torn down about
        # thirty seconds later, which is nowhere near enough to upload a
        # multi-gigabyte compiler cache, so the cache steps below never finish.
        # Cap this step instead, leaving the rest of the job free for the cache
        # delete and save.
        timeout-minutes: 320
        run: |
          export CMAKE_BUILD_PARALLEL_LEVEL=$(nproc)
          export CTEST_PARALLEL_LEVEL=$(nproc)
          export PATH=${PATH}:/usr/sbin
          export ZIC=1
          export ORES_BUILD_PROVIDER="github"
          export ORES_BUILD_COMMIT="${GITHUB_SHA}"
          export ORES_BUILD_NUMBER="${GITHUB_RUN_NUMBER}"
          export ORES_BUILD_TIMESTAMP=`date "+%Y/%m/%d %H:%M:%S"`
          export preset=${{matrix.family}}-${{matrix.compiler}}-${{matrix.buildtype}}-ninja
          # Continuous proves the tree builds and the suites pass. The debug
          # build also collects coverage, so that Continuous and the Nightly
          # Build measure the same configuration; cpack belongs to the runs
          # that publish a package.
          export cmake_args="build_group=Continuous,preset=${preset},package=0"
          if [[ "${{matrix.buildtype}}" == "debug" ]]; then
              cmake_args="${cmake_args},code_coverage=1"
          fi
          ctest -VV --preset ${preset} --script "CTest.cmake,${cmake_args}"

      - name: Check the compiler cache is worth saving
        id: sccache_worth
        # A job that hits the six-hour limit is cancelled. The old guard,
        # !cancelled(), then skipped both steps below, so every object the run
        # compiled was thrown away and the cache could never warm: the next run
        # restored the same stale entry, missed, and timed out again. Run this
        # after any build that produced a cache worth keeping, and leave the
        # existing entry alone when it did not.
        if: ${{ always() && steps.ctest.outcome != 'skipped' }}
        run: |
          size_mb=$(du -sm "${SCCACHE_DIR}" 2>/dev/null | cut -f1)
          size_mb=${size_mb:-0}
          echo "local compiler cache: ${size_mb} MB"
          if [ "$size_mb" -ge 1000 ]; then
            echo "worth_saving=true" >> "$GITHUB_OUTPUT"
          else
            echo "worth_saving=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Show sccache statistics
        # Read before the cache is stopped: a stopped server reports nothing,
        # and these numbers are what says whether the cache is warming.
        # ccache-action installs sccache. If no build ran, it is absent, and
        # the statistics are not worth a second red step.
        if: ${{ always() && steps.ctest.outcome != 'skipped' }}
        run: sccache --show-stats

      - name: Stop the compiler cache
        # actions/cache tars the cache directory, and a tar that reads a file
        # while sccache writes it exits non-zero. actions/cache reports that tar
        # failure as a warning and still exits zero, so the Save step below
        # passes while storing nothing: the debug cache was not stored once in a
        # day of runs, and every step reported success. Stop the server first,
        # which flushes it and leaves the directory still.
        if: ${{ always() && steps.sccache_worth.outputs.worth_saving == 'true' }}
        run: sccache --stop-server || true

      - name: Save sccache
        id: save_sccache
        # The key is unique per run, so the save never collides, and it happens
        # before any pruning. A save that fails leaves the stored entries
        # untouched, where deleting first would have destroyed them.
        if: ${{ always() && steps.sccache_worth.outputs.worth_saving == 'true' }}
        uses: actions/cache/save@v6
        with:
          path: ${{ env.SCCACHE_DIR }}
          key: sccache-${{matrix.family}}-${{matrix.compiler}}-${{matrix.buildtype}}-ninja-${{ github.run_id }}

      - name: Prune older sccache entries
        # Saves use a run-unique key, so entries accumulate: two clang-debug runs
        # cost 5 GB of the 10 GB repository cap, and the gcc cache was evicted
        # for want of room. Drop every older entry of this variant now that the
        # new one is stored. This delete runs only after the new entry is really
        # there, so it cannot destroy the cache the way deleting first did.
        #
        # One entry per variant is the goal, and the Nightly Build prunes the
        # same prefix, so whichever tier runs last leaves the newest entry for
        # both. Keeping only this run's key is therefore right even though the
        # other tier may have stored the entry this one restored.
        #
        # The save step cannot be trusted for that: actions/cache turns a tar
        # that raced the cache into a warning and exits zero, so the step
        # reports success while storing nothing. Ask the cache service whether
        # this run's key exists instead, and prune nothing when it does not.
        if: ${{ always() && steps.sccache_worth.outputs.worth_saving == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prefix="sccache-${{matrix.family}}-${{matrix.compiler}}-${{matrix.buildtype}}-ninja-"
          keep="${prefix}${{ github.run_id }}"
          stored=$(gh api "/repos/${{ github.repository }}/actions/caches?per_page=100" \
            --jq '.actions_caches[].key' | grep -cxF "${keep}" || true)
          if [ "${stored}" -eq 0 ]; then
            echo "::error::${keep} was not stored, so the older entries are left alone."
            exit 1
          fi
          gh api "/repos/${{ github.repository }}/actions/caches?per_page=100" \
            --jq ".actions_caches[] | select(.key | startswith(\"${prefix}\")) | select(.key != \"${keep}\") | .id" \
          | while read -r id; do
              [ -n "$id" ] && gh api --method DELETE \
                "/repos/${{ github.repository }}/actions/caches/${id}" || true
            done
