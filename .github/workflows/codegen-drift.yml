---
name: Codegen drift
on:  # yamllint disable-line rule:truthy
  push:
    branches: ["main"]
    paths:
      - "projects/*/modeling/**"
      - "projects/ores.codegen/**"
      - "projects/ores.http/**"
      - "projects/ores.sql/create/**"
      - "projects/ores.sql/drop/**"
      - "projects/ores.sql/populate/**"
      - "projects/**/tests/**"
      - "doc/recipes/shell/**"
      - ".prettierrc.yaml"

  pull_request:
    branches: ["main"]
    paths:
      - "projects/*/modeling/**"
      - "projects/ores.codegen/**"
      - "projects/ores.http/**"
      - "projects/ores.sql/create/**"
      - "projects/ores.sql/drop/**"
      - "projects/ores.sql/populate/**"
      - "projects/**/tests/**"
      - "doc/recipes/shell/**"
      - ".prettierrc.yaml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Artefact drift: a generated file was hand-edited, or a model or
  # template changed and the components built from it were never
  # regenerated. check_component_drift.py regenerates the components under
  # test, the shared list in component_registry.py, and fails if the tree
  # moves.
  #
  # This guards a gap that template-drift.yml cannot see. That job
  # proves the .mustache artefacts match their org sources; it says
  # nothing about whether the code generated FROM those templates was
  # regenerated afterwards. Two template changes merged green through
  # review and CI while leaving 102 generated files behind, which is
  # the case this job exists to fail on.
  drift:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install codegen dependencies
        run: |
          pip install --quiet -r projects/ores.codegen/requirements.txt
      # Regeneration runs clang-format over its C++ output, so the
      # formatter has to be present or every generated C++ file reads as
      # drifted. The distro package is deliberate: it is the same
      # clang-format that nightly-format.yml uses to normalise the tree,
      # so both agree on what formatted means.
      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format
      # Regeneration also runs prettier over its TypeScript output, so the
      # formatter has to be present or every generated TypeScript file reads as
      # drifted. The version is read from the workspace rather than repeated
      # here: the drift gate compares bytes, so a prettier other than the one
      # projects/ores.web declares would format differently and report drift
      # that is not there.
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install prettier
        run: |
          version=$(node -p "require('./projects/ores.web/package.json').devDependencies.prettier")
          npm install --global "prettier@${version}"
      - name: Check generated output matches the models
        run: |
          python3 projects/ores.codegen/scripts/check_component_drift.py --all
      # The cross-component ER diagram, projects/ores.sql/modeling/
      # ores_schema.puml, is generated from the SQL tree by
      # projects/ores.codegen/src/plantuml_er_generate.py, but nothing
      # regenerated it: the committed diagram fell a month behind its own
      # generator while every gate stayed green. Its generator dry run is the
      # verdict the component clean standard's G07 item asks for, so the render
      # is re-run with --check, which compares the fresh render byte for byte
      # and writes nothing. The wrapper's stage 1 and 2 commands are repeated
      # rather than reached through plantuml_er_generate.sh because the wrapper
      # activates the local projects/ores.codegen/venv, which CI does not have;
      # this step uses the interpreter requirements.txt was installed into. No
      # plantuml render runs, so the diagram tool is not needed.
      - name: Check the ER diagram matches the SQL schema
        run: |
          python3 projects/ores.codegen/src/plantuml_er_parse_sql.py \
            --create-dir projects/ores.sql/create \
            --drop-dir projects/ores.sql/drop \
            --output build/output/codegen/plantuml_er_model.json \
            --ignore-file projects/ores.sql/utility/validation_ignore.txt \
            --warn
          python3 projects/ores.codegen/src/plantuml_er_generate.py \
            --model build/output/codegen/plantuml_er_model.json \
            --template projects/ores.codegen/library/templates/plantuml_er.mustache \
            --output projects/ores.sql/modeling/ores_schema.puml \
            --check
      # The drift step proves a committed file matches its model; it cannot see
      # a file the model asks for wrongly. A template that emits an index once
      # per column, and a comment PostgreSQL nests but never closes, both
      # regenerate faithfully and both fail a database recreation instead. This
      # is the same check Continuous Linux runs, moved to the pull request so
      # the defect does not reach main first.
      - name: Check the SQL tree for unterminated comments and repeated indexes
        run: |
          python3 projects/ores.sql/utility/check_sql_hygiene.py projects/ores.sql
      # Protocol twin coverage: every protocol header of a component under
      # test must have its *_protocol.ts twin, and no model may carry the
      # :ores.ts.protocol.enabled: opt-out. The drift step above proves a
      # committed file matches its model; it cannot see a header whose twin
      # was never generated, because both files are valid artefacts of the
      # same model. The components under test are the shared list in
      # component_registry.py; every other component is still to do.
      - name: Check every protocol header has a TypeScript twin
        run: |
          python3 projects/ores.codegen/scripts/check_protocol_twin_coverage.py

  # Model drift: an entity names a profile and then declares a feature
  # the profile fixes to another value, so the binding promises a
  # configuration the entity does not have. Reads the models only, so it
  # needs neither codegen nor a formatter.
  model:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Check models agree with the profiles they bind to
        run: |
          python3 projects/ores.codegen/scripts/check_model_drift.py --summary

  # Handler permissions: a generated handler checks
  # has_permission(req_ctx, "<code>"), and iam_permissions_populate.sql
  # decides who holds that code. A code no seed defines refuses every
  # caller, so the feature reads as broken rather than as unseeded. Reads
  # the generated headers and the seeds only, so it needs neither codegen
  # nor a formatter. Only the components whose seeds are complete are
  # checked; see the registry in the script.
  permissions:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Check every handler permission is seeded
        run: |
          python3 projects/ores.codegen/scripts/check_handler_permissions.py

  # Shell menu ownership: the shell's root refuses a second claim on a name at
  # startup, because cli::Menu answers a name by first match and two units that
  # share one silently shadow each other. This gate catches the same defect
  # before the shell is built, and it holds the invariant the runtime check
  # rests on: the shell reads a menu's name back through Menu::Prompt(), so
  # every menu must be constructed from its name alone. Reads the shell's
  # sources only, so it needs neither codegen nor a formatter.
  shell-menus:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Prove the check fails on a planted defect
        run: |
          python3 projects/ores.codegen/scripts/check_shell_menu_collisions.py --self-test
      - name: Check every shell menu name has one owner
        run: |
          python3 projects/ores.codegen/scripts/check_shell_menu_collisions.py

  # Route authentication: a route registered on the HTTP gateway must state
  # whether it needs a session. The builder refuses an undeclared route at
  # startup; this gate catches the same omission in CI, before the server is
  # ever run. Reads the C++ sources under projects/ores.http only, so it
  # needs neither codegen nor a formatter.
  route-auth:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Check every HTTP route states its authentication position
        run: |
          python3 projects/ores.codegen/scripts/check_route_auth_declarations.py

  # Shell recipe inventory: doc/recipes/shell/shell.org is derived from the
  # recipes under it, and a recipe that is not listed is invisible to a
  # reader browsing the inventory -- nothing else looks. The index had 97
  # entries for 122 recipes before this check existed. Reads the recipes and
  # the index only, so it needs neither codegen nor a formatter.
  #
  # The generated HTTP recipes have the same index and the same check, in a
  # document of their own: the curated http.org catalogues the hand-written
  # recipes that predate the facet, and regenerating it from filetags would
  # replace its headings.
  inventory:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Check the shell recipe inventory lists every recipe
        run: |
          python3 projects/ores.codegen/scripts/regenerate_shell_recipe_inventory.py --check
      - name: Check the generated HTTP recipe inventory lists every recipe
        run: |
          python3 projects/ores.codegen/scripts/regenerate_http_recipe_inventory.py --check

  # Accepted exceptions: a listed component may carry checklist items it does
  # not pass, and each is recorded in the registry with its reason and the
  # person who accepted it. Leaving the component unlisted until every item
  # passes is the alternative, and it withholds every gate from the component
  # in the meantime -- worse than running the gates and recording the gap. This
  # job is what stops the gap being an omission: an exception that names an
  # item the standard does not define, states no reason, names nobody or
  # carries no date fails here. It reads the registry and the standard only, so
  # it needs neither codegen nor a formatter.
  registry:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Check every accepted exception is well formed
        run: |
          python3 projects/ores.codegen/scripts/check_registry_exceptions.py

  # Test case reachability: a TEST_CASE inside a conditional compilation block
  # is deleted by the preprocessor when the condition is false. The translation
  # unit compiles, the link succeeds, ctest runs the suite and reports green,
  # and the only evidence is a case count that nothing compares against the
  # sources. The measured instance is the ores.service readiness suite: three
  # cases sat inside #if defined(BOOST_ASIO_HAS_LOCAL_SOCKETS), and the guard
  # preceded every boost::asio include, so the macro was never defined and the
  # file compiled to nothing. ctest reported 39 cases where the sources held 42,
  # and a clean-standard record cited that suite as coverage it did not have.
  #
  # The rule forbids the construct rather than detecting an instance, which is
  # what lets it run here: pre-processing each source with its own flags from
  # compile_commands.json would be exact, and this job has no C++ build. The
  # condition belongs inside the body, where the case registers and skips. It
  # reads the test sources only, so it needs neither codegen nor a formatter.
  reachability:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Check no test case sits inside a conditional block
        run: |
          python3 projects/ores.codegen/scripts/check_test_case_reachability.py

  # The codegen unit suite. The gates above prove the tree matches the
  # models; none of them says whether the code that reads the models, and
  # the code that checks them, still behave. A check that stops finding
  # anything passes every tree, which is why test_populate_references.py
  # is already run this way in populate-reference-drift.yml. This job runs
  # the whole suite instead of one module: the generator, the loader and
  # every check script. Linux only, like every other job here.
  tests:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install codegen dependencies
        run: |
          pip install --quiet -r projects/ores.codegen/requirements.txt
      # Two tests drive the regeneration path, which runs clang-format over
      # its C++ output and prettier over its TypeScript output. Both formatters
      # warn and do nothing when absent, so this is not strictly required, but
      # the suite should exercise the same path the drift job does.
      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install prettier
        run: |
          version=$(node -p "require('./projects/ores.web/package.json').devDependencies.prettier")
          npm install --global "prettier@${version}"
      - name: Run the codegen suite
        run: |
          python3 -m pytest projects/ores.codegen/tests -q
