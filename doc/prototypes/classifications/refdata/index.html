<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!--
  PROTOTYPE. Throwaway. Mock data from the Acme seed, no backend, no build step.

  Reference data's classification lists as an area: the area, the index of
  lists, one list, and one row with Details and History tabs. The bar at the
  bottom switches who is signed in; "Show what changed" lists what differs from
  the screen first built.
-->
<title>ORE Studio Reference data</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
/* Layout: the product's own shell — a header with the areas, one working column, and a prototype bar pinned below.
   Colour and type are the web app's tokens (projects/ores.web/packages/web/src/styles.css), so the prototype is judged
   on its words and structure rather than on a new look. The product is dark only, and so is this. */
:root {
  color-scheme: dark;
  --bg: #121214;
  --raised: #1a1a1e;
  --overlay: #26262b;
  --line-subtle: #21262d;
  --line: #30363d;
  --line-strong: #4a5568;
  --ink: #e3e3e6;
  --ink-muted: #a1a1aa;
  --ink-faint: #71717a;
  --ink-inverse: #0d1117;
  --accent: #58a6ff;
  --accent-bright: #8ab4f8;
  --accent-dim: #1b2a3d;
  --up: #3fb950;
  --up-strong: #238636;
  --down-strong: #da3633;
  --purple: #8957e5;
  --down: #f85149;
  --warn: #d29922;
  --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  --mono: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  --radius: 0.5rem;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { background: var(--bg); color: var(--ink); }
body { margin: 0; font: 14px/1.5 var(--sans); padding-bottom: 7rem; }
button, input, select { font: inherit; color: inherit; }
a { color: var(--accent); text-decoration: none; }
a:hover { color: var(--accent-bright); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { margin: 0; text-wrap: balance; font-weight: 600; letter-spacing: -0.01em; }
h1 { font-size: 1.375rem; }
h2 { font-size: 1rem; }
h3 { font-size: 0.875rem; }
p { margin: 0; }
.muted { color: var(--ink-muted); }
.faint { color: var(--ink-faint); }
.num { font-variant-numeric: tabular-nums; }

/* Header */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--raised); border-bottom: 1px solid var(--line); }
.top-inner { max-width: 72rem; margin: 0 auto; padding: 0.5rem 1rem; display: flex; align-items: center; gap: 1.25rem; flex-wrap: wrap; }
.brand { font-weight: 700; letter-spacing: 0.02em; display: flex; align-items: center; gap: 0.5rem; white-space: nowrap; }
.brand-mark { width: 1.25rem; height: 1.25rem; border-radius: 4px; background: linear-gradient(135deg, var(--accent), #1f6feb); }
.place { font-size: 12px; color: var(--ink-muted); border-left: 1px solid var(--line); padding-left: 1rem; white-space: nowrap; }
.menu { display: flex; gap: 0.25rem; flex-wrap: wrap; flex: 1; min-width: 0; }
.menu button { background: none; border: 0; padding: 0.375rem 0.625rem; border-radius: 6px; color: var(--ink-muted); cursor: pointer; }
.menu button:hover { background: var(--overlay); color: var(--ink); }
.menu button[aria-current="page"] { color: var(--ink); background: var(--overlay); }
.menu button.soon { color: var(--ink-faint); }
.me { display: flex; align-items: center; gap: 0.5rem; background: none; border: 1px solid transparent; border-radius: 999px; padding: 0.125rem 0.625rem 0.125rem 0.125rem; cursor: pointer; }
.me:hover { border-color: var(--line); }
.avatar { width: 1.75rem; height: 1.75rem; border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-weight: 700; background: var(--accent-dim); color: var(--accent-bright); }
.me-menu { position: absolute; right: 1rem; top: 3.25rem; width: 16rem; background: var(--overlay); border: 1px solid var(--line); border-radius: var(--radius); padding: 0.5rem; box-shadow: 0 12px 32px rgba(0,0,0,0.45); }
.me-menu .who { padding: 0.5rem; border-bottom: 1px solid var(--line); margin-bottom: 0.25rem; }
.me-menu button { display: block; width: 100%; text-align: left; background: none; border: 0; padding: 0.4rem 0.5rem; border-radius: 6px; cursor: pointer; }
.me-menu button:hover { background: var(--raised); }

/* Page */
main { max-width: 72rem; margin: 0 auto; padding: 1.5rem 1rem; display: grid; gap: 1.5rem; }
.crumbs { font-size: 12px; color: var(--ink-faint); display: flex; gap: 0.375rem; flex-wrap: wrap; }
.crumbs button { background: none; border: 0; padding: 0; color: var(--accent); cursor: pointer; }
.head { display: flex; align-items: flex-end; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
.head > div { min-width: 0; display: grid; gap: 0.25rem; }
.actions { display: flex; gap: 0.5rem; flex-wrap: wrap; }
.btn { border: 1px solid var(--line); background: var(--raised); padding: 0.4375rem 0.875rem; border-radius: 6px; cursor: pointer; white-space: nowrap; }
.btn:hover { border-color: var(--line-strong); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #0d1117; font-weight: 600; }
.btn.primary:hover { background: var(--accent-bright); border-color: var(--accent-bright); }
.btn.danger { color: var(--down); }
.btn.danger.solid { background: #b62324; border-color: #b62324; color: #fff; }
.btn[disabled] { opacity: 0.45; cursor: not-allowed; }
.card { background: var(--raised); border: 1px solid var(--line); border-radius: var(--radius); }
.pad { padding: 1.25rem; }
.grid { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fit, minmax(15rem, 1fr)); }
.stat { display: grid; gap: 0.25rem; }
.stat .big { font-size: 1.75rem; font-weight: 600; font-variant-numeric: tabular-nums; }
.stat .label { font-size: 12px; color: var(--ink-muted); text-transform: uppercase; letter-spacing: 0.06em; }
.list { display: grid; }
.row { display: flex; align-items: center; gap: 0.75rem; padding: 0.75rem 1.25rem; border-top: 1px solid var(--line-subtle); }
.row:first-child { border-top: 0; }
.row > .grow { flex: 1; min-width: 0; }
.dot { width: 0.5rem; height: 0.5rem; border-radius: 50%; flex: none; }
.dot.ok { background: var(--up); } .dot.warn { background: var(--warn); } .dot.bad { background: var(--down); } .dot.idle { background: var(--ink-faint); }
.chip { display: inline-flex; align-items: center; gap: 0.3rem; font-size: 11px; padding: 0.0625rem 0.5rem; border-radius: 999px; border: 1px solid var(--line); color: var(--ink-muted); white-space: nowrap; }
.chip { font-weight: 600; }
.chip.production { color: #0d1117; border-color: var(--accent); background: var(--accent); }
.chip.evaluation { color: #fff; border-color: var(--purple); background: var(--purple); }
.chip.automation { color: var(--ink-muted); border-color: var(--line-strong); background: var(--overlay); }
.chip.active { color: #fff; border-color: var(--up-strong); background: var(--up-strong); }
.chip.suspended { color: #1a1300; border-color: var(--warn); background: var(--warn); }
.chip.setting-up { color: #0d1117; border-color: var(--accent-bright); background: var(--accent-bright); }
.chip.failed { color: #fff; border-color: var(--down-strong); background: var(--down-strong); }
.chip.view { color: var(--ink-muted); font-weight: 500; }
.section-title { font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-faint); }
.tiles { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fill, minmax(14rem, 1fr)); }
.tile { text-align: left; background: var(--raised); border: 1px solid var(--line); border-radius: var(--radius); padding: 1rem; cursor: pointer; display: grid; gap: 0.375rem; align-content: start; }
.tile:hover { border-color: var(--line-strong); }
.tile.soon { cursor: default; opacity: 0.7; }
.tile.soon:hover { border-color: var(--line); }
.tile .t { font-weight: 600; }

/* Health */
.health { display: grid; gap: 1.5rem; grid-template-columns: repeat(auto-fit, minmax(12rem, 1fr)); align-items: start; }
.verdict { display: flex; gap: 0.75rem; align-items: center; }
.verdict .mark { width: 2.25rem; height: 2.25rem; border-radius: 50%; display: grid; place-items: center; flex: none; font-weight: 700; }
.verdict.ok .mark { background: #12361d; color: var(--up); border: 1px solid #1f5d2b; }
.verdict.warn .mark { background: #3a2a0a; color: var(--warn); border: 1px solid #6b4e12; }
.activity { border-left: 2px solid var(--up-strong); padding-left: 0.75rem; display: grid; gap: 0.5rem; font-size: 13px; }
.activity .when { font-size: 12px; color: var(--ink-faint); }

/* Tables */
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; font-weight: 500; color: var(--ink-muted); font-size: 12px; padding: 0.625rem 0.75rem; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 0.625rem 0.75rem; border-bottom: 1px solid var(--line-subtle); vertical-align: middle; }
tbody tr { cursor: pointer; }
tbody tr:hover { background: #1f1f24; }
tbody tr[aria-selected="true"] { background: var(--accent-dim); }
td.code { font-family: var(--mono); font-size: 12px; color: var(--ink-muted); }
.toolbar { display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: center; padding: 0.75rem; border-bottom: 1px solid var(--line); }
.toolbar input[type=search], .toolbar select, .field input, .field select { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 0.375rem 0.625rem; }
.toolbar input[type=search] { flex: 1; min-width: 10rem; }
.toolbar label { display: inline-flex; gap: 0.375rem; align-items: center; color: var(--ink-muted); font-size: 13px; }
.foot { display: flex; justify-content: space-between; align-items: center; gap: 0.75rem; padding: 0.625rem 0.75rem; font-size: 12px; color: var(--ink-muted); flex-wrap: wrap; }
.progress { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; width: 6rem; }
.progress > span { display: block; height: 100%; background: var(--accent); }

/* Tabs */
.tabs { display: flex; gap: 0.25rem; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.tabs button { background: none; border: 0; border-bottom: 2px solid transparent; padding: 0.5rem 0.75rem; color: var(--ink-muted); cursor: pointer; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
dl { display: grid; grid-template-columns: repeat(auto-fit, minmax(12rem, 1fr)); gap: 1rem; margin: 0; }
dt { font-size: 12px; color: var(--ink-faint); }
dd { margin: 0.125rem 0 0; }

/* Dialog */
.scrim { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: grid; place-items: center; padding: 1rem; z-index: 20; }
.dialog { width: min(32rem, 100%); background: var(--raised); border: 1px solid var(--line); border-radius: var(--radius); padding: 1.25rem; display: grid; gap: 1rem; }
.field { display: grid; gap: 0.375rem; }
.field label { font-size: 13px; color: var(--ink-muted); }
.field input, .field select { width: 100%; }
.form-grid { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fit, minmax(14rem, 1fr)); }
.warnbox { border: 1px solid #7a2a28; background: #2a1414; border-radius: 6px; padding: 0.75rem; color: #ffb4ad; font-size: 13px; }
.note { border: 1px solid var(--line); background: var(--bg); border-radius: 6px; padding: 0.75rem; font-size: 13px; color: var(--ink-muted); }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: 6.5rem; background: var(--overlay); border: 1px solid var(--line); padding: 0.5rem 1rem; border-radius: 6px; z-index: 30; }

/* Prototype bar */
.proto { position: fixed; left: 0; right: 0; bottom: 0; background: #0b0b0d; border-top: 1px dashed var(--line-strong); padding: 0.5rem 1rem calc(0.5rem + env(safe-area-inset-bottom, 0px)); z-index: 10; }
.proto-inner { max-width: 72rem; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 0.5rem 1rem; align-items: center; font-size: 12px; color: var(--ink-faint); }
.proto strong { color: var(--warn); letter-spacing: 0.06em; }
.proto .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.proto .seg button { background: none; border: 0; padding: 0.25rem 0.625rem; color: var(--ink-muted); cursor: pointer; }
.proto .seg button[aria-pressed="true"] { background: var(--overlay); color: var(--ink); }
.proto .why { margin-left: auto; background: none; border: 1px solid var(--line); border-radius: 6px; padding: 0.25rem 0.625rem; color: var(--ink-muted); cursor: pointer; }
.proto .why[aria-pressed="true"] { background: var(--overlay); color: var(--ink); border-color: var(--line-strong); }
.why-head { display: flex; justify-content: space-between; align-items: center; gap: 0.5rem; }
.why-close { background: none; border: 1px solid var(--line); border-radius: 6px; padding: 0.125rem 0.5rem; color: var(--ink-muted); cursor: pointer; }
.why-panel { position: fixed; right: 1rem; bottom: 4.5rem; width: min(26rem, calc(100% - 2rem)); max-height: 60vh; overflow: auto; background: var(--overlay); border: 1px solid var(--line); border-radius: var(--radius); padding: 1rem; z-index: 15; font-size: 13px; display: grid; gap: 0.625rem; }
.why-panel ul { margin: 0; padding-left: 1.1rem; display: grid; gap: 0.375rem; color: var(--ink-muted); }
@media (prefers-reduced-motion: no-preference) { .tile, .btn, tbody tr { transition: border-color .15s, background .15s; } }
@media (max-width: 40rem) { .place { display: none; } .hide-sm { display: none; } }

.head > .actions { display: flex; align-items: center; }
.toggle { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.toggle button { background: none; border: 0; padding: 0.375rem 0.75rem; color: var(--ink-muted); cursor: pointer; }
.toggle button[aria-pressed="true"] { background: var(--overlay); color: var(--ink); }
/* Classifications */
.topics { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fill, minmax(17rem, 1fr)); align-items: start; }
.topic h2 { padding: 0.875rem 1.25rem 0.25rem; font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-faint); font-weight: 600; }
.topic .row { cursor: pointer; padding: 0.5rem 1.25rem; }
.topic .row:hover { background: #1f1f24; }
.count { color: var(--ink-faint); font-size: 12px; font-variant-numeric: tabular-nums; }
mark.hit { background: var(--accent-dim); color: var(--accent-bright); border-radius: 2px; }
.reorder td.grip { color: var(--ink-faint); width: 5.5rem; white-space: nowrap; }
.reorder .mv { background: none; border: 1px solid var(--line); border-radius: 4px; padding: 0 0.4rem; cursor: pointer; color: var(--ink-muted); }
.reorder .mv[disabled] { opacity: 0.3; cursor: default; }
.reorder tbody tr { cursor: default; }
.banner { display: flex; gap: 0.75rem; align-items: center; justify-content: space-between; flex-wrap: wrap; border: 1px solid #6b4e12; background: #2a2008; color: #f2cc60; border-radius: 6px; padding: 0.625rem 0.875rem; font-size: 13px; }
.ro { border: 1px solid var(--line); background: var(--bg); border-radius: 6px; padding: 0.625rem 0.875rem; font-size: 13px; color: var(--ink-muted); }
/* History */
.history { display: grid; grid-template-columns: minmax(14rem, 18rem) 1fr; gap: 0; }
@media (max-width: 48rem) { .history { grid-template-columns: 1fr; } }
.versions { border-right: 1px solid var(--line); }
.version { display: grid; gap: 0.125rem; padding: 0.625rem 1rem; border-top: 1px solid var(--line-subtle); cursor: pointer; text-align: left; background: none; border-left: 0; border-right: 0; border-bottom: 0; width: 100%; }
.version:first-child { border-top: 0; }
.version:hover { background: #1f1f24; }
.version[aria-selected="true"] { background: var(--accent-dim); }
.version .v { font-weight: 600; display: flex; gap: 0.5rem; align-items: center; }
.compare { padding: 1rem 1.25rem; display: grid; gap: 0.875rem; align-content: start; }
.compare-head { display: flex; justify-content: space-between; gap: 0.75rem; flex-wrap: wrap; align-items: flex-start; }
.why-line { font-size: 13px; color: var(--ink-muted); }
.diff { display: grid; gap: 1px; font-size: 13px; }
.diff .line { display: grid; grid-template-columns: 1.25rem 1fr; padding: 0.125rem 0.5rem; border-radius: 3px; }
.diff .line .sign { color: var(--ink-faint); user-select: none; }
.diff .old { background: rgba(248, 81, 73, 0.15); }
.diff .new { background: rgba(46, 160, 67, 0.15); }
.diff .old mark { background: rgba(248, 81, 73, 0.45); color: inherit; border-radius: 2px; }
.diff .new mark { background: rgba(46, 160, 67, 0.45); color: inherit; border-radius: 2px; }
tr.changed td:first-child { box-shadow: inset 3px 0 0 var(--warn); }
.reason-chip { display: inline-block; font-family: var(--mono); font-size: 11px; padding: 0.0625rem 0.5rem; border-radius: 4px; background: #3a2a0a; color: #f2cc60; border: 1px solid #6b4e12; }
.note-line { font-style: italic; color: #b3a6e6; font-size: 12px; }
.compare-pick { display: inline-flex; gap: 0.375rem; align-items: center; font-size: 13px; color: var(--ink-muted); }
.compare-pick select { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 0.25rem 0.5rem; }
.check { display: flex; gap: 0.375rem; align-items: center; font-size: 12px; color: var(--ink-faint); }
td.unchanged { color: var(--ink-faint); }
</style>
</head>

iption": "Book is open and accepting new trades.", "displayOrder": 1}, {"code": "Closed", "name": "Closed", "description": "Book is closed. Existing trades remain but no new trades are allowed.", "displayOrder": 2}, {"code": "Frozen", "name": "Frozen", "description": "Book is frozen. No modifications allowed including new trades or amendments.", "displayOrder": 3}], "label": "Book statuses", "brief": "Lifecycle states for book records."}, {"key": "book-purpose-type", "topic": "books", "shape": "named", "editable": true, "total": 9, "rows": [{"code": "Trading", "name": "Trading", "description": "Ordinary trading book: market-making, arbitrage, and client-facing risk-taking. The default purpose for a book that does not play one of the specialised roles below.", "displayOrder": 1}, {"code": "Reserve", "name": "Reserve", "description": "Holds risk retained by the desk rather than passed on -- e.g. residual risk after a hedge, or a deliberate risk-warehousing position.", "displayOrder": 2}, {"code": "Funding", "name": "Funding", "description": "Books the short-term funding/liquidity trades (e.g. the funding process) that keep the desk's cash and collateral positions square.", "displayOrder": 3}, {"code": "Wash", "name": "Wash", "description": "Routes offsetting back-to-back trades to a designated risk book so client-facing books stay flat; see the paired risk-book link.", "displayOrder": 4}, {"code": "WriteOff", "name": "Write-off", "description": "Holds positions/balances that have been written off and no longer represent live risk, kept for audit trail rather than active management.", "displayOrder": 5}, {"code": "Test", "name": "Test", "description": "Non-production book used for testing booking flows, integrations, or training -- never carries real risk.", "displayOrder": 6}, {"code": "Sales", "name": "Sales", "description": "Books sales-credit or client-relationship-tracking entries that are not themselves risk-bearing trading activity.", "displayOrder": 7}, {"code": "SweepTarget", "name": "Sweep target", "description": "The single central book that receives spot-sweep transfers from sweepable books; owned by Treasury, realises trading P&L. Not combinable with Remittance target.", "displayOrder": 8}, {"code": "RemittanceTarget", "name": "Remittance target", "description": "The single central book that receives central-remittance transfers; owned by Finance, balance-sheet-only (no trading P&L). Not combinable with Sweep target.", "displayOrder": 9}], "label": "Book purposes", "brief": "The risk role a book plays: what kind of trading/operational activity happens in it."}, {"key": "ledger-feed-type", "topic": "books", "shape": "named", "editable": true, "total": 3, "rows": [{"code": "None", "name": "None", "description": "The book's ledger balance is not fed from any source book -- the default for a book with no ledger connection.", "displayOrder": 1}, {"code": "Automatic", "name": "Automatic", "description": "The book's ledger balance is fed by an automated ledger process.", "displayOrder": 2}, {"code": "Manual", "name": "Manual", "description": "The book's ledger balance is fed by manual entry.", "displayOrder": 3}], "label": "Ledger feed types", "brief": "How a book's ledger balance is fed: not fed, automatically, or manually."}, {"key": "regulatory-book-type", "topic": "books", "shape": "named", "editable": true, "total": 2, "rows": [{"code": "Trading", "name": "Trading Book", "description": "Held with trading intent (market-making, arbitrage, hedging other trading book positions). Marked to market daily; subject to FRTB market risk capital.", "displayOrder": 1}, {"code": "Banking", "name": "Banking Book", "description": "Held to maturity or for balance-sheet management. Accrual-accounted; subject to credit risk capital (plus a market risk charge on FX/commodity exposure).", "displayOrder": 2}], "label": "Regulatory book types", "brief": "Basel III/IV FRTB trading book / banking book classification."}, {"key": "purpose-type", "topic": "books", "shape": "named", "editable": true, "total": 4, "rows": [{"code": "Risk", "name": "Risk", "description": "Portfolio used for risk aggregation and risk management reporting.", "displayOrder": 1}, {"code": "Regulatory", "name": "Regulatory", "description": "Portfolio used for regulatory capital and compliance reporting.", "displayOrder": 2}, {"code": "ClientReporting", "name": "Client Reporting", "description": "Portfolio used for client-facing reporting and statements.", "displayOrder": 3}, {"code": "Internal", "name": "Internal", "description": "Portfolio used for internal management reporting and P&L attribution.", "displayOrder": 4}], "label": "Portfolio purposes", "brief": "Classification of portfolio purpose."}, {"key": "asset-class-code", "topic": "products", "shape": "named", "editable": true, "total": 7, "rows": [{"code": "fx", "name": "FX", "description": "Foreign exchange: instruments whose value derives from the exchange rate between two currencies. Covers FX spot, forwards, swaps, and vanilla/exotic options, along with the market data that prices them -- spot rates, forward points, and volatility surfaces quoted by currency pair. FX is unique among asset classes in that every trade inherently involves two currencies rather than one underlying, which is why FX risk shows up as a cross-cutting concern in every other asset class (a USD-denominated equity option still carries FX risk for a EUR-based book).", "displayOrder": 1}, {"code": "interest_rates", "name": "Interest Rate", "description": "Interest rate products: instruments whose value derives from the level or shape of a yield curve for a given currency and index (e.g. USD SOFR, EUR ESTR). Covers deposits, forward rate agreements, interest rate swaps and swaptions, caps/floors, and cross-currency swaps, together with the curve-construction market data -- discount factors, zero rates, and forward rates bootstrapped from quoted instruments at standard tenors. Interest rates is typically the first curve built in any pricing pipeline, since discounting and forward-rate projection for every other asset class ultimately depends on it.", "displayOrder": 2}, {"code": "credit", "name": "Credit", "description": "Credit risk products: instruments whose value derives from the likelihood and severity of an issuer or reference entity defaulting on its obligations. Covers credit default swaps (single-name and index), credit-linked notes, and the underlying market data -- CDS spreads, hazard rate curves bootstrapped from those spreads, and assumed recovery rates. Credit curves are quoted per reference entity (or index series) and are combined with a rates curve to produce risky discount factors for defaultable cashflows.", "displayOrder": 3}, {"code": "equity", "name": "Equity", "description": "Equity products: instruments whose value derives from the price of a single stock, a basket of stocks, or an equity index. Covers equity spot and forward positions, vanilla and exotic equity options (including barrier, Asian, and variance-swap structures), and the associated market data -- spot prices, dividend yield curves, and implied volatility surfaces quoted by strike and expiry. Equity derivatives pricing typically layers a dividend/borrow-cost forward curve and a volatility surface on top of the rates discount curve.", "displayOrder": 4}, {"code": "commodity", "name": "Commodity", "description": "Commodity products: instruments whose value derives from the price of a physical commodity (energy, metals, agriculturals) or a commodity index/future. Covers commodity forwards, swaps, and options (including Asian and spread structures), and the associated market data -- forward curves (which, unlike FX or rates, are often in backwardation or contango driven by storage cost and convenience yield rather than pure interest-rate parity) and volatility surfaces per delivery point/contract month.", "displayOrder": 5}, {"code": "inflation", "name": "Inflation", "description": "Inflation-linked products: instruments whose value derives from a published price index (e.g. US CPI, UK RPI/CPI, EU HICP). Covers zero-coupon and year-on-year inflation swaps, inflation caps/floors, and inflation-linked bonds, together with the associated market data -- the inflation fixing/index curve (historical and forward-projected, with a seasonality adjustment for the index's known within-year pattern) and inflation volatility surfaces. Inflation curves are built and discounted against the nominal rates curve for the same currency.", "displayOrder": 6}, {"code": "bond", "name": "Bond", "description": "Bond products: fixed-income securities that pay a defined schedule of coupons and a principal redemption, whose value derives from a discount curve plus an issuer-specific credit/liquidity spread. Covers vanilla fixed and floating-rate bonds, callable/convertible bonds, and bond futures/options, together with the associated market data -- clean/dirty prices, yield-to-maturity, and issuer spread curves quoted over the risk-free (or asset-swap) curve. Government bonds are also a primary source instrument for bootstrapping the risk-free rates curve itself.", "displayOrder": 7}], "label": "Asset classes", "brief": "The top-level product asset class taxonomy."}, {"key": "leg-type", "topic": "products", "shape": "plain", "editable": false, "total": 0, "rows": [], "label": "Leg types", "brief": "ORE leg type code (e.g. Fixed, Floating, OIS, CMS, CPI)."}, {"key": "floating-index-type", "topic": "products", "shape": "plain", "editable": false, "total": 32, "rows": [{"code": "AUD-AONIA", "name": "", "description": "AONIA (RBA Cash Rate overnight index)", "displayOrder": null}, {"code": "CAD-CORRA", "name": "", "description": "Canadian Overnight Repo Rate Average (CORRA)", "displayOrder": null}, {"code": "CHF-SARON", "name": "", "description": "Swiss Average Rate Overnight (SARON)", "displayOrder": null}, {"code": "CNY-SHIBOR-ON", "name": "", "description": "Shanghai In actions", "brief": "Day count fraction convention code (e.g. Actual/360, Actual/365, 30/360)."}, {"key": "curve-role", "topic": "products", "shape": "named", "editable": true, "total": 0, "rows": [], "label": "Curve roles", "brief": "Instrument classification for curve-role derivation: deposit, fra, swap, or none."}, {"key": "tenor-kind", "topic": "tenors", "shape": "named", "editable": true, "total": 2, "rows": [{"code": "PERIOD", "name": "Period", "description": "Regular nD/nW/nM/nY duration with a fixed offset from the convention's anchor.", "displayOrder": 1}, {"code": "SPECIAL", "name": "Special", "description": "Label with no fixed offset (e.g. O/N, SPOT, TODAY), resolved by rule per convention.", "displayOrder": 2}], "label": "Tenor kinds", "brief": "Whether a tenor's duration is a fixed period or resolved by special, convention-specific rule."}, {"key": "tenor-unit", "topic": "tenors", "shape": "named", "editable": true, "total": 5, "rows": [{"code": "DAY", "name": "Day", "description": "Period unit measured in days.", "displayOrder": 1}, {"code": "WEEK", "name": "Week", "description": "Period unit measured in weeks.", "displayOrder": 2}, {"code": "MONTH", "name": "Month", "description": "Period unit measured in months.", "displayOrder": 3}, {"code": "YEAR", "name": "Year", "description": "Period unit measured in years.", "displayOrder": 4}, {"code": "NONE", "name": "None", "description": "Sentinel for SPECIAL tenors, which have no fixed unit/multiplier of their own.", "displayOrder": 5}], "label": "Tenor units", "brief": "Period unit for a PERIOD tenor's nD/nW/nM/nY duration, or NONE for a SPECIAL tenor with no fixed offset."}, {"key": "tenor-anchor", "topic": "tenors", "shape": "ordered", "editable": true, "total": 6, "rows": [{"code": "SPOT", "name": "", "description": "Horizon date plus spot days (currency-pair specific).", "displayOrder": 10}, {"code": "TODAY", "name": "", "description": "The horizon date itself.", "displayOrder": 20}, {"code": "TOMORROW", "name": "", "description": "Horizon date plus one calendar day.", "displayOrder": 30}, {"code": "NEAR_LEG", "name": "", "description": "The near-leg date of a short-dated FX swap; not a fixed offset from the horizon date.", "displayOrder": 40}, {"code": "IMM_ROLL", "name": "", "description": "The nearest IMM quarterly roll date; used by the IMM_ROLL resolution algorithm, not a fixed-offset anchor.", "displayOrder": 50}, {"code": "NONE", "name": "", "description": "Sentinel for a tenor convention with no default anchor (every tenor under it carries its own anchor_override, or its resolution_algorithm does not use a fixed anchor at all).", "displayOrder": 60}], "label": "Tenor anchors", "brief": "Reference point (spot, today, tomorrow, near leg, IMM roll) a tenor convention resolves tenors from."}, {"key": "tenor-resolution-algorithm", "topic": "tenors", "shape": "named", "editable": true, "total": 2, "rows": [{"code": "ANCHOR_OFFSET", "name": "Anchor Offset", "description": "Anchor date plus a fixed day/week/month/year offset.", "displayOrder": 1}, {"code": "SCHEDULE_STEP", "name": "Schedule Step", "description": "Anchor plus a calendar offset, then n steps along a named tenor_schedule axis (story Decision D2).", "displayOrder": 2}], "label": "Tenor resolution algorithms", "brief": "How a tenor convention resolves a tenor's anchor/offset — fixed anchor offset vs IMM-quarter roll."}, {"key": "derivation-kind", "topic": "market-data", "shape": "named", "editable": true, "total": 0, "rows": [], "label": "Derivation kinds", "brief": "Classifies a market_series as directly observed or derived by a named mechanism."}, {"key": "series-subclass-code", "topic": "market-data", "shape": "named", "editable": true, "total": 18, "rows": [{"code": "spot", "name": "Spot", "description": "Price of the underlying for immediate or near-immediate delivery: an FX rate, an equity price, a commodity price. The series has no tenor dimension of its own, so each observation names the single point SPOT. FX spot is the canonical case (FX/RATE/EUR/USD), and it is the series that the forward and option series in the same book ultimately reference.", "displayOrder": 1}, {"code": "forward", "name": "Forward", "description": "Price or rate for delivery on a future date. Covers FX forwards and forward points, equity forwards and dividend curves, and commodity forward curves. Unlike spot, a forward series is a curve: each observation names its tenor in point_id, and the value is only meaningful together with that tenor.", "displayOrder": 2}, {"code": "volatility", "name": "Volatility", "description": "Implied volatility quoted on a curve or surface. Covers FX option surfaces, swaption and cap/floor surfaces, and equity and commodity option surfaces. This is the widest subclass: a surface has two coordinates (expiry and strike) where a curve has one, and the point_id encoding is not shared across the asset classes that use it.", "displayOrder": 3}, {"code": "yield", "name": "Yield", "description": "Yield, zero rate, or discount factor curve. The rates-side workhorse: money-market and deposit curves, zero curves, discount curves, and bootstrapped swap curves all land here. Always curve-shaped, always per currency or per currency and index, with point_id naming the pillar. A published index fixing is not a curve and does not belong here; it is an index_fixing.", "displayOrder": 4}, {"code": "basis", "name": "Basis", "description": "Basis spread curve: the difference between two otherwise comparable curves. Covers basis swaps and BMA/SIFMA swaps. A basis quote is meaningful only relative to the two legs it spans, so the qualifier carries both reference names rather than one currency.", "displayOrder": 5}, {"code": "fra", "name": "FRA", "description": "Forward rate agreement and money-market futures curve: the short end of the rates market, quoted as a rate over a forward period rather than as a discount factor.", "displayOrder": 6}, {"code": "xccy", "name": "Cross-Currency Basis", "description": "Cross-currency basis swap curve: the spread paid on one currency leg of a currency swap against that currency's own floating index. It is the curve that makes cross-currency discounting differ from single-currency discounting.", "displayOrder": 7}, {"code": "spread", "name": "Spread", "description": "Credit spread or hazard rate curve per reference entity, and the bond spread quoted over a risk-free or asset-swap curve. Values are quotes in basis points rather than prices.", "displayOrder": 8}, {"code": "index_credit", "name": "Index Credit", "description": "Credit default swap index series and index options: a basket of single-name credit risk traded as one instrument.", "displayOrder": 9}, {"code": "recovery", "name": "Recovery Rate", "description": "Recovery rate assumed on a reference entity in the event of default, per seniority and currency. Scalar per entity, and an input to the hazard-rate bootstrap rather than a traded quote in its own right.", "displayOrder": 10}, {"code": "swap", "name": "Inflation Swap", "description": "Inflation swap curve: zero-coupon or year-on-year, quoted per inflation index. Meaningful only alongside a nominal discounting curve and the index's own fixing history.", "displayOrder": 11}, {"code": "capfloor", "name": "Cap/Floor", "description": "Inflation cap and floor volatility surface: implied volatility on an option on an inflation index, zero-coupon or year-on-year, quoted by strike and expiry. The inflation counterpart of swap; the nominal rates cap/floor and swaption surfaces belong to volatility.", "displayOrder": 12}, {"code": "seasonality", "name": "Seasonality", "description": "Seasonality adjustment factor: the within-year multiplicative pattern that a headline annual figure does not show. Covers inflation seasonality, the monthly adjustment applied to a price index, and commodity shape profiles, which spread an annual power or gas forward price across the delivery period's peak and off-peak hours. A per-period adjustment rather than a traded quote.", "displayOrder": 13}, {"code": "price", "name": "Price", "description": "Bond price, clean or dirty, quoted per bond or per benchmark issue. The bond asset class's primary observed market data, alongside yield-to-maturity.", "displayOrder": 14}, {"code": "correlation", "name": "Correlation", "description": "Correlation matrix entry across underlyings, currencies, or credit names. Referenced by multi-asset and cross-currency structures whose payoff depends on the joint behaviour of two or more underlyings. Kept in the taxonomy even though no single asset class owns it, because ORE emits correlation market data and an import carrying it must have a home.", "displayOrder": 15}, {"code": "prepayment", "name": "Prepayment", "description": "Conditional prepayment rate: the rate at which borrowers repay a mortgage or callable debt ahead of schedule. Quoted per pool or per instrument, and a primary input to the valuation of mortgage-backed and callable structures, where the timing of the cashflows is uncertain rather than their amount. Unlike recovery, which is a loss given default, prepayment is an assumption about early redemption.", "displayOrder": 16}, {"code": "transition_probability", "name": "Transition Probability", "description": "Probability that a rated entity moves between two credit ratings, or defaults, over a stated horizon. Quoted per rating provider and per pair of ratings, and read as a matrix rather than a single curve. It is the ratings-basis alternative to a hazard rate curve: both describe the likelihood of default, but a transition matrix also models migration between the non-default states.", "displayOrder": 17}, {"code": "index_fixing", "name": "Index Fixing", "description": "Published reference rate for one index on one date, such as a money-market fixing or an inflation print. One value per date and no pillars, which is what separates it from yield: an index fixing is observed, not bootstrapped, and a curve is built from a history of them rather than the other way round. The index is named in the qualifier.", "displayOrder": 18}], "label": "Series subclasses", "brief": "Fine-grained market series subclass taxonomy (spot, forward, volatility, yield, basis, fra, xccy, spread, index_credit, recovery, swap, capfloor, seasonality, price, correlation)."}];

  /* History lives here: every row starts at version 1, written by the seed. A few rows carry later versions so the
     History tab has something to compare on first open; any edit made in the prototype adds another. */
  const history = {};
  function fieldsOf(list, row) {
    const f = [['Code', row.code]];
    if (list.shape === 'named') f.push(['Name', row.name]);
    f.push(['Description', row.description]);
    if (list.shape !== 'plain') f.push(['Display order', row.displayOrder == null ? '' : String(row.displayOrder)]);
    return f;
  }
  function historyOf(list, row) {
    const key = list.key + '/' + row.code;
    if (!history[key]) {
      history[key] = [{ version: 1, by: 'ores_iam_service', performed: 'ores_refdata_service', at: '2026-10-04 22:48', reason: 'system.new_record', note: 'Seeded with the tenant', fields: fieldsOf(list, row) }];
    }
    return history[key];
  }
  function seedHistory() {
    const fiat = find('monetary-nature', 'fiat');
    if (fiat) {
      const h = historyOf(list('monetary-nature'), fiat);
      const before = { ...fiat, description: 'Government-issued currency not backed by a commodity' };
      h[0].fields = fieldsOf(list('monetary-nature'), before);
      h.push({ version: 2, by: 'tenant_admin', at: '2026-10-04 23:12', reason: 'common.non_material_update', note: 'Clarified the wording', fields: fieldsOf(list('monetary-nature'), fiat) });
    }
    const up = find('rounding-type', LISTS.find((l) => l.key === 'rounding-type').rows[0]?.code);
    if (up) {
      const l = list('rounding-type');
      const h = historyOf(l, up);
      h[0].fields = fieldsOf(l, { ...up, name: up.name.toUpperCase(), displayOrder: 5 });
      h.push({ version: 2, by: 'priya', at: '2026-10-03 16:20', reason: 'common.rectification', note: 'Name was in capitals', fields: fieldsOf(l, { ...up, displayOrder: 5 }) });
      h.push({ version: 3, by: 'priya', at: '2026-10-04 09:05', reason: 'common.non_material_update', note: 'Moved to the top', fields: fieldsOf(l, up) });
    }

  const $ = (id) => document.getElementById(id);

  const domainOf = (l) => l.key.replace(/-/g, '_');

    if (state.screen === 'row') p.set('tab', state.tab);

  function readHash() {
    const p = new URLSearchParams(location.hash.slice(1));
    if (p.get('persona') in PEOPLE) state.persona = p.get('persona');
    const s = p.get('screen');
    if (['home', 'refdata', 'classifications', 'list', 'row'].includes(s)) state.screen = s;

    if (state.screen === 'row' && !find(state.list, state.code)) state.screen = 'list';

    const actions = writer ? '<div class="actions"><button class="btn" data-act="edit">Edit</button><button class="btn danger" data-act="remove">Remove</button></div>' : '';
    const last = h[h.length - 1];
    const details = '<section class="card pad"><dl>' + fieldsOf(l, r).map(([k, v]) => '<div><dt>' + esc(k) + '</dt><dd' + (k === 'Code' ? ' class="code"' : '') + '>' + esc(v || '—') + '</dd></div>').join('') +
      (labelled(l) ? '<div><dt>Label</dt><dd>' + badge(badgeOf(l, r.code)) + '</dd></div>' : '') +
      '<div><dt>Last changed</dt><dd>' + esc(last.at) + ' by ' + esc(last.by) + '</dd></div><div><dt>Why</dt><dd>' + esc(REASON_TEXT[last.reason] || last.reason) + (last.note ? ' — ' + esc(last.note) : '') + '</dd></div></dl></section>';
    return crumbs([{ label: 'Reference data', go: 'refdata' }, { label: 'Classifications', go: 'classifications' }, { label: l.label, go: 'list', list: l.key }, { label: r.code }]) +
      '<div class="head"><div><h1>' + esc(r.name || r.code) + (labelled(l) ? ' ' + badge(badgeOf(l, r.code)) : '') + '</h1><p class="muted">' + esc(l.label) + ' · <span class="code">' + esc(r.code) + '</span> · version ' + last.version + '</p></div>' + actions + '</div>' +
      tabs + (state.tab === 'history' ? renderHistory(l, r, h, writer) : details);
  }

  /* The changed characters of a value, the way the server's diff spans mark them: the common prefix and suffix
     stay plain, the middle is marked on the old line and on the new one. */
  function spans(before, after) {
    let p = 0; while (p < before.length && p < after.length && before[p] === after[p]) p++;
    let s = 0; while (s < before.length - p && s < after.length - p && before[before.length - 1 - s] === after[after.length - 1 - s]) s++;
    const mark = (t) => esc(t.slice(0, p)) + (t.slice(p, t.length - s) ? '<mark>' + esc(t.slice(p, t.length - s)) + '</mark>' : '') + esc(t.slice(t.length - s));
    return { before: mark(before), after: mark(after) };
  }
  function ago(at) { return at === 'Just now' ? 'just now' : at; }
  function renderHistory(l, r, h, writer) {
    const newest = h[h.length - 1].version;
    const to = h.find((v) => v.version === state.version) || h[h.length - 1];
    const fromVersion = state.from !== null && state.from < to.version ? state.from : to.version - 1;
    const from = h.find((v) => v.version === fromVersion);
    const timeline = [...h].reverse().map((v) =>
      '<button class="version" data-version="' + v.version + '" aria-selected="' + (v.version === to.version) + '">' +
        '<span class="v">v' + v.version + ' · ' + esc(ago(v.at)) + (v.version === newest ? ' <span class="chip active">current</span>' : '') + '</span>' +
        '<span class="muted">Modified by ' + esc(v.by) + '</span>' +
        '<span class="faint">Performed by ' + esc(v.performed || 'ores_refdata_service') + '</span>' +
        '<span><span class="reason-chip" title="' + esc(REASON_TEXT[v.reason] || '') + '">' + esc(v.reason) + '</span></span>' +
        (v.note ? '<span class="note-line">“' + esc(v.note) + '”</span>' : '') +
      '</button>').join('');
    let table;
    if (!from) {
      table = '<table><thead><tr><th>Field</th><th>Value</th></tr></thead><tbody>' + to.fields.map(([k, v]) => '<tr><td class="muted">' + esc(k) + '</td><td>' + esc(v) + '</td></tr>').join('') + '</tbody></table>';
    } else {
      const rows = to.fields.map(([k, v], i) => {
        const before = from.fields[i] ? from.fields[i][1] : '';
        if (before === v) return state.onlyChanges ? '' : '<tr><td class="muted">' + esc(k) + '</td><td>' + esc(v) + '</td></tr>';
        const d = spans(before, v);
        return '<tr class="changed"><td class="muted">' + esc(k) + '</td><td><div class="diff">' +
          '<div class="line old"><span class="sign">−</span><span>' + d.before + '</span></div>' +
          '<div class="line new"><span class="sign">+</span><span>' + d.after + '</span></div></div></td></tr>';
      }).join('');
      table = '<table><thead><tr><th style="width:12rem">Field</th><th>Value diff</th></tr></thead><tbody>' + (rows || '<tr><td colspan="2" class="muted">No field changed between these versions.</td></tr>') + '</tbody></table>';
    }
    const pick = (id, value, max) => '<select id="' + id + '">' + h.filter((v) => v.version <= max).map((v) => '<option value="' + v.version + '"' + (v.version === value ? ' selected' : '') + '>v' + v.version + '</option>').join('') + '</select>';
    const compare = from ? '<span class="compare-pick">Compare ' + pick('cmp-from', from.version, to.version - 1) + ' → ' + pick('cmp-to', to.version, newest) + '</span>' : '<span class="compare-pick">v' + to.version + ', as created</span>';
    const toggle = from ? '<span class="toggle">' + [['0', 'All fields'], ['1', 'Only changes']].map(([v, t]) => '<button data-only="' + v + '" aria-pressed="' + (state.onlyChanges === (v === '1')) + '">' + t + '</button>').join('') + '</span>' : '';
    const revert = writer && to.version !== newest ? '<button class="btn" data-act="revert" data-v="' + to.version + '">Revert to v' + to.version + '</button>' : '';
    return '<section class="card history"><div class="versions" role="listbox" aria-label="History timeline">' + timeline + '</div>' +
      '<div class="compare"><div class="compare-head">' + compare + '<div class="actions">' + toggle + revert + '</div></div><div class="table-wrap">' + table + '</div></div></section>';
  }

  /* Dialogs */
  function reasonField(reasons, id) {
    return '<div class="field"><label for="' + id + '">Why</label><select id="' + id + '">' + reasons.map(([c, t, need]) => '<option value="' + c + '" data-need="' + need + '">' + esc(t) + '</option>').join('') + '</select></div>' +
      '<div class="field"><label for="' + id + '-note">Commentary <span class="faint" id="' + id + '-need">optional</span></label><input id="' + id + '-note" maxlength="2000"></div>';
  }
  function dialog(title, body, okLabel, okClass, onOk) {
    $('dialog-host').innerHTML = '<div class="scrim"><div class="dialog" role="dialog" aria-modal="true" aria-label="' + esc(title) + '"><h2>' + esc(title) + '</h2>' + body +
      '<p class="warnbox" id="dlg-err" hidden></p><div class="actions" style="justify-content:flex-end"><button class="btn" data-dlg="cancel">Cancel</button><button class="btn ' + okClass + '" data-dlg="ok">' + esc(okLabel) + '</button></div></div></div>';
    const sel = $('dialog-host').querySelector('select[id^="r-"]');
    const sync = () => { if (!sel) return; const need = sel.selectedOptions[0].dataset.need === 'true'; const tag = $(sel.id + '-need'); if (tag) tag.textContent = need ? 'required for this reason' : 'optional'; };
    if (sel) { sel.addEventListener('change', sync); sync(); }
    const pick = $('f-badge');
    if (pick) {
      const l = list(state.list);
      pick.addEventListener('change', () => { $('f-badge-preview').innerHTML = badge(pick.value); });
      $('f-badge-all').addEventListener('change', (e) => { const v = pick.value; pick.innerHTML = labelOptions(l, v, e.target.checked); pick.value = v; });
    }
    $('dialog-host').querySelector('[data-dlg="cancel"]').onclick = closeDialog;
    $('dialog-host').querySelector('[data-dlg="ok"]').onclick = () => {
      if (sel && sel.selectedOptions[0].dataset.need === 'true' && !$(sel.id + '-note').value.trim()) { const e = $('dlg-err'); e.textContent = 'This reason needs a commentary.'; e.hidden = false; return; }
      const err = onOk(); if (err) { const e = $('dlg-err'); e.textContent = err; e.hidden = false; return; }
      closeDialog();
    };
    const first = $('dialog-host').querySelector('input, select'); if (first) first.focus();
  }
  function closeDialog() { $('dialog-host').innerHTML = ''; }

  function rowFields(l, r) {
    return (r ? '' : '<div class="field"><label for="f-code">Code</label><input id="f-code" maxlength="100"></div>') +
      (l.shape === 'named' ? '<div class="field"><label for="f-name">Name</label><input id="f-name" value="' + esc(r?.name) + '"></div>' : '') +
      '<div class="field"><label for="f-desc">Description</label><input id="f-desc" value="' + esc(r?.description) + '"></div>' +
      (labelled(l) ? labelField(l, r) : '');
  }
  /* The labels a picker offers: the ones this list's code domain already uses, then, only when asked, the rest of
     the catalogue grouped by the domain that uses them. A label belongs to the catalogue, so a list may borrow
     another's, but the default choice is its own. */
  function domainBadges(domain) { return [...new Set(Object.values(BADGE_MAPS[domain] || {}))]; }
  function labelOptions(l, current, all) {
    const own = domainBadges(domainOf(l));
    const opt = (code) => '<option value="' + esc(code) + '"' + (code === current ? ' selected' : '') + '>' + esc((BADGES[code] || BADGES.__unmapped__).name) + '</option>';
    let html = '<optgroup label="' + esc(l.label) + '">' + ['__unmapped__', ...own].map(opt).join('') + '</optgroup>';
    if (all) {
      const seen = new Set(['__unmapped__', ...own]);
      const groups = {};
      for (const [domain, m] of Object.entries(BADGE_MAPS)) {
        if (domain === domainOf(l)) continue;
        for (const code of new Set(Object.values(m))) { if (!seen.has(code) && BADGES[code]) { (groups[domain] = groups[domain] || []).push(code); seen.add(code); } }
      }
      const unused = Object.keys(BADGES).filter((code) => !seen.has(code));
      html += Object.entries(groups).sort().map(([domain, codes]) => '<optgroup label="' + esc(domain.replace(/_/g, ' ')) + '">' + codes.map(opt).join('') + '</optgroup>').join('');
      if (unused.length) html += '<optgroup label="Not used by any list">' + unused.map(opt).join('') + '</optgroup>';
    } else if (current !== '__unmapped__' && !own.includes(current)) {
      html += '<optgroup label="Current">' + opt(current) + '</optgroup>';
    }
    return html;
  }
  function labelField(l, r) {
    const current = r ? badgeOf(l, r.code) : '__unmapped__';
    return '<div class="field"><label for="f-badge">Label <span class="faint">from the shared label catalogue</span></label>' +
      '<select id="f-badge">' + labelOptions(l, current, false) + '</select>' +
      '<div class="check"><input type="checkbox" id="f-badge-all"><label for="f-badge-all">Show labels from other lists</label></div>' +
      '<span id="f-badge-preview">' + badge(current) + '</span></div>';
  }
  function setLabel(l, code, badgeCode) {
    const m = BADGE_MAPS[domainOf(l)] || (BADGE_MAPS[domainOf(l)] = {});
    if (badgeCode === '__unmapped__') delete m[code]; else m[code] = badgeCode;
  }
  function record(l, r, reason, note) {
    const h = historyOf(l, r);
    h.push({ version: h[h.length - 1].version + 1, by: PEOPLE[state.persona].name.split(' ')[0].toLowerCase(), performed: 'ores_refdata_service', at: 'Just now', reason, note, fields: fieldsOf(l, r) });
  }
  function addRow(l) {
    dialog('Add a row to ' + l.label, rowFields(l, null) + '<p class="faint">The row is recorded as a new record; no reason is needed.</p>', 'Add row', 'primary', () => {
      const code = $('f-code').value.trim();
      if (!code) return 'A row needs a code.';
      if (l.rows.some((r) => r.code === code)) return 'This list already has the code ' + code + '.';
      const row = { code, name: l.shape === 'named' ? $('f-name').value.trim() : '', description: $('f-desc').value.trim(), displayOrder: l.shape === 'plain' ? null : (l.rows.length + 1) * 10 };
      l.rows.push(row); l.total++;
      if ($('f-badge')) setLabel(l, code, $('f-badge').value);
      historyOf(l, row)[0] = { version: 1, by: PEOPLE[state.persona].name.split(' ')[0].toLowerCase(), at: 'Just now', reason: 'system.new_record', note: '', fields: fieldsOf(l, row) };
      toast('Added ' + code + '.');
      go('row', { list: l.key, code, tab: 'details' });
    });
  }
  function editRow(l, r) {
    dialog('Edit ' + r.code, rowFields(l, r) + reasonField(AMEND_REASONS, 'r-amend'), 'Save', 'primary', () => {
      const name = l.shape === 'named' ? $('f-name').value.trim() : r.name;
      const description = $('f-desc').value.trim();
      const newBadge = $('f-badge') ? $('f-badge').value : null;
      const labelChanged = newBadge !== null && newBadge !== badgeOf(l, r.code);
      if (name === r.name && description === r.description && !labelChanged) return 'Nothing has changed.';
      if (labelChanged) setLabel(l, r.code, newBadge);
      if (name === r.name && description === r.description) { toast('Label changed. The label is kept by the label catalogue, so the row keeps its version.'); render(); return; }
      Object.assign(r, { name, description });
      record(l, r, $('r-amend').value, $('r-amend-note').value.trim());
      toast('Saved. Version ' + historyOf(l, r).length + ' is recorded.');
      render();
    });
  }
  function removeRow(l, r) {
    dialog('Remove ' + r.code + '?', '<p class="warnbox">Nothing checks whether records still use this code. A currency, book or party that still names it will fail its next save.</p>' + reasonField(DELETE_REASONS, 'r-del'), 'Remove', 'danger solid', () => {
      l.rows = l.rows.filter((x) => x !== r); l.total--;
      toast('Removed ' + r.code + '. Its versions stay in the history.');
      go('list', { list: l.key, code: null });
    });
  }
  function revertRow(l, r, version) {
    const h = historyOf(l, r);
    const target = h.find((v) => v.version === version);
    dialog('Revert ' + r.code + ' to version ' + version + '?', '<p class="muted">This writes the values of version ' + version + ' back as version ' + (h.length + 1) + '. Nothing in the history is lost.</p>' + reasonField(AMEND_REASONS, 'r-rev'), 'Revert', 'primary', () => {
      const get = (k) => (target.fields.find(([n]) => n === k) || [, ''])[1];
      if (l.shape === 'named') r.name = get('Name');
      r.description = get('Description');
      if (l.shape !== 'plain') r.displayOrder = Number(get('Display order')) || 0;
      record(l, r, $('r-rev').value, ($('r-rev-note').value.trim() || 'Reverted to version ' + version));
      state.version = null;
      toast('Reverted. Version ' + h.length + ' holds the values of version ' + version + '.');
      render();
    });
  }

  /* Why panel */
  const CHANGES = [
    'Reference data is an area of the application menu and a live tile on Home, as the accepted navigation design places it. The first build was reachable only by its address.',
    'Three levels instead of one page: the area, the index of lists, and one list. The 28-item sidebar is gone; lists are found by topic or by name.',
    'A row opens on its own page with Details and History tabs, the way a tenant opens with its tabs. Its address names the list, the row and the tab.',
    'Edit and Remove are dialogs with the reason and commentary, the way a role is renamed. The always-open form under the table is gone.',
    'Reorder is a mode with Save order and Cancel. The arrows no longer sit on every row.',
    'History follows the desktop history dialog: a timeline of versions with who modified and performed each, the reason code and the commentary; Compare picks any two versions; each changed field shows a red old line and a green new line, the changed characters marked, as a code review does.',
    'All fields or Only changes; Revert on an older version.',
    'A person who may only read sees no Edit, Remove, Add or Reorder, and is told why.',
    'Labels come from the shared label catalogue, the badge definitions and mappings the tenant screens already paint with. Seventeen of the lists have seeded labels; a row with none shows Unmapped. Edit offers the labels this list already uses; the rest of the catalogue only on request, grouped by the list that uses them.',
    'Assumed, to confirm: a row opens on a page rather than a drawer, and a tenant administrator sees Reference data too.',
  ];
  function renderWhy(open) {
    $('why').hidden = !open; $('why-btn').setAttribute('aria-pressed', String(open)); $('why-btn').setAttribute('aria-expanded', String(open));
    if (open) $('why').innerHTML = '<div class="why-head"><strong>What changed from the first build</strong><button class="why-close" data-why-close>Close</button></div><ul>' + CHANGES.map((c) => '<li>' + esc(c) + '</li>').join('') + '</ul>';
  }

  /* Render and events */
  function render() {
    renderShell();
    const view = { home: renderHome, refdata: renderArea, classifications: renderIndex, list: renderList, row: renderRow }[state.screen];
    $('app').innerHTML = view();
    const s = $('search'); if (s) { s.oninput = () => { state.search = s.value; const pos = s.selectionStart; render(); const n = $('search'); n.focus(); n.setSelectionRange(pos, pos); }; }
    const cf = $('cmp-from'), ct = $('cmp-to');
    if (cf) cf.onchange = () => { state.from = Number(cf.value); render(); };
    if (ct) ct.onchange = () => { state.version = Number(ct.value); if (state.from !== null && state.from >= state.version) state.from = null; render(); };
    const f = $('filter'); if (f) { f.oninput = () => { state.filter = f.value; const pos = f.selectionStart; render(); const n = $('filter'); n.focus(); n.setSelectionRange(pos, pos); }; }
  }

  document.addEventListener('click', (e) => {
    const t = e.target.closest('button, [data-go], tr[data-row]');
    if (!t) return;
    if (t.dataset.persona) { state.persona = t.dataset.persona; writeHash(); render(); return; }
    if (t.dataset.menu) { const m = MENU.find((x) => x.id === t.dataset.menu); if (m.soon) { toast(m.label + ' is not in this release yet.'); return; } go(m.id === 'home' ? 'home' : 'refdata', { list: null, code: null }); return; }
    if (t.id === 'why-btn') { renderWhy($('why').hidden); return; }
    if (t.dataset.whyClose !== undefined) { renderWhy(false); return; }
    if (t.dataset.go) { go(t.dataset.go, { list: t.dataset.list || state.list, code: null, tab: 'details' }); return; }
    if (t.dataset.noop !== undefined) { toast('Already built: open it from the menu under your name.'); return; }
    const l = state.list && list(state.list);
    if (t.matches('tr[data-row]') && !state.reordering) { go('row', { code: t.dataset.row, tab: 'details' }); return; }
    if (t.dataset.tab) { state.tab = t.dataset.tab; state.version = null; writeHash(); render(); return; }
    if (t.dataset.version) { state.version = Number(t.dataset.version); state.from = null; render(); return; }
    if (t.dataset.only) { state.onlyChanges = t.dataset.only === '1'; render(); return; }
    if (t.dataset.mv) { const i = Number(t.dataset.i), d = Number(t.dataset.mv); const rows = [...state.reordering]; [rows[i], rows[i + d]] = [rows[i + d], rows[i]]; state.reordering = rows; render(); return; }
    switch (t.dataset.act) {
      case 'add': addRow(l); break;
      case 'reorder': state.reordering = [...l.rows]; render(); break;
      case 'cancel-order': state.reordering = null; render(); break;
      case 'save-order': {
        const moved = state.reordering.filter((r, i) => r.displayOrder !== (i + 1) * 10);
        state.reordering.forEach((r, i) => { const o = (i + 1) * 10; if (r.displayOrder !== o) { r.displayOrder = o; record(l, r, 'common.non_material_update', 'Reordered'); } });
        l.rows = state.reordering; state.reordering = null;
        toast(moved.length ? 'Saved the new order of ' + moved.length + ' rows.' : 'The order did not change.'); render(); break;
      }
      case 'edit': editRow(l, find(state.list, state.code)); break;
      case 'remove': removeRow(l, find(state.list, state.code)); break;
      case 'revert': revertRow(l, find(state.list, state.code), Number(t.dataset.v)); break;
    }
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') { closeDialog(); renderWhy(false); }
    if (e.key === 'Enter' && e.target.matches('[role="link"]')) e.target.click();
  });

  seedHistory();
  readHash();
  render();
})();
</script>
</body>
</html>
