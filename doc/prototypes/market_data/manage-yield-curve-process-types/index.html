<!--
  PROTOTYPE. Throwaway. Mock data, no backend, no build step, no session.

  Manage yield curve process types
  (doc/knowledge/ui/synthetic_data_generation_screens.org): the ores.qt screen
  behind Market Data > Synthetic > Configuration. Two runtime-managed
  catalogues drive the IR curve editor's Process tab: the short-rate models the
  editor offers, and the parameter definitions each model takes. Nothing here
  reads or writes a service; every row is a mock.

  Variants with ?variant=a|b|c.
    a  the process type catalogue: order, code, name, description, parameter
       count, Edit/Delete, and New Process Type.
    b  the parameter definitions of one selected type: parameter, display name,
       symbol, short label, data type, default, min, max, order, Edit, and New
       Definition, with a bar chart of the defaults.
    c  a comparison: a heat map of types by parameter name, shaded by default
       value and empty where the type does not define the parameter, plus the
       argument for one shared parameter set.

  ?state=vasicek|cir|hull_white|empty picks the type. The cir state carries the
  extra market_price_of_risk row and the tightened initial_rate minimum; empty
  is a catalogue with no types. The type picker in variant b also offers
  two_factor_gaussian and black_karasinski, whose extra and replacement rows
  are mocked.
-->

<div class="proto-note" id="note"></div>
<div class="wrap" id="app"></div>
<div class="proto-bar" id="bar"></div>

<script>
const params = new URLSearchParams(location.search);
const variant = params.get('variant') || 'a';
const state = params.get('state') || '';

// Prototype plotting helper. Throwaway, dependency-free, dark-theme SVG.
// Each function returns an HTML string, so a page calls host.innerHTML = PC.line({...}).
// Prefixed PC to stay clear of page-local names; the pages also define `tag`.
const PC = (() => {
  const C = {grid:'#21262d', axis:'#30363d', text:'#71717a', dim:'#a1a1aa',
             ink:'#e3e3e6', accent:'#58a6ff', ok:'#3fb950', warn:'#d29922', bad:'#f85149'};
  const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const fmt = (v, d) => v == null ? '—' : (typeof v === 'number' ? v.toFixed(d ?? 2) : String(v));
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  // A blue -> amber ramp for a heat cell, t in 0..1.
  function heatColour(t){
    const stops = [[13,23,38],[21,60,110],[32,110,170],[88,166,255],[210,153,34],[248,81,73]];
    const p = clamp(t, 0, 1) * (stops.length - 1), i = Math.floor(p), f = p - i;
    const a = stops[i], b = stops[Math.min(stops.length - 1, i + 1)];
    return `rgb(${a.map((x, k) => Math.round(x + (b[k] - x) * f)).join(',')})`;
  }

  // Shared frame: margins, y gridlines and labels for a value axis.
  function frame(o){
    const w = o.w || 940, h = o.h || 300;
    const pad = Object.assign({l:64, r:18, t:16, b:40}, o.pad || {});
    const x0 = pad.l, x1 = w - pad.r, y0 = h - pad.b, y1 = pad.t;
    const vals = (o.series || []).flatMap(s => s.points || []).filter(v => v != null)
      .concat(o.extra || []);
    let lo = Math.min(...vals), hi = Math.max(...vals);
    if (o.zero) { lo = Math.min(lo, 0); hi = Math.max(hi, 0); }
    if (!(hi > lo)) { hi = lo + 1; }
    const span = hi - lo, l2 = lo - span * 0.08, h2 = hi + span * 0.08;
    const y = v => y0 - (v - l2) * (y0 - y1) / (h2 - l2);
    const X = o.x ? (i => x0 + o.x[i] * (x1 - x0))
                  : (i => x0 + i * (x1 - x0) / Math.max(1, (o.ticks ? o.ticks.length : 1) - 1));
    const yTicks = [];
    const steps = o.ySteps || 4;
    for (let k = 0; k <= steps; k++) {
      const v = l2 + (h2 - l2) * k / steps;
      yTicks.push(`<line x1="${x0}" y1="${y(v).toFixed(1)}" x2="${x1}" y2="${y(v).toFixed(1)}" stroke="${C.grid}"/>
        <text x="${x0 - 8}" y="${(y(v) + 3.5).toFixed(1)}" fill="${C.text}" font-size="10" text-anchor="end">${esc((o.yFmt || (v => fmt(v)))(v))}</text>`);
    }
    const xTicks = (o.ticks || []).map(t => {
      const px = o.x ? x0 + t.at * (x1 - x0) : X(t.at);
      return `<text x="${px.toFixed(1)}" y="${h - pad.b + 15}" fill="${C.text}" font-size="10" text-anchor="middle">${esc(t.label)}</text>`;
    }).join('');
    const grid = (o.xticks || []).map(t => {
      const px = o.x ? x0 + t.at * (x1 - x0) : X(t.at);
      return `<line x1="${px.toFixed(1)}" y1="${y1}" x2="${px.toFixed(1)}" y2="${y0}" stroke="${C.grid}" stroke-dasharray="2 3"/>`;
    }).join('');
    return {w, h, x0, x1, y0, y1, y, X, l2, h2, frame: yTicks.join('') + grid + xTicks};
  }

  function line(o){
    const f = frame(o);
    const bands = (o.bands || []).map(b => {
      const xa = f.x0 + b.from * (f.x1 - f.x0), xb = f.x0 + b.to * (f.x1 - f.x0);
      return `<rect x="${xa.toFixed(1)}" y="${f.y1}" width="${(xb - xa).toFixed(1)}" height="${(f.y0 - f.y1).toFixed(1)}"
        fill="${b.color || C.accent}" opacity=".08"/>` +
        (b.label ? `<text x="${((xa + xb) / 2).toFixed(1)}" y="${f.y1 + 11}" fill="${C.text}" font-size="9" text-anchor="middle">${esc(b.label)}</text>` : '');
    }).join('');
    const paths = (o.series || []).map(s => {
      let d = '', pen = false;
      s.points.forEach((v, i) => {
        if (v == null) { pen = false; return; }
        d += (pen ? 'L' : 'M') + f.X(i).toFixed(1) + ',' + f.y(v).toFixed(1) + ' ';
        pen = true;
      });
      const marks = s.markers ? s.points.map((v, i) => v == null ? '' :
        `<circle cx="${f.X(i).toFixed(1)}" cy="${f.y(v).toFixed(1)}" r="${s.r || 3.4}" fill="${s.color}"/>`).join('') : '';
      return `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="${s.width || 2}"${s.dash ? ` stroke-dasharray="${s.dash}"` : ''}/>${marks}`;
    }).join('');
    const legend = o.legend === false ? '' : `<div class="pc-legend">${(o.series || []).map(s =>
      `<span><i style="background:${s.color}"></i>${esc(s.name)}</span>`).join('')}${(o.notes || []).map(n =>
      `<span class="faint">${n}</span>`).join('')}</div>`;
    return `<figure class="pc"><svg viewBox="0 0 ${f.w} ${f.h}" width="100%" height="${f.h}" role="img" aria-label="${esc(o.title || 'chart')}">
      ${bands}${f.frame}${paths}
      ${o.yLabel ? `<text x="14" y="${(f.y0 + f.y1) / 2}" fill="${C.text}" font-size="10" transform="rotate(-90 14 ${(f.y0 + f.y1) / 2})" text-anchor="middle">${esc(o.yLabel)}</text>` : ''}
    </svg>${legend}${o.caption ? `<figcaption class="faint">${o.caption}</figcaption>` : ''}</figure>`;
  }

  function bars(o){
    const f = frame(Object.assign({zero: true}, o));
    const n = o.bars.length, bw = (f.x1 - f.x0) / n;
    const zero = f.y(0);
    const body = o.bars.map((b, i) => {
      const v = b.value == null ? null : b.value;
      const x = f.x0 + i * bw + bw * 0.18, w = bw * 0.64;
      const yv = v == null ? zero : f.y(v);
      const top = Math.min(yv, zero), hgt = Math.abs(zero - yv);
      const col = b.color || (v == null ? C.text : v >= 0 ? C.warn : C.accent);
      return `<rect x="${x.toFixed(1)}" y="${top.toFixed(1)}" width="${w.toFixed(1)}" height="${Math.max(1, hgt).toFixed(1)}" fill="${col}" opacity=".85"><title>${esc(b.label)}: ${esc(fmt(v))}</title></rect>
        <text x="${(x + w / 2).toFixed(1)}" y="${(f.h - 24)}" fill="${C.text}" font-size="9" text-anchor="middle">${esc(b.label)}</text>`;
    }).join('');
    return `<figure class="pc"><svg viewBox="0 0 ${f.w} ${f.h}" width="100%" height="${f.h}" role="img" aria-label="${esc(o.title || 'bars')}">
      ${f.frame}<line x1="${f.x0}" y1="${zero}" x2="${f.x1}" y2="${zero}" stroke="${C.axis}"/>${body}</svg>
      ${o.caption ? `<figcaption class="faint">${o.caption}</figcaption>` : ''}</figure>`;
  }

  // A surface as a shaded mesh grid: one cell per (row, column).
  function heat(o){
    const rows = o.rows, cols = o.cols;
    const cw = o.cell || 54, ch = o.cellH || 30, l = 58, t = 26;
    const w = l + cols.length * cw + (o.legend === false ? 14 : 92);
    const h = t + rows.length * ch + 34;
    const vals = [];
    rows.forEach((_, i) => cols.forEach((_, j) => { const v = o.value(i, j); if (v != null) vals.push(v); }));
    const lo = Math.min(...vals), hi = Math.max(...vals), span = (hi - lo) || 1;
    const cells = [];
    rows.forEach((r, i) => cols.forEach((c, j) => {
      const v = o.value(i, j);
      const x = l + j * cw, y = t + i * ch;
      const col = v == null ? '#161619' : heatColour((v - lo) / span);
      cells.push(`<rect x="${x}" y="${y}" width="${cw - 2}" height="${ch - 2}" rx="2" fill="${col}"><title>${esc(r.label)} · ${esc(c.label)}: ${esc(fmt(v, o.dp))}</title></rect>`);
      if (o.showValues !== false) cells.push(`<text x="${(x + (cw - 2) / 2).toFixed(1)}" y="${(y + ch / 2 + 3.5).toFixed(1)}" fill="${(v != null && (v - lo) / span > 0.55) ? '#0d1117' : C.ink}" font-size="9.5" text-anchor="middle">${esc(fmt(v, o.dp ?? 1))}</text>`);
    }));
    const rowLabels = rows.map((r, i) => `<text x="${l - 8}" y="${(t + i * ch + ch / 2 + 3.5).toFixed(1)}" fill="${C.text}" font-size="10" text-anchor="end">${esc(r.label)}</text>`).join('');
    const colLabels = cols.map((c, j) => `<text x="${(l + j * cw + (cw - 2) / 2).toFixed(1)}" y="${t - 8}" fill="${C.text}" font-size="10" text-anchor="middle">${esc(c.label)}</text>`).join('');
    const legend = o.legend === false ? '' : (() => {
      const bx = l + cols.length * cw + 14, by = t, bh = rows.length * ch - 2;
      const steps = 24, sh = bh / steps;
      let g = '';
      for (let k = 0; k < steps; k++) g += `<rect x="${bx}" y="${(by + k * sh).toFixed(1)}" width="12" height="${(sh + 1).toFixed(1)}" fill="${heatColour(1 - k / (steps - 1))}"/>`;
      return `<g>${g}<text x="${bx + 18}" y="${by + 8}" fill="${C.text}" font-size="9">${esc(fmt(hi, o.dp))}</text>
        <text x="${bx + 18}" y="${by + bh}" fill="${C.text}" font-size="9">${esc(fmt(lo, o.dp))}</text></g>`;
    })();
    return `<figure class="pc"><svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" role="img" aria-label="${esc(o.title || 'heat map')}">
      ${cells.join('')}${rowLabels}${colLabels}${legend}
      ${o.xLabel ? `<text x="${(l + cols.length * cw / 2).toFixed(1)}" y="${h - 6}" fill="${C.text}" font-size="10" text-anchor="middle">${esc(o.xLabel)}</text>` : ''}
      ${o.yLabel ? `<text x="12" y="${(t + rows.length * ch / 2).toFixed(1)}" fill="${C.text}" font-size="10" transform="rotate(-90 12 ${(t + rows.length * ch / 2).toFixed(1)})" text-anchor="middle">${esc(o.yLabel)}</text>` : ''}
    </svg>${o.caption ? `<figcaption class="faint">${o.caption}</figcaption>` : ''}</figure>`;
  }

  // A surface as an isometric wireframe: rows and columns joined over a height.
  function mesh(o){
    const w = o.w || 940, h = o.h || 420;
    const rows = o.z.length, cols = o.z[0].length;
    const vals = o.z.flat().filter(v => v != null);
    const lo = Math.min(...vals), hi = Math.max(...vals), span = (hi - lo) || 1;
    const ox = o.ox ?? w * 0.52;
    const sy = o.sy ?? Math.min(22, h / (2 * Math.max(1, (rows - 1) + (cols - 1))));
    const sx = o.sx ?? Math.min(46, (w * 0.6) / Math.max(1, (rows - 1) + (cols - 1)));
    const sz = o.sz ?? h * 0.34;
    const oy = o.oy ?? h - 26 - ((rows - 1) + (cols - 1)) * sy;
    const P = (i, j) => {
      const v = o.z[i][j];
      const z = v == null ? 0 : (v - lo) / span;
      return [ox + (j - i) * sx, oy + (i + j) * sy - z * sz, z];
    };
    const lines = [];
    for (let i = 0; i < rows; i++) {
      let d = '';
      for (let j = 0; j < cols; j++) { const p = P(i, j); d += (j ? 'L' : 'M') + p[0].toFixed(1) + ',' + p[1].toFixed(1) + ' '; }
      lines.push(`<path d="${d}" fill="none" stroke="${C.accent}" stroke-width="1.4" opacity=".75"/>`);
    }
    for (let j = 0; j < cols; j++) {
      let d = '';
      for (let i = 0; i < rows; i++) { const p = P(i, j); d += (i ? 'L' : 'M') + p[0].toFixed(1) + ',' + p[1].toFixed(1) + ' '; }
      lines.push(`<path d="${d}" fill="none" stroke="${C.warn}" stroke-width="1" opacity=".5"/>`);
    }
    const rowL = (o.rows || []).map((r, i) => { const p = P(i, 0); return `<text x="${(p[0] - 12).toFixed(1)}" y="${(p[1] + 4).toFixed(1)}" fill="${C.text}" font-size="10" text-anchor="end">${esc(r.label)}</text>`; }).join('');
    const colL = (o.cols || []).map((c, j) => { const p = P(rows - 1, j); return `<text x="${(p[0] + 10).toFixed(1)}" y="${(p[1] + 4).toFixed(1)}" fill="${C.text}" font-size="10">${esc(c.label)}</text>`; }).join('');
    const axis = `<text x="14" y="${h - 12}" fill="${C.text}" font-size="10">height: ${esc(o.zLabel || 'value')} ${esc(fmt(lo, o.dp))}–${esc(fmt(hi, o.dp))}</text>`;
    return `<figure class="pc"><svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" role="img" aria-label="${esc(o.title || 'surface mesh')}">
      ${lines.join('')}${rowL}${colL}${axis}</svg>
      <div class="pc-legend"><span><i style="background:${C.accent}"></i>expiry</span><span><i style="background:${C.warn}"></i>strike</span>${(o.notes || []).map(n => `<span class="faint">${n}</span>`).join('')}</div>
      ${o.caption ? `<figcaption class="faint">${esc(o.caption)}</figcaption>` : ''}</figure>`;
  }

  return {line, bars, heat, mesh, colours: C, heatColour};
})();

function urlButton(url){
  return `<button class="urlbtn" type="button" data-url="${url}" title="Edit in the oresmd URL editor">`+
         `<span class="mono">${url}</span><span class="edit">edit</span></button>`;
}
function openOresmdEditor(url, host){
  const ov=document.createElement('div'); ov.className='oresmd-overlay';
  const f=document.createElement('iframe'); f.className='oresmd-frame'; f.title='oresmd URL editor';
  f.src='../oresmd-url-editor/index.html?embed=1&url='+encodeURIComponent(url||'');
  ov.appendChild(f); document.body.appendChild(ov);
  function close(){ window.removeEventListener('message', onMsg); document.removeEventListener('keydown', onKey); ov.remove(); }
  function onMsg(e){ if(e.data && e.data.type==='oresmd-url'){ host.dataset.url=e.data.url; const m=host.querySelector('.mono'); if(m) m.textContent=e.data.url; close(); } }
  function onKey(e){ if(e.key==='Escape') close(); }
  window.addEventListener('message', onMsg); document.addEventListener('keydown', onKey);
  ov.addEventListener('click', e=>{ if(e.target===ov) close(); });
}
document.addEventListener('click', e=>{
  const b=e.target.closest('.urlbtn'); if(!b) return;
  openOresmdEditor(b.dataset.url||'', b);
});
function tag(text, kind){ return `<span class="tag ${kind||''}">${text}</span>`; }

// ==== page data and panels ====

// Mock of ores.synthetic.domain.yield_curve_process_type. The five rows are the
// service seed; the catalogue is runtime-managed, so nothing here is authoritative.
const types = [
  {code:'VASICEK', name:'Vasicek', short:'VAS', key:'vasicek', order:1,
   desc:'Mean-reverting Gaussian short-rate model with a constant volatility, admitting a closed-form affine zero-coupon bond price.'},
  {code:'COX_INGERSOLL_ROSS', name:'Cox-Ingersoll-Ross', short:'CIR', key:'cir', order:2,
   desc:'Mean-reverting short-rate model with state-dependent (square-root) volatility, keeping the simulated rate non-negative, and admitting a closed-form affine zero-coupon bond price.'},
  {code:'HULL_WHITE', name:'Hull-White', short:'HW', key:'hull_white', order:3,
   desc:'Extended Vasicek short-rate model with a time-dependent mean-reversion target, admitting a closed-form affine zero-coupon bond price.'},
  {code:'TWO_FACTOR_GAUSSIAN', name:'Two-Factor Gaussian', short:'G2++', key:'two_factor_gaussian', order:4,
   desc:'Two-factor Gaussian (G2++) short-rate model: a sum of two correlated mean-reverting Ornstein-Uhlenbeck factors around a long-term mean, giving a richer (humped) initial term structure than one-factor models while remaining analytically tractable.'},
  {code:'BLACK_KARASINSKI', name:'Black-Karasinski', short:'BK', key:'black_karasinski', order:5,
   desc:'Log-normal short-rate model: the logarithm of the short rate follows a mean-reverting Ornstein-Uhlenbeck process, so the simulated rate stays positive for all time. Bond prices are evaluated on a trinomial lattice of the log rate.'}
];

// A row of ores.synthetic.domain.yield_curve_process_parameter_definition.
// A null min or max means the catalogue leaves that bound open. `numerical`
// marks a solver setting rather than a model shape parameter.
function param(o){
  return Object.assign({dtype:'double', symbol:'', short:'', min:null, max:null, numerical:false, desc:''}, o);
}

const defs = {
  VASICEK: [
    param({id:1, name:'kappa', display:'Mean reversion speed', symbol:'κ', short:'κ rev', def:0.5, min:0, order:1,
      desc:'Speed at which the short rate returns to its long-term mean.'}),
    param({id:2, name:'theta', display:'Long-term mean', symbol:'θ', short:'θ mean', def:0.03, order:2,
      desc:'Level the short rate reverts to over the long horizon.'}),
    param({id:3, name:'sigma', display:'Volatility', symbol:'σ', short:'σ vol', def:0.01, min:0, order:3,
      desc:'Instantaneous volatility of the short rate.'}),
    param({id:4, name:'initial_rate', display:'Initial short rate', short:'r₀', def:0.03, order:4,
      desc:'Short rate at the first simulation step.'})
  ],
  COX_INGERSOLL_ROSS: [
    param({id:11, name:'kappa', display:'Mean reversion speed', symbol:'κ', short:'κ rev', def:0.5, min:0, order:1,
      desc:'Speed at which the short rate returns to its long-term mean.'}),
    param({id:12, name:'theta', display:'Long-term mean', symbol:'θ', short:'θ mean', def:0.03, order:2,
      desc:'Level the short rate reverts to. The Feller condition 2κθ ≥ σ² keeps zero unattainable.'}),
    param({id:13, name:'sigma', display:'Volatility', symbol:'σ', short:'σ vol', def:0.01, min:0, order:3,
      desc:'State-dependent volatility, proportional to the square root of the short rate.'}),
    param({id:14, name:'initial_rate', display:'Initial short rate', short:'r₀', def:0.03, min:0, order:4,
      desc:'Short rate at the first simulation step. The square-root volatility requires a non-negative rate.'}),
    param({id:15, name:'market_price_of_risk', display:'Market price of risk', symbol:'λ', short:'λ risk', def:-0.1, order:5,
      desc:'Premium the model assigns to rate risk. This row belongs to CIR alone.'})
  ],
  HULL_WHITE: [
    param({id:21, name:'kappa', display:'Mean reversion speed', symbol:'κ', short:'κ rev', def:0.5, min:0, order:1,
      desc:'Speed of reversion to the time-dependent target.'}),
    param({id:22, name:'theta', display:'Long-term mean', symbol:'θ', short:'θ mean', def:0.03, order:2,
      desc:'Long-term level the time-dependent target tends to.'}),
    param({id:23, name:'sigma', display:'Volatility', symbol:'σ', short:'σ vol', def:0.01, min:0, order:3,
      desc:'Instantaneous volatility of the short rate.'}),
    param({id:24, name:'initial_rate', display:'Initial short rate', short:'r₀', def:0.03, order:4,
      desc:'Short rate at the first simulation step.'})
  ],
  TWO_FACTOR_GAUSSIAN: [
    param({id:31, name:'kappa_1', display:'First factor mean reversion', symbol:'κ₁', short:'κ₁ rev', def:0.5, min:0, order:1,
      desc:'Reversion speed of the first Gaussian factor.'}),
    param({id:32, name:'kappa_2', display:'Second factor mean reversion', symbol:'κ₂', short:'κ₂ rev', def:0.05, min:0, order:2,
      desc:'Reversion speed of the second Gaussian factor. Slower than the first, so the hump in the initial curve survives.'}),
    param({id:33, name:'theta', display:'Long-term mean', symbol:'θ', short:'θ mean', def:0.03, order:3,
      desc:'Level both factors revert around.'}),
    param({id:34, name:'sigma_1', display:'First factor volatility', symbol:'σ₁', short:'σ₁ vol', def:0.01, min:0, order:4,
      desc:'Volatility of the first Gaussian factor.'}),
    param({id:35, name:'sigma_2', display:'Second factor volatility', symbol:'σ₂', short:'σ₂ vol', def:0.008, min:0, order:5,
      desc:'Volatility of the second Gaussian factor.'}),
    param({id:36, name:'rho', display:'Factor correlation', symbol:'ρ', short:'ρ corr', def:-0.7, min:-1, max:1, order:6,
      desc:'Correlation between the two factors. A negative value is the usual rates choice.'}),
    param({id:37, name:'initial_rate', display:'Initial short rate', short:'r₀', def:0.03, order:7,
      desc:'Short rate at the first simulation step.'})
  ],
  BLACK_KARASINSKI: [
    param({id:41, name:'kappa', display:'Mean reversion speed', symbol:'κ', short:'κ rev', def:0.5, min:0, order:1,
      desc:'Speed at which the log short rate returns to its long-term mean.'}),
    param({id:42, name:'theta', display:'Long-term mean of the log rate', symbol:'θ', short:'θ log mean', def:-3.5, order:2,
      desc:'Mean of the log short rate, so the rate itself reverts to exp(θ).'}),
    param({id:43, name:'sigma', display:'Log-rate volatility', symbol:'σ', short:'σ log vol', def:0.12, min:0, order:3,
      desc:'Volatility of the log short rate, not of the rate.'}),
    param({id:44, name:'initial_rate', display:'Initial short rate', short:'r₀', def:0.03, min:0, order:4,
      desc:'Short rate at the first simulation step. The log-normal process keeps it positive.'}),
    param({id:45, name:'lattice_steps', display:'Trinomial lattice steps', symbol:'n', short:'n steps', def:200, min:1, max:2000,
      order:5, numerical:true, desc:'Steps of the trinomial lattice the bond price is evaluated on.'})
  ]
};

// Columns of the variant c comparison, in reading order. Kappa and sigma are
// absent for G2++, which replaces them with one pair per factor; the lattice
// step count of Black-Karasinski is left out because its scale is steps, not a
// rate, so it would flatten every other cell in the ramp.
const comparison = [
  {key:'kappa', label:'κ'}, {key:'theta', label:'θ'}, {key:'sigma', label:'σ'},
  {key:'initial_rate', label:'r₀'}, {key:'kappa_1', label:'κ₁'}, {key:'kappa_2', label:'κ₂'},
  {key:'sigma_1', label:'σ₁'}, {key:'sigma_2', label:'σ₂'}, {key:'rho', label:'ρ'},
  {key:'market_price_of_risk', label:'λ'}
];

function defsFor(code){ return defs[code] || []; }
function ordered(){
  const list = state === 'empty' ? [] : types;
  return list.slice().sort((a, b) => a.order - b.order);
}
function pickType(){
  if (state === 'empty') return null;
  const s = (state || 'vasicek').toLowerCase();
  return types.find(t => t.key === s) || types[0];
}
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function fmt(v){ return v == null ? '—' : String(v); }

function header(){
  const list = ordered();
  const nParams = list.reduce((n, t) => n + defsFor(t.code).length, 0);
  const sel = pickType();
  return `
  <div class="panel">
    <div class="top"><h1>Manage yield curve process types</h1>
      ${tag('runtime-managed catalogue', 'warn')}
      ${tag(list.length ? list.length + ' type(s)' : 'no types')}
      ${tag(list.length ? nParams + ' parameter definition(s)' : 'no definitions')}
    </div>
    <p class="muted">Market Data &gt; Synthetic &gt; Configuration. These are the two catalogues the IR curve editor's Process tab reads: the short-rate models it offers, and the parameters each model takes. Because the catalogue is data, a new model needs no code change to appear in the editor.</p>
    <div class="row">
      <div class="field"><label>Process types</label><div class="value mono">${urlButton('oresmd://synthetic/domain/yield_curve_process_type')}</div></div>
      <div class="field"><label>Parameter definitions</label><div class="value mono">${urlButton('oresmd://synthetic/domain/yield_curve_process_parameter_definition')}</div></div>
      ${sel ? `<div class="field"><label>Selected type</label><div class="value mono">${sel.code}</div></div>` : ''}
    </div>
  </div>`;
}

function typesTable(){
  const list = ordered();
  if (!list.length) return `
  <div class="panel">
    <h2>Process type catalogue</h2>
    <div class="notice">No process types are configured. The catalogue is a table, so an empty catalogue is a real state: the editor's Process tab would offer no model, and every IR curve feed would fail validation. Seed at least one type.</div>
  </div>`;
  return `
  <div class="panel">
    <h2>Process type catalogue — ${list.length} row(s)</h2>
    <table>
      <thead><tr><th class="num">Order</th><th>Code</th><th>Name</th><th>Description</th><th class="num">Parameters</th><th></th></tr></thead>
      <tbody>${list.map(t => `<tr>
        <td class="num">${t.order}</td>
        <td class="mono">${esc(t.code)}</td>
        <td>${esc(t.name)}</td>
        <td class="muted">${esc(t.desc)}</td>
        <td class="num">${defsFor(t.code).length}</td>
        <td><button class="btn" data-act="Edit ${esc(t.code)}">Edit</button>
            <button class="btn" data-act="Delete ${esc(t.code)}">Delete</button></td>
      </tr>`).join('')}</tbody>
    </table>
    <div class="row">
      <button class="btn primary" data-act="New Process Type">New Process Type</button>
      <span class="faint">Display order is the comparator the pickers sort on, not the order rows were inserted.</span>
    </div>
    <div class="notice">Mock only. Both catalogues are runtime-managed, and the rows shown are a mock. Four parameters — kappa, theta, sigma and initial_rate — are the seeded set; the Two-Factor Gaussian and Black-Karasinski sets are mocked.</div>
  </div>`;
}

function typePicker(){
  const sel = pickType();
  return `
  <div class="panel">
    <h2>Process type</h2>
    <div class="row">${types.map(t => `<button class="btn ${sel && sel.code === t.code ? 'primary' : ''}" data-pick="${t.key}">${esc(t.name)}</button>`).join('')}
      <button class="btn ${!sel ? 'primary' : ''}" data-pick="empty">none (empty)</button></div>
    <div class="notice">The picker stands in for the IR curve editor's Process tab. It renders one row per definition the catalogue holds for the chosen type, so a type whose rows change shape changes the form with no code change.</div>
  </div>`;
}

function paramsTable(sel){
  if (!sel) return `
  <div class="panel">
    <h2>Parameter definitions</h2>
    <div class="notice">No process type is configured, so there is nothing to define parameters for. The editor's Process tab would render an empty form.</div>
  </div>`;
  const rows = defsFor(sel.code).slice().sort((a, b) => a.order - b.order);
  return `
  <div class="panel">
    <h2>Parameter definitions — ${esc(sel.name)} (${sel.code})</h2>
    <table>
      <thead><tr><th>Parameter</th><th>Display name</th><th>Symbol</th><th>Short label</th><th>Data type</th>
        <th class="num">Default</th><th class="num">Min</th><th class="num">Max</th><th class="num">Order</th><th></th></tr></thead>
      <tbody>${rows.map(d => `<tr>
        <td class="mono" title="${esc(d.desc)}">${esc(d.name)}</td>
        <td>${esc(d.display)}</td>
        <td class="mono">${d.symbol ? esc(d.symbol) : '<span class="faint">—</span>'}</td>
        <td>${esc(d.short)}</td>
        <td class="mono faint">${esc(d.dtype)}</td>
        <td class="num">${fmt(d.def)}</td>
        <td class="num">${fmt(d.min)}</td>
        <td class="num">${fmt(d.max)}</td>
        <td class="num">${d.order}</td>
        <td><button class="btn" data-act="Edit ${esc(sel.code)}.${esc(d.name)}">Edit</button></td>
      </tr>`).join('')}</tbody>
    </table>
    <div class="row">
      <button class="btn primary" data-act="New Definition for ${esc(sel.code)}">New Definition</button>
      <span class="faint">${rows.length} definition(s). An open bound is blank, not zero.</span>
    </div>
    ${sel.code === 'COX_INGERSOLL_ROSS' ? `<div class="notice">This type adds a row the shared set does not have: <span class="mono">market_price_of_risk</span> (λ). It also tightens <span class="mono">initial_rate</span> to a non-negative minimum, because the square-root volatility needs a non-negative rate.</div>` : ''}
    ${sel.code === 'TWO_FACTOR_GAUSSIAN' ? `<div class="notice">Mock rows. This type replaces <span class="mono">kappa</span> and <span class="mono">sigma</span> with one pair per factor — <span class="mono">kappa_1</span>, <span class="mono">kappa_2</span>, <span class="mono">sigma_1</span>, <span class="mono">sigma_2</span> — and adds the factor correlation <span class="mono">rho</span>.</div>` : ''}
    ${sel.code === 'BLACK_KARASINSKI' ? `<div class="notice">Mock rows. The rate is log-normal, so <span class="mono">theta</span> is the mean of the log rate and <span class="mono">sigma</span> its volatility. <span class="mono">lattice_steps</span> is a numerical choice, not a model shape parameter.</div>` : ''}
  </div>`;
}

function defaultsChart(sel){
  if (!sel) return '';
  const all = defsFor(sel.code).slice().sort((a, b) => a.order - b.order);
  const shown = all.filter(d => !d.numerical);
  const omitted = all.filter(d => d.numerical);
  return `
  <div class="panel">
    <h2>Default values — ${esc(sel.name)}</h2>
    ${PC.bars({
      bars: shown.map(d => ({label: d.symbol || d.short, value: d.def, color: PC.colours.accent})),
      yFmt: v => v.toFixed(2), yLabel: 'catalogue default', h: 260, title: 'Default parameter values',
      caption: 'The parameter space of one type at a glance. These are catalogue defaults, so the shape is the model starting point, not a calibrated set.'
    })}
    ${omitted.length ? `<div class="notice">${omitted.map(d => `<span class="mono">${esc(d.name)}</span>`).join(', ')} is a solver setting rather than a model shape, and its scale would flatten the other bars. It stays in the table above.</div>` : ''}
  </div>`;
}

function comparisonHeat(){
  const list = ordered();
  if (!list.length) return `
  <div class="panel">
    <h2>Parameter defaults across types</h2>
    <div class="notice">No process types are configured, so there is nothing to compare. The heat map needs at least one row.</div>
  </div>`;
  const valueOf = (code, key) => {
    const d = defsFor(code).find(x => x.name === key);
    return d ? d.def : null;
  };
  return `
  <div class="panel">
    <h2>Parameter defaults across types</h2>
    ${PC.heat({
      rows: list.map(t => ({label: t.short})),
      cols: comparison.map(c => ({label: c.label})),
      value: (i, j) => valueOf(list[i].code, comparison[j].key),
      dp: 3, xLabel: 'parameter (symbol)', yLabel: 'process type',
      caption: 'Each cell is the default the catalogue gives that parameter for that type; a dark empty cell is a parameter the type does not define. Rows are abbreviated: VAS = Vasicek, CIR = Cox-Ingersoll-Ross, HW = Hull-White, G2++ = Two-Factor Gaussian, BK = Black-Karasinski.'
    })}
    <div class="notice">Mock only, and the catalogue is runtime-managed. Black-Karasinski defines the extra row <span class="mono">lattice_steps</span>; it is left out of the ramp because its scale is steps, not a rate.</div>
  </div>`;
}

function sharedSetNote(){
  const names = [...new Set(types.flatMap(t => defsFor(t.code).map(d => d.name)))];
  const shared = names.filter(n => types.every(t => defsFor(t.code).some(d => d.name === n)));
  return `
  <div class="panel">
    <h2>What a shared parameter set would buy</h2>
    <p class="muted">The union of the catalogue is ${names.length} parameter names; the intersection is ${shared.length} — ${shared.map(n => `<span class="mono">${esc(n)}</span>`).join(', ')}. Only those are common to every type.</p>
    <div class="notice">If the shared names were declared once, the editor's Process tab could render one base form and add rows only for the model-specific parameters. As it stands each type carries its own rows, so the editor rebuilds the form from the catalogue on every type change, and a change to a shared parameter has to be repeated in every type that defines it. The empty cells above are exactly the rows the editor must add or drop when the type changes.</div>
  </div>`;
}

function render(){
  let body;
  if (variant === 'c') body = comparisonHeat() + sharedSetNote();
  else if (variant === 'b') { const sel = pickType(); body = typePicker() + paramsTable(sel) + defaultsChart(sel); }
  else body = typesTable();
  document.getElementById('app').innerHTML = header() + body;
  document.getElementById('note').textContent =
    `Prototype · manage yield curve process types · variant ${variant.toUpperCase()} · type: ${state || 'vasicek'} · runtime-managed catalogues, mock data`;
  document.getElementById('bar').innerHTML =
    `<span class="label">Variant</span>` +
    ['a','b','c'].map(v => `<button data-v="${v}" class="${v === variant ? 'on' : ''}">${v.toUpperCase()}</button>`).join('') +
    `<span class="sep">|</span><span class="label">Type</span>` +
    [['vasicek','Vasicek'],['cir','CIR'],['hull_white','Hull-White'],['empty','empty']]
      .map(([s, l]) => `<button data-s="${s}" class="${(state || 'vasicek') === s ? 'on' : ''}">${l}</button>`).join('');
  document.querySelectorAll('#bar [data-v]').forEach(b => b.onclick = () => set('variant', b.dataset.v));
  document.querySelectorAll('#bar [data-s]').forEach(b => b.onclick = () => set('state', b.dataset.s));
  document.querySelectorAll('#app [data-pick]').forEach(b => b.onclick = () => set('state', b.dataset.pick));
  document.querySelectorAll('#app [data-act]').forEach(b => b.onclick = () => {
    document.getElementById('note').textContent = `${b.textContent}: mock only — the catalogue write is not wired`;
  });
}
function set(k, v){ const p = new URLSearchParams(location.search); p.set(k, v); location.search = p.toString(); }
render();
</script>
</body>
</html>
