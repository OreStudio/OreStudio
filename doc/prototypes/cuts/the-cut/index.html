<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cuts — prototype</title>
<style>
:root{
  color-scheme:dark;
  --bg:#121214;--panel:#1a1a1e;--panel-2:#26262b;--line:#30363d;--line-soft:#21262d;--line-strong:#4a5568;
  --ink:#e3e3e6;--ink-dim:#a1a1aa;--ink-faint:#71717a;
  --accent:#58a6ff;--accent-bright:#8ab4f8;--accent-dim:#202835;
  --ok:#22c55e;--warn:#eab308;--stale:#e3b341;--bad:#ef4444;--info:#3b82f6;--violet:#a855f7;--inactive:#6b7280;
  --radius:8px;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
h1,h2,h3{margin:0;font-weight:600}
p{margin:0}
button{font:inherit;color:inherit}
a{color:var(--accent-bright);text-decoration:none}
.mono{font-family:var(--mono)}
.dim{color:var(--ink-dim)}
.faint{color:var(--ink-faint)}
.dash{color:var(--ink-faint)}
.nowrap{white-space:nowrap}

/* Prototype chrome, deliberately unlike the design on trial. */
.proto-note{position:fixed;top:0;left:0;right:0;z-index:60;padding:4px 16px;background:#2a2113;border-bottom:1px solid #4a3a17;color:var(--warn);font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.proto-bar{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:60;display:flex;align-items:center;flex-wrap:wrap;justify-content:center;gap:4px;max-width:96vw;padding:4px 8px;background:#0b0e13;border:1px solid var(--line);border-radius:999px;font-size:12px}
.proto-bar button{background:none;border:none;color:var(--ink-dim);padding:4px 8px;border-radius:999px;cursor:pointer}
.proto-bar button:hover{background:var(--panel-2);color:var(--ink)}
.proto-bar button.on{background:var(--accent-dim);color:var(--ink)}
.proto-bar .label{padding:0 8px;color:var(--ink-faint);white-space:nowrap}
.proto-bar .sep{color:var(--line)}

/* A gap the screen draws because the server does not answer yet. */
.gap{margin-top:16px;border-left:2px solid var(--warn);padding:4px 0 4px 12px;font-size:12px;color:var(--ink-dim)}
.gap b{color:var(--warn)}
body.nogaps .gap{display:none}

/* The application shell, as the product draws it. */
.shell-head{position:fixed;top:26px;left:0;right:0;z-index:50;height:44px;display:flex;align-items:center;gap:16px;padding:0 16px;background:var(--bg);border-bottom:1px solid var(--line);font-size:13px}
.shell-head .brand{font-weight:600;letter-spacing:-.01em}
.shell-head nav{display:flex;gap:4px;flex-wrap:wrap}
.shell-head nav span{color:var(--ink-dim);padding:4px 8px;border-radius:6px}
.shell-head nav span.on{color:var(--ink);background:var(--panel-2)}
.shell-head .who{margin-left:auto;color:var(--ink-dim);white-space:nowrap}
.shell-head .who b{color:var(--ink);font-weight:500}

.page{padding:86px 24px 110px;max-width:1180px;margin:0 auto}
.crumbs{font-size:12px;color:var(--ink-faint);margin:0 0 8px}
.crumbs .sep{padding:0 4px}
.crumbs a{color:var(--ink-dim)}
.crumbs a:hover{color:var(--ink);text-decoration:underline}
.pagehead{display:flex;align-items:flex-start;gap:16px;margin:0 0 16px;flex-wrap:wrap}
.pagehead h1{font-size:24px;font-weight:600;letter-spacing:-.02em}
.pagehead .lead{margin:4px 0 0;color:var(--ink-dim);font-size:13px}
.pagehead .actions{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* Buttons, marks, badges, notices. */
.btn{display:inline-flex;align-items:center;gap:8px;white-space:nowrap;border:1px solid var(--line);background:var(--panel-2);border-radius:var(--radius);padding:8px 16px;font-size:13px;cursor:pointer}
.btn:hover:not(:disabled){border-color:var(--line-strong)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#06121f;font-weight:600}
.btn.ghost{background:none;border-color:transparent;color:var(--ink-dim)}
.btn.ghost:hover:not(:disabled){color:var(--ink);background:var(--panel-2)}
.btn.small{padding:4px 12px;font-size:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.badge{display:inline-block;border:1px solid currentColor;border-radius:999px;padding:0 8px;font-size:12px;line-height:20px;white-space:nowrap}
.badge.ok{color:var(--ok)}
.badge.pending{color:var(--info)}
.badge.caution{color:var(--warn)}
.badge.bad{color:var(--bad)}
.badge.inactive{color:var(--inactive)}
.badge.indicative{color:var(--violet)}
.badge.mono{font-family:var(--mono);font-size:11px}
.access{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;padding:0 8px;font-size:12px;color:var(--ink-dim)}
.notice{border-radius:var(--radius);padding:12px 16px;font-size:13px;margin:0 0 16px;border:1px solid}
.notice.info{background:#12161f;border-color:#24344d}
.notice.success{background:#12281d;border-color:#23543a;color:#a8e6c4}
.notice.warn{background:#2a2113;border-color:#4a3a17;color:#efd39a}
.notice.error{background:#2b1614;border-color:#5c2a24;color:#f0b7ae}
.notice b{font-weight:600}
.notice .acts{margin-top:8px;display:flex;gap:8px;flex-wrap:wrap}

/* Cards and panels. */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:24px}
.card h2{font-size:18px;font-weight:600;margin:0 0 4px}
.card .lede{margin:0 0 24px;color:var(--ink-dim);font-size:13px}
.card h3{font-size:13px;font-weight:600;margin:24px 0 8px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.panel h2{font-size:13px;font-weight:600;margin:0 0 12px}
.panel h2 .sub{font-weight:400;color:var(--ink-faint)}
.panel .nums{margin:4px 0 0;color:var(--ink-dim);font-size:13px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:820px){.grid2{grid-template-columns:1fr}}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:16px;margin:0 0 16px}
.fact .k{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-faint);margin:0 0 2px}
.fact .v{font-size:13px}

/* Tabs, as the record page draws them. */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:0 0 16px;flex-wrap:wrap}
.tabs span,.tabs a{padding:8px 12px;font-size:13px;color:var(--ink-dim);border-bottom:2px solid transparent;margin-bottom:-1px;display:inline-block}
.tabs .on{color:var(--ink);border-bottom-color:var(--accent)}

/* The rail of the take flow. */
.rail{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 20px}
.rail .step{display:flex;gap:8px;align-items:center;padding:8px 12px;border:1px solid var(--line);border-radius:var(--radius);font-size:12px;color:var(--ink-dim)}
.rail .step .n{width:18px;height:18px;border-radius:999px;border:1px solid var(--line-strong);display:inline-flex;align-items:center;justify-content:center;font-size:11px}
.rail .step.on{border-color:var(--accent);color:var(--ink)}
.rail .step.on .n{background:var(--accent);border-color:var(--accent);color:#06121f;font-weight:600}
.rail .step.done .n{border-color:var(--ok);color:var(--ok)}

/* Lists: tools, tables, pager. */
.listtools{display:flex;gap:8px;align-items:center;margin:0 0 12px;flex-wrap:wrap}
.searchbox{position:relative;flex:1 1 240px;max-width:360px}
.searchbox input{width:100%;background:#0e1218;border:1px solid var(--line);border-radius:var(--radius);color:var(--ink);padding:8px 12px;font:inherit;font-size:13px}
select{background:#0e1218;border:1px solid var(--line);border-radius:var(--radius);color:var(--ink);padding:8px 12px;font:inherit;font-size:13px}
.toggle{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-dim);border:1px solid var(--line);border-radius:var(--radius);padding:6px 12px}
.toggle.on{color:var(--ink);border-color:var(--accent)}
.listnote{font-size:12px;color:var(--ink-faint);margin:0 0 8px}
.rows{width:100%;border-collapse:collapse;font-size:13px}
.rows th{text-align:left;color:var(--ink-faint);font-weight:500;font-size:11px;letter-spacing:.05em;text-transform:uppercase;padding:0 12px 8px 0;border-bottom:1px solid var(--line);white-space:nowrap}
.rows td{padding:10px 12px 10px 0;border-bottom:1px solid var(--line-soft);vertical-align:middle}
.rows tr.pick{cursor:pointer}
.rows tr.pick:hover td{background:#1e1e23}
.rows tr.sel td{background:#1b2333}
.rows tr.ended td{background:#161619}
.rows tr.open td{background:#17171b}
.rows .key{font-family:var(--mono);color:var(--ink)}
.rows .num{font-family:var(--mono);text-align:right;font-variant-numeric:tabular-nums}
.rows .sub{display:block;font-size:12px;color:var(--ink-faint);margin-top:2px}
.rows .same{color:var(--ink-faint)}
.rows .acts{white-space:nowrap;text-align:right}
.tblstate{padding:40px 24px;text-align:center;color:var(--ink-dim);font-size:13px;border:1px solid var(--line);border-radius:var(--radius);background:var(--panel)}
.tblstate b{color:var(--ink);display:block;margin-bottom:8px;font-size:14px}
.tblstate .btn{margin-top:16px}
.pager{display:flex;gap:8px;align-items:center;margin:12px 0 0;font-size:12px;color:var(--ink-faint);flex-wrap:wrap}
.pager .right{margin-left:auto;display:flex;gap:8px;align-items:center}

/* The dialog, as the record standard draws it: one scrolling card. */
.backdrop{position:fixed;inset:0;z-index:40;background:rgba(6,8,12,.62)}
.dialog{position:fixed;z-index:45;top:9vh;left:50%;transform:translateX(-50%);width:min(820px,94vw);max-height:80vh;overflow:auto;background:var(--panel);border:1px solid var(--line-strong);border-radius:var(--radius);box-shadow:0 20px 60px rgba(0,0,0,.55)}
.dialog .head{padding:20px 24px 0}
.dialog .head h2{font-size:16px}
.dialog .head .note{font-size:12px;color:var(--ink-faint);margin-top:4px}
.dialog .body{padding:16px 24px}
.dialog .foot{padding:16px 24px;border-top:1px solid var(--line);position:sticky;bottom:0;background:var(--panel)}
.footrow{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
.pickline{display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap;border:1px solid var(--line);border-radius:var(--radius);padding:12px 16px;margin:0 0 12px;font-size:13px}
.pickline .k{color:var(--ink-faint);font-size:11px;text-transform:uppercase;letter-spacing:.05em}
.sentence{margin:0 0 16px;font-size:13px;color:var(--ink-dim)}
.sentence b{color:var(--ink);font-weight:500}
.rule{font-size:12px;color:var(--ink-faint);margin:8px 0 0}
.savebar{display:flex;gap:8px;align-items:center;margin:24px 0 0;padding:16px 0 0;border-top:1px solid var(--line);flex-wrap:wrap}
.savebar .right{margin-left:auto;display:flex;gap:8px}
code{font-family:var(--mono);font-size:12px;color:var(--ink-dim)}
.spacer{height:16px}

/* The gaps of a body that could not be assembled. */
.gaps{margin:16px 0 0;border:1px solid #4a3a17;border-radius:var(--radius);background:#241d10}
.gaps .head{padding:12px 16px;border-bottom:1px solid #4a3a17;font-size:13px;color:#efd39a}
.gaps .head b{color:var(--warn)}
.gaps table{width:100%;border-collapse:collapse;font-size:13px}
.gaps th{text-align:left;font-weight:500;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:#c9a75f;padding:8px 16px;border-bottom:1px solid #4a3a17}
.gaps td{padding:10px 16px;border-bottom:1px solid #3a2f15;color:#e8dcc0;vertical-align:top}
.gaps tr:last-child td{border-bottom:none}

/* A verdict on the reproduction of a result. */
.verdict{border-radius:var(--radius);border:1px solid var(--line);padding:16px;margin:0 0 16px}
.verdict h3{font-size:13px;margin:0 0 4px}
.verdict p{margin:0;font-size:13px;color:var(--ink-dim)}
.verdict.ok{border-color:#23543a;background:#12281d}
.verdict.ok h3{color:#a8e6c4}
.verdict.bad{border-color:#5c2a24;background:#2b1614}
.verdict.bad h3{color:#f0b7ae}
.verdict.caution{border-color:#4a3a17;background:#2a2113}
.verdict.caution h3{color:#efd39a}
.diff{width:100%;border-collapse:collapse;font-size:13px;margin:12px 0 0}
.diff th{text-align:left;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-faint);font-weight:500;padding:0 12px 8px 0;border-bottom:1px solid var(--line)}
.diff td{padding:8px 12px 8px 0;border-bottom:1px solid var(--line-soft)}
.diff td.n{font-family:var(--mono);text-align:right;font-variant-numeric:tabular-nums}
.diff td.moved{color:var(--warn);font-family:var(--mono);text-align:right;font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<div class="proto-note">Prototype &middot; mock data &middot; reads no server &middot; doc/prototypes/cuts/the-cut</div>
<header class="shell-head" id="shell"></header>
<main class="page" id="app"></main>
<div class="proto-bar" id="bar"></div>

<script>
(function () {
    'use strict';

    /* ---------------------------------------------------------------- */
    /* The query string is the state, as every prototype here does.       */
    /* ---------------------------------------------------------------- */

    var Q = new URLSearchParams(location.search);
    var S = {
        surface: Q.get('surface') || 'list',
        fcase: Q.get('case') || '',
        tab: Q.get('tab') || 'body',
        cut: Q.get('cut') || '',
        pick: Q.get('pick') || '',
        step: Q.get('step') || '',
        verdict: Q.get('verdict') || '',
        q: Q.get('q') || ''
    };

    /* ---------------------------------------------------------------- */
    /* The fixtures. Everything on the page is one of these.              */
    /* The mock tenant's clock is 07 October 2026, 09:00 UTC.             */
    /* ---------------------------------------------------------------- */

    var NOW = Date.parse('2026-10-07T09:00:00Z');
    var PARTY = 'ACME London';
    var SCOPE = 'LDN-RATES';
    var SCOPE_LONG = 'ACME London \u00b7 LDN rates books';

    var CUTS = [
        { id: 'c1', code: 'EOD', kind: 'End of day', label: 'EOD.ACME-LONDON.2026-10-06',
          instant: '2026-10-06T16:00:00Z', tz: 'Europe/London', cuttime: 'CUT-LONDON-1600',
          scope: SCOPE, state: 'authorised',
          taken_by: 'm.oduya', taken_at: '2026-10-06T16:41:00Z',
          auth_by: 'a.reyes', auth_at: '2026-10-06T17:12:00Z', request: '4b7c1e02',
          part: 'Finance', ordinal: 1, deals: 1284, values: 3912, sets: 7, fixings: 148,
          engine: 'ORE-Studio-7.1', wrapper: 'v1.2.0', build: 'a1f3c9e', runs: 3 },
        { id: 'c2', code: 'EOD', kind: 'End of day', label: 'EOD.ACME-LONDON.2026-10-05',
          instant: '2026-10-05T16:00:00Z', tz: 'Europe/London', cuttime: 'CUT-LONDON-1600',
          scope: SCOPE, state: 'superseded',
          taken_by: 'm.oduya', taken_at: '2026-10-05T16:38:00Z',
          auth_by: 'a.reyes', auth_at: '2026-10-05T17:04:00Z', request: '2f90ba61',
          part: 'Finance', ordinal: 1, deals: 1281, values: 3908, sets: 7, fixings: 146,
          engine: 'ORE-Studio-7.1', wrapper: 'v1.2.0', build: 'a1f3c9e', runs: 2,
          superseded_by: 'c1', superseded_at: '2026-10-06T17:12:00Z' },
        { id: 'c3', code: 'FLASH', kind: 'Flash', label: 'FLASH.ACME-LONDON.2026-10-07',
          instant: '2026-10-07T07:40:00Z', tz: 'UTC', cuttime: '',
          scope: SCOPE, state: 'taken', indicative: true,
          taken_by: 'j.silva', taken_at: '2026-10-07T07:41:00Z',
          auth_by: '', auth_at: '', request: '9e21c4d8',
          part: 'Market Risk', ordinal: 1, deals: 1287, values: 3920, sets: 7, fixings: 149,
          engine: 'ORE-Studio-7.1', wrapper: 'v1.2.0', build: 'a1f3c9e', runs: 1 },
        { id: 'c4', code: 'EOD', kind: 'End of day', label: 'EOD.ACME-LONDON.2026-10-07',
          instant: '2026-10-07T16:00:00Z', tz: 'Europe/London', cuttime: 'CUT-LONDON-1600',
          scope: SCOPE, state: 'incomplete',
          taken_by: 'm.oduya', taken_at: '2026-10-07T08:15:00Z',
          auth_by: '', auth_at: '', request: '',
          part: 'Finance', ordinal: 2, deals: 1284, values: 0, sets: 6, fixings: 149,
          engine: 'ORE-Studio-7.1', wrapper: 'v1.2.0', build: '', runs: 0,
          gaps: [
            { part: 'Market data', item: 'USD-SOFR-3M \u00b7 ACME London',
              why: 'The store holds no observation at or before 07 Oct 16:00Z for the series.',
              remedy: 'Publish a set for the series, or state an instant at which the store holds one.' },
            { part: 'Deals', item: 'IRS-2048-0117',
              why: 'The population read returned the deal with no version current at the instant.',
              remedy: 'Correct the deal, or state why it is absent from the day.' },
            { part: 'Engine and code', item: 'the service build',
              why: 'Nothing records the build of the services that assembled the body.',
              remedy: 'Register the build, or name the version the run will use.' }
          ] },
        { id: 'c5', code: 'IPV', kind: 'Independent verification', label: 'IPV.ACME-LONDON.2026-10-06',
          instant: '2026-10-06T16:00:00Z', tz: 'Europe/London', cuttime: 'CUT-LONDON-1600',
          scope: SCOPE, state: 'taken',
          taken_by: 'j.silva', taken_at: '2026-10-06T18:02:00Z',
          auth_by: '', auth_at: '', request: '7a5e0b3f',
          part: 'Market Risk', ordinal: 1, deals: 1284, values: 3912, sets: 7, fixings: 148,
          engine: 'ORE-Studio-7.1', wrapper: 'v1.2.0', build: 'a1f3c9e', runs: 0 },
        { id: 'c6', code: 'EOD', kind: 'End of day', label: 'EOD.ACME-LONDON.2026-10-04',
          instant: '2026-10-04T16:00:00Z', tz: 'Europe/London', cuttime: 'CUT-LONDON-1600',
          scope: SCOPE, state: 'refused',
          taken_by: 'm.oduya', taken_at: '2026-10-04T16:30:00Z',
          auth_by: 'a.reyes', auth_at: '2026-10-04T17:20:00Z', request: '1c8d7a44',
          part: 'Finance', ordinal: 1, deals: 1276, values: 3901, sets: 7, fixings: 145,
          engine: 'ORE-Studio-7.1', wrapper: 'v1.2.0', build: 'a1f3c9e', runs: 0,
          refused_reason: 'The population omits a deal the desk booked before the close. Take it again.' }
    ];

    /* The cut the run settings of the fixture names. */
    var CONFIG_CUT = 'c1';
    var CONFIG = 'Acme official EOD run settings';
    var DEFINITIONS = ['Group Consolidated Exposure', 'Board Risk Dashboard',
                       'Headline Position', 'NPV'];

    function byId(id) {
        var found = null;
        CUTS.forEach(function (c) { if (c.id === id) found = c; });
        return found;
    }

    /* A cut's consumability, as the run and the picker state it. */
    function consumable(c) {
        if (!c) return { ok: false, why: 'The configuration names no cut, so a run has no body to value.' };
        if (c.state === 'authorised' || c.state === 'superseded')
            return { ok: true, indicative: false };
        if (c.state === 'taken' && c.indicative)
            return { ok: true, indicative: true };
        if (c.state === 'taken')
            return { ok: false, why: 'That cut is taken and nobody has authorised it. ' +
                'The body is fixed and no run may price from it. The request waits on ' + c.part + '.' };
        if (c.state === 'incomplete')
            return { ok: false, why: 'That cut holds no complete body. The gaps are on the cut\u2019s page, ' +
                'and the take resumes once they are closed.' };
        if (c.state === 'draft')
            return { ok: false, why: 'That cut is a draft. No body is fixed, so there is nothing to price from.' };
        return { ok: false, why: 'That cut was refused. ' + (c.refused_reason || '') +
            ' A refusal is terminal, and the remedy is a new take.' };
    }

    /* ---------------------------------------------------------------- */
    /* Small helpers.                                                     */
    /* ---------------------------------------------------------------- */

    function esc(s) {
        return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function dt(ts) {
        if (!ts) return '';
        var d = new Date(ts);
        var m = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][d.getUTCMonth()];
        function p(n) { return (n < 10 ? '0' : '') + n; }
        return p(d.getUTCDate()) + ' ' + m + ' ' + d.getUTCFullYear() + ' ' +
               p(d.getUTCHours()) + ':' + p(d.getUTCMinutes()) + 'Z';
    }

    function rel(ts) {
        if (!ts) return '';
        var mins = Math.round((NOW - Date.parse(ts)) / 60000);
        if (mins < 0) return 'in ' + Math.round(-mins / 60) + ' hours';
        if (mins < 1) return 'just now';
        if (mins < 60) return mins + ' minutes ago';
        var hours = Math.round(mins / 60);
        if (hours < 24) return hours + (hours === 1 ? ' hour ago' : ' hours ago');
        var days = Math.round(hours / 24);
        return days + (days === 1 ? ' day ago' : ' days ago');
    }

    function badge(word, cls) {
        return '<span class="badge ' + cls + '">' + esc(word) + '</span>';
    }

    var STATE_CLS = { draft: 'inactive', incomplete: 'bad', taken: 'pending',
                      authorised: 'ok', refused: 'bad', superseded: 'inactive' };

    function stateBadge(c) {
        if (c.state === 'taken' && c.indicative) return badge('Indicative', 'indicative');
        var word = c.state.charAt(0).toUpperCase() + c.state.slice(1);
        return badge(word, STATE_CLS[c.state] || 'inactive');
    }

    function kindBadge(c) {
        return '<span class="mono">' + esc(c.code) + '</span>';
    }

    function link(href, text) {
        return '<a href="' + href + '">' + esc(text) + '</a>';
    }

    function q(params) {
        var base = { surface: S.surface, fcase: S.fcase, tab: S.tab,
                     cut: S.cut, pick: S.pick, step: S.step, verdict: S.verdict };
        Object.keys(params || {}).forEach(function (k) {
            var v = params[k];
            if (v === undefined || v === null || v === '') delete base[k];
            else base[k] = v;
        });
        var parts = [];
        Object.keys(base).forEach(function (k) {
            var key = k === 'fcase' ? 'case' : k;
            if (base[k]) parts.push(key + '=' + encodeURIComponent(base[k]));
        });
        return '?' + parts.join('&');
    }

    function lastChanged(who, when, reason) {
        return '<p class="rule">Last changed: ' + esc(who) + ' \u00b7 ' + dt(when) + ' \u00b7 ' + esc(reason) + '</p>';
    }

    /* ---------------------------------------------------------------- */
    /* The shell and the bar.                                             */
    /* ---------------------------------------------------------------- */

    var AREAS = ['Home', 'Reference data', 'Organisation', 'Market data', 'Trades',
                 'Requests', 'Operations', 'Reporting', 'Development', 'Tenants'];

    function shell(area) {
        return '<span class="brand">ORE Studio</span><nav>' +
            AREAS.map(function (a) {
                return '<span' + (a === area ? ' class="on"' : '') + '>' + a + '</span>';
            }).join('') +
            '</nav><span class="who">acting in <b>ACME London</b> &middot; <b>m.oduya</b></span>';
    }

    function bar() {
        function b(label, params, on) {
            return '<button class="' + (on ? 'on' : '') + '" data-go="' + q(params) + '">' +
                   esc(label) + '</button>';
        }
        var surfaces = [['Cuts', { surface: 'list', fcase: '' }, 'list'],
                        ['The cut', { surface: 'record', fcase: '' }, 'record'],
                        ['Take a cut', { surface: 'take', fcase: '', step: '1' }, 'take'],
                        ['The picker', { surface: 'pick', fcase: '' }, 'pick'],
                        ['The run', { surface: 'run', fcase: '' }, 'run'],
                        ['Cut times', { surface: 'times', fcase: '' }, 'times'],
                        ['A cut time', { surface: 'time', fcase: '' }, 'time']];
        var cases = [['the day', ''], ['no cuts', 'none'],
                     ['draft', 'draft'], ['incomplete', 'incomplete'],
                     ['taken', 'taken'], ['refused', 'refused'],
                     ['superseded', 'superseded'], ['indicative', 'indicative'],
                     ['loading', 'loading'], ['error', 'error']];
        return '<span class="label">Surface</span>' +
            surfaces.map(function (s) { return b(s[0], s[1], S.surface === s[2]); }).join('') +
            '<span class="sep">&middot;</span><span class="label">State</span>' +
            cases.map(function (c) { return b(c[0], { fcase: c[1] }, S.fcase === c[1]); }).join('');
    }

    /* ---------------------------------------------------------------- */
    /* Surface 1: the cuts list.                                          */
    /* ---------------------------------------------------------------- */

    function visibleCuts() {
        if (S.fcase === 'none') return [];
        var rows = CUTS.slice();
        switch (S.fcase) {
        case 'draft': rows = [draftCut()]; break;
        case 'incomplete': rows = [byId('c4')]; break;
        case 'taken': rows = [byId('c5')]; break;
        case 'refused': rows = [byId('c6')]; break;
        case 'superseded': rows = [byId('c2'), byId('c1')]; break;
        case 'indicative': rows = [byId('c3')]; break;
        }
        if (S.q) {
            var needle = S.q.toLowerCase();
            rows = rows.filter(function (c) {
                return (c.label + ' ' + c.kind).toLowerCase().indexOf(needle) >= 0;
            });
        }
        return rows;
    }

    function draftCut() {
        return { id: 'c9', code: 'EOD', kind: 'End of day', label: 'EOD.ACME-LONDON.2026-10-08',
                 instant: '2026-10-08T16:00:00Z', tz: 'Europe/London', cuttime: 'CUT-LONDON-1600',
                 scope: SCOPE, state: 'draft', taken_by: 'm.oduya', taken_at: '2026-10-07T08:52:00Z',
                 auth_by: '', auth_at: '', request: '', part: 'Finance', ordinal: 1,
                 deals: 0, values: 0, sets: 0, fixings: 0, engine: '', wrapper: '', build: '', runs: 0 };
    }

    function listRows(rows) {
        return rows.map(function (c) {
            var cls = 'pick';
            if (c.state === 'superseded') cls += ' ended';
            if (c.state === 'incomplete' || c.state === 'refused') cls += ' open';
            return '<tr class="' + cls + '" data-cut="' + c.id + '">' +
                '<td class="key">' + esc(c.label) +
                '<span class="sub">' + esc(SCOPE_LONG) + '</span></td>' +
                '<td>' + kindBadge(c) + '<span class="sub">' + esc(c.kind) + '</span></td>' +
                '<td class="mono nowrap">' + dt(c.instant) + '<span class="sub">' + esc(c.tz) + '</span></td>' +
                '<td>' + stateBadge(c) +
                (c.state === 'superseded' ? '<span class="sub">replaced ' + rel(c.superseded_at) + '</span>' : '') +
                (c.state === 'taken' && !c.indicative ? '<span class="sub">waits on ' + esc(c.part) + '</span>' : '') +
                '</td>' +
                '<td>' + esc(c.taken_by) + '</td>' +
                '<td>' + (c.auth_by ? esc(c.auth_by) +
                    '<span class="sub">' + ({ authorised: 'Authorised', refused: 'Refused' }[c.state] || '') + '</span>'
                    : '<span class="dash">&mdash;</span>') + '</td>' +
                '<td class="num">' + c.runs + '</td></tr>';
        }).join('');
    }

    function surfaceList() {
        if (S.fcase === 'loading')
            return listFrame('<div class="tblstate"><b>Loading&hellip;</b>Reading the cuts of this scope.</div>');
        if (S.fcase === 'error')
            return listFrame('<div class="notice error"><b>The cuts could not be read.</b> The server said: ' +
                'reporting.v1.cuts.list answered with an error. <button class="btn small">Retry</button></div>');
        var rows = visibleCuts();
        if (!rows.length) {
            return listFrame('<div class="tblstate"><b>There are no cuts for this scope yet.</b>' +
                'A report that prices from this party has no fixed body to name, so its run is refused ' +
                'before it starts. Take the end of day cut at the close.' +
                '<div><button class="btn primary">Take a cut</button></div></div>' +
                '<p class="rule">Nothing is wrong: a day with no cut is a day whose reports have not been run.</p>');
        }
        var table = '<div class="panel"><table class="rows"><thead><tr>' +
            '<th>Cut</th><th>Kind</th><th>Timepoint</th><th>State</th><th>Taker</th>' +
            '<th>Authoriser</th><th>Runs</th></tr></thead><tbody>' + listRows(rows) +
            '</tbody></table>' +
            '<div class="pager"><span>1\u2013' + rows.length + ' of ' + rows.length + '</span>' +
            '<span class="right">Page size <span class="dash">15</span></span></div></div>' +
            notes(rows);
        return listFrame(table);
    }

    function notes(rows) {
        var out = '';
        var open = rows.filter(function (c) {
            return (c.state === 'taken' && !c.indicative) ||
                   c.state === 'incomplete' || c.state === 'refused';
        });
        if (open.length) {
            out += '<div class="notice warn"><b>' + open.length + ' cut' +
                (open.length === 1 ? ' is' : 's are') + ' not consumable.</b> ' +
                'A run prices only from an authorised cut, so the reports of this scope are refused ' +
                'until the body is signed or retaken. ' +
                open.map(function (c) { return esc(c.label) + ' is ' + esc(c.state) + '.'; }).join(' ') + '</div>';
        }
        out += '<p class="sentence"><b>What a cut is.</b> It fixes the body one valuation reads — the deals, ' +
            'the market data, the reference data, the engine and the code — and it records who took it — so that a later ' +
            'run of the same cut with the same engine reproduces the result.</p>';
        out += '<p class="rule"><b>The order.</b> The timepoint, newest first, so the cut in use is the first ' +
            'row. A superseded cut sits under the one that replaced it and stays readable, because the runs ' +
            'that priced from it still reproduce from it.</p>';
        out += '<p class="rule"><b>Who may take one.</b> A person who holds <code>reporting::cuts:take</code> ' +
            'on this party. The person who takes a cut cannot authorise it: the authorisation is an inbox ' +
            'request decided by another person who holds the part.</p>';
        out += '<div class="gap"><b>Gap.</b> No cut component, table, read or screen exists. No BFF route ' +
            'serves reporting. Every row, count and state on this page is a fixture.</div>';
        return out;
    }

    function listFrame(body) {
        return '<p class="crumbs">Home <span class="sep">&rsaquo;</span> Reporting <span class="sep">&rsaquo;</span> Cuts</p>' +
            '<div class="pagehead"><div><h1>Cuts</h1>' +
            '<p class="lead">The bodies of data this party fixed, and who signed each one.</p></div>' +
            '<div class="actions"><span class="access">Editable</span>' +
            '<button class="btn">Refresh</button>' +
            '<button class="btn primary">Take a cut</button></div></div>' +
            '<div class="listtools"><div class="searchbox"><input placeholder="Search the label or the scope"></div>' +
            '<select><option>Kind: all</option><option>End of day</option>' +
            '<option>Independent verification</option><option>Flash</option>' +
            '<option>Start of day</option></select>' +
            '<select><option>State: all</option><option>Authorised</option><option>Taken</option>' +
            '<option>Incomplete</option><option>Refused</option><option>Superseded</option></select></div>' +
            body;
    }

    /* ---------------------------------------------------------------- */
    /* Surface 2: the cut's record page.                                  */
    /* ---------------------------------------------------------------- */

    function cutForRecord() {
        if (S.cut) {
            var picked = byId(S.cut);
            if (picked) return picked;
        }
        switch (S.fcase) {
        case 'none': return null;
        case 'draft': return draftCut();
        case 'incomplete': return byId('c4');
        case 'taken': return byId('c5');
        case 'refused': return byId('c6');
        case 'superseded': return byId('c2');
        case 'indicative': return byId('c3');
        }
        return byId(CONFIG_CUT);
    }

    function surfaceRecord() {
        if (S.fcase === 'loading')
            return recordFrame(null, '<div class="tblstate"><b>Loading&hellip;</b>Reading the cut.</div>');
        if (S.fcase === 'error')
            return recordFrame(null, '<div class="notice error"><b>The cut could not be read.</b> ' +
                'reporting.v1.cuts.get answered with an error. <button class="btn small">Retry</button></div>');
        var c = cutForRecord();
        if (!c) {
            return '<p class="crumbs">Home <span class="sep">&rsaquo;</span> Reporting ' +
                '<span class="sep">&rsaquo;</span> Cuts</p>' +
                '<div class="pagehead"><div><h1>Cuts</h1></div></div>' +
                '<div class="tblstate"><b>No cut is chosen.</b>Pick a row of the cuts list to read one.</div>';
        }
        var body;
        if (S.tab === 'auth') body = authTab(c);
        else if (S.tab === 'runs') body = runsTab(c);
        else if (S.tab === 'history') body = historyTab(c);
        else body = bodyTab(c);
        return recordFrame(c, body);
    }

    function recordFrame(c, body) {
        var head;
        if (!c) {
            head = '<p class="crumbs">Home <span class="sep">&rsaquo;</span> Reporting ' +
                '<span class="sep">&rsaquo;</span> Cuts</p>' +
                '<div class="pagehead"><div><h1>A cut</h1>' +
                '<p class="lead">Reading the cut.</p></div></div>';
            return head + body;
        }
        var acts = '';
        if (c.state === 'incomplete' || c.state === 'draft')
            acts = '<button class="btn">Resume the take</button>';
        else if (c.state === 'taken' && !c.indicative)
            acts = '<button class="btn">Authorise</button>';
        else if (c.state === 'refused')
            acts = '<button class="btn">Take it again</button>';
        else if (c.state === 'authorised')
            acts = '<button class="btn">Run it again</button>';
        return '<p class="crumbs">Home <span class="sep">&rsaquo;</span> Reporting ' +
            '<span class="sep">&rsaquo;</span> Cuts <span class="sep">&rsaquo;</span> ' + esc(c.label) + '</p>' +
            '<div class="pagehead"><div><h1>' + esc(c.label) + '</h1>' +
            '<p class="lead">' + esc(c.kind) + ' &middot; ' + dt(c.instant) + ' &middot; ' +
            esc(c.tz) + ' &middot; ' + esc(SCOPE_LONG) + '</p></div>' +
            '<div class="actions"><span class="access">' +
            (c.state === 'taken' || c.state === 'authorised' ? 'Read only' : 'Editable') + '</span>' +
            (acts ? acts : '') +
            '<button class="btn">Refresh</button></div></div>' +
            '<div class="tabs">' +
            ['body|The body', 'auth|Authorisation', 'runs|Runs', 'history|History'].map(function (t) {
                var p = t.split('|');
                return '<a class="' + (S.tab === p[0] ? 'on' : '') + '" href="' +
                    q({ surface: 'record', tab: p[0], cut: c.id }) + '">' + p[1] + '</a>';
            }).join('') + '</div>' +
            body;
    }

    function bodyTab(c) {
        var v = consumable(c);
        var head = '';
        if (c.state === 'authorised')
            head = '<div class="notice success"><b>Authorised, so a run may price from it.</b> ' +
                'A second person signed the body, and every figure in a run made from it is this body at ' +
                dt(c.instant) + '.</div>';
        else if (c.state === 'superseded')
            head = '<div class="notice warn"><b>Superseded, and still authorised.</b> A later cut of the same ' +
                'kind and scope replaced it on ' + dt(c.superseded_at) + '. A rerun reproduces an earlier result ' +
                'from it; a new run should normally name the cut in use.</div>';
        else if (c.state === 'taken' && c.indicative)
            head = '<div class="notice info"><b>Indicative, and consumable by its occasion.</b> ' +
                'A flash cut is taken before the day\u2019s data settles, so its authorisation is pending by ' +
                'design and every result priced from it is marked indicative. The request waits on ' +
                esc(c.part) + '.</div>';
        else if (c.state === 'taken')
            head = '<div class="notice info"><b>Taken, and not yet authorised.</b> The body is fixed and ' +
                'nobody has signed it, so no run may price from it. The request ' + esc(c.request) +
                ' waits on ' + esc(c.part) + '.</div>';
        else if (c.state === 'incomplete')
            head = '<div class="notice error"><b>The body could not be assembled.</b> ' +
                'It holds ' + c.gaps.length + ' gaps, and no run may price from it. The take resumes from ' +
                'this page once they are closed.</div>';
        else if (c.state === 'refused')
            head = '<div class="notice error"><b>The authorisation was refused.</b> ' +
                esc(c.refused_reason) + ' A refusal is terminal for this body: no second decision may be ' +
                'taken on it, and the remedy is a new take.</div>';
        else if (c.state === 'draft')
            head = '<div class="notice info"><b>A draft, and not a cut yet.</b> The take began at ' +
                dt(c.taken_at) + ' and no body is fixed. Nothing may price from it.</div>';

        var parts = '<div class="grid2">' +
            '<div class="panel"><h2>The deals</h2>' +
            '<div class="facts">' +
            fact('In the population', c.deals ? String(c.deals) : '\u2014') +
            fact('Live', c.deals ? '1,196' : '\u2014') +
            fact('Expired, fixed or settled', c.deals ? '88' : '\u2014') +
            fact('Corrections inside the body', c.deals ? '3' : '\u2014') +
            '</div><p class="rule">The books of the scope: LDN-RATES-FX, LDN-RATES-IRS, ' +
            'LDN-RATES-BASIS. Every book revalues against the London centre.</p></div>' +
            '<div class="panel"><h2>The market data</h2>' +
            '<div class="facts">' +
            fact('Published sets fixed', c.sets ? String(c.sets) : '\u2014') +
            fact('Values in the snapshot', c.values ? c.values.toLocaleString('en-GB') : '\u2014') +
            fact('Fixings in force', c.fixings ? String(c.fixings) : '\u2014') +
            fact('Rates centre', 'London') +
            '</div><p class="rule">A fixed snapshot: the sets are pinned to the as-of the profile resolved, ' +
            'and a floating snapshot is not a cut.</p></div>' +
            '</div>' +
            '<div class="spacer"></div>' +
            '<div class="grid2">' +
            '<div class="panel"><h2>The reference data</h2>' +
            '<p class="nums">Conventions 11,027 documents &middot; version 14<br>' +
            'Holiday calendars 4 &middot; version 22<br>' +
            'Curve configurations 7 &middot; version 31<br>' +
            'Engine run settings &middot; version 9</p>' +
            '<p class="rule">The versions in force at the timepoint, each a link to that version. ' +
            'Whether the cut holds the version or the identifier is open.</p></div>' +
            '<div class="panel"><h2>The engine and the code</h2>' +
            '<div class="facts">' +
            fact('Engine', c.engine || '\u2014') +
            fact('Wrapper', c.wrapper || '\u2014') +
            fact('Service build', c.build ? c.build : '\u2014') +
            fact('Taken by', c.taken_by) +
            '</div><p class="rule">A result reproduced from another build of the gathering code is not ' +
            'reproduced from the same software.</p></div>' +
            '</div>';

        var gaps = '';
        if (c.gaps) {
            gaps = '<div class="gaps"><div class="head"><b>' + c.gaps.length + ' gaps stop this body.</b> ' +
                'Each names the item, the reason and what would close it.</div><table><thead><tr>' +
                '<th>Part</th><th>Item</th><th>Why it stands</th><th>What closes it</th></tr></thead><tbody>' +
                c.gaps.map(function (g) {
                    return '<tr><td>' + esc(g.part) + '</td><td class="key">' + esc(g.item) + '</td>' +
                        '<td>' + esc(g.why) + '</td><td>' + esc(g.remedy) + '</td></tr>';
                }).join('') + '</tbody></table></div>';
        }

        var identity = '<div class="spacer"></div><div class="panel"><h2>The identity</h2>' +
            '<div class="facts">' +
            fact('Label', '<span class="mono">' + esc(c.label) + '</span>') +
            fact('Kind', esc(c.kind)) +
            fact('Timepoint', '<span class="mono">' + dt(c.instant) + '</span>') +
            fact('Timezone', esc(c.tz)) +
            fact('Cut time', c.cuttime ? '<span class="mono">' + esc(c.cuttime) + '</span>' : '\u2014') +
            fact('Take ordinal', String(c.ordinal)) +
            '</div>' +
            '<p class="rule"><b>Derived, never typed.</b> The label folds the kind, the scope and the date. ' +
            'A retake of the same day carries the next ordinal, so no two cuts can carry one label.</p>' +
            (v.ok ? '' : '<p class="rule" style="color:var(--warn)"><b>Not consumable.</b> ' + esc(v.why) + '</p>') +
            '<div class="gap"><b>Gap.</b> No cut entity exists: these parts are drawn, and no table holds them. ' +
            'The fixed snapshot and the deal copy are the two parts the repository cannot yet produce.</div>' +
            '</div>';

        return head + parts + gaps + identity;
    }

    function fact(k, v) {
        return '<div class="fact"><p class="k">' + esc(k) + '</p><p class="v">' + v + '</p></div>';
    }

    function authTab(c) {
        var rows = '<tr><td>Taken</td><td>' + esc(c.taken_by) + '</td>' +
            '<td class="mono nowrap">' + dt(c.taken_at) + '</td>' +
            '<td class="dim">The body was fixed and the authorisation was raised in one act.</td></tr>';
        if (c.state === 'authorised' || c.state === 'superseded') {
            rows += '<tr><td>Authorised</td><td>' + esc(c.auth_by) + '</td>' +
                '<td class="mono nowrap">' + dt(c.auth_at) + '</td>' +
                '<td class="dim">' + esc(c.part) + ' approved request ' + esc(c.request) + '.</td></tr>';
        } else if (c.state === 'refused') {
            rows += '<tr><td>Refused</td><td>' + esc(c.auth_by) + '</td>' +
                '<td class="mono nowrap">' + dt(c.auth_at) + '</td>' +
                '<td class="dim">' + esc(c.part) + ' refused request ' + esc(c.request) + '.</td></tr>';
        } else if (c.state === 'incomplete' || c.state === 'draft') {
            rows += '<tr><td>Authorisation</td><td class="dash">&mdash;</td><td class="dash">&mdash;</td>' +
                '<td class="dim">Not raised: a body with gaps is not offered for signature.</td></tr>';
        } else {
            rows += '<tr><td>Awaiting</td><td class="dash">&mdash;</td><td class="dash">&mdash;</td>' +
                '<td class="dim">Request ' + esc(c.request) + ' waits on ' + esc(c.part) +
                (c.indicative ? ', and the body is consumable meanwhile because the kind says so.' : '.') +
                '</td></tr>';
        }
        var four = '<div class="notice info"><b>The taker cannot authorise.</b> ' +
            'The inbox refuses a decision by the person who raised the request, and one person approves a ' +
            'request once. Here the taker is <b>' + esc(c.taken_by) + '</b>, so the decision needs another ' +
            'person who holds <code>inbox::approvals:decide_' + esc((c.part || '').toLowerCase().replace(/ /g, '_')) +
            '</code>.</div>';
        var waiting = '';
        if (c.state === 'taken')
            waiting = '<div class="notice warn"><b>It waits on ' + esc(c.part) + '.</b> ' +
                'The request is ' + esc(c.request) + '. One decision authorises it, and a refusal ends it.</div>';
        var label = '<p class="sentence"><b>What the label does not say.</b> The label names the kind, the ' +
            'scope and the date. It says nothing about who signed the body, so the state and the authoriser ' +
            'are read here as facts.</p>';
        return four + waiting +
            '<div class="panel"><h2>The two acts</h2><table class="rows"><thead><tr>' +
            '<th>Act</th><th>Account</th><th>Instant</th><th>What it did</th></tr></thead><tbody>' +
            rows + '</tbody></table></div>' + label +
            '<div class="gap"><b>Gap.</b> Approval requests exist, and no cut raises one: the raise would be ' +
            'the take, and the kind <code>reporting.cut_authorisation</code> is not seeded.</div>';
    }

    function runsTab(c) {
        if (c.state === 'taken' || c.state === 'incomplete' || c.state === 'refused' || c.state === 'draft') {
            return '<div class="panel"><h2>The runs that priced from this cut</h2>' +
                '<p class="sentence">None. A run prices only from an authorised cut, so no run names this body.</p></div>';
        }
        var runs = c.runs ? [
            { id: '#4823', def: 'NPV', when: '2026-10-06T18:05:00Z', state: 'completed',
              engine: c.engine, verdict: 'Reproduced with #4819', ok: true },
            { id: '#4822', def: 'Headline Position', when: '2026-10-06T17:58:00Z', state: 'completed with errors',
              engine: c.engine, verdict: 'Not compared: the run reported errors', ok: false },
            { id: '#4819', def: 'Board Risk Dashboard', when: '2026-10-06T17:22:00Z', state: 'completed',
              engine: c.engine, verdict: 'The original run', ok: true }
        ] : [
            { id: '#4791', def: 'NPV', when: '2026-10-05T18:02:00Z', state: 'completed',
              engine: c.engine, verdict: 'Reproduced with #4790', ok: true },
            { id: '#4790', def: 'Board Risk Dashboard', when: '2026-10-05T17:30:00Z', state: 'completed',
              engine: c.engine, verdict: 'The original run', ok: true }
        ];
        var rows = runs.map(function (r) {
            var st = r.state === 'completed' ? badge('Completed', 'ok') : badge('Completed with errors', 'caution');
            return '<tr class="pick" data-run="' + r.id + '"><td class="key">' + r.id +
                '<span class="sub">' + rel(r.when) + '</span></td>' +
                '<td>' + esc(r.def) + '</td><td>' + st + '</td>' +
                '<td class="mono">' + esc(r.engine) + '</td>' +
                '<td>' + (r.ok ? esc(r.verdict) : '<span class="dim">' + esc(r.verdict) + '</span>') + '</td>' +
                '<td class="acts">' + link(q({ surface: 'run', verdict: r.ok ? 'reproduced' : '', fcase: '' }),
                    'Open the run') + '</td></tr>';
        }).join('');
        var notice = c.state === 'superseded'
            ? '<div class="notice warn"><b>' + runs.length + ' runs rest on this body.</b> ' +
              'The cut was superseded on ' + dt(c.superseded_at) + ' by ' +
              esc((byId(c.superseded_by) || {}).label || '') + '. Every one of them still reproduces ' +
              'from this cut, and none of them names the later one.</div>'
            : '';
        return notice + '<div class="panel"><h2>The runs that priced from this cut</h2>' +
            '<table class="rows"><thead><tr><th>Run</th><th>Report</th><th>State</th>' +
            '<th>Engine version</th><th>Comparison</th><th class="acts"></th></tr></thead><tbody>' +
            rows + '</tbody></table></div>' +
            '<p class="rule">A run refused before the engine is not in this list, because a refusal is not ' +
            'a result.</p>' +
            '<div class="gap"><b>Gap.</b> Nothing reads runs by cut, and a run does not record its cut or its ' +
            'engine version. Both are needed before this tab has a source.</div>';
    }

    function historyTab(c) {
        var entries = [
            { when: c.taken_at, who: c.taken_by, what: 'Took the cut',
              why: 'The body was fixed and the authorisation raised, in one act.' }
        ];
        if (c.auth_at)
            entries.unshift({ when: c.auth_at, who: c.auth_by,
                what: c.state === 'refused' ? 'Refused the cut' : 'Authorised the cut',
                why: c.state === 'refused' ? c.refused_reason
                    : esc(c.part) + ' approved request ' + esc(c.request) + '.' });
        if (c.superseded_at)
            entries.unshift({ when: c.superseded_at, who: 'a.reyes',
                what: 'Superseded by ' + ((byId(c.superseded_by) || {}).label || ''),
                why: 'A later cut of the same kind and scope was authorised and took this one\u2019s place.' });
        var rows = entries.map(function (e) {
            return '<tr><td class="mono nowrap">' + dt(e.when) + '</td><td>' + esc(e.who) + '</td>' +
                '<td>' + esc(e.what) + '</td><td class="dim">' + esc(e.why) + '</td></tr>';
        }).join('');
        return '<div class="panel"><h2>History</h2><table class="rows"><thead><tr>' +
            '<th>Instant</th><th>Account</th><th>Act</th><th>Why</th></tr></thead><tbody>' + rows +
            '</tbody></table></div>' +
            '<p class="rule"><b>The body is immutable once taken.</b> The history of a taken cut has two ' +
            'entries and no more: a change to the body would make every result read from it unreadable.</p>';
    }

    /* ---------------------------------------------------------------- */
    /* Surface 3: the take flow.                                          */
    /* ---------------------------------------------------------------- */

    var KINDS = [
        { code: 'EOD', name: 'End of day', instant: 'The centre\u2019s close, 16:00 Europe/London',
          why: 'The day\u2019s official revaluation of the scope, and the reports built on it', on: true },
        { code: 'SOD', name: 'Start of day', instant: 'The centre\u2019s open, 08:00 Europe/London',
          why: 'Opening a day from a known reference, carried forward from the previous end of day cut', on: false },
        { code: 'IPV', name: 'Independent verification',
          instant: 'The close of the cut it is built on, 16:00 Europe/London',
          why: 'Testing our own marks against values the firm did not produce', on: false },
        { code: 'FLASH', name: 'Flash', instant: 'An instant the process names',
          why: 'An indicative view of value while the day is still moving', on: false }
    ];

    function surfaceTake() {
        var step = S.step || '1';
        if (S.fcase === 'none') {
            return '<p class="crumbs">Home <span class="sep">&rsaquo;</span> Reporting ' +
                '<span class="sep">&rsaquo;</span> Cuts <span class="sep">&rsaquo;</span> Take a cut</p>' +
                '<div class="pagehead"><div><h1>Take a cut</h1></div></div>' +
                '<div class="tblstate"><b>This party holds no centre.</b>' +
                'A cut fixes a body against a rates centre, and no centre answers for this party yet. ' +
                'Ask a tenant administrator to give the books their centre.</div>';
        }
        var body = step === '2' ? takeAssembly()
                 : step === '3' ? takeReview()
                 : step === '4' ? takePress()
                 : takeKind();
        return '<p class="crumbs">Home <span class="sep">&rsaquo;</span> Reporting ' +
            '<span class="sep">&rsaquo;</span> Cuts <span class="sep">&rsaquo;</span> Take a cut</p>' +
            '<div class="pagehead"><div><h1>Take a cut</h1>' +
            '<p class="lead">Four steps over one body. Nothing is fixed until the last press, and the ' +
            'press raises the authorisation with the body.</p></div>' +
            '<div class="actions"><span class="access">Editable</span></div></div>' +
            rail(step) + body;
    }

    function rail(step) {
        var steps = ['Kind and timepoint', 'The body', 'Review', 'Take and authorise'];
        return '<div class="rail">' + steps.map(function (s, i) {
            var n = String(i + 1);
            var cls = 'step' + (n === step ? ' on' : (Number(step) > i + 1 ? ' done' : ''));
            return '<span class="' + cls + '"><span class="n">' + n + '</span>' + esc(s) + '</span>';
        }).join('') + '</div>';
    }

    function takeKind() {
        var rows = KINDS.map(function (k, i) {
            return '<tr class="pick' + (k.on || S.fcase === 'indicative' && k.code === 'FLASH' ? ' sel' : '') +
                '" data-kind="' + k.code + '">' +
                '<td class="key">' + esc(k.code) + '<span class="sub">' + esc(k.name) + '</span></td>' +
                '<td>' + esc(k.instant) + '</td><td class="dim">' + esc(k.why) + '</td></tr>';
        }).join('');
        var flash = S.fcase === 'indicative';
        var instant = flash
            ? '<div class="panel"><h2>The instant this cut fixes</h2>' +
              '<div class="facts">' +
              fact('Instant', '<span class="mono">07 Oct 2026 07:40Z</span>') +
              fact('Timezone', 'UTC') +
              fact('Cut time', '\u2014, the process names the instant') +
              '</div><p class="rule">A process may fix a body at an instant that answers to no schedule ' +
              'and no centre. The instant is stated with its clock, and it may not be in the future.</p></div>'
            : '<div class="panel"><h2>The instant this cut fixes</h2>' +
              '<div class="facts">' +
              fact('Close of the London centre', '<span class="mono">06 Oct 2026 16:00Z</span>') +
              fact('Timezone', 'Europe/London') +
              fact('Cut time', '<span class="mono">CUT-LONDON-1600</span>') +
              '</div><p class="sentence">The close is read from the cut times reference data and drawn ' +
              'so a person reads it. ' + link(q({ surface: 'times' }), 'Read the cut times') + '.</p>' +
              '<p class="rule">A named cut time fixes the time of day on the centre\u2019s own clock, ' +
              'so a clock change moves the instant and not the name.</p></div>';
        return '<div class="card"><h2>What kind of cut is this?</h2>' +
            '<p class="lede">The kind names the occasion. It fixes the instant, the recurrence and the ' +
            'centre, and it says whether the authorisation precedes the values or follows them.</p>' +
            '<div class="panel"><table class="rows"><thead><tr><th>Kind</th><th>What it fixes</th>' +
            '<th>What it is for</th></tr></thead><tbody>' + rows + '</tbody></table></div>' +
            '<div class="spacer"></div>' + instant +
            '<div class="spacer"></div><div class="panel"><h2>The label this cut will carry</h2>' +
            '<p class="mono" style="font-size:15px">' + (flash ? 'FLASH.ACME-LONDON.2026-10-07' :
                'EOD.ACME-LONDON.2026-10-06') + '</p>' +
            '<p class="rule"><b>Derived, never typed.</b> The kind, the scope and the date fold into the ' +
            'label, and a retake of the same day carries the next ordinal.</p></div>' +
            '<div class="spacer"></div><div class="panel"><h2>The scope, and what it decides</h2>' +
            '<p class="nums">' + esc(SCOPE_LONG) + ' &middot; 3 books &middot; London centre</p>' +
            '<p class="rule">A scope is the set of books that revalue together. A scope spanning two centres ' +
            'is refused here rather than discovered at the assembly.</p></div>' +
            '<div class="savebar"><span class="faint">Step 1 of 4</span>' +
            '<div class="right"><button class="btn">Cancel</button>' +
            '<button class="btn primary">Assemble the body</button></div></div></div>';
    }

    function takeAssembly() {
        var incomplete = S.fcase === 'incomplete' || S.fcase === 'draft';
        var c = incomplete ? byId('c4') : byId(CONFIG_CUT);
        var parts = [
            { name: 'The deals', state: 'Closed', cls: 'ok',
              nums: c.deals + ' deals \u00b7 1,196 live \u00b7 88 expired, fixed or settled \u00b7 3 corrections',
              note: 'The population at 06 Oct 16:00Z, copied from the versioned store.' },
            { name: 'The market data', state: incomplete ? 'Open' : 'Closed', cls: incomplete ? 'bad' : 'ok',
              nums: incomplete ? '6 of 7 sets resolved \u00b7 0 values' :
                  c.sets + ' published sets \u00b7 ' + c.values.toLocaleString('en-GB') + ' values \u00b7 ' +
                  c.fixings + ' fixings',
              note: 'A fixed snapshot: every market role resolved to one published set at its as-of.' },
            { name: 'The reference data', state: 'Closed', cls: 'ok',
              nums: 'Conventions v14 \u00b7 calendars v22 \u00b7 curve configurations v31 \u00b7 settings v9',
              note: 'The versions in force at the timepoint, each a link to that version.' },
            { name: 'The engine and the code', state: incomplete ? 'Open' : 'Closed',
              cls: incomplete ? 'bad' : 'ok',
              nums: 'ORE-Studio-7.1 \u00b7 wrapper v1.2.0 \u00b7 build ' + (incomplete ? '\u2014' : 'a1f3c9e'),
              note: 'The engine the work will run and the build of the services that assembled the body.' },
            { name: 'The taking identity', state: 'Closed', cls: 'ok',
              nums: 'm.oduya \u00b7 ACME London \u00b7 07 Oct 2026 08:15Z',
              note: 'Who fixed the body, for whom, and at what instant.' }
        ];
        var rows = parts.map(function (p) {
            return '<tr><td class="key">' + esc(p.name) + '</td>' +
                '<td>' + badge(p.state, p.cls) + '</td>' +
                '<td class="dim">' + esc(p.nums) + '</td>' +
                '<td class="dim">' + esc(p.note) + '</td></tr>';
        }).join('');
        var gaps = '';
        if (incomplete) {
            gaps = '<div class="gaps"><div class="head"><b>' + c.gaps.length + ' gaps stop this body.</b> ' +
                'They do not fail the take: the draft keeps them, and the list is the record.</div>' +
                '<table><thead><tr><th>Part</th><th>Item</th><th>Why it stands</th><th>What closes it</th>' +
                '</tr></thead><tbody>' + c.gaps.map(function (g) {
                    return '<tr><td>' + esc(g.part) + '</td><td class="key">' + esc(g.item) + '</td>' +
                        '<td>' + esc(g.why) + '</td><td>' + esc(g.remedy) + '</td></tr>';
                }).join('') + '</tbody></table></div>';
        }
        var foot = incomplete
            ? '<div class="savebar"><span class="faint">Step 2 of 4</span>' +
              '<div class="right"><button class="btn">Cancel</button>' +
              '<button class="btn">Save as a draft</button></div></div>' +
              '<p class="rule">No <b>Take the cut</b> is drawn while a gap stands: a decider would be asked ' +
              'to sign a body that does not meet the definition.</p>'
            : '<div class="savebar"><span class="faint">Step 2 of 4</span>' +
              '<div class="right"><button class="btn">Cancel</button>' +
              '<button class="btn primary">Review the body</button></div></div>';
        return '<div class="card"><h2>The body, assembled</h2>' +
            '<p class="lede">Every part of the body, what the assembly resolved, and its state. The assembly ' +
            'writes nothing until the last press.</p>' +
            '<div class="panel"><table class="rows"><thead><tr><th>Part</th><th>State</th>' +
            '<th>What it holds</th><th>What it is</th></tr></thead><tbody>' + rows + '</tbody></table></div>' +
            gaps + foot + '</div>';
    }

    function takeReview() {
        var c = byId(CONFIG_CUT);
        var diffs = [
            ['Deals in the population', '1,281', '1,284', '+3'],
            ['Deals that left', '\u2014', '2', '+2'],
            ['Deals whose state moved', '\u2014', '17', '+17'],
            ['Published sets fixed', '7', '7', '\u2014'],
            ['Market data values', '3,908', '3,912', '+4'],
            ['Fixings in force', '146', '148', '+2'],
            ['Curve configurations', 'v30', 'v31', 'moved'],
            ['Engine version', 'ORE-Studio-7.1', 'ORE-Studio-7.1', '\u2014']
        ];
        var rows = diffs.map(function (d) {
            var moved = d[3] !== '\u2014';
            return '<tr><td>' + esc(d[0]) + '</td><td class="num">' + esc(d[1]) + '</td>' +
                '<td class="num">' + esc(d[2]) + '</td>' +
                '<td class="' + (moved ? 'moved' : 'num same') + '">' + esc(d[3]) + '</td></tr>';
        }).join('');
        return '<div class="card"><h2>What this cut holds, against the previous cut</h2>' +
            '<p class="lede">A cut is read against its predecessor, because the movement between two cuts is ' +
            'what the day\u2019s reports state.</p>' +
            '<div class="facts">' +
            fact('Deals', '1,284') + fact('Market data values', '3,912') +
            fact('Published sets', '7') + fact('Gaps', '0') + '</div>' +
            '<div class="panel"><h2>The difference from EOD.ACME-LONDON.2026-10-05</h2>' +
            '<table class="diff"><thead><tr><th>What</th><th>Previous cut</th><th>This cut</th>' +
            '<th>Movement</th></tr></thead><tbody>' + rows + '</tbody></table></div>' +
            '<div class="spacer"></div><div class="panel"><h2>What it decides, and what it does not</h2>' +
            '<p class="sentence"><b>It decides</b> which body one valuation reads, and it records the engine ' +
            'and the code, so a later run of the same cut with the same engine reproduces its result.</p>' +
            '<p class="sentence"><b>It does not decide</b> the day\u2019s prices, the conventions, or how a ' +
            'product is priced: it records what was in force at ' + dt(c.instant) + '.</p></div>' +
            '<div class="spacer"></div><div class="panel"><h2>The authorisation this press will raise</h2>' +
            '<div class="facts">' +
            fact('Part that decides', 'Finance') +
            fact('Raised by', 'm.oduya') +
            fact('Four eyes', 'The taker cannot decide it') +
            '</div><p class="rule">The body is frozen at the press, so what the decider reads is what gets ' +
            'authorised.</p></div>' +
            '<div class="savebar"><span class="faint">Step 3 of 4</span>' +
            '<div class="right"><button class="btn">Back to the body</button>' +
            '<button class="btn primary">Take the cut</button></div></div></div>';
    }

    function takePress() {
        var c = byId(CONFIG_CUT);
        return '<div class="card"><h2>The cut is taken, and the authorisation is raised</h2>' +
            '<p class="lede">The body is frozen. No field changes from here, and the request is with the ' +
            'deciders.</p>' +
            '<div class="notice success"><b>Taken.</b> The body is fixed, the request <b>4b7c1e02</b> was ' +
            'raised for Finance, and the cut is now <b>' + esc(c.label) + '</b>. No run may price from it ' +
            'until somebody signs it.</div>' +
            '<div class="panel"><h2>What the press did</h2><table class="rows"><thead><tr>' +
            '<th>Fact</th><th>Value</th></tr></thead><tbody>' +
            '<tr><td>Body frozen at</td><td class="mono">07 Oct 2026 09:01Z</td></tr>' +
            '<tr><td>Authorisation request</td><td class="mono">4b7c1e02 \u00b7 waits on Finance</td></tr>' +
            '<tr><td>Cut state</td><td>' + badge('Taken', 'pending') + '</td></tr>' +
            '<tr><td>Previous cut of the same kind and scope</td><td>' +
            'EOD.ACME-LONDON.2026-10-05 \u00b7 stays Authorised, becomes Superseded when this one is signed</td>' +
            '</tr></tbody></table></div>' +
            '<div class="spacer"></div>' +
            '<div class="notice info"><b>You cannot authorise this cut.</b> You took it, so the decision ' +
            'needs another person who holds <code>inbox::approvals:decide_finance</code>. The screen does not ' +
            'draw the button, and the inbox would refuse the decision.</div>' +
            '<div class="savebar"><span class="faint">Step 4 of 4</span>' +
            '<div class="right"><button class="btn">Open the cut</button>' +
            '<button class="btn">Back to the cuts</button></div></div></div>';
    }

    /* ---------------------------------------------------------------- */
    /* Surface 4: the picker that consumes a cut.                         */
    /* ---------------------------------------------------------------- */

    function surfacePick() {
        var rows = CUTS.filter(function (c) { return c.state !== 'draft'; });
        if (S.fcase === 'none') rows = [];
        if (S.fcase === 'draft') rows = [draftCut(), byId(CONFIG_CUT)];
        if (S.fcase === 'incomplete') rows = [byId('c4'), byId(CONFIG_CUT)];
        if (S.fcase === 'refused') rows = [byId('c6'), byId(CONFIG_CUT)];
        if (S.fcase === 'taken') rows = [byId('c5'), byId(CONFIG_CUT)];
        if (S.fcase === 'indicative') rows = [byId('c3'), byId(CONFIG_CUT)];
        if (S.fcase === 'superseded') rows = [byId('c2'), byId(CONFIG_CUT)];

        var chosen = S.pick ? CUTS.concat([draftCut()]).filter(function (c) { return c.id === S.pick; })[0] : null;
        var table = rows.length ? '<table class="rows"><thead><tr><th>Cut</th><th>Kind</th>' +
            '<th>Timepoint</th><th>State</th><th>Taker</th><th>Authoriser</th>' +
            '<th>Holdings</th><th>Runs</th></tr></thead><tbody>' +
            rows.map(function (c) {
                var cls = 'pick' + (c.state === 'superseded' ? ' ended' : '') +
                    (c.state !== 'authorised' && c.state !== 'superseded' && !c.indicative ? ' open' : '') +
                    (S.pick === c.id ? ' sel' : '');
                return '<tr class="' + cls + '" data-pick="' + c.id + '">' +
                    '<td class="key">' + esc(c.label) + '<span class="sub">' + esc(SCOPE_LONG) + '</span></td>' +
                    '<td class="mono">' + esc(c.code) + '</td>' +
                    '<td class="mono nowrap">' + dt(c.instant) + '</td>' +
                    '<td>' + stateBadge(c) + '</td>' +
                    '<td>' + esc(c.taken_by) + '</td>' +
                    '<td>' + (c.auth_by || '<span class="dash">&mdash;</span>') + '</td>' +
                    '<td class="num">' + (c.deals ? c.deals.toLocaleString('en-GB') + ' deals &middot; ' +
                        c.values.toLocaleString('en-GB') + ' values' : '\u2014') + '</td>' +
                    '<td class="num">' + c.runs + '</td></tr>';
            }).join('') + '</tbody></table>'
            : '<div class="tblstate"><b>No cut of this party is available.</b>' +
              'Nothing has been taken, so no run can price from a body.</div>';

        return takeFrame('') + '<div class="backdrop"></div>' +
            '<div class="dialog"><div class="head"><h2>Price from a cut</h2>' +
            '<p class="note">The cuts of ACME London, read 07 Oct 2026 08:58Z. A cut that is not authorised ' +
            'is drawn where it sits and refused in the footer, because a run would refuse it.</p></div>' +
            '<div class="body"><div class="listtools">' +
            '<div class="searchbox"><input placeholder="Search the label or the scope"></div>' +
            '<select><option>Kind: all</option><option>End of day</option><option>Flash</option></select>' +
            '<select><option>State: all</option><option>Authorised</option><option>Superseded</option>' +
            '<option>Taken</option><option>Incomplete</option><option>Refused</option></select>' +
            '</div>' + table +
            '<div class="gap"><b>Gap.</b> <code>RecordPicker</code> reads its whole kind once and draws no ' +
            'state, so this is a <code>CutPicker</code> or the shared one gains a filtered form. ' +
            '<code>reporting.v1.cuts.list</code> does not exist.</div></div>' +
            '<div class="foot">' + pickFooter(chosen) + '</div></div>';
    }

    function pickFooter(c) {
        if (!c) return '<p class="faint">Pick the cut this configuration should price from.</p>' +
            '<div class="footrow"><button class="btn">Cancel</button></div>';
        var v = consumable(c);
        var facts = '<div class="pickline">' +
            '<div><p class="k">Cut</p><p class="mono">' + esc(c.label) + '</p></div>' +
            '<div><p class="k">Timepoint</p><p class="mono">' + dt(c.instant) + '</p></div>' +
            '<div><p class="k">State</p><p>' + stateBadge(c) + '</p></div>' +
            '<div><p class="k">Authoriser</p><p>' + (c.auth_by || '<span class="dash">&mdash;</span>') + '</p></div>' +
            '<div><p class="k">Holdings</p><p class="mono">' +
            (c.deals ? c.deals.toLocaleString('en-GB') + ' \u00b7 ' + c.values.toLocaleString('en-GB') : '\u2014') +
            '</p></div></div>';
        if (!v.ok) {
            return facts + '<div class="notice error"><b>That cut is refused.</b> ' + esc(v.why) + '</div>' +
                '<div class="footrow"><button class="btn">Cancel</button></div>';
        }
        if (v.indicative) {
            return facts + '<div class="notice warn"><b>An indicative body.</b> ' +
                'The flash cut carries a pending authorisation because its occasion is before the day settles. ' +
                'Every result priced from it is marked indicative.</div>' +
                '<p class="rule">The cut\u2019s points and its figures are the body at ' + dt(c.instant) + '.</p>' +
                '<div class="footrow"><button class="btn">Cancel</button>' +
                '<button class="btn primary">Price from this cut</button></div>';
        }
        if (c.state === 'superseded') {
            return facts + '<div class="notice info"><b>Superseded, and still authorised.</b> ' +
                'A later cut replaced it on ' + dt(c.superseded_at) + '. A rerun reproduces an earlier result ' +
                'from it, and a new run should normally name the cut in use.</div>' +
                '<div class="footrow"><button class="btn">Cancel</button>' +
                '<button class="btn primary">Price from this cut anyway</button></div>';
        }
        return facts + '<p class="rule">A run prices from this body and from nothing else. ' +
            'The run records the cut, and the cut names the publish record of every market role.</p>' +
            '<div class="footrow"><button class="btn">Cancel</button>' +
            '<button class="btn primary">Price from this cut</button></div>';
    }

    function takeFrame(body) {
        return '<p class="crumbs">Home <span class="sep">&rsaquo;</span> Reporting ' +
            '<span class="sep">&rsaquo;</span> Run settings <span class="sep">&rsaquo;</span> ' +
            esc(CONFIG) + ' <span class="sep">&rsaquo;</span> The cut it prices from</p>' +
            '<div class="pagehead"><div><h1>' + esc(CONFIG) + '</h1>' +
            '<p class="lead">run settings &middot; version 9 &middot; party ACME London &middot; bound by ' +
            DEFINITIONS.length + ' reports</p></div>' +
            '<div class="actions"><span class="access">Editable</span>' +
            '<button class="btn">Refresh</button></div></div>' +
            '<div class="tabs"><span>Details</span><span>Global parameters</span><span>Settings</span>' +
            '<span>Market bindings</span><span class="on">The cut it prices from</span>' +
            '<span>Used by</span><span>History</span></div>' + body;
    }

    /* ---------------------------------------------------------------- */
    /* Surface 5: the run that names the cut.                             */
    /* ---------------------------------------------------------------- */

    function surfaceRun() {
        var verdict = S.verdict || (S.fcase === 'refused' ? 'refused'
            : S.fcase === 'taken' ? 'refused-taken'
            : S.fcase === 'incomplete' ? 'refused-incomplete' : 'reproduced');
        var cut = byId(CONFIG_CUT);
        var refused = verdict.indexOf('refused') === 0;
        var head = refused ? runRefused(verdict, cut) : runPriced(verdict, cut);
        return '<p class="crumbs">Home <span class="sep">&rsaquo;</span> Reporting ' +
            '<span class="sep">&rsaquo;</span> Reports <span class="sep">&rsaquo;</span> ' +
            'Group Consolidated Exposure <span class="sep">&rsaquo;</span> Runs ' +
            '<span class="sep">&rsaquo;</span> ' + (refused ? '#4831' : '#4823') + '</p>' +
            '<div class="pagehead"><div><h1>Run ' + (refused ? '#4831' : '#4823') + '</h1>' +
            '<p class="lead">Group Consolidated Exposure &middot; on-demand &middot; ' +
            (refused ? 'refused' : 'completed clean') + ' &middot; ' +
            (refused ? 'just now' : '1 day ago') + '</p></div>' +
            '<div class="actions"><button class="btn">Refresh</button></div></div>' +
            comparisonStrip(verdict) + head;
    }

    /* Every comparison verdict is one link away, so a reviewer reads all five. */
    function comparisonStrip(current) {
        var opts = [['Reproduced', 'reproduced'], ['Differs', 'differs'],
                    ['Cannot: engine version', 'cannot-engine'],
                    ['Cannot: a part is gone', 'cannot-part'],
                    ['Cannot: retaken body', 'cannot-retake'],
                    ['Refused: a cut not authorised', 'refused-taken'],
                    ['Refused: an incomplete body', 'refused-incomplete'],
                    ['Refused: no cut named', 'refused']];
        return '<div class="listtools"><span class="faint" style="font-size:12px">Compare with:</span>' +
            opts.map(function (o) {
                var on = o[1] === current;
                return '<a href="' + q({ surface: 'run', verdict: o[1], fcase: '' }) + '"' +
                    (on ? ' style="color:var(--ink);border-color:var(--accent)"' : '') +
                    ' class="' + (on ? 'toggle on' : 'toggle') + '">' + esc(o[0]) + '</a>';
            }).join('') + '</div>';
    }

    function runRefused(verdict, cut) {
        var why, market;
        if (verdict === 'refused-taken') {
            why = 'The cut is taken and nobody has authorised it. The body is fixed and no run may price ' +
                'from it. The request waits on Finance.';
            market = 'the cut ' + byId('c5').label + ', taken';
        } else if (verdict === 'refused-incomplete') {
            why = 'The cut holds no complete body. It has 3 gaps, and the take resumes once they are closed.';
            market = 'the cut ' + byId('c4').label + ', incomplete';
        } else {
            why = 'The configuration names no cut, so a run has no body to value.';
            market = 'no cut named';
        }
        return '<div class="notice error"><b>This run was refused, and it says why.</b> ' + esc(why) +
            ' <b>It was refused before the engine was reached</b>, so nothing was priced and no result ' +
            'exists.</div>' +
            '<div class="panel"><h2>The runs of this report, and the body each met</h2>' +
            '<table class="rows"><thead><tr><th>Run</th><th>What the run resolves</th><th>State</th>' +
            '<th>What happened</th></tr></thead><tbody>' +
            '<tr><td class="key">#4831<span class="sub">just now</span></td><td>' + esc(market) + '</td>' +
            '<td>' + badge('Refused', 'bad') + '</td><td>' + esc(why) + '</td></tr>' +
            '<tr><td class="key">#4823<span class="sub">1 day ago</span></td>' +
            '<td>' + esc(byId(CONFIG_CUT).label) + '</td><td>' + badge('Completed', 'ok') + '</td>' +
            '<td>Priced from the cut named beside it</td></tr>' +
            '</tbody></table></div>' +
            '<div class="spacer"></div>' +
            '<div class="panel"><h2>The cut it priced from</h2><p class="sentence">This run never reached ' +
            'the body. A run that was refused has no cut to name, and that is the answer.</p></div>' +
            '<div class="gap"><b>Gap.</b> The gathering steps read the store, not a cut, so the refusal ' +
            'cannot be raised by the server today. <code>reporting.v1.ops.check_cut_consumable</code> is ' +
            'missing.</div>';
    }

    function runPriced(verdict, cut) {
        var v = verdictBox(verdict, cut);
        return '<div class="notice success"><b>The run priced from the cut the configuration names.</b> ' +
            'The run, its package and its numbers are that body at ' + dt(cut.instant) + '.</div>' +
            '<div class="panel"><h2>The runs of this report, and the body each met</h2>' +
            '<table class="rows"><thead><tr><th>Run</th><th>Body the run resolves</th><th>State</th>' +
            '<th>Comparison</th></tr></thead><tbody>' +
            '<tr><td class="key">#4823<span class="sub">1 day ago</span></td>' +
            '<td class="mono">' + esc(cut.label) + '</td><td>' + badge('Completed', 'ok') + '</td>' +
            '<td>Compared with #4819</td></tr>' +
            '<tr><td class="key">#4822<span class="sub">1 day ago</span></td>' +
            '<td class="mono">' + esc(cut.label) + '</td>' +
            '<td>' + badge('Completed with errors', 'caution') + '</td>' +
            '<td class="dim">Not compared: the run reported errors</td></tr>' +
            '<tr><td class="key">#4819<span class="sub">1 day ago</span></td>' +
            '<td class="mono">' + esc(cut.label) + '</td><td>' + badge('Completed', 'ok') + '</td>' +
            '<td class="dim">The original run</td></tr>' +
            '</tbody></table></div>' +
            '<div class="spacer"></div>' + cutCard(cut) + '<div class="spacer"></div>' + v;
    }

    function cutCard(c) {
        return '<div class="panel"><h2>The cut it priced from ' +
            '<span class="sub">run #4823 &middot; read from the run, never from the configuration</span></h2>' +
            '<div class="facts">' +
            fact('Cut', '<span class="mono">' + esc(c.label) + '</span>') +
            fact('Kind', esc(c.kind)) +
            fact('Timepoint', '<span class="mono">' + dt(c.instant) + '</span>') +
            fact('Scope', esc(SCOPE_LONG)) +
            fact('Deals valued', c.deals.toLocaleString('en-GB')) +
            fact('Market data values read', c.values.toLocaleString('en-GB')) +
            fact('Taken by', esc(c.taken_by)) +
            fact('Authorised by', esc(c.auth_by) + ' on ' + dt(c.auth_at)) +
            fact('Engine version', '<span class="mono">' + esc(c.engine) + '</span>') +
            '</div>' +
            '<p class="sentence">The market roles inside the body: pricing resolves to ' +
            '<b>USD-SOFR-3M &middot; ACME London</b> at <b>06 Oct 16:00Z</b>, publish record ' +
            '<b>8f2a4c19</b>, and simulation to <b>EUR-ESTR-6M</b> at the same as-of, publish record ' +
            '<b>2c40f8d1</b>.</p>' +
            '<p class="rule">The run names the cut it used, not the cut the configuration names today: the ' +
            'configuration may move, and a result that moved with it would be unreadable.</p>' +
            '<div class="gap"><b>Gap.</b> <code>report_instance</code> carries <code>priced_at</code> and ' +
            '<code>price_note</code> and nothing that names a cut or an engine version. A run cannot answer ' +
            'this card\u2019s question today.</div></div>';
    }

    function verdictBox(verdict, c) {
