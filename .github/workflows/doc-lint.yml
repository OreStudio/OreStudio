---
name: Doc Lint

on:  # yamllint disable-line rule:truthy
  push:
    branches: [main]
    paths:
      - '**.org'
      - '**.mustache'
      - 'build/scripts/generate_skill*.py'
      - 'build/scripts/check_pattern_uses.py'
      - 'build/scripts/check_prototype_inventory.py'
      - 'doc/prototypes/**'
      - 'projects/ores.lisp/src/ores-build-site.el'
      - 'projects/ores.compass/src/compass.py'
      - '.github/workflows/doc-lint.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: compass lint
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - name: Setup Emacs
        # The link check below parses the org corpus, which is what tells a
        # link from a POSIX class that merely looks like one.
        run: |
          sudo apt-get update
          sudo apt-get install -y emacs-nox

      - name: Validate the org corpus
        # Filetags, generator markers and dangling id links. A dangling
        # link makes its target invisible to search and to graph
        # traversal, and nothing else reports it.
        run: ./projects/ores.compass/compass.sh --no-deps lint

      - name: Check no link target begins with a colon
        # The site build aborts on the first link it cannot resolve, which
        # names one file and only after the merge. Two defects have reached
        # main that way, the second one a =[[:space:]]= written inside an
        # inline verbatim span that an inner = closed early, which org then
        # parses as a link to =:space:=. No link type begins with a colon,
        # so the shape is always a mistake and the check is exact.
        run: |
          emacs -Q --script projects/ores.lisp/src/ores-check-org-links.el

      - name: Check every skill is in the compass- namespace
        # The prefix separates the skills this project owns from every
        # plugin skill the harness also loads.
        run: |
          python3 build/scripts/rename_skills_to_compass_namespace.py --check

      - name: Check the catalogue is current
        # Derived from the SKILL.org sources it lists.
        run: python3 build/scripts/generate_skills_catalogue.py --check

      - name: Check the type tables are current
        # The polymorphic skills dispatch on these. A stale table sends an
        # agent to a command or a document type that has moved.
        run: python3 build/scripts/generate_skill_type_tables.py --check

      - name: Check every skill carries its level
        # A skill with no level is visible at every level, which defeats
        # the attenuation. A skill missing from the table is an error
        # rather than a default, so a new skill needs a considered level.
        run: python3 build/scripts/apply_skill_levels.py --check

      - name: Check every skill links the recipes that own its commands
        # The recipe holds the command and the skill holds the judgement,
        # so drift has one place to be detected rather than two.
        run: python3 build/scripts/link_skill_recipes.py --check

      - name: Check structure notes are reachable from what they order
        # A hub only helps readers who already found it, unless every page
        # it orders points back at it.
        run: python3 build/scripts/link_structure_notes.py --check

      - name: Check every service architecture pattern and its uses link each other
        # A pattern names its uses and a use names its pattern, so a reader
        # who lands on either page finds the other.
        run: python3 build/scripts/check_pattern_uses.py

      - name: Check every prototype is in the inventory
        # The inventory is the only place a prototype is registered, and a
        # prototype is a static page rather than a React route.
        run: python3 build/scripts/check_prototype_inventory.py
