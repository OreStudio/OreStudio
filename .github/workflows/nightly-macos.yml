# yamllint disable rule:line-length
---
name: Nightly MacOS

env:
  VCPKG_BINARY_SOURCES: 'clear;files,${{ github.workspace }}/vcpkg-cache,readwrite'
  SCCACHE_DIR: '${{ github.workspace }}/.sccache'

on:  # yamllint disable-line rule:truthy
  schedule:
    # macOS left the continuous tier: the matrix ran 4h40m to 5h40m on its last
    # green run, too close to the six-hour job limit to run every three hours.
    # It runs once a night, after the Nightly Build and the Nightly Windows run.
    - cron: '0 2 * * *'
  push:
    tags:
      - '*'
  workflow_dispatch:

jobs:
  guard:
    name: relevance-guard
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      should_build: ${{ steps.guard.outputs.should_build }}
    steps:
      - uses: actions/checkout@v7
        # The guard is a local action, and a local action is read from the
        # workspace: skip this checkout and the job fails before its first step
        # with "Can't find 'action.yml'". Only a scheduled run reads the tree,
        # so the shallow clone of a manual or tag run is wasted work, but the
        # job cannot tell its action apart without it.
        with:
          fetch-depth: 0

      - uses: ./.github/actions/relevance-guard
        id: guard

  build:
    needs: guard
    if: needs.guard.outputs.should_build == 'true'
    name: ${{matrix.family}}-${{matrix.compiler}}-${{matrix.buildtype}}-ninja
    concurrency:
      group: ci-${{github.ref}}-${{github.job}}-${{matrix.family}}-${{matrix.compiler}}-${{matrix.buildtype}}-ninja
      cancel-in-progress: false
    runs-on: macos-26
    environment: CI
    strategy:
      fail-fast: false
      matrix:
        name: [macos-clang]
        buildtype: [debug, release]
        include:
          - name: macos-clang
            family: macos
            compiler: clang
    steps:
      - name: Free disk space
        # The macOS image ships several SDKs and simulator runtimes a C++ build
        # never touches, and this workflow has no cleanup of its own, so the
        # debug job has already died linking with "No space left on device".
        # Xcode 26 is kept: the next step selects it.
        run: |
          echo "=== Disk space before cleanup ==="
          df -h
          for xcode in /Applications/Xcode_*.app; do
            case "$xcode" in
              *Xcode_26*) ;;
              *) sudo rm -rf "$xcode" ;;
            esac
          done
          # Simulator runtimes are the bulk that a ctest run never loads.
          sudo rm -rf /Library/Developer/CoreSimulator/Profiles/Runtimes
          rm -rf ~/Library/Developer/CoreSimulator
          rm -rf ~/Library/Developer/Xcode/DerivedData
          rm -rf ~/Library/Developer/Xcode/iOS\ DeviceSupport
          rm -rf ~/Library/Developer/Xcode/watchOS\ DeviceSupport
          rm -rf ~/Library/Developer/Xcode/tvOS\ DeviceSupport
          # Runtimes and SDKs for languages this build does not use.
          sudo rm -rf ~/Library/Android/sdk
          sudo rm -rf /usr/local/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/.ghcup
          brew cleanup -s || true
          rm -rf ~/Library/Caches/Homebrew || true
          echo "=== Disk space after cleanup ==="
          df -h

      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Select Xcode 26
        run: |
          xcode26=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [[ -z "$xcode26" ]]; then
            echo "No Xcode 26.x found — keeping default"
          else
            echo "Selecting $xcode26"
            sudo xcode-select -s "$xcode26"
            xcodebuild -version
          fi

      # Apple's libc++ has lagged the C++20 library, and ores.platform carries
      # a fallback for each gap: jthread and stop_token, and the atomic
      # shared_ptr. The feature macros say which of them this toolchain now has,
      # so the log shows when a fallback can go. A missing macro prints nothing
      # for that name.
      - name: Report the C++ library features
        run: |
          xcrun clang++ --version
          printf '#include <version>\n' \
            | xcrun clang++ -std=c++23 -x c++ -dM -E - \
            | grep -E '__cpp_lib_(jthread|atomic_shared_ptr|stop_token)' || true

      # sccache is NOT cached across runs on this platform (deliberately —
      # see story canary_ctest_ignores_cancellation): GitHub's actions/cache
      # is capped at a fixed 10 GB per repository, shared across every
      # OS/compiler/buildtype variant. Linux CI jobs run on every PR, so
      # they get the shared quota; macOS only runs on a schedule/tag push and
      # doesn't need to compete for it. Revisit if/when sccache moves to an
      # external cache backend (see the sccache_external_cache_backend
      # backlog capture) that isn't quota-shared.
      # sccache is NOT kept across runs on this platform (deliberately -- see
      # story canary_ctest_ignores_cancellation): GitHub's actions/cache is
      # capped at a fixed 10 GB per repository, shared across every
      # OS/compiler/buildtype variant. Linux CI jobs run on every PR, so they get
      # the shared quota; macOS only runs on a schedule/tag push and doesn't need
      # to compete for it. Revisit if/when sccache moves to an external cache
      # backend (see the sccache_external_cache_backend backlog capture) that
      # isn't quota-shared.
      - uses: ./.github/actions/setup-sccache
        with:
          variant: ${{matrix.family}}-${{matrix.compiler}}-${{matrix.buildtype}}-ninja
          restore: 'false'
          max-size: '2000M'

      - uses: ./.github/actions/build-leg
        with:
          family: ${{matrix.family}}
          compiler: ${{matrix.compiler}}
          buildtype: ${{matrix.buildtype}}
          tier: nightly
          persist-cache: 'false'

  attach_package:
    name: Attach packages to the release
    needs: build
    # Attach what passed, so one failed build does not cost the others.
    if: ${{ !cancelled() && github.ref_type == 'tag' && needs.build.result != 'skipped' }}
    # A called workflow can only downgrade the token its caller passes, so the
    # caller grants what the attachment asks for. Without this line the platform
    # refuses the whole workflow at start, before any job runs.
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/attach-package.yml
    with:
      pattern: macos-*-release-ninja
