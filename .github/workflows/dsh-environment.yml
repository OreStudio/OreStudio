---
name: DSH Environment

on:  # yamllint disable-line rule:truthy
  push:
    branches: [main]
    paths:
      - 'projects/ores.dsh_environment/**'
      - '.github/workflows/dsh-environment.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The plugin is a DSH profile bundle, not a CMake component and not part of
  # ores.web, so no other workflow reaches it. Its browser half is served to the
  # harness verbatim, which means a syntax error there is only ever caught by a
  # person looking at a blank panel.
  plugin:
    name: plugin
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Manifest and bundle wiring
        # The loader resolves this plugin by name and follows its exports; a
        # renamed id, a moved path or a renamed seat fails the browser roster
        # silently.
        run: node scripts/check-manifest.mjs
        working-directory: projects/ores.dsh_environment
      - name: Client bundle parses
        # Served verbatim to the browser, so a parse error is invisible until
        # the panel fails to appear.
        run: node --check lib/client.js
        working-directory: projects/ores.dsh_environment
      - name: Host tests
        run: node --test
        working-directory: projects/ores.dsh_environment
      - name: The compass verb this plugin reads exists
        # The plugin shells out to `compass env status --json`. --help parses
        # before compass reads .env, so this needs no database and no
        # environment, and it fails loudly if the verb is renamed or dropped.
        run: ./projects/ores.compass/compass.sh env status --help
