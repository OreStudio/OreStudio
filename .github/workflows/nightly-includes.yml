# yamllint disable rule:line-length
---
name: Nightly Include Hygiene

on:  # yamllint disable-line rule:truthy
  schedule:
    - cron: '0 3 * * *'  # 03:00 UTC every night, an hour after Nightly Format
  workflow_dispatch:      # allow manual trigger

permissions:
  contents: write
  pull-requests: write

jobs:
  image:
    name: ci-image-ref
    # clang-tidy runs in the CI image of the commit it checks. ci-image.yml
    # publishes that tag when the image inputs change on main.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      ref: ${{ steps.ref.outputs.ref }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          sparse-checkout: |
            build/docker/ci
          sparse-checkout-cone-mode: false

      - name: Name the image
        id: ref
        run: |
          ref="$(build/docker/ci/build.sh --image ghcr.io/orestudio/ores-ci --print-ref)"
          echo "ref=${ref}" >> "$GITHUB_OUTPUT"
          echo "Image: ${ref}"

  includes:
    name: misc-include-cleaner
    needs: image
    runs-on: ubuntu-24.04
    container:
      image: ${{ needs.image.outputs.ref }}
    # A container job runs its steps with sh, but the runner runs them with
    # bash -e. The steps use [[ and process substitution, which sh does not
    # have. Plain "bash" would also add pipefail, which the steps do not expect.
    defaults:
      run:
        shell: bash -e {0}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          submodules: recursive  # vcpkg toolchain lives in the submodule

      - name: Trust the workspace
        # The container runs as root and the runner owns the workspace, so git
        # refuses the repository without this.
        run: git config --global --add safe.directory "${GITHUB_WORKSPACE}"

      - name: Point the caches at the container workspace
        # github.workspace holds the runner path, /home/runner/work, but the
        # container mounts the workspace at /__w. The cache steps save the
        # container path, so vcpkg and sccache must write there.
        run: |
          echo "VCPKG_BINARY_SOURCES=clear;files,${GITHUB_WORKSPACE}/vcpkg-cache,readwrite" >> "$GITHUB_ENV"
          echo "SCCACHE_DIR=${GITHUB_WORKSPACE}/.sccache" >> "$GITHUB_ENV"

      - name: Use clang for the C ports
        # The image has clang first on PATH. CC and CXX send the vcpkg C ports
        # to it too, so the vcpkg cache of the clang build matches.
        run: |
          llvm_major="$(sed -n 's/^LLVM_MAJOR=//p' build/docker/ci/versions.env)"
          echo "CC=/usr/lib/llvm-${llvm_major}/bin/clang" >> "$GITHUB_ENV"
          echo "CXX=/usr/lib/llvm-${llvm_major}/bin/clang++" >> "$GITHUB_ENV"

      - name: Cache vcpkg binary packages
        # Same key the continuous-linux workflow uses, so the nightly
        # run reuses the main CI's cache instead of rebuilding deps.
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/vcpkg-cache
          key: vcpkg-linux-clang-debug-ninja-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-linux-clang-debug-ninja-

      - name: run-vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          doNotCache: false

      - name: Configure (compile_commands.json only)
        # Configure-only: the include check parses translation units
        # from compile_commands.json, so the long compile step is not
        # needed. vcpkg installs its dependencies during configure.
        run: cmake --preset linux-clang-debug-ninja

      - name: Run clang-tidy misc-include-cleaner in-place
        run: ./build/scripts/check_includes.sh linux-clang-debug-ninja --fix

      - name: Create pull request if files changed
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: bot/nightly-includes
          commit-message: '[format] Nightly include-cleaner run'
          title: '[format] Nightly include-cleaner run'
          # Stage only the project sources. Without this the
          # action stages the whole workspace, so the LLVM install at
          # ./llvm and the vcpkg cache at ./vcpkg-cache ride along and
          # GitHub rejects the push for files over its 100 MB limit.
          add-paths: |
            projects
          body: |
            Automated nightly clang-tidy misc-include-cleaner pass.

            This PR was raised by the `nightly-includes` workflow because one or
            more C++ source files use a symbol without a directly-included
            header declaring it (e.g. `std::to_string` without the `string`
            header, which breaks the MSVC build), or include a header nothing
            uses. Review and merge to keep the tree clean.

            Fixes to generated files should go into their codegen
            templates instead. Hand-edited generated output fails the
            Codegen drift check (codegen-drift.yml), which runs
            check_component_drift.py over the components in its
            drift-free registry. Reproduce locally:

            ```sh
            cmake --preset linux-clang-debug-ninja
            ./build/scripts/check_includes.sh linux-clang-debug-ninja --fix
            ```
          labels: formatting,automated
          delete-branch: true
