# Deployed by `compass build` to
# ~/.config/systemd/user/app-build-.slice.d/50-limits.conf.
# Source of truth: projects/ores.compass/src/systemd/app-build-.slice.d/50-limits.conf.
#
# WS-7 change 2 of systemd-resource-management-plan.org: a dash-truncated
# template drop-in (same mechanism as app-claude-.slice.d/, see
# compass_claude.py) so every app-build-<env>.slice systemd creates on
# demand -- one per environment currently holding a build-lock slot --
# picks up the same limits, with no per-environment unit file needed.
#
# Values are this task's own estimate, NOT measured -- the plan explicitly
# left build-slice numbers as an open question ("what MemoryHigh/MemoryMax
# values are actually right... run systemd-cgtop across a normal working
# day first and set them from observed peaks", same caveat WS-1's 6G/9G
# started from). Sized for the heavier of the two build-lock slots (slot
# 'a', -j3): a template-heavy C++ translation unit costs on the order of
# 1-3 GiB, so -j3 alone is plausibly 3-9 GiB transient, before a link step.
# Revisit from real systemd-cgtop peaks once this has run for a while.
#
# Deliberately omits app-claude-.slice.d/'s TasksMax and
# ManagedOOMMemoryPressure=kill: a build's task/process count is bounded by
# -j (never anywhere near TasksMax=4096's headroom, unlike an
# open-ended interactive session), and pressure-based killing mid-build
# would produce a confusing partial/corrupted build rather than a clean
# failure -- MemoryMax's hard cgroup-local OOM is the intended kill
# mechanism here, not gradual pressure eviction.

[Slice]
MemoryAccounting=yes
CPUAccounting=yes
IOAccounting=yes
TasksAccounting=yes

MemoryHigh=8G
MemoryMax=12G
MemorySwapMax=3G

CPUWeight=100
IOWeight=50
