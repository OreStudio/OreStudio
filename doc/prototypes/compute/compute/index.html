<!--
  PROTOTYPE. Throwaway. Mock data, no backend, no build step.

  The compute grid's five use cases, from
  doc/knowledge/journeys/compute/compute.org: watch the grid, follow a job,
  diagnose a failure, plan the capacity, and keep what the grid runs. One
  screen per use case, navigable with ?screen=watch|job|failure|capacity|versions.

  Every chart in "The charts a grid needs" is drawn here, hand-rolled as
  inline SVG from a seeded mock series, so the walk repeats exactly.

  The watch screen carries a fourth tab, Usage, for the global view: which
  tenant is using the grid. It reads the usage ledger the installation keeps
  about its own operation, as sprint_27's "Name the installation's own data"
  and "Account for the grid's usage" decide, so it needs no cross-tenant read.
  The Allocation by tenant chart moved there from the capacity screen and no
  longer stands alone.

  Two actor variants, switchable with ?variant=fleet|tenant. The fleet
  variant is the super administrator reading the whole installation. The
  tenant variant narrows the work rows to one tenant and withholds one
  control, the node log download, because a node's logs are the
  installation's and may carry another tenant's inputs. There is one set of
  screens, not two.

  The bar at the foot of the page prints the screen's whole state.
-->
