<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Curve configuration in the products shape prototype — Reporting prototypes</title>
<style>
:root{color-scheme:dark;--bg:#121214;--panel:#1a1a1e;--panel-2:#26262b;--line:#30363d;--line-soft:#21262d;--ink:#e3e3e6;--ink-dim:#a1a1aa;--ink-faint:#71717a;--accent:#58a6ff;--accent-dim:#21262d;--ok:#3fb950;--warn:#d29922;--bad:#f85149;--radius:.5rem;--mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink)}
body{margin:0;font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;padding:2.5rem 1.5rem 8rem}
h1,h2,h3{margin:0;font-weight:600}h1{font-size:1.15rem}h2{font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-dim)}
p{margin:0}ul{margin:0;padding:0;list-style:none}a{color:var(--accent);text-decoration:none}
button,input,select{font:inherit;color:inherit}button{cursor:pointer}
.mono{font-family:var(--mono)}.muted{color:var(--ink-dim)}.faint{color:var(--ink-faint)}
.wrap{max-width:1080px;margin:0 auto;display:grid;gap:14px}
.top{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px;display:grid;gap:10px}
.panel>h2{border-bottom:1px solid var(--line-soft);padding-bottom:6px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.field{display:grid;gap:4px;min-width:170px}.field label{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-faint)}
.field .value,.field select,.field input{background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:6px 8px}
table{width:100%;border-collapse:collapse;font-size:.86rem}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line-soft)}
th{font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-faint);font-weight:600}
td.num{text-align:right;font-family:var(--mono)}
.btn{background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:7px 12px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#0d1117;font-weight:600}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.tag{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:1px 8px;font-size:.72rem;color:var(--ink-dim)}
.tag.ok{color:var(--ok);border-color:#1f4d29}.tag.bad{color:var(--bad);border-color:#5a2320}.tag.warn{color:var(--warn);border-color:#4a3a17}
.notice{border:1px dashed var(--line);border-radius:var(--radius);padding:10px 12px;color:var(--ink-dim);background:#161619}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:820px){.grid2{grid-template-columns:1fr}}
.proto-note{position:fixed;top:0;left:0;right:0;z-index:60;padding:6px 14px;background:repeating-linear-gradient(45deg,#2a2113,#2a2113 10px,#241d11 10px,#241d11 20px);border-bottom:1px solid #4a3a17;color:var(--warn);font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.proto-bar{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:60;display:flex;gap:2px;align-items:center;padding:5px 7px;background:#0b0e13;border:1px solid var(--line);border-radius:999px;box-shadow:0 8px 30px rgba(0,0,0,.6);font-size:12px;max-width:95vw;flex-wrap:wrap;justify-content:center}
.proto-bar button{background:none;border:none;color:var(--ink-dim);padding:6px 10px;border-radius:999px}
.proto-bar button:hover{background:var(--panel-2);color:var(--ink)}.proto-bar button.on{background:var(--accent-dim);color:var(--ink)}
.proto-bar .label{padding:0 8px}.proto-bar .sep{color:var(--line)}

.tag.off{color:#9ca3af;border-color:#374151}
.crumbs{font-size:.8rem;color:var(--ink-dim);display:flex;gap:6px;flex-wrap:wrap}
.titlebar{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.titlebar h1{font-size:1.3rem}.titlebar .sub{color:var(--ink-dim);margin-top:2px}
.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn.danger{color:var(--bad);border-color:#5a2320}.btn.ghost{background:none;border-color:transparent;color:var(--ink-dim);padding:2px 8px}.btn.ghost:hover{color:var(--ink);border-color:var(--line)}
.access{display:inline-flex;gap:5px;align-items:center;border:1px solid var(--line);border-radius:999px;padding:2px 9px;font-size:.78rem;color:var(--ink-dim)}
.tabbar{display:flex;gap:4px;border-bottom:1px solid var(--line)}
.tabbar a{padding:8px 14px;color:var(--ink-dim);border-bottom:2px solid transparent}.tabbar a.on{color:var(--ink);border-bottom-color:var(--accent)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius)}
.card .body{padding:16px;display:grid;gap:16px 20px;grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:900px){.card .body{grid-template-columns:repeat(2,minmax(0,1fr))}}
.card .foot{border-top:1px solid var(--line-soft);padding:10px 16px;color:var(--ink-faint);font-size:.8rem}
.dl .k{font-size:.78rem;color:var(--ink-faint)}.dl .v{margin-top:2px}.dl.wide{grid-column:1/-1}
a.link{color:var(--ink);text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:2px}a.link:hover{text-decoration-color:var(--accent)}
.listbar{display:flex;gap:10px;align-items:center;padding:10px;border-bottom:1px solid var(--line-soft)}.listbar input{flex:1;background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:7px 10px}
.listbar select{background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:7px 10px}
tr.rec{cursor:pointer}tr.rec:hover td,tr.rec:focus td{background:#1d1d22;outline:none}
th.sort{cursor:pointer}
.pager{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 12px;color:var(--ink-dim);font-size:.85rem;border-top:1px solid var(--line-soft);flex-wrap:wrap}
.hist{display:grid;grid-template-columns:18rem 1fr;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:var(--panel)}
@media(max-width:820px){.hist{grid-template-columns:1fr}}
.hist ol{margin:0;padding:0;list-style:none;border-right:1px solid var(--line)}
.hist li{padding:10px 12px;border-bottom:1px solid var(--line-soft);cursor:pointer;display:grid;gap:2px}.hist li.on{background:#1d2530;box-shadow:inset 3px 0 var(--accent)}
.hist .cmp{padding:12px;display:grid;gap:10px;align-content:start}
.diff{font-family:var(--mono);font-size:.82rem}.diff .rm{background:#2a1517;color:#ffb3ad;padding:2px 8px}.diff .ad{background:#10261a;color:#9be9a8;padding:2px 8px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}.seg button{border:none;background:none;padding:5px 10px;color:var(--ink-dim)}.seg button.on{background:var(--accent-dim);color:var(--ink)}
.chart{display:flex;align-items:flex-end;gap:4px;height:48px;overflow-x:auto}.bar{width:14px;display:flex;flex-direction:column-reverse;cursor:pointer;flex:none}.bar i{display:block;width:100%}
.axis{display:flex;justify-content:space-between;font-size:.75rem;color:var(--ink-faint);margin-top:4px}.legend{display:flex;gap:14px;font-size:.78rem;color:var(--ink-dim);margin-top:6px}.legend i{display:inline-block;width:9px;height:9px;margin-right:5px;border-radius:2px}
.avatar{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--panel-2);border:1px solid var(--line);font-size:.7rem;color:var(--ink-dim)}
.dlg-bg{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:18px}
.dlg{width:min(600px,96vw);background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);display:grid}
.dlg header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line-soft)}.dlg header h2{font-size:1rem;text-transform:none;letter-spacing:0;color:var(--ink)}
.dlg .dbody{padding:16px;display:grid;gap:14px}.dlg footer{display:flex;gap:8px;justify-content:flex-end;padding:12px 16px;border-top:1px solid var(--line-soft)}
.field select,.field input[type=text],.field textarea{width:100%;min-width:0;background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:7px 8px}.field textarea{min-height:64px}.field .help{font-size:.78rem;color:var(--ink-faint)}
.warnbox{border:1px solid #4a3a17;background:#201a0e;color:var(--warn);border-radius:var(--radius);padding:8px 10px}
.okbox{border:1px solid #1f4d29;background:#0f1d14;color:var(--ok);border-radius:var(--radius);padding:8px 10px}
.badbox{border:1px solid #5a2320;background:#231211;color:var(--bad);border-radius:var(--radius);padding:8px 10px}
.journey { display: grid; grid-template-columns: 14rem 1fr; gap: 2rem; align-items: start; }
@media (max-width: 820px) { .journey { grid-template-columns: 1fr; } }
.railnav ol { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 0.25rem; }
.railentry {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    border-radius: 0.375rem;
    padding: 0.5rem 0.75rem;
    font-size: 0.875rem;
}
.railentry.done { color: var(--ink-dim); }
.railentry.current { background: var(--panel-2); color: var(--ink); font-weight: 500; }
.railentry.ahead { color: var(--ink-faint); }
.railmark {
    display: grid;
    place-items: center;
    width: 1.5rem;
    height: 1.5rem;
    flex: 0 0 1.5rem;
    border-radius: 999px;
    border: 1px solid var(--line);
    font-size: 0.75rem;
}
.railmark.done { border-color: var(--ok); color: var(--ok); }
.railmark.current { border-color: var(--accent); color: var(--accent); }
.railmark.ahead { border-color: var(--line); color: var(--ink-faint); }
.stepfoot {
    margin-top: 1.5rem;
    border-top: 1px solid var(--line);
    padding-top: 1rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.75rem;
}
.ml-auto { margin-left: auto; }
.journey{margin-top:6px}.stepcard{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px;display:grid;gap:14px}
.stepcard>h2{font-size:1.1rem;text-transform:none;letter-spacing:0;color:var(--ink)}.stepcard .lead{color:var(--ink-dim)}
.railentry{cursor:pointer}.railtag{margin-left:auto;font-size:.7rem;color:var(--ink-faint)}
.mark{background:#201a0e}.chk{width:auto;min-width:0}
td .sel{background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:4px 6px;max-width:100%}
.btn.small{padding:3px 9px;font-size:.8rem}.diffrow td{font-family:var(--mono);font-size:.82rem}
.rm{background:#2a1517;color:#ffb3ad}.ad{background:#10261a;color:#9be9a8}
.statline{display:flex;gap:18px;flex-wrap:wrap;color:var(--ink-dim)}.statline b{color:var(--ink)}
.btn{white-space:nowrap;display:inline-block;text-decoration:none}a.btn{color:var(--ink)}a.btn.primary{color:#0d1117}
details.menu{position:relative;display:inline-block}details.menu>summary{list-style:none;cursor:pointer}details.menu>summary::-webkit-details-marker{display:none}
details.menu .items{position:absolute;right:0;top:110%;z-index:20;min-width:16rem;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);display:grid;padding:4px}
details.menu .items a{padding:8px 10px;border-radius:6px;color:var(--ink)}details.menu .items a:hover{background:var(--panel-2)}
.field label.plain,label.plain{text-transform:none;letter-spacing:0;font-size:inherit;color:var(--ink);display:block}
label.plain{white-space:nowrap}
.tag.info{color:#3b82f6;border-color:#1e3a8a}.tag.cls{color:#8b5cf6;border-color:#3b2a66}

.tl{display:grid;margin-top:4px}.daydiv{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-faint);padding:12px 0 4px;border-bottom:1px solid var(--line-soft)}
.tl .item{display:grid;grid-template-columns:96px 14px 1fr;gap:0 8px;scroll-margin-top:16px}.tl .item.mark{background:#1d2530}
.tl .gut{display:flex;justify-content:flex-end;gap:6px;padding-top:9px;font-family:var(--mono);font-size:.72rem;color:var(--ink-faint)}
.tl .rail{position:relative;display:flex;justify-content:center}.tl .rail:before{content:"";position:absolute;top:0;bottom:0;width:1px;background:var(--line)}
.tl .dot{position:relative;margin-top:13px;width:9px;height:9px;border-radius:50%;border:1px solid var(--ink-faint);background:var(--bg)}
.tl .dot.ok{border-color:var(--ok)}.tl .dot.info{border-color:var(--accent)}.tl .dot.warn{border-color:var(--warn)}.tl .dot.bad{border-color:var(--bad)}
.tl .body{display:grid;gap:5px;padding:8px 0 12px;min-width:0}
.tl .head{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}.tl .who{font-weight:600}.tl .did{color:var(--ink-dim)}
.tl .note{color:var(--ink-dim);font-style:italic;font-size:.85rem}
.tl details summary{cursor:pointer;color:var(--ink-faint);font-size:.8rem;width:fit-content}.tl details>div{margin-top:6px}
.evchart{border:1px solid var(--line-soft);border-radius:var(--radius);padding:8px 12px;display:grid;gap:6px;margin:8px 0}
.evchart .bars{display:flex;align-items:flex-end;gap:2px;height:96px;overflow-x:auto;border-bottom:1px solid var(--line)}
.evchart .bar{flex:none;width:14px;height:100%;display:flex;flex-direction:column-reverse;padding:0;border:0;background:none;cursor:pointer}.evchart .bar:hover{background:var(--panel-2)}
.evchart .span{display:flex;justify-content:space-between;font-size:.7rem;color:var(--ink-faint)}
.evchart .leg{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.75rem;color:var(--ink-dim)}.evchart .leg i,.evchart .bar i{display:block;border-radius:2px}.evchart .leg i{display:inline-block;width:10px;height:10px;margin-right:6px}
.k-ok{background:var(--ok)}.k-info{background:var(--accent)}.k-warn{background:var(--warn)}.k-bad{background:var(--bad)}.k-off{background:var(--ink-faint)}
.gh{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--line-soft)}
.pn{border:1px dashed #4a3a17;border-radius:var(--radius);padding:8px 12px;color:var(--warn);background:#161208;font-size:.8rem}
.card table td:first-child,.card table th:first-child{padding-left:16px}
.setting{padding:14px 16px;border-top:1px solid var(--line-soft);display:grid;gap:8px}.setting:first-of-type{border-top:0}
.shead{display:flex;gap:12px;justify-content:space-between;align-items:baseline;flex-wrap:wrap}.sval{font-weight:600}
.adv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 20px;border:1px solid var(--line-soft);border-radius:6px;padding:10px 12px;background:#161619}@media(max-width:820px){.adv{grid-template-columns:1fr}}
.setting details.doc>summary{cursor:pointer;color:var(--ink-faint);font-size:.85rem;width:fit-content}.setting details.doc>summary:hover{color:var(--ink)}
.docbody{display:grid;gap:8px;margin-top:8px}
.sval select,.sval input{min-width:15rem;background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:6px 8px}
.setting .help{color:var(--ink-faint);font-size:.8rem}
.setting.chg{box-shadow:inset 3px 0 var(--accent);background:#1a2029}
.card.editing{border-color:var(--accent)}
.editfoot{border-top:1px solid var(--line-soft);padding:14px 16px;display:grid;gap:12px;background:#17171b}
.editfoot .field{max-width:42rem}
.sdesc{color:var(--ink-dim);max-width:78ch;line-height:1.55}
table.vals{font-size:.82rem;border:1px solid var(--line-soft);border-radius:6px}table.vals td,table.vals th{padding:5px 10px}table.vals tr.curv td{background:#1d2530;box-shadow:inset 3px 0 var(--accent)}


/* The curve configuration prototype's own rules, on the shared tokens. */
.grow{flex:1}
.tabrow{display:flex;align-items:center;gap:2px;border-bottom:1px solid var(--line);padding:0 4px;overflow-x:auto}
.tab{background:none;border:none;border-bottom:2px solid transparent;padding:9px 12px;color:var(--ink-dim);white-space:nowrap;font-size:.88rem}
.tab.on{color:var(--ink);border-bottom-color:var(--accent)}
.tabcount{font-size:.72rem;color:var(--ink-faint);font-variant-numeric:tabular-nums}
.two{display:grid;grid-template-columns:17rem minmax(0,1fr);gap:14px;align-items:start}
@media(max-width:900px){.two{grid-template-columns:1fr}}
.rail{display:grid;gap:8px;padding:12px}
.railhead h2{font-size:.95rem;text-transform:none;letter-spacing:0;color:var(--ink)}
.railhead p{font-size:.78rem;margin-top:2px}
.search{width:100%;background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:6px 8px;font-size:.86rem}
.collapse{background:none;border:none;color:var(--accent);font-size:.78rem;text-align:left;padding:0 2px}
.groups{display:grid;gap:2px;max-height:32rem;overflow:auto}
.group>summary{display:flex;justify-content:space-between;gap:8px;cursor:pointer;padding:6px 4px;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-faint);list-style:none}
.group>summary::-webkit-details-marker{display:none}
.group>summary:hover{color:var(--ink-dim)}
.groupcount{font-variant-numeric:tabular-nums}
.groupbody{display:grid;gap:1px;padding:2px 0 8px}
.curve{display:grid;gap:1px;text-align:left;background:none;border:none;border-left:2px solid transparent;border-radius:0 6px 6px 0;padding:5px 8px;color:var(--ink-dim)}
.curve:hover{background:var(--panel-2);color:var(--ink)}
.curve.on{background:#1d2530;border-left-color:var(--accent);color:var(--ink)}
.curvename{font-size:.86rem;font-family:var(--mono)}
.curvedesc{font-size:.74rem;color:var(--ink-faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.emptysec{border-top:1px solid var(--line-soft);padding-top:8px}
.emptysec>summary{cursor:pointer;font-size:.78rem;color:var(--ink-faint);list-style:none}
.emptysec>summary::-webkit-details-marker{display:none}
.emptylist{display:grid;gap:2px;padding-top:6px}
.emptyrow{display:flex;justify-content:space-between;font-size:.78rem;color:var(--ink-faint);padding:2px 4px}
.railfoot{border-top:1px solid var(--line-soft);padding-top:8px;font-size:.74rem}
.pane{display:grid;gap:14px;min-width:0}
.entryhead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--line-soft);padding-bottom:10px}
.entrytitle{font-size:1.1rem}
.leaves{display:grid;gap:0}
.leaf{padding:10px 0;border-bottom:1px solid var(--line-soft)}
.leafhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.leaflabel{font-size:.9rem;font-weight:500}
.leafhelp{font-size:.8rem;margin-top:2px}
.leafadv{font-size:.76rem;margin-top:4px}
.leafdoc{background:none;border:none;padding:2px 0 0;color:var(--accent);font-size:.78rem}
.docpanel{margin-top:6px;font-size:.82rem}
.blocks{display:flex;gap:8px;align-items:center;flex-wrap:wrap;border-top:1px solid var(--line-soft);padding-top:10px;font-size:.8rem}
</style>
</head>
<body>

<div class="proto-note">Prototype — fake data, no service, no session</div>

<div class="wrap">
    <div class="crumbs"><span>Reporting</span><span>›</span><span>Reports</span><span>›</span><span>HK daily VaR</span><span>›</span><span id="crumbname">UK curve configuration</span></div>
    <div class="titlebar">
        <div>
            <h1 id="title">UK curve configuration</h1>
            <div class="sub" id="sub"></div>
        </div>
        <div class="actions">
            <span class="access">Read only</span>
            <span class="seg" id="mode">
                <button class="on" data-mode="simple">Simple</button>
                <button data-mode="advanced">Advanced</button>
            </span>
        </div>
    </div>

    <div class="panel" style="padding:10px 14px">
        <div class="row" style="align-items:center;justify-content:space-between">
            <div class="row" style="gap:8px;align-items:center">
                <span class="faint" style="font-size:.78rem;letter-spacing:.06em;text-transform:uppercase">The document</span>
                <span class="seg" id="documents">
                    <button data-sections="1">1 section</button>
                    <button data-sections="4">4 sections</button>
                    <button data-sections="16">16 sections</button>
                </span>
            </div>
            <div class="faint" style="font-size:.82rem">One Curves tab; the rail groups the curves by the section that declares them.</div>
        </div>
    </div>

    <div class="card">
        <div class="tabrow"></div>
    </div>

    <div id="stage"></div>
</div>

<div class="proto-bar" id="bar"></div>

<script src="prototype.js"></script>
</body>
</html>
