# yamllint disable rule:line-length
---
name: Nightly Build

env:
  VCPKG_BINARY_SOURCES: 'clear;files,${{ github.workspace }}/vcpkg-cache,readwrite'
  SCCACHE_DIR: '${{ github.workspace }}/.sccache'
  # sccache defaults to a 10 GB disk cache, the whole of the repository's cache
  # allowance, and one debug variant alone filled it to 3.9 GB. Four variants
  # cannot share that, so cap each one: the four then fit with room for vcpkg
  # and cmake beside them.
  SCCACHE_CACHE_SIZE: '2G'

on:  # yamllint disable-line rule:truthy
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  check_changes:
    runs-on: ubuntu-24.04
    name: Check latest main commit
    outputs:
      should_run: ${{ steps.should_run.outputs.should_run }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: check latest commit is less than a day
        id: should_run
        continue-on-error: false
        run: |
          export latest_commit="`git log -1 --format='%H'`"
          echo "Latest commit: ${latest_commit}"
          if [[ -z $(git rev-list --after="24 hours" ${latest_commit}) ]]; then
              echo "should_run=false" >> $GITHUB_OUTPUT
          else
              echo "should_run=true" >> $GITHUB_OUTPUT
          fi

  build:
    needs: [check_changes]
    if: ${{ needs.check_changes.outputs.should_run != 'false' }}
    name: ${{matrix.family}}-${{matrix.compiler}}-${{matrix.buildtype}}
    runs-on: ubuntu-24.04
    environment: CI
    strategy:
      fail-fast: false
      matrix:
        name: [linux-gcc, linux-clang]
        buildtype: [debug, release]
        include:
          - name: linux-gcc
            family: linux
            compiler: gcc
          - name: linux-clang
            family: linux
            compiler: clang
    steps:
      - name: Free disk space
        run: |
          echo "=== Disk space before cleanup ==="
          df -h
          # Language runtimes and SDKs not needed by this build
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/lib/jvm
          sudo rm -rf /home/linuxbrew/.linuxbrew
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /usr/share/miniconda
          sudo rm -rf /usr/share/miniconda3
          # Cloud CLIs
          sudo rm -rf /opt/az
          sudo rm -rf /opt/pipx/venvs/azure-cli
          sudo rm -rf /usr/lib/google-cloud-sdk
          sudo rm -rf /usr/share/google-cloud-sdk
          sudo rm -rf /usr/local/share/powershell
          # Browser bundles
          sudo rm -rf /usr/local/share/chromium
          sudo rm -rf /usr/local/share/chrome_beta
          sudo rm -rf /opt/google/chrome
          # Pre-installed toolchain caches we don't use
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /opt/hostedtoolcache/Ruby
          sudo rm -rf /opt/hostedtoolcache/node
          sudo rm -rf /opt/hostedtoolcache/go
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/local/lib/node_modules
          # Snap packages
          sudo snap remove lxd 2>/dev/null || true
          sudo rm -rf /var/cache/snapd
          # Docker images
          sudo docker image prune --all --force || true
          # apt cache
          sudo apt-get clean
          echo "=== Disk space after cleanup ==="
          df -h

      - uses: actions/checkout@v7
        with:
          ref: main
          submodules: true

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # The disk cleanup above deletes the image's Node.js, and ores.web needs
      # npm. Without this step the component skips itself with a warning and the
      # build still reports success, so the TypeScript is never compiled here.
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Validate SQL Schema
        run: |
          pip install --quiet pystache
          ./projects/ores.sql/utility/validate_schemas.sh

      - name: Install Clang
        uses: KyleMayes/install-llvm-action@v2
        if: ${{ matrix.compiler == 'clang' }}
        with:
          version: "19"
          arch: x64

      - name: Restore sccache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.SCCACHE_DIR }}
          # Saves use a run-unique key, pruned to the newest entry per variant,
          # so restore by prefix and take that entry. The key is deliberately
          # not scoped to this workflow, because Continuous Linux compiles the
          # same variants with the same settings, so one entry serves both.
          #
          # The two tiers do differ, and none of the differences reaches a
          # compile line:
          #   - build_group names the CDash track, not a CMake input.
          #   - with_memcheck runs valgrind in the test step; valgrind appears
          #     nowhere in the build, so it cannot change a flag.
          #   - a run that does not pass package=0 builds the package target,
          #     which compiles the same objects and only adds cpack.
          # code_coverage is the one input that does change the compile line,
          # and both tiers pass it on the same variants: on for debug, absent
          # for release.
          key: sccache-${{matrix.family}}-${{matrix.compiler}}-${{matrix.buildtype}}-ninja-${{ github.run_id }}
          restore-keys: |
            sccache-${{matrix.family}}-${{matrix.compiler}}-${{matrix.buildtype}}-ninja-

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          variant: sccache
          key: ${{matrix.family}}-${{matrix.compiler}}-${{matrix.buildtype}}-ninja
          max-size: 1000M
          save: false

      - name: Install dev packages
        run: ./projects/ores.compass/compass.sh env install-packages --with-valgrind

      - name: Generate postgres password
        id: pg_password
        run: |
          PG_PASS="$(openssl rand -base64 24 | tr -dc 'a-zA-Z0-9')"
          echo "admin_password=${PG_PASS}" >> $GITHUB_OUTPUT
          echo "PGPASSWORD=${PG_PASS}" >> $GITHUB_ENV

      - name: Install PostgreSQL extensions
        run: |
          ./build/scripts/setup_postgres_extensions.sh --pg-version 18

      - name: Setup postgres
        uses: ikalnytskyi/action-setup-postgres@v8
        with:
          username: postgres
          password: ${{ steps.pg_password.outputs.admin_password }}
          database: oresdb
          port: 5432
          postgres-version: "18"
          postgres-conf: |
            shared_preload_libraries = 'timescaledb'
          hba-conf: |
            local all all trust
            host all all 0.0.0.0/0 scram-sha-256
        id: postgres

      - name: Init environment
        env:
          ORES_DATABASE_NAME: ores_ci
        run: |
          ./projects/ores.compass/compass.sh --no-deps env configure -y
          grep -v '^[[:space:]]*#' .env | grep -v '^[[:space:]]*$' \
            | grep -v 'ORES_IAM_SERVICE_JWT_PRIVATE_KEY' >> $GITHUB_ENV

      - name: Setup NATS server
        # Same setup on every CI platform: unpack the vendored nats-server
        # release (external/nats, pinned v2.14.3) and put it on PATH, so
        # every platform runs the same binary instead of its package
        # manager's version -- no brew, no apt, no GitHub download.
        run: ./build/scripts/setup_nats_server.sh

      - name: Start NATS server
        # env configure already generated the per-checkout TLS certs and
        # nats-<label>.conf (compass nats certs / compass nats init) --
        # start it with that config, matching local dev exactly, so tests
        # that need a live NATS (eventing integration tests) don't hang or
        # fail with a connection error.
        run: |
          nats_conf="$(ls build/config/nats-*.conf | head -n1)"
          nats-server --config "$nats_conf" &
          monitor_port="$(grep '^ORES_NATS_MONITOR_PORT=' .env | cut -d= -f2- | tr -d '"')"
          ready=false
          for i in $(seq 1 30); do
            if curl -sf "http://localhost:${monitor_port}/varz" > /dev/null; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != "true" ]; then
            echo "::error::nats-server did not become ready within 30s"
            exit 1
          fi

      - name: Setup Database
        run: |
          ./projects/ores.compass/compass.sh db recreate -y -D ores_ci

      - name: Get latest CMake
        uses: lukka/get-cmake@v4.4.4

      - name: Cache vcpkg binary packages
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/vcpkg-cache
          key: vcpkg-${{matrix.family}}-${{matrix.compiler}}-${{matrix.buildtype}}-ninja-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-${{matrix.family}}-${{matrix.compiler}}-${{matrix.buildtype}}-ninja-

      - name: Run vcpkg
        uses: lukka/run-vcpkg@v11

      - name: Run CTest workflow
        id: ctest
        # The job limit is 360 minutes, and this is the heaviest configuration
        # the repository builds: debug with coverage and memcheck. Uncapped, it
        # ran to exactly 6h0m0s and was killed, leaving the cache steps below
        # roughly thirty seconds, which cannot upload a compiler cache. Cap it
        # as continuous-linux.yml does and leave the rest of the job to them.
        timeout-minutes: 350
        run: |
          export CMAKE_BUILD_PARALLEL_LEVEL=$(nproc)
          export CTEST_PARALLEL_LEVEL=$(nproc)
          export PATH=${PATH}:/usr/sbin
          export ORES_BUILD_PROVIDER="github"
          export ORES_BUILD_COMMIT="${GITHUB_SHA}"
          export ORES_BUILD_NUMBER="${GITHUB_RUN_NUMBER}"
          export ORES_BUILD_TIMESTAMP=`date "+%Y/%m/%d %H:%M:%S"`
          export preset=${{matrix.family}}-${{matrix.compiler}}-${{matrix.buildtype}}-ninja
          export cmake_args="build_group=Nightly,preset=${preset}"
          # Coverage and valgrind are what make the debug job the heaviest
          # configuration built, and neither belongs on a release job.
          if [[ "${{matrix.buildtype}}" == "debug" ]]; then
              cmake_args="${cmake_args},code_coverage=1,with_memcheck=1"
          fi
          ctest -VV --timeout 12000 --preset ${preset} --script "CTest.cmake,${cmake_args}"

      - name: Check the compiler cache is worth saving
        id: sccache_worth
        # Restore takes the newest match, so a run that fails before it
        # compiles much must not become the newest entry. Run this after any
        # build the CTest step reached, cancelled or not.
        if: ${{ always() && steps.ctest.outcome != 'skipped' }}
        run: |
          size_mb=$(du -sm "${SCCACHE_DIR}" 2>/dev/null | cut -f1)
          size_mb=${size_mb:-0}
          echo "local compiler cache: ${size_mb} MB"
          echo "size_mb=${size_mb}" >> "$GITHUB_OUTPUT"
          if [ "$size_mb" -ge 1000 ]; then
            echo "worth_saving=true" >> "$GITHUB_OUTPUT"
          else
            echo "worth_saving=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Show sccache statistics
        # Read before the cache is stopped: a stopped server reports nothing,
        # and these numbers are what says whether the cache is warming.
        # ccache-action installs sccache. If no build ran, it is absent, and
        # the statistics are not worth a second red step.
        if: ${{ always() && steps.ctest.outcome != 'skipped' }}
        run: sccache --show-stats

      - name: Make room in the repository cache
        # The repository gets 10 GB of cache and this project needs four sccache
        # variants in it. A run-unique key means every save adds an entry, and
        # the prune that removes the old ones ran only after a save that was
        # itself waiting for the room: once the allowance filled, the save was
        # rejected, the prune saw no new entry and deleted nothing, and every
        # later run restored the same stale entry, missed and timed out. Free
        # the space before saving, which is the only order that can.
        if: ${{ always() && steps.sccache_worth.outputs.worth_saving == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prefix="sccache-${{matrix.family}}-${{matrix.compiler}}-${{matrix.buildtype}}-ninja-"
          size_mb=${{ steps.sccache_worth.outputs.size_mb }}
          # Below the real 10 GB allowance, because the vcpkg caches and the
          # cmake caches share it and this step sees only the sccache entries.
          budget_mb=9000
          list="${RUNNER_TEMP}/sccache-caches.tsv"
          gh api --paginate "/repos/${GITHUB_REPOSITORY}/actions/caches?per_page=100" \
            --jq '.actions_caches[]
                  | select(.key | startswith("sccache-"))
                  | [.id, (.size_in_bytes / 1048576 | floor), .created_at, .key]
                  | @tsv' > "${list}"
          total_mb=$(awk -F'\t' '{ s += $2 } END { print s + 0 }' "${list}")
          echo "stored ${total_mb} MB in $(wc -l < "${list}") sccache entries; this run holds ${size_mb} MB"

          deleted="${RUNNER_TEMP}/sccache-deleted.txt"
          : > "${deleted}"
          delete_until_it_fits() {
            while IFS=$'\t' read -r id mb created key; do
              [ -n "${id}" ] || continue
              if [ $((total_mb + size_mb)) -le "${budget_mb}" ]; then
                return 0
              fi
              if grep -qxF "${id}" "${deleted}"; then
                continue
              fi
              echo "Deleting ${key} (${mb} MB, ${created}) to make room."
              gh api --method DELETE "/repos/${GITHUB_REPOSITORY}/actions/caches/${id}" >/dev/null || true
              echo "${id}" >> "${deleted}"
              total_mb=$((total_mb - mb))
            done
          }

          if [ $((total_mb + size_mb)) -le "${budget_mb}" ]; then
            echo "Fits in the allowance; nothing to delete."
            exit 0
          fi

          # This variant's own entries go first, oldest first: the run has
          # already replaced them with what it just compiled, and leaving them
          # in place is what doubles the variant's footprint at save time.
          # Process substitution, not a pipe: a pipe would run the loop in a
          # subshell and the running total would not survive it.
          delete_until_it_fits < <(
            awk -F'\t' -v p="${prefix}" 'index($4, p) == 1' "${list}" | sort -t$'\t' -k3
          )

          # Still short: the oldest entries of any variant, so the allowance is
          # honoured rather than silently rejecting the upload.
          delete_until_it_fits < <(sort -t$'\t' -k3 "${list}")

      - name: Stop the compiler cache
        # actions/cache tars the cache directory, and a tar that reads a file
        # while sccache writes it exits non-zero. actions/cache reports that tar
        # failure as a warning and still exits zero, so the Save step below
        # passes while storing nothing. Stop the server first, which flushes it
        # and leaves the directory still.
        if: ${{ always() && steps.sccache_worth.outputs.worth_saving == 'true' }}
        run: sccache --stop-server || true

      - name: Save sccache
        id: save_sccache
        # The key is unique per run, so the save never collides.
        if: ${{ always() && steps.sccache_worth.outputs.worth_saving == 'true' }}
        uses: actions/cache/save@v6
        with:
          path: ${{ env.SCCACHE_DIR }}
          key: sccache-${{matrix.family}}-${{matrix.compiler}}-${{matrix.buildtype}}-ninja-${{ github.run_id }}

      - name: Verify the compiler cache was stored, and prune the older entries
        # actions/cache turns a rejected upload into a warning and exits zero, so
        # the save step cannot be trusted on its own. Ask the service whether
        # this run's key is really there, and prune only when it is. A cache
        # that was not stored is a warning, not a red build: the build it
        # describes has already passed, and reddening the job only hides that.
        #
        # One entry per variant is the goal, and both tiers prune the same
        # prefix, so whichever runs last leaves the newest entry for both.
        if: ${{ always() && steps.sccache_worth.outputs.worth_saving == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prefix="sccache-${{matrix.family}}-${{matrix.compiler}}-${{matrix.buildtype}}-ninja-"
          keep="${prefix}${{ github.run_id }}"
          if ! gh api --paginate "/repos/${GITHUB_REPOSITORY}/actions/caches?per_page=100" \
               --jq '.actions_caches[].key' | grep -qxF "${keep}"; then
            echo "::warning::${keep} was not stored, so the older entries are left alone."
            exit 0
          fi
          echo "Stored ${keep}."
          gh api --paginate "/repos/${GITHUB_REPOSITORY}/actions/caches?per_page=100" \
            --jq ".actions_caches[] | select(.key | startswith(\"${prefix}\")) | select(.key != \"${keep}\") | .id" \
          | while read -r id; do
              [ -n "$id" ] && gh api --method DELETE \
                "/repos/${GITHUB_REPOSITORY}/actions/caches/${id}" >/dev/null || true
            done
