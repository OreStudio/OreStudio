<!--
  PROTOTYPE. Throwaway. Mock data, no backend, no build step, no session.

  The trader's "Bootstrap or refresh a curve" screen
  (doc/knowledge/journeys/market_data/journey_bootstrap-or-refresh-a-curve.org):
  the curve, its input source and the as-of at the top, the observations the
  build read and the pillars it solved in the middle, and the diagnostics at
  the bottom. Nothing here is published.

  The bootstrap is one capability, not a real one and a synthetic one: the
  same instruments reprice whether the rate came from a vendor, a fixing or a
  synthetic feed. Only the provenance differs, so ?source=real|synthetic
  switches where the rates came from and the screen records which. The
  synthetic rates differ slightly, because a feed generates them from its
  process; the shape and the bootstrap are identical.

  The build is one, but it is read on three screens and all three are needed.
  ?variant=a|b|c names them: *Result* (the observations the build read and the
  pillars it solved, short to long), *Curves* (the input rate, the zero rate,
  the discount factor and the forward), and *Checks* (the reprice residual,
  the convergence, and the missing or stale inputs). Each screen is
  self-contained and reads the same build, so the curve never differs between
  them; only the question the reader is asking differs.

  The charts use the shared PC helper. A pillar named in health.missing breaks
  its line instead of plotting a value.
  ?state=clean|missing|projection switches the mock market. Nothing reads a
  service.
-->

<div class="proto-note" id="note"></div>
<div class="wrap" id="app"></div>
<div class="proto-bar" id="bar"></div>

<script>
const params = new URLSearchParams(location.search);
const variant = params.get('variant') || 'a';
const state = params.get('state') || 'clean';

const source = params.get('source') || 'real';
// The build is one, but it is read on three screens, and all three are needed:
// the numbers it produced, the shape it produced, and whether it can be
// trusted. They are named here rather than left as A/B/C.
const SCREENS = {
  a: {name:'Result', purpose:'What the build produced: the observations it read and the pillars it solved, short to long.'},
  b: {name:'Curves', purpose:'The shape the build produced: the input rate, the zero rate, the discount factor and the forward.'},
  c: {name:'Checks', purpose:'Whether the build can be trusted: the reprice residual, the convergence, and the missing or stale inputs.'}
};
const SCREEN = SCREENS[variant] || SCREENS.a;
const TENORS = ['1M','3M','6M','1Y','2Y','3Y','5Y','7Y','10Y','20Y','30Y'];
const YEARS = [1/12, 0.25, 0.5, 1, 2, 3, 5, 7, 10, 20, 30];
const MARKET = [4.3120,4.3450,4.3760,4.4020,4.3550,4.3110,4.2480,4.2110,4.1850,4.0220,3.9110];
const AGE = ['3m','3m','4m','5m','5m','6m','6m','7m','7m','9m','9m'];
const pillars = TENORS.map((tenor, i) => ({
  tenor, years:YEARS[i], role:i < 3 ? 'DEPOSIT' : 'SWAP', market:MARKET[i],
  source:'ir_curve.usd', age:AGE[i]
}));

// The bootstrap reads observations. Only their provenance differs by source:
// the same instruments reprice, whether the rate came from a vendor, a fixing,
// or the synthetic feed. That provenance is what the curve must record.
const SOURCES = {
  real: {label:'Market data', kind:'observation', origin:'ir_curve.usd · vendor quotes and fixings',
    asOf:'2026-10-06 14:00', extra:'vintage 2026-10-06'},
  synthetic: {label:'Synthetic feed', kind:'generated', origin:'synthetic.themes.realistic_2026.usdsofr',
    asOf:'2026-10-06 14:00', extra:'USD SOFR OIS · Vasicek · seed 20261006'}
};
const SRC = SOURCES[source] || SOURCES.real;
// The synthetic feed generates its own par ladder from the process, so the
// numbers differ slightly; the shape is the same.
const points = pillars.map(p => ({...p, rate: source === 'synthetic' ? p.market - 0.015 : p.market}));

const health = {
  clean: {computed: 11, missing: [], stale: [], discount: true},
  missing: {computed: 9, missing: ['7Y','10Y'], stale: [], discount: true},
  projection: {computed: 11, missing: [], stale: ['1M','3M'], discount: false}
}[state];

// A real sequential bootstrap: each instrument is solved for the discount
// factor that reprices it to par off the curve so far, then the set is refined
// until the interpolation between pillars stops moving.
const known = points.filter(p => !health.missing.includes(p.tenor));
function logDfAt(ps, t){
  if (!ps.length) return 0;
  if (t <= ps[0].years) return Math.log(ps[0].df) * (t / ps[0].years);
  for (let i = 1; i < ps.length; i++){
    if (t <= ps[i].years){
      const a = ps[i - 1], b = ps[i], w = (t - a.years) / (b.years - a.years);
      return Math.log(a.df) + w * (Math.log(b.df) - Math.log(a.df));
    }
  }
  const last = ps[ps.length - 1];
  return Math.log(last.df) * (t / last.years);
}
const dfAt = (ps, t) => Math.exp(logDfAt(ps, t));
function boot(rows){
  const ps = [];
  const solve = r => {
    const q = r.rate / 100;
    if (r.role === 'DEPOSIT') return 1 / (1 + q * r.years);
    const n = Math.max(1, Math.round(r.years));
    let s = 0;
    for (let k = 1; k < n; k++) s += dfAt(ps, k);
    return (1 - q * s) / (1 + q);
  };
  rows.forEach(r => ps.push({...r, df:solve(r)}));
  let passes = 0, delta = 0;
  for (let i = 1; i <= 8; i++){
    passes = i; delta = 0;
    ps.forEach(p => { const old = p.df, next = solve(p); p.df = next; delta = Math.max(delta, Math.abs(next - old)); });
    if (delta < 1e-12) break;
  }
  ps.forEach(p => { p.zero = -Math.log(p.df) / p.years * 100; });
  ps.forEach(p => {
    const q = p.rate / 100;
    if (p.role === 'DEPOSIT') p.model = (1 / p.df - 1) / p.years * 100;
    else {
      const n = Math.max(1, Math.round(p.years));
      let a = 0; for (let k = 1; k <= n; k++) a += dfAt(ps, k);
      p.model = (1 - p.df) / a * 100;
    }
    p.resid = (p.model - p.rate) * 100;
  });
  ps.forEach((p, i) => {
    const prev = ps[i - 1];
    p.fwd = prev ? (p.zero * p.years - prev.zero * prev.years) / (p.years - prev.years) : p.zero;
  });
  return {rows:ps, passes, delta};
}
const build = boot(known);
const S = {}; build.rows.forEach(r => S[r.tenor] = r);
const maxResid = Math.max(...build.rows.map(r => Math.abs(r.resid)));

function urlButton(url){
  return `<button class="urlbtn" type="button" data-url="${url}" title="Edit in the oresmd URL editor">`+
         `<span class="mono">${url}</span><span class="edit">edit</span></button>`;
}
function openOresmdEditor(url, host){
  const ov=document.createElement('div'); ov.className='oresmd-overlay';
  const f=document.createElement('iframe'); f.className='oresmd-frame'; f.title='oresmd URL editor';
  f.src='../oresmd-url-editor/index.html?embed=1&url='+encodeURIComponent(url||'');
  ov.appendChild(f); document.body.appendChild(ov);
  function close(){ window.removeEventListener('message', onMsg); document.removeEventListener('keydown', onKey); ov.remove(); }
  function onMsg(e){ if(e.data && e.data.type==='oresmd-url'){ host.dataset.url=e.data.url; const m=host.querySelector('.mono'); if(m) m.textContent=e.data.url; close(); } }
  function onKey(e){ if(e.key==='Escape') close(); }
  window.addEventListener('message', onMsg); document.addEventListener('keydown', onKey);
  ov.addEventListener('click', e=>{ if(e.target===ov) close(); });
}
document.addEventListener('click', e=>{
  const b=e.target.closest('.urlbtn'); if(!b) return;
  openOresmdEditor(b.dataset.url||'', b);
});
function tag(text, kind){ return `<span class="tag ${kind||''}">${text}</span>`; }
function pct(v){ return v.toFixed(4); }
function dfmt(v){ return v.toFixed(6); }

function header(){
  const role = state === 'projection' ? 'PROJECTION' : 'FUNDING';
  return `
  <div class="top">
    <h1>Curve bootstrap / USD SOFR FOMC</h1>
    <span class="tag">${SCREEN.name}</span>
    <span class="muted">candidate · not published</span>
    <a class="grow" style="text-align:right" href="../../../knowledge/journeys/market_data/journey_bootstrap-or-refresh-a-curve.html">the journey &rarr;</a>
  </div>
  <div class="notice">${SCREEN.purpose} <span class="faint">The build is one; these three screens read it, so any of them shows the same curve.</span></div>
  <div class="panel">
    <h2>Curve, source and as-of</h2>
    <div class="row">
      <div class="field"><label>Currency</label><div class="value">USD</div></div>
      <div class="field"><label>Family role</label><div class="value">${role}</div></div>
      <div class="field"><label>Output series</label><div class="value mono">${urlButton('oresmd://ir/USD?…&amp;curve_id=USD-SOFR-FOMC')}</div></div>
      <div class="field"><label>Discount curve</label><div class="value">${state === 'projection' ? 'USD-SOFR-OIS' : '— (funding)'}</div></div>
      <div class="field"><label>Input source</label><div>${['real','synthetic'].map(s =>
        `<button class="btn" data-src="${s}"${s === source ? ' style="border-color:var(--accent);color:var(--accent)"' : ''}>${SOURCES[s].label}</button>`).join(' ')}</div></div>
      <div class="field"><label>As-of</label><input type="datetime-local" value="2026-10-06T14:00"></div>
      <button class="btn primary" id="compute">Compute candidate</button>
    </div>
    <div class="notice">One bootstrap reads either source. The instruments to reprice are the same; what differs is where each rate came from, and the build must record that provenance on the points it writes.</div>
  </div>`;
}

function sourcePanel(){
  return `
  <div class="panel">
    <h2>Inputs — ${SRC.label}</h2>
    <table><tbody>
      <tr><td>Kind</td><td>${tag(SRC.kind, source === 'synthetic' ? 'warn' : 'ok')}</td></tr>
      <tr><td>Origin</td><td class="mono">${SRC.origin}</td></tr>
      <tr><td>As-of</td><td class="mono">${SRC.asOf}</td></tr>
      <tr><td>Detail</td><td class="faint">${SRC.extra}</td></tr>
      <tr><td>Series</td><td>${urlButton('oresmd://ir/USD?type=quote&amp;instrument=ir_swap&amp;quote=rate')}</td></tr>
    </tbody></table>
    <div class="notice">${source === 'synthetic'
      ? 'The rates were generated by a synthetic feed, not observed. The curve is built the same way, but the provenance says generated, so nothing downstream can mistake it for market data.'
      : 'The rates are market observations: a vendor quote or a fixing, each with the source and age the build read.'} Each observation keeps its own source, so a curve can mix both and still answer "where did this point come from?".</div>
  </div>`;
}

function bootstrapTable(){
  return `
  <div class="panel">
    <h2>Bootstrapped pillars — solved in instrument order</h2>
    <table>
      <thead><tr><th>Pillar</th><th>Instrument</th><th class="num">Input rate</th><th class="num">Solved zero</th><th class="num">Discount factor</th><th class="num">Forward to pillar</th><th class="num">Reprice residual</th></tr></thead>
      <tbody>${points.map(p => {
        const r = S[p.tenor], miss = health.missing.includes(p.tenor);
        if (miss) return `<tr class="muted"><td class="mono">${p.tenor}</td><td>${p.role}</td><td colspan="5">${tag('missing input','bad')}</td></tr>`;
        return `<tr><td class="mono">${p.tenor}</td><td>${p.role}</td>
          <td class="num">${r.rate.toFixed(4)}%</td><td class="num">${r.zero.toFixed(3)}%</td>
          <td class="num">${r.df.toFixed(6)}</td><td class="num">${r.fwd.toFixed(3)}%</td>
          <td class="num">${Math.abs(r.resid) < 0.01 ? tag(r.resid.toFixed(3) + ' bp', 'ok') : tag(r.resid.toFixed(1) + ' bp', 'bad')}</td></tr>`;
      }).join('')}</tbody>
    </table>
    <div class="notice">Every pillar reprices its own instrument to par: that is what "solved" means. The residual is a convergence check, not a market view.</div>
  </div>`;
}

function pointsTable(){
  return `
  <div class="panel">
    <h2>Observations the build read</h2>
    <table>
      <thead><tr><th>Pillar</th><th>Role</th><th class="num">Rate</th><th class="num">Discount factor</th><th>Source</th><th>Age</th></tr></thead>
      <tbody>${points.map(p => {
        const miss = health.missing.includes(p.tenor), r = S[p.tenor];
        return `<tr${miss ? ' class="muted"' : ''}><td class="mono">${p.tenor}</td><td>${p.role}</td>
          <td class="num">${miss ? '—' : p.rate.toFixed(4)}</td>
          <td class="num">${miss ? '—' : r.df.toFixed(6)}</td>
          <td>${miss ? tag('missing','bad') : `<span class="mono">${source === 'synthetic' ? SRC.origin : p.source}</span> <span class="faint">(${SRC.kind})</span>`}</td>
          <td class="faint">${miss ? '—' : p.age}</td></tr>`;
      }).join('')}</tbody>
    </table>
  </div>`;
}

// The four curves the bootstrap defines, over the pillars in order. A pillar
// with no input becomes a null point, so its line breaks.
function pointsCharts(){
  const n = points.length;
  const x = points.map((_, i) => i / (n - 1));
  const ticks = points.map((p, i) => ({at:i / (n - 1), label:p.tenor}));
  const miss = t => health.missing.includes(t);
  const chart = (name, label, vals, yFmt, colour, caption) => ({
    series:[{name, color:colour, points:points.map((p, i) => miss(p.tenor) ? null : vals[i]), markers:true}],
    x, ticks, yFmt, yLabel:label, h:250,
    notes:health.missing.length ? [`missing: ${health.missing.join(', ')}`] : [], caption
  });
  return `
  <div class="panel">
    <h2>Term structure, zero curve and forwards</h2>
    <div class="grid2">
      <div>${PC.line(chart('input rate', 'rate %', points.map(p => p.rate), v => v.toFixed(3) + '%', PC.colours.warn,
        'The input par rate per pillar, from whichever source is selected.'))}</div>
      <div>${PC.line(chart('zero rate', 'zero %', points.map(p => S[p.tenor] ? S[p.tenor].zero : null), v => v.toFixed(3) + '%', PC.colours.accent,
        'The zero rate the bootstrap solved at each pillar.'))}</div>
      <div>${PC.line(chart('discount factor', 'DF', points.map(p => S[p.tenor] ? S[p.tenor].df : null), v => v.toFixed(5), PC.colours.ok,
        'Discount factors must fall monotonically from one.'))}</div>
      <div>${PC.line(chart('forward', 'forward %', points.map(p => S[p.tenor] ? S[p.tenor].fwd : null), v => v.toFixed(3) + '%', PC.colours.bad,
        'The forward implied between pillars: the curve a desk actually trades.'))}</div>
    </div>
  </div>`;
}

function healthPanel(){
  const rows = [
    ['Pillars computed', `${health.computed} of ${points.length}`, health.computed === points.length ? 'ok' : 'bad'],
    ['Inputs missing', health.missing.length ? health.missing.join(', ') : 'none', health.missing.length ? 'bad' : 'ok'],
    ['Inputs stale', health.stale.length ? health.stale.join(', ') : 'none', health.stale.length ? 'warn' : 'ok'],
    ['Discount curve present', health.discount ? 'yes' : 'no', health.discount ? 'ok' : 'bad']
  ];
  return `
  <div class="panel">
    <h2>Build health</h2>
    <table><tbody>${rows.map(([k, v, c]) => `<tr><td>${k}</td><td>${tag(v, c)}</td></tr>`).join('')}</tbody></table>
    <div class="notice">The server returns no diagnostics, so this panel is derived from the points received and the pillars read.</div>
  </div>`;
}

function diagnostics(){
  return `
  <div class="panel">
    <h2>Bootstrap diagnostics</h2>
    <div class="grid2">
      <div>${PC.bars({bars:build.rows.map(r => ({label:r.tenor, value:r.resid,
        color:Math.abs(r.resid) < 0.01 ? PC.colours.ok : PC.colours.bad})),
        yFmt:v => v.toFixed(3), yLabel:'residual bp', h:260, zero:true,
        caption:'Repricing residual per pillar, in basis points. A converged bootstrap sits on zero.'})}</div>
      <table><tbody>
        <tr><td>Source</td><td>${tag(SRC.label + ' · ' + SRC.kind, source === 'synthetic' ? 'warn' : 'ok')}</td></tr>
        <tr><td>Largest residual</td><td>${maxResid < 0.01 ? tag('< 0.01 bp', 'ok') : tag(maxResid.toFixed(2) + ' bp', 'bad')}</td></tr>
        <tr><td>Refinement passes</td><td class="mono">${build.passes}</td></tr>
        <tr><td>Inputs stale</td><td>${health.stale.length ? tag(health.stale.join(', '), 'warn') : tag('none', 'ok')}</td></tr>
      </tbody></table>
    </div>
    <div class="notice">A stale input changes the curve's claim, not its arithmetic: the build still solves, and the provenance is what lets a reader discount it. A synthetic input is marked generated for the same reason.</div>
  </div>`;
}

// Prototype plotting helper. Throwaway, dependency-free, dark-theme SVG.
// Each function returns an HTML string, so a page calls host.innerHTML = PC.line({...}).
// Prefixed PC to stay clear of page-local names; the pages also define `tag`.
const PC = (() => {
  const C = {grid:'#21262d', axis:'#30363d', text:'#71717a', dim:'#a1a1aa',
             ink:'#e3e3e6', accent:'#58a6ff', ok:'#3fb950', warn:'#d29922', bad:'#f85149'};
  const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const fmt = (v, d) => v == null ? '—' : (typeof v === 'number' ? v.toFixed(d ?? 2) : String(v));
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  // A blue -> amber ramp for a heat cell, t in 0..1.
  function heatColour(t){
    const stops = [[13,23,38],[21,60,110],[32,110,170],[88,166,255],[210,153,34],[248,81,73]];
    const p = clamp(t, 0, 1) * (stops.length - 1), i = Math.floor(p), f = p - i;
    const a = stops[i], b = stops[Math.min(stops.length - 1, i + 1)];
    return `rgb(${a.map((x, k) => Math.round(x + (b[k] - x) * f)).join(',')})`;
  }

  // Shared frame: margins, y gridlines and labels for a value axis.
  function frame(o){
    const w = o.w || 940, h = o.h || 300;
    const pad = Object.assign({l:64, r:18, t:16, b:40}, o.pad || {});
    const x0 = pad.l, x1 = w - pad.r, y0 = h - pad.b, y1 = pad.t;
    const vals = (o.series || []).flatMap(s => s.points || []).filter(v => v != null)
      .concat(o.extra || []);
    let lo = Math.min(...vals), hi = Math.max(...vals);
    if (o.zero) { lo = Math.min(lo, 0); hi = Math.max(hi, 0); }
    if (!(hi > lo)) { hi = lo + 1; }
    const span = hi - lo, l2 = lo - span * 0.08, h2 = hi + span * 0.08;
    const y = v => y0 - (v - l2) * (y0 - y1) / (h2 - l2);
    const X = o.x ? (i => x0 + o.x[i] * (x1 - x0))
                  : (i => x0 + i * (x1 - x0) / Math.max(1, (o.ticks ? o.ticks.length : 1) - 1));
    const yTicks = [];
    const steps = o.ySteps || 4;
    for (let k = 0; k <= steps; k++) {
      const v = l2 + (h2 - l2) * k / steps;
      yTicks.push(`<line x1="${x0}" y1="${y(v).toFixed(1)}" x2="${x1}" y2="${y(v).toFixed(1)}" stroke="${C.grid}"/>
        <text x="${x0 - 8}" y="${(y(v) + 3.5).toFixed(1)}" fill="${C.text}" font-size="10" text-anchor="end">${esc((o.yFmt || (v => fmt(v)))(v))}</text>`);
    }
    const xTicks = (o.ticks || []).map(t => {
      const px = o.x ? x0 + t.at * (x1 - x0) : X(t.at);
      return `<text x="${px.toFixed(1)}" y="${h - pad.b + 15}" fill="${C.text}" font-size="10" text-anchor="middle">${esc(t.label)}</text>`;
    }).join('');
    const grid = (o.xticks || []).map(t => {
      const px = o.x ? x0 + t.at * (x1 - x0) : X(t.at);
      return `<line x1="${px.toFixed(1)}" y1="${y1}" x2="${px.toFixed(1)}" y2="${y0}" stroke="${C.grid}" stroke-dasharray="2 3"/>`;
    }).join('');
    return {w, h, x0, x1, y0, y1, y, X, l2, h2, frame: yTicks.join('') + grid + xTicks};
  }

  function line(o){
    const f = frame(o);
    const bands = (o.bands || []).map(b => {
      const xa = f.x0 + b.from * (f.x1 - f.x0), xb = f.x0 + b.to * (f.x1 - f.x0);
      return `<rect x="${xa.toFixed(1)}" y="${f.y1}" width="${(xb - xa).toFixed(1)}" height="${(f.y0 - f.y1).toFixed(1)}"
        fill="${b.color || C.accent}" opacity=".08"/>` +
        (b.label ? `<text x="${((xa + xb) / 2).toFixed(1)}" y="${f.y1 + 11}" fill="${C.text}" font-size="9" text-anchor="middle">${esc(b.label)}</text>` : '');
    }).join('');
    const paths = (o.series || []).map(s => {
      let d = '', pen = false;
      s.points.forEach((v, i) => {
        if (v == null) { pen = false; return; }
        d += (pen ? 'L' : 'M') + f.X(i).toFixed(1) + ',' + f.y(v).toFixed(1) + ' ';
        pen = true;
      });
      const marks = s.markers ? s.points.map((v, i) => v == null ? '' :
        `<circle cx="${f.X(i).toFixed(1)}" cy="${f.y(v).toFixed(1)}" r="${s.r || 3.4}" fill="${s.color}"/>`).join('') : '';
      return `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="${s.width || 2}"${s.dash ? ` stroke-dasharray="${s.dash}"` : ''}/>${marks}`;
    }).join('');
    const legend = o.legend === false ? '' : `<div class="pc-legend">${(o.series || []).map(s =>
      `<span><i style="background:${s.color}"></i>${esc(s.name)}</span>`).join('')}${(o.notes || []).map(n =>
      `<span class="faint">${n}</span>`).join('')}</div>`;
    return `<figure class="pc"><svg viewBox="0 0 ${f.w} ${f.h}" width="100%" height="${f.h}" role="img" aria-label="${esc(o.title || 'chart')}">
      ${bands}${f.frame}${paths}
      ${o.yLabel ? `<text x="14" y="${(f.y0 + f.y1) / 2}" fill="${C.text}" font-size="10" transform="rotate(-90 14 ${(f.y0 + f.y1) / 2})" text-anchor="middle">${esc(o.yLabel)}</text>` : ''}
    </svg>${legend}${o.caption ? `<figcaption class="faint">${o.caption}</figcaption>` : ''}</figure>`;
  }

  function bars(o){
    const f = frame(Object.assign({zero: true}, o));
    const n = o.bars.length, bw = (f.x1 - f.x0) / n;
    const zero = f.y(0);
    const body = o.bars.map((b, i) => {
      const v = b.value == null ? null : b.value;
      const x = f.x0 + i * bw + bw * 0.18, w = bw * 0.64;
      const yv = v == null ? zero : f.y(v);
      const top = Math.min(yv, zero), hgt = Math.abs(zero - yv);
      const col = b.color || (v == null ? C.text : v >= 0 ? C.warn : C.accent);
      return `<rect x="${x.toFixed(1)}" y="${top.toFixed(1)}" width="${w.toFixed(1)}" height="${Math.max(1, hgt).toFixed(1)}" fill="${col}" opacity=".85"><title>${esc(b.label)}: ${esc(fmt(v))}</title></rect>
        <text x="${(x + w / 2).toFixed(1)}" y="${(f.h - 24)}" fill="${C.text}" font-size="9" text-anchor="middle">${esc(b.label)}</text>`;
    }).join('');
    return `<figure class="pc"><svg viewBox="0 0 ${f.w} ${f.h}" width="100%" height="${f.h}" role="img" aria-label="${esc(o.title || 'bars')}">
      ${f.frame}<line x1="${f.x0}" y1="${zero}" x2="${f.x1}" y2="${zero}" stroke="${C.axis}"/>${body}</svg>
      ${o.caption ? `<figcaption class="faint">${o.caption}</figcaption>` : ''}</figure>`;
  }

  // A surface as a shaded mesh grid: one cell per (row, column).
  function heat(o){
    const rows = o.rows, cols = o.cols;
    const cw = o.cell || 54, ch = o.cellH || 30, l = 58, t = 26;
    const w = l + cols.length * cw + (o.legend === false ? 14 : 92);
    const h = t + rows.length * ch + 34;
    const vals = [];
    rows.forEach((_, i) => cols.forEach((_, j) => { const v = o.value(i, j); if (v != null) vals.push(v); }));
    const lo = Math.min(...vals), hi = Math.max(...vals), span = (hi - lo) || 1;
    const cells = [];
    rows.forEach((r, i) => cols.forEach((c, j) => {
      const v = o.value(i, j);
      const x = l + j * cw, y = t + i * ch;
      const col = v == null ? '#161619' : heatColour((v - lo) / span);
      cells.push(`<rect x="${x}" y="${y}" width="${cw - 2}" height="${ch - 2}" rx="2" fill="${col}"><title>${esc(r.label)} · ${esc(c.label)}: ${esc(fmt(v, o.dp))}</title></rect>`);
      if (o.showValues !== false) cells.push(`<text x="${(x + (cw - 2) / 2).toFixed(1)}" y="${(y + ch / 2 + 3.5).toFixed(1)}" fill="${(v != null && (v - lo) / span > 0.55) ? '#0d1117' : C.ink}" font-size="9.5" text-anchor="middle">${esc(fmt(v, o.dp ?? 1))}</text>`);
    }));
    const rowLabels = rows.map((r, i) => `<text x="${l - 8}" y="${(t + i * ch + ch / 2 + 3.5).toFixed(1)}" fill="${C.text}" font-size="10" text-anchor="end">${esc(r.label)}</text>`).join('');
    const colLabels = cols.map((c, j) => `<text x="${(l + j * cw + (cw - 2) / 2).toFixed(1)}" y="${t - 8}" fill="${C.text}" font-size="10" text-anchor="middle">${esc(c.label)}</text>`).join('');
    const legend = o.legend === false ? '' : (() => {
      const bx = l + cols.length * cw + 14, by = t, bh = rows.length * ch - 2;
      const steps = 24, sh = bh / steps;
      let g = '';
      for (let k = 0; k < steps; k++) g += `<rect x="${bx}" y="${(by + k * sh).toFixed(1)}" width="12" height="${(sh + 1).toFixed(1)}" fill="${heatColour(1 - k / (steps - 1))}"/>`;
      return `<g>${g}<text x="${bx + 18}" y="${by + 8}" fill="${C.text}" font-size="9">${esc(fmt(hi, o.dp))}</text>
        <text x="${bx + 18}" y="${by + bh}" fill="${C.text}" font-size="9">${esc(fmt(lo, o.dp))}</text></g>`;
    })();
    return `<figure class="pc"><svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" role="img" aria-label="${esc(o.title || 'heat map')}">
      ${cells.join('')}${rowLabels}${colLabels}${legend}
      ${o.xLabel ? `<text x="${(l + cols.length * cw / 2).toFixed(1)}" y="${h - 6}" fill="${C.text}" font-size="10" text-anchor="middle">${esc(o.xLabel)}</text>` : ''}
      ${o.yLabel ? `<text x="12" y="${(t + rows.length * ch / 2).toFixed(1)}" fill="${C.text}" font-size="10" transform="rotate(-90 12 ${(t + rows.length * ch / 2).toFixed(1)})" text-anchor="middle">${esc(o.yLabel)}</text>` : ''}
    </svg>${o.caption ? `<figcaption class="faint">${o.caption}</figcaption>` : ''}</figure>`;
  }

  // A surface as an isometric wireframe: rows and columns joined over a height.
  function mesh(o){
    const w = o.w || 940, h = o.h || 420;
    const rows = o.z.length, cols = o.z[0].length;
    const vals = o.z.flat().filter(v => v != null);
    const lo = Math.min(...vals), hi = Math.max(...vals), span = (hi - lo) || 1;
    const ox = o.ox ?? w * 0.52;
    const sy = o.sy ?? Math.min(22, h / (2 * Math.max(1, (rows - 1) + (cols - 1))));
    const sx = o.sx ?? Math.min(46, (w * 0.6) / Math.max(1, (rows - 1) + (cols - 1)));
    const sz = o.sz ?? h * 0.34;
    const oy = o.oy ?? h - 26 - ((rows - 1) + (cols - 1)) * sy;
    const P = (i, j) => {
      const v = o.z[i][j];
      const z = v == null ? 0 : (v - lo) / span;
      return [ox + (j - i) * sx, oy + (i + j) * sy - z * sz, z];
    };
    const lines = [];
    for (let i = 0; i < rows; i++) {
      let d = '';
      for (let j = 0; j < cols; j++) { const p = P(i, j); d += (j ? 'L' : 'M') + p[0].toFixed(1) + ',' + p[1].toFixed(1) + ' '; }
      lines.push(`<path d="${d}" fill="none" stroke="${C.accent}" stroke-width="1.4" opacity=".75"/>`);
    }
    for (let j = 0; j < cols; j++) {
      let d = '';
      for (let i = 0; i < rows; i++) { const p = P(i, j); d += (i ? 'L' : 'M') + p[0].toFixed(1) + ',' + p[1].toFixed(1) + ' '; }
      lines.push(`<path d="${d}" fill="none" stroke="${C.warn}" stroke-width="1" opacity=".5"/>`);
    }
    const rowL = (o.rows || []).map((r, i) => { const p = P(i, 0); return `<text x="${(p[0] - 12).toFixed(1)}" y="${(p[1] + 4).toFixed(1)}" fill="${C.text}" font-size="10" text-anchor="end">${esc(r.label)}</text>`; }).join('');
    const colL = (o.cols || []).map((c, j) => { const p = P(rows - 1, j); return `<text x="${(p[0] + 10).toFixed(1)}" y="${(p[1] + 4).toFixed(1)}" fill="${C.text}" font-size="10">${esc(c.label)}</text>`; }).join('');
    const axis = `<text x="14" y="${h - 12}" fill="${C.text}" font-size="10">height: ${esc(o.zLabel || 'value')} ${esc(fmt(lo, o.dp))}–${esc(fmt(hi, o.dp))}</text>`;
    return `<figure class="pc"><svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" role="img" aria-label="${esc(o.title || 'surface mesh')}">
      ${lines.join('')}${rowL}${colL}${axis}</svg>
      <div class="pc-legend"><span><i style="background:${C.accent}"></i>expiry</span><span><i style="background:${C.warn}"></i>strike</span>${(o.notes || []).map(n => `<span class="faint">${n}</span>`).join('')}</div>
      ${o.caption ? `<figcaption class="faint">${esc(o.caption)}</figcaption>` : ''}</figure>`;
  }

  return {line, bars, heat, mesh, colours: C, heatColour};
})();
function render(){
  const app = document.getElementById('app');
  const head = header();
  if (variant === 'b') app.innerHTML = head + sourcePanel() + pointsCharts();
  else if (variant === 'c') app.innerHTML = head + sourcePanel() + diagnostics() + pointsTable();
  else app.innerHTML = head + sourcePanel() + pointsTable() + bootstrapTable();
  document.getElementById('note').textContent =
    `Prototype · curve bootstrap · ${SCREEN.name} · source: ${SRC.label} · market: ${state} · candidate, nothing published`;
  document.getElementById('bar').innerHTML =
    `<span class="label">Screen</span>` +
    ['a','b','c'].map(v => `<button data-v="${v}" class="${v===variant?'on':''}">${SCREENS[v].name}</button>`).join('') +
    `<span class="sep">|</span><span class="label">Input source</span>` +
    [['real','market'],['synthetic','synthetic']].map(([s, t]) =>
      `<button data-src="${s}" class="${s===source?'on':''}">${t}</button>`).join('') +
    `<span class="sep">|</span><span class="label">Market</span>` +
    ['clean','missing','projection'].map(s => `<button data-s="${s}" class="${s===state?'on':''}">${s}</button>`).join('');
  document.querySelectorAll('#bar [data-v]').forEach(b => b.onclick = () => set('variant', b.dataset.v));
  document.querySelectorAll('#bar [data-src]').forEach(b => b.onclick = () => set('source', b.dataset.src));
  document.querySelectorAll('#bar [data-s]').forEach(b => b.onclick = () => set('state', b.dataset.s));
  document.querySelectorAll('#app [data-src]').forEach(b => b.onclick = () => set('source', b.dataset.src));
  const c = document.getElementById('compute');
  if (c) c.onclick = () => { c.textContent = `Computed from ${SRC.label.toLowerCase()} · ` + new Date().toLocaleTimeString(); };
}
function set(k, v){ const p = new URLSearchParams(location.search); p.set(k, v); location.search = p.toString(); }
render();
</script>
