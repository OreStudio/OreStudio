<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Adjust a curve or surface by hand prototype — Market data journeys</title>
<style>
:root{color-scheme:dark;--bg:#121214;--panel:#1a1a1e;--panel-2:#26262b;--line:#30363d;--line-soft:#21262d;--ink:#e3e3e6;--ink-dim:#a1a1aa;--ink-faint:#71717a;--accent:#58a6ff;--accent-dim:#21262d;--ok:#3fb950;--warn:#d29922;--bad:#f85149;--radius:.5rem;--mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink)}
body{margin:0;font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;padding:2.5rem 1.5rem 8rem}
h1,h2,h3{margin:0;font-weight:600}h1{font-size:1.15rem}h2{font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-dim)}
p{margin:0}ul{margin:0;padding:0;list-style:none}a{color:var(--accent);text-decoration:none}
button,input,select{font:inherit;color:inherit}button{cursor:pointer}
.mono{font-family:var(--mono)}.muted{color:var(--ink-dim)}.faint{color:var(--ink-faint)}
.wrap{max-width:1080px;margin:0 auto;display:grid;gap:14px}
.top{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px;display:grid;gap:10px}
.panel>h2{border-bottom:1px solid var(--line-soft);padding-bottom:6px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.field{display:grid;gap:4px;min-width:170px}.field label{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-faint)}
.field .value,.field select,.field input{background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:6px 8px}
table{width:100%;border-collapse:collapse;font-size:.86rem}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line-soft)}
th{font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-faint);font-weight:600}
td.num{text-align:right;font-family:var(--mono)}
.btn{background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:7px 12px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#0d1117;font-weight:600}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.tag{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:1px 8px;font-size:.72rem;color:var(--ink-dim)}
.tag.ok{color:var(--ok);border-color:#1f4d29}.tag.bad{color:var(--bad);border-color:#5a2320}.tag.warn{color:var(--warn);border-color:#4a3a17}
.notice{border:1px dashed var(--line);border-radius:var(--radius);padding:10px 12px;color:var(--ink-dim);background:#161619}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:820px){.grid2{grid-template-columns:1fr}}
.proto-note{position:fixed;top:0;left:0;right:0;z-index:60;padding:6px 14px;background:repeating-linear-gradient(45deg,#2a2113,#2a2113 10px,#241d11 10px,#241d11 20px);border-bottom:1px solid #4a3a17;color:var(--warn);font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.proto-bar{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:60;display:flex;gap:2px;align-items:center;padding:5px 7px;background:#0b0e13;border:1px solid var(--line);border-radius:999px;box-shadow:0 8px 30px rgba(0,0,0,.6);font-size:12px;max-width:95vw;flex-wrap:wrap;justify-content:center}
.proto-bar button{background:none;border:none;color:var(--ink-dim);padding:6px 10px;border-radius:999px}
.proto-bar button:hover{background:var(--panel-2);color:var(--ink)}.proto-bar button.on{background:var(--accent-dim);color:var(--ink)}
.proto-bar .label{padding:0 8px}.proto-bar .sep{color:var(--line)}
</style>
</head>
<body>

<!--
  PROTOTYPE. Throwaway. Mock data, no backend, no build step, no session.

  The trader's "Adjust a curve or surface by hand" screen
  (doc/knowledge/journeys/market_data/journey_adjust-a-curve-or-surface-by-hand.org):
  the candidate and its points at the top, the correction forms in the middle,
  and the state of every correction at the foot, so the person reads what the
  feed gave, keys a correction with a reason, then reads what survives a tick.

  Variants with ?variant=a|b|c. The variant is how the adjustment is applied,
  which is the journey's central design question: a keys one node, b applies a
  spread overlay over a segment, c pastes a set of nodes. Each variant also
  changes the candidate table it reads against.
  ?state=none|some|overwrite switches the mock market: no manual points, some
  manual points, and a manual point a feed has since tried to overwrite.
  Nothing here is published. Nothing reads a service.
-->

<div class="proto-note" id="note"></div>
<div class="wrap" id="app"></div>
<div class="proto-bar" id="bar"></div>

<script>
const params = new URLSearchParams(location.search);
const variant = params.get('variant') || 'a';
const state = params.get('state') || 'some';

const reasons = ['Desk mark', 'Bad print', 'Thin market', 'Stale quote', 'Missing quote', 'What-if'];
const SEGMENT = ['2Y', '5Y', '10Y'];
const PASTED = ['1Y', '2Y', '5Y', '10Y'];
const SHIFT = 0.0005;

const feed = [
  {c:'1M',  role:'DEPOSIT', value:4.3120, source:'synthetic.v1.tick', at:'13:58'},
  {c:'3M',  role:'DEPOSIT', value:4.3450, source:'synthetic.v1.tick', at:'13:58'},
  {c:'6M',  role:'DEPOSIT', value:4.3760, source:'synthetic.v1.tick', at:'13:59'},
  {c:'1Y',  role:'SWAP',    value:4.4020, source:'ir_curve.usd',      at:'13:59'},
  {c:'2Y',  role:'SWAP',    value:4.3550, source:'ir_curve.usd',      at:'13:59'},
  {c:'5Y',  role:'SWAP',    value:4.2480, source:'ir_curve.usd',      at:'14:00'},
  {c:'10Y', role:'SWAP',    value:4.1850, source:'ir_curve.usd',      at:'14:00'},
  {c:'30Y', role:'SWAP',    value:3.9110, source:'ir_curve.usd',      at:'14:01'}
];

const overrides = {
  none: [],
  some: [
    {c:'5Y', value:3.8800, reason:'Desk mark', actor:'a.reyes', at:'14:02', feedTry:null},
    {c:'10Y', value:4.1920, reason:'Thin market', actor:'a.reyes', at:'14:03', feedTry:null}
  ],
  overwrite: [
    {c:'5Y', value:3.8800, reason:'Desk mark', actor:'a.reyes', at:'14:02',
     feedTry:{value:3.8825, source:'synthetic.v1.tick', at:'14:07'}}
  ]
}[state];

const overlays = state === 'none' ? [] : [
  {kind:'Twist', applies:'segment 2Y-10Y', shift:SHIFT, reason:'Thin market', actor:'m.oduya', at:'14:04'}
];

const overrideAt = c => overrides.find(o => o.c === c) || null;

function tag(text, kind){ return `<span class="tag ${kind||''}">${text}</span>`; }
function valu(v){ return v.toFixed(4); }

function header(){
  return `
  <div class="top">
    <h1>Candidate: USD OIS curve (USD.RATES.OIS.3M)</h1>
    <span class="muted">candidate · not published</span>
    <a style="margin-left:auto" href="../../knowledge/journeys/market_data/journey_adjust-a-curve-or-surface-by-hand.html">the journey &rarr;</a>
  </div>
  <div class="panel">
    <h2>Candidate and as-of</h2>
    <div class="row">
      <div class="field"><label>Output series</label><div class="value mono">oresmd://ir/USD?…&amp;curve_id=USD.RATES.OIS.3M</div></div>
      <div class="field"><label>Derivation</label><div class="value mono">IR_CURVE_BOOTSTRAP · config …a41f v3</div></div>
      <div class="field"><label>As-of</label><input type="datetime-local" value="2026-10-06T14:00"></div>
      <button class="btn" data-act="refresh">Refresh points</button>
    </div>
  </div>`;
}

function pointsPanel(){
  const cols = variant === 'b' ? '<th class="num">Overlay</th>' : variant === 'c' ? '<th class="num">Pasted</th>' : '<th>Reads as</th>';
  const rows = feed.map(p => {
    const o = overrideAt(p.c);
    const kind = o ? tag('◆ manual', 'warn') : tag('feed');
    const conf = o && o.feedTry
      ? ` ${tag('feed wrote ' + valu(o.feedTry.value) + ' at ' + o.feedTry.at, 'bad')}` : '';
    const src = o && o.feedTry ? o.feedTry.source : (o ? 'by hand' : p.source);
    const actor = o ? o.actor : '—';
    const extra = variant === 'b'
      ? (SEGMENT.includes(p.c) ? '<td class="num">+' + SHIFT.toFixed(4) + '</td>' : '<td class="num faint">—</td>')
      : variant === 'c'
      ? (PASTED.includes(p.c) ? '<td class="num">+0.0015</td>' : '<td class="num faint">—</td>')
      : `<td>${o ? tag('override', 'warn') : tag('as fed')}</td>`;
    return `<tr><td class="mono">${o ? '◆ ' : ''}${p.c}</td><td>${p.role}</td><td>${kind}${conf}</td>
      <td class="num">${valu(o ? o.value : p.value)}</td><td>${src}</td><td>${actor}</td>${extra}</tr>`;
  }).join('');
  const note = state === 'overwrite'
    ? 'A feed tick wrote 5Y at 14:07. No precedence rule exists, so the screen cannot promise the hand value won. The candidate is a rule: a manual point wins for its coordinate until it is cleared.'
    : 'A point carries no actor and no marker that a person wrote it, so the Kind column is the screen\u2019s own guess. The candidate is a source kind on the point.';
  return `
  <div class="panel">
    <h2>Candidate points</h2>
    <table>
      <thead><tr><th>Point</th><th>Role</th><th>Kind</th><th class="num">Value</th><th>Source</th><th>Actor</th>${cols}</tr></thead>
      <tbody>${rows}</tbody>
    </table>
    <div class="notice">${note}</div>
  </div>`;
}

function form(){
  const controls = `<div class="field"><label>Reason</label><select>${reasons.map(r => `<option>${r}</option>`).join('')}</select></div>`;
  if (variant === 'a') return `
  <div class="panel">
    <h2>Set manual point — edit one node</h2>
    <div class="row">
      <div class="field"><label>Tenor</label><select>${feed.map(p => `<option${p.c === '5Y' ? ' selected' : ''}>${p.c}</option>`).join('')}</select></div>
      <div class="field"><label>Value</label><input value="3.8850"></div>
      ${controls}
      <button class="btn primary" data-act="manual">Set manual point</button>
    </div>
    <div class="notice">There is no override operation: <span class="mono">marketdata.v1.market_observations.override</span> is missing. The button names the subject it needs and writes nothing; it does not fall back to <span class="mono">.put</span>.</div>
  </div>`;
  if (variant === 'b') return `
  <div class="panel">
    <h2>Apply spread overlay — over a segment</h2>
    <div class="row">
      <div class="field"><label>Kind</label><select><option>Parallel</option><option selected>Twist</option></select></div>
      <div class="field"><label>Applies to</label><select><option selected>segment 2Y-10Y</option><option>segment 5Y-30Y</option><option>all nodes</option></select></div>
      <div class="field"><label>Shift</label><input value="0.0005"></div>
      ${controls}
      <button class="btn primary" data-act="overlay">Apply spread overlay</button>
    </div>
    <div class="notice"><span class="mono">marketdata.v1.curve.shift</span> is missing, so the overlay names its kind, its segment, its shift and its reason and writes nothing. A twist over 2Y-10Y has no operation today.</div>
  </div>`;
  return `
  <div class="panel">
    <h2>Paste a set of nodes</h2>
    <div class="row">
      <div class="field" style="min-width:360px"><label>Nodes (tenor, value — one per line)</label><textarea rows="4" class="mono" style="background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:6px 8px">1Y 4.4050
2Y 4.3600
5Y 3.8850
10Y 4.1920</textarea></div>
      ${controls}
      <button class="btn primary" data-act="paste">Paste nodes</button>
    </div>
    <div class="notice">A pasted block is several manual points in one act. Nothing writes a reason per node, so the reason above is one reason for the whole paste, and it too has nowhere to go.</div>
  </div>`;
}

function surfacePanel(){
  return `
  <div class="panel">
    <h2>Set manual surface point</h2>
    <div class="row">
      <div class="field"><label>Expiry</label><select><option>1Y</option><option>2Y</option><option selected>5Y</option><option>10Y</option></select></div>
      <div class="field"><label>Strike</label><select disabled><option>(not modelled)</option></select></div>
      <div class="field"><label>Value</label><input value="19.8"></div>
      <div class="field"><label>Reason</label><select><option selected>Thin smile</option>${reasons.map(r => `<option>${r}</option>`).join('')}</select></div>
      <button class="btn" data-act="surface">Set manual surface point</button>
    </div>
    <div class="notice">No strike-label vocabulary and no surface point coordinate, so a point cannot be addressed by (expiry, strike) and the strike picker is absent.</div>
  </div>`;
}

function correctionsPanel(){
  const rows = overlays.concat(overrides).map(o => {
    const point = o.c || o.applies;
    const kind = o.kind ? 'overlay' : 'manual';
    const survives = state === 'overwrite' && o.c === '5Y'
      ? tag('held, hand wins until cleared', 'ok')
      : state === 'none'
      ? tag('no precedence rule', 'bad')
      : tag('no precedence rule', 'bad');
    return `<tr><td class="mono">${point}</td><td>${tag(kind, 'warn')}</td><td>${o.reason}</td><td>${o.actor} · ${o.at}</td><td>${survives}</td></tr>`;
  }).join('');
  const body = rows || '<tr><td colspan="5" class="faint">(none written) — the feed values stand and nothing is published</td></tr>';
  return `
  <div class="panel">
    <h2>Corrections</h2>
    <table>
      <thead><tr><th>Point</th><th>Kind</th><th>Reason</th><th>Actor · at</th><th>Survives a feed write</th></tr></thead>
      <tbody>${body}</tbody>
    </table>
    <div class="row">
      <button class="btn" data-act="clear">Clear manual point</button>
      <button class="btn" data-act="approval">Arrange approval</button>
      <button class="btn" data-act="leave">Leave unpublished</button>
    </div>
    <div class="notice">A manual point survives later feed updates until it is cleared. There is no clear operation and no history provider on <span class="mono">market_observation</span>, so a correction leaves no trail.</div>
  </div>`;
}

function render(){
  document.getElementById('app').innerHTML = header() + pointsPanel() + form() + surfacePanel() + correctionsPanel();
  document.getElementById('note').textContent =
    `Prototype · adjust a curve or surface by hand · variant ${variant.toUpperCase()} · corrections: ${state} · candidate, nothing published`;
  document.getElementById('bar').innerHTML =
    `<span class="label">Apply</span>` +
    ['a','b','c'].map(v => `<button data-v="${v}" class="${v === variant ? 'on' : ''}">${v.toUpperCase()} ${v === 'a' ? 'one node' : v === 'b' ? 'spread' : 'paste'}</button>`).join('') +
    `<span class="sep">|</span><span class="label">Corrections</span>` +
    ['none','some','overwrite'].map(s => `<button data-s="${s}" class="${s === state ? 'on' : ''}">${s}</button>`).join('');
  document.querySelectorAll('#bar [data-v]').forEach(b => b.onclick = () => set('variant', b.dataset.v));
  document.querySelectorAll('#bar [data-s]').forEach(b => b.onclick = () => set('state', b.dataset.s));
  document.querySelectorAll('[data-act]').forEach(b => b.onclick = () => {
    document.getElementById('note').textContent = `${b.textContent}: inert in this prototype — the subject it needs is missing`;
  });
}
function set(k, v){ const p = new URLSearchParams(location.search); p.set(k, v); location.search = p.toString(); }
render();
</script>
</body>
</html>
