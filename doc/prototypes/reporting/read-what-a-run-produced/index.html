<!--
  PROTOTYPE. Throwaway. Mock data, no backend, no build step.

  Read what a run produced, from
  doc/knowledge/journeys/reporting/journey_read_what_a_run_produced.org:
  the system's output message, the engine's output archive, the errors that
  came with it, and the ORE package the run read.

  Three variants, switchable with ?variant=A|B|C, and a run in view switchable
  with ?run=<instance-id prefix>. A puts the run's figures first, B puts the
  archive and a manifest of its files first, C puts a written summary first.
  The variants disagree about what "the result" is, not about colour.

  The fixture bar at the top of the page picks one of six mock runs: completed
  clean, completed carrying 8 Analytics errors and 3 Configuration warnings,
  failed, in flight, a substituting run that completed clean, and a second
  Headline Position run a day earlier which is the baseline the completed run is
  compared against. Beside them sits one scenario chip, results-with-errors, also
  reachable with ?scenario=results-with-errors: the completed run that carries
  errors drawn with its results saying they are partial. The bar at the foot
  prints the live variant, the scenario and the state it is showing.

  Variant A's result panel compares. The control under the analytics names a
  previous completed run of the same definition, or no comparison; it defaults to
  the previous run so the feature is visible on load, and ?baseline=none turns it
  off. Each figure, each book row, each tree node and the total row then carries
  its change and percentage against that run, whose instance id and start time
  are printed beside the control. The baseline's figures are that run's own
  fixture numbers, never this run's numbers scaled, so the books move by
  different amounts. A change whose two sides are not both complete is marked
  partial: the results-with-errors scenario shows the current run's case.

  Honest gaps, repeated on the page: no operation lists the files inside a
  run's archive, no operation or route serves the archive's bytes, and no read
  serves parsed results or the exported ORE package. The manifest and every
  figure are drawn from this file.

  The per-trade table is drawn from this file too. Per-trade results are real: a
  run writes npv.csv into its archive with one row per trade, its NPV, its
  base-currency NPV, its notional and its counterparty. No operation parses the
  archive, so the table is a fixture and says so on the panel; opening a row
  answers with that trade's result, and with the error the run recorded against
  its TradeId where it recorded one.

  The book tree is the third reading: the run's result rolled up from a trade to
  its book, a book to its portfolio, and a portfolio to the group portfolio
  above it. It is a fixture for two reasons the panel states. The archive carries
  no book column -- npv.csv's columns are exactly TradeId, TradeType, Maturity,
  MaturityTime, NPV, NpvCurrency, NPV(Base), BaseCurrency, Notional,
  NotionalCurrency, Notional(Base), NettingSet and CounterParty -- so a built
  screen joins each TradeId to trade_bookings.book_id through
  trading.v1.trade_bookings.list, and no operation returns results already
  grouped by book. And no operation parses the archive, so no node has a figure
  behind it. The portfolio tree is assembled from portfolios.list, which carries
  parent_portfolio_id, because there is no
  portfolios.list_by_parent_portfolio_id. A trade booked to no book is a real
  state, so the tree draws an Unbooked node rather than dropping the row.

  The figures are not free invention: each run names the analytics its report
  configuration runs (Headline Position runs npv and sensitivity, Large
  Exposures runs npv and saccr), and every measure and every manifest row is an
  output of that named set. The set is printed on the screen and in the fixture
  switcher, so a reader can see why these figures and not others.
-->
