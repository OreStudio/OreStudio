        if (!set) { return noSetPage(); }
        var tab = TABS.indexOf(S.tab) >= 0 ? S.tab : 'details';
        var lead = esc(set.party) + ' · as-of ' + esc(exact(set.asof)) + ' · ' + setStateBadge(set.state) +
            (set.state === 'published'
                ? ' · published ' + when(set.published_at)
                : ' · ' + (set.state === 'withdrawn' ? 'withdrawn' : 'superseded') + ' ' + when(set.ended_at));
        var actions = '<button class="btn" data-act="compare">Compare as of</button>' +
            '<button class="btn" data-act="reload">Refresh</button>';
        return crumbs([{ t: 'Home' }, { t: 'Market data' }, { t: 'Published curves', act: 'surface:list' }, { t: set.curve }]) +
            pagehead(set.curve, lead, actions) +
            '<div class="tabs" role="tablist">' +
            tabButton('details', 'Details', tab) + tabButton('points', 'Published points', tab) +
            tabButton('compare', 'Compare as of', tab) + tabButton('history', 'History', tab) + '</div>' +
            '<div class="card">' +
            (tab === 'points' ? pointsTab(set)
                : tab === 'compare' ? compareTab(set)
                : tab === 'history' ? historyTab(set)
                : detailsTab(set)) + '</div>';
    }

    function noSetPage() {
        var cand = CANDIDATES.filter(function (c) { return c.curve === S.curve && (!S.party || c.party === S.party); })[0];
        return crumbs([{ t: 'Home' }, { t: 'Market data' }, { t: 'Published curves', act: 'surface:list' }, { t: S.curve }]) +
            pagehead(S.curve, (cand ? esc(cand.party) : '') + ' · no published set',
                '<button class="btn" data-act="surface:list">Back to the list</button>') +
            '<div class="card"><h2>No published set</h2>' +
            '<p class="lede">A candidate exists and nobody has published it, so there is no record page and no baseline.</p>' +
            (cand ? '<dl class="fields">' +
                '<div><dt>Candidate built at</dt><dd>' + esc(exact(cand.built_at)) + '</dd></div>' +
                '<div><dt>Candidate built by</dt><dd>' + esc(person(cand.built_by).name) + '</dd></div>' +
                '<div><dt>As-of</dt><dd>' + esc(exact(cand.asof)) + '</dd></div>' +
                '<div><dt>Points</dt><dd class="mono">' + cand.points + '</dd></div></dl>' : '') +
            '<div style="margin-top:16px">' +
            chartPanel('Curve shape', emptyChart('No published set, so there is no curve to draw.')) + '</div>' +
            '<p class="hint">A comparison needs a published as-of to read. Until a publish record exists for the series, the tab cannot draw the baseline either.</p>' +
            gap('The comparison needs a published set to read. Until a publish record exists for the series, the screen has no baseline and states that.') +
            '</div>';
    }

    function tabButton(id, text, current) {
        return '<button role="tab" aria-selected="' + (current === id) + '" class="' + (current === id ? 'on' : '') +
            '" data-act="tab" data-arg="' + id + '">' + esc(text) + '</button>';
    }

    function detailsTab(set) {
        var ended = set.state !== 'published';
        return '<h2>Details</h2><p class="lede">The subject the request authorised, and the act that published it.</p>' +
            '<dl class="fields">' +
            '<div><dt>Curve configuration</dt><dd class="mono">' + esc(set.curve) + '</dd></div>' +
            '<div><dt>Party</dt><dd>' + esc(set.party) + '</dd></div>' +
            '<div><dt>Published as-of</dt><dd>' + esc(exact(set.asof)) + '</dd></div>' +
            '<div><dt>Publisher</dt><dd>' + esc(person(set.published_by).name) + '</dd></div>' +
            '<div><dt>Published at</dt><dd>' + esc(exact(set.published_at)) + '</dd></div>' +
            '<div><dt>Points published</dt><dd class="mono">' + set.points + '</dd></div>' +
            '<div><dt>Authorising request</dt><dd>' + mono(set.request) + '</dd></div>' +
            '<div><dt>Output series</dt><dd class="mono">' + esc(set.series) + '</dd></div>' +
            '<div><dt>State</dt><dd>' + setStateBadge(set.state) + '</dd></div>' +
            (ended ? '<div><dt>' + (set.state === 'withdrawn' ? 'Withdrawn at' : 'Superseded at') + '</dt><dd>' + esc(exact(set.ended_at)) + '</dd></div>' +
                '<div><dt>' + (set.state === 'withdrawn' ? 'Withdrawn by' : 'Superseded by') + '</dt><dd>' + esc(person(set.ended_by).name) + '</dd></div>' +
                '<div><dt>Authorising request</dt><dd>' + mono(set.ended_request) + '</dd></div>' +
                (set.reason_code ? '<div><dt>Reason</dt><dd>' + mono(set.reason_code) + ' — ' + esc(set.reason_text) + '</dd></div>' : '') : '') +
            '</dl>' +
            '<p class="lastchanged">Read only: a publish record is written by the gate that applies an approved request, and never by a screen. ' +
            'Last changed: published by ' + esc(person(set.published_by).name) + ' ' + when(set.published_at) + '.</p>' +
            gap('There is no withdrawal and no superseded marker on the publish record today, so this page would read the set in use but not what replaced it. ' +
                'The prototype draws the state and the fields the withdrawal decision adds.') +
            gap('The read that serves a curve returns the latest snapshot of one series. ' +
                'A list over the publish records is the missing read the list surface names.');
    }

    function chartPoints(set) {
        if (S.chart === 'none') { return []; }
        if (S.chart === 'one') { return PILLARS.slice(0, 1); }
        return PILLARS;
    }

    function pointsTab(set) {
        var points = chartPoints(set);
        var chart = curveChart({
            categories: points.map(function (p) { return p.tenor; }),
            published: points.map(function (p) { return p.value; }),
            caption: 'The published set at ' + exact(set.asof) + ' · ' + points.length + ' pillars.'
        });
        var body = PILLARS.map(function (p) {
            return '<tr><td>' + esc(p.tenor) + ' · ' + esc(p.role) + '</td>' +
                '<td class="num">' + discountFactor(p.tenor, p.value) + '</td>' +
                '<td class="num">' + rate(p.value) + '</td>' +
                '<td class="dim">bootstrapped</td>' +
                '<td class="dim">' + esc(exact(set.asof)) + '</td></tr>';
        }).join('');
        return '<h2>Published points</h2><p class="lede">The pillars the recipe asks for, and the shape the published set holds.</p>' +
            chartPanel('Curve shape', chart) +
            '<div class="listtools" style="margin-top:4px">' +
            '<button class="btn small" data-act="compare">Compare as of</button>' +
            '<span class="hint">Compares this set against a candidate at a chosen as-of.</span></div>' +
            '<table class="diff"><thead><tr><th>Pillar</th><th class="num">Discount factor</th><th class="num">Rate (%)</th><th>Source</th><th>Observed</th></tr></thead>' +
            '<tbody>' + body + '</tbody></table>' +
            '<p class="lastchanged">Each point is identified by its oresmd_uri, not by a tenor column. ' +
            'The pillar list comes from the curve configuration, so a point the recipe drops is not shown here either.</p>' +
            gap('The read returns observations for a series and an instant. It does not return the pillar list beside them, ' +
                'so the screen joins them by the recipe as it stands today and not as it stood at the as-of.');
    }

    function compareTab(set) {
        var cand = CANDIDATES.filter(function (c) { return c.curve === set.curve && c.party === set.party; })[0];
        var asof = S.asof || set.asof;
        var entry = AS_OFS.filter(function (a) { return a.iso === asof; })[0] || AS_OFS[0];
        var state = S.points || 'changed';
        if (state !== 'changed' && state !== 'same' && state !== 'added') { state = 'changed'; }

        var model = POINT_STATES[state];
        var rows = PILLARS.map(function (p) {
            var pubV = p.value + entry.shiftBp / 100;
            var move = model.moves[p.tenor];
            var dropped = model.dropped.indexOf(p.tenor) >= 0;
            var candV = dropped ? null : (move === undefined ? pubV : pubV + move / 100);
            return { tenor: p.tenor, role: p.role, pub: pubV, cand: candV, move: move, dropped: dropped, added: false };
        });
        model.added.forEach(function (tenor) {
            rows.push({ tenor: tenor, role: 'Swap', pub: null, cand: 3.8600, move: null, dropped: false, added: true });
        });
        rows.forEach(function (r) {
            r.mark = r.added ? 'added' : r.dropped ? 'dropped' : r.move === undefined ? 'unchanged' : 'changed';
        });

        var changed = rows.filter(function (r) { return r.mark === 'changed'; }).length;
        var added = rows.filter(function (r) { return r.mark === 'added'; }).length;
        var dropped = rows.filter(function (r) { return r.mark === 'dropped'; }).length;
        var unchanged = rows.filter(function (r) { return r.mark === 'unchanged'; }).length;
        var nothingChanged = changed === 0 && added === 0 && dropped === 0;

        var chartRows = rows.filter(function (r) { return S.chart === 'one' ? r.tenor === '1W' : true; });
        var chart = curveChart({
            categories: chartRows.map(function (r) { return r.tenor; }),
            published: chartRows.map(function (r) { return r.pub; }),
            candidate: chartRows.map(function (r) { return r.cand; }),
            caption: nothingChanged
                ? 'The two sets coincide at every point; the candidate line covers the published one.'
                : 'Published dashed, candidate solid. A gap is a pillar the set does not hold, and never a zero.'
        });

        var shown = S.unchanged ? rows : rows.filter(function (r) { return r.mark !== 'unchanged'; });
        var asofOptions = AS_OFS.map(function (a) { return { v: a.iso, t: a.label }; });

        var banner = nothingChanged
            ? '<div class="notice info"><b>No point changed.</b> The candidate matches the published set at ' +
              esc(exact(asof)) + ' point for point. There is nothing to raise, and the published set stays the one in use.</div>'
            : '';
        var endedNotice = set.state !== 'published'
            ? '<div class="notice warn"><b>The baseline set was ' + (set.state === 'withdrawn' ? 'withdrawn' : 'superseded') + '.</b> ' +
              'The comparison still answers what the candidate changes against the last published set, and the desk prices from ' +
              (set.state === 'withdrawn' ? 'no set of this curve.' : 'its successor.') + '</div>'
            : '';

        var table = '<table class="diff"><thead><tr><th>Pillar</th><th class="num">Published</th><th class="num">Candidate</th>' +
            '<th class="num">Change (bp)</th><th>Mark</th></tr></thead><tbody>' +
            (shown.length === 0 && !S.unchanged
                ? '<tr><td colspan="5" class="dim">Every point here is unchanged. ' + unchanged + ' points match the published set.</td></tr>'
                : shown.map(function (r) {
                    var pubCell = r.pub === null ? '<span class="dash">—</span>'
                        : (r.mark === 'changed' ? '<span class="was">' + rate(r.pub) + '</span>' : rate(r.pub));
                    var candCell = r.cand === null ? '<span class="dash">—</span>'
                        : (r.mark === 'changed' || r.mark === 'added' ? '<span class="now">' + rate(r.cand) + '</span>' : rate(r.cand));
                    var change = r.mark === 'changed' ? bp(r.move)
                        : r.mark === 'added' ? badge('pending', 'new pillar')
                        : r.mark === 'dropped' ? badge('bad', 'not in candidate')
                        : '<span class="dash">—</span>';
                    var mark = r.mark === 'changed' ? badge('caution', 'Changed')
                        : r.mark === 'added' ? badge('pending', 'Added')
                        : r.mark === 'dropped' ? badge('bad', 'Dropped')
                        : '<span class="dim">Unchanged</span>';
                    return '<tr class="' + r.mark + '"><td>' + esc(r.tenor) + ' · ' + esc(r.role) + '</td>' +
                        '<td class="num">' + pubCell + '</td>' +
                        '<td class="num">' + candCell + '</td>' +
                        '<td class="num">' + change + '</td>' +
                        '<td class="mark">' + mark + '</td></tr>';
                }).join('')) +
            '</tbody></table>';

        return '<h2>Compare as of</h2><p class="lede">The candidate set against the published set at a chosen as-of.</p>' +
            '<div class="listtools">' +
            '<span class="dim">Compare against</span>' +
            select('asof', asofOptions, asof) +
            toggle('unchanged', 'Show unchanged points', S.unchanged) +
            '</div>' +
            endedNotice +
            '<div class="grid2" style="margin-bottom:16px">' +
            '<div class="panel"><h2>Published set <span class="sub">the baseline</span></h2>' +
            '<dl class="fields" style="grid-template-columns:1fr 1fr">' +
            '<div><dt>As-of</dt><dd>' + esc(exact(set.asof)) + '</dd></div>' +
            '<div><dt>Published by</dt><dd>' + esc(person(set.published_by).name) + ' ' + when(set.published_at) + '</dd></div>' +
            '<div><dt>Authorising request</dt><dd>' + mono(set.request) + '</dd></div>' +
            '<div><dt>State</dt><dd>' + setStateBadge(set.state) + '</dd></div>' +
            '</dl></div>' +
            '<div class="panel"><h2>Candidate set <span class="sub">what would replace it</span></h2>' +
            '<dl class="fields" style="grid-template-columns:1fr 1fr">' +
            '<div><dt>Built at</dt><dd>' + esc(exact(cand ? cand.built_at : '2026-10-07T08:15:00Z')) + '</dd></div>' +
            '<div><dt>Built by</dt><dd>' + esc(person(cand ? cand.built_by : 'a.reyes').name) + '</dd></div>' +
            '<div><dt>State</dt><dd>' + (state === 'same' ? 'A rebuild at the published as-of' : 'Not published · no approved request') + '</dd></div>' +
            '<div><dt>Points</dt><dd class="mono">' + (cand ? cand.points : 12) + '</dd></div>' +
            '</dl></div></div>' +
            banner +
            chartPanel('The two curves', chart) +
            '<p class="summary"><span class="stat"><b>' + changed + '</b> changed</span>' +
            '<span class="stat"><b>' + added + '</b> added</span>' +
            '<span class="stat"><b>' + dropped + '</b> dropped</span>' +
            '<span class="stat"><b>' + unchanged + '</b> unchanged</span></p>' +
            (unchanged > 0 && !S.unchanged && state !== 'same'
                ? '<p class="listnote">' + unchanged + ' unchanged points are hidden. Show unchanged points draws them.</p>'
                : '') + table +
            gap('No read returns a point-by-point difference. The candidate is ' +
                'marketdata.v1.curve_candidates.diff, taking the published as-of from the publish record. ' +
                'Until it exists this tab joins two observation sets by the point\'s oresmd_uri and marks an unmatched point as added or dropped.') +
            gap('A dropped point has no place in the model yet: an observation carries no valid_to, so the screen cannot say when the published point stopped applying. ' +
                'The withdrawal and supersession decision in the journey states the answer the record gains.');
    }

    /* ---------------------------------------------------------------- */
    /* The curve chart, plain SVG, as the application's LineChart draws.  */
    /* ---------------------------------------------------------------- */

    function chartPanel(title, body) {
        return '<div class="chartpanel"><h3>' + esc(title) + '</h3>' + body + '</div>';
    }

    function emptyChart(reason) {
        return '<div class="chartempty"><b>The chart cannot be drawn.</b>' + esc(reason) + '</div>';
    }

    var CHART_W = 720;
    var CHART_H = 250;
    var CHART_LEFT = 56;
    var CHART_RIGHT = 16;
    var CHART_TOP = 16;
    var CHART_BOTTOM = 40;

    function curveChart(opts) {
        var categories = opts.categories;
        var pub = opts.published;
        var cand = opts.candidate || null;
        var drawable = categories.length;
        if (drawable === 0) {
            return emptyChart('The set holds no points.');
        }
        if (drawable < 2) {
            return emptyChart('A curve needs at least two pillars. One point has no shape; the table below holds it.');
        }
        var values = [];
        pub.forEach(function (v) { if (v !== null) { values.push(v); } });
        if (cand) { cand.forEach(function (v) { if (v !== null) { values.push(v); } }); }
        var low = Math.min.apply(null, values);
        var high = Math.max.apply(null, values);
        var room = high === low ? Math.max(Math.abs(high) * 0.0005, 1e-6) : (high - low) * 0.12;
        var yLow = low - room;
        var yHigh = high + room;
        var plotW = CHART_W - CHART_LEFT - CHART_RIGHT;
        var plotH = CHART_H - CHART_TOP - CHART_BOTTOM;

        function xOf(i) { return CHART_LEFT + ((i + 0.5) * plotW) / drawable; }
        function yOf(v) { return CHART_TOP + plotH - ((v - yLow) / (yHigh - yLow)) * plotH; }

        var svg = [];
        svg.push('<svg class="chart" role="img" viewBox="0 0 ' + CHART_W + ' ' + CHART_H + '" ' +
            'preserveAspectRatio="xMidYMid meet" aria-label="' + esc(opts.caption) + '">');
        for (var g = 0; g < 5; g += 1) {
            var level = yLow + ((yHigh - yLow) * g) / 4;
            var y = yOf(level);
            svg.push('<line class="grid" x1="' + CHART_LEFT + '" x2="' + (CHART_W - CHART_RIGHT) +
                '" y1="' + y.toFixed(1) + '" y2="' + y.toFixed(1) + '"></line>');
            svg.push('<text x="' + (CHART_LEFT - 8) + '" y="' + (y + 3).toFixed(1) + '" text-anchor="end">' +
                rate(level) + '</text>');
        }
        svg.push('<line class="axis" x1="' + CHART_LEFT + '" x2="' + CHART_LEFT + '" y1="' + CHART_TOP +
            '" y2="' + (CHART_H - CHART_BOTTOM) + '"></line>');
        svg.push('<line class="axis" x1="' + CHART_LEFT + '" x2="' + (CHART_W - CHART_RIGHT) + '" y1="' +
            (CHART_H - CHART_BOTTOM) + '" y2="' + (CHART_H - CHART_BOTTOM) + '"></line>');
        categories.forEach(function (name, i) {
            svg.push('<text x="' + xOf(i).toFixed(1) + '" y="' + (CHART_H - 24) + '" text-anchor="middle">' +
                esc(name) + '</text>');
        });

        function runs(series) {
            var out = [];
            var current = [];
            series.forEach(function (v, i) {
                if (v === null || v === undefined) {
                    if (current.length) { out.push(current); current = []; }
                } else {
                    current.push([i, v]);
                }
            });
            if (current.length) { out.push(current); }
            return out;
        }
        function pathOf(run) {
            return run.map(function (p, k) {
                return (k === 0 ? 'M ' : 'L ') + xOf(p[0]).toFixed(1) + ' ' + yOf(p[1]).toFixed(1);
            }).join(' ');
        }

        if (cand) {
            runs(pub).forEach(function (run) {
                svg.push('<path d="' + pathOf(run) + '" fill="none" stroke="var(--ink-faint)" ' +
                    'stroke-width="1.4" stroke-dasharray="4 3" vector-effect="non-scaling-stroke"></path>');
            });
            runs(cand).forEach(function (run) {
                svg.push('<path d="' + pathOf(run) + '" fill="none" stroke="var(--accent)" ' +
                    'stroke-width="2.2" vector-effect="non-scaling-stroke"></path>');
            });
            cand.forEach(function (v, i) {
                if (v === null || v === undefined) {
                    if (pub[i] !== null && pub[i] !== undefined) {
                        svg.push('<circle cx="' + xOf(i).toFixed(1) + '" cy="' + yOf(pub[i]).toFixed(1) +
                            '" r="3.5" fill="none" stroke="var(--bad)" stroke-width="1.5"></circle>');
                    }
                } else {
                    svg.push('<circle cx="' + xOf(i).toFixed(1) + '" cy="' + yOf(v).toFixed(1) +
                        '" r="2.8" fill="var(--accent)"></circle>');
                }
            });
            pub.forEach(function (v, i) {
                if ((v === null || v === undefined) && cand[i] !== null && cand[i] !== undefined) {
                    svg.push('<circle cx="' + xOf(i).toFixed(1) + '" cy="' + yOf(cand[i]).toFixed(1) +
                        '" r="3.5" fill="none" stroke="var(--accent)" stroke-width="1.5"></circle>');
                }
            });
        } else {
            runs(pub).forEach(function (run) {
                svg.push('<path d="' + pathOf(run) + '" fill="none" stroke="var(--accent)" ' +
                    'stroke-width="2.2" vector-effect="non-scaling-stroke"></path>');
            });
            pub.forEach(function (v, i) {
                if (v !== null && v !== undefined) {
                    svg.push('<circle cx="' + xOf(i).toFixed(1) + '" cy="' + yOf(v).toFixed(1) +
                        '" r="2.8" fill="var(--accent)"></circle>');
                }
            });
        }
        svg.push('<text x="' + CHART_LEFT + '" y="' + (CHART_H - 6) + '">' + esc('Rate (%)') + '</text>');
        svg.push('<text x="' + (CHART_W - CHART_RIGHT) + '" y="' + (CHART_H - 6) + '" text-anchor="end">' +
            esc(cand ? 'published · candidate' : 'published') + '</text>');
        svg.push('</svg>');
        return '<div class="chartlegend"><span class="legendline">' + esc(opts.caption) + '</span></div>' + svg.join('');
    }

    /* ---------------------------------------------------------------- */
    /* The History tab, as the record screen standard and the entity      */
    /* screen specification's timeline draw it.                          */
    /* ---------------------------------------------------------------- */

    function historyOf(set) {
        var out = [];
        out.push({
            id: 'raised', version: 1, kind: 'raised', at: set.raised_at, by: set.raised_by,
            reason: 'system.new_record',
            note: 'The raise wrote the subject: the curve, the party, the output series and the as-of.',
            detail: { type: 'whole', set: set }
        });
        out.push({
            id: 'decision', version: null, kind: 'approved', at: set.approved_at, by: set.approved_by,
            reason: 'inbox.approval.approved',
            note: 'Approved the request. The decision belongs to the request, not to this record.',
            detail: { type: 'decision', comment: set.approved_comment, request: set.request }
        });
        out.push({
            id: 'published', version: 2, kind: 'published', at: set.published_at, by: set.published_by,
            reason: 'marketdata.publish.applied',
            note: 'Applied the approved request: the set became the curve the desk prices from.',
            detail: {
                type: 'diff',
                fields: [['published_by', '', set.published_by], ['published_at', '', exact(set.published_at)]]
            }
        });
        if (set.state === 'withdrawn') {
            out.push({
                id: 'withdrawn', version: 3, kind: 'withdrawn', at: set.ended_at, by: set.ended_by,
                reason: 'marketdata.publish.withdrawn',
                note: set.reason_text,
                detail: {
                    type: 'diff',
                    fields: [
                        ['withdrawn_at', '', exact(set.ended_at)],
                        ['withdrawn_by', '', set.ended_by],
                        ['withdrawn_reason_code', '', set.reason_code]
                    ]
                }
            });
        }
        if (set.state === 'superseded') {
            out.push({
                id: 'superseded', version: 3, kind: 'superseded', at: set.ended_at, by: set.ended_by,
                reason: 'marketdata.publish.superseded',
                note: set.reason_text,
                detail: {
                    type: 'diff',
                    fields: [
                        ['superseded_at', '', exact(set.ended_at)],
                        ['superseded_by_request_id', '', set.ended_request],
                        ['successor_as_of', '', exact(set.successor_asof)]
                    ]
                }
            });
        }
        return out.sort(function (a, b) { return Date.parse(b.at) - Date.parse(a.at); });
    }

    var KIND_STYLE = {
        raised: { label: 'Raised', cls: 'inactive', colour: 'var(--inactive)' },
        approved: { label: 'Approved', cls: 'pending', colour: 'var(--info)' },
        published: { label: 'Published', cls: 'ok', colour: 'var(--ok)' },
        withdrawn: { label: 'Withdrawn', cls: 'bad', colour: 'var(--bad)' },
        superseded: { label: 'Superseded', cls: 'caution', colour: 'var(--stale)' }
    };
    var HISTORY_ORDER = ['raised', 'approved', 'published', 'withdrawn', 'superseded'];

    function eventChart(entries) {
        var counts = {};
        HISTORY_ORDER.forEach(function (k) { counts[k] = 0; });
        var days = {};
        entries.forEach(function (e) {
            var k = dayKey(e.at);
            if (!days[k]) { days[k] = { total: 0, kinds: {} }; }
            days[k].total += 1;
            days[k].kinds[e.kind] = (days[k].kinds[e.kind] || 0) + 1;
            counts[e.kind] = (counts[e.kind] || 0) + 1;
        });
        var keys = Object.keys(days).sort();
        var top = Math.max.apply(null, keys.map(function (k) { return days[k].total; }));
        var barW = 26;
        var gap = 12;
        var left = 8;
        var height = 96;
        var width = Math.max(320, left * 2 + keys.length * (barW + gap));
        var svg = ['<svg class="chart" role="img" width="' + width + '" height="' + (height + 34) +
            '" viewBox="0 0 ' + width + ' ' + (height + 34) +
            '" aria-label="History entries by day" preserveAspectRatio="xMinYMin meet">'];
        keys.forEach(function (key, i) {
            var x = left + i * (barW + gap);
            var d = days[key];
            var y = height;
            HISTORY_ORDER.forEach(function (kind) {
                var n = d.kinds[kind] || 0;
                if (n === 0) { return; }
                var h = (n / top) * (height - 8);
                y -= h;
                svg.push('<rect x="' + x + '" y="' + y.toFixed(1) + '" width="' + barW + '" height="' +
                    h.toFixed(1) + '" fill="' + KIND_STYLE[kind].colour + '" fill-opacity="0.85" ' +
                    'data-act="jump" data-arg="' + esc(key) + '"><title>' + esc(dayName(key + 'T00:00:00Z')) +
                    ' · ' + d.total + (d.total === 1 ? ' entry' : ' entries') + '</title></rect>');
            });
            svg.push('<text x="' + (x + barW / 2) + '" y="' + (height + 16) + '" text-anchor="middle">' +
                esc(key.slice(5)) + '</text>');
        });
        svg.push('<line class="axis" x1="0" x2="' + width + '" y1="' + height + '" y2="' + height + '"></line>');
        svg.push('</svg>');
        var legend = HISTORY_ORDER.filter(function (k) { return counts[k] > 0; }).map(function (k) {
            return '<span><span class="sw" style="background:' + KIND_STYLE[k].colour + '"></span>' +
                esc(KIND_STYLE[k].label) + ' <span class="mono">' + counts[k] + '</span></span>';
        }).join('');
        return '<div class="histchart">' + svg.join('') + '</div><p class="histlegend">' + legend +
            '<span class="faint">One bar a day, split by the kind of entry. Click a bar to reach its entries.</span></p>';
    }

    function wholeRecord(set) {
        var rows = [
            ['curve configuration', set.curve],
            ['party', set.party],
            ['output series', set.series],
            ['as-of', exact(set.asof)],
            ['published_by', '—'],
            ['published_at', '—']
        ];
        return '<dl class="fields" style="grid-template-columns:1fr 1fr">' + rows.map(function (r) {
            return '<div><dt>' + esc(r[0]) + '</dt><dd class="mono">' + esc(r[1]) + '</dd></div>';
        }).join('') + '</dl>';
    }

    function diffDetail(fields) {
        return '<table class="diff"><thead><tr><th>Field</th><th>Before</th><th>After</th></tr></thead><tbody>' +
            fields.map(function (f) {
                return '<tr><td>' + esc(f[0]) + '</td><td class="was">' + (f[1] === '' ? '' : esc(f[1])) +
                    '</td><td class="now">' + esc(f[2]) + '</td></tr>';
            }).join('') + '</tbody></table>';
    }

    function historyRail(entries) {
        var html = [];
        var lastDay = '';
        var versioned = entries.filter(function (e) { return e.version !== null; });
        var newestId = versioned.length ? versioned[0].id : '';
        entries.forEach(function (e) {
            var day = dayKey(e.at);
            if (day !== lastDay) {
                if (lastDay !== '') { html.push('</ul>'); }
                html.push('<div class="daydiv">' + esc(dayName(e.at)) + '</div><ul class="histrail">');
                lastDay = day;
            }
            var style = KIND_STYLE[e.kind];
            var detail;
            if (e.detail.type === 'whole') {
                detail = wholeRecord(e.detail.set);
            } else if (e.detail.type === 'decision') {
                detail = '<p class="detailline">Comment: ' + esc(e.detail.comment) + '</p>' +
                    '<p class="detailline">Read on the request ' + esc(e.detail.request) + ', version 2. ' +
                    'The decision is the request\'s record, and it is drawn here because the publish stands on it.</p>';
            } else {
                detail = diffDetail(e.detail.fields);
            }
            html.push('<li id="e-' + esc(e.id) + '">' +
                '<div class="gutter"><span title="' + esc(exact(e.at)) + '">' + esc(rel(e.at)) + '</span>' +
                (e.id === newestId ? '<span class="cur">Current version</span>' : '') + '</div>' +
                '<div class="face"><span class="avatar" aria-hidden="true">' + esc(initials(person(e.by).name)) + '</span></div>' +
                '<div><div class="head">' + badge(style.cls, style.label) +
                '<span class="rec">' + esc(e.kind === 'approved' ? 'approval_request ' + e.detail.request : 'curve_publish v' + e.version) + '</span>' +
                '<span class="why">' + esc(e.reason) + '</span>' +
                '<span>' + esc(person(e.by).name) + '</span></div>' +
                '<p class="note">' + esc(e.note) + '</p>' +
                '<details><summary>Details</summary>' + detail + '</details>' +
                '</div></li>');
        });
        if (lastDay !== '') { html.push('</ul>'); }
        return html.join('');
    }

    function historyTab(set) {
        var entries = historyOf(set);
        return '<h2>History</h2>' +
            '<p class="lede">The story of this set: the raise, the decision it stands on, the apply, and its end. ' +
            'Newest first. <span class="access">Read only</span></p>' +
            '<div class="histtools">' +
            toggle('service', 'Hide system activity', false) +
            '<span class="hint">Drawn even here: no service account wrote this record. The toggle is the timeline\'s own.</span>' +
            '</div>' +
            '<div class="histwrap"><h3>Entries over time</h3>' + eventChart(entries) + '</div>' +
            historyRail(entries) +
            '<p class="lastchanged">No version offers Revert. A publish record is read only: the gate writes it, and no person may write it back. ' +
            'A correction is a new publish or a withdrawal, and each is an act of its own with a request behind it.</p>' +
            gap('The publish record is bitemporal, so its versions hold the raised subject beside the applied one. ' +
                'The history read returns a record\'s versions; the approval decision is not one of them, and no read merges the request\'s decisions into the record\'s stream. ' +
                'The screen reads the decision by request_id and merges it by time, which the note states as the open question it is.') +
            gap('The record carries no change_reason_code and no change_commentary, because the gate writes it and not a person. ' +
                'The entry names the act and its fields instead, and a reason code exists only on the withdrawal the decision adds.');
    }

    /* ---------------------------------------------------------------- */
    /* The approvals queue, and the request page.                        */
    /* ---------------------------------------------------------------- */

    function queueRows() {
        var areas = person(S.actor).decides || [];
        return REQUESTS.filter(function (r) {
            if (r.by === S.actor) { return false; }
            var area = r.kind.split('.')[0];
            if (areas.indexOf(area) < 0) { return false; }
            if (S.kind !== 'all' && area !== S.kind) { return false; }
            if (!S.q) { return true; }
            var hay = ([r.ref, r.kind, r.label, r.subjectText, r.by, r.reason,
                r.subject ? r.subject.curve + ' ' + r.subject.party : ''].join(' ')).toLowerCase();
            return hay.indexOf(S.q.toLowerCase()) >= 0;
        }).sort(function (a, b) { return Date.parse(a.at) - Date.parse(b.at); });
    }

    function requestSubject(r) {
        if (r.subject) {
            return '<span class="key">' + esc(r.subject.curve) + '</span> <span class="dim">· ' + esc(r.subject.party) + '</span>' +
                '<span class="sub">as-of ' + esc(exact(r.subject.asof)) + ' · ' + r.subject.points + ' points</span>';
        }
        return esc(r.subjectText || '') + '<span class="sub">Request ' + esc(r.ref) + '</span>';
    }

    function queueSurface() {
        if (S.open) { return requestPage(); }
        if (S.state === 'none') { return queueEmpty(); }

        var rows = queueRows();
        var table = '<table class="rows queue"><thead><tr>' +
            '<th scope="col" style="width:180px">Who</th>' +
            '<th scope="col" style="width:42%">Asked for</th>' +
            '<th scope="col">Why</th>' +
            '<th scope="col" style="width:150px">Waiting</th></tr></thead><tbody>' +
            rows.map(function (r) {
                return '<tr class="pick" data-openreq="' + esc(r.id) + '" tabindex="0" role="link">' +
                    '<td><span class="person"><span class="avatar" aria-hidden="true">' +
                    esc(initials(person(r.by).name)) + '</span>' + esc(person(r.by).name) + '</span></td>' +
                    '<td class="askedfor">' + badge('class', r.label) +
                    '<span class="kindcode">' + esc(r.kind) + '</span>' +
                    '<span class="subjectline">' + requestSubject(r) + '</span></td>' +
                    '<td class="why dim">' + esc(r.reason) + '</td>' +
                    '<td class="nowrap">' + when(r.at) + '<span class="sub">' + stateBadge(r.state) + '</span></td></tr>';
            }).join('') + '</tbody></table>';

        var empty = rows.length === 0
            ? '<div class="tblstate"><b>No request matches.</b>Clear the search or the kind filter to see the queue. ' +
              '<button class="btn small" data-act="clear">Clear</button></div>'
            : table;

        return crumbs([{ t: 'Home' }, { t: 'Requests' }]) +
            pagehead('Requests',
                'Every request in the tenant, your own, and the queue of those you may decide.',
                '<button class="btn" data-act="reload">Refresh</button>') +
            myRequests() +
            '<div class="listtools">' +
            '<span class="searchbox"><input type="text" data-input="qsearch" placeholder="Search requests" value="' + esc(S.q) + '" aria-label="Search requests"></span>' +
            select('kind', [{ v: 'all', t: 'All kinds' }, { v: 'marketdata', t: 'Market data' },
                { v: 'iam', t: 'Access' }, { v: 'refdata', t: 'Reference data' }], S.kind) +
            '</div>' +
            '<p class="listnote">' + rows.length + ' requests you may decide. A request appears when you hold the permission its kind names; ' +
            esc(person(S.actor).name) + ' holds ' + esc((person(S.actor).decides || []).map(function (a) {
                return KIND_AREA[a];
            }).join(', ') || 'no decide permission') + '. ' +
            'The asked-for line is the request\'s own subject, read beside its header. ' +
            '<span class="dim">Oldest first.</span></p>' +
            empty +
            gap('The queue read returns a generic view. It carries the account and the roles a role request names, and a trade subject for a trading authorisation, ' +
                'but nothing that names a curve, a party or an as-of. The candidate is a subject line each kind declares, drawn from its own detail table, ' +
                'so the asked-for column can carry the curve publish\'s subject and the role request\'s roles. Until it exists the market-data row shows the kind alone.') +
            gap('The asked-for column is the change this screen needs: it holds one line of text today, and a curve publish needs a badge, a curve, a party and an as-of. ' +
                'The role and counterparty rows keep one line, so the column grows only where a kind asks for it.') +
            gap('The queue is scoped by the decide permission and never by party, so a curve published for one party is decided by the tenant\'s Market Risk. ' +
                'The subject names its party, so the decider knows whose curve it is.');
    }

    function myRequests() {
        var mine = REQUESTS.filter(function (r) { return r.by === S.actor; });
        var body = mine.length === 0
            ? '<p class="dim">You have no requests.</p>'
            : '<table class="rows"><thead><tr><th>Asked for</th><th>Kind</th><th>Waiting</th><th>State</th></tr></thead><tbody>' +
              mine.map(function (r) {
                  return '<tr><td>' + requestSubject(r) + '</td><td class="mono">' + esc(r.kind) + '</td>' +
                      '<td>' + when(r.at) + '</td><td>' + stateBadge(r.state) + '</td></tr>';
              }).join('') + '</tbody></table>';
        return '<div class="card" style="padding:16px;margin:0 0 16px"><h3 style="margin:0 0 8px">My requests</h3>' + body + '</div>';
    }

    function queueEmpty() {
        return crumbs([{ t: 'Home' }, { t: 'Requests' }]) +
            pagehead('Requests', 'Every request in the tenant, your own, and the queue of those you may decide.') +
            '<div class="tblstate"><b>Nothing waits for you to decide.</b>' +
            'A request appears here when it names a kind whose decide permission you hold, and when somebody else raised it. ' +
            'Your own requests are never listed.</div>' +
            gap('The queue total is the count the page walks, because the same statement that filters by kind and permission also leaves out your own requests.');
    }

    function subjectPanel(r) {
        if (!r.subject) {
            return '<div class="panel"><h2>Subject <span class="sub">' + esc(r.kind) + '</span></h2>' +
                '<dl class="fields" style="grid-template-columns:1fr 1fr">' +
                '<div><dt>The request is about</dt><dd>' + esc(r.subjectText || '') + '</dd></div>' +
                '<div><dt>Kind</dt><dd class="mono">' + esc(r.kind) + '</dd></div></dl>' +
                '<p class="hint">This kind keeps its subject in its own table, which the market-data screens do not read.</p></div>';
        }
        var s = r.subject;
        return '<div class="panel"><h2>Subject <span class="sub">' + esc(r.kind) + '</span></h2>' +
            '<dl class="fields" style="grid-template-columns:repeat(3,1fr)">' +
            '<div><dt>Curve configuration</dt><dd class="mono">' + esc(s.config) + '</dd></div>' +
            '<div><dt>Party</dt><dd>' + esc(s.party) + '</dd></div>' +
            '<div><dt>Published as-of</dt><dd>' + esc(exact(s.asof)) + '</dd></div>' +
            '<div><dt>Points</dt><dd class="mono">' + s.points + '</dd></div>' +
            '<div><dt>Candidate built</dt><dd>' + when(s.built_at) + ' by ' + esc(person(s.built_by).name) + '</dd></div>' +
            '<div><dt>Output series</dt><dd class="mono">' + (s.series ? esc(s.series) : '<span class="dash">—</span>') + '</dd></div>' +
            '</dl>' +
            '<p class="hint">A request authorises this curve at this as-of for this party, and nothing else. ' +
            'A publish of another curve, another as-of or another party is refused with both subjects named.</p></div>';
    }

    function deltaSummaryPanel(r) {
        if (!r.subject) { return ''; }
        return '<div class="panel"><h2>The delta the decision rests on</h2>' +
            '<p class="summary"><span class="stat"><b>4</b> changed</span><span class="stat"><b>1</b> added</span>' +
            '<span class="stat"><b>1</b> dropped</span><span class="stat"><b>7</b> unchanged</span></p>' +
            '<p class="hint">The candidate against the published set at ' + esc(exact(r.subject.asof)) + '. ' +
            '<button class="btn small" data-act="compare" data-arg="' + esc(r.subject.curve) + '|' + esc(r.subject.party) + '">' +
            'Open the comparison</button></p>' +
            gap('The comparison is the missing read of the same name. It is drawn here as the summary the decider needs, ' +
                'not as a value the queue read returns.') + '</div>';
    }

    function checksPanel(r) {
        if (!r.subject) { return ''; }
        var names = ['Every pillar priced', 'Discount factors monotonic', 'No arbitrage'];
        return '<div class="panel"><h2>Checks over the candidate</h2>' +
            '<table class="rows"><thead><tr><th>Check</th><th>Result</th></tr></thead><tbody>' +
            names.map(function (n) {
                return '<tr><td>' + esc(n) + '</td><td>' + badge('inactive', 'Unknown') + '</td></tr>';
            }).join('') + '</tbody></table>' +
            gap('No operation runs these checks over a candidate set and returns the result. ' +
                'The candidate is marketdata.v1.curve_bootstrap.validate, returning one row per check. ' +
                'Until it exists each row reads unknown: not checked, not passed.') + '</div>';
    }

    function requestPage() {
        var r = REQUESTS.filter(function (x) { return x.id === S.open; })[0];
        if (!r) { S.open = ''; return queueSurface(); }
        var decisions = (DECISIONS[r.id] || []).slice();
        var rstate = r.state;
        if (S.state === 'held' && !S.decision) {
            rstate = 'held';
            if (decisions.length === 0) {
                decisions.push({ at: '2026-10-06T16:20:00Z', by: S.actor, what: 'hold',
                    comment: 'Waiting on the 4pm fixing.', reason: 'awaiting_fixing' });
            }
        }
        if (S.state === 'decided' && !S.decision) {
            rstate = 'approved';
            if (decisions.length === 0) {
                decisions.push({ at: '2026-10-06T16:12:00Z', by: S.actor, what: 'approve',
                    comment: 'Checked against the 16:00 quotes.' });
            }
        }
        if (S.decision) {
            rstate = S.decision === 'approve' ? 'approved' : S.decision === 'refuse' ? 'refused' : 'held';
            var taken = decisions.some(function (d) { return d.by === S.actor && d.what === S.decision; });
            if (!taken) {
                decisions.push({ at: '2026-10-07T09:00:00Z', by: S.actor, what: S.decision,
                    comment: S.comment || (S.decision === 'approve' ? 'Checked against the 16:00 quotes.' : ''),
                    reason: S.decision === 'hold' ? 'awaiting_fixing' : '' });
            }
        }
        var final = rstate === 'approved' || rstate === 'refused';
        var outcome = S.decision
            ? '<div class="notice ' + (S.decision === 'approve' ? 'success' : S.decision === 'refuse' ? 'error' : 'warn') + '"><b>' +
              (S.decision === 'approve' ? 'Approved.' : S.decision === 'refuse' ? 'Refused.' : 'Held.') + '</b> ' +
              (S.decision === 'approve'
                  ? 'The request is approved. Nothing publishes yet: the trader applies the approved subject in Publish the approved set.'
                  : S.decision === 'refuse'
                      ? 'The request is refused and the reason is kept. ' + esc(person(r.by).name) + ' reads your comment.'
                      : 'The request is parked in the queue until somebody resumes it. ' + esc(person(r.by).name) + ' is told.') +
              '</div>'
            : '';

        var decisionsBlock = decisions.length === 0
            ? '<p class="dim">No decision yet.</p>'
            : '<ul class="histrail">' + decisions.map(function (d) {
                return '<li><span class="gutter">' + when(d.at) + '</span><div class="face"><span class="avatar" aria-hidden="true">' +
                    esc(initials(person(d.by).name)) + '</span></div><div><div class="head">' +
                    badge(d.what === 'approve' ? 'ok' : d.what === 'refuse' ? 'bad' : 'caution',
                        d.what === 'approve' ? 'Approved' : d.what === 'refuse' ? 'Refused' : 'Held') +
                    '<span>' + esc(person(d.by).name) + '</span></div>' +
                    '<p class="note">' + esc(d.comment) + (d.reason ? ' <span class="dim">Reason: ' + esc(d.reason) + '</span>' : '') + '</p></div></li>';
            }).join('') + '</ul>';

        var commentNeeds = S.chosen === 'refuse';
        var bad = S.tried && commentNeeds && !S.comment.trim();
        var panel = final
            ? '<p class="dim">This request is ' + stateName(rstate).toLowerCase() + ' and can no longer be decided. ' +
              'A refusal is final; an approval is reversed rather than edited.</p>'
            : '<div role="radiogroup" aria-label="Decision">' +
              choice('approve', 'Approve', 'The request closes approved; the trader still applies the approved subject.') +
              choice('refuse', 'Refuse', 'The request ends. A comment is required, because the asker reads it.') +
              choice('hold', 'Hold', 'The request stays in the queue and the asker is told.') +
              '</div>' +
              '<div class="field' + (bad ? ' bad' : '') + '" style="margin-top:16px"><span class="lbl">Comment' +
              (commentNeeds ? ' <span class="req">(required)</span>' : '') + '</span>' +
              '<textarea data-input="comment" aria-label="Comment">' + esc(S.comment) + '</textarea>' +
              (bad ? '<p class="msg">Say why you refuse, so the person who asked can act.</p>' : '') + '</div>' +
              '<div class="stepfoot"><span class="dim">Your decision is recorded under your name.</span>' +
              '<span class="ml-auto"></span><button class="btn primary" data-act="send"' + (S.chosen ? '' : ' disabled') +
              '>Send the decision</button></div>';

        var title = r.subject ? 'Publish ' + r.subject.curve : r.label + ' · ' + r.ref;
        var mayDecide = (person(S.actor).decides || []).indexOf(r.kind.split('.')[0]) >= 0;

        return crumbs([{ t: 'Home' }, { t: 'Requests', act: 'queue' }, { t: r.ref }]) +
            pagehead(title,
                stateBadge(rstate) + ' · ' + badge('class', r.label) + ' · asked ' + when(r.at) + ' by ' + esc(person(r.by).name) +
                ' · expires ' + when(r.expires),
                '<button class="btn" data-act="queue">Back to the queue</button>') +
            outcome +
            '<div style="display:grid;gap:16px">' +
            subjectPanel(r) +
            '<div class="panel"><h2>Reason given</h2><p>' + esc(r.reason) + '</p></div>' +
            deltaSummaryPanel(r) +
            checksPanel(r) +
            '<div class="panel"><h2>The rule</h2>' +
            '<dl class="fields" style="grid-template-columns:repeat(4,1fr)">' +
            '<div><dt>Deciding group</dt><dd>' + esc(r.group) + '</dd></div>' +
            '<div><dt>Approvals needed</dt><dd class="mono">1</dd></div>' +
            '<div><dt>Comment on approve</dt><dd>Not required</dd></div>' +
            '<div><dt>Hold</dt><dd>Allowed, with a reason code</dd></div>' +
            '<div><dt>You may decide</dt><dd>' + (mayDecide ? 'Yes, and you did not raise it' : 'No: your roles do not hold the kind\'s decide permission') + '</dd></div>' +
            '<div><dt>Expiry</dt><dd>' + esc(exact(r.expires)) + '</dd></div>' +
            '</dl>' +
            '<p class="hint">The group is drawn from the permission the kind names. The model names a permission and not a group, ' +
            'so the name is a candidate the screen shows beside the code.</p></div>' +
            '<div class="panel"><h2>Decisions so far</h2>' + decisionsBlock + '</div>' +
            '<div class="panel"><h2>Your decision</h2>' + panel + '</div>' +
            '</div>' +
            gap('Nothing applies a publish when the last decider approves. The trader calls publish_curve again with the approved request, ' +
                'as Publish the approved set draws it.') +
            gap('No notification tells the approver that a request waits, and none tells the asker what was decided. ' +
                'The queue is the only signal today.');
    }

    function choice(value, name, sub) {
        return '<div class="choice' + (S.chosen === value ? ' on' : '') + '" role="radio" aria-checked="' +
            (S.chosen === value) + '" tabindex="0" data-act="decide" data-arg="' + value + '">' +
            '<span class="dot"></span><span><span class="nm">' + esc(name) + '</span><br>' +
            '<span class="sub">' + esc(sub) + '</span></span></div>';
    }

    /* ---------------------------------------------------------------- */
    /* The bottom bar: the surface, the tab, the state and the gaps.      */
    /* ---------------------------------------------------------------- */

    function bar() {
        var surfaces = [['list', 'List'], ['queue', 'Queue']];
        var listStates = [['rows', 'Rows'], ['none', 'No published'], ['nomatch', 'No match'], ['loading', 'Loading'], ['error', 'Error']];
        var compareStates = [['changed', 'Changed'], ['same', 'Nothing changed'], ['added', 'One added'], ['nopublished', 'No published set']];
        var queueStates = [['queue', 'Queue'], ['request', 'Open request'], ['held', 'Held'], ['decided', 'Decided'], ['none', 'Nothing waits']];
        var record = S.surface === 'list' && S.curve;
        var out = '<span class="label">Surface</span>' +
            surfaces.map(function (s) {
                return '<button data-act="surface" data-arg="' + s[0] + '" class="' + (S.surface === s[0] ? 'on' : '') + '">' + s[1] + '</button>';
            }).join('');
        if (record) {
            var words = { details: 'Details', points: 'Published points', compare: 'Compare as of', history: 'History' };
            out += '<span class="sep">|</span><span class="label">Tab</span>' +
                TABS.map(function (t) {
                    return '<button data-act="tab" data-arg="' + t + '" class="' + (S.tab === t ? 'on' : '') + '">' + words[t] + '</button>';
                }).join('');
        }
        if (S.surface === 'list') {
            if (record && S.tab === 'compare') {
                out += '<span class="sep">|</span><span class="label">Compare</span>' +
                    compareStates.map(function (s) {
                        var on = s[0] === (S.points || 'changed');
                        return '<button data-act="cstate" data-arg="' + s[0] + '" class="' + (on ? 'on' : '') + '">' + s[1] + '</button>';
                    }).join('');
            } else if (!record) {
                out += '<span class="sep">|</span><span class="label">List</span>' +
                    listStates.map(function (s) {
                        var on = s[0] === (S.state || 'rows');
                        return '<button data-act="lstate" data-arg="' + s[0] + '" class="' + (on ? 'on' : '') + '">' + s[1] + '</button>';
                    }).join('');
            }
        }
        if (S.surface === 'queue') {
            var current = S.open ? (S.state || 'request') : (S.state || 'queue');
            out += '<span class="sep">|</span><span class="label">State</span>' +
                queueStates.map(function (s) {
                    return '<button data-act="qstate" data-arg="' + s[0] + '" class="' + (s[0] === current ? 'on' : '') + '">' + s[1] + '</button>';
                }).join('') +
                '<span class="sep">|</span><span class="label">Looking as</span>' +
                ['n.haugen', 'm.oduya', 'k.mori'].map(function (id) {
                    return '<button data-act="actor" data-arg="' + id + '" class="' + (S.actor === id ? 'on' : '') + '">' +
                        esc(person(id).name) + '</button>';
                }).join('');
        }
        out += '<span class="sep">|</span><button data-act="gaps">' +
            (document.body.classList.contains('nogaps') ? 'Show gaps' : 'Hide gaps') + '</button>';
        return out;
    }

    /* ---------------------------------------------------------------- */
    /* Render and act.                                                   */
    /* ---------------------------------------------------------------- */

    function render() {
        if (['list', 'queue'].indexOf(S.surface) < 0) { S.surface = 'list'; }
        if (TABS.indexOf(S.tab) < 0) { S.tab = 'details'; }
        document.getElementById('shell').innerHTML = shell();
        var body = S.surface === 'list' ? listSurface() : queueSurface();
        document.getElementById('app').innerHTML = body;
        document.getElementById('bar').innerHTML = bar();
        document.getElementById('note').textContent = 'Prototype · mock data · reads no server · ' +
            S.surface + (S.surface === 'list' && S.curve ? ' · ' + S.tab : ' · ' + (S.state || 'rows'));
        sync();
        wire();
    }

    function wire() {
        var si = document.querySelector('[data-input=search]');
        if (si) {
            si.addEventListener('input', function () {
                S.q = si.value; S.page = 0;
                var pos = si.selectionStart;
                render();
                var n = document.querySelector('[data-input=search]');
                n.focus(); n.setSelectionRange(pos, pos);
            });
        }
        var qi = document.querySelector('[data-input=qsearch]');
        if (qi) {
            qi.addEventListener('input', function () {
                S.q = qi.value;
                var pos = qi.selectionStart;
                render();
                var n = document.querySelector('[data-input=qsearch]');
                n.focus(); n.setSelectionRange(pos, pos);
            });
        }
        var ci = document.querySelector('[data-input=comment]');
        if (ci) {
            ci.addEventListener('input', function () { S.comment = ci.value; });
        }
    }

    function goSurface(s) {
        S.surface = s;
        S.state = '';
        S.menu = '';
        S.page = 0;
        S.q = '';
        S.kind = 'all';
        S.decision = null;
        S.chosen = '';
        S.comment = '';
        S.tried = false;
        S.curve = '';
        S.party = '';
        S.tab = 'details';
        S.asof = '';
        S.points = '';
        if (s !== 'queue') { S.open = ''; }
        render();
    }

    function openRecord(curve, party, tab) {
        S.surface = 'list';
        S.curve = curve;
        S.party = party;
        S.tab = tab || 'details';
        S.state = '';
        S.menu = '';
        S.points = '';
        S.asof = '';
        render();
    }

    document.addEventListener('click', function (e) {
        var anchor = e.target.closest && e.target.closest('a[href="#"]');
        if (anchor) { e.preventDefault(); }
        var jump = e.target.closest('[data-act=jump]');
        if (jump) {
            var key = jump.getAttribute('data-arg');
            var target = null;
            var all = document.querySelectorAll('[id^="e-"]');
            for (var j = 0; j < all.length; j += 1) {
                var at = all[j].querySelector('.gutter span');
                if (at && at.getAttribute('title') && at.getAttribute('title').indexOf(key) >= 0) {
                    target = all[j];
                    break;
                }
            }
            if (target) {
                target.scrollIntoView({ block: 'center' });
                target.classList.add('marked');
            } else {
                var first = document.querySelector('[id^="e-"]');
                if (first) { first.scrollIntoView({ block: 'center' }); first.classList.add('marked'); }
            }
            return;
        }
        var menuBtn = e.target.closest('[data-act=menu]');
        if (menuBtn) {
            var id = menuBtn.getAttribute('data-arg');
            S.menu = S.menu === id ? '' : id;
            render();
            return;
        }
        var pick = e.target.closest('[data-act=pick]');
        if (pick) {
            var parts = pick.getAttribute('data-arg').split(':');
            var which = parts[0], value = parts.slice(1).join(':');
            S.menu = '';
            if (which === 'size') { S.size = Number(value); S.page = 0; }
            if (which === 'fparty') { S.partyFilter = value; S.page = 0; }
            if (which === 'kind') { S.kind = value; }
            if (which === 'asof') { S.asof = value; }
            render();
            return;
        }
        if (S.menu) { S.menu = ''; render(); return; }

        var row = e.target.closest('[data-open]');
        if (row && S.surface === 'list') {
            var v = row.getAttribute('data-open').split('|');
            S.curve = v[0]; S.party = v[1]; S.tab = 'details'; S.asof = '';
            S.state = '';
            render();
            return;
        }
        var qrow = e.target.closest('[data-openreq]');
        if (qrow && S.surface === 'queue') {
            S.open = qrow.getAttribute('data-openreq'); S.state = '';
            S.decision = null; S.chosen = ''; S.comment = ''; S.tried = false;
            render();
            return;
        }

        var b = e.target.closest('[data-act]');
        if (!b) { return; }
        var act = b.getAttribute('data-act');
        var arg = b.getAttribute('data-arg');
        if (act === 'surface') {
            goSurface(arg === 'queue' ? 'queue' : 'list');
        }
        else if (act === 'tab') {
            S.tab = arg; S.state = ''; S.menu = '';
            if (arg !== 'compare') { S.points = ''; S.unchanged = false; S.asof = ''; }
            render();
        }
        else if (act === 'lstate') {
            S.curve = ''; S.party = ''; S.state = arg === 'rows' ? '' : arg; S.page = 0;
            render();
        }
        else if (act === 'cstate') {
            S.state = '';
            if (arg === 'nopublished') {
                S.curve = 'JPY-TONA-6M'; S.party = 'ACME Hong Kong'; S.tab = 'compare';
            } else {
                S.tab = 'compare';
                S.points = arg === 'changed' ? '' : arg;
                if (!S.curve || S.curve === 'JPY-TONA-6M') { S.curve = 'USD-SOFR-3M'; S.party = 'ACME London'; }
            }
            render();
        }
        else if (act === 'qstate') {
            S.state = '';
            S.decision = null; S.chosen = ''; S.comment = ''; S.tried = false;
            if (arg === 'queue') { S.open = ''; S.state = ''; }
            else if (arg === 'none') { S.open = ''; S.state = 'none'; }
            else { S.open = 'r1'; S.state = arg === 'request' ? '' : arg; }
            render();
        }
        else if (act === 'actor') {
            S.actor = arg; S.open = ''; S.state = '';
            S.decision = null; S.chosen = ''; S.comment = '';
            render();
        }
        else if (act === 'toggle') {
            if (arg === 'candidates') { S.show = S.show === 'candidates' ? 'published' : 'candidates'; S.page = 0; }
            if (arg === 'ended') { S.ended = !S.ended; S.page = 0; }
            if (arg === 'unchanged') { S.unchanged = !S.unchanged; }
            render();
        }
        else if (act === 'sort') {
            if (S.sort === arg) { S.dir = -S.dir; } else { S.sort = arg; S.dir = 1; }
            render();
        }
        else if (act === 'page') {
            var count = filteredRows().length;
            var pages = Math.max(1, Math.ceil(count / S.size));
            if (arg === 'first') { S.page = 0; }
            if (arg === 'prev') { S.page = Math.max(0, S.page - 1); }
            if (arg === 'next') { S.page = Math.min(pages - 1, S.page + 1); }
            if (arg === 'last') { S.page = pages - 1; }
            render();
        }
        else if (act === 'clear') { S.q = ''; S.partyFilter = 'all'; S.page = 0; S.state = ''; render(); }
        else if (act === 'reload') { render(); }
        else if (act === 'retry') { S.state = ''; render(); }
        else if (act === 'tabfirst') { openRecord('USD-SOFR-3M', 'ACME London', 'compare'); }
        else if (act === 'compare') {
            var curve = S.curve, party = S.party;
            if (arg) { var c = arg.split('|'); curve = c[0]; party = c[1]; }
            openRecord(curve || 'USD-SOFR-3M', party || 'ACME London', 'compare');
        }
        else if (act === 'queue') { goSurface('queue'); }
        else if (act === 'surface:list') { goSurface('list'); }
        else if (act === 'decide') { S.chosen = arg; render(); }
        else if (act === 'send') {
            S.tried = true;
            if (S.chosen === 'refuse' && !S.comment.trim()) { render(); return; }
            S.decision = S.chosen;
            render();
        }
        else if (act === 'gaps') {
            document.body.classList.toggle('nogaps');
            render();
        }
    });

    document.addEventListener('keydown', function (e) {
        if (e.key !== 'Enter' && e.key !== ' ') { return; }
        var t = e.target;
        if (t.matches && (t.matches('[data-open]') || t.matches('[data-openreq]'))) {
            e.preventDefault(); t.click();
        } else if (t.getAttribute && t.getAttribute('role') === 'radio') {
            e.preventDefault(); t.click();
        }
    });

    render();
})();
</script>
</body>
</html>
