<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pricing screen prototype — trade entry</title>
<link rel="stylesheet" href="prototype.css">
</head>
<body>

<div class="app">

    <div id="head"></div>

    <div class="workspace">

        <section class="panel">
            <header>
                <h2>Market data</h2>
                <span class="faint small mono" id="market-note"></span>
            </header>
            <div class="body">
                <table class="price-table">
                    <thead><tr><th>Quote</th><th class="num">Value</th></tr></thead>
                    <tbody id="market-rows"></tbody>
                </table>

                <div class="subhead">Tweaks</div>
                <div class="tweak-grid" id="tweaks"></div>
                <button class="ghost" id="reset-tweaks" style="margin-top:10px">Reset</button>
            </div>
        </section>

        <section class="panel">
            <header>
                <h2>Valuation</h2>
                <span class="faint small mono" id="valuation-note"></span>
            </header>
            <div class="body">
                <div class="npv-readout">
                    <span class="big" id="npv-value">—</span>
                    <span id="npv-ccy"></span>
                    <span id="npv-delta"></span>
                </div>
                <div class="subhead">Breakdown</div>
                <table class="price-table">
                    <thead>
                        <tr><th>Line</th><th class="num">NPV</th><th class="num">Notional</th></tr>
                    </thead>
                    <tbody id="price-rows"></tbody>
                </table>
            </div>
        </section>

    </div>

    <div class="book-bar">
        <div id="price-actions" style="display:flex;gap:8px"></div>
    </div>

</div>

<dialog id="ticket-dialog">
    <header>
        <h2>Price a new trade</h2>
        <span class="faint small" data-loaded></span>
        <button class="ghost" data-close>Close</button>
    </header>
    <div class="dialog-body">
        <div class="field-grid" id="ticket-fields"></div>
    </div>
    <footer>
        <button class="ghost" data-close>Cancel</button>
        <button class="primary" id="ticket-confirm">Price it</button>
    </footer>
</dialog>

<script src="common.js"></script>
<script src="entry-shell.js"></script>
<script src="catalogue.js"></script>
<script src="draft.js"></script>
<script src="pricing.js"></script>
</body>
</html>
