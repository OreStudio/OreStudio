---
name: Codegen sweep
on:  # yamllint disable-line rule:truthy
  # Deliberately wider than codegen-drift.yml, which fires on the inputs
  # codegen reads. The sweep exists for the output codegen writes, and the
  # measured case touched no model at all: a rename in one component left a
  # stale pasted block in another component's generated handler. So this
  # workflow fires on any change under projects/.
  push:
    branches: ["main"]
    paths:
      - "projects/**"
      - "doc/recipes/**"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The drift gate renders the components in component_registry.py and compares
  # the tree. That set is the components that are already clean, so a component
  # waiting its turn has no gate at all, and neither does output an archetype
  # routes into another component's tree: rendering ores.trading writes 66
  # files under projects/ores.shell/, which no run of ores.shell can reach.
  #
  # The sweep renders all 21 catalogue components into a temporary root and
  # compares, which reaches both. It then fails only on the files this branch
  # touched, because a component's remaining drift belongs to that component's
  # own clean-up story and is not this branch's to fix. Because it renders into
  # a temporary root it writes nothing, so it is safe on a branch whose
  # templates are older than main's -- which is the hazard that makes the
  # in-place drift check destructive.
  sweep:
    runs-on: ubuntu-24.04
    steps:
      # fetch-depth 0 so origin/main exists and the merge base can be taken:
      # the sweep cannot tell drift this branch caused from drift that was
      # already there without it.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install codegen dependencies
        run: |
          pip install --quiet -r projects/ores.codegen/requirements.txt
      # The renderer runs clang-format over its C++ output and prettier over
      # its TypeScript output, and the sweep compares bytes, so both have to be
      # present or every generated file reads as drifted. The clang-format
      # package is deliberate: it is the same one the other codegen jobs use.
      # Prettier's version is read from the workspace rather than repeated
      # here, because a different prettier formats differently.
      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install prettier
        run: |
          version=$(node -p "require('./projects/ores.web/package.json').devDependencies.prettier")
          npm install --global "prettier@${version}"
      - name: Sweep every catalogue component for drift this branch caused
        run: |
          python3 projects/ores.codegen/scripts/check_component_drift.py --sweep

  # Pasted block symbols: a model can paste hand-written C++ into generated
  # output through an :implements block, and the block reaches the compiler only
  # when its component is regenerated. The ores.service clean-up moved three
  # workflow header names out of ores.service into ores.workflow.api, and
  # ores.refdata keeps a workflow override as such a block. The generated handler
  # was hand-edited to the new names and the model was left naming the deleted
  # ones, so the next refdata regeneration would have reverted the edit and
  # broken the build. --all was green and CI was green on every head.
  #
  # The sweep catches that case because the model and the generated file
  # disagree; it cannot catch the narrower one where both agree and are both
  # stale, because the render reproduces the committed bytes. This reads the
  # model, so it catches both and a rename fails at review without a
  # regeneration.
  #
  # It lives here rather than in codegen-drift.yml because it is sensitive to a
  # rename in any component's headers, and that workflow fires on the inputs
  # codegen reads. This one fires on any change under projects/, which is what a
  # header rename is. It reads the models and the headers only, so it needs
  # neither codegen nor a formatter and takes about eight seconds.
  paste-blocks:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Check every pasted block names symbols that exist
        run: |
          python3 projects/ores.codegen/scripts/check_paste_block_symbols.py
