<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Withdraw or replace a published curve prototype — Market data journeys</title>
<style>
:root{color-scheme:dark;--bg:#121214;--panel:#1a1a1e;--panel-2:#26262b;--line:#30363d;--line-soft:#21262d;--ink:#e3e3e6;--ink-dim:#a1a1aa;--ink-faint:#71717a;--accent:#58a6ff;--accent-dim:#21262d;--ok:#3fb950;--warn:#d29922;--bad:#f85149;--radius:.5rem;--mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink)}
body{margin:0;font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;padding:2.5rem 1.5rem 8rem}
h1,h2,h3{margin:0;font-weight:600}h1{font-size:1.15rem}h2{font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-dim)}
p{margin:0}ul{margin:0;padding:0;list-style:none}a{color:var(--accent);text-decoration:none}
button,input,select{font:inherit;color:inherit}button{cursor:pointer}
.mono{font-family:var(--mono)}.muted{color:var(--ink-dim)}.faint{color:var(--ink-faint)}
.wrap{max-width:1080px;margin:0 auto;display:grid;gap:14px}
.top{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px;display:grid;gap:10px}
.panel>h2{border-bottom:1px solid var(--line-soft);padding-bottom:6px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.field{display:grid;gap:4px;min-width:170px}.field label{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-faint)}
.field .value,.field select,.field input{background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:6px 8px}
table{width:100%;border-collapse:collapse;font-size:.86rem}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line-soft)}
th{font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-faint);font-weight:600}
td.num{text-align:right;font-family:var(--mono)}
.btn{background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:7px 12px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#0d1117;font-weight:600}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.tag{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:1px 8px;font-size:.72rem;color:var(--ink-dim)}
.tag.ok{color:var(--ok);border-color:#1f4d29}.tag.bad{color:var(--bad);border-color:#5a2320}.tag.warn{color:var(--warn);border-color:#4a3a17}
.notice{border:1px dashed var(--line);border-radius:var(--radius);padding:10px 12px;color:var(--ink-dim);background:#161619}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:820px){.grid2{grid-template-columns:1fr}}
.proto-note{position:fixed;top:0;left:0;right:0;z-index:60;padding:6px 14px;background:repeating-linear-gradient(45deg,#2a2113,#2a2113 10px,#241d11 10px,#241d11 20px);border-bottom:1px solid #4a3a17;color:var(--warn);font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.proto-bar{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:60;display:flex;gap:2px;align-items:center;padding:5px 7px;background:#0b0e13;border:1px solid var(--line);border-radius:999px;box-shadow:0 8px 30px rgba(0,0,0,.6);font-size:12px;max-width:95vw;flex-wrap:wrap;justify-content:center}
.proto-bar button{background:none;border:none;color:var(--ink-dim);padding:6px 10px;border-radius:999px}
.proto-bar button:hover{background:var(--panel-2);color:var(--ink)}.proto-bar button.on{background:var(--accent-dim);color:var(--ink)}
.proto-bar .label{padding:0 8px}.proto-bar .sep{color:var(--line)}
.urlbtn{display:inline-flex;align-items:baseline;gap:6px;max-width:100%;background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:3px 8px;color:var(--ink);text-align:left}
.urlbtn:hover{border-color:var(--accent)}
.urlbtn .mono{overflow-wrap:anywhere}
.urlbtn .edit{color:var(--accent);font-size:10px;letter-spacing:.06em;text-transform:uppercase}
.oresmd-overlay{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:18px}
.oresmd-frame{width:min(1120px,96vw);height:min(840px,92vh);border:1px solid var(--line);border-radius:var(--radius);background:var(--bg)}
</style>
</head>
<body>

<!--
  PROTOTYPE. Throwaway. Mock data, no backend, no build step, no session.

  The trader's "Withdraw or replace a published curve" screen
  (doc/knowledge/journeys/market_data/journey_withdraw-or-replace-a-published-curve.org):
  the published curve at the top, its versions and the proposed change in the
  middle, and the reason, the action and the effect on consumers at the bottom.

  Variants with ?variant=a|b|c: a is the withdraw form, b the replace form, c
  puts the version being retired beside the replacement.
  ?state=no-approval|approval|withdrawn sets the kind's approvals_required and
  the record already in the history. Nothing here calls a service.
-->

<div class="proto-note" id="note"></div>
<div class="wrap" id="app"></div>
<div class="proto-bar" id="bar"></div>

<script>
const params = new URLSearchParams(location.search);
const variant = params.get('variant') || 'a';
const state = params.get('state') || 'no-approval';

const kinds = {
  'no-approval': {approvals:'0 - the trader withdraws alone', note:'approvals_required is 0, so the withdrawal applies at once.'},
  approval: {approvals:'1 (Market data approvers)', note:'One approver holding marketdata::curve_withdrawal:decide must decide.'},
  withdrawn: {approvals:'1 (Market data approvers)', note:'Withdrawn at 2026-10-06 17:05 by m.oduya. The act is a new version, not a deletion.'}
}[state] || {approvals:'—', note:'Unknown state; showing the published curve and its versions only.'};
const retired = {version:'v4', by:'a.reyes', at:'2026-10-06 16:00', asof:'2026-10-06 16:00', source:'bloomberg', recipe:'USD-SOFR-3M (v4)'};
const replacement = {version:'v4.1', by:'a.reyes', at:'2026-10-06 17:00', asof:'2026-10-06 17:00', source:'refinitiv', recipe:'USD-SOFR-3M (v4)'};
const reason = '4pm pillar was stale; reloading from the corrected feed';

const delta = [
  {tenor:'1M', current:4.1250, next:4.1400, why:'4pm pillar was stale'},
  {tenor:'6M', current:4.3760, next:4.3790, why:'reloaded from refinitiv'},
  {tenor:'2Y', current:4.3550, next:4.3488, why:'corrected quote'},
  {tenor:'5Y', current:4.2480, next:4.2410, why:'corrected quote'},
  {tenor:'10Y', current:4.1850, next:4.1855, why:''},
  {tenor:'30Y', current:3.9110, next:3.9110, why:''}
];
const consumers = [
  {who:'Pricing (j.silva, maker)', effect:'the next run reads the withdrawn or replacement version', notified:'no'},
  {who:'Risk and reporting (ops)', effect:'reports already published stay unchanged', notified:'no'},
  {who:'Curves desk (a.reyes)', effect:'subsequent builds start from the replacement', notified:'no'}
];

const pct = v => v.toFixed(4);
const bp = (a, b) => { const d = (b - a) * 100; return (d > 0 ? '+' : '') + d.toFixed(2) + ' bp'; };
const tag = (t, k) => `<span class="tag ${k || ''}">${t}</span>`;

function urlButton(url){
  return `<button class="urlbtn" type="button" data-url="${url}" title="Edit in the oresmd URL editor">`+
         `<span class="mono">${url}</span><span class="edit">edit</span></button>`;
}
function openOresmdEditor(url, host){
  const ov=document.createElement('div'); ov.className='oresmd-overlay';
  const f=document.createElement('iframe'); f.className='oresmd-frame'; f.title='oresmd URL editor';
  f.src='../oresmd-url-editor/index.html?embed=1&url='+encodeURIComponent(url||'');
  ov.appendChild(f); document.body.appendChild(ov);
  function close(){ window.removeEventListener('message', onMsg); document.removeEventListener('keydown', onKey); ov.remove(); }
  function onMsg(e){ if(e.data && e.data.type==='oresmd-url'){ host.dataset.url=e.data.url; const m=host.querySelector('.mono'); if(m) m.textContent=e.data.url; close(); } }
  function onKey(e){ if(e.key==='Escape') close(); }
  window.addEventListener('message', onMsg); document.addEventListener('keydown', onKey);
  ov.addEventListener('click', e=>{ if(e.target===ov) close(); });
}
document.addEventListener('click', e=>{
  const b=e.target.closest('.urlbtn'); if(!b) return;
  openOresmdEditor(b.dataset.url||'', b);
});
function header(){
  const w = state === 'withdrawn';
  return `
  <div class="top">
    <h1>Curves / USD IRS</h1>
    ${w ? tag('withdrawn', 'bad') : tag('published? unknown', 'warn')}
    <a style="margin-left:auto" href="../../../knowledge/journeys/market_data/journey_withdraw-or-replace-a-published-curve.html">the journey &rarr;</a>
  </div>
  <div class="panel">
    <h2>Published curve</h2>
    <div class="row">
      <div class="field"><label>Identity</label><div class="value mono">${urlButton('oresmd://ir/USD?type=quote&amp;instrument=ir_swap')}</div></div>
      <div class="field"><label>Derivation</label><div class="value">IR_CURVE_BOOTSTRAP</div></div>
      <div class="field"><label>Recipe</label><div class="value">${retired.recipe}</div></div>
      <div class="field"><label>Latest observations</label><div class="value mono">${retired.asof}</div></div>
      <div class="field"><label>Published state</label><div class="value">${w ? 'withdrawn 17:05' : 'no published marker'}</div></div>
    </div>
    <div class="notice">The snapshot read returns the latest observations only. Nothing marks a version published, so the screen cannot say which version pricing is using.</div>
  </div>`;
}

function versions(){
  const rows = state === 'withdrawn'
    ? `<tr><td class="mono">v4.1</td><td class="mono">2026-10-06 17:00</td><td>a.reyes</td><td class="mono">2026-10-06 17:00</td><td>${tag('withdrawn', 'bad')}</td></tr>
       <tr><td class="mono">v4</td><td class="mono">2026-10-06 16:00</td><td>a.reyes</td><td>—</td><td>${tag('superseded', 'warn')}</td></tr>`
    : `<tr><td class="mono">—</td><td class="mono">—</td><td>—</td><td>—</td><td>${tag('no published marker', 'warn')}</td></tr>`;
  return `
  <div class="panel">
    <h2>Published versions</h2>
    <table><thead><tr><th>Version</th><th>When</th><th>By</th><th>As of</th><th>State</th></tr></thead><tbody>${rows}</tbody></table>
    <div class="notice">No published_at, no published_by and no superseded link exist, so no version can be marked live.</div>
  </div>`;
}

function deltaTable(){
  return `<table><thead><tr><th>Point</th><th class="num">Current</th><th class="num">Replacement</th><th class="num">Change</th><th>Why</th></tr></thead><tbody>
    ${delta.map(d => `<tr><td class="mono">tenor=${d.tenor}</td><td class="num">${pct(d.current)}</td><td class="num">${pct(d.next)}</td><td class="num">${bp(d.current, d.next)}</td><td class="faint">${d.why || '—'}</td></tr>`).join('')}
  </tbody></table>`;
}

function form(action){
  const replacing = action === 'replace';
  return `
  <div class="panel">
    <h2>Action: ${action}</h2>
    <div class="row">
      <div class="field" style="flex:1;min-width:320px"><label>Reason (kept against the act)</label><input type="text" value="${reason}"></div>
      ${replacing ? `<div class="field"><label>Replacement as of</label><input type="text" value="${replacement.asof}"></div>
        <div class="field"><label>Replacement source</label><div class="value">${replacement.source}</div></div>` : ''}
      <div class="field"><label>Kind</label><div class="value mono">marketdata.curve_withdrawal</div></div>
      <div class="field"><label>Approvals required</label><div class="value">${kinds.approvals}</div></div>
    </div>
    <div class="row">
      <button class="btn primary" disabled>Raise ${action} request</button>
      <button class="btn" disabled>${replacing ? 'Replace now' : 'Withdraw now'}</button>
      <span class="muted">${kinds.note}</span>
    </div>
    ${deltaTable()}
    <div class="notice">No ${action} operation exists (candidate marketdata.v1.curve_bootstrap.${action}), so the controls are disabled. The only write today, republish, would write a new set with nothing withdrawn and nothing linked.</div>
  </div>`;
}

function compare(){
  const side = (v, label, kindTag) => `
  <div class="panel">
    <h2>${label} ${kindTag}</h2>
    <table><tbody>
      <tr><td>Version</td><td class="mono">${v.version}</td></tr>
      <tr><td>Written by</td><td>${v.by}</td></tr>
      <tr><td>Written at</td><td class="mono">${v.at}</td></tr>
      <tr><td>As of</td><td class="mono">${v.asof}</td></tr>
      <tr><td>Source</td><td>${v.source}</td></tr>
      <tr><td>Recipe</td><td class="mono">${v.recipe}</td></tr>
    </tbody></table>
  </div>`;
  return `
  <div class="grid2">${side(retired, 'Version being retired', tag('live?', 'warn'))}${side(replacement, 'Replacement proposed', tag('not published', ''))}</div>
  <div class="panel">
    <h2>Field-level difference</h2>
    ${deltaTable()}
    <div class="notice">There is no baseline against the last published version, so this comparison uses the version read back, not a published record. Nothing links the replacement to the version it supersedes.</div>
  </div>`;
}

function consumersPanel(){
  return `
  <div class="panel">
    <h2>Consumers affected</h2>
    <table><thead><tr><th>Consumer</th><th>Effect</th><th>Notified</th></tr></thead><tbody>
    ${consumers.map(c => `<tr><td>${c.who}</td><td class="muted">${c.effect}</td><td>${tag(c.notified, 'bad')}</td></tr>`).join('')}
    </tbody></table>
    <div class="notice">No read maps this curve to its consumers, so these are the roles that read curves in general. No notification kind tells them a curve changed; the change is found at the next read.</div>
  </div>`;
}

function decisionsPanel(){
  const rows = {
    'no-approval': `<tr><td>${tag('none', '')}</td><td>—</td><td>—</td><td>—</td><td class="muted">approvals_required is 0; nothing waits</td></tr>`,
    approval: `<tr><td>${tag('waiting', 'warn')}</td><td>a.reyes</td><td class="mono">2026-10-06 17:02</td><td>—</td><td class="muted">raised under marketdata.curve_withdrawal</td></tr>`,
    withdrawn: `<tr><td>${tag('approved', 'ok')}</td><td>a.reyes</td><td class="mono">2026-10-06 16:58</td><td>m.oduya</td><td class="muted">Stale pillar confirmed.</td></tr>`
  }[state];
  return `
  <div class="panel">
    <h2>Decisions</h2>
    <table><thead><tr><th>State</th><th>Requested by</th><th>Requested at</th><th>Decided by</th><th>Comment</th></tr></thead><tbody>${rows}</tbody></table>
    <div class="notice">No market-data withdrawal kind is seeded; iam.role_grant is the only kind, and it does not withdraw a curve. An approver who is also the asker is refused.</div>
  </div>`;
}

function render(){
  const app = document.getElementById('app');
  const act = variant === 'b' ? form('replace') : variant === 'c' ? compare() : form('withdraw');
  app.innerHTML = header() + versions() + act + consumersPanel() + decisionsPanel();
  document.getElementById('note').textContent = `Prototype · withdraw or replace · variant ${variant.toUpperCase()} · kind: ${kinds.approvals} · approvals_required decides whether the act is immediate`;
  document.getElementById('bar').innerHTML =
    `<span class="label">Variant</span>` +
    ['a','b','c'].map(v => `<button data-v="${v}" class="${v===variant?'on':''}">${v.toUpperCase()}</button>`).join('') +
    `<span class="sep">|</span><span class="label">State</span>` +
    ['no-approval','approval','withdrawn'].map(s => `<button data-s="${s}" class="${s===state?'on':''}">${s}</button>`).join('');
  document.querySelectorAll('#bar [data-v]').forEach(b => b.onclick = () => set('variant', b.dataset.v));
  document.querySelectorAll('#bar [data-s]').forEach(b => b.onclick = () => set('state', b.dataset.s));
}
function set(k, v){ const p = new URLSearchParams(location.search); p.set(k, v); location.search = p.toString(); }
render();
</script>
</body>
</html>
