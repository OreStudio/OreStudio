<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Surface calibration prototype — Market data journeys</title>
<style>
:root{color-scheme:dark;--bg:#121214;--panel:#1a1a1e;--panel-2:#26262b;--line:#30363d;--line-soft:#21262d;--ink:#e3e3e6;--ink-dim:#a1a1aa;--ink-faint:#71717a;--accent:#58a6ff;--accent-dim:#21262d;--ok:#3fb950;--warn:#d29922;--bad:#f85149;--radius:.5rem;--mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink)}
body{margin:0;font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;padding:2.5rem 1.5rem 8rem}
h1,h2,h3{margin:0;font-weight:600}h1{font-size:1.15rem}h2{font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-dim)}
p{margin:0}ul{margin:0;padding:0;list-style:none}a{color:var(--accent);text-decoration:none}
button,input,select{font:inherit;color:inherit}button{cursor:pointer}
.mono{font-family:var(--mono)}.muted{color:var(--ink-dim)}.faint{color:var(--ink-faint)}
.wrap{max-width:1080px;margin:0 auto;display:grid;gap:14px}
.top{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px;display:grid;gap:10px}
.panel>h2{border-bottom:1px solid var(--line-soft);padding-bottom:6px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.field{display:grid;gap:4px;min-width:170px}.field label{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-faint)}
.field .value,.field select,.field input{background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:6px 8px}
table{width:100%;border-collapse:collapse;font-size:.86rem}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line-soft)}
th{font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-faint);font-weight:600}
td.num{text-align:right;font-family:var(--mono)}
.btn{background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:7px 12px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#0d1117;font-weight:600}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.tag{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:1px 8px;font-size:.72rem;color:var(--ink-dim)}
.tag.ok{color:var(--ok);border-color:#1f4d29}.tag.bad{color:var(--bad);border-color:#5a2320}.tag.warn{color:var(--warn);border-color:#4a3a17}
.notice{border:1px dashed var(--line);border-radius:var(--radius);padding:10px 12px;color:var(--ink-dim);background:#161619}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:820px){.grid2{grid-template-columns:1fr}}
.proto-note{position:fixed;top:0;left:0;right:0;z-index:60;padding:6px 14px;background:repeating-linear-gradient(45deg,#2a2113,#2a2113 10px,#241d11 10px,#241d11 20px);border-bottom:1px solid #4a3a17;color:var(--warn);font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.proto-bar{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:60;display:flex;gap:2px;align-items:center;padding:5px 7px;background:#0b0e13;border:1px solid var(--line);border-radius:999px;box-shadow:0 8px 30px rgba(0,0,0,.6);font-size:12px;max-width:95vw;flex-wrap:wrap;justify-content:center}
.proto-bar button{background:none;border:none;color:var(--ink-dim);padding:6px 10px;border-radius:999px}
.proto-bar button:hover{background:var(--panel-2);color:var(--ink)}.proto-bar button.on{background:var(--accent-dim);color:var(--ink)}
.proto-bar .label{padding:0 8px}.proto-bar .sep{color:var(--line)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.78rem}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px}
.urlbtn{display:inline-flex;align-items:baseline;gap:6px;max-width:100%;background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:3px 8px;color:var(--ink);text-align:left}
.urlbtn:hover{border-color:var(--accent)}
.urlbtn .mono{overflow-wrap:anywhere}
.urlbtn .edit{color:var(--accent);font-size:10px;letter-spacing:.06em;text-transform:uppercase}
.oresmd-overlay{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:18px}
.oresmd-frame{width:min(1120px,96vw);height:min(840px,92vh);border:1px solid var(--line);border-radius:var(--radius);background:var(--bg)}
</style>
</head>
<body>

<!--
  PROTOTYPE. Throwaway. Mock data, no backend, no build step, no session.

  The trader's "Calibrate or refresh a surface" screen
  (doc/knowledge/journeys/market_data/journey_calibrate-or-refresh-a-surface.org):
  the surface row and its as-of at the top, the quotes it reads and the
  parameterisation in the middle, and the calibration error and the slices they
  produce at the bottom, so the person reads cause above effect. The surface
  stays a candidate: nothing is published.

  The design question is the result view. Variants with ?variant=a|b|c: a is a
  slice table, b is a 2-D smile chart, c is a fit-error summary.
  ?state=converged|failed switches the mock: failed is a calibration that did
  not converge. Nothing reads a service.
-->

<div class="proto-note" id="note"></div>
<div class="wrap" id="app"></div>
<div class="proto-bar" id="bar"></div>

<script>
const params = new URLSearchParams(location.search);
const variant = params.get('variant') || 'a';
const state = params.get('state') || 'converged';

const quotes = [
  {tenor:'1Y',  term:'1Y',  v:21.4, src:'synthetic.v1.tick.vol', at:'16:00'},
  {tenor:'1Y',  term:'5Y',  v:19.8, src:'synthetic.v1.tick.vol', at:'16:00'},
  {tenor:'2Y',  term:'5Y',  v:19.1, src:'synthetic.v1.tick.vol', at:'16:00'},
  {tenor:'5Y',  term:'5Y',  v:18.1, src:'synthetic.v1.tick.vol', at:'16:00'},
  {tenor:'1Y',  term:'10Y', v:17.6, src:'synthetic.v1.tick.vol', at:'16:02'},
  {tenor:'10Y', term:'10Y', v:16.9, src:'synthetic.v1.tick.vol', at:'16:02'}
];

const slices = state === 'failed' ? [
  {tenor:'1Y',  atm:21.6, rr:-1.8, bf:0.9,  rmse:3.4},
  {tenor:'2Y',  atm:20.4, rr:-1.9, bf:1.0,  rmse:4.1},
  {tenor:'5Y',  atm:19.6, rr:-2.0, bf:1.0,  rmse:6.8},
  {tenor:'10Y', atm:24.6, rr:-2.2, bf:1.1,  rmse:46.2},
  {tenor:'30Y', atm:19.7, rr:-2.5, bf:1.3,  rmse:28.7}
] : [
  {tenor:'1Y',  atm:21.4, rr:-1.7, bf:0.8,  rmse:3.1},
  {tenor:'2Y',  atm:20.7, rr:-1.8, bf:0.9,  rmse:3.8},
  {tenor:'5Y',  atm:19.8, rr:-2.0, bf:1.0,  rmse:4.6},
  {tenor:'10Y', atm:18.9, rr:-2.2, bf:1.1,  rmse:7.2},
  {tenor:'30Y', atm:17.9, rr:-2.5, bf:1.3,  rmse:11.4}
];

const run = state === 'failed'
  ? {converged:false, iter:100, of:100, rmse:61.7, note:'stopped at the iteration cap: SABR alpha at its bound on the 10Y slice'}
  : {converged:true, iter:42, of:100, rmse:5.8, note:'fit within tolerance on every slice'};
const bad = s => s.rmse > 15;

function urlButton(url){
  return `<button class="urlbtn" type="button" data-url="${url}" title="Edit in the oresmd URL editor">`+
         `<span class="mono">${url}</span><span class="edit">edit</span></button>`;
}
function openOresmdEditor(url, host){
  const ov=document.createElement('div'); ov.className='oresmd-overlay';
  const f=document.createElement('iframe'); f.className='oresmd-frame'; f.title='oresmd URL editor';
  f.src='../oresmd-url-editor/index.html?embed=1&url='+encodeURIComponent(url||'');
  ov.appendChild(f); document.body.appendChild(ov);
  function close(){ window.removeEventListener('message', onMsg); document.removeEventListener('keydown', onKey); ov.remove(); }
  function onMsg(e){ if(e.data && e.data.type==='oresmd-url'){ host.dataset.url=e.data.url; const m=host.querySelector('.mono'); if(m) m.textContent=e.data.url; close(); } }
  function onKey(e){ if(e.key==='Escape') close(); }
  window.addEventListener('message', onMsg); document.addEventListener('keydown', onKey);
  ov.addEventListener('click', e=>{ if(e.target===ov) close(); });
}
document.addEventListener('click', e=>{
  const b=e.target.closest('.urlbtn'); if(!b) return;
  openOresmdEditor(b.dataset.url||'', b);
});
function tag(text, kind){ return `<span class="tag ${kind||''}">${text}</span>`; }
function flagOf(s){ return bad(s) ? tag('poor fit','bad') : s.rmse > 6 ? tag('watch','warn') : tag('ok','ok'); }
function wing(s){ return [s.atm + s.bf * 1.35 - s.rr * 0.8, s.atm + s.bf - s.rr / 2, s.atm, s.atm + s.bf + s.rr / 2, s.atm + s.bf * 1.35 + s.rr * 0.8]; }
const deltaAxis = ['10P','25P','ATM','25C','10C'];

function header(){
  return `
  <div class="top">
    <h1>Surface: USD swaption vol (USD.RATES.VOL)</h1>
    <span class="muted">candidate · not published</span>
    <a style="margin-left:auto" href="../../knowledge/journeys/market_data/journey_calibrate-or-refresh-a-surface.html">the journey &rarr;</a>
  </div>
  <div class="panel">
    <h2>Surface and as-of</h2>
    <div class="row">
      <div class="field" style="flex:1"><label>Series (oresmd URI)</label><div class="value mono">${urlButton('oresmd://vol/USD?type=surface&amp;instrument=swaption')}</div></div>
      <div class="field"><label>Asset class</label><div class="value">rates</div></div>
      <div class="field"><label>Derivation</label><div class="value">volatility (derived, candidate)</div></div>
      <div class="field"><label>As of</label><input type="datetime-local" value="2026-10-06T16:00"></div>
      <div class="field"><label>Published</label><div class="value">${tag('no','bad')}</div></div>
    </div>
    <div class="notice">Every read is keyed by the oresmd URI, so the screen shows the URI as the identity. A snapshot cannot be taken as of a past time.</div>
  </div>`;
}

function quotesPanel(){
  return `
  <div class="panel">
    <h2>Market quotes the surface is built from</h2>
    <table>
      <thead><tr><th>Quote (oresmd URI)</th><th class="num">Value</th><th>Source</th><th>Observed at</th></tr></thead>
      <tbody>${quotes.map(q => `<tr>
        <td class="mono faint">${urlButton(`ir/USD?type=quote&amp;tenor=${q.tenor}&amp;term=${q.term}`)}</td>
        <td class="num">${q.v.toFixed(1)}%</td><td class="muted">${q.src}</td><td class="faint">${q.at}</td></tr>`).join('')}</tbody>
    </table>
    <div class="notice">An observation is evidence the market sent; nobody signs it off.</div>
  </div>`;
}

function parameterisation(){
  return `
  <div class="panel">
    <h2>Parameterisation, and the calibration run</h2>
    <div class="row">
      <div class="field"><label>Axes</label><div class="value">${tag('not modelled','warn')}</div></div>
      <div class="field"><label>Quoting convention</label><div class="value">${tag('not modelled','warn')}</div></div>
      <div class="field"><label>Model</label><div class="value">SABR (selected, not stored)</div></div>
      <div class="field"><label>Iterations</label><div class="value mono">${run.iter} of ${run.of}</div></div>
      <div class="field"><label>Convergence</label><div class="value">${run.converged ? tag('converged','ok') : tag('no convergence','bad')}</div></div>
      <button class="btn primary" id="calibrate">Calibrate candidate</button>
      <span class="faint" id="calibrate-note"></span>
    </div>
    <div class="notice">There is no calibration engine and no operation to call: marketdata.v1.surface.calibrate is missing. The button names the step; ${run.note}.</div>
  </div>`;
}

function sliceTable(){
  return `
  <div class="panel">
    <h2>Slices — one smile per expiry</h2>
    <table>
      <thead><tr><th>Tenor</th><th class="num">ATM vol</th><th class="num">25d RR</th><th class="num">25d BF</th><th class="num">RMSE</th><th>Flag</th></tr></thead>
      <tbody>${slices.map(s => `<tr>
        <td class="mono">${s.tenor}</td><td class="num">${s.atm.toFixed(1)}%</td>
        <td class="num">${s.rr.toFixed(1)}</td><td class="num">${s.bf.toFixed(1)}</td>
        <td class="num">${s.rmse.toFixed(1)}bp</td><td>${flagOf(s)}</td></tr>`).join('')}</tbody>
      <tfoot><tr><td>overall</td><td class="num">—</td><td class="num">—</td><td class="num">—</td>
        <td class="num">${run.rmse.toFixed(1)}bp</td><td>${run.converged ? tag('fitted','ok') : tag('failed','bad')}</td></tr></tfoot>
    </table>
    <div class="notice">There is no slice read, so these smiles are the parameterisation the screen would ask for at marketdata.v1.surface-slice.get.</div>
  </div>`;
}

function smileChart(){
  const w = 960, h = 280, pad = 40;
  const series = slices.filter(s => ['1Y','5Y','10Y'].includes(s.tenor));
  const all = series.flatMap(wing);
  const lo = Math.min(...all) - 1, hi = Math.max(...all) + 1;
  const x = i => pad + i * (w - 2 * pad) / (deltaAxis.length - 1);
  const y = v => h - pad - (v - lo) * (h - 2 * pad) / (hi - lo);
  const colors = ['#58a6ff','#3fb950','#d29922'];
  return `
  <div class="panel">
    <h2>Smiles — vol against the delta axis</h2>
    <svg viewBox="0 0 ${w} ${h}" width="100%" height="280" role="img" aria-label="Smile per expiry over the delta axis">
      <line x1="${pad}" y1="${h - pad}" x2="${w - pad}" y2="${h - pad}" stroke="#30363d"></line>
      ${deltaAxis.map((d, i) => `<text x="${x(i).toFixed(1)}" y="${h - 12}" fill="#71717a" font-size="11" text-anchor="middle">${d}</text>`).join('')}
      ${series.map((s, k) => `<path d="${wing(s).map((v, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ')}" fill="none" stroke="${colors[k]}" stroke-width="2"></path>
        ${wing(s).map((v, i) => `<circle cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="2.5" fill="${colors[k]}"></circle>`).join('')}`).join('')}
    </svg>
    <div class="legend">${series.map((s, k) => `<span><i style="background:${colors[k]}"></i>${s.tenor} smile — ATM ${s.atm.toFixed(1)}%, RMSE ${s.rmse.toFixed(1)}bp</span>`).join('')}</div>
    <div class="notice">${run.converged
      ? 'The 10C and 10P wing points are the risk reversal and butterfly around ATM: the smile steepens with expiry.'
      : 'These are the last iterate, not a converged surface: the 10Y smile is displaced by the fit failure and must not be read as a quote.'}</div>
  </div>`;
}

function errorSummary(){
  const worst = slices.reduce((a, b) => b.rmse > a.rmse ? b : a);
  return `
  <div class="panel">
    <h2>Fit error summary</h2>
    <div class="row">
      <div class="field"><label>Overall RMSE</label><div class="value mono">${run.rmse.toFixed(1)}bp</div></div>
      <div class="field"><label>Worst slice</label><div class="value mono">${worst.tenor} · ${worst.rmse.toFixed(1)}bp</div></div>
      <div class="field"><label>Iterations</label><div class="value mono">${run.iter} of ${run.of}</div></div>
      <div class="field"><label>Convergence</label><div class="value">${run.converged ? tag('converged','ok') : tag('no convergence','bad')}</div></div>
    </div>
    <table>
      <thead><tr><th>Slice</th><th class="num">Residual, worst quote</th><th class="num">RMSE</th><th class="num">Share of total error</th><th>Flag</th></tr></thead>
      <tbody>${slices.map(s => `<tr>
        <td class="mono">${s.tenor}</td><td class="num">${(s.rmse * 1.4).toFixed(1)}bp</td><td class="num">${s.rmse.toFixed(1)}bp</td>
        <td class="num">${(s.rmse * s.rmse / slices.reduce((a, b) => a + b.rmse * b.rmse, 0) * 100).toFixed(0)}%</td>
        <td>${flagOf(s)}</td></tr>`).join('')}</tbody>
    </table>
    <div class="notice">No calibration-error read exists, so the panel is derived from the fit the page holds. marketdata.v1.surface.calibration.get would return the residual per quote and the error per slice.</div>
  </div>`;
}

function footer(){
  return `
  <div class="panel">
    <div class="row">
      <button class="btn" id="approval">Arrange approval</button>
      <button class="btn" id="leave">Leave unpublished</button>
      <span class="faint" id="leave-note"></span>
    </div>
    <div class="notice">Candidate only: not published, so pricing still reads the published surface. Leaving records no publication.</div>
  </div>`;
}

function render(){
  const view = variant === 'b' ? smileChart() : variant === 'c' ? errorSummary() : sliceTable();
  document.getElementById('app').innerHTML = header() + quotesPanel() + parameterisation() + view + footer();
  document.getElementById('calibrate').onclick = () => {
    document.getElementById('calibrate-note').textContent = run.converged
      ? `fit in ${run.iter} iterations, RMSE ${run.rmse.toFixed(1)}bp — nothing written`
      : 'no convergence: the candidate is the last iterate, not a surface';
  };
  document.getElementById('leave').onclick = () => {
    document.getElementById('leave-note').textContent = 'left unpublished — the published surface is unchanged';
  };
  document.getElementById('note').textContent = `Prototype · calibrate or refresh a surface · variant ${variant.toUpperCase()} · ${run.converged ? 'converged' : 'no convergence'} · candidate only`;
  document.getElementById('bar').innerHTML =
    `<span class="label">Result view</span>` +
    ['a','b','c'].map(v => `<button data-v="${v}" class="${v === variant ? 'on' : ''}">${v.toUpperCase()}</button>`).join('') +
    `<span class="sep">|</span><span class="label">Calibration</span>` +
    [['converged','converged'],['failed','failed']].map(([s, t]) => `<button data-s="${s}" class="${s === state ? 'on' : ''}">${t}</button>`).join('');
  document.querySelectorAll('#bar [data-v]').forEach(b => b.onclick = () => set('variant', b.dataset.v));
  document.querySelectorAll('#bar [data-s]').forEach(b => b.onclick = () => set('state', b.dataset.s));
}
function set(k, v){ const p = new URLSearchParams(location.search); p.set(k, v); location.search = p.toString(); }
render();
</script>
</body>
</html>
