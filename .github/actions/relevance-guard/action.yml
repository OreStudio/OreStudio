# yamllint disable rule:line-length
---
name: Relevance guard
description: >-
  Decide whether this run has code to build, by comparing the checkout with the
  last commit the same workflow built.

# A scheduled run that has nothing new to build must not spend hours on a hosted
# runner, and a manual or tag run always builds. The comparison asks the API for
# the last successful run of *this* workflow, which is why the guard is a
# composite and not a reusable workflow: a called workflow would answer for
# itself, and every caller would compare against the same history.

outputs:
  should_build:
    description: 'true when the caller should build, false when it should skip.'
    value: ${{ steps.check.outputs.should_build }}

runs:
  using: composite
  steps:
    # The caller checks out before it calls this action: a local action is read
    # from the workspace, which the runner prepares before the job's first step,
    # so a checkout inside the action would arrive too late.
    - name: Check if code changed since last successful run
      id: check
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        echo "should_build=true" >> "$GITHUB_OUTPUT"
        if [[ "${{ github.event_name }}" != "schedule" ]]; then
          exit 0
        fi
        workflow_file=$(basename "${GITHUB_WORKFLOW_REF%%@*}")
        last_sha=$(gh api \
          "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow_file}/runs?branch=main&status=success&per_page=1" \
          --jq '.workflow_runs[0].head_sha // empty')
        if [[ -z "$last_sha" ]]; then
          echo "No prior successful run — building"
          exit 0
        fi
        if [[ "$last_sha" == "$GITHUB_SHA" ]]; then
          echo "No new commits since last run — skipping"
          echo "should_build=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        non_doc=$(git diff --name-only "$last_sha" "$GITHUB_SHA" \
          | { grep -vE '^(doc/|assets/|\.claude/|\.gemini/|projects/ores\.codegen/)' || true; } \
          | { grep -vE '\.(md|org)$' || true; } \
          | { grep -vE '^projects/([^/]*/)*modeling/' || true; })
        if [[ -n "$non_doc" ]]; then
          echo "Code changes found — building"
        else
          echo "Doc-only changes — skipping"
          echo "should_build=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Annotate when the build matrix is skipped
      # A green run that built nothing must say so, or the badge claims more
      # than the run did.
      if: steps.check.outputs.should_build == 'false'
      shell: bash
      run: |
        {
          echo "### :warning: no build ran"
          echo
          echo "No relevant code changes since the last successful run — the"
          echo "\`build\` job did not run. This workflow's overall"
          echo "**Success** reflects the guard's decision to skip, not"
          echo "a verified build."
        } | tee -a "$GITHUB_STEP_SUMMARY"
