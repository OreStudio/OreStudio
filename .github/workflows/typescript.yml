---
name: TypeScript
on:  # yamllint disable-line rule:truthy
  push:
    branches: ["main"]
    paths:
      - "projects/ores.web/**"
      - ".github/workflows/typescript.yml"

  pull_request:
    branches: ["main"]
    paths:
      - "projects/ores.web/**"
      - ".github/workflows/typescript.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The component's checks are ctest entries, so the continuous and nightly
  # builds already run them — but only after a full C++ build, and never on a
  # pull request. This job answers the same two commands in about a minute,
  # where the author can see them.
  typescript:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
        working-directory: projects/ores.web
      - name: Type check
        run: npm run typecheck
        working-directory: projects/ores.web
      - name: Unit tests
        run: npm test
        working-directory: projects/ores.web
