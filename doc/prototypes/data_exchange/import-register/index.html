<!--
  PROTOTYPE. Throwaway. Mock data, no backend, no build step.

  The import register: every attempt in one party, the retry told from the
  first attempt, the promotion record, and the party boundary. States come
  from the query string:

    ?variant=list|promotion|compare|failed|refused
    ?actor=admin|ops
    ?party=acme-trading|acme-capital-markets

  The bar at the foot switches the view and the actor. The party selector is
  shown only to the tenant administrator; the operations user has none,
  because the session decides the scope.
-->
