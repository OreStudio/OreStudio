<!DOCTYPE html>

<style>

body{margin:0;font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;padding:2.5rem 1.5rem 8rem}
h1,h2,h3{margin:0;font-weight:600}h1{font-size:1.15rem}h2{font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-dim)}
p{margin:0}ul{margin:0;padding:0;list-style:none}a{color:var(--accent);text-decoration:none}
button,input,select{font:inherit;color:inherit}button{cursor:pointer}
.mono{font-family:var(--mono)}.muted{color:var(--ink-dim)}.faint{color:var(--ink-faint)}
.wrap{max-width:1080px;margin:0 auto;display:grid;gap:14px}
.top{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px;display:grid;gap:10px}

.field{display:grid;gap:4px;min-width:170px}.field label{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-faint)}
.field .value,.field select,.field input{background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:6px 8px}
table{width:100%;border-collapse:collapse;font-size:.86rem}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line-soft)}

td.num{text-align:right;font-family:var(--mono)}
.btn{background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:7px 12px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#0d1117;font-weight:600}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.tag{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:1px 8px;font-size:.72rem;color:var(--ink-dim)}
.tag.ok{color:var(--ok);border-color:#1f4d29}.tag.bad{color:var(--bad);border-color:#5a2320}.tag.warn{color:var(--warn);border-color:#4a3a17}

<body>
<table class="prototype-links" style="width:100%;border-collapse:collapse;margin:0 0 0;font:500 13px/1.6 Inter,system-ui,sans-serif;color:var(--text-primary,#e3e3e6);background:var(--bg-secondary,#1a1a1e);border-bottom:1px solid var(--border-color,#30363d)">
<tr><th style="text-align:left;padding:.45rem .9rem;font-weight:600;white-space:nowrap;background:var(--bg-accent,#26262b);border-right:1px solid var(--border-color,#30363d);width:1%">Prototype</th><td class="prototype-open" style="padding:.45rem .9rem"><a href="index.html" style="color:var(--accent,#58a6ff)">this prototype</a></td></tr>
<tr><th style="text-align:left;padding:.45rem .9rem;font-weight:600;white-space:nowrap;background:var(--bg-accent,#26262b);border-right:1px solid var(--border-color,#30363d);width:1%;border-top:1px solid var(--border-color,#30363d)">Gemini review</th><td class="prototype-review" style="padding:.45rem .9rem;border-top:1px solid var(--border-color,#30363d)">none</td></tr>
<tr><th style="text-align:left;padding:.45rem .9rem;font-weight:600;white-space:nowrap;background:var(--bg-accent,#26262b);border-right:1px solid var(--border-color,#30363d);width:1%;border-top:1px solid var(--border-color,#30363d)">Group</th><td class="prototype-group" style="padding:.45rem .9rem;border-top:1px solid var(--border-color,#30363d)"><a href="../" style="color:var(--accent,#58a6ff)">Market data</a></td></tr>
</table>


<!--
  PROTOTYPE. Throwaway. Mock data, no backend, no build step, no session.

  Manage GMM components. ores.qt: Market Data > Synthetic > Configuration >
  GMM Components (GmmComponentMdiWindow + GmmComponentDetailDialog). The same
  rows are edited inline in the FX price feed editor's Advanced mode.

  A row is one Gaussian of a feed's mixture (ores.synthetic.domain.gmm_component):
  fx_spot_config_id, component_index, description, mean (mu), stdev (sigma),
  weight (w), plus version and audit fields. Weights are normalised across a
  feed's components when the feed is saved; the editor shows
  "Weight Sum = X (normalised on save)".

  Variants
    a  components across the three FX feeds, one row per component, with the
       per-feed weight sum, the audit trail and Edit / Delete / New Component.
    b  density preview of the selected feed: f(x) = sum w_i N(x; mu_i, sigma_i)
       in log-return percent, components faint under the bold mixture, plus the
       mixture's mean, variance, skewness and excess kurtosis from the components.
    c  normalisation and validation: raw sum per feed, normalised w per component,
       a bad flag when a raw sum is not 1, and bars of the normalised weights.

  States (?state)
    normal (default)  every feed's raw weight sum is 1.
    unnormalised      GBP/USD's raw weights sum to 0.90 and is flagged.
    single            USD/JPY has one component: a plain Gaussian whose sigma
                      alone sets the width.

  Nothing here reads a service; every value is a mock of what the screen would show.
-->

<div class="proto-note" id="note"></div>
<div class="wrap" id="app"></div>
<div class="proto-bar" id="bar"></div>

<script>
const params = new URLSearchParams(location.search);
const variant = params.get('variant') || 'a';
const state = params.get('state') || '';

// Prototype plotting helper. Throwaway, dependency-free, dark-theme SVG.
// Each function returns an HTML string, so a page calls host.innerHTML = PC.line({...}).
// Prefixed PC to stay clear of page-local names; the pages also define `tag`.
const PC = (() => {
  const C = {grid:'#21262d', axis:'#30363d', text:'#71717a', dim:'#a1a1aa',
             ink:'#e3e3e6', accent:'#58a6ff', ok:'#3fb950', warn:'#d29922', bad:'#f85149'};
  const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const fmt = (v, d) => v == null ? '—' : (typeof v === 'number' ? v.toFixed(d ?? 2) : String(v));
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  // A blue -> amber ramp for a heat cell, t in 0..1.
  function heatColour(t){
    const stops = [[13,23,38],[21,60,110],[32,110,170],[88,166,255],[210,153,34],[248,81,73]];
    const p = clamp(t, 0, 1) * (stops.length - 1), i = Math.floor(p), f = p - i;
    const a = stops[i], b = stops[Math.min(stops.length - 1, i + 1)];
    return `rgb(${a.map((x, k) => Math.round(x + (b[k] - x) * f)).join(',')})`;
  }

  // Shared frame: margins, y gridlines and labels for a value axis.
  function frame(o){
    const w = o.w || 940, h = o.h || 300;
    const pad = Object.assign({l:64, r:18, t:16, b:40}, o.pad || {});
    const x0 = pad.l, x1 = w - pad.r, y0 = h - pad.b, y1 = pad.t;
    const vals = (o.series || []).flatMap(s => s.points || []).filter(v => v != null)
      .concat(o.extra || []);
    let lo = Math.min(...vals), hi = Math.max(...vals);
    if (o.zero) { lo = Math.min(lo, 0); hi = Math.max(hi, 0); }
    if (!(hi > lo)) { hi = lo + 1; }
    const span = hi - lo, l2 = lo - span * 0.08, h2 = hi + span * 0.08;
    const y = v => y0 - (v - l2) * (y0 - y1) / (h2 - l2);
    const X = o.x ? (i => x0 + o.x[i] * (x1 - x0))
                  : (i => x0 + i * (x1 - x0) / Math.max(1, (o.ticks ? o.ticks.length : 1) - 1));
    const yTicks = [];
    const steps = o.ySteps || 4;
    for (let k = 0; k <= steps; k++) {
      const v = l2 + (h2 - l2) * k / steps;
      yTicks.push(`<line x1="${x0}" y1="${y(v).toFixed(1)}" x2="${x1}" y2="${y(v).toFixed(1)}" stroke="${C.grid}"/>
        <text x="${x0 - 8}" y="${(y(v) + 3.5).toFixed(1)}" fill="${C.text}" font-size="10" text-anchor="end">${esc((o.yFmt || (v => fmt(v)))(v))}</text>`);
    }
    const xTicks = (o.ticks || []).map(t => {
      const px = o.x ? x0 + t.at * (x1 - x0) : X(t.at);
      return `<text x="${px.toFixed(1)}" y="${h - pad.b + 15}" fill="${C.text}" font-size="10" text-anchor="middle">${esc(t.label)}</text>`;
    }).join('');
    const grid = (o.xticks || []).map(t => {
      const px = o.x ? x0 + t.at * (x1 - x0) : X(t.at);
      return `<line x1="${px.toFixed(1)}" y1="${y1}" x2="${px.toFixed(1)}" y2="${y0}" stroke="${C.grid}" stroke-dasharray="2 3"/>`;
    }).join('');
    return {w, h, x0, x1, y0, y1, y, X, l2, h2, frame: yTicks.join('') + grid + xTicks};
  }

  function line(o){
    const f = frame(o);
    const bands = (o.bands || []).map(b => {
      const xa = f.x0 + b.from * (f.x1 - f.x0), xb = f.x0 + b.to * (f.x1 - f.x0);
      return `<rect x="${xa.toFixed(1)}" y="${f.y1}" width="${(xb - xa).toFixed(1)}" height="${(f.y0 - f.y1).toFixed(1)}"
        fill="${b.color || C.accent}" opacity=".08"/>` +
        (b.label ? `<text x="${((xa + xb) / 2).toFixed(1)}" y="${f.y1 + 11}" fill="${C.text}" font-size="9" text-anchor="middle">${esc(b.label)}</text>` : '');
    }).join('');
    const paths = (o.series || []).map(s => {
      let d = '', pen = false;
      s.points.forEach((v, i) => {
        if (v == null) { pen = false; return; }
        d += (pen ? 'L' : 'M') + f.X(i).toFixed(1) + ',' + f.y(v).toFixed(1) + ' ';
        pen = true;
      });
      const marks = s.markers ? s.points.map((v, i) => v == null ? '' :
        `<circle cx="${f.X(i).toFixed(1)}" cy="${f.y(v).toFixed(1)}" r="${s.r || 3.4}" fill="${s.color}"/>`).join('') : '';
      return `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="${s.width || 2}"${s.dash ? ` stroke-dasharray="${s.dash}"` : ''}/>${marks}`;
    }).join('');
    const legend = o.legend === false ? '' : `<div class="pc-legend">${(o.series || []).map(s =>
      `<span><i style="background:${s.color}"></i>${esc(s.name)}</span>`).join('')}${(o.notes || []).map(n =>
      `<span class="faint">${n}</span>`).join('')}</div>`;
    return `<figure class="pc"><svg viewBox="0 0 ${f.w} ${f.h}" width="100%" height="${f.h}" role="img" aria-label="${esc(o.title || 'chart')}">
      ${bands}${f.frame}${paths}
      ${o.yLabel ? `<text x="14" y="${(f.y0 + f.y1) / 2}" fill="${C.text}" font-size="10" transform="rotate(-90 14 ${(f.y0 + f.y1) / 2})" text-anchor="middle">${esc(o.yLabel)}</text>` : ''}
    </svg>${legend}${o.caption ? `<figcaption class="faint">${o.caption}</figcaption>` : ''}</figure>`;
  }

  function bars(o){
    const f = frame(Object.assign({zero: true}, o));
    const n = o.bars.length, bw = (f.x1 - f.x0) / n;
    const zero = f.y(0);
    const body = o.bars.map((b, i) => {
      const v = b.value == null ? null : b.value;
      const x = f.x0 + i * bw + bw * 0.18, w = bw * 0.64;
      const yv = v == null ? zero : f.y(v);
      const top = Math.min(yv, zero), hgt = Math.abs(zero - yv);
      const col = b.color || (v == null ? C.text : v >= 0 ? C.warn : C.accent);
      return `<rect x="${x.toFixed(1)}" y="${top.toFixed(1)}" width="${w.toFixed(1)}" height="${Math.max(1, hgt).toFixed(1)}" fill="${col}" opacity=".85"><title>${esc(b.label)}: ${esc(fmt(v))}</title></rect>
        <text x="${(x + w / 2).toFixed(1)}" y="${(f.h - 24)}" fill="${C.text}" font-size="9" text-anchor="middle">${esc(b.label)}</text>`;
    }).join('');
    return `<figure class="pc"><svg viewBox="0 0 ${f.w} ${f.h}" width="100%" height="${f.h}" role="img" aria-label="${esc(o.title || 'bars')}">
      ${f.frame}<line x1="${f.x0}" y1="${zero}" x2="${f.x1}" y2="${zero}" stroke="${C.axis}"/>${body}</svg>
      ${o.caption ? `<figcaption class="faint">${o.caption}</figcaption>` : ''}</figure>`;
  }

  // A surface as a shaded mesh grid: one cell per (row, column).
  function heat(o){
    const rows = o.rows, cols = o.cols;
    const cw = o.cell || 54, ch = o.cellH || 30, l = 58, t = 26;
    const w = l + cols.length * cw + (o.legend === false ? 14 : 92);
    const h = t + rows.length * ch + 34;
    const vals = [];
    rows.forEach((_, i) => cols.forEach((_, j) => { const v = o.value(i, j); if (v != null) vals.push(v); }));
    const lo = Math.min(...vals), hi = Math.max(...vals), span = (hi - lo) || 1;
    const cells = [];
    rows.forEach((r, i) => cols.forEach((c, j) => {
      const v = o.value(i, j);
      const x = l + j * cw, y = t + i * ch;
      const col = v == null ? '#161619' : heatColour((v - lo) / span);
      cells.push(`<rect x="${x}" y="${y}" width="${cw - 2}" height="${ch - 2}" rx="2" fill="${col}"><title>${esc(r.label)} · ${esc(c.label)}: ${esc(fmt(v, o.dp))}</title></rect>`);
      if (o.showValues !== false) cells.push(`<text x="${(x + (cw - 2) / 2).toFixed(1)}" y="${(y + ch / 2 + 3.5).toFixed(1)}" fill="${(v != null && (v - lo) / span > 0.55) ? '#0d1117' : C.ink}" font-size="9.5" text-anchor="middle">${esc(fmt(v, o.dp ?? 1))}</text>`);
    }));
    const rowLabels = rows.map((r, i) => `<text x="${l - 8}" y="${(t + i * ch + ch / 2 + 3.5).toFixed(1)}" fill="${C.text}" font-size="10" text-anchor="end">${esc(r.label)}</text>`).join('');
    const colLabels = cols.map((c, j) => `<text x="${(l + j * cw + (cw - 2) / 2).toFixed(1)}" y="${t - 8}" fill="${C.text}" font-size="10" text-anchor="middle">${esc(c.label)}</text>`).join('');
    const legend = o.legend === false ? '' : (() => {
      const bx = l + cols.length * cw + 14, by = t, bh = rows.length * ch - 2;
      const steps = 24, sh = bh / steps;
      let g = '';
      for (let k = 0; k < steps; k++) g += `<rect x="${bx}" y="${(by + k * sh).toFixed(1)}" width="12" height="${(sh + 1).toFixed(1)}" fill="${heatColour(1 - k / (steps - 1))}"/>`;
      return `<g>${g}<text x="${bx + 18}" y="${by + 8}" fill="${C.text}" font-size="9">${esc(fmt(hi, o.dp))}</text>
        <text x="${bx + 18}" y="${by + bh}" fill="${C.text}" font-size="9">${esc(fmt(lo, o.dp))}</text></g>`;
    })();
    return `<figure class="pc"><svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" role="img" aria-label="${esc(o.title || 'heat map')}">
      ${cells.join('')}${rowLabels}${colLabels}${legend}
      ${o.xLabel ? `<text x="${(l + cols.length * cw / 2).toFixed(1)}" y="${h - 6}" fill="${C.text}" font-size="10" text-anchor="middle">${esc(o.xLabel)}</text>` : ''}
      ${o.yLabel ? `<text x="12" y="${(t + rows.length * ch / 2).toFixed(1)}" fill="${C.text}" font-size="10" transform="rotate(-90 12 ${(t + rows.length * ch / 2).toFixed(1)})" text-anchor="middle">${esc(o.yLabel)}</text>` : ''}
    </svg>${o.caption ? `<figcaption class="faint">${o.caption}</figcaption>` : ''}</figure>`;
  }

  // A surface as an isometric wireframe: rows and columns joined over a height.
  function mesh(o){
    const w = o.w || 940, h = o.h || 420;
    const rows = o.z.length, cols = o.z[0].length;
    const vals = o.z.flat().filter(v => v != null);
    const lo = Math.min(...vals), hi = Math.max(...vals), span = (hi - lo) || 1;
    const ox = o.ox ?? w * 0.52;
    const sy = o.sy ?? Math.min(22, h / (2 * Math.max(1, (rows - 1) + (cols - 1))));
    const sx = o.sx ?? Math.min(46, (w * 0.6) / Math.max(1, (rows - 1) + (cols - 1)));
    const sz = o.sz ?? h * 0.34;
    const oy = o.oy ?? h - 26 - ((rows - 1) + (cols - 1)) * sy;
    const P = (i, j) => {
      const v = o.z[i][j];
      const z = v == null ? 0 : (v - lo) / span;
      return [ox + (j - i) * sx, oy + (i + j) * sy - z * sz, z];
    };
    const lines = [];
    for (let i = 0; i < rows; i++) {
      let d = '';
      for (let j = 0; j < cols; j++) { const p = P(i, j); d += (j ? 'L' : 'M') + p[0].toFixed(1) + ',' + p[1].toFixed(1) + ' '; }
      lines.push(`<path d="${d}" fill="none" stroke="${C.accent}" stroke-width="1.4" opacity=".75"/>`);
    }
    for (let j = 0; j < cols; j++) {
      let d = '';
      for (let i = 0; i < rows; i++) { const p = P(i, j); d += (i ? 'L' : 'M') + p[0].toFixed(1) + ',' + p[1].toFixed(1) + ' '; }
      lines.push(`<path d="${d}" fill="none" stroke="${C.warn}" stroke-width="1" opacity=".5"/>`);
    }
    const rowL = (o.rows || []).map((r, i) => { const p = P(i, 0); return `<text x="${(p[0] - 12).toFixed(1)}" y="${(p[1] + 4).toFixed(1)}" fill="${C.text}" font-size="10" text-anchor="end">${esc(r.label)}</text>`; }).join('');
    const colL = (o.cols || []).map((c, j) => { const p = P(rows - 1, j); return `<text x="${(p[0] + 10).toFixed(1)}" y="${(p[1] + 4).toFixed(1)}" fill="${C.text}" font-size="10">${esc(c.label)}</text>`; }).join('');
    const axis = `<text x="14" y="${h - 12}" fill="${C.text}" font-size="10">height: ${esc(o.zLabel || 'value')} ${esc(fmt(lo, o.dp))}–${esc(fmt(hi, o.dp))}</text>`;
    return `<figure class="pc"><svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" role="img" aria-label="${esc(o.title || 'surface mesh')}">
      ${lines.join('')}${rowL}${colL}${axis}</svg>
      <div class="pc-legend"><span><i style="background:${C.accent}"></i>expiry</span><span><i style="background:${C.warn}"></i>strike</span>${(o.notes || []).map(n => `<span class="faint">${n}</span>`).join('')}</div>
      ${o.caption ? `<figcaption class="faint">${esc(o.caption)}</figcaption>` : ''}</figure>`;
  }

  return {line, bars, heat, mesh, colours: C, heatColour};
})();

function urlButton(url){
  return `<button class="urlbtn" type="button" data-url="${url}" title="Edit in the oresmd URL editor">`+
         `<span class="mono">${url}</span><span class="edit">edit</span></button>`;
}
function openOresmdEditor(url, host){
  const ov=document.createElement('div'); ov.className='oresmd-overlay';
  const f=document.createElement('iframe'); f.className='oresmd-frame'; f.title='oresmd URL editor';
  f.src='../oresmd-url-editor/index.html?embed=1&url='+encodeURIComponent(url||'');
  ov.appendChild(f); document.body.appendChild(ov);
  function close(){ window.removeEventListener('message', onMsg); document.removeEventListener('keydown', onKey); ov.remove(); }
  function onMsg(e){ if(e.data && e.data.type==='oresmd-url'){ host.dataset.url=e.data.url; const m=host.querySelector('.mono'); if(m) m.textContent=e.data.url; close(); } }
  function onKey(e){ if(e.key==='Escape') close(); }
  window.addEventListener('message', onMsg); document.addEventListener('keydown', onKey);
  ov.addEventListener('click', e=>{ if(e.target===ov) close(); });
}
document.addEventListener('click', e=>{
  const b=e.target.closest('.urlbtn'); if(!b) return;
  openOresmdEditor(b.dataset.url||'', b);
});
function tag(text, kind){ return `<span class="tag ${kind||''}">${text}</span>`; }

// ==== page data and panels ====
// Three FX feeds, each carrying a Gaussian mixture. A component is one row of
// ores.synthetic.domain.gmm_component. The raw weight is what the user typed;
// the server normalises the weights of a feed when the feed is saved.
const FEEDS = [
  {key:'usdjpy', base:'USD', quote:'JPY', regime:'two-regime mix',
   id:'c1a4e2f0-8b31-4d7a-9e02-6f5b1c9d0a77',
   uri:'oresmd://fx/USD?type=quote&amp;instrument=fx_spot&amp;quote=rate&amp;ccy=JPY'},
  {key:'gbpusd', base:'GBP', quote:'USD', regime:'cable jumps',
   id:'7f2b9c41-2e60-4a18-b3d5-90e4a7c62b10',
   uri:'oresmd://fx/GBP?type=quote&amp;instrument=fx_spot&amp;quote=rate&amp;ccy=USD'},
  {key:'audusd', base:'AUD', quote:'USD', regime:'single gaussian',
   id:'9d0e5a73-6c14-4f92-8a37-1b2c4d5e6f80',
   uri:'oresmd://fx/AUD?type=quote&amp;instrument=fx_spot&amp;quote=rate&amp;ccy=USD'}
];

const BASE = {
  usdjpy: [
    {index:0, desc:'normal body', mean:0.0000, stdev:0.0060, weight:0.82, by:'a.reyes (trader)', when:'2026-10-02 11:20', version:4},
    {index:1, desc:'intervention jump', mean:-0.0035, stdev:0.0250, weight:0.18, by:'a.reyes (trader)', when:'2026-10-02 11:24', version:1}
  ],
  gbpusd: [
    {index:0, desc:'sterling body', mean:0.0002, stdev:0.0055, weight:0.68, by:'m.oduya (quant)', when:'2026-09-18 08:05', version:3},
    {index:1, desc:'cable shock', mean:-0.0040, stdev:0.0210, weight:0.17, by:'m.oduya (quant)', when:'2026-09-18 08:06', version:2},
    {index:2, desc:'mild upward drift', mean:0.0012, stdev:0.0080, weight:0.15, by:'m.oduya (quant)', when:'2026-09-18 08:07', version:1}
  ],
  audusd: [
    {index:0, desc:'single gaussian', mean:0.0001, stdev:0.0072, weight:1.00, by:'j.silva (market data ops)', when:'2026-08-30 15:40', version:2}
  ]
};

// The state picks which mock the screen opens on. unnormalised edits GBP/USD's
// raw weights so the feed sums to 0.90; single deletes USD/JPY's jump component.
function seed(){
  const m = JSON.parse(JSON.stringify(BASE));
  if (state === 'unnormalised') {
    const w = [0.60, 0.20, 0.10];
    m.gbpusd = m.gbpusd.map((r, i) => ({...r, weight:w[i], by:'m.oduya (quant)', when:'2026-10-07 09:12', version:r.version + 1}));
  }
  if (state === 'single') {
    m.usdjpy = [{index:0, desc:'single gaussian — jump component deleted', mean:0.0000, stdev:0.0068,
                 weight:1.00, by:'a.reyes (trader)', when:'2026-10-08 16:41', version:5}];
  }
  return m;
}
const mix = seed();
let sel = state === 'unnormalised' ? 'gbpusd' : 'usdjpy';
let editing = null;

const screenState = () => state || 'normal';
const feed = k => FEEDS.find(f => f.key === k);
const wsum = rows => rows.reduce((a, r) => a + r.weight, 0);
const isOne = s => Math.abs(s - 1) < 1e-9;
const f4 = v => v.toFixed(4);
const f2 = v => v.toFixed(2);
const escAttr = s => String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
// Weighted-component colours: deliberately muted so the mixture line dominates.
const COMPONENT_COLOURS = ['#7f8ea8', '#a8845c', '#7fa07a'];

function feedSelector(){
  return `<div class="row">` + FEEDS.map(f =>
    `<button class="btn${f.key === sel ? ' primary' : ''}" data-f="${f.key}">${f.base}/${f.quote}</button>`).join('') +
    `<span class="faint">The feed a new component joins, and the feed variant B previews.</span></div>`;
}

function header(){
  return `
  <div class="top">
    <h1>GMM components</h1>
    <span class="muted">Market Data &rarr; Synthetic &rarr; Configuration &rarr; GMM Components</span>
    <span class="mono faint" style="margin-left:auto">GmmComponentMdiWindow</span>
  </div>`;
}

// --- Variant A: the component list across feeds -------------------------------
function listPanel(){
  const body = FEEDS.map(f => {
    const rows = mix[f.key], s = wsum(rows);
    const sumCell = `${f2(s)} ${isOne(s) ? tag('sums to 1', 'ok') : tag('normalised on save', 'warn')}`;
    return rows.map((r, i) => {
      const cells = [];
      if (i === 0) cells.push(`<td rowspan="${rows.length}" style="vertical-align:top">
        <div><strong>${f.base}/${f.quote}</strong> ${f.key === sel ? tag('selected') : ''}</div>
        <div class="faint">${f.regime}</div>
        <div style="margin-top:5px">${urlButton(f.uri)}</div></td>`);
      cells.push(`<td class="mono">${r.index}</td>`);
      cells.push(`<td>${r.desc}</td>`);
      cells.push(`<td class="num">${f4(r.mean)}</td>`);
      cells.push(`<td class="num">${f4(r.stdev)}</td>`);
      cells.push(`<td class="num">${f2(r.weight)}</td>`);
      if (i === 0) cells.push(`<td rowspan="${rows.length}" style="vertical-align:top">${sumCell}</td>`);
      cells.push(`<td><div>${r.by}</div><div class="faint">${r.when} &middot; v${r.version}</div></td>`);
      cells.push(`<td style="white-space:nowrap">
        <button class="btn" data-edit="${f.key}:${i}">Edit</button>
        <button class="btn" data-del="${f.key}:${i}">Delete</button></td>`);
      return `<tr>${cells.join('')}</tr>`;
    }).join('');
  }).join('');
  return `
  <div class="panel">
    <h2>Components across the FX feeds</h2>
    ${feedSelector()}
    <table>
      <thead><tr><th>Feed</th><th>#</th><th>Description</th><th class="num">&mu;</th><th class="num">&sigma;</th>
        <th class="num">w</th><th>Weight sum</th><th>Changed by / when</th><th>Actions</th></tr></thead>
      <tbody>${body}</tbody>
    </table>
    <div class="row">
      <button class="btn primary" data-new>New Component</button>
      <span class="faint">A new row joins ${feed(sel).base}/${feed(sel).quote} at the next free component_index, with w = 0.00. It is normalised away until you weight it.</span>
    </div>
    <div class="notice">Weights are per feed, not per screen: the mixture of each fx_spot_config normalises on its own save. The sum column repeats once per feed.</div>
  </div>`;
}

// The GmmComponentDetailDialog, mocked inline. Save writes one new bitemporal
// version of the row; Cancel drops the edit.
function detailPanel(){
  if (!editing) return '';
  const rows = mix[editing.feed], r = rows && rows[editing.index];
  if (!r) { editing = null; return ''; }
  const f = feed(editing.feed);
  return `
  <div class="panel">
    <h2>Component detail — ${f.base}/${f.quote} #${r.index}</h2>
    <div class="row">
      <div class="field"><label>fx_spot_config_id</label><div class="value mono">${f.id}</div></div>
      <div class="field"><label>component_index</label><div class="value mono">${r.index}</div></div>
      <div class="field"><label>version</label><div class="value mono">${r.version}</div></div>
    </div>
    <div class="row">
      <div class="field" style="flex:1"><label>Description</label><input id="d-desc" value="${escAttr(r.desc)}"></div>
      <div class="field"><label>Mean &mu; (log-return / tick)</label><input id="d-mean" value="${r.mean}"></div>
      <div class="field"><label>Stdev &sigma;</label><input id="d-stdev" value="${r.stdev}"></div>
      <div class="field"><label>Weight w</label><input id="d-weight" value="${r.weight}"></div>
    </div>
    <div class="row">
      <div class="field" style="flex:1"><label>Reason</label><select><option>system.update</option><option>system.new_record</option></select></div>
      <div class="field" style="flex:1"><label>Commentary</label><input value="edited in the GMM component dialog"></div>
    </div>
    <div class="row">
      <button class="btn primary" data-save>Save</button>
      <button class="btn" data-cancel>Cancel</button>
      <span class="faint">Save renormalises ${f.base}/${f.quote}: its raw weights are divided by their sum.</span>
    </div>
  </div>`;
}

// --- Variant B: the mixture density of the selected feed ----------------------
function gauss(x, mu, sig){
  return Math.exp(-0.5 * Math.pow((x - mu) / sig, 2)) / (sig * Math.sqrt(2 * Math.PI));
}

function densityPanel(){
  const rows = mix[sel], f = feed(sel), s = wsum(rows);
  const comps = rows.map(r => ({name:r.desc, mu:r.mean * 100, sig:r.stdev * 100, w:r.weight / s}));
  // Sample x in log-return percent, wide enough to show the fattest component.
  const reach = Math.max(3, ...comps.map(c => Math.abs(c.mu) + 3.5 * c.sig));
  const hi = Math.ceil(reach), lo = -hi, N = 281;
  const xs = Array.from({length:N}, (_, i) => lo + (hi - lo) * i / (N - 1));
  const xpos = xs.map(x => (x - lo) / (hi - lo));
  const ticks = [];
  for (let t = Math.ceil(lo / 2) * 2; t <= hi; t += 2) ticks.push({at:(t - lo) / (hi - lo), label:`${t}%`});
  const series = [{name:'mixture', color:PC.colours.accent, points:xs.map(x => comps.reduce((a, c) => a + c.w * gauss(x, c.mu, c.sig), 0)), width:2.6}]
    .concat(comps.map((c, i) => ({name:`component ${i}: ${c.name}`, color:COMPONENT_COLOURS[i % 3],
      points:xs.map(x => c.w * gauss(x, c.mu, c.sig)), dash:'4 3', width:1.4})));

  const mean = comps.reduce((a, c) => a + c.w * c.mu, 0);
  const variance = comps.reduce((a, c) => a + c.w * (c.sig * c.sig + Math.pow(c.mu - mean, 2)), 0);
  const sd = Math.sqrt(variance);
  const skew = comps.reduce((a, c) => a + c.w * Math.pow(c.mu - mean, 3), 0) / Math.pow(sd, 3);
  // A mixture's fourth central moment keeps each Gaussian's own 3*sigma^4 term.
  const kurt = comps.reduce((a, c) => a + c.w * (3 * Math.pow(c.sig, 4) + 6 * c.sig * c.sig * Math.pow(c.mu - mean, 2) + Math.pow(c.mu - mean, 4)), 0) / Math.pow(sd, 4) - 3;

  const stats = [
    ['Components (K)', String(rows.length), ''],
    ['Raw weight sum', f2(s), isOne(s) ? 'ok' : 'bad'],
    ['Mixture mean &mu;', f4(mean) + '%', ''],
    ['Mixture variance &sigma;&sup2;', f4(variance) + ' %&sup2;', ''],
    ['Mixture stdev &sigma;', f4(sd) + '%', ''],
    ['Skewness', f4(skew), ''],
    ['Excess kurtosis', f4(kurt), '']
  ];
  return `
  <div class="grid2">
    <div class="panel">
      <h2>Density — ${f.base}/${f.quote} mixture</h2>
      ${feedSelector()}
      ${PC.line({
        series, x:xpos, ticks, yFmt:v => v.toFixed(2), yLabel:'density (per 1% move)', h:320,
        title:`${f.base}/${f.quote} mixture density`,
        caption:`f(x) = &Sigma; w<sub>i</sub>&middot;N(x; &mu;<sub>i</sub>, &sigma;<sub>i</sub>) over log-return percent. The bold line is the mixture; the dashed lines are its components, each weighted by w<sub>i</sub>. The curve uses the normalised weights the save would write.`
      })}
    </div>
    <div class="panel">
      <h2>Mixture moments from the components</h2>
      <table><tbody>${stats.map(([k, v, kind]) =>
        `<tr><td>${k}</td><td class="num">${v}</td><td>${kind ? tag(kind === 'ok' ? 'sum is 1' : 'normalised on save', kind) : ''}</td></tr>`).join('')}</tbody></table>
      <div class="notice">
        Log-returns per tick, in percent. The mixture mean is &Sigma; w<sub>i</sub>&mu;<sub>i</sub> and the variance is
        &Sigma; w<sub>i</sub>(&sigma;<sub>i</sub>&sup2; + (&mu;<sub>i</sub> &minus; &mu;)&sup2;), so a jump component lifts the variance and drags the skew even at w = 0.18.
      </div>
      <div class="notice">
        With one component (K = 1) the mixture is a plain Gaussian: &sigma; alone sets the width, &mu; shifts it, and w stays 1.00.
      </div>
    </div>
  </div>`;
}

// --- Variant C: normalisation and validation ----------------------------------
function normalisationPanel(){
  const flagged = FEEDS.filter(f => !isOne(wsum(mix[f.key])));
  const table = FEEDS.map(f => {
    const rows = mix[f.key], s = wsum(rows), ok = isOne(s);
    const body = rows.map((r, i) => `<tr>
      <td class="mono">${r.index}</td>
      <td>${r.desc}</td>
      <td class="num">${f2(r.weight)}</td>
      ${i === 0 ? `<td rowspan="${rows.length}" class="num" style="vertical-align:top">${f2(s)}</td>` : ''}
      <td class="num">${f4(r.weight / s)}</td>
      ${i === 0 ? `<td rowspan="${rows.length}" style="vertical-align:top">${ok ? tag('= 1', 'ok') : tag('&ne; 1', 'bad')}</td>` : ''}
    </tr>`).join('');
    return `<tr><td colspan="6" style="padding-top:10px"><strong>${f.base}/${f.quote}</strong>
      <span class="faint">${f.regime}</span> ${ok ? '' : tag('normalised on save', 'warn')}</td></tr>${body}`;
  }).join('');

  const bars = [];
  FEEDS.forEach((f, fi) => {
    const rows = mix[f.key], s = wsum(rows), ok = isOne(s);
    rows.forEach(r => bars.push({
      label:`${f.base[0]}${f.quote[0]} #${r.index}`,
      value:r.weight / s,
      color:ok ? [PC.colours.accent, PC.colours.ok, PC.colours.warn][fi % 3] : PC.colours.bad
    }));
  });

  return `
  <div class="panel">
    <h2>Raw weight sum and the normalised weight</h2>
    <div class="notice">
      Weight Sum = ${f2(wsum(mix[flagged.length ? flagged[0].key : sel]))} (normalised on save).
      The value in the editor is the raw weight the user typed. On save the server divides every
      weight of a feed by that feed's raw sum, so a feed whose raw weights miss 1 still draws a
      valid mixture — but the stored w is not the typed w.
    </div>
    <table>
      <thead><tr><th>#</th><th>Description</th><th class="num">raw w</th><th class="num">raw sum</th>
        <th class="num">normalised w</th><th>Flag</th></tr></thead>
      <tbody>${table}</tbody>
    </table>
  </div>
  <div class="panel">
    <h2>Normalised weight per component</h2>
    ${PC.bars({bars, yFmt:v => v.toFixed(2), yLabel:'normalised w', h:280,
      title:'Normalised weight per component',
      caption:'w<sub>i</sub> / &Sigma;w per feed, what the mixture actually draws from. A red bar marks a feed whose raw sum is not 1; its components still normalise to 1.'})}
    <div class="notice">
      ${flagged.length
        ? `${tag('not normalised', 'bad')} ${flagged.map(f => `${f.base}/${f.quote} raw sum ${f2(wsum(mix[f.key]))}`).join('; ')}. The save will still succeed: normalisation is the save's job, and the screen only warns.`
        : `${tag('all feeds sum to 1', 'ok')} Every feed's raw weights already sum to 1, so normalisation is the identity.`}
    </div>
  </div>`;
}

function footer(){
  return `
  <div class="panel">
    <h2>Model</h2>
    <div class="row">
      <div class="field" style="flex:1"><label>Screen</label><div class="value">ores.qt &rarr; Market Data &rarr; Synthetic &rarr; Configuration &rarr; GMM Components</div></div>
      <div class="field" style="flex:1"><label>Shell resource</label><div class="value mono">gmm_components list | get | add | set | delete | put-many</div></div>
    </div>
    <div class="notice">Mock only. Nothing here reads or writes a service; every value is a mock of what the screen would show. The same rows are edited inline in the FX price feed editor's Advanced mode.</div>
  </div>`;
}

function render(){
  const panels = variant === 'b' ? densityPanel() : variant === 'c' ? normalisationPanel() : listPanel();
  document.getElementById('app').innerHTML = header() + panels + (variant === 'a' ? detailPanel() : '') + footer();

  document.querySelectorAll('#app [data-f]').forEach(b => b.onclick = () => { sel = b.dataset.f; editing = null; render(); });
  document.querySelectorAll('#app [data-edit]').forEach(b => b.onclick = () => {
    const [k, i] = b.dataset.edit.split(':'); editing = {feed:k, index:+i}; render();
  });
  document.querySelectorAll('#app [data-del]').forEach(b => b.onclick = () => {
    const [k, i] = b.dataset.del.split(':');
    mix[k].splice(+i, 1);
    mix[k].forEach((r, n) => r.index = n);
    if (editing && editing.feed === k && editing.index >= mix[k].length) editing = null;
    render();
  });
  document.querySelectorAll('#app [data-new]').forEach(b => b.onclick = () => {
    const rows = mix[sel];
    rows.push({index:rows.length, desc:'new component — describe the regime', mean:0.0000, stdev:0.0100,
               weight:0.00, by:'you (mocked)', when:'now', version:1});
    editing = {feed:sel, index:rows.length - 1};
    render();
  });
  document.querySelectorAll('#app [data-save]').forEach(b => b.onclick = () => {
    const rows = mix[editing.feed], r = rows[editing.index];
    r.desc = document.getElementById('d-desc').value;
    r.mean = parseFloat(document.getElementById('d-mean').value) || 0;
    r.stdev = parseFloat(document.getElementById('d-stdev').value) || 0;
    r.weight = parseFloat(document.getElementById('d-weight').value) || 0;
    r.by = 'you (mocked)'; r.when = 'now'; r.version += 1;
    editing = null; render();
  });
  document.querySelectorAll('#app [data-cancel]').forEach(b => b.onclick = () => { editing = null; render(); });

  document.getElementById('note').textContent =
    `Prototype · Manage GMM components · variant ${variant.toUpperCase()} · ${screenState()} · mock data, nothing is stored`;
  document.getElementById('bar').innerHTML =
    `<span class="label">View</span>` +
    ['a','b','c'].map(v => `<button data-v="${v}" class="${v === variant ? 'on' : ''}">${v.toUpperCase()}</button>`).join('') +
    `<span class="sep">|</span><span class="label">Weights</span>` +
    ['normal','unnormalised','single'].map(s => `<button data-s="${s}" class="${s === screenState() ? 'on' : ''}">${s}</button>`).join('');
  document.querySelectorAll('#bar [data-v]').forEach(b => b.onclick = () => set('variant', b.dataset.v));
  document.querySelectorAll('#bar [data-s]').forEach(b => b.onclick = () => set('state', b.dataset.s));
}
function set(k, v){ const p = new URLSearchParams(location.search); p.set(k, v); location.search = p.toString(); }
render();
</script>
