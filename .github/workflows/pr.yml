#
# Single entry point for pull request CI. The gate is minimal by
# design: classify records the change's bucket (docs / code / ci) and
# pr-gate is the repository's sole required check — it passes whenever
# classify succeeds. A path-filtered standalone workflow would hang as
# "expected" instead, which is why the gate is a single required check.
#
# Every functional check (site build, roundtrip, drift checks, full
# C++ build and tests) moved local: the submit-PR skills classify the
# diff with the same rules and run only the matching checks before the
# PR is raised — see the pr-raise skill and the "CI workflows and
# local checks" knowledge doc. There is no full C++ build/test job here
# (the old "canary" job was removed — it took too long and slowed down
# development); building and running tests locally before raising or
# merging a PR is a required manual step — see the pr-raise/pr-merge
# skills.
---
name: PR

on:  # yamllint disable-line rule:truthy
  pull_request:
    branches:
      - main

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  classify:
    name: classify
    runs-on: ubuntu-24.04
    outputs:
      docs: ${{ steps.classify.outputs.docs }}
      code: ${{ steps.classify.outputs.code }}
      ci: ${{ steps.classify.outputs.ci }}
    steps:
      - name: Classify changed paths
        id: classify
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          files=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR}/files" \
            --paginate --jq '.[].filename')
          docs=false; code=false; ci=false
          while IFS= read -r f; do
            case "$f" in
              .github/*|projects/ores.codegen/library/templates/*)
                ci=true ;;
              doc/*|assets/*|.claude/*|.gemini/*|*.md|*.org)
                docs=true ;;
              projects/ores.codegen/*)
                # Codegen tooling: no C++ impact; the site renders its
                # modeling docs.
                docs=true ;;
              projects/ores.compass/*)
                # Compass CLI (Python): no C++ impact.
                docs=true ;;
              external/*)
                # Vendored reference data/assets (schemas, examples, test
                # images): no C++ impact.
                docs=true ;;
              projects/modeling/*|projects/*/modeling/*|projects/*/*/modeling/*)
                # Modeling docs (org/puml/png): no C++ impact, site
                # renders them.
                docs=true ;;
              *)
                code=true ;;
            esac
          done <<< "$files"
          echo "docs=$docs" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "ci=$ci" >> "$GITHUB_OUTPUT"
          echo "classes: docs=$docs code=$code ci=$ci"

  pr-gate:
    name: pr-gate
    needs: classify
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Check job results
        env:
          CLASSIFY: ${{ needs.classify.result }}
        run: |
          echo "classify=$CLASSIFY"
          [ "$CLASSIFY" = "success" ] || { echo "classifier failed"; exit 1; }
          echo "gate open"
