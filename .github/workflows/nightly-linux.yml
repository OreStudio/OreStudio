# yamllint disable rule:line-length
---
name: Nightly Build

env:
  VCPKG_BINARY_SOURCES: 'clear;files,${{ github.workspace }}/vcpkg-cache,readwrite'
  SCCACHE_DIR: '${{ github.workspace }}/.sccache'

on:  # yamllint disable-line rule:truthy
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  check_changes:
    runs-on: ubuntu-24.04
    name: Check latest main commit
    outputs:
      should_run: ${{ steps.should_run.outputs.should_run }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: check latest commit is less than a day
        id: should_run
        continue-on-error: false
        run: |
          export latest_commit="`git log -1 --format='%H'`"
          echo "Latest commit: ${latest_commit}"
          if [[ -z $(git rev-list --after="24 hours" ${latest_commit}) ]]; then
              echo "should_run=false" >> $GITHUB_OUTPUT
          else
              echo "should_run=true" >> $GITHUB_OUTPUT
          fi

  validate-sql:
    name: validate-sql-schema
    needs: [check_changes]
    if: ${{ needs.check_changes.outputs.should_run != 'false' }}
    # The validation needs no compiler and no database, so it runs beside the
    # build, not in it.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Validate SQL Schema
        run: |
          pip install --quiet pystache
          ./projects/ores.sql/utility/validate_schemas.sh

  image:
    name: ci-image-ref
    needs: [check_changes]
    if: ${{ needs.check_changes.outputs.should_run != 'false' }}
    # The build runs in the CI image that build/docker/ci describes. The tag
    # holds a hash of the image inputs, so the build takes the image of the
    # commit it builds. ci-image.yml publishes that tag when the inputs change
    # on main.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      ref: ${{ steps.ref.outputs.ref }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          sparse-checkout: |
            build/docker/ci
          sparse-checkout-cone-mode: false

      - name: Name the image
        id: ref
        run: |
          ref="$(build/docker/ci/build.sh --image ghcr.io/orestudio/ores-ci --print-ref)"
          echo "ref=${ref}" >> "$GITHUB_OUTPUT"
          echo "Image: ${ref}"

  build:
    needs: [check_changes, image]
    if: ${{ needs.check_changes.outputs.should_run != 'false' }}
    name: ${{matrix.family}}-${{matrix.compiler}}-${{matrix.buildtype}}
    runs-on: ubuntu-24.04
    # The image has the compilers, CMake, Node.js, PostgreSQL, valgrind and the
    # system packages, so the job installs none of them. vcpkg packages are not
    # in the image; the vcpkg binary cache restores them.
    container:
      image: ${{ needs.image.outputs.ref }}
    # A container job runs its steps with sh, but the runner runs them with
    # bash -e. The steps use [[ and process substitution, which sh does not
    # have. Plain "bash" would also add pipefail, which the steps do not expect.
    defaults:
      run:
        shell: bash -e {0}
    environment: CI
    # The repository's default token is read-only; the cache steps delete old
    # sccache entries, which needs actions: write.
    permissions:
      contents: read
      actions: write
    strategy:
      fail-fast: false
      matrix:
        name: [linux-gcc, linux-clang]
        buildtype: [debug, release]
        # The gcc debug build never finishes on a hosted runner: the runner
        # dies before it has compiled half the tree. It saves no compiler
        # cache, so it never gets faster either.
        exclude:
          - name: linux-gcc
            buildtype: debug
        include:
          - name: linux-gcc
            family: linux
            compiler: gcc
          - name: linux-clang
            family: linux
            compiler: clang
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          submodules: true

      - name: Trust the workspace
        # The container runs as root and the runner owns the workspace, so git
        # refuses the repository without this.
        run: git config --global --add safe.directory "${GITHUB_WORKSPACE}"

      - name: Point the caches at the container workspace
        # github.workspace holds the runner path, /home/runner/work, but the
        # container mounts the workspace at /__w. The cache steps save the
        # container path, so vcpkg and sccache must write there.
        run: |
          echo "VCPKG_BINARY_SOURCES=clear;files,${GITHUB_WORKSPACE}/vcpkg-cache,readwrite" >> "$GITHUB_ENV"
          echo "SCCACHE_DIR=${GITHUB_WORKSPACE}/.sccache" >> "$GITHUB_ENV"

      - name: Use clang for the C ports
        # The image has clang first on PATH. CC and CXX send the vcpkg C ports
        # to it too.
        if: ${{ matrix.compiler == 'clang' }}
        run: |
          llvm_major="$(sed -n 's/^LLVM_MAJOR=//p' build/docker/ci/versions.env)"
          echo "CC=/usr/lib/llvm-${llvm_major}/bin/clang" >> "$GITHUB_ENV"
          echo "CXX=/usr/lib/llvm-${llvm_major}/bin/clang++" >> "$GITHUB_ENV"

      - name: Restore sccache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.SCCACHE_DIR }}
          # Saves use a run-unique key, pruned to the newest entry per variant,
          # so restore by prefix and take that entry. The key is deliberately
          # not scoped to this workflow, because Continuous Linux compiles the
          # same variants with the same settings, so one entry serves both.
          #
          # The two tiers do differ, and none of the differences reaches a
          # compile line:
          #   - build_group names the CDash track, not a CMake input.
          #   - with_memcheck runs valgrind in the test step; valgrind appears
          #     nowhere in the build, so it cannot change a flag.
          #   - a run that does not pass package=0 builds the package target,
          #     which compiles the same objects and only adds cpack.
          # code_coverage is the one input that does change the compile line,
          # and both tiers pass it on the same variants: on for debug, absent
          # for release.
          key: sccache-${{matrix.family}}-${{matrix.compiler}}-${{matrix.buildtype}}-ninja-${{ github.run_id }}
          restore-keys: |
            sccache-${{matrix.family}}-${{matrix.compiler}}-${{matrix.buildtype}}-ninja-

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2.26
        with:
          variant: sccache
          key: ${{matrix.family}}-${{matrix.compiler}}-${{matrix.buildtype}}-ninja
          # The cap is the only place that limits the cache: the action starts
          # the sccache server with it and ignores SCCACHE_CACHE_SIZE.
          #
          # A cache smaller than the build gives almost no hits. The build
          # reads the objects in the same order each time and the oldest go
          # first, so a cache a quarter of the build gave 2.5% hits. Give each
          # variant the whole of what it needs, in the 9000 MB the repository
          # keeps for sccache (see the budget in save-sccache):
          #   clang debug 4000, clang release 1600, gcc release 1800,
          #   and 1600 left free. The continuous workflow shares the clang
          #   entries and must use the same caps, or each workflow cuts the
          #   other's entry down when it saves.
          max-size: ${{ matrix.buildtype == 'debug' && '4000M' || (matrix.compiler == 'clang' && '1600M' || '1800M') }}
          save: false

      - uses: ./.github/actions/setup-postgres

      - uses: ./.github/actions/install-compass

      - uses: ./.github/actions/init-environment

      - uses: ./.github/actions/setup-nats

      - uses: ./.github/actions/start-nats

      - uses: ./.github/actions/create-database

      - name: Cache vcpkg binary packages
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/vcpkg-cache
          key: vcpkg-${{matrix.family}}-${{matrix.compiler}}-${{matrix.buildtype}}-ninja-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-${{matrix.family}}-${{matrix.compiler}}-${{matrix.buildtype}}-ninja-

      - name: Run vcpkg
        uses: lukka/run-vcpkg@v11

      - name: Run CTest workflow
        id: ctest
        # The job limit is 360 minutes, and this is the heaviest configuration
        # the repository builds: debug with coverage and memcheck. Uncapped, it
        # ran to exactly 6h0m0s and was killed, leaving the cache steps below
        # roughly thirty seconds, which cannot upload a compiler cache. Cap it
        # as continuous-linux.yml does and leave the rest of the job to them.
        timeout-minutes: 350
        run: |
          export CMAKE_BUILD_PARALLEL_LEVEL=$(nproc)
          export CTEST_PARALLEL_LEVEL=$(nproc)
          export PATH=${PATH}:/usr/sbin
          export ORES_BUILD_PROVIDER="github"
          export ORES_BUILD_COMMIT="${GITHUB_SHA}"
          export ORES_BUILD_NUMBER="${GITHUB_RUN_NUMBER}"
          export ORES_BUILD_TIMESTAMP=`date "+%Y/%m/%d %H:%M:%S"`
          export preset=${{matrix.family}}-${{matrix.compiler}}-${{matrix.buildtype}}-ninja
          export cmake_args="build_group=Nightly,preset=${preset}"
          # Coverage and valgrind are what make the debug job the heaviest
          # configuration built, and neither belongs on a release job.
          # A suite under valgrind takes up to an hour. The cap stops one that
          # hangs from spending the step's budget, which ends the job before
          # its results are submitted.
          timeout=12000
          if [[ "${{matrix.buildtype}}" == "debug" ]]; then
              cmake_args="${cmake_args},code_coverage=1,with_memcheck=1"
              timeout=5400
          fi
          ctest -VV --timeout ${timeout} --preset ${preset} --script "CTest.cmake,${cmake_args}"

      - name: Upload the memcheck logs when the run fails
        # A memcheck failure reports a count, not a stack: CTest says a test
        # carried "Defects: N" and the stacks stay in MemoryChecker.N.log in the
        # build tree, which the runner discards. Uploading them on failure is
        # what makes the count explainable afterwards.
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: memcheck-logs-${{matrix.family}}-${{matrix.compiler}}-${{matrix.buildtype}}
          if-no-files-found: ignore
          retention-days: 7
          # Every log CTest keeps, not a named few: a suite that a watchdog
          # kills reports through whichever file CTest chose to write.
          path: build/output/${{matrix.family}}-${{matrix.compiler}}-${{matrix.buildtype}}-ninja/Testing/Temporary/*.log

      - name: Stage the release images
        # Only the release build is published: the debug build is several
        # times larger, and no host runs it. The runner's job container has
        # no container engine, so this stages the tree and the publish job
        # builds the images from it.
        #
        # The web bundle is part of the fleet, so a stage without it would
        # silently publish every image but ores-web. The build wires npm into
        # CMake, so its absence means the TypeScript build broke and the run
        # should say so rather than ship a fleet without the browser.
        if: ${{ matrix.buildtype == 'release' && matrix.compiler == 'clang' }}
        run: |
          ./compass.sh image stage --preset ${{matrix.family}}-${{matrix.compiler}}-${{matrix.buildtype}}-ninja
          if [[ ! -d build/docker-stage/web ]]; then
            echo "::error::the web bundle was not staged, so ores-web would not be published"
            exit 1
          fi

      - name: Upload the staged images
        if: ${{ matrix.buildtype == 'release' && matrix.compiler == 'clang' }}
        uses: actions/upload-artifact@v7
        with:
          # The shared libraries are most of the payload. The service
          # binaries are a few MB in total; the empty runtime directories are
          # what the base image copies. build/docker-stage/bin is left out:
          # it fed the library partition, which has already run.
          name: image-stage
          path: |
            build/docker-stage/libs
            build/docker-stage/services
            build/docker-stage/web
            build/docker-stage/log
            build/docker-stage/run
            build/docker-stage/storage
          retention-days: 1

      - uses: ./.github/actions/save-sccache
        if: ${{ always() && steps.ctest.outcome != 'skipped' }}
        with:
          variant: ${{matrix.family}}-${{matrix.compiler}}-${{matrix.buildtype}}-ninja

  publish_images:
    name: publish-images
    needs: [check_changes, image, build]
    # One release image set per nightly run, whichever build matrix entry
    # produced the staged tree. Every other entry skips the staging step, so
    # this job fails loudly rather than silently publishing nothing if the
    # artifact is missing.
    # Publishing follows the clang-release build, not the whole matrix: that
    # job is the one that stages the images, so its artifact is both the
    # trigger and the proof that the configuration the images are made from is
    # green. A failure in another variant does not hold the images back.
    if: ${{ !cancelled() && needs.check_changes.outputs.should_run != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Look for the staged images
        # The stage step runs in the clang-release job only, so its artifact
        # is the signal that the configuration the images are made from built
        # and passed. A failure in another variant leaves the artifact in
        # place; a failure in this one leaves it absent, and the run says so
        # without publishing a fleet nobody built.
        id: staged
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" \
               --jq '.artifacts[].name' | grep -qx image-stage; then
            echo "found=true" >> "${GITHUB_OUTPUT}"
          else
            echo "found=false" >> "${GITHUB_OUTPUT}"
            echo "::notice::The clang-release build did not stage the images, so nothing is published."
          fi

      - name: Download the staged images
        if: steps.staged.outputs.found == 'true'
        uses: actions/download-artifact@v8
        with:
          name: image-stage
          path: build/docker-stage

      - name: Restore the empty runtime directories
        if: steps.staged.outputs.found == 'true'
        # An artifact carries files, not directories, and docker/stage-runtime.sh
        # creates these three empty. The base image copies all three, so without
        # them the first build cannot resolve its COPY and nothing is published.
        # A fourth directory there means a fourth here.
        run: mkdir -p build/docker-stage/log build/docker-stage/run build/docker-stage/storage

      - name: Log in to GitHub Container Registry
        if: steps.staged.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "${GH_TOKEN}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and publish the images
        # --from-stage builds from the downloaded tree instead of staging
        # again, which this job cannot do: it has no build. A tag the registry
        # already holds is skipped, so a rerun only fills the gaps.
        if: steps.staged.outputs.found == 'true'
        run: |
          ./compass.sh image publish \
            --from-stage \
            --engine docker \
            --registry ghcr.io/orestudio \
            --alias main

      - name: Make the published packages public
        if: steps.staged.outputs.found == 'true'
        # A package is created private, and a host that pulls without
        # credentials needs it public. A failure here is a warning, not a red
        # build: the images are published either way, and an owner can change
        # the visibility in the organisation's package settings.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "/orgs/${GITHUB_REPOSITORY_OWNER}/packages?package_type=container&per_page=100" \
            --jq '.[] | select(.name | startswith("ores")) | select(.visibility != "public") | .name' \
          | while read -r name; do
              if gh api --method PATCH \
                   "/orgs/${GITHUB_REPOSITORY_OWNER}/packages/container/${name}" \
                   -f visibility=public > /dev/null; then
                echo "public: ${name}"
              else
                echo "::warning::Could not make ${name} public. Set it in the organisation's package settings."
              fi
            done
