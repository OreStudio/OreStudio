---
name: Create the CI database
description: >-
  Drop the schema this run found and build it from the tree.

# The environment the previous step wrote names the database, and PGPASSWORD
# carries the account that may recreate it, so the run rebuilds ores_ci from
# scratch instead of inheriting whatever a cached image left behind.

runs:
  using: composite
  steps:
    - name: Setup Database
      shell: bash
      run: ./projects/ores.compass/compass.sh db recreate -y -D ores_ci
