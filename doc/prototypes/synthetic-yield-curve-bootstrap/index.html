<style>

<body>

<!--
  PROTOTYPE. Throwaway. Mock data, no backend, no build step, no session.

  Bootstrap a synthetic yield curve (doc/knowledge/ui/synthetic_data_generation_screens.org):
  the step inside the IR curve feed that solves the curve from the Curve
  Template ladder it holds. The ladder is the instruments to reprice, the
  process and r0 come from the feed, and the bootstrap solves one discount
  factor per pillar so every instrument reprices to par. Nothing here reads a
  service; the ledger is a mock, though the bootstrap is computed for real.

  Variants with ?variant=a|b|c: a is the ladder and the solved pillars, b is
  the zero curve, the discount factors and the forward curve, c is the
  diagnostics (reprice residual, shape checks, convergence). ?state=clean|
  inverted|spike|collision switches the ladder: a rising curve, a falling one,
  a bad 5Y pillar that spikes the forward, and two interval instruments whose
  periods overlap, which the validator refuses before the solve starts.
-->

<div class="proto-note" id="note"></div>
<div class="wrap" id="app"></div>
<div class="proto-bar" id="bar"></div>

<script>
const params = new URLSearchParams(location.search);
const variant = params.get('variant') || 'a';
const state = params.get('state') || '';

// Prototype plotting helper. Throwaway, dependency-free, dark-theme SVG.
// Each function returns an HTML string, so a page calls host.innerHTML = PC.line({...}).
// Prefixed PC to stay clear of page-local names; the pages also define `tag`.
const PC = (() => {
  const C = {grid:'#21262d', axis:'#30363d', text:'#71717a', dim:'#a1a1aa',
             ink:'#e3e3e6', accent:'#58a6ff', ok:'#3fb950', warn:'#d29922', bad:'#f85149'};
  const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const fmt = (v, d) => v == null ? '—' : (typeof v === 'number' ? v.toFixed(d ?? 2) : String(v));
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  // A blue -> amber ramp for a heat cell, t in 0..1.
  function heatColour(t){
    const stops = [[13,23,38],[21,60,110],[32,110,170],[88,166,255],[210,153,34],[248,81,73]];
    const p = clamp(t, 0, 1) * (stops.length - 1), i = Math.floor(p), f = p - i;
    const a = stops[i], b = stops[Math.min(stops.length - 1, i + 1)];
    return `rgb(${a.map((x, k) => Math.round(x + (b[k] - x) * f)).join(',')})`;
  }

  // Shared frame: margins, y gridlines and labels for a value axis.
  function frame(o){
    const w = o.w || 940, h = o.h || 300;
    const pad = Object.assign({l:64, r:18, t:16, b:40}, o.pad || {});
    const x0 = pad.l, x1 = w - pad.r, y0 = h - pad.b, y1 = pad.t;
    const vals = (o.series || []).flatMap(s => s.points || []).filter(v => v != null)
      .concat(o.extra || []);
    let lo = Math.min(...vals), hi = Math.max(...vals);
    if (o.zero) { lo = Math.min(lo, 0); hi = Math.max(hi, 0); }
    if (!(hi > lo)) { hi = lo + 1; }
    const span = hi - lo, l2 = lo - span * 0.08, h2 = hi + span * 0.08;
    const y = v => y0 - (v - l2) * (y0 - y1) / (h2 - l2);
    const X = o.x ? (i => x0 + o.x[i] * (x1 - x0))
                  : (i => x0 + i * (x1 - x0) / Math.max(1, (o.ticks ? o.ticks.length : 1) - 1));
    const yTicks = [];
    const steps = o.ySteps || 4;
    for (let k = 0; k <= steps; k++) {
      const v = l2 + (h2 - l2) * k / steps;
      yTicks.push(`<line x1="${x0}" y1="${y(v).toFixed(1)}" x2="${x1}" y2="${y(v).toFixed(1)}" stroke="${C.grid}"/>
        <text x="${x0 - 8}" y="${(y(v) + 3.5).toFixed(1)}" fill="${C.text}" font-size="10" text-anchor="end">${esc((o.yFmt || (v => fmt(v)))(v))}</text>`);
    }
    const xTicks = (o.ticks || []).map(t => {
      const px = o.x ? x0 + t.at * (x1 - x0) : X(t.at);
      return `<text x="${px.toFixed(1)}" y="${h - pad.b + 15}" fill="${C.text}" font-size="10" text-anchor="middle">${esc(t.label)}</text>`;
    }).join('');
    const grid = (o.xticks || []).map(t => {
      const px = o.x ? x0 + t.at * (x1 - x0) : X(t.at);
      return `<line x1="${px.toFixed(1)}" y1="${y1}" x2="${px.toFixed(1)}" y2="${y0}" stroke="${C.grid}" stroke-dasharray="2 3"/>`;
    }).join('');
    return {w, h, x0, x1, y0, y1, y, X, l2, h2, frame: yTicks.join('') + grid + xTicks};
  }

  function line(o){
    const f = frame(o);
    const bands = (o.bands || []).map(b => {
      const xa = f.x0 + b.from * (f.x1 - f.x0), xb = f.x0 + b.to * (f.x1 - f.x0);
      return `<rect x="${xa.toFixed(1)}" y="${f.y1}" width="${(xb - xa).toFixed(1)}" height="${(f.y0 - f.y1).toFixed(1)}"
        fill="${b.color || C.accent}" opacity=".08"/>` +
        (b.label ? `<text x="${((xa + xb) / 2).toFixed(1)}" y="${f.y1 + 11}" fill="${C.text}" font-size="9" text-anchor="middle">${esc(b.label)}</text>` : '');
    }).join('');
    const paths = (o.series || []).map(s => {
      let d = '', pen = false;
      s.points.forEach((v, i) => {
        if (v == null) { pen = false; return; }
        d += (pen ? 'L' : 'M') + f.X(i).toFixed(1) + ',' + f.y(v).toFixed(1) + ' ';
        pen = true;
      });
      const marks = s.markers ? s.points.map((v, i) => v == null ? '' :
        `<circle cx="${f.X(i).toFixed(1)}" cy="${f.y(v).toFixed(1)}" r="${s.r || 3.4}" fill="${s.color}"/>`).join('') : '';
      return `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="${s.width || 2}"${s.dash ? ` stroke-dasharray="${s.dash}"` : ''}/>${marks}`;
    }).join('');
    const legend = o.legend === false ? '' : `<div class="pc-legend">${(o.series || []).map(s =>
      `<span><i style="background:${s.color}"></i>${esc(s.name)}</span>`).join('')}${(o.notes || []).map(n =>
      `<span class="faint">${n}</span>`).join('')}</div>`;
    return `<figure class="pc"><svg viewBox="0 0 ${f.w} ${f.h}" width="100%" height="${f.h}" role="img" aria-label="${esc(o.title || 'chart')}">
      ${bands}${f.frame}${paths}
      ${o.yLabel ? `<text x="14" y="${(f.y0 + f.y1) / 2}" fill="${C.text}" font-size="10" transform="rotate(-90 14 ${(f.y0 + f.y1) / 2})" text-anchor="middle">${esc(o.yLabel)}</text>` : ''}
    </svg>${legend}${o.caption ? `<figcaption class="faint">${o.caption}</figcaption>` : ''}</figure>`;
  }

  function bars(o){
    const f = frame(Object.assign({zero: true}, o));
    const n = o.bars.length, bw = (f.x1 - f.x0) / n;
    const zero = f.y(0);
    const body = o.bars.map((b, i) => {
      const v = b.value == null ? null : b.value;
      const x = f.x0 + i * bw + bw * 0.18, w = bw * 0.64;
      const yv = v == null ? zero : f.y(v);
      const top = Math.min(yv, zero), hgt = Math.abs(zero - yv);
      const col = b.color || (v == null ? C.text : v >= 0 ? C.warn : C.accent);
      return `<rect x="${x.toFixed(1)}" y="${top.toFixed(1)}" width="${w.toFixed(1)}" height="${Math.max(1, hgt).toFixed(1)}" fill="${col}" opacity=".85"><title>${esc(b.label)}: ${esc(fmt(v))}</title></rect>
        <text x="${(x + w / 2).toFixed(1)}" y="${(f.h - 24)}" fill="${C.text}" font-size="9" text-anchor="middle">${esc(b.label)}</text>`;
    }).join('');
    return `<figure class="pc"><svg viewBox="0 0 ${f.w} ${f.h}" width="100%" height="${f.h}" role="img" aria-label="${esc(o.title || 'bars')}">
      ${f.frame}<line x1="${f.x0}" y1="${zero}" x2="${f.x1}" y2="${zero}" stroke="${C.axis}"/>${body}</svg>
      ${o.caption ? `<figcaption class="faint">${o.caption}</figcaption>` : ''}</figure>`;
  }

  // A surface as a shaded mesh grid: one cell per (row, column).
  function heat(o){
    const rows = o.rows, cols = o.cols;
    const cw = o.cell || 54, ch = o.cellH || 30, l = 58, t = 26;
    const w = l + cols.length * cw + (o.legend === false ? 14 : 92);
    const h = t + rows.length * ch + 34;
    const vals = [];
    rows.forEach((_, i) => cols.forEach((_, j) => { const v = o.value(i, j); if (v != null) vals.push(v); }));
    const lo = Math.min(...vals), hi = Math.max(...vals), span = (hi - lo) || 1;
    const cells = [];
    rows.forEach((r, i) => cols.forEach((c, j) => {
      const v = o.value(i, j);
      const x = l + j * cw, y = t + i * ch;
      const col = v == null ? '#161619' : heatColour((v - lo) / span);
      cells.push(`<rect x="${x}" y="${y}" width="${cw - 2}" height="${ch - 2}" rx="2" fill="${col}"><title>${esc(r.label)} · ${esc(c.label)}: ${esc(fmt(v, o.dp))}</title></rect>`);
      if (o.showValues !== false) cells.push(`<text x="${(x + (cw - 2) / 2).toFixed(1)}" y="${(y + ch / 2 + 3.5).toFixed(1)}" fill="${(v != null && (v - lo) / span > 0.55) ? '#0d1117' : C.ink}" font-size="9.5" text-anchor="middle">${esc(fmt(v, o.dp ?? 1))}</text>`);
    }));
    const rowLabels = rows.map((r, i) => `<text x="${l - 8}" y="${(t + i * ch + ch / 2 + 3.5).toFixed(1)}" fill="${C.text}" font-size="10" text-anchor="end">${esc(r.label)}</text>`).join('');
    const colLabels = cols.map((c, j) => `<text x="${(l + j * cw + (cw - 2) / 2).toFixed(1)}" y="${t - 8}" fill="${C.text}" font-size="10" text-anchor="middle">${esc(c.label)}</text>`).join('');
    const legend = o.legend === false ? '' : (() => {
      const bx = l + cols.length * cw + 14, by = t, bh = rows.length * ch - 2;
      const steps = 24, sh = bh / steps;
      let g = '';
      for (let k = 0; k < steps; k++) g += `<rect x="${bx}" y="${(by + k * sh).toFixed(1)}" width="12" height="${(sh + 1).toFixed(1)}" fill="${heatColour(1 - k / (steps - 1))}"/>`;
      return `<g>${g}<text x="${bx + 18}" y="${by + 8}" fill="${C.text}" font-size="9">${esc(fmt(hi, o.dp))}</text>
        <text x="${bx + 18}" y="${by + bh}" fill="${C.text}" font-size="9">${esc(fmt(lo, o.dp))}</text></g>`;
    })();
    return `<figure class="pc"><svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" role="img" aria-label="${esc(o.title || 'heat map')}">
      ${cells.join('')}${rowLabels}${colLabels}${legend}
      ${o.xLabel ? `<text x="${(l + cols.length * cw / 2).toFixed(1)}" y="${h - 6}" fill="${C.text}" font-size="10" text-anchor="middle">${esc(o.xLabel)}</text>` : ''}
      ${o.yLabel ? `<text x="12" y="${(t + rows.length * ch / 2).toFixed(1)}" fill="${C.text}" font-size="10" transform="rotate(-90 12 ${(t + rows.length * ch / 2).toFixed(1)})" text-anchor="middle">${esc(o.yLabel)}</text>` : ''}
    </svg>${o.caption ? `<figcaption class="faint">${o.caption}</figcaption>` : ''}</figure>`;
  }

  // A surface as an isometric wireframe: rows and columns joined over a height.
  function mesh(o){
    const w = o.w || 940, h = o.h || 420;
    const rows = o.z.length, cols = o.z[0].length;
    const vals = o.z.flat().filter(v => v != null);
    const lo = Math.min(...vals), hi = Math.max(...vals), span = (hi - lo) || 1;
    const ox = o.ox ?? w * 0.52;
    const sy = o.sy ?? Math.min(22, h / (2 * Math.max(1, (rows - 1) + (cols - 1))));
    const sx = o.sx ?? Math.min(46, (w * 0.6) / Math.max(1, (rows - 1) + (cols - 1)));
    const sz = o.sz ?? h * 0.34;
    const oy = o.oy ?? h - 26 - ((rows - 1) + (cols - 1)) * sy;
    const P = (i, j) => {
      const v = o.z[i][j];
      const z = v == null ? 0 : (v - lo) / span;
      return [ox + (j - i) * sx, oy + (i + j) * sy - z * sz, z];
    };
    const lines = [];
    for (let i = 0; i < rows; i++) {
      let d = '';
      for (let j = 0; j < cols; j++) { const p = P(i, j); d += (j ? 'L' : 'M') + p[0].toFixed(1) + ',' + p[1].toFixed(1) + ' '; }
      lines.push(`<path d="${d}" fill="none" stroke="${C.accent}" stroke-width="1.4" opacity=".75"/>`);
    }
    for (let j = 0; j < cols; j++) {
      let d = '';
      for (let i = 0; i < rows; i++) { const p = P(i, j); d += (i ? 'L' : 'M') + p[0].toFixed(1) + ',' + p[1].toFixed(1) + ' '; }
      lines.push(`<path d="${d}" fill="none" stroke="${C.warn}" stroke-width="1" opacity=".5"/>`);
    }
    const rowL = (o.rows || []).map((r, i) => { const p = P(i, 0); return `<text x="${(p[0] - 12).toFixed(1)}" y="${(p[1] + 4).toFixed(1)}" fill="${C.text}" font-size="10" text-anchor="end">${esc(r.label)}</text>`; }).join('');
    const colL = (o.cols || []).map((c, j) => { const p = P(rows - 1, j); return `<text x="${(p[0] + 10).toFixed(1)}" y="${(p[1] + 4).toFixed(1)}" fill="${C.text}" font-size="10">${esc(c.label)}</text>`; }).join('');
    const axis = `<text x="14" y="${h - 12}" fill="${C.text}" font-size="10">height: ${esc(o.zLabel || 'value')} ${esc(fmt(lo, o.dp))}–${esc(fmt(hi, o.dp))}</text>`;
    return `<figure class="pc"><svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" role="img" aria-label="${esc(o.title || 'surface mesh')}">
      ${lines.join('')}${rowL}${colL}${axis}</svg>
      <div class="pc-legend"><span><i style="background:${C.accent}"></i>expiry</span><span><i style="background:${C.warn}"></i>strike</span>${(o.notes || []).map(n => `<span class="faint">${n}</span>`).join('')}</div>
      ${o.caption ? `<figcaption class="faint">${esc(o.caption)}</figcaption>` : ''}</figure>`;
  }

  return {line, bars, heat, mesh, colours: C, heatColour};
})();

function urlButton(url){
  return `<button class="urlbtn" type="button" data-url="${url}" title="Edit in the oresmd URL editor">`+
         `<span class="mono">${url}</span><span class="edit">edit</span></button>`;
}
function openOresmdEditor(url, host){
  const ov=document.createElement('div'); ov.className='oresmd-overlay';
  const f=document.createElement('iframe'); f.className='oresmd-frame'; f.title='oresmd URL editor';
  f.src='../oresmd-url-editor/index.html?embed=1&url='+encodeURIComponent(url||'');
  ov.appendChild(f); document.body.appendChild(ov);
  function close(){ window.removeEventListener('message', onMsg); document.removeEventListener('keydown', onKey); ov.remove(); }
  function onMsg(e){ if(e.data && e.data.type==='oresmd-url'){ host.dataset.url=e.data.url; const m=host.querySelector('.mono'); if(m) m.textContent=e.data.url; close(); } }
  function onKey(e){ if(e.key==='Escape') close(); }
  window.addEventListener('message', onMsg); document.addEventListener('keydown', onKey);
  ov.addEventListener('click', e=>{ if(e.target===ov) close(); });
}
document.addEventListener('click', e=>{
  const b=e.target.closest('.urlbtn'); if(!b) return;
  openOresmdEditor(b.dataset.url||'', b);
});
function tag(text, kind){ return `<span class="tag ${kind||''}">${text}</span>`; }

// ==== page data and panels ====
// Tenor to years, the resolution the curve is bootstrapped on.
const TY = {'SPOT':0,'1M':1/12,'3M':0.25,'6M':0.5,'1Y':1,'2Y':2,'3Y':3,'4Y':4,
            '5Y':5,'7Y':7,'10Y':10,'20Y':20,'30Y':30};

// The Curve Template ladder the IR curve feed authors: one row per
// ir_curve_template_entry (sequence, start tenor, end tenor, instrument),
// against the market par rate each instrument quotes. Same shape the editor's
// Curve Template tab holds and preview_ir_curve_shape reads.
const LADDERS = {
  clean: [
    {seq:1, inst:'DEPO', start:'SPOT', end:'1M',  par:4.310},
    {seq:2, inst:'DEPO', start:'SPOT', end:'3M',  par:4.350},
    {seq:3, inst:'FRA',  start:'3M',   end:'6M',  par:4.380},
    {seq:4, inst:'IRS',  start:'SPOT', end:'1Y',  par:4.400},
    {seq:5, inst:'IRS',  start:'SPOT', end:'2Y',  par:4.360},
    {seq:6, inst:'IRS',  start:'SPOT', end:'5Y',  par:4.250},
    {seq:7, inst:'IRS',  start:'SPOT', end:'10Y', par:4.190},
    {seq:8, inst:'IRS',  start:'SPOT', end:'30Y', par:3.910}
  ],
  inverted: [
    {seq:1, inst:'DEPO', start:'SPOT', end:'1M',  par:5.180},
    {seq:2, inst:'DEPO', start:'SPOT', end:'3M',  par:5.120},
    {seq:3, inst:'FRA',  start:'3M',   end:'6M',  par:5.040},
    {seq:4, inst:'IRS',  start:'SPOT', end:'1Y',  par:4.780},
    {seq:5, inst:'IRS',  start:'SPOT', end:'2Y',  par:4.410},
    {seq:6, inst:'IRS',  start:'SPOT', end:'5Y',  par:3.980},
    {seq:7, inst:'IRS',  start:'SPOT', end:'10Y', par:3.720},
    {seq:8, inst:'IRS',  start:'SPOT', end:'30Y', par:3.410}
  ],
  collision: [
    {seq:1, inst:'DEPO', start:'SPOT', end:'3M',  par:4.350},
    {seq:2, inst:'FRA',  start:'3M',   end:'1Y',  par:4.380},
    {seq:3, inst:'FRA',  start:'6M',   end:'2Y',  par:4.370},
    {seq:4, inst:'IRS',  start:'SPOT', end:'5Y',  par:4.250},
    {seq:5, inst:'IRS',  start:'SPOT', end:'10Y', par:4.190}
  ],
  spike: [
    {seq:1, inst:'DEPO', start:'SPOT', end:'1M',  par:4.310},
    {seq:2, inst:'DEPO', start:'SPOT', end:'3M',  par:4.350},
    {seq:3, inst:'FRA',  start:'3M',   end:'6M',  par:4.380},
    {seq:4, inst:'IRS',  start:'SPOT', end:'1Y',  par:4.400},
    {seq:5, inst:'IRS',  start:'SPOT', end:'2Y',  par:4.360},
    {seq:6, inst:'IRS',  start:'SPOT', end:'5Y',  par:5.100},
    {seq:7, inst:'IRS',  start:'SPOT', end:'10Y', par:4.190},
    {seq:8, inst:'IRS',  start:'SPOT', end:'30Y', par:3.910}
  ]
};
const PROCESS = {name:'Vasicek', code:'VASICEK',
  params:[['kappa','κ',0.5],['theta','θ',0.03],['sigma','σ',0.01],['initial_rate','r0',0.03]]};

function logDfAt(pillars, t){
  const ps = pillars.slice().sort((a, b) => a.t - b.t);
  if (!ps.length) return 0;
  if (t <= ps[0].t) return Math.log(ps[0].df) * (t / ps[0].t);
  for (let i = 1; i < ps.length; i++){
    if (t <= ps[i].t){
      const a = ps[i - 1], b = ps[i], w = (t - a.t) / (b.t - a.t);
      return Math.log(a.df) + w * (Math.log(b.df) - Math.log(a.df));
    }
  }
  const last = ps[ps.length - 1];
  return Math.log(last.df) * (t / last.t);
}
const dfAt = (pillars, t) => Math.exp(logDfAt(pillars, t));

// A tenor period collides when two interval instruments overlap, or one
// interval swallows another entry's maturity. ores.synthetic's
// curve_template_validation refuses the save on the same rule.
function collisions(ladder){
  const iv = ladder.filter(r => r.start !== 'SPOT')
    .map(r => ({...r, ts:TY[r.start], te:TY[r.end]}));
  const out = [];
  for (let i = 0; i < iv.length; i++)
    for (let j = i + 1; j < iv.length; j++)
      if (iv[i].ts < iv[j].te && iv[j].ts < iv[i].te)
        out.push(`${iv[i].inst} ${iv[i].start}→${iv[i].end} overlaps ${iv[j].inst} ${iv[j].start}→${iv[j].end}`);
  return out;
}

// Bootstrap the pillars in template order: each instrument is solved for the
// discount factor that reprices it to par off the curve so far, then the whole
// set is refined until the interpolation between pillars stops moving.
function boot(ladder){
  const pillars = [];
  const solve = r => {
    if (r.inst === 'IRS'){
      const n = Math.max(1, Math.round(TY[r.end]));
      let s = 0;
      for (let k = 1; k < n; k++) s += dfAt(pillars, k);
      return (1 - r.par / 100 * s) / (1 + r.par / 100);
    }
    if (r.start === 'SPOT') return 1 / (1 + r.par / 100 * TY[r.end]);
    const ts = TY[r.start] ?? 0;
    return dfAt(pillars, ts) / (1 + r.par / 100 * (TY[r.end] - ts));
  };
  ladder.forEach(r => pillars.push({...r, t:TY[r.end], df:solve(r)}));
  let iter = 0, passes = 0, delta = 0;
  for (iter = 1; iter <= 8; iter++){
    passes = iter;
    delta = 0;
    pillars.forEach(p => {
      const old = p.df, next = solve(p);
      p.df = next;
      delta = Math.max(delta, Math.abs(next - old));
    });
    if (delta < 1e-12) break;
  }
  pillars.forEach(p => { p.zero = -Math.log(p.df) / p.t * 100; });
  pillars.forEach(p => {
    if (p.inst === 'IRS'){
      const n = Math.max(1, Math.round(p.t));
      let a = 0;
      for (let k = 1; k <= n; k++) a += dfAt(pillars, k);
      p.model = (1 - p.df) / a * 100;
    } else if (p.start === 'SPOT') p.model = (1 / p.df - 1) / p.t * 100;
    else {
      const ts = TY[p.start];
      p.model = (dfAt(pillars, ts) / p.df - 1) / (p.t - ts) * 100;
    }
    p.resid = (p.model - p.par) * 100;
  });
  pillars.forEach((p, i) => {
    const q = pillars[i - 1];
    p.fwd = q ? (p.zero * p.t - q.zero * q.t) / (p.t - q.t) : p.zero;
    p.jump = q ? (p.fwd - q.fwd) * 100 : 0;
  });
  return {pillars, iter:passes, delta};
}

function data(){
  const ladder = LADDERS[state] || LADDERS.clean;
  const coll = collisions(ladder);
  return {ladder, coll, solved: coll.length ? null : boot(ladder)};
}
const xlog = ts => {
  const lo = Math.log(ts[0]), hi = Math.log(ts[ts.length - 1]);
  return ts.map(t => (Math.log(t) - lo) / (hi - lo));
};
function header(){
  return `
  <div class="top">
    <h1>Synthetic yield curve — bootstrap</h1>
    <span class="muted">candidate · nothing published</span>
    <a style="margin-left:auto" href="../../knowledge/ui/synthetic_data_generation_screens.html">the screens &rarr;</a>
  </div>
  <div class="panel">
    <h2>Curve and process</h2>
    <div class="row">
      <div class="field"><label>Currency</label><div class="value">USD</div></div>
      <div class="field"><label>Index family</label><div class="value">SOFR</div></div>
      <div class="field"><label>Role</label><div class="value">Discount</div></div>
      <div class="field"><label>Process</label><div class="value">${PROCESS.name} <span class="faint mono">${PROCESS.code}</span></div></div>
      ${PROCESS.params.map(([k, sym, v]) => `<div class="field"><label>${k} ${sym}</label><div class="value mono">${v}</div></div>`).join('')}
      <div class="field"><label>Fixed leg frequency</label><div class="value">Annual</div></div>
      <div class="field" style="flex:1"><label>Output series (oresmd URI)</label><div class="value mono">${urlButton('oresmd://ir/USD?type=series&instrument=discount&quote=rate&curve_id=USD-SOFR-OIS')}</div></div>
    </div>
    <div class="notice">The ladder is the generator's Curve Template; the process and r0 come from the IR curve feed. The bootstrap is stateless: it runs when the feed ticks and is not stored.</div>
  </div>`;
}
function ladderTable(d){
  return `
  <div class="panel">
    <h2>Curve Template ladder — the instruments to reprice</h2>
    <table>
      <thead><tr><th>#</th><th>Instrument</th><th>Start tenor</th><th>End tenor</th><th class="num">Par rate</th><th>Period (years)</th></tr></thead>
      <tbody>${d.ladder.map(r => `<tr><td class="mono">${r.seq}</td><td>${r.inst}</td>
        <td class="mono">${r.start}</td><td class="mono">${r.end}</td>
        <td class="num">${r.par.toFixed(3)}%</td><td class="num">${(TY[r.end] - (TY[r.start] || 0)).toFixed(3)}</td></tr>`).join('')}</tbody>
    </table>
    <div class="notice">A strip is bootstrappable when the periods touch end to end and no interval swallows another entry's maturity.</div>
  </div>`;
}
function resultTable(d){
  const p = d.solved.pillars;
  return `
  <div class="panel">
    <h2>Bootstrapped pillars — solved in template order</h2>
    <table>
      <thead><tr><th>Pillar</th><th class="num">t (yrs)</th><th>Instrument</th><th class="num">Solved zero</th><th class="num">Discount factor</th><th class="num">Forward to pillar</th><th class="num">Reprice residual</th></tr></thead>
      <tbody>${p.map(r => `<tr><td class="mono">${r.end}</td><td class="num">${r.t.toFixed(3)}</td><td>${r.inst}</td>
        <td class="num">${r.zero.toFixed(3)}%</td><td class="num">${r.df.toFixed(6)}</td>
        <td class="num">${r.fwd.toFixed(3)}%</td>
        <td class="num">${Math.abs(r.resid) < 0.01 ? tag(r.resid.toFixed(3) + ' bp', 'ok') : tag(r.resid.toFixed(1) + ' bp', 'bad')}</td></tr>`).join('')}</tbody>
    </table>
    <div class="notice">Every pillar reprices its own instrument to par: that is what "solved" means here. A curve that leaves one out has a broken strip, not a curve.</div>
  </div>`;
}
function shapeCharts(d){
  const p = d.solved.pillars, ts = p.map(r => r.t);
  const x = xlog(ts), ticks = p.map((r, i) => ({at:x[i], label:r.end}));
  const base = {x, ticks, h:250, markers:true};
  return `
  <div class="panel">
    <h2>Zero curve and discount factors</h2>
    <div class="grid2">
      <div>${PC.line({...base, series:[{name:'zero rate %', color:PC.colours.accent, points:p.map(r => r.zero)}],
        yFmt:v => v.toFixed(2), yLabel:'zero %',
        caption:'The solved zero rate at each pillar. The axis is log-spaced in years, so the short end reads at its own scale.'})}</div>
      <div>${PC.line({...base, series:[{name:'discount factor', color:PC.colours.ok, points:p.map(r => r.df)}],
        yFmt:v => v.toFixed(4), yLabel:'DF',
        caption:'Discount factors must fall monotonically from one; a rise is an arbitrage, not a shape.'})}</div>
    </div>
  </div>
  <div class="panel">
    <h2>Instantaneous forward curve</h2>
    ${PC.line({...base, series:[{name:'forward %', color:PC.colours.warn, points:p.map(r => r.fwd)}],
      yFmt:v => v.toFixed(2), yLabel:'forward %',
      caption:'The forward implied between consecutive pillars. This is the curve a desk actually trades, and the one a bad pillar distorts.'})}
  </div>`;
}
function diagnostics(d){
  const p = d.solved.pillars;
  const maxResid = Math.max(...p.map(r => Math.abs(r.resid)));
  const dfOk = p.every((r, i) => r.df > 0 && (i === 0 || r.df < p[i - 1].df));
  const fwdOk = p.every(r => r.fwd > 0);
  const spikes = p.filter(r => Math.abs(r.jump) > 100);
  const rows = [
    ['Tenor periods collide', d.coll.length ? d.coll.join('; ') : 'none', d.coll.length ? 'bad' : 'ok'],
    ['Discount factors positive and falling', dfOk ? 'yes' : 'no', dfOk ? 'ok' : 'bad'],
    ['Forward rates positive', fwdOk ? 'yes' : 'no', fwdOk ? 'ok' : 'bad'],
    ['Largest reprice residual', maxResid < 0.01 ? '< 0.01 bp' : maxResid.toFixed(2) + ' bp', maxResid < 0.01 ? 'ok' : 'bad'],
    ['Forward jumps over 100 bp', spikes.length ? spikes.map(r => r.end).join(', ') : 'none', spikes.length ? 'warn' : 'ok'],
    ['Refinement iterations', `${d.solved.iter} (Δ ${d.solved.delta.toExponential(1)})`, 'ok']
  ];
  return `
  <div class="panel">
    <h2>Bootstrap diagnostics</h2>
    <div class="grid2">
      <div>${PC.bars({bars:p.map(r => ({label:r.end, value:r.resid,
        color:Math.abs(r.resid) < 0.01 ? PC.colours.ok : PC.colours.bad})),
        yFmt:v => v.toFixed(3), yLabel:'residual bp', h:260, zero:true,
        caption:'Repricing residual per pillar, in basis points. A converged bootstrap sits on zero.'})}</div>
      <table><tbody>${rows.map(([k, v, c]) => `<tr><td>${k}</td><td>${tag(v, c)}</td></tr>`).join('')}</tbody></table>
    </div>
    <div class="notice">The bootstrap forces each pillar to reprice, so a residual is a convergence failure, not a market view. A forward spike is the shape check: the curve can reprice every instrument and still be implausible.</div>
  </div>`;
}
function collisionPanel(d){
  return `
  <div class="panel">
    <h2>Refused — the tenor periods collide</h2>
    <div class="notice" style="border-color:#5a2320">${tag('not bootstrappable','bad')}
      ${d.coll.map(c => `<div class="mono">${c}</div>`).join('')}
      <p>Two interval instruments overlap, so the sequential solve has no order that reprices both. ores.synthetic's curve template validator refuses the save on this rule; the screen must say which periods cross, not just that it failed.</p></div>
  </div>`;
}
function savePanel(d){
  return `
  <div class="panel">
    <h2>What save would do</h2>
    <div class="notice">Saving the feed writes two rows — the config and its Curve Template entries — and never the curve. The bootstrap runs on each tick from the stored ladder and process; ${d.solved ? `here it converged in ${d.solved.iter} refinement pass(es)` : 'here it refuses before it starts'}. A published curve is a market data concern; this is the candidate the feed would publish.</div>
  </div>`;
}
function render(){
  const d = data();
  let body;
  if (d.coll.length) body = ladderTable(d) + collisionPanel(d);
  else if (variant === 'b') body = shapeCharts(d);
  else if (variant === 'c') body = diagnostics(d) + ladderTable(d);
  else body = ladderTable(d) + resultTable(d);
  document.getElementById('app').innerHTML = header() + body + savePanel(d);
  document.getElementById('note').textContent =
    `Prototype · synthetic yield curve bootstrap · variant ${variant.toUpperCase()} · ladder: ${state || 'clean'} · mock data · nothing is stored`;
  document.getElementById('bar').innerHTML =
    `<span class="label">View</span>` +
    ['a','b','c'].map(v => `<button data-v="${v}" class="${v === variant ? 'on' : ''}">${v === 'a' ? 'pillars' : v === 'b' ? 'curves' : 'checks'}</button>`).join('') +
    `<span class="sep">|</span><span class="label">Ladder</span>` +
    [['clean','clean'],['inverted','inverted'],['spike','bad pillar'],['collision','collision']]
      .map(([s, t]) => `<button data-s="${s}" class="${s === (state || 'clean') ? 'on' : ''}">${t}</button>`).join('');
  document.querySelectorAll('#bar [data-v]').forEach(b => b.onclick = () => set('variant', b.dataset.v));
  document.querySelectorAll('#bar [data-s]').forEach(b => b.onclick = () => set('state', b.dataset.s));
}
function set(k, v){ const p = new URLSearchParams(location.search); p.set(k, v); location.search = p.toString(); }
render();
</script>
