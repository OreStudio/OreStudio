<title>First run journey prototype — ORE Studio</title>

<body>

<!--
  PROTOTYPE. Throwaway. Mock data, no backend, no build step.

  The accepted first run journey: one rail that opens on the welcome and
  carries the administrator, the starting point, the tenant stages and the
  ready step. The starting point decides the rail's shape: a profile runs the
  tenant stages, and Bare system goes straight to ready. The journey stays
  signed in as the administrator it created. The tenant administrator's own
  screen is a separate state, because it belongs to that other person.

  The states are chosen from the query string, the same way the navigation
  prototype chooses its own:

    ?state=welcome|administrator|profile|details|review|provisioning|ready|tenant-setup
    ?admin=resume                          the administrator step signs in
    ?profile=bare_system|empty_operational|acme_demo
    ?open=1                                the details form, not the summary
    ?fail=1                                make the third provisioning step fail once
    ?stepfail=1                            a step's action fails, above the rail
    ?request=1                             a request fails, above the screen
    ?run=pending|running|done|failed       a snapshot of the provisioning run

  The bar at the foot mirrors the same states as buttons.
-->

<div class="proto-note" id="proto-note"></div>
<div id="banner"></div>
<div id="app"></div>
<div class="proto-bar" id="proto-bar"></div>

<script src="prototype.js"></script>
</body>
</html>
