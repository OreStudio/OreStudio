# yamllint disable rule:line-length
---
name: Attach packages to the release

# One release carries the packages of three platforms, and each of the three
# workflows that build them attaches its own. The only thing that differs is the
# artifact pattern, so that is the input.

on:  # yamllint disable-line rule:truthy
  workflow_call:
    inputs:
      pattern:
        description: >-
          The artifact names of this platform's packages, as a glob, for
          example linux-*-release-ninja.
        required: true
        type: string

jobs:
  attach:
    name: Attach packages to the release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download the packages of this run
        uses: actions/download-artifact@v8
        with:
          pattern: ${{ inputs.pattern }}
          path: packages
          merge-multiple: true

      - name: Attach the packages to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" packages/* --clobber --repo "$GITHUB_REPOSITORY"
