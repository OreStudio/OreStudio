<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Manage market data bindings prototype — Market data journeys</title>
<style>

:root{color-scheme:dark;--bg:#121214;--panel:#1a1a1e;--panel-2:#26262b;--line:#30363d;--line-soft:#21262d;--ink:#e3e3e6;--ink-dim:#a1a1aa;--ink-faint:#71717a;--accent:#58a6ff;--accent-dim:#21262d;--ok:#3fb950;--warn:#d29922;--bad:#f85149;--radius:.5rem;--mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink)}
body{margin:0;font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;padding:2.5rem 1.5rem 8rem}
h1,h2,h3{margin:0;font-weight:600}h1{font-size:1.15rem}h2{font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-dim)}
p{margin:0}ul{margin:0;padding:0;list-style:none}a{color:var(--accent);text-decoration:none}
button,input,select{font:inherit;color:inherit}button{cursor:pointer}
.mono{font-family:var(--mono)}.muted{color:var(--ink-dim)}.faint{color:var(--ink-faint)}
.wrap{max-width:1080px;margin:0 auto;display:grid;gap:14px}
.top{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px;display:grid;gap:10px}
.panel>h2{border-bottom:1px solid var(--line-soft);padding-bottom:6px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.field{display:grid;gap:4px;min-width:170px}.field label{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-faint)}
.field .value,.field select,.field input{background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:6px 8px}
table{width:100%;border-collapse:collapse;font-size:.86rem}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line-soft)}
th{font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-faint);font-weight:600}
td.num{text-align:right;font-family:var(--mono)}
.btn{background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:7px 12px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#0d1117;font-weight:600}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.tag{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:1px 8px;font-size:.72rem;color:var(--ink-dim)}
.tag.ok{color:var(--ok);border-color:#1f4d29}.tag.bad{color:var(--bad);border-color:#5a2320}.tag.warn{color:var(--warn);border-color:#4a3a17}
.notice{border:1px dashed var(--line);border-radius:var(--radius);padding:10px 12px;color:var(--ink-dim);background:#161619}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:820px){.grid2{grid-template-columns:1fr}}
.proto-note{position:fixed;top:0;left:0;right:0;z-index:60;padding:6px 14px;background:repeating-linear-gradient(45deg,#2a2113,#2a2113 10px,#241d11 10px,#241d11 20px);border-bottom:1px solid #4a3a17;color:var(--warn);font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.proto-bar{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:60;display:flex;gap:2px;align-items:center;padding:5px 7px;background:#0b0e13;border:1px solid var(--line);border-radius:999px;box-shadow:0 8px 30px rgba(0,0,0,.6);font-size:12px;max-width:95vw;flex-wrap:wrap;justify-content:center}
.proto-bar button{background:none;border:none;color:var(--ink-dim);padding:6px 10px;border-radius:999px}
.proto-bar button:hover{background:var(--panel-2);color:var(--ink)}.proto-bar button.on{background:var(--accent-dim);color:var(--ink)}
.proto-bar .label{padding:0 8px}.proto-bar .sep{color:var(--line)}
.dlg-bg{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:18px}
.dlg{width:min(560px,96vw);background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;display:grid;gap:12px}
.dlg h2{font-size:.95rem;text-transform:none;letter-spacing:0;color:var(--ink)}
.dlg .field select{min-width:0;width:100%}
.toast{position:fixed;top:44px;right:16px;z-index:70;background:#10261a;border:1px solid #1f4d29;color:var(--ok);border-radius:var(--radius);padding:8px 12px}
.series a{color:var(--ink)}.series .uri{display:block;font-size:.72rem;color:var(--ink-faint);overflow-wrap:anywhere}
.vendor-row td{background:#17141a}
.sel td:first-child{box-shadow:inset 3px 0 var(--accent)}
tr.pick{cursor:pointer}tr.pick:hover td{background:#1d1d22}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:4px}
.tabs button{background:none;border:none;border-bottom:2px solid transparent;padding:6px 12px;color:var(--ink-dim)}
.tabs button.on{color:var(--ink);border-bottom-color:var(--accent)}
.hist{display:grid;grid-template-columns:18rem 1fr;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
@media(max-width:820px){.hist{grid-template-columns:1fr}}
.hist ol{margin:0;padding:0;list-style:none;border-right:1px solid var(--line)}
.hist li{padding:8px 10px;border-bottom:1px solid var(--line-soft);cursor:pointer;display:grid;gap:2px}
.hist li.on{background:#1d2530;box-shadow:inset 3px 0 var(--accent)}
.hist .cmp{padding:10px;display:grid;gap:8px;align-content:start}
td.before{background:#241313;color:#ffb3ad}td.after{background:#10261a;color:#9be9a8}
.warnbox{border:1px solid #4a3a17;background:#201a0e;color:var(--warn);border-radius:var(--radius);padding:8px 10px}
.okbox{border:1px solid #1f4d29;background:#0f1d14;color:var(--ok);border-radius:var(--radius);padding:8px 10px}
.badbox{border:1px solid #5a2320;background:#231211;color:var(--bad);border-radius:var(--radius);padding:8px 10px}
</style>
</head>
<body>

<!--
  PROTOTYPE. Throwaway. Mock data, no backend, no build step, no session.

  The screen of "Manage market data bindings"
  (doc/knowledge/journeys/market_data/journey_manage-market-data-bindings.org):
  the bindings a party consumes, the series each feeds, whether it runs and when
  it last ticked, and the acts that change a binding: bind a source, rebind,
  enable or disable, start or stop, remove.

  Query parameters:
    ?variant=a|b|c      a table with a detail panel, b the bindings grouped by the
                        series they feed, c a compact list beside a detail panel
    ?scenario=synthetic|real
                        synthetic is the supported path and can be followed to the
                        end. real adds vendor bindings, which are drawn and marked
                        as not supported: no control binds, rebinds or starts one.
    ?state=all|quiet|disabled
                        which mock bindings are quiet or disabled
    ?actor=operator|admin|viewer
                        who is using the screen, which decides the controls. This
                        is the open question of the journey.
  The acts change the mock list in memory, so a walk-through shows the result.
  Changing a query parameter reloads the page and resets the list.
-->

<div class="proto-note" id="note"></div>
<div class="wrap" id="app"></div>
<div class="proto-bar" id="bar"></div>
<div id="layer"></div>

<script>
const params = new URLSearchParams(location.search);
const variant = params.get('variant') || 'a';
const scenario = params.get('scenario') || 'synthetic';
const state = params.get('state') || 'all';
const actor = params.get('actor') || 'operator';

const REASONS = ['Amend', 'Correct a mistake', 'New market data source', 'Source retired'];
const PERMS = {
  bind: 'marketdata::feed_bindings:write', rebind: 'marketdata::feed_bindings:write',
  toggle: 'marketdata::feed_bindings:write', remove: 'marketdata::feed_bindings:delete',
  run: 'synthetic start and stop (no permission of its own yet)'
};
// Who may do what is the open question. The prototype proposes: a viewer reads,
// an operator binds, rebinds, enables, disables, starts and stops, and only the
// system administrator removes.
const MAY = {
  viewer: {},
  operator: {bind: 1, rebind: 1, toggle: 1, run: 1},
  admin: {bind: 1, rebind: 1, toggle: 1, run: 1, remove: 1}
};
const actorName = actor === 'admin' ? 'system administrator' : actor === 'viewer' ? 'a viewer' : 'market data operator';
const NOW_LABEL = '2026-10-13 10:00';
const may = act => !!(MAY[actor] || {})[act];

// Sources a party could consume. seriesUri is what the source writes.
const SOURCES = [
  {src: 'synthetic.bloomberg.audusd', series: 'AUD/USD spot rate', uri: 'oresmd://fx/AUD?type=quote&instrument=fx_spot&quote=rate&ccy=USD', kind: 'FX spot', tph: 1800, folder: 'Synthetic / Bloomberg / FX'},
  {src: 'synthetic.bloomberg.eurusd', series: 'EUR/USD spot rate', uri: 'oresmd://fx/EUR?type=quote&instrument=fx_spot&quote=rate&ccy=USD', kind: 'FX spot', tph: 1800, folder: 'Synthetic / Bloomberg / FX'},
  {src: 'synthetic.bloomberg.copibr', series: 'USD/COP spot rate', uri: 'oresmd://fx/USD?type=quote&instrument=fx_spot&quote=rate&ccy=COP', kind: 'FX spot', tph: 1800, folder: 'Synthetic / Bloomberg / FX'},
  {src: 'synthetic.bloomberg.nzdusd', series: 'NZD/USD spot rate', uri: 'oresmd://fx/NZD?type=quote&instrument=fx_spot&quote=rate&ccy=USD', kind: 'FX spot', tph: 1800, folder: 'Synthetic / Bloomberg / FX'},
  {src: 'synthetic.bloomberg.eurestr', series: 'EUR overnight curve', uri: 'oresmd://ir/EUR?type=series&instrument=zero&quote=rate', kind: 'IR curve', tph: 60, folder: 'Synthetic / Bloomberg / IR'},
  {src: 'synthetic.bloomberg.gbpusd', series: 'GBP/USD spot rate', uri: 'oresmd://fx/GBP?type=quote&instrument=fx_spot&quote=rate&ccy=USD', kind: 'FX spot', tph: 1800, folder: 'Synthetic / Bloomberg / FX'},
  {src: 'synthetic.bloomberg.usdjpy', series: 'USD/JPY spot rate', uri: 'oresmd://fx/USD?type=quote&instrument=fx_spot&quote=rate&ccy=JPY', kind: 'FX spot', tph: 1800, folder: 'Synthetic / Bloomberg / FX'},
  {src: 'synthetic.reuters.eurusd', series: 'EUR/USD spot rate', uri: 'oresmd://fx/EUR?type=quote&instrument=fx_spot&quote=rate&ccy=USD', kind: 'FX spot', tph: 1800, folder: 'Synthetic / Reuters / FX'}
];
const sourceOf = s => SOURCES.find(x => x.src === s);

let bindings = [
  {id: 'b1', src: 'synthetic.bloomberg.audusd', kind: 'SYNTHETIC', enabled: true, running: true, last: 2, ver: 3, by: 'market data operator'},
  {id: 'b2', src: 'synthetic.bloomberg.eurusd', kind: 'SYNTHETIC', enabled: true, running: true, last: 2, ver: 1, by: 'tenant provisioning'},
  {id: 'b3', src: 'synthetic.bloomberg.copibr', kind: 'SYNTHETIC', enabled: true, running: true, last: 2, ver: 3, by: 'market data operator'},
  {id: 'b4', src: 'synthetic.bloomberg.nzdusd', kind: 'SYNTHETIC', enabled: true, running: true, last: 2, ver: 2, by: 'tenant provisioning'},
  {id: 'b5', src: 'synthetic.bloomberg.eurestr', kind: 'SYNTHETIC', enabled: true, running: true, last: 3, ver: 1, by: 'tenant provisioning'}
];
if (state === 'quiet') { const b = bindings.find(x => x.src.endsWith('copibr')); b.running = false; b.last = 3600; }
if (state === 'disabled') { const b = bindings.find(x => x.src.endsWith('nzdusd')); b.enabled = false; b.running = false; b.last = 259200; }
if (scenario === 'real') {
  bindings.push(
    {id: 'v1', src: 'vendor.example.eurusd', kind: 'VENDOR', enabled: true, running: false, last: null, ver: 1, by: 'tenant provisioning', series: 'EUR/USD spot rate', uri: 'oresmd://fx/EUR?type=quote&instrument=fx_spot&quote=rate&ccy=USD'},
    {id: 'v2', src: 'vendor.example.usdsofr', kind: 'VENDOR', enabled: false, running: false, last: null, ver: 2, by: 'market data operator', series: 'USD overnight curve', uri: 'oresmd://ir/USD?type=series&instrument=zero&quote=rate'}
  );
}
// The history of a binding is its saved versions, newest last in the store. Start
// and stop are not versions, so they are not here: the history shows saved
// versions only. Every version says who modified it, why and what it changed.
const history = {};
const removedLog = [];
const fieldsOf = b => ({'Source name': b.src, 'Enabled': b.enabled ? 'true' : 'false', 'Kind': b.kind});
function pushVersion(b, by, reason, commentary, action) {
  const list = history[b.id] = history[b.id] || [];
  list.push({v: list.length + 1, at: list.length ? NOW_LABEL : '2026-10-06 09:02', by, reason, commentary, action, fields: fieldsOf(b)});
}
bindings.forEach(b => {
  const final = {...b};
  const steps = [{en: true, by: 'tenant provisioning', reason: 'New market data source', note: 'Created with the tenant', action: 'created'}];
  if (b.ver >= 2) steps.push({en: false, by: 'market data operator', reason: 'Amend', note: 'Paused while the source was checked', action: 'disabled'});
  if (b.ver >= 3) steps.push({en: true, by: 'market data operator', reason: 'Amend', note: 'Source checked, ticks resume', action: 'enabled'});
  steps.slice(0, b.ver).forEach((x, i) => {
    const snap = {...final, enabled: x.en};
    const list = history[b.id] = history[b.id] || [];
    list.push({v: i + 1, at: ['2026-10-06 09:02', '2026-10-12 17:40', '2026-10-13 08:15'][i], by: x.by, reason: x.reason, commentary: x.note, action: x.action, fields: fieldsOf(snap)});
  });
});
let tab = 'details', view = 'bindings', toVer = null, onlyChanges = true;
let sel = (scenario === 'real' ? 'vendor.example.eurusd' : 'synthetic.bloomberg.audusd');
let toast = '';

const esc = t => t.replace(/&/g, '&amp;');
const isVendor = b => b.kind === 'VENDOR';
const seriesOf = b => isVendor(b) ? {series: b.series, uri: b.uri} : (sourceOf(b.src) || {series: 'not known', uri: ''});
const quiet = b => b.enabled && !isVendor(b) && (b.last === null || b.last > 600);
const tag = (t, k) => `<span class="tag ${k || ''}">${t}</span>`;
const ageLabel = a => a === null ? '—' : a < 90 ? a + ' s ago' : a < 5400 ? Math.round(a / 60) + ' min ago' : a < 172800 ? Math.round(a / 3600) + ' h ago' : Math.round(a / 86400) + ' d ago';
const kindTag = b => isVendor(b) ? tag('Vendor', 'warn') : tag('Synthetic', 'ok');
const enabledTag = b => b.enabled ? tag('yes', 'ok') : tag('no', 'warn');
const runTag = b => isVendor(b) ? tag('not supported', 'warn') : quiet(b) ? tag('quiet', 'bad') : b.running ? tag('running', 'ok') : tag('stopped', 'bad');
const seriesCell = b => { const s = seriesOf(b); return `<span class="series"><a href="#" onclick="return false" title="Opens the series page">${s.series}</a><span class="uri mono">${esc(s.uri)}</span></span>`; };
const heldBy = (series, except) => bindings.find(b => b.src !== except && !isVendor(b) && b.running && seriesOf(b).series === series);
let nextId = 100;
const cur = () => bindings.find(b => b.src === sel) || bindings[0];

function btn(label, act, extra, cls) {
  const ok = may(act);
  const why = ok ? '' : ` title="${actor === 'viewer' ? 'A viewer reads only' : 'Not offered to this actor: ' + PERMS[act]}"`;
  return `<button class="btn ${cls || ''}" ${ok && !(extra && extra.off) ? '' : 'disabled'}${why} data-act="${act}" data-src="${extra && extra.src || ''}">${label}</button>`;
}
function actionsFor(b) {
  if (isVendor(b)) {
    return btn(b.enabled ? 'Disable' : 'Enable', 'toggle', {src: b.src}) + btn('Remove', 'remove', {src: b.src}) +
      `<button class="btn" disabled title="Real feeds are not supported">Rebind</button><button class="btn" disabled title="Real feeds are not supported">Start</button>`;
  }
  return btn('Rebind', 'rebind', {src: b.src}) + btn(b.enabled ? 'Disable' : 'Enable', 'toggle', {src: b.src}) +
    btn(b.running ? 'Stop' : 'Start', 'run', {src: b.src, off: !b.enabled}) + btn('Remove', 'remove', {src: b.src});
}

function header() {
  const en = bindings.filter(b => b.enabled).length, run = bindings.filter(b => b.running && !quiet(b)).length, q = bindings.filter(quiet).length;
  return `
  <div class="top">
    <h1>ORE Studio — Market data / Bindings</h1>
    ${q ? tag(q + ' quiet', 'bad') : tag('all ticking', 'ok')}
    <span style="margin-left:auto" class="faint">Acting as ${actor === 'admin' ? 'system administrator' : actor === 'viewer' ? 'a viewer' : 'market data operator'}</span>
    ${btn('Bind a source', 'bind', null, 'primary')}
  </div>
  <div class="tabs"><button data-view="bindings" class="${view === 'bindings' ? 'on' : ''}">Bindings</button><button data-view="history" class="${view === 'history' ? 'on' : ''}">History</button></div>
  <div class="panel">
    <h2>Summary</h2>
    <div class="row">
      <div class="field"><label>Bindings</label><div class="value">${bindings.length}</div></div>
      <div class="field"><label>Enabled</label><div class="value">${en}</div></div>
      <div class="field"><label>Running</label><div class="value">${run}</div></div>
      <div class="field"><label>Quiet</label><div class="value">${q}</div></div>
      <span class="muted">A binding says that this party consumes one producer source. It does not name a series: the series is read from what the source has written.</span>
    </div>
  </div>`;
}

function rowHtml(b) {
  return `<tr class="pick ${b.src === sel ? 'sel' : ''} ${isVendor(b) ? 'vendor-row' : ''}" data-pick="${b.src}">
    <td class="mono">${b.src}</td><td>${kindTag(b)}</td><td>${seriesCell(b)}</td><td>${enabledTag(b)}</td><td>${runTag(b)}</td>
    <td class="mono">${isVendor(b) ? '—' : ageLabel(b.last)}</td></tr>`;
}
function table() {
  return `<div class="panel"><h2>Bindings</h2>
    <table><thead><tr><th>Source</th><th>Kind</th><th>Feeds series (inferred)</th><th>Enabled</th><th>Running</th><th>Last tick</th></tr></thead>
    <tbody>${bindings.map(rowHtml).join('')}</tbody></table>
    <div class="notice">The series column is inferred from the newest observations, and the last tick is a mock reading of the ingest loop's counter: no read returns either today. A quiet binding stays in the list. The threshold for quiet is provisional.</div>
  </div>`;
}
function bySeries() {
  const groups = {};
  bindings.forEach(b => (groups[seriesOf(b).series] = groups[seriesOf(b).series] || []).push(b));
  return Object.entries(groups).map(([s, bs]) => `<div class="panel"><h2>${s} · ${bs.length} binding${bs.length > 1 ? 's' : ''}</h2>
    <table><tbody>${bs.map(b => `<tr class="pick ${b.src === sel ? 'sel' : ''} ${isVendor(b) ? 'vendor-row' : ''}" data-pick="${b.src}"><td class="mono">${b.src}</td><td>${kindTag(b)}</td><td>${enabledTag(b)}</td><td>${runTag(b)}</td><td class="mono">${isVendor(b) ? '—' : ageLabel(b.last)}</td></tr>`).join('')}</tbody></table>
    ${bs.filter(b => !isVendor(b) && b.running).length > 1 ? '<div class="badbox">Two running synthetic feeds write this series. The server allows one.</div>' : ''}
  </div>`).join('') + `<div class="notice">Seen from the series, a conflict between two feeds is visible at once. The cost is that a binding's own state sits one level down.</div>`;
}
function detail(b) {
  if (!b) return '<div class="panel"><div class="notice">No binding selected.</div></div>';
  return `<div class="panel"><div class="tabs"><button data-tab="details" class="${tab === 'details' ? 'on' : ''}">Details</button><button data-tab="history" class="${tab === 'history' ? 'on' : ''}">History</button></div>${tab === 'history' ? historyPanel(b) : detailBody(b)}</div>`;
}
function detailBody(b) {
  const s = seriesOf(b), src = sourceOf(b.src);
  const producer = isVendor(b)
    ? `<div class="warnbox"><b>Real feeds are not supported.</b> This installation does not connect a vendor feed, so there is no producer behind this source, and the binding can only be read, enabled or disabled, or removed. It is shown so a binding a vendor feed once created is not hidden.</div>`
    : `<table><tbody>
        <tr><td>Producer</td><td>${src ? src.kind : 'not known'} generation config</td><td>Binding mode</td><td>bound</td></tr>
        <tr><td>Folder</td><td class="mono">${src ? src.folder : '—'}</td><td>Ticks per hour</td><td class="num">${src ? src.tph : '—'}</td></tr>
        <tr><td>Running</td><td>${runTag(b)}</td><td>Last tick</td><td class="mono">${ageLabel(b.last)}</td></tr>
      </tbody></table>${quiet(b) ? `<div class="badbox">${b.running ? 'The feed is running and no tick arrives.' : 'The feed is not running. Start it to bring the ticks back.'}</div>` : (!b.enabled ? '<div class="warnbox">Disabled: ingestion is suspended. The producer may still run.</div>' : '')}`;
  return `<h2>Selected binding · ${b.src}</h2>
    <table><tbody>
      <tr><td>Kind</td><td>${kindTag(b)}</td><td>Enabled</td><td>${enabledTag(b)}</td></tr>
      <tr><td>Version</td><td class="mono">${b.ver}</td><td>Last changed by</td><td>${b.by}</td></tr>
      <tr><td>Feeds series</td><td colspan="3">${seriesCell(b)}</td></tr>
    </tbody></table>
    ${producer}
    <div class="row">${actionsFor(b)}</div>`;
}
function historyPanel(b) {
  const vers = (history[b.id] || []).slice().reverse();
  const to = vers.find(x => x.v === toVer) || vers[0];
  const from = vers.find(x => x.v === to.v - 1);
  const names = Object.keys(to.fields).filter(n => !onlyChanges || !from || from.fields[n] !== to.fields[n]);
  const items = vers.map(x => `<li class="${x.v === to.v ? 'on' : ''}" data-ver="${x.v}">
      <span><b>v${x.v}</b> ${x.v === vers[0].v ? tag('current', 'ok') : ''} <span class="mono faint" style="float:right">${x.at}</span></span>
      <span class="muted">Modified by ${x.by}</span><span>${x.reason}${x.commentary ? ' · ' + x.commentary : ''}</span>
      ${x.v !== vers[0].v ? `<span><button class="btn" data-revert="${x.v}" ${may('toggle') && !isVendor(b) || may('toggle') && isVendor(b) ? '' : 'disabled'}>Revert to v${x.v}</button></span>` : ''}</li>`).join('');
  return `<h2>History · ${b.src}</h2><div class="muted">Every saved version of this binding, newest first.</div>
    <div class="hist"><ol aria-label="Timeline">${items}</ol>
    <div class="cmp"><h2>${from ? `Comparing v${from.v} with v${to.v}` : 'Initial version'}</h2>
      <div class="row"><button class="btn ${onlyChanges ? '' : 'primary'}" data-only="0">All fields</button><button class="btn ${onlyChanges ? 'primary' : ''}" data-only="1">Only changes</button></div>
      ${names.length ? `<table><thead><tr><th>Field</th><th>${from ? 'Before' : 'Value'}</th>${from ? '<th>After</th>' : ''}</tr></thead><tbody>${names.map(n => from ? `<tr><td>${n}</td><td class="${from.fields[n] !== to.fields[n] ? 'before' : ''} mono">${from.fields[n]}</td><td class="${from.fields[n] !== to.fields[n] ? 'after' : ''} mono">${to.fields[n]}</td></tr>` : `<tr><td>${n}</td><td class="mono">${to.fields[n]}</td></tr>`).join('')}</tbody></table>` : '<div class="notice">No field changes between these versions.</div>'}
      <div class="notice">The server has no draft version, so the history shows saved versions only. Start and stop are not saved versions, so they do not appear here.</div></div></div>`;
}
function logPanel() {
  const rows = [];
  bindings.forEach(b => (history[b.id] || []).forEach(x => rows.push({at: x.at, src: b.src, by: x.by, action: x.action, reason: x.reason, note: x.commentary, v: 'v' + x.v})));
  removedLog.forEach(r => rows.push(r));
  rows.sort((p, q) => q.at.localeCompare(p.at));
  const people = [...new Set(rows.map(r => r.by))];
  return `<div class="panel"><h2>History of all bindings</h2>
    <div class="muted">Who did what to which binding, newest first. ${people.length} people and services appear: ${people.join(', ')}.</div>
    <table><thead><tr><th>When</th><th>Binding</th><th>Version</th><th>Who</th><th>What</th><th>Reason</th></tr></thead><tbody>
    ${rows.map(r => `<tr><td class="mono">${r.at}</td><td class="mono">${r.src}</td><td class="mono">${r.v || '—'}</td><td>${r.by}</td><td>${r.action}${r.note ? ' · <span class="muted">' + r.note + '</span>' : ''}</td><td>${r.reason}</td></tr>`).join('')}
    </tbody></table>
    <div class="notice">A removed binding stays in this list as a deletion. A binding's own History tab shows what changed in each of its versions.</div></div>`;
}
function split() {
  return `<div class="grid2"><div class="panel"><h2>Bindings (${bindings.length})</h2><ul>${bindings.map(b => `<li class="pick" data-pick="${b.src}" style="padding:6px 0;border-bottom:1px solid var(--line-soft);${b.src === sel ? 'border-left:3px solid var(--accent);padding-left:8px' : ''}"><span class="mono">${b.src}</span> ${kindTag(b)} ${runTag(b)}<span class="mono faint" style="float:right">${isVendor(b) ? '—' : ageLabel(b.last)}</span></li>`).join('')}</ul>
    <div class="notice">A compact list keeps every binding in view while one is open, at the cost of the series and the kind columns.</div></div>
    ${detail(cur())}</div>`;
}

function dialog(html) { document.getElementById('layer').innerHTML = `<div class="dlg-bg" id="bg"><div class="dlg">${html}</div></div>`; document.getElementById('bg').onclick = e => { if (e.target.id === 'bg') closeDlg(); }; }
function closeDlg() { document.getElementById('layer').innerHTML = ''; }
const reasonSelect = () => `<div class="field"><label>Change reason</label><select id="reason">${REASONS.map(r => `<option>${r}</option>`).join('')}</select></div>`;

function bindDialog() {
  const free = SOURCES.filter(s => !bindings.some(b => b.src === s.src));
  const vendorNote = scenario === 'real' ? `<div class="warnbox"><b>Vendor sources are not offered.</b> This product does not connect real feeds, so only synthetic sources can be bound.</div>` : '';
  dialog(`<h2>Bind a source</h2>
    <div class="field"><label>Synthetic source</label><select id="src">${free.map(s => `<option value="${s.src}">${s.src}</option>`).join('')}</select></div>
    <div id="check"></div>${vendorNote}${reasonSelect()}
    <div class="row" style="justify-content:flex-end"><button class="btn" id="cancel">Cancel</button><button class="btn primary" id="go">Bind</button></div>`);
  const sel2 = document.getElementById('src'), check = document.getElementById('check'), go = document.getElementById('go');
  const refresh = () => {
    const s = sourceOf(sel2.value), h = heldBy(s.series, null);
    check.innerHTML = `<table><tbody><tr><td>Would write</td><td>${s.series}</td></tr><tr><td>Producer</td><td>${s.kind}, ${s.tph} ticks an hour, ${s.folder}</td></tr></tbody></table>` +
      (h ? `<div class="badbox">${h.src} is already running and writes ${s.series}. Only one running feed may write a series, so this source cannot be bound while it runs. Stop it first.</div>` : `<div class="okbox">No other running feed writes ${s.series}.</div>`);
    go.disabled = !!h;
  };
  sel2.onchange = refresh; refresh();
  document.getElementById('cancel').onclick = closeDlg;
  go.onclick = () => { const nb = {id: 'n' + (nextId++), src: sel2.value, kind: 'SYNTHETIC', enabled: true, running: true, last: 0, ver: 1, by: actorName}; bindings.push(nb); pushVersion(nb, actorName, document.getElementById('reason').value, 'Bound from the screen', 'created'); sel = sel2.value; toast = 'Bound ' + sel2.value + '. It is enabled and running.'; closeDlg(); render(); };
}
function rebindDialog(b) {
  const old = sourceOf(b.src);
  const opts = SOURCES.filter(s => s.src !== b.src && !bindings.some(x => x.src === s.src));
  dialog(`<h2>Rebind ${b.src}</h2>
    <div class="field"><label>New synthetic source</label><select id="src">${opts.map(s => `<option value="${s.src}">${s.src}</option>`).join('')}</select></div>
    <div id="check"></div>${reasonSelect()}
    <div class="row" style="justify-content:flex-end"><button class="btn" id="cancel">Cancel</button><button class="btn primary" id="go">Rebind</button></div>`);
  const sel2 = document.getElementById('src'), check = document.getElementById('check'), go = document.getElementById('go');
  const refresh = () => {
    const s = sourceOf(sel2.value), h = heldBy(s.series, b.src);
    check.innerHTML = `<table><tbody><tr><td>Now writes</td><td>${old ? old.series : '—'}</td></tr><tr><td>Would write</td><td>${s.series}</td></tr></tbody></table>` +
      (old && old.series !== s.series ? `<div class="warnbox">The series changes. This party's ${old.series} stops receiving ticks and ${s.series} starts to.</div>` : '<div class="okbox">The same series: ticks continue without a gap.</div>') +
      (h ? `<div class="badbox">${h.src} already writes ${s.series}.</div>` : '');
    go.disabled = !!h;
  };
  if (!opts.length) { check.innerHTML = '<div class="notice">No other synthetic source is free to bind.</div>'; go.disabled = true; } else { sel2.onchange = refresh; refresh(); }
  document.getElementById('cancel').onclick = closeDlg;
  go.onclick = () => { const s = sel2.value; const i = bindings.findIndex(x => x.src === b.src); bindings[i] = {...b, src: s, ver: b.ver + 1, by: actorName, last: 0}; pushVersion(bindings[i], actorName, document.getElementById('reason').value, 'Rebound from ' + b.src, 'rebound'); sel = s; toast = 'Rebound to ' + s + '. No producer was restarted.'; closeDlg(); render(); };
}
function removeDialog(b) {
  dialog(`<h2>Remove ${b.src}</h2>
    <div class="warnbox">Ingestion for this party stops. The series and its observations stay.${isVendor(b) ? '' : ' The producer is not stopped.'}</div>${reasonSelect()}
    <div class="row" style="justify-content:flex-end"><button class="btn" id="cancel">Cancel</button><button class="btn primary" id="go">Remove</button></div>`);
  document.getElementById('cancel').onclick = closeDlg;
  document.getElementById('go').onclick = () => { removedLog.push({at: NOW_LABEL, src: b.src, by: actorName, action: 'removed', reason: document.getElementById('reason').value, note: 'The series and its observations stay', v: ''}); bindings = bindings.filter(x => x.src !== b.src); sel = (bindings[0] || {}).src; toast = 'Removed ' + b.src + '.'; closeDlg(); render(); };
}
function revertTo(v) {
  const b = cur(), old = (history[b.id] || []).find(x => x.v === v);
  if (!b || !old) return;
  b.enabled = old.fields['Enabled'] === 'true'; if (!b.enabled) b.running = false; b.ver++; b.by = actorName;
  pushVersion(b, actorName, 'Correct a mistake', 'Reverted to v' + v, 'reverted'); toVer = null; toast = 'Reverted ' + b.src + ' to v' + v + '. A new version was saved.'; render();
}
function act(kind, src) {
  const b = bindings.find(x => x.src === src);
  if (kind === 'bind') return bindDialog();
  if (kind === 'rebind') return rebindDialog(b);
  if (kind === 'remove') return removeDialog(b);
  if (kind === 'toggle') { b.enabled = !b.enabled; if (!b.enabled) b.running = b.running && false; else if (!isVendor(b)) { b.running = true; b.last = 0; } b.ver++; b.by = actorName; pushVersion(b, actorName, 'Amend', '', b.enabled ? 'enabled' : 'disabled'); toast = (b.enabled ? 'Enabled ' : 'Disabled ') + b.src + '.'; return render(); }
  if (kind === 'run') { b.running = !b.running; if (b.running) b.last = 0; toast = (b.running ? 'Started the feed behind ' : 'Stopped the feed behind ') + b.src + '.'; return render(); }
}

function render() {
  const body = view === 'history' ? logPanel() : variant === 'b' ? bySeries() + detail(cur()) : variant === 'c' ? split() : table() + detail(cur());
  document.getElementById('app').innerHTML = header() + body + (toast ? `<div class="toast">${toast}</div>` : '');
  toast = '';
  document.getElementById('note').textContent = `Prototype · market data bindings · variant ${variant.toUpperCase()} · ${scenario} data · acting as ${actor} · mock list, acts change it in memory`;
  const opt = (key, vals, cur0) => vals.map(v => `<button data-k="${key}" data-v="${v}" class="${v === cur0 ? 'on' : ''}">${v}</button>`).join('');
  document.getElementById('bar').innerHTML = `<span class="label">Variant</span>${opt('variant', ['a', 'b', 'c'], variant)}<span class="sep">|</span><span class="label">Data</span>${opt('scenario', ['synthetic', 'real'], scenario)}<span class="sep">|</span><span class="label">State</span>${opt('state', ['all', 'quiet', 'disabled'], state)}<span class="sep">|</span><span class="label">Actor</span>${opt('actor', ['viewer', 'operator', 'admin'], actor)}`;
  document.querySelectorAll('#bar [data-k]').forEach(x => x.onclick = () => setParam(x.dataset.k, x.dataset.v));
  document.querySelectorAll('#app [data-pick]').forEach(x => x.onclick = () => { sel = x.dataset.pick; render(); });
  document.querySelectorAll('#app [data-view]').forEach(x => x.onclick = () => { view = x.dataset.view; render(); });
  document.querySelectorAll('#app [data-tab]').forEach(x => x.onclick = () => { tab = x.dataset.tab; toVer = null; render(); });
  document.querySelectorAll('#app [data-ver]').forEach(x => x.onclick = () => { toVer = Number(x.dataset.ver); render(); });
  document.querySelectorAll('#app [data-only]').forEach(x => x.onclick = () => { onlyChanges = x.dataset.only === '1'; render(); });
  document.querySelectorAll('#app [data-revert]').forEach(x => x.onclick = e => { e.stopPropagation(); revertTo(Number(x.dataset.revert)); });
  document.querySelectorAll('#app [data-act]').forEach(x => x.onclick = e => { e.stopPropagation(); act(x.dataset.act, x.dataset.src); });
}
function setParam(k, v) { const p = new URLSearchParams(location.search); p.set(k, v); location.search = p.toString(); }
render();
</script>
</body>
</html>
