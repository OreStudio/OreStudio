<body>

<tr><th style="text-align:left;padding:.45rem .9rem;font-weight:600;white-space:nowrap;background:var(--bg-accent,#26262b);border-right:1px solid var(--border-color,#30363d);width:1%">Prototype</th><td style="padding:.45rem .9rem"><a href="index.html" style="color:var(--accent,#58a6ff)">this prototype</a></td></tr>

<!--
  PROTOTYPE. Throwaway. Mock data, no backend, no build step, no session.

  The trader's or quant's "Inspect a surface's slices" screen
  (doc/knowledge/journeys/market_data/journey_inspect-a-surfaces-slices.org):
  the surface and its tenor picker at the top, the smiles and the mesh in the
  middle, and the calendar and butterfly arbitrage checks at the foot, so the
  person reads the slices, then the whole surface, then its faults. Nothing
  here is published.

  Variants with ?variant=a|b|c. The variant is the view, which is the journey's
  central design question: a is a slice at one tenor, b is the mesh or grid,
  c is the arbitrage report. ?state=clean|butterfly switches the mock market;
  the butterfly state carries a violation in the 5Y smile.
  ?tenor=1Y|2Y|5Y|10Y picks the slice. Nothing reads a service.
-->

<div class="proto-note" id="note"></div>
<div class="wrap" id="app"></div>
<div class="proto-bar" id="bar"></div>

<script>
const params = new URLSearchParams(location.search);
const variant = params.get('variant') || 'a';
const state = params.get('state') || 'clean';
const tenor = params.get('tenor') || '5Y';

const deltas = [
  {k:'10P', label:'10d put', strike:2.40, jitter:0.12},
  {k:'25P', label:'25d put', strike:2.85, jitter:-0.09},
  {k:'ATM', label:'ATM', strike:3.25, jitter:0.04},
  {k:'25C', label:'25d call', strike:3.70, jitter:0.11},
  {k:'10C', label:'10d call', strike:4.15, jitter:-0.07}
];
const strikes = deltas.map(d => d.strike);

const surface = [
  {exp:'6M',  T:0.5, vols:[15.8,14.4,13.2,13.9,15.4]},
  {exp:'1Y',  T:1.0, vols:[16.4,15.1,13.9,14.6,16.1]},
  {exp:'2Y',  T:2.0, vols:[17.1,15.6,14.2,15.0,16.8]},
  {exp:'5Y',  T:5.0, vols:[18.9,17.0,15.4,16.3,18.4]},
  {exp:'10Y', T:10.0, vols:[20.2,18.1,16.2,17.3,19.6]},
  {exp:'30Y', T:30.0, vols:[21.0,18.6,16.4,17.6,20.1]}
];
if (state === 'butterfly') surface[3].vols = [18.9, 16.1, 15.4, 16.3, 19.9];

const density = (state === 'butterfly' ? {'6M':0.0021,'1Y':0.0018,'2Y':0.0015,'5Y':-0.0017,'10Y':0.0008,'30Y':0.0005}
                                      : {'6M':0.0021,'1Y':0.0018,'2Y':0.0015,'5Y':0.0011,'10Y':0.0008,'30Y':0.0005});

const mesh = surface.map(s => {
  const n = s.vols.length;
  const vols = strikes.map((_, j) => {
    const p = j * (n - 1) / (strikes.length - 1);
    const i0 = Math.floor(p), i1 = Math.min(n - 1, i0 + 1), f = p - i0;
    return s.vols[i0] * (1 - f) + s.vols[i1] * f;
  });
  return {exp:s.exp, T:s.T, vols};
});
const tvAll = mesh.flatMap(r => r.vols.map(v => (v / 100) ** 2 * r.T));
const tvMin = Math.min(...tvAll), tvMax = Math.max(...tvAll);

function urlButton(url){
  return `<button class="urlbtn" type="button" data-url="${url}" title="Edit in the oresmd URL editor">`+
         `<span class="mono">${url}</span><span class="edit">edit</span></button>`;
}
function openOresmdEditor(url, host){
  const ov=document.createElement('div'); ov.className='oresmd-overlay';
  const f=document.createElement('iframe'); f.className='oresmd-frame'; f.title='oresmd URL editor';
  f.src='../oresmd-url-editor/index.html?embed=1&url='+encodeURIComponent(url||'');
  ov.appendChild(f); document.body.appendChild(ov);
  function close(){ window.removeEventListener('message', onMsg); document.removeEventListener('keydown', onKey); ov.remove(); }
  function onMsg(e){ if(e.data && e.data.type==='oresmd-url'){ host.dataset.url=e.data.url; const m=host.querySelector('.mono'); if(m) m.textContent=e.data.url; close(); } }
  function onKey(e){ if(e.key==='Escape') close(); }
  window.addEventListener('message', onMsg); document.addEventListener('keydown', onKey);
  ov.addEventListener('click', e=>{ if(e.target===ov) close(); });
}
document.addEventListener('click', e=>{
  const b=e.target.closest('.urlbtn'); if(!b) return;
  openOresmdEditor(b.dataset.url||'', b);
});
function tag(t, k){ return `<span class="tag ${k || ''}">${t}</span>`; }
function slice(exp){ return surface.find(s => s.exp === exp) || surface[3]; }
function quad(s, i){ return s.vols[i - 1] - 2 * s.vols[i] + s.vols[i + 1]; }

function header(){
  return `
  <div class="top">
    <h1>Surface slices: USD swaption vol (candidate)</h1>
    <span class="muted">candidate · not published</span>
    <a style="margin-left:auto" href="../../../knowledge/journeys/market_data/journey_inspect-a-surfaces-slices.html">the journey &rarr;</a>
  </div>
  <div class="panel">
    <h2>Surface and tenor picker</h2>
    <div class="row">
      <div class="field"><label>Surface</label><div class="value mono">${urlButton('oresmd://vol/USD?type=surface&amp;instrument=swaption')}</div></div>
      <div class="field"><label>Derivation</label><div class="value">volatility · SABR</div></div>
      <div class="field"><label>As of</label><div class="value">now · 2026-10-06 14:00 <span class="faint">(no past read)</span></div></div>
      <div class="field"><label>Quotes held</label><div class="value">42</div></div>
      <button class="btn primary" data-act="read">Read surface</button>
    </div>
    <div class="row"><span class="muted">Tenors shown</span>
      ${surface.map(s => `<button class="btn" data-t="${s.exp}"${s.exp === tenor ? ' style="border-color:var(--accent);color:var(--accent)"' : ''}>${s.exp}</button>`).join('')}
      <button class="btn" data-act="smiles">Read smiles</button>
    </div>
    <div class="notice">There is no surface read and no slice read. <span class="mono">marketdata.v1.surface.get</span> and <span class="mono">.surface-slice.get</span> are candidate subjects, so every value below is a mock of what those subjects would return.</div>
  </div>`;
}

function smileChart(){
  const s = slice(tenor), w = 960, h = 300, pad = 46;
  const lo = Math.min(...s.vols) - 0.6, hi = Math.max(...s.vols) + 0.6;
  const x = i => pad + i * (w - 2 * pad) / (s.vols.length - 1);
  const y = v => h - pad - (v - lo) * (h - 2 * pad) / (hi - lo);
  const d = s.vols.map((v, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
  const marks = s.vols.map((v, i) => `<circle cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="4" fill="#58a6ff"></circle>
    <circle cx="${x(i).toFixed(1)}" cy="${y(v + deltas[i].jitter).toFixed(1)}" r="3.5" fill="#d29922"></circle>
    <text x="${x(i).toFixed(1)}" y="${h - 26}" fill="#71717a" font-size="10" text-anchor="middle">${deltas[i].k}</text>
    <text x="${x(i).toFixed(1)}" y="${h - 12}" fill="#71717a" font-size="10" text-anchor="middle">${deltas[i].strike.toFixed(2)}%</text>`).join('');
  const bad = state === 'butterfly' && tenor === '5Y';
  return `
  <div class="panel">
    <h2>Smile at ${tenor}${bad ? ' — butterfly violation' : ''}</h2>
    <svg viewBox="0 0 ${w} ${h}" width="100%" height="300" role="img" aria-label="Fitted smile at one tenor with quotes">
      <path d="${d}" fill="none" stroke="#58a6ff" stroke-width="2"></path>${marks}
    </svg>
    <div class="row"><span class="muted">line: fitted smile</span><span class="muted">dot: raw quote</span>
      ${bad ? tag('density negative at 5Y', 'bad') : tag('density non-negative', 'ok')}</div>
  </div>`;
}

function smilesTable(){
  const rows = surface.map(s => {
    const b = deltas.map((_, i) => `<td class="num"${Math.abs(quad(s, i)) > 1.6 && i === 1 && s.exp === '5Y' && state === 'butterfly' ? ' style="color:var(--bad)"' : ''}>${s.vols[i].toFixed(2)}</td>`).join('');
    const flag = state === 'butterfly' && s.exp === '5Y' ? tag('butterfly', 'bad') : tag('ok', 'ok');
    return `<tr><td class="mono">${s.exp}</td>${b}<td>${flag}</td></tr>`;
  }).join('');
  return `
  <div class="panel">
    <h2>Smiles across tenors</h2>
    <table>
      <thead><tr><th>Tenor</th><th class="num">10d put</th><th class="num">25d put</th><th class="num">ATM</th><th class="num">25d call</th><th class="num">10d call</th><th>Butterfly</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
  </div>`;
}

function termStructures(){
  const Ts = surface.map(s => s.T);
  const x = Ts.map(T => (Math.log(T) - Math.log(Ts[0])) / (Math.log(Ts[Ts.length - 1]) - Math.log(Ts[0])));
  const ticks = surface.map((s, i) => ({at:x[i], label:s.exp}));
  const atm = surface.map(s => s.vols[2]);
  const rr = surface.map(s => s.vols[3] - s.vols[1]);
  const fly = surface.map(s => (s.vols[3] + s.vols[1]) / 2 - s.vols[2]);
  return `
  <div class="panel">
    <h2>Component term structures — the ATM, RR and FLY the surface is built from</h2>
    <div class="grid2">
      ${PC.line({series:[{name:'ATM vol', color:'#58a6ff', points:atm, markers:true}], x, ticks,
        yFmt:v => v.toFixed(1), yLabel:'vol %', h:260,
        caption:'ATM is a level over expiry: the number the surface is anchored on.'})}
      ${PC.line({series:[
          {name:'25d RR', color:'#d29922', points:rr, markers:true},
          {name:'25d FLY', color:'#3fb950', points:fly, markers:true}], x, ticks,
        yFmt:v => v.toFixed(2), yLabel:'vol points', h:260,
        caption:'RR and FLY are shape over the same expiries. A desk watches the three separately.'})}
    </div>
    <div class="notice">A surface is three term structures before it is a grid. The expiry axis is log-spaced, so the short end reads at its own scale.</div>
  </div>`;
}
function meshPanel(){
  return `
  <div class="panel">
    <h2>Surface — expiry by strike (vol points)</h2>
    ${PC.heat({rows: surface.map(s => ({label:s.exp})), cols: strikes.map(k => ({label:k.toFixed(2) + '%'})),
      value:(i, j) => surface[i].vols[j], dp:1, xLabel:'strike (absolute level)', yLabel:'expiry',
      caption:'Mock of marketdata.v1.surface-mesh.get. Total variance must rise along expiry; the arbitrage view checks it.'})}
  </div>
  <div class="panel">
    <h2>Surface mesh — expiry, strike and vol</h2>
    ${PC.mesh({rows: surface.map(s => ({label:s.exp})), cols: strikes.map(k => ({label:k.toFixed(2) + '%'})),
      z: surface.map(s => s.vols), zLabel:'vol %', dp:1, h:400,
      caption:'The same mesh as a wireframe: the smile across strikes, the level across expiries.'})}
  </div>`;
}

function arbitragePanel(){
  const pairs = [['6M','1Y'],['1Y','2Y'],['2Y','5Y'],['5Y','10Y'],['10Y','30Y']];
  const cal = pairs.map(([a, b]) => {
    const ra = mesh.find(r => r.exp === a), rb = mesh.find(r => r.exp === b);
    const i = 2;
    const tva = (ra.vols[i] / 100) ** 2 * ra.T, tvb = (rb.vols[i] / 100) ** 2 * rb.T;
    const ok = tvb > tva;
    return `<tr><td class="mono">${a} → ${b}</td><td class="num">${strikes[i].toFixed(2)}%</td>
      <td class="num">${tva.toFixed(5)}</td><td class="num">${tvb.toFixed(5)}</td><td>${ok ? tag('ok', 'ok') : tag('falls', 'bad')}</td></tr>`;
  }).join('');
  const fly = surface.map(s => {
    const d0 = density[s.exp];
    return `<tr><td class="mono">${s.exp}</td><td class="num">${d0.toFixed(4)}</td>
      <td>${d0 < 0 ? tag('negative density', 'bad') : tag('non-negative', 'ok')}</td></tr>`;
  }).join('');
  return `
  <div class="panel">
    <h2>Arbitrage checks</h2>
    <div class="grid2">
      <div>
        <h2>Calendar</h2>
        <table><thead><tr><th>Expiry pair</th><th class="num">Strike</th><th class="num">Total variance A</th><th class="num">Total variance B</th><th>Flag</th></tr></thead><tbody>${cal}</tbody></table>
      </div>
      <div>
        <h2>Butterfly</h2>
        <table><thead><tr><th>Tenor</th><th class="num">Implied density</th><th>Flag</th></tr></thead><tbody>${fly}</tbody></table>
      </div>
    </div>
    <div class="notice"><span class="mono">marketdata.v1.surface.arbitrage</span> does not exist. No operation returns a total variance along an expiry axis or a density along a smile, and the client has no fitted surface to check, so both tables are mocks and the screen would name the checks it needs.</div>
  </div>`;
}

// Prototype plotting helper. Throwaway, dependency-free, dark-theme SVG.
// Each function returns an HTML string, so a page calls host.innerHTML = PC.line({...}).
// Prefixed PC to stay clear of page-local names; the pages also define `tag`.
const PC = (() => {
  const C = {grid:'#21262d', axis:'#30363d', text:'#71717a', dim:'#a1a1aa',
             ink:'#e3e3e6', accent:'#58a6ff', ok:'#3fb950', warn:'#d29922', bad:'#f85149'};
  const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const fmt = (v, d) => v == null ? '—' : (typeof v === 'number' ? v.toFixed(d ?? 2) : String(v));
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  // A blue -> amber ramp for a heat cell, t in 0..1.
  function heatColour(t){
    const stops = [[13,23,38],[21,60,110],[32,110,170],[88,166,255],[210,153,34],[248,81,73]];
    const p = clamp(t, 0, 1) * (stops.length - 1), i = Math.floor(p), f = p - i;
    const a = stops[i], b = stops[Math.min(stops.length - 1, i + 1)];
    return `rgb(${a.map((x, k) => Math.round(x + (b[k] - x) * f)).join(',')})`;
  }

  // Shared frame: margins, y gridlines and labels for a value axis.
  function frame(o){
    const w = o.w || 940, h = o.h || 300;
    const pad = Object.assign({l:64, r:18, t:16, b:40}, o.pad || {});
    const x0 = pad.l, x1 = w - pad.r, y0 = h - pad.b, y1 = pad.t;
    const vals = (o.series || []).flatMap(s => s.points || []).filter(v => v != null)
      .concat(o.extra || []);
    let lo = Math.min(...vals), hi = Math.max(...vals);
    if (o.zero) { lo = Math.min(lo, 0); hi = Math.max(hi, 0); }
    if (!(hi > lo)) { hi = lo + 1; }
    const span = hi - lo, l2 = lo - span * 0.08, h2 = hi + span * 0.08;
    const y = v => y0 - (v - l2) * (y0 - y1) / (h2 - l2);
    const X = o.x ? (i => x0 + o.x[i] * (x1 - x0))
                  : (i => x0 + i * (x1 - x0) / Math.max(1, (o.ticks ? o.ticks.length : 1) - 1));
    const yTicks = [];
    const steps = o.ySteps || 4;
    for (let k = 0; k <= steps; k++) {
      const v = l2 + (h2 - l2) * k / steps;
      yTicks.push(`<line x1="${x0}" y1="${y(v).toFixed(1)}" x2="${x1}" y2="${y(v).toFixed(1)}" stroke="${C.grid}"/>
        <text x="${x0 - 8}" y="${(y(v) + 3.5).toFixed(1)}" fill="${C.text}" font-size="10" text-anchor="end">${esc((o.yFmt || (v => fmt(v)))(v))}</text>`);
    }
    const xTicks = (o.ticks || []).map(t => {
      const px = o.x ? x0 + t.at * (x1 - x0) : X(t.at);
      return `<text x="${px.toFixed(1)}" y="${h - pad.b + 15}" fill="${C.text}" font-size="10" text-anchor="middle">${esc(t.label)}</text>`;
    }).join('');
    const grid = (o.xticks || []).map(t => {
      const px = o.x ? x0 + t.at * (x1 - x0) : X(t.at);
      return `<line x1="${px.toFixed(1)}" y1="${y1}" x2="${px.toFixed(1)}" y2="${y0}" stroke="${C.grid}" stroke-dasharray="2 3"/>`;
    }).join('');
    return {w, h, x0, x1, y0, y1, y, X, l2, h2, frame: yTicks.join('') + grid + xTicks};
  }

  function line(o){
    const f = frame(o);
    const bands = (o.bands || []).map(b => {
      const xa = f.x0 + b.from * (f.x1 - f.x0), xb = f.x0 + b.to * (f.x1 - f.x0);
      return `<rect x="${xa.toFixed(1)}" y="${f.y1}" width="${(xb - xa).toFixed(1)}" height="${(f.y0 - f.y1).toFixed(1)}"
        fill="${b.color || C.accent}" opacity=".08"/>` +
        (b.label ? `<text x="${((xa + xb) / 2).toFixed(1)}" y="${f.y1 + 11}" fill="${C.text}" font-size="9" text-anchor="middle">${esc(b.label)}</text>` : '');
    }).join('');
    const paths = (o.series || []).map(s => {
      let d = '', pen = false;
      s.points.forEach((v, i) => {
        if (v == null) { pen = false; return; }
        d += (pen ? 'L' : 'M') + f.X(i).toFixed(1) + ',' + f.y(v).toFixed(1) + ' ';
        pen = true;
      });
      const marks = s.markers ? s.points.map((v, i) => v == null ? '' :
        `<circle cx="${f.X(i).toFixed(1)}" cy="${f.y(v).toFixed(1)}" r="${s.r || 3.4}" fill="${s.color}"/>`).join('') : '';
      return `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="${s.width || 2}"${s.dash ? ` stroke-dasharray="${s.dash}"` : ''}/>${marks}`;
    }).join('');
    const legend = o.legend === false ? '' : `<div class="pc-legend">${(o.series || []).map(s =>
      `<span><i style="background:${s.color}"></i>${esc(s.name)}</span>`).join('')}${(o.notes || []).map(n =>
      `<span class="faint">${n}</span>`).join('')}</div>`;
    return `<figure class="pc"><svg viewBox="0 0 ${f.w} ${f.h}" width="100%" height="${f.h}" role="img" aria-label="${esc(o.title || 'chart')}">
      ${bands}${f.frame}${paths}
      ${o.yLabel ? `<text x="14" y="${(f.y0 + f.y1) / 2}" fill="${C.text}" font-size="10" transform="rotate(-90 14 ${(f.y0 + f.y1) / 2})" text-anchor="middle">${esc(o.yLabel)}</text>` : ''}
    </svg>${legend}${o.caption ? `<figcaption class="faint">${o.caption}</figcaption>` : ''}</figure>`;
  }

  function bars(o){
    const f = frame(Object.assign({zero: true}, o));
    const n = o.bars.length, bw = (f.x1 - f.x0) / n;
    const zero = f.y(0);
    const body = o.bars.map((b, i) => {
      const v = b.value == null ? null : b.value;
      const x = f.x0 + i * bw + bw * 0.18, w = bw * 0.64;
      const yv = v == null ? zero : f.y(v);
      const top = Math.min(yv, zero), hgt = Math.abs(zero - yv);
      const col = b.color || (v == null ? C.text : v >= 0 ? C.warn : C.accent);
      return `<rect x="${x.toFixed(1)}" y="${top.toFixed(1)}" width="${w.toFixed(1)}" height="${Math.max(1, hgt).toFixed(1)}" fill="${col}" opacity=".85"><title>${esc(b.label)}: ${esc(fmt(v))}</title></rect>
        <text x="${(x + w / 2).toFixed(1)}" y="${(f.h - 24)}" fill="${C.text}" font-size="9" text-anchor="middle">${esc(b.label)}</text>`;
    }).join('');
    return `<figure class="pc"><svg viewBox="0 0 ${f.w} ${f.h}" width="100%" height="${f.h}" role="img" aria-label="${esc(o.title || 'bars')}">
      ${f.frame}<line x1="${f.x0}" y1="${zero}" x2="${f.x1}" y2="${zero}" stroke="${C.axis}"/>${body}</svg>
      ${o.caption ? `<figcaption class="faint">${o.caption}</figcaption>` : ''}</figure>`;
  }

  // A surface as a shaded mesh grid: one cell per (row, column).
  function heat(o){
    const rows = o.rows, cols = o.cols;
    const cw = o.cell || 54, ch = o.cellH || 30, l = 58, t = 26;
    const w = l + cols.length * cw + (o.legend === false ? 14 : 92);
    const h = t + rows.length * ch + 34;
    const vals = [];
    rows.forEach((_, i) => cols.forEach((_, j) => { const v = o.value(i, j); if (v != null) vals.push(v); }));
    const lo = Math.min(...vals), hi = Math.max(...vals), span = (hi - lo) || 1;
    const cells = [];
    rows.forEach((r, i) => cols.forEach((c, j) => {
      const v = o.value(i, j);
      const x = l + j * cw, y = t + i * ch;
      const col = v == null ? '#161619' : heatColour((v - lo) / span);
      cells.push(`<rect x="${x}" y="${y}" width="${cw - 2}" height="${ch - 2}" rx="2" fill="${col}"><title>${esc(r.label)} · ${esc(c.label)}: ${esc(fmt(v, o.dp))}</title></rect>`);
      if (o.showValues !== false) cells.push(`<text x="${(x + (cw - 2) / 2).toFixed(1)}" y="${(y + ch / 2 + 3.5).toFixed(1)}" fill="${(v != null && (v - lo) / span > 0.55) ? '#0d1117' : C.ink}" font-size="9.5" text-anchor="middle">${esc(fmt(v, o.dp ?? 1))}</text>`);
    }));
    const rowLabels = rows.map((r, i) => `<text x="${l - 8}" y="${(t + i * ch + ch / 2 + 3.5).toFixed(1)}" fill="${C.text}" font-size="10" text-anchor="end">${esc(r.label)}</text>`).join('');
    const colLabels = cols.map((c, j) => `<text x="${(l + j * cw + (cw - 2) / 2).toFixed(1)}" y="${t - 8}" fill="${C.text}" font-size="10" text-anchor="middle">${esc(c.label)}</text>`).join('');
    const legend = o.legend === false ? '' : (() => {
      const bx = l + cols.length * cw + 14, by = t, bh = rows.length * ch - 2;
      const steps = 24, sh = bh / steps;
      let g = '';
      for (let k = 0; k < steps; k++) g += `<rect x="${bx}" y="${(by + k * sh).toFixed(1)}" width="12" height="${(sh + 1).toFixed(1)}" fill="${heatColour(1 - k / (steps - 1))}"/>`;
      return `<g>${g}<text x="${bx + 18}" y="${by + 8}" fill="${C.text}" font-size="9">${esc(fmt(hi, o.dp))}</text>
        <text x="${bx + 18}" y="${by + bh}" fill="${C.text}" font-size="9">${esc(fmt(lo, o.dp))}</text></g>`;
    })();
    return `<figure class="pc"><svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" role="img" aria-label="${esc(o.title || 'heat map')}">
      ${cells.join('')}${rowLabels}${colLabels}${legend}
      ${o.xLabel ? `<text x="${(l + cols.length * cw / 2).toFixed(1)}" y="${h - 6}" fill="${C.text}" font-size="10" text-anchor="middle">${esc(o.xLabel)}</text>` : ''}
      ${o.yLabel ? `<text x="12" y="${(t + rows.length * ch / 2).toFixed(1)}" fill="${C.text}" font-size="10" transform="rotate(-90 12 ${(t + rows.length * ch / 2).toFixed(1)})" text-anchor="middle">${esc(o.yLabel)}</text>` : ''}
    </svg>${o.caption ? `<figcaption class="faint">${o.caption}</figcaption>` : ''}</figure>`;
  }

  // A surface as an isometric wireframe: rows and columns joined over a height.
  function mesh(o){
    const w = o.w || 940, h = o.h || 420;
    const rows = o.z.length, cols = o.z[0].length;
    const vals = o.z.flat().filter(v => v != null);
    const lo = Math.min(...vals), hi = Math.max(...vals), span = (hi - lo) || 1;
    const ox = o.ox ?? w * 0.52;
    const sy = o.sy ?? Math.min(22, h / (2 * Math.max(1, (rows - 1) + (cols - 1))));
    const sx = o.sx ?? Math.min(46, (w * 0.6) / Math.max(1, (rows - 1) + (cols - 1)));
    const sz = o.sz ?? h * 0.34;
    const oy = o.oy ?? h - 26 - ((rows - 1) + (cols - 1)) * sy;
    const P = (i, j) => {
      const v = o.z[i][j];
      const z = v == null ? 0 : (v - lo) / span;
      return [ox + (j - i) * sx, oy + (i + j) * sy - z * sz, z];
    };
    const lines = [];
    for (let i = 0; i < rows; i++) {
      let d = '';
      for (let j = 0; j < cols; j++) { const p = P(i, j); d += (j ? 'L' : 'M') + p[0].toFixed(1) + ',' + p[1].toFixed(1) + ' '; }
      lines.push(`<path d="${d}" fill="none" stroke="${C.accent}" stroke-width="1.4" opacity=".75"/>`);
    }
    for (let j = 0; j < cols; j++) {
      let d = '';
      for (let i = 0; i < rows; i++) { const p = P(i, j); d += (i ? 'L' : 'M') + p[0].toFixed(1) + ',' + p[1].toFixed(1) + ' '; }
      lines.push(`<path d="${d}" fill="none" stroke="${C.warn}" stroke-width="1" opacity=".5"/>`);
    }
    const rowL = (o.rows || []).map((r, i) => { const p = P(i, 0); return `<text x="${(p[0] - 12).toFixed(1)}" y="${(p[1] + 4).toFixed(1)}" fill="${C.text}" font-size="10" text-anchor="end">${esc(r.label)}</text>`; }).join('');
    const colL = (o.cols || []).map((c, j) => { const p = P(rows - 1, j); return `<text x="${(p[0] + 10).toFixed(1)}" y="${(p[1] + 4).toFixed(1)}" fill="${C.text}" font-size="10">${esc(c.label)}</text>`; }).join('');
    const axis = `<text x="14" y="${h - 12}" fill="${C.text}" font-size="10">height: ${esc(o.zLabel || 'value')} ${esc(fmt(lo, o.dp))}–${esc(fmt(hi, o.dp))}</text>`;
    return `<figure class="pc"><svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" role="img" aria-label="${esc(o.title || 'surface mesh')}">
      ${lines.join('')}${rowL}${colL}${axis}</svg>
      <div class="pc-legend"><span><i style="background:${C.accent}"></i>expiry</span><span><i style="background:${C.warn}"></i>strike</span>${(o.notes || []).map(n => `<span class="faint">${n}</span>`).join('')}</div>
      ${o.caption ? `<figcaption class="faint">${esc(o.caption)}</figcaption>` : ''}</figure>`;
  }

  return {line, bars, heat, mesh, colours: C, heatColour};
})();
function render(){
  const app = document.getElementById('app');
  let body;
  if (variant === 'b') body = meshPanel() + termStructures() + arbitragePanel();
  else if (variant === 'c') body = termStructures() + arbitragePanel() + smilesTable();
  else body = smileChart() + termStructures() + smilesTable() + arbitragePanel();
  app.innerHTML = header() + body;
  document.getElementById('note').textContent =
    `Prototype · inspect a surface's slices · variant ${variant.toUpperCase()} · market: ${state} · slice: ${tenor} · reads and diagnoses only`;
  document.getElementById('bar').innerHTML =
    `<span class="label">View</span>` +
    ['a','b','c'].map(v => `<button data-v="${v}" class="${v === variant ? 'on' : ''}">${v.toUpperCase()} ${v === 'a' ? 'slice' : v === 'b' ? 'mesh' : 'arbitrage'}</button>`).join('') +
    `<span class="sep">|</span><span class="label">Market</span>` +
    ['clean','butterfly'].map(s => `<button data-s="${s}" class="${s === state ? 'on' : ''}">${s}</button>`).join('') +
    `<span class="sep">|</span><span class="label">Slice</span>` +
    surface.map(s => `<button data-t="${s.exp}" class="${s.exp === tenor ? 'on' : ''}">${s.exp}</button>`).join('');
  document.querySelectorAll('#bar [data-v]').forEach(b => b.onclick = () => set('variant', b.dataset.v));
  document.querySelectorAll('#bar [data-s]').forEach(b => b.onclick = () => set('state', b.dataset.s));
  document.querySelectorAll('#bar [data-t]').forEach(b => b.onclick = () => set('tenor', b.dataset.t));
  document.querySelectorAll('#app [data-t]').forEach(b => b.onclick = () => set('tenor', b.dataset.t));
  document.querySelectorAll('[data-act]').forEach(b => b.onclick = () => {
    document.getElementById('note').textContent = `${b.textContent}: mock only — the subject it names is missing`;
  });
}
function set(k, v){ const p = new URLSearchParams(location.search); p.set(k, v); location.search = p.toString(); }
render();
</script>
</body>
