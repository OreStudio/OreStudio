---
name: One writer per table
on:  # yamllint disable-line rule:truthy
  # The check reads the SQL create tree and the populate tree, so it fires on
  # both, and on the check, its test and this file, so an edit to any of those
  # is verified here too.
  push:
    branches: ["main"]
    paths:
      - "projects/ores.sql/create/**"
      - "projects/ores.sql/populate/**"
      - "projects/ores.codegen/scripts/check_single_writer.py"
      - "projects/ores.codegen/tests/test_check_single_writer.py"
      - ".github/workflows/single-writer.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  # A table in a tenant has one writer, and the level the data belongs to
  # chooses it: a fixed vocabulary is written by a populate script, a catalogue
  # a person manages by a publish function. Two writers of one table make two
  # copies of a fact, and no reader is then authoritative -- which is how the
  # calendars the platform seeded came to differ from the calendars the dataset
  # published. A populate script that writes a different tenant is not a second
  # copy, and the exceptions list states which case each remaining table is.
  single-writer:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Check that no table is written both ways unlisted
        run: |
          python3 projects/ores.codegen/scripts/check_single_writer.py
      - name: Install test dependencies
        run: |
          pip install --quiet pytest
      - name: Test the check
        run: |
          python3 -m pytest projects/ores.codegen/tests/test_check_single_writer.py -q
