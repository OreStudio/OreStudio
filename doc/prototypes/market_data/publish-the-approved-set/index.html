<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Publish the approved set — prototype</title>
<style>
:root{color-scheme:dark;--bg:#121214;--panel:#1a1a1e;--panel-2:#26262b;--line:#30363d;--line-soft:#21262d;--ink:#e3e3e6;--ink-dim:#a1a1aa;--ink-faint:#71717a;--accent:#58a6ff;--accent-dim:#21262d;--ok:#3fb950;--warn:#d29922;--bad:#f85149;--radius:.5rem;--mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink)}
body{margin:0;font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;padding:2.5rem 1.5rem 8rem}
h1,h2,h3{margin:0;font-weight:600}h1{font-size:1.15rem}h2{font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-dim)}
p{margin:0}ul{margin:0;padding:0;list-style:none}a{color:var(--accent);text-decoration:none}
button,input,select{font:inherit;color:inherit}button{cursor:pointer}
.mono{font-family:var(--mono)}.muted{color:var(--ink-dim)}.faint{color:var(--ink-faint)}
.wrap{max-width:1080px;margin:0 auto;display:grid;gap:14px}
.top{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px;display:grid;gap:10px}
.panel>h2{border-bottom:1px solid var(--line-soft);padding-bottom:6px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.field{display:grid;gap:4px;min-width:170px}.field label{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-faint)}
.field .value,.field select,.field input{background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:6px 8px}
table{width:100%;border-collapse:collapse;font-size:.86rem}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line-soft)}
th{font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-faint);font-weight:600}
td.num{text-align:right;font-family:var(--mono)}
.btn{background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:7px 12px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#0d1117;font-weight:600}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.tag{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:1px 8px;font-size:.72rem;color:var(--ink-dim)}
.tag.ok{color:var(--ok);border-color:#1f4d29}.tag.bad{color:var(--bad);border-color:#5a2320}.tag.warn{color:var(--warn);border-color:#4a3a17}
.notice{border:1px dashed var(--line);border-radius:var(--radius);padding:10px 12px;color:var(--ink-dim);background:#161619}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:820px){.grid2{grid-template-columns:1fr}}
.proto-note{position:fixed;top:0;left:0;right:0;z-index:60;padding:6px 14px;background:repeating-linear-gradient(45deg,#2a2113,#2a2113 10px,#241d11 10px,#241d11 20px);border-bottom:1px solid #4a3a17;color:var(--warn);font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.proto-bar{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:60;display:flex;gap:2px;align-items:center;padding:5px 7px;background:#0b0e13;border:1px solid var(--line);border-radius:999px;box-shadow:0 8px 30px rgba(0,0,0,.6);font-size:12px;max-width:95vw;flex-wrap:wrap;justify-content:center}
.proto-bar button{background:none;border:none;color:var(--ink-dim);padding:6px 10px;border-radius:999px}
.proto-bar button:hover{background:var(--panel-2);color:var(--ink)}.proto-bar button.on{background:var(--accent-dim);color:var(--ink)}
.proto-bar .label{padding:0 8px}.proto-bar .sep{color:var(--line)}
</style>
</head>
<body>
<table class="prototype-links" style="width:100%;border-collapse:collapse;margin:0;font:500 13px/1.6 Inter,system-ui,sans-serif;color:inherit;background:rgba(127,127,127,.12);border-bottom:1px solid rgba(127,127,127,.35)">
<tr><th style="text-align:left;padding:.4rem .8rem;font-weight:600;white-space:nowrap;border-right:1px solid rgba(127,127,127,.35)">Prototype</th><td style="padding:.4rem .8rem;width:100%"><a href="index.html" style="color:inherit">this prototype</a></td></tr>
<tr><th style="text-align:left;padding:.4rem .8rem;font-weight:600;white-space:nowrap;border-right:1px solid rgba(127,127,127,.35);border-top:1px solid rgba(127,127,127,.35)">Gemini review</th><td class="prototype-review" style="padding:.4rem .8rem;border-top:1px solid rgba(127,127,127,.35)">none</td></tr>
</table>


<!--
  PROTOTYPE. Throwaway. Mock data, no backend, no build step, no session.

  The trader's "Publish the approved set" screen
  (doc/knowledge/journeys/market_data/journey_publish-the-approved-set.org): the
  approval at the top, the points it covers beneath it, the publish act with its
  publisher, and the consumers that will see the new version, so the publishing
  control comes last. Nothing here calls a service.

  Variants with ?variant=a|b|c change the confirmation: a is a set summary, b is
  a per-curve list, c is a publish-and-notify screen.

  States with ?state=zero|one|failed: zero has approvals_required 0 so the raise
  is the publish, one has an approval standing, failed is a publish that did not
  apply.
-->
<div class="proto-note" id="note"></div>
<div class="wrap" id="app"></div>
<div class="proto-bar" id="bar"></div>
<script>
const params = new URLSearchParams(location.search);
const variant = params.get('variant') || 'a';
const state = params.get('state') || 'one';
const trader = {id:'a.reyes', role:'Market data trader (maker)'};
const checker = {id:'m.oduya', role:'Market data checker'};
const analyst = {id:'j.silva', role:'Market data analyst'};
// The kind says how many approvals publish the set, and whether zero publishes
// at once. The published marker carries the publisher and the moment.
const kind = {
  code:'marketdata.curve_publish',
  approvals_required: state === 'zero' ? 0 : 1,
  deciding_group:'Market data approvers',
  decide_permission:'marketdata::curves:publish',
  comment_on_approve:true,
  allows_hold:true,
  expires_days:7
};
const publishAsOf = '2026-10-06 16:00 UTC';
const approved = [
  {ccy:'USD', curve:'USD-SOFR-3M', tenor:'1M',  value:4.1520, source:'curve_bootstrap'},
  {ccy:'USD', curve:'USD-SOFR-3M', tenor:'3M',  value:4.2050, source:'curve_bootstrap'},
  {ccy:'USD', curve:'USD-SOFR-3M', tenor:'1Y',  value:4.1010, source:'curve_bootstrap'},
  {ccy:'USD', curve:'USD-SOFR-3M', tenor:'5Y',  value:4.2360, source:'curve_bootstrap'},
  {ccy:'EUR', curve:'EUR-ESTR-6M', tenor:'6M',  value:2.8100, source:'curve_bootstrap'},
  {ccy:'EUR', curve:'EUR-ESTR-6M', tenor:'2Y',  value:2.5200, source:'curve_bootstrap'},
  {ccy:'GBP', curve:'GBP-SONIA-3M', tenor:'10Y', value:4.0500, source:'curve_bootstrap'}
];
const curves = [...new Set(approved.map(a => a.curve))];
const consumers = [
  {name:'Pricing', reads:'published curve from ' + publishAsOf, ok:true},
  {name:'Reporting', reads:'published curve from ' + publishAsOf, ok:true},
  {name:'Risk (scenario engine)', reads:'latest observations only', ok:false}
];
const failed = state === 'failed';
const zero = state === 'zero';
function tag(t, c){ return `<span class="tag ${c || ''}">${t}</span>`; }
function header(){
  const stateLabel = failed ? tag('publish failed','bad')
    : zero ? tag('approved at raise — 0 required','warn')
    : tag('approved 1 of 1','ok');
  return `
  <div class="top">
    <h1>Publish / approved set for ${publishAsOf}</h1>
    <span class="muted">${curves.length} curves · ${approved.length} points</span>
    <span style="margin-left:auto">signed in: <span class="mono">${trader.id}</span> (${trader.role})</span>
    <a href="../../../knowledge/journeys/market_data/journey_publish-the-approved-set.html">the journey &rarr;</a>
  </div>
  <div class="panel">
    <h2>Approval</h2>
    <div class="row">
      <div class="field"><label>Request</label><div class="value mono">8f1c…a41 · ${kind.code}</div></div>
      <div class="field"><label>State</label><div class="value">${stateLabel}</div></div>
      <div class="field"><label>Approvals</label><div class="value">${kind.approvals_required === 0 ? '0 required — raise is the publish' : `1 of ${kind.approvals_required}`}</div></div>
      <div class="field"><label>${zero ? 'No approver' : 'Approved by'}</label><div class="value mono">${zero ? '—' : `${checker.id} at 2026-10-06 16:31`}</div></div>
      <div class="field" style="flex:1;min-width:240px"><label>Reason</label><div class="value">Today's set, reviewed against the 16:00 quotes</div></div>
    </div>
    <div class="notice">${zero
      ? 'This kind needs no approval, so nobody decides. The raise is the publish; no path applies a zero-approval request today.'
      : 'The kind needs one approval from ' + kind.deciding_group + '; the count is the kind&rsquo;s rule, not this screen&rsquo;s.'}</div>
  </div>`;
}
// Variant a: the set summary.
function setSummary(){
  const byCcy = approved.reduce((m, a) => (m[a.ccy] = (m[a.ccy] || 0) + 1, m), {});
  return `
  <div class="panel">
    <h2>What will be published — set summary</h2>
    <table><tbody>
      <tr><td>Curves</td><td class="mono">${curves.join(', ')}</td></tr>
      <tr><td>Points covered</td><td class="mono">${approved.length}</td></tr>
      <tr><td>Currencies</td><td class="mono">${Object.entries(byCcy).map(([c, n]) => `${c} (${n})`).join(', ')}</td></tr>
      <tr><td>As-of carried by the set</td><td class="mono">${publishAsOf}</td></tr>
      <tr><td>Recipe</td><td class="mono">USD-SOFR-3M v4 · EUR-ESTR-6M v2 · GBP-SONIA-3M v3</td></tr>
      <tr><td>Source</td><td class="mono">curve_bootstrap</td></tr>
    </tbody></table>
    <div class="notice">A summary confirms the shape of the set. It hides the individual points, so it is paired with the per-curve list.</div>
  </div>`;
}
// Variant b: the per-curve list.
function perCurve(){
  const groups = approved.reduce((m, a) => ((m[a.curve] = m[a.curve] || []).push(a), m), {});
  return `
  <div class="panel">
    <h2>What will be published — per curve</h2>
    <table>
      <thead><tr><th>Curve</th><th>Currency</th><th>Points</th><th>Tenors</th><th class="num">Last value</th><th>Approved</th></tr></thead>
      <tbody>${Object.entries(groups).map(([curve, rows]) => `<tr>
        <td class="mono">${curve}</td><td>${rows[0].ccy}</td><td class="num">${rows.length}</td>
        <td class="mono">${rows.map(r => r.tenor).join(' ')}</td>
        <td class="num">${rows[rows.length - 1].value.toFixed(4)}</td>
        <td>${tag('yes','ok')}</td></tr>`).join('')}</tbody>
    </table>
    <div class="notice">Every row here is a point the approval covers. Nothing outside this list becomes live.</div>
  </div>`;
}
// Variant c: the publish-and-notify screen.
function notifyPanel(){
  return `
  <div class="panel">
    <h2>Publish and notify</h2>
    <table>
      <thead><tr><th>Recipient</th><th>Notice</th><th>Sent</th></tr></thead>
      <tbody>
        <tr><td>Market data approvers</td><td class="mono">(no notification kind)</td><td>${tag('no','warn')}</td></tr>
        <tr><td>Pricing and Reporting services</td><td class="mono">(no notification kind)</td><td>${tag('no','warn')}</td></tr>
        <tr><td class="faint">${analyst.id} (${analyst.role})</td><td class="faint">watching USD-SOFR-3M</td><td>${tag('no','')}</td></tr>
      </tbody>
    </table>
    <div class="notice">The raise subject exists and is generic, but no market-data notification kind says what a publish notice is, so nobody is told.</div>
  </div>`;
}
function points(){
  return `
  <div class="panel">
    <h2>Points the approval covers — ${approved.length}</h2>
    <table>
      <thead><tr><th>Curve</th><th>Point</th><th class="num">Value</th><th>Source</th></tr></thead>
      <tbody>${approved.map(a => `<tr><td class="mono">${a.curve}</td><td class="mono">tenor=${a.tenor}</td>
        <td class="num">${a.value.toFixed(4)}</td><td>${a.source}</td></tr>`).join('')}</tbody>
    </table>
  </div>`;
}
function act(){
  const label = failed ? 'Retry publish approved set'
    : zero ? 'Publish now (no approval required)'
    : 'Publish approved set';
  return `
  <div class="panel">
    <h2>The act</h2>
    <div class="row">
      <div class="field"><label>Published by</label><div class="value mono">${trader.id} (signed in)</div></div>
      <div class="field"><label>Publish as of</label><div class="value mono">${publishAsOf}</div></div>
      <div class="field"><label>Approvals counted</label><div class="value mono">${kind.approvals_required === 0 ? '0 — satisfied by the raise' : `${kind.approvals_required} of ${kind.approvals_required}`}</div></div>
      <button class="btn primary" id="publish">${label}</button>
    </div>
    <div class="notice" id="act-note">${failed
      ? 'The publish did not apply. The candidate set is unchanged and the curve in use is still the previous one.'
      : zero
        ? 'With approvals_required = 0 the raise publishes at once; no such path exists, so this button is the mock of one.'
        : 'Publishing is a named act: the publisher and the moment are recorded. The publish operation does not exist yet.'}</div>
  </div>`;
}
function consumersPanel(){
  return `
  <div class="panel">
    <h2>After publish — who sees it</h2>
    <table>
      <thead><tr><th>Consumer</th><th>Sees</th><th>From</th></tr></thead>
      <tbody>${consumers.map(c => `<tr><td>${c.name}</td>
        <td>${c.ok ? 'published curve' : tag('latest observations','warn')}</td>
        <td class="mono faint">${c.ok ? publishAsOf : '—'}</td></tr>`).join('')}</tbody>
    </table>
    <div class="notice">Nothing marks a curve published, so a reader cannot tell a candidate from the live curve; the moment is the act, and the act is not stored.</div>
  </div>`;
}
function render(){
  // a and b confirm on the set and then publish; c leads with the act and
  // keeps the notice list beside the consumers.
  const middle = variant === 'b' ? perCurve() + points()
    : variant === 'a' ? setSummary() + points()
    : act() + notifyPanel() + points();
  const tail = variant === 'c' ? consumersPanel() : act() + consumersPanel() + notifyPanel();
  document.getElementById('app').innerHTML = header() + middle + tail;
  document.getElementById('note').textContent =
    `Prototype · publish the approved set · variant ${variant.toUpperCase()} · state: ${state} · approvals required: ${kind.approvals_required}`;
  document.getElementById('bar').innerHTML =
    `<span class="label">Confirm</span>` +
    [['a','set summary'],['b','per curve'],['c','publish &amp; notify']].map(([v,l]) =>
      `<button data-v="${v}" class="${v===variant?'on':''}">${v.toUpperCase()} ${l}</button>`).join('') +
    `<span class="sep">|</span><span class="label">State</span>` +
    ['zero','one','failed'].map(s => `<button data-s="${s}" class="${s===state?'on':''}">${s}</button>`).join('');
  document.querySelectorAll('#bar [data-v]').forEach(b => b.onclick = () => set('variant', b.dataset.v));
  document.querySelectorAll('#bar [data-s]').forEach(b => b.onclick = () => set('state', b.dataset.s));
  const pub = document.getElementById('publish');
  if(pub) pub.onclick = () => {
    document.getElementById('act-note').textContent = failed
      ? 'Retry failed again in this mock: marketdata.v1.curve_bootstrap.publish does not exist. No service is called.'
      : `Mock publish applied: ${trader.id} at ${publishAsOf}. The published marker is still missing, so nothing reads this back.`;
    pub.disabled = true;
  };
}
function set(k, v){ const p = new URLSearchParams(location.search); p.set(k, v); location.search = p.toString(); }
render();
</script>
</body>
