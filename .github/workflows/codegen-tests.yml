---
name: Codegen tests
on:  # yamllint disable-line rule:truthy
  push:
    branches: ["main"]
    paths:
      - "projects/ores.codegen/**"
      - "projects/ores.sql/create/**"
      - "projects/ores.iam/api/**"
      - "projects/ores.web/packages/web/src/i18n/**"
      - "doc/meta/**"
      - "doc/knowledge/**"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The suite of the scripts that stay in projects/ores.codegen/src: the
  # document scaffolder compass add calls, and the SQL parser the ER diagrams
  # read. compass-ng writes and checks the generated code (see
  # compass-check.yml).
  tests:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install codegen dependencies
        run: |
          pip install --quiet -r projects/ores.codegen/requirements.txt
      - name: Run the codegen suite
        run: |
          python3 -m pytest projects/ores.codegen/tests -q
