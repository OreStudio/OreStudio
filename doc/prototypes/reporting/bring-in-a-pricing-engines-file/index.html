<body>

<!--
  PROTOTYPE. Throwaway. Mock data, no backend, no build step, no session.

  Bringing in an ORE pricing engines file as a workflow of five steps on the
  standard steps UI: the file and what it holds, what the system does not know
  (a product type with no code, an element with no column, a duplicate), the
  target (a new configuration, or a new version of one the party holds, with the
  reach), the difference (removed, changed, added, with keep or drop for each
  removed product) and the review. The parse and the difference are mocks.

  Addresses: ?step=1..5&file=clean|unknown|omits&target=new|c2
  The three files are fixtures; the products in clean are real pairs counted from
  110 ORE example files.
-->

<div class="proto-note" id="note"></div>
<div class="wrap" id="app"></div>
<div class="proto-bar" id="bar"></div>
<div id="layer"></div>

<script>
// FIXTURE. The product, model and engine triples are counted from the 110
// pricingengine*.xml files under the ORE Examples folder, the first 45 by count.
// The notes, usual values and instrument codes are this prototype's own wording.
const TRIPLES = [
  ['Swap','DiscountedCashflows','DiscountingSwapEngine',65],['CapFlooredIborLeg','BlackOrBachelier','BlackIborCouponPricer',54],
  ['CMS','LinearTSR','LinearTSRPricer',47],['EquityOption','BlackScholesMerton','AnalyticEuropeanEngine',45],
  ['CommodityForward','DiscountedCashflows','DiscountingCommodityForwardEngine',44],['Bond','DiscountedCashflows','DiscountingRiskyBondEngine',38],
  ['CrossCurrencySwap','DiscountedCashflows','DiscountingCrossCurrencySwapEngine',37],['EuropeanSwaption','BlackBachelier','BlackBachelierSwaptionEngine',37],
  ['FxForward','DiscountedCashflows','DiscountingFxForwardEngine',36],['FxOption','GarmanKohlhagen','AnalyticEuropeanEngine',36],
  ['CreditDefaultSwap','DiscountedCashflows','MidPointCdsEngine',36],['CapFloor','IborCapModel','IborCapEngine',35],
  ['BermudanSwaption','LGM','Grid',34],['EquityForward','DiscountedCashflows','DiscountingEquityForwardEngine',32],
  ['EquityOptionAmerican','BlackScholesMerton','FdBlackScholesVanillaEngine',32],['FxOptionAmerican','GarmanKohlhagen','FdBlackScholesVanillaEngine',30],
  ['CMSSpread','BrigoMercurio','Analytic',30],['CommoditySwap','DiscountedCashflows','CommoditySwapEngine',30],
  ['Swap','CrossAssetModel','AMC',18],['CrossCurrencySwap','CrossAssetModel','AMC',15],['FlexiSwap','LGM','Grid',15],
  ['YYCapFloor','YYCapModel','YYCapEngine',29],['CpiCapFloor','CpiCapModel','CpiCapEngine',24],['BondOption','Black','BlackBondOptionEngine',16]
];
const TYPES = [
  ['Swap','Rates','Swap','An interest rate swap, fixed against floating or floating against floating.'],
  ['CrossCurrencySwap','Rates','CrossCurrencySwap','A swap whose two legs pay in different currencies.'],
  ['CapFloor','Rates','CapFloor','A cap or a floor on an interest rate index.'],
  ['CMS','Rates','Swap','A leg that pays a constant maturity swap rate.'],
  ['CMSSpread','Rates','Swap','A leg that pays the spread between two constant maturity swap rates.'],
  ['EuropeanSwaption','Rates','Swaption','The right to enter a swap on one date.'],
  ['BermudanSwaption','Rates','Swaption','The right to enter a swap on any of several dates.'],
  ['FlexiSwap','Rates','Swap','A swap whose holder may choose the notional on each date.'],
  ['FxForward','FX','FxForward','An agreement to exchange two currencies on a future date.'],
  ['FxOption','FX','FxOption','A European option on an exchange rate.'],
  ['FxOptionAmerican','FX','FxOption','An American option on an exchange rate.'],
  ['Bond','Credit','Bond','A bond that carries credit risk.'],
  ['CreditDefaultSwap','Credit','CreditDefaultSwap','Protection against the default of one name.'],
  ['BondOption','Credit','Bond','An option on a bond.'],
  ['EquityOption','Equity','EquityOption','A European option on a share or an index.'],
  ['EquityOptionAmerican','Equity','EquityOption','An American option on a share or an index.'],
  ['EquityForward','Equity','EquityForward','An agreement to buy or sell a share on a future date.'],
  ['CommodityForward','Commodity','CommodityForward','An agreement to buy or sell a commodity on a future date.'],
  ['CommoditySwap','Commodity','CommoditySwap','A swap of a fixed price against a commodity price.'],
  ['YYCapFloor','Inflation','CapFloor','A cap or a floor on year-on-year inflation.'],
  ['CpiCapFloor','Inflation','CapFloor','A cap or a floor on a consumer price index.']
].map(([code, cls, instrument, desc]) => ({ code, cls, instrument, desc }));
const typeOf = c => TYPES.find(t => t.code === c);
const MODELS = [...new Set(TRIPLES.map(t => t[1]))].sort();
const enginesFor = m => [...new Set(TRIPLES.filter(t => t[1] === m).map(t => t[2]))].sort();
const ALL_ENGINES = [...new Set(TRIPLES.map(t => t[2]))].sort();
const knownPair = (m, e) => TRIPLES.some(t => t[1] === m && t[2] === e);
const usualFor = c => { const x = TRIPLES.filter(t => t[0] === c).sort((a, b) => b[3] - a[3])[0]; return x ? { model: x[1], engine: x[2], n: x[3] } : null; };
// The settings a pair is known to take. kind: select (options), text, number.
const SETTINGS = {
  'BermudanSwaption|LGM|Grid': [
    { scope: 'model', name: 'Calibration', kind: 'select', opts: ['Bootstrap', 'BestFit', 'None'], usual: 'Bootstrap', note: 'How the model is fitted to the swaption quotes.' },
    { scope: 'model', name: 'CalibrationStrategy', kind: 'select', opts: ['CoterminalATM', 'CoterminalDealStrike', 'UnderlyingATM', 'UnderlyingDealStrike'], usual: 'CoterminalATM', note: 'Which swaptions the fit uses.' },
    { scope: 'model', name: 'ReversionType', kind: 'select', opts: ['HullWhite', 'Hagan'], usual: 'HullWhite', note: 'The parameterisation of mean reversion.' },
    { scope: 'model', name: 'VolatilityType', kind: 'select', opts: ['Hagan', 'HullWhite'], usual: 'Hagan', note: 'The parameterisation of volatility.' },
    { scope: 'model', name: 'Volatility', kind: 'number', usual: '0.01', note: 'The starting volatility the fit moves from.' },
    { scope: 'model', name: 'ShiftHorizon', kind: 'number', usual: '0.5', note: 'The horizon, in years, of the shift of the state variable.' },
    { scope: 'engine', name: 'sx', kind: 'number', usual: '3.0', note: 'Width of the grid, in standard deviations, on the state axis.' },
    { scope: 'engine', name: 'sy', kind: 'number', usual: '3.0', note: 'Width of the grid, in standard deviations, on the value axis.' },
    { scope: 'engine', name: 'nx', kind: 'number', usual: '10', note: 'Number of grid points on the state axis.' },
    { scope: 'engine', name: 'ny', kind: 'number', usual: '10', note: 'Number of grid points on the value axis.' }
  ],
  'Bond|DiscountedCashflows|DiscountingRiskyBondEngine': [
    { scope: 'engine', name: 'TimestepPeriod', kind: 'text', usual: '6M', note: 'The step of the default probability grid.' }
  ],
  'Swap|DiscountedCashflows|DiscountingSwapEngine': [
    { scope: 'engine', name: 'SensitivityTemplate', kind: 'select', opts: ['IR_Analytical'], usual: 'IR_Analytical', note: 'The sensitivity method a swap offers.' }
  ]
};
const GLOBAL_KNOWN = [{ name: 'ContinueOnCalibrationError', kind: 'select', opts: ['true', 'false'], usual: 'true', note: 'Whether a failed calibration stops the run. True prices the product with the last good fit and records the error.' }];
const settingsFor = (t, m, e) => SETTINGS[t + '|' + m + '|' + e] || [];
const P = (scope, name, value) => ({ scope, name, value });
