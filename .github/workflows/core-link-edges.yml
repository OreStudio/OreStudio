---
name: Core link edges
on:  # yamllint disable-line rule:truthy
  # The check reads every CMakeLists under projects, including the tests and
  # modeling directories that state a core's name, so it fires on any of them,
  # and on the check, its baseline and this file. It runs on main and by hand:
  # the local runner is the gate, and no workflow triggers on a pull request.
  push:
    branches: ["main"]
    paths:
      - "projects/**/CMakeLists.txt"
      - "projects/ores.codegen/scripts/check_core_link_edges.py"
      - "projects/ores.codegen/scripts/core_link_edges_baseline.json"
      - ".github/workflows/core-link-edges.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  # A component's core is the domain and its repositories. It may depend on
  # other components' api contracts and on the shared libraries; it may not
  # depend on another component's core or service: an edge of that kind is how a
  # codec comes to reach into another component's repositories. The ratchet
  # baseline names the edges that predate the rule. The scan needs no toolchain.
  core-link-edges:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Check that no core links another component's core or service
        run: |
          python3 projects/ores.codegen/scripts/check_core_link_edges.py
