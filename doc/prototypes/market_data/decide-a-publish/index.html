<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Decide a publish — prototype</title>
<style>
:root{color-scheme:dark;--bg:#121214;--panel:#1a1a1e;--panel-2:#26262b;--line:#30363d;--line-soft:#21262d;--ink:#e3e3e6;--ink-dim:#a1a1aa;--ink-faint:#71717a;--accent:#58a6ff;--accent-dim:#21262d;--ok:#3fb950;--warn:#d29922;--bad:#f85149;--radius:.5rem;--mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink)}
body{margin:0;font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;padding:2.5rem 1.5rem 8rem}
h1,h2,h3{margin:0;font-weight:600}h1{font-size:1.15rem}h2{font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-dim)}
p{margin:0}ul{margin:0;padding:0;list-style:none}a{color:var(--accent);text-decoration:none}
button,input,select{font:inherit;color:inherit}button{cursor:pointer}
.mono{font-family:var(--mono)}.muted{color:var(--ink-dim)}.faint{color:var(--ink-faint)}
.wrap{max-width:1080px;margin:0 auto;display:grid;gap:14px}
.top{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px;display:grid;gap:10px}
.panel>h2{border-bottom:1px solid var(--line-soft);padding-bottom:6px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.field{display:grid;gap:4px;min-width:170px}.field label{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-faint)}
.field .value,.field select,.field input{background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:6px 8px}
table{width:100%;border-collapse:collapse;font-size:.86rem}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line-soft)}
th{font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-faint);font-weight:600}
td.num{text-align:right;font-family:var(--mono)}
.btn{background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:7px 12px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#0d1117;font-weight:600}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.tag{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:1px 8px;font-size:.72rem;color:var(--ink-dim)}
.tag.ok{color:var(--ok);border-color:#1f4d29}.tag.bad{color:var(--bad);border-color:#5a2320}.tag.warn{color:var(--warn);border-color:#4a3a17}
.notice{border:1px dashed var(--line);border-radius:var(--radius);padding:10px 12px;color:var(--ink-dim);background:#161619}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:820px){.grid2{grid-template-columns:1fr}}
.proto-note{position:fixed;top:0;left:0;right:0;z-index:60;padding:6px 14px;background:repeating-linear-gradient(45deg,#2a2113,#2a2113 10px,#241d11 10px,#241d11 20px);border-bottom:1px solid #4a3a17;color:var(--warn);font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.proto-bar{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:60;display:flex;gap:2px;align-items:center;padding:5px 7px;background:#0b0e13;border:1px solid var(--line);border-radius:999px;box-shadow:0 8px 30px rgba(0,0,0,.6);font-size:12px;max-width:95vw;flex-wrap:wrap;justify-content:center}
.proto-bar button{background:none;border:none;color:var(--ink-dim);padding:6px 10px;border-radius:999px}
.proto-bar button:hover{background:var(--panel-2);color:var(--ink)}.proto-bar button.on{background:var(--accent-dim);color:var(--ink)}
.proto-bar .label{padding:0 8px}.proto-bar .sep{color:var(--line)}
</style>
</head>
<body>

<!--
  PROTOTYPE. Throwaway. Mock data, no backend, no build step, no session.

  The checker's "Decide a publish" screen
  (doc/knowledge/journeys/market_data/journey_decide-a-publish.org): the
  tenant's queue, one request with the delta it proposes and the QA checks, the
  decisions so far, and the decision panel last, so the answer comes after the
  reading. Nothing here calls a service.

  Variants with ?variant=a|b|c shape the queue: a is a list beside the request,
  b is a request-first screen with the queue as a strip, c is a group inbox
  grouped by deciding group.

  States with ?state=waiting|held|decided|multi: one waiting, one held, one
  already decided, and one request whose kind needs two distinct approvals.
-->
<div class="proto-note" id="note"></div>
<div class="wrap" id="app"></div>
<div class="proto-bar" id="bar"></div>
<script>
const params = new URLSearchParams(location.search);
const variant = params.get('variant') || 'a';
const state = params.get('state') || 'waiting';
const maker = {id:'a.reyes', role:'Market data maker'};
const checker = {id:'m.oduya', role:'Market data checker'};
const analyst = {id:'j.silva', role:'Market data analyst'};
// Each kind says its own rules: the count, the deciding group, the permission,
// whether a comment is required, whether a hold is allowed, and the lifetime.
const kind = {
  code:'marketdata.curve_publish',
  approvals_required: state === 'multi' ? 2 : 1,
  deciding_group:'Market data approvers',
  decide_permission:'marketdata::curves:publish',
  comment_on_approve:true,
  allows_hold:true,
  expires_days:7
};
const queues = [
  {id:'8f1c…a41', kind:'marketdata.curve_publish', subject:'USD-SOFR-3M, EUR-ESTR-6M, GBP-SONIA-3M',
   asked:'a.reyes', age:'2h', state:'waiting', group:'Market data approvers'},
  {id:'7b02…c19', kind:'marketdata.curve_publish', subject:'EUR-ESTR-6M',
   asked:'j.silva', age:'5h', state:'waiting', group:'Market data approvers'},
  {id:'51ad…9e7', kind:'marketdata.curve_publish', subject:'GBP-SONIA-3M',
   asked:'a.reyes', age:'1d', state:'held', group:'Market data approvers'},
  {id:'2c88…40b', kind:'iam.role_grant', subject:'—',
   asked:'j.silva', age:'3d', state:'waiting', group:'IAM approvers'}
];
const stateRequest = {
  waiting: {id:'8f1c…a41', state:'waiting', approvals:1, decisions:[]},
  held:    {id:'51ad…9e7', state:'held', approvals:1,
            decisions:[{at:'2026-10-06 16:20', by:'m.oduya', what:'hold', why:'Waiting on the 4pm fixing'}]},
  decided: {id:'8f1c…a41', state:'approved', approvals:1,
            decisions:[{at:'2026-10-06 16:31', by:'m.oduya', what:'approve', why:'Checked against the 16:00 quotes'}]},
  multi:   {id:'8f1c…a41', state:'waiting', approvals:2,
            decisions:[{at:'2026-10-06 16:22', by:'j.silva', what:'approve', why:'Points agree with the quotes'}]}
}[state];
const final = stateRequest.state === 'approved' || stateRequest.state === 'refused';
const nodes = [
  {curve:'USD-SOFR-3M', tenor:'1M', cand:4.1520},
  {curve:'USD-SOFR-3M', tenor:'3M', cand:4.2050},
  {curve:'USD-SOFR-3M', tenor:'1Y', cand:4.1010},
  {curve:'USD-SOFR-3M', tenor:'5Y', cand:4.2360},
  {curve:'EUR-ESTR-6M', tenor:'6M', cand:2.8100},
  {curve:'GBP-SONIA-3M', tenor:'10Y', cand:4.0500}
];
const checks = [['All pillars priced','unknown'],['Discount factors monotonic','unknown'],['No arbitrage','unknown']];
function tag(t, c){ return `<span class="tag ${c || ''}">${t}</span>`; }
function stTag(s){
  const c = s === 'approved' ? 'ok' : s === 'refused' ? 'bad' : s === 'held' ? 'warn' : '';
  return tag(s, c);
}
function queuePanel(compact){
  const mine = queues.filter(q => q.group === kind.deciding_group);
  return `
  <div class="panel">
    <h2>Approvals queue — ${mine.filter(q => q.state !== 'approved').length} open for ${kind.deciding_group}</h2>
    <table>
      <thead><tr><th>Request</th><th class="num">Age</th><th>Kind</th><th>Curve</th><th>State</th></tr></thead>
      <tbody>${mine.map(q => `<tr${q.id === stateRequest.id ? '' : ' class="muted"'}>
        <td class="mono">${q.id}</td><td class="num faint">${q.age}</td><td class="mono">${q.kind}</td>
        <td>${q.subject}</td><td>${stTag(q.id === stateRequest.id ? stateRequest.state : q.state)}</td></tr>`).join('')}</tbody>
    </table>
    ${compact ? '' : '<div class="notice">The read is scoped by the decide permission, so the checker sees only the kinds they may decide. Selecting a row opens it; this mock always shows the first.</div>'}
  </div>`;
}
function groupInbox(){
  const groups = queues.reduce((m, q) => {
    (m[q.group] = m[q.group] || []).push(q); return m;
  }, {});
  return `
  <div class="panel">
    <h2>Group inbox</h2>
    <table>
      <thead><tr><th>Group</th><th class="num">Open</th><th class="num">Held</th><th>Oldest</th><th>Can I decide?</th></tr></thead>
      <tbody>${Object.entries(groups).map(([g, qs]) => `<tr><td>${g}</td>
        <td class="num">${qs.filter(q => q.state === 'waiting').length}</td>
        <td class="num">${qs.filter(q => q.state === 'held').length}</td>
        <td class="faint">${qs[0].age}</td>
        <td>${g === kind.deciding_group ? tag('yes','ok') : tag('no','')}</td></tr>`).join('')}</tbody>
    </table>
    <div class="notice">The model names a permission, not a group; "Market data approvers" is a candidate, so the screen shows the permission code beside it.</div>
  </div>`;
}
function requestHeader(){
  return `
  <div class="panel">
    <h2>Request ${stateRequest.id} — candidates as of 2026-10-06 16:00</h2>
    <div class="row">
      <div class="field"><label>Requested by</label><div class="value mono">${maker.id} (${maker.role})</div></div>
      <div class="field"><label>Requested at</label><div class="value mono">2026-10-06 16:04</div></div>
      <div class="field"><label>Reason</label><div class="value">Today's set, reviewed against the quotes</div></div>
      <div class="field"><label>Approvals required</label><div class="value">${kind.approvals_required} — ${kind.deciding_group}</div></div>
      <div class="field"><label>Decide permission</label><div class="value mono">${kind.decide_permission}</div></div>
      <div class="field"><label>Expires</label><div class="value">2026-10-13</div></div>
      <div class="field"><label>State</label><div class="value">${stTag(stateRequest.state)} ${stateRequest.approvals} of ${kind.approvals_required} approvals</div></div>
    </div>
    <div class="notice">Approving here records a decision. It does not publish a curve; the owning component applies it.</div>
  </div>`;
}
function deltaPanel(){
  return `
  <div class="panel">
    <h2>Delta vs last published</h2>
    <table>
      <thead><tr><th>Curve</th><th>Point</th><th class="num">Last published</th><th class="num">Candidate</th><th class="num">Change</th></tr></thead>
      <tbody>${nodes.map(n => `<tr><td class="mono">${n.curve}</td><td class="mono">${n.tenor}</td>
        <td class="num faint">no marker</td><td class="num">${n.cand.toFixed(4)}</td><td class="num">n/a</td></tr>`).join('')}</tbody>
    </table>
    <div class="notice">No published version exists to compare against, so the checker reads the candidate values and cannot see the change; see the journey's What is missing.</div>
  </div>`;
}
function checksPanel(){
  return `
  <div class="panel">
    <h2>QA and validation checks</h2>
    <table><tbody>${checks.map(([c, r]) => `<tr><td>${c}</td><td>${tag(r, 'warn')}</td></tr>`).join('')}</tbody></table>
    <div class="notice">No operation runs these over a candidate set. "Unknown" means not checked, not passed.</div>
  </div>`;
}
function decisionsPanel(){
  const d = stateRequest.decisions;
  return `
  <div class="panel">
    <h2>Decisions so far — ${d.length} of ${kind.approvals_required}</h2>
    <table>
      <thead><tr><th>When</th><th>By</th><th>Decision</th><th>Comment</th></tr></thead>
      <tbody>${d.map(x => `<tr><td class="mono faint">${x.at}</td><td class="mono">${x.by}</td>
        <td>${tag(x.what, x.what === 'approve' ? 'ok' : x.what === 'refuse' ? 'bad' : 'warn')}</td>
        <td>${x.why}</td></tr>`).join('') ||
        '<tr><td colspan="4" class="faint">no decisions yet</td></tr>'}</tbody>
    </table>
  </div>`;
}
function decisionPanel(){
  const commentRule = `A refusal always needs a comment; this kind also requires one on approval. A hold is ${kind.allows_hold ? 'allowed' : 'not allowed'} by the kind.`;
  if(final) return `
  <div class="panel">
    <h2>Decision</h2>
    <div class="row"><span>This request is ${stTag(stateRequest.state)} and can no longer be decided.</span></div>
    <div class="notice">The second decision is refused by the request's version. The screen says who decided rather than hiding the request.</div>
  </div>`;
  return `
  <div class="panel">
    <h2>Decision</h2>
    <div class="row">
      <div class="field" style="flex:1;min-width:280px"><label>Comment${kind.comment_on_approve ? ' (required on approval)' : ''}</label>
        <input id="comment" value="Checked against the 16:00 quotes"></div>
      <button class="btn primary" data-d="approve">Approve</button>
      <button class="btn" data-d="refuse">Refuse</button>
      <button class="btn" data-d="hold" ${kind.allows_hold ? '' : 'disabled'}>Hold</button>
    </div>
    <div class="notice" id="msg">${commentRule} ${stateRequest.approvals} of ${kind.approvals_required} approvals stand; each must come from a different person. ${state === 'multi' ? 'You are one of several.' : ''}</div>
  </div>`;
}
function render(){
  const q = queuePanel(variant === 'b');
  const head = `
  <div class="top">
    <h1>Approvals / publish queue</h1>
    <span class="muted">checker: <span class="mono">${checker.id}</span> (${checker.role})</span>
    <a style="margin-left:auto" href="../../../knowledge/journeys/market_data/journey_decide-a-publish.html">the journey &rarr;</a>
  </div>`;
  const body = variant === 'a' ? `<div class="grid2">${q}${requestHeader()}</div>${deltaPanel()}${checksPanel()}${decisionsPanel()}${decisionPanel()}`
    : variant === 'b' ? `${requestHeader()}${deltaPanel()}${checksPanel()}${decisionsPanel()}${decisionPanel()}${q}`
    : `${groupInbox()}${q}${requestHeader()}${deltaPanel()}${checksPanel()}${decisionsPanel()}${decisionPanel()}`;
  document.getElementById('app').innerHTML = head + body;
  document.getElementById('note').textContent =
    `Prototype · decide a publish · variant ${variant.toUpperCase()} · state: ${state} · ${kind.approvals_required} approval(s) required`;
  document.getElementById('bar').innerHTML =
    `<span class="label">Queue</span>` +
    [['a','list beside'],['b','request first'],['c','group inbox']].map(([v,l]) =>
      `<button data-v="${v}" class="${v===variant?'on':''}">${v.toUpperCase()} ${l}</button>`).join('') +
    `<span class="sep">|</span><span class="label">State</span>` +
    ['waiting','held','decided','multi'].map(s => `<button data-s="${s}" class="${s===state?'on':''}">${s}</button>`).join('');
  document.querySelectorAll('#bar [data-v]').forEach(b => b.onclick = () => set('variant', b.dataset.v));
  document.querySelectorAll('#bar [data-s]').forEach(b => b.onclick = () => set('state', b.dataset.s));
  document.querySelectorAll('#app [data-d]').forEach(b => b.onclick = () => {
    const c = document.getElementById('comment');
    if(!c.value.trim()){ document.getElementById('msg').textContent = 'A comment is required.'; return; }
    document.getElementById('msg').textContent =
      `Recorded "${b.dataset.d}" by ${checker.id} with a comment, in this mock only. No service is called.`;
  });
}
function set(k, v){ const p = new URLSearchParams(location.search); p.set(k, v); location.search = p.toString(); }
render();
</script>
</body>
</html>
