<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Curve blueprint prototype — Market data journeys</title>
<style>
:root{color-scheme:dark;--bg:#121214;--panel:#1a1a1e;--panel-2:#26262b;--line:#30363d;--line-soft:#21262d;--ink:#e3e3e6;--ink-dim:#a1a1aa;--ink-faint:#71717a;--accent:#58a6ff;--accent-dim:#21262d;--ok:#3fb950;--warn:#d29922;--bad:#f85149;--radius:.5rem;--mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink)}
body{margin:0;font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;padding:2.5rem 1.5rem 8rem}
h1,h2,h3{margin:0;font-weight:600}h1{font-size:1.15rem}h2{font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-dim)}
p{margin:0}ul{margin:0;padding:0;list-style:none}a{color:var(--accent);text-decoration:none}
button,input,select{font:inherit;color:inherit}button{cursor:pointer}
.mono{font-family:var(--mono)}.muted{color:var(--ink-dim)}.faint{color:var(--ink-faint)}
.wrap{max-width:1080px;margin:0 auto;display:grid;gap:14px}
.top{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px;display:grid;gap:10px}
.panel>h2{border-bottom:1px solid var(--line-soft);padding-bottom:6px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.field{display:grid;gap:4px;min-width:170px}.field label{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-faint)}
.field .value,.field select,.field input{background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:6px 8px}
table{width:100%;border-collapse:collapse;font-size:.86rem}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line-soft)}
th{font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-faint);font-weight:600}
td.num{text-align:right;font-family:var(--mono)}
.btn{background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:7px 12px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#0d1117;font-weight:600}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.tag{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:1px 8px;font-size:.72rem;color:var(--ink-dim)}
.tag.ok{color:var(--ok);border-color:#1f4d29}.tag.bad{color:var(--bad);border-color:#5a2320}.tag.warn{color:var(--warn);border-color:#4a3a17}
.notice{border:1px dashed var(--line);border-radius:var(--radius);padding:10px 12px;color:var(--ink-dim);background:#161619}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:820px){.grid2{grid-template-columns:1fr}}
.proto-note{position:fixed;top:0;left:0;right:0;z-index:60;padding:6px 14px;background:repeating-linear-gradient(45deg,#2a2113,#2a2113 10px,#241d11 10px,#241d11 20px);border-bottom:1px solid #4a3a17;color:var(--warn);font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.proto-bar{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:60;display:flex;gap:2px;align-items:center;padding:5px 7px;background:#0b0e13;border:1px solid var(--line);border-radius:999px;box-shadow:0 8px 30px rgba(0,0,0,.6);font-size:12px;max-width:95vw;flex-wrap:wrap;justify-content:center}
.proto-bar button{background:none;border:none;color:var(--ink-dim);padding:6px 10px;border-radius:999px}
.proto-bar button:hover{background:var(--panel-2);color:var(--ink)}.proto-bar button.on{background:var(--accent-dim);color:var(--ink)}
.proto-bar .label{padding:0 8px}.proto-bar .sep{color:var(--line)}

.dragrow .handle{cursor:grab;color:var(--ink-faint)}
.urlbtn{display:inline-flex;align-items:baseline;gap:6px;max-width:100%;background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:3px 8px;color:var(--ink);text-align:left}
.urlbtn:hover{border-color:var(--accent)}
.urlbtn .mono{overflow-wrap:anywhere}
.urlbtn .edit{color:var(--accent);font-size:10px;letter-spacing:.06em;text-transform:uppercase}
.oresmd-overlay{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:18px}
.oresmd-frame{width:min(1120px,96vw);height:min(840px,92vh);border:1px solid var(--line);border-radius:var(--radius);background:var(--bg)}
.pc{margin:0}.pc svg{display:block;background:var(--panel-2);border:1px solid var(--line);border-radius:6px}.pc figcaption{margin-top:6px;font-size:.78rem}.pc-legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:6px;font-size:.78rem;color:var(--ink-dim)}.pc-legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}</style>
</head>
<body>

<!--
  PROTOTYPE. Throwaway. Mock data, no backend, no build step, no session.

  The trader's "Manage a curve's blueprint" screen
  (doc/knowledge/journeys/market_data/journey_manage-a-curves-blueprint.org):
  the curve's identity and family role at the top, its output series and
  discount curve, the pillar instruments in order, and the bootstrap method,
  interpolation, day count, tenor convention and split tenor below them, so the
  person reads cause above effect. A saved blueprint is a candidate; nothing is
  published and no curve is built.

  The design question is the shape of the pillar editor. Variants with
  ?variant=a|b|c: a is one flat pillared table, b groups the pillars by
  instrument kind (deposit, future, swap), c is a drag-ordered list.

  Every variant draws the pillar ladder and the segment chart under its editor.
  The ladder marks one point per pillar, in blueprint sequence order, at the
  pillar's end tenor and colours it by curve role; the segment chart shows the
  interval from the previous pillar's tenor to the pillar's tenor, in months.
  Both read the shape the blueprint declares. Neither prices an instrument.

  ?state=funding|projection|empty switches the mock. The projection state has
  no discount curve and the server refuses the save. The empty state has no
  pillars, so the chart panel shows an explanatory empty state. Nothing reads a
  service.
-->

<div class="proto-note" id="note"></div>
<div class="wrap" id="app"></div>
<div class="proto-bar" id="bar"></div>

<script>
const params = new URLSearchParams(location.search);
const variant = params.get('variant') || 'a';
const state = params.get('state') || 'funding';

const pillars = [
  {seq:0, start:'SPOT', end:'1M',  role:'DEPOSIT', instrument:'USD SOFR 1M deposit', market:4.3120},
  {seq:1, start:'SPOT', end:'3M',  role:'DEPOSIT', instrument:'USD SOFR 3M deposit', market:4.3450},
  {seq:2, start:'SPOT', end:'6M',  role:'DEPOSIT', instrument:'USD SOFR 6M deposit', market:4.3760},
  {seq:3, start:'3M',   end:'6M',  role:'FRA',     instrument:'3x6 SOFR FRA',         market:4.3580},
  {seq:4, start:'6M',   end:'1Y',  role:'FRA',     instrument:'6x12 SOFR FRA',        market:4.3910},
  {seq:5, start:'SPOT', end:'2Y',  role:'SWAP',    instrument:'2Y SOFR swap',         market:4.3550},
  {seq:6, start:'SPOT', end:'5Y',  role:'SWAP',    instrument:'5Y SOFR swap',         market:4.2480},
  {seq:7, start:'SPOT', end:'10Y', role:'SWAP',    instrument:'10Y SOFR swap',        market:4.1850},
  {seq:8, start:'SPOT', end:'30Y', role:'SWAP',    instrument:'30Y SOFR swap',        market:3.9110}
];

const blueprints = {
  funding: {
    currency:'USD', role:'FUNDING', version:'4',
    derivation:'IR_CURVE_BOOTSTRAP (stamped on first build)',
    series:'oresmd://ir/USD?type=curve&amp;family=FUNDING',
    discount:null, discountText:'none for FUNDING', pillars
  },
  projection: {
    currency:'USD', role:'PROJECTION', version:'1', derivation:'IR_CURVE_BOOTSTRAP (not stamped yet)',
    series:'oresmd://ir/USD?type=curve&amp;family=PROJECTION&amp;index=SOFR',
    discount:null, discountText:'— choose a FUNDING blueprint —',
    pillars: pillars.map(p => p.role === 'DEPOSIT' ? {...p, market:p.market + 0.0100} : p)
  },
  empty: {
    currency:'USD', role:'(not set)', version:'new', derivation:'not stamped until the first build',
    series:'(minted on first save)', discount:null, discountText:'— choose a FUNDING blueprint —', pillars:[]
  }
};

const bp = blueprints[state];
let rows = bp.pillars.map(p => ({...p}));
const kindLabel = {DEPOSIT:'Deposit', FRA:'Future (FRA)', SWAP:'Swap'};
const history = [
  {v:'4', when:'2026-10-06 14:12', by:'a.reyes (trader)', what:'added pillar 8, SPOT → 30Y SWAP'},
  {v:'3', when:'2026-09-29 09:41', by:'m.oduya (quant)', what:'moved split tenor 1Y → 2Y'},
  {v:'2', when:'2026-09-14 16:03', by:'j.silva (market data ops)', what:'added pillars 3 and 4, the 3x6 and 6x12 FRA'}
];

function urlButton(url){
  return `<button class="urlbtn" type="button" data-url="${url}" title="Edit in the oresmd URL editor">`+
         `<span class="mono">${url}</span><span class="edit">edit</span></button>`;
}
function openOresmdEditor(url, host){
  const ov=document.createElement('div'); ov.className='oresmd-overlay';
  const f=document.createElement('iframe'); f.className='oresmd-frame'; f.title='oresmd URL editor';
  f.src='../oresmd-url-editor/index.html?embed=1&url='+encodeURIComponent(url||'');
  ov.appendChild(f); document.body.appendChild(ov);
  function close(){ window.removeEventListener('message', onMsg); document.removeEventListener('keydown', onKey); ov.remove(); }
  function onMsg(e){ if(e.data && e.data.type==='oresmd-url'){ host.dataset.url=e.data.url; const m=host.querySelector('.mono'); if(m) m.textContent=e.data.url; close(); } }
  function onKey(e){ if(e.key==='Escape') close(); }
  window.addEventListener('message', onMsg); document.addEventListener('keydown', onKey);
  ov.addEventListener('click', e=>{ if(e.target===ov) close(); });
}
document.addEventListener('click', e=>{
  const b=e.target.closest('.urlbtn'); if(!b) return;
  openOresmdEditor(b.dataset.url||'', b);
});
function tag(text, kind){ return `<span class="tag ${kind||''}">${text}</span>`; }
function mv(p){ return p.market == null ? '—' : p.market.toFixed(4); }

function identity(){
  const missing = bp.role === 'PROJECTION' && !bp.discount;
  return `
  <div class="top">
    <h1>Curve blueprint: ${bp.currency} / ${bp.role}</h1>
    <span class="muted">candidate · not published</span>
    <a style="margin-left:auto" href="../../knowledge/journeys/market_data/journey_manage-a-curves-blueprint.html">the journey &rarr;</a>
  </div>
  <div class="panel">
    <h2>Identity and family role</h2>
    <div class="row">
      <div class="field"><label>Currency</label><div class="value">${bp.currency}</div></div>
      <div class="field"><label>Family role</label><select><option>${bp.role}</option><option>FUNDING</option><option>PROJECTION</option></select></div>
      <div class="field"><label>Version</label><div class="value mono">${bp.version}</div></div>
    </div>
    <div class="row">
      <div class="field" style="flex:1"><label>Output series (oresmd URI)</label><div class="value mono">${bp.series.startsWith('oresmd://') ? urlButton(bp.series) : bp.series}</div></div>
      <div class="field" style="flex:1"><label>Discount curve (PROJECTION only)</label><div class="value mono">${bp.discountText}</div></div>
    </div>
    <div class="row"><div class="field" style="flex:1"><label>Derivation stamp</label><div class="value">${bp.derivation}</div></div></div>
    ${missing ? `<div class="notice" style="border-color:#5a2320;color:var(--ink-dim)">${tag('discount curve required','bad')} The server refuses a projection that discounts off nothing. Pick this currency's FUNDING blueprint before the save.</div>`
      : `<div class="notice">A blueprint has no name: the screen titles it by the output series' oresmd URI. The URI is the identity at the wire.</div>`}
  </div>`;
}

function flatTable(){
  if(!rows.length) return `<div class="panel"><h2>Pillars</h2><div class="notice">New blueprint: no pillars yet. Add one to start the list; the bootstrap reads the list in sequence order.</div><div class="row"><button class="btn" data-add>Add pillar</button></div></div>`;
  return `
  <div class="panel">
    <h2>Pillars — one flat list</h2>
    <table>
      <thead><tr><th>#</th><th>Start tenor</th><th>End tenor</th><th>Curve role</th><th>Instrument</th><th class="num">Market</th><th>Split</th></tr></thead>
      <tbody>${rows.map((p, i) => `<tr>
        <td class="mono">${i}</td><td class="mono">${p.start}</td><td class="mono">${p.end}</td>
        <td>${p.role}</td><td class="muted">${p.instrument}</td><td class="num">${mv(p)}</td>
        <td>${p.end === '1Y' ? tag('split tenor','warn') : ''}</td></tr>`).join('')}</tbody>
    </table>
    <div class="row"><button class="btn" data-add>Add pillar</button>
      <span class="faint">Reorder rewrites sequence; each row is written as a new bitemporal version.</span></div>
  </div>`;
}

function groupedTable(){
  const groups = ['DEPOSIT','FRA','SWAP'].map(k => {
    const g = rows.filter(p => p.role === k);
    if(!g.length) return '';
    return `<div class="muted mono">${kindLabel[k]} · ${g.length} pillar${g.length > 1 ? 's' : ''}</div>
    <table><thead><tr><th>#</th><th>Start</th><th>End</th><th>Instrument</th><th class="num">Market</th></tr></thead>
    <tbody>${g.map(p => `<tr><td class="mono">${rows.indexOf(p)}</td><td class="mono">${p.start}</td><td class="mono">${p.end}</td>
      <td class="muted">${p.instrument}</td><td class="num">${mv(p)}</td></tr>`).join('')}</tbody></table>`;
  }).join('');
  return `
  <div class="panel">
    <h2>Pillars — grouped by instrument kind</h2>
    ${groups || `<div class="notice">New blueprint: no pillars yet.</div>`}
    <div class="notice">A segment is contiguous pillars of one kind: deposits to 6M, FRA 3M → 1Y, swaps from 2Y. The group boundary is the split tenor.</div>
    <div class="row"><button class="btn" data-add>Add pillar</button></div>
  </div>`;
}

function dragList(){
  if(!rows.length) return `<div class="panel"><h2>Pillars — drag order</h2><div class="notice">New blueprint: no pillars yet.</div><div class="row"><button class="btn" data-add>Add pillar</button></div></div>`;
  return `
  <div class="panel">
    <h2>Pillars — ordered list, dragged into place</h2>
    <div style="display:grid;gap:6px">${rows.map((p, i) => `
      <div class="dragrow">
        <span class="handle mono" title="drag to reorder">&#9776;</span>
        <span class="mono faint">${String(i).padStart(2,'0')}</span>
        <span class="mono">${p.start} &rarr; ${p.end}</span>
        <span class="tag">${p.role}</span>
        <span class="muted">${p.instrument}</span>
        <span class="mono" style="margin-left:auto">${mv(p)}</span>
        <button class="btn" data-up="${i}" ${i === 0 ? 'disabled' : ''}>&uarr;</button>
        <button class="btn" data-down="${i}" ${i === rows.length - 1 ? 'disabled' : ''}>&darr;</button>
        <button class="btn" data-rm="${i}">Remove</button>
      </div>`).join('')}</div>
    <div class="row"><button class="btn" data-add>Add pillar</button>
      <span class="faint">The list is the sequence; the bootstrap reads it top to bottom.</span></div>
  </div>`;
}

// Curve roles take distinct helper colours so the ladder legend reads at a glance.
// The palette reads PC.colours at call time, after the helper block is initialized.
function colourFor(role){
  const palette = {DEPOSIT:PC.colours.accent, FRA:PC.colours.warn, SWAP:PC.colours.ok,
                   FUTURE:PC.colours.bad, OIS:'#a371f7', XCCY:'#39c5cf'};
  return palette[role] || PC.colours.dim;
}

// A tenor code as months, so tenors compare and subtract. SPOT is zero.
function tenorMonths(t){
  const s = String(t == null ? '' : t).trim().toUpperCase();
  if(s === 'SPOT' || s === 'Z' || s === '0') return 0;
  const m = s.match(/^(\d+(?:\.\d+)?)\s*([DWMY])$/);
  if(!m) return 0;
  const n = parseFloat(m[1]);
  return m[2] === 'D' ? n / 30 : m[2] === 'W' ? n * 12 / 52 : m[2] === 'M' ? n : n * 12;
}
function monthsLabel(v){
  if(v == null) return '—';
  return (Number.isInteger(v) ? v : v.toFixed(1)) + 'M';
}

// The ladder: one point per pillar, in blueprint order, at its end tenor.
// A pillar without a quote sits at a nominal level that only marks its presence.
function ladderChart(){
  const known = rows.map(p => p.market).filter(v => v != null);
  let lo = known.length ? Math.min(...known) : 0;
  let hi = known.length ? Math.max(...known) : 1;
  if(!(hi > lo)) hi = lo + 0.01;
  const points = rows.map(p => p.market);
  const missing = points.map((v, i) => v == null ? i : -1).filter(i => i >= 0);
  missing.forEach((idx, k) => { points[idx] = lo + (hi - lo) * (k + 1) / (missing.length + 1); });
  const x = rows.map((_, i) => rows.length > 1 ? i / (rows.length - 1) : 0);
  const ticks = rows.map((p, i) => ({at:x[i], label:p.end}));
  const roles = [...new Set(rows.map(p => p.role))];
  const series = roles.map(role => ({
    name: role, color: colourFor(role), markers: true, width: 2,
    points: rows.map((p, i) => p.role === role ? points[i] : null)
  }));
  const notes = missing.length
    ? [`${missing.length} pillar${missing.length > 1 ? 's' : ''} at a nominal level: present in the ladder, no quote yet`]
    : [];
  return PC.line({
    series, x, ticks, h: 260, yFmt: v => v.toFixed(3),
    yLabel:'Quote (mock) — nominal level marks a pillar with no quote',
    notes,
    caption:'The shape of the term structure the blueprint declares: one point per pillar in blueprint sequence order, at the pillar\u2019s end tenor, coloured by curve role. This is not a built curve — no instrument is priced and no discount factors exist yet. Points sit at sequence positions, not on a tenor scale; the segment chart below carries the real spacing.'
  });
}

// The segments: the interval from the previous pillar's tenor to this one, in months.
function segmentChart(){
  const bars = rows.map((p, i) => {
    const prev = i === 0 ? 0 : tenorMonths(rows[i - 1].end);
    const end = tenorMonths(p.end);
    return {
      label: `${i === 0 ? 'SPOT' : rows[i - 1].end} \u2192 ${p.end}`,
      value: Math.max(0, end - prev),
      color: colourFor(p.role)
    };
  });
  return PC.bars({
    bars, h: 240, yFmt: monthsLabel, yLabel:'Segment (months)',
    caption:'The ladder\u2019s spacing: each bar is the interval from the previous pillar\u2019s tenor to this pillar\u2019s tenor, in months. The short bars at the short end are that concentration; the 30Y pillar carries the long tail. Colour repeats the curve role from the ladder.'
  });
}

function chartsPanel(){
  if(!rows.length) return `
  <div class="panel">
    <h2>Pillar ladder and segments</h2>
    <div class="notice">New blueprint: no pillars yet, so there is no ladder to draw. Add a pillar above; the ladder then marks one point per pillar at its end tenor, and the segment chart draws the interval between neighbouring tenors. The bootstrap reads the pillar list in sequence order.</div>
  </div>`;
  return `
  <div class="panel">
    <h2>Pillar ladder — the shape the blueprint declares</h2>
    ${ladderChart()}
    ${segmentChart()}
  </div>`;
}

function conventions(){
  return `
  <div class="panel">
    <h2>Bootstrap method and conventions</h2>
    <div class="row">
      <div class="field"><label>Interpolation</label><select><option>LOG_LINEAR_DISCOUNT</option><option>CUBIC_SPLINE</option><option>FLAT_FORWARD_THEN_LOG_LINEAR</option></select></div>
      <div class="field"><label>Day count</label><select><option>A365</option><option>ACT/360</option><option>30/360</option><option>ACT/ACT</option></select></div>
      <div class="field"><label>Tenor convention</label><select><option>RATES_SPOT_FORWARD</option><option>RATES_SPOT_FOMC</option></select></div>
      <div class="field"><label>Split tenor</label><select><option>1Y</option><option>2Y</option><option>6M</option></select></div>
    </div>
    <div class="notice">Single-segment method: the split tenor is the last pillar's end tenor, offered from the same tenor list. The pillar tenors are soft references: a code the list does not hold is marked, not refused.</div>
  </div>`;
}

function historyPanel(){
  return `
  <div class="panel">
    <h2>Version history</h2>
    <table><thead><tr><th>Version</th><th>Written</th><th>By</th><th>Change from the one before</th></tr></thead>
    <tbody>${history.map(h => `<tr><td class="mono">${h.v}</td><td class="faint">${h.when}</td><td>${h.by}</td><td class="muted">${h.what}</td></tr>`).join('')}</tbody></table>
    <div class="notice">A revert is a new version, not a deletion. The history names the writer alone: no approval kind covers a blueprint change yet.</div>
  </div>`;
}

function footer(){
  return `
  <div class="panel">
    <div class="row">
      <button class="btn primary" id="save">Save blueprint</button>
      <button class="btn">History</button>
      <span class="faint" id="save-note"></span>
    </div>
    <div class="notice">Not published: build a curve from this blueprint and publish that output curve before pricing can read it. Saving is two writes, not one.</div>
  </div>`;
}

// Prototype plotting helper. Throwaway, dependency-free, dark-theme SVG.
// Each function returns an HTML string, so a page calls host.innerHTML = PC.line({...}).
// Prefixed PC to stay clear of page-local names; the pages also define `tag`.
const PC = (() => {
  const C = {grid:'#21262d', axis:'#30363d', text:'#71717a', dim:'#a1a1aa',
             ink:'#e3e3e6', accent:'#58a6ff', ok:'#3fb950', warn:'#d29922', bad:'#f85149'};
  const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const fmt = (v, d) => v == null ? '—' : (typeof v === 'number' ? v.toFixed(d ?? 2) : String(v));
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  // A blue -> amber ramp for a heat cell, t in 0..1.
  function heatColour(t){
    const stops = [[13,23,38],[21,60,110],[32,110,170],[88,166,255],[210,153,34],[248,81,73]];
    const p = clamp(t, 0, 1) * (stops.length - 1), i = Math.floor(p), f = p - i;
    const a = stops[i], b = stops[Math.min(stops.length - 1, i + 1)];
    return `rgb(${a.map((x, k) => Math.round(x + (b[k] - x) * f)).join(',')})`;
  }

  // Shared frame: margins, y gridlines and labels for a value axis.
  function frame(o){
    const w = o.w || 940, h = o.h || 300;
    const pad = Object.assign({l:64, r:18, t:16, b:40}, o.pad || {});
    const x0 = pad.l, x1 = w - pad.r, y0 = h - pad.b, y1 = pad.t;
    const vals = (o.series || []).flatMap(s => s.points || []).filter(v => v != null)
      .concat(o.extra || []);
    let lo = Math.min(...vals), hi = Math.max(...vals);
    if (o.zero) { lo = Math.min(lo, 0); hi = Math.max(hi, 0); }
    if (!(hi > lo)) { hi = lo + 1; }
    const span = hi - lo, l2 = lo - span * 0.08, h2 = hi + span * 0.08;
    const y = v => y0 - (v - l2) * (y0 - y1) / (h2 - l2);
    const X = o.x ? (i => x0 + o.x[i] * (x1 - x0))
                  : (i => x0 + i * (x1 - x0) / Math.max(1, (o.ticks ? o.ticks.length : 1) - 1));
    const yTicks = [];
    const steps = o.ySteps || 4;
    for (let k = 0; k <= steps; k++) {
      const v = l2 + (h2 - l2) * k / steps;
      yTicks.push(`<line x1="${x0}" y1="${y(v).toFixed(1)}" x2="${x1}" y2="${y(v).toFixed(1)}" stroke="${C.grid}"/>
        <text x="${x0 - 8}" y="${(y(v) + 3.5).toFixed(1)}" fill="${C.text}" font-size="10" text-anchor="end">${esc((o.yFmt || (v => fmt(v)))(v))}</text>`);
    }
    const xTicks = (o.ticks || []).map(t => {
      const px = o.x ? x0 + t.at * (x1 - x0) : X(t.at);
      return `<text x="${px.toFixed(1)}" y="${h - pad.b + 15}" fill="${C.text}" font-size="10" text-anchor="middle">${esc(t.label)}</text>`;
    }).join('');
    const grid = (o.xticks || []).map(t => {
      const px = o.x ? x0 + t.at * (x1 - x0) : X(t.at);
      return `<line x1="${px.toFixed(1)}" y1="${y1}" x2="${px.toFixed(1)}" y2="${y0}" stroke="${C.grid}" stroke-dasharray="2 3"/>`;
    }).join('');
    return {w, h, x0, x1, y0, y1, y, X, l2, h2, frame: yTicks.join('') + grid + xTicks};
  }

  function line(o){
    const f = frame(o);
    const bands = (o.bands || []).map(b => {
      const xa = f.x0 + b.from * (f.x1 - f.x0), xb = f.x0 + b.to * (f.x1 - f.x0);
      return `<rect x="${xa.toFixed(1)}" y="${f.y1}" width="${(xb - xa).toFixed(1)}" height="${(f.y0 - f.y1).toFixed(1)}"
        fill="${b.color || C.accent}" opacity=".08"/>` +
        (b.label ? `<text x="${((xa + xb) / 2).toFixed(1)}" y="${f.y1 + 11}" fill="${C.text}" font-size="9" text-anchor="middle">${esc(b.label)}</text>` : '');
    }).join('');
    const paths = (o.series || []).map(s => {
      let d = '', pen = false;
      s.points.forEach((v, i) => {
        if (v == null) { pen = false; return; }
        d += (pen ? 'L' : 'M') + f.X(i).toFixed(1) + ',' + f.y(v).toFixed(1) + ' ';
        pen = true;
      });
      const marks = s.markers ? s.points.map((v, i) => v == null ? '' :
        `<circle cx="${f.X(i).toFixed(1)}" cy="${f.y(v).toFixed(1)}" r="${s.r || 3.4}" fill="${s.color}"/>`).join('') : '';
      return `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="${s.width || 2}"${s.dash ? ` stroke-dasharray="${s.dash}"` : ''}/>${marks}`;
    }).join('');
    const legend = o.legend === false ? '' : `<div class="pc-legend">${(o.series || []).map(s =>
      `<span><i style="background:${s.color}"></i>${esc(s.name)}</span>`).join('')}${(o.notes || []).map(n =>
      `<span class="faint">${n}</span>`).join('')}</div>`;
    return `<figure class="pc"><svg viewBox="0 0 ${f.w} ${f.h}" width="100%" height="${f.h}" role="img" aria-label="${esc(o.title || 'chart')}">
      ${bands}${f.frame}${paths}
      ${o.yLabel ? `<text x="14" y="${(f.y0 + f.y1) / 2}" fill="${C.text}" font-size="10" transform="rotate(-90 14 ${(f.y0 + f.y1) / 2})" text-anchor="middle">${esc(o.yLabel)}</text>` : ''}
    </svg>${legend}${o.caption ? `<figcaption class="faint">${o.caption}</figcaption>` : ''}</figure>`;
  }

  function bars(o){
    const f = frame(Object.assign({zero: true}, o));
    const n = o.bars.length, bw = (f.x1 - f.x0) / n;
    const zero = f.y(0);
    const body = o.bars.map((b, i) => {
      const v = b.value == null ? null : b.value;
      const x = f.x0 + i * bw + bw * 0.18, w = bw * 0.64;
      const yv = v == null ? zero : f.y(v);
      const top = Math.min(yv, zero), hgt = Math.abs(zero - yv);
      const col = b.color || (v == null ? C.text : v >= 0 ? C.warn : C.accent);
      return `<rect x="${x.toFixed(1)}" y="${top.toFixed(1)}" width="${w.toFixed(1)}" height="${Math.max(1, hgt).toFixed(1)}" fill="${col}" opacity=".85"><title>${esc(b.label)}: ${esc(fmt(v))}</title></rect>
        <text x="${(x + w / 2).toFixed(1)}" y="${(f.h - 24)}" fill="${C.text}" font-size="9" text-anchor="middle">${esc(b.label)}</text>`;
    }).join('');
    return `<figure class="pc"><svg viewBox="0 0 ${f.w} ${f.h}" width="100%" height="${f.h}" role="img" aria-label="${esc(o.title || 'bars')}">
      ${f.frame}<line x1="${f.x0}" y1="${zero}" x2="${f.x1}" y2="${zero}" stroke="${C.axis}"/>${body}</svg>
      ${o.caption ? `<figcaption class="faint">${o.caption}</figcaption>` : ''}</figure>`;
  }

  // A surface as a shaded mesh grid: one cell per (row, column).
  function heat(o){
    const rows = o.rows, cols = o.cols;
    const cw = o.cell || 54, ch = o.cellH || 30, l = 58, t = 26;
    const w = l + cols.length * cw + (o.legend === false ? 14 : 92);
    const h = t + rows.length * ch + 34;
    const vals = [];
    rows.forEach((_, i) => cols.forEach((_, j) => { const v = o.value(i, j); if (v != null) vals.push(v); }));
    const lo = Math.min(...vals), hi = Math.max(...vals), span = (hi - lo) || 1;
    const cells = [];
    rows.forEach((r, i) => cols.forEach((c, j) => {
      const v = o.value(i, j);
      const x = l + j * cw, y = t + i * ch;
      const col = v == null ? '#161619' : heatColour((v - lo) / span);
      cells.push(`<rect x="${x}" y="${y}" width="${cw - 2}" height="${ch - 2}" rx="2" fill="${col}"><title>${esc(r.label)} · ${esc(c.label)}: ${esc(fmt(v, o.dp))}</title></rect>`);
      if (o.showValues !== false) cells.push(`<text x="${(x + (cw - 2) / 2).toFixed(1)}" y="${(y + ch / 2 + 3.5).toFixed(1)}" fill="${(v != null && (v - lo) / span > 0.55) ? '#0d1117' : C.ink}" font-size="9.5" text-anchor="middle">${esc(fmt(v, o.dp ?? 1))}</text>`);
    }));
    const rowLabels = rows.map((r, i) => `<text x="${l - 8}" y="${(t + i * ch + ch / 2 + 3.5).toFixed(1)}" fill="${C.text}" font-size="10" text-anchor="end">${esc(r.label)}</text>`).join('');
    const colLabels = cols.map((c, j) => `<text x="${(l + j * cw + (cw - 2) / 2).toFixed(1)}" y="${t - 8}" fill="${C.text}" font-size="10" text-anchor="middle">${esc(c.label)}</text>`).join('');
    const legend = o.legend === false ? '' : (() => {
      const bx = l + cols.length * cw + 14, by = t, bh = rows.length * ch - 2;
      const steps = 24, sh = bh / steps;
      let g = '';
      for (let k = 0; k < steps; k++) g += `<rect x="${bx}" y="${(by + k * sh).toFixed(1)}" width="12" height="${(sh + 1).toFixed(1)}" fill="${heatColour(1 - k / (steps - 1))}"/>`;
      return `<g>${g}<text x="${bx + 18}" y="${by + 8}" fill="${C.text}" font-size="9">${esc(fmt(hi, o.dp))}</text>
        <text x="${bx + 18}" y="${by + bh}" fill="${C.text}" font-size="9">${esc(fmt(lo, o.dp))}</text></g>`;
    })();
    return `<figure class="pc"><svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" role="img" aria-label="${esc(o.title || 'heat map')}">
      ${cells.join('')}${rowLabels}${colLabels}${legend}
      ${o.xLabel ? `<text x="${(l + cols.length * cw / 2).toFixed(1)}" y="${h - 6}" fill="${C.text}" font-size="10" text-anchor="middle">${esc(o.xLabel)}</text>` : ''}
      ${o.yLabel ? `<text x="12" y="${(t + rows.length * ch / 2).toFixed(1)}" fill="${C.text}" font-size="10" transform="rotate(-90 12 ${(t + rows.length * ch / 2).toFixed(1)})" text-anchor="middle">${esc(o.yLabel)}</text>` : ''}
    </svg>${o.caption ? `<figcaption class="faint">${o.caption}</figcaption>` : ''}</figure>`;
  }

  // A surface as an isometric wireframe: rows and columns joined over a height.
  function mesh(o){
    const w = o.w || 940, h = o.h || 420;
    const rows = o.z.length, cols = o.z[0].length;
    const vals = o.z.flat().filter(v => v != null);
    const lo = Math.min(...vals), hi = Math.max(...vals), span = (hi - lo) || 1;
    const ox = o.ox ?? w * 0.52;
    const sy = o.sy ?? Math.min(22, h / (2 * Math.max(1, (rows - 1) + (cols - 1))));
    const sx = o.sx ?? Math.min(46, (w * 0.6) / Math.max(1, (rows - 1) + (cols - 1)));
    const sz = o.sz ?? h * 0.34;
    const oy = o.oy ?? h - 26 - ((rows - 1) + (cols - 1)) * sy;
    const P = (i, j) => {
      const v = o.z[i][j];
      const z = v == null ? 0 : (v - lo) / span;
      return [ox + (j - i) * sx, oy + (i + j) * sy - z * sz, z];
    };
    const lines = [];
    for (let i = 0; i < rows; i++) {
      let d = '';
      for (let j = 0; j < cols; j++) { const p = P(i, j); d += (j ? 'L' : 'M') + p[0].toFixed(1) + ',' + p[1].toFixed(1) + ' '; }
      lines.push(`<path d="${d}" fill="none" stroke="${C.accent}" stroke-width="1.4" opacity=".75"/>`);
    }
    for (let j = 0; j < cols; j++) {
      let d = '';
      for (let i = 0; i < rows; i++) { const p = P(i, j); d += (i ? 'L' : 'M') + p[0].toFixed(1) + ',' + p[1].toFixed(1) + ' '; }
      lines.push(`<path d="${d}" fill="none" stroke="${C.warn}" stroke-width="1" opacity=".5"/>`);
    }
    const rowL = (o.rows || []).map((r, i) => { const p = P(i, 0); return `<text x="${(p[0] - 12).toFixed(1)}" y="${(p[1] + 4).toFixed(1)}" fill="${C.text}" font-size="10" text-anchor="end">${esc(r.label)}</text>`; }).join('');
    const colL = (o.cols || []).map((c, j) => { const p = P(rows - 1, j); return `<text x="${(p[0] + 10).toFixed(1)}" y="${(p[1] + 4).toFixed(1)}" fill="${C.text}" font-size="10">${esc(c.label)}</text>`; }).join('');
    const axis = `<text x="14" y="${h - 12}" fill="${C.text}" font-size="10">height: ${esc(o.zLabel || 'value')} ${esc(fmt(lo, o.dp))}–${esc(fmt(hi, o.dp))}</text>`;
    return `<figure class="pc"><svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" role="img" aria-label="${esc(o.title || 'surface mesh')}">
      ${lines.join('')}${rowL}${colL}${axis}</svg>
      <div class="pc-legend"><span><i style="background:${C.accent}"></i>expiry</span><span><i style="background:${C.warn}"></i>strike</span>${(o.notes || []).map(n => `<span class="faint">${n}</span>`).join('')}</div>
      ${o.caption ? `<figcaption class="faint">${esc(o.caption)}</figcaption>` : ''}</figure>`;
  }

  return {line, bars, heat, mesh, colours: C, heatColour};
})();
function render(){
  const pills = variant === 'b' ? groupedTable() : variant === 'c' ? dragList() : flatTable();
  document.getElementById('app').innerHTML = identity() + pills + chartsPanel() + conventions() + historyPanel() + footer();
  document.querySelectorAll('#app [data-add]').forEach(b => b.onclick = () => {
    rows.push({seq:rows.length, start:'SPOT', end:'1Y', role:'SWAP', instrument:'new pillar — pick an instrument', market:null}); render();
  });
  document.querySelectorAll('#app [data-rm]').forEach(b => b.onclick = () => { rows.splice(+b.dataset.rm, 1); render(); });
  document.querySelectorAll('#app [data-up]').forEach(b => b.onclick = () => { const i = +b.dataset.up; [rows[i-1], rows[i]] = [rows[i], rows[i-1]]; render(); });
  document.querySelectorAll('#app [data-down]').forEach(b => b.onclick = () => { const i = +b.dataset.down; [rows[i+1], rows[i]] = [rows[i], rows[i+1]]; render(); });
  document.getElementById('save').onclick = () => {
    document.getElementById('save-note').textContent = bp.role === 'PROJECTION' && !bp.discount
      ? 'refused: projection has no discount curve' : `config v${bp.version} and ${rows.length} pillar rows written`;
  };
  document.getElementById('note').textContent = `Prototype · manage a curve's blueprint · variant ${variant.toUpperCase()} · ${bp.role.toLowerCase()} · candidate, nothing published`;
  document.getElementById('bar').innerHTML =
    `<span class="label">Pillar editor</span>` +
    ['a','b','c'].map(v => `<button data-v="${v}" class="${v === variant ? 'on' : ''}">${v.toUpperCase()}</button>`).join('') +
    `<span class="sep">|</span><span class="label">Blueprint</span>` +
    ['funding','projection','empty'].map(s => `<button data-s="${s}" class="${s === state ? 'on' : ''}">${s}</button>`).join('');
  document.querySelectorAll('#bar [data-v]').forEach(b => b.onclick = () => set('variant', b.dataset.v));
  document.querySelectorAll('#bar [data-s]').forEach(b => b.onclick = () => set('state', b.dataset.s));
}
function set(k, v){ const p = new URLSearchParams(location.search); p.set(k, v); location.search = p.toString(); }
render();
</script>
</body>
