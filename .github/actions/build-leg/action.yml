---
name: Build a leg
description: >-
  What a leg does once its platform is prepared: bring up the services, build
  and test, publish what the leg produces, and keep the compiler cache.

# What a leg does once its platform is prepared: bring up the services, build
# and test, publish what the leg produces, and keep the compiler cache. The
# caller owns the parts that belong to a job — the runner, the container, the
# matrix entry, the permissions — and prepares its own platform, which is the
# part that genuinely differs between Linux, macOS and Windows.
#
# Adding a leg is therefore a matrix entry and a call, not a fifth copy of
# these steps.

inputs:
  family:
    description: The platform of this leg, as it appears in a preset name.
    required: true
  compiler:
    description: The compiler of this leg, as it appears in a preset name.
    required: true
  buildtype:
    description: The build type of this leg, as it appears in a preset name.
    required: true
  tier:
    description: >-
      nightly builds the package and runs the suites under valgrind on debug;
      continuous proves the tree builds, collects coverage on debug, and builds
      the package only for the release of a tag.
    required: true
  persist-cache:
    description: >-
      'true' when this leg keeps its compiler cache between runs, which is the
      two Linux workflows.
    required: true

runs:
  using: composite
  steps:
    - uses: ./.github/actions/setup-postgres

    - uses: ./.github/actions/install-compass

    - uses: ./.github/actions/init-environment

    - uses: ./.github/actions/setup-nats

    - uses: ./.github/actions/start-nats

    - uses: ./.github/actions/create-database

    - name: get-cmake
      # The Linux legs run in an image that carries CMake; the hosted macOS and
      # Windows images do not carry the version the tree needs.
      if: runner.os != 'Linux'
      uses: lukka/get-cmake@v4.5.0

    - name: Cache vcpkg binary packages
      uses: actions/cache@v6
      with:
        path: ${{ github.workspace }}/vcpkg-cache
        key: vcpkg-${{ inputs.family }}-${{ inputs.compiler }}-${{ inputs.buildtype }}-ninja-${{ hashFiles('vcpkg.json') }}
        restore-keys: |
          vcpkg-${{ inputs.family }}-${{ inputs.compiler }}-${{ inputs.buildtype }}-ninja-

    - name: Run vcpkg
      uses: lukka/run-vcpkg@v11

    - name: Run CTest workflow
      if: runner.os == 'Linux'
      # The job limit is 360 minutes, and this is the heaviest configuration the
      # repository builds: debug with coverage, and on the nightly valgrind as
      # well. Uncapped, it ran to exactly 6h0m0s and was killed, leaving the
      # cache steps below roughly thirty seconds, which cannot upload a compiler
      # cache. Cap the step and leave the rest of the job to them.
      timeout-minutes: 350
      shell: bash
      run: |
        export CMAKE_BUILD_PARALLEL_LEVEL=$(nproc)
        export CTEST_PARALLEL_LEVEL=$(nproc)
        export PATH=${PATH}:/usr/sbin
        export ORES_BUILD_PROVIDER="github"
        export ORES_BUILD_COMMIT="${GITHUB_SHA}"
        export ORES_BUILD_NUMBER="${GITHUB_RUN_NUMBER}"
        export ORES_BUILD_TIMESTAMP=`date "+%Y/%m/%d %H:%M:%S"`
        export preset=${{ inputs.family }}-${{ inputs.compiler }}-${{ inputs.buildtype }}-ninja
        timeout_arg=()
        if [ "${{ inputs.tier }}" = "continuous" ]; then
            export ZIC=1
            # Continuous proves the tree builds and the suites pass, and its
            # debug build collects coverage, so that Continuous and the Nightly
            # Build measure the same configuration. The release build of a tag is
            # the Linux package of that release, so only it runs cpack.
            export cmake_args="build_group=Continuous,preset=${preset}"
            if [[ "${{ github.ref_type }}" != "tag" || "${{ inputs.buildtype }}" != "release" ]]; then
                cmake_args="${cmake_args},package=0"
            fi
            if [ "${{ inputs.buildtype }}" = "debug" ]; then
                cmake_args="${cmake_args},code_coverage=1,compress_debug_sections=1"
            fi
            df -h .
            du -sh .git llvm .sccache vcpkg-cache build/output "$RUNNER_TEMP" 2>/dev/null || true
        else
            export cmake_args="build_group=Nightly,preset=${preset}"
            # Coverage and valgrind are what make the debug job the heaviest
            # configuration built, and neither belongs on a release job. A suite
            # under valgrind takes up to an hour, so the cap stops one that hangs
            # from spending the step's budget, which ends the job before its
            # results are submitted.
            suite_timeout=12000
            if [ "${{ inputs.buildtype }}" = "debug" ]; then
                cmake_args="${cmake_args},code_coverage=1,with_memcheck=1"
                suite_timeout=5400
            fi
            timeout_arg=(--timeout ${suite_timeout})
        fi
        ctest -VV "${timeout_arg[@]}" --preset ${preset} --script "CTest.cmake,${cmake_args}"

    - name: Run CTest workflow
      if: runner.os == 'macOS'
      shell: bash
      run: |
        brew install autoconf automake libtool autoconf-archive
        export CMAKE_BUILD_PARALLEL_LEVEL=2
        export CTEST_PARALLEL_LEVEL=$(sysctl -n hw.logicalcpu)
        export CTEST_MAX_PARALLELISM=2
        export VCPKG_DISABLE_SYSTEM_PACKAGE_CHECK=1
        export ORES_BUILD_PROVIDER="github"
        export ORES_BUILD_COMMIT="${GITHUB_SHA}"
        export ORES_BUILD_NUMBER="${GITHUB_RUN_NUMBER}"
        export ORES_BUILD_TIMESTAMP=`date "+%Y/%m/%d %H:%M:%S"`
        export preset=${{ inputs.family }}-${{ inputs.compiler }}-${{ inputs.buildtype }}-ninja
        export cmake_args="build_group=Nightly,preset=${preset}"
        ctest -VV --preset ${preset} --script "CTest.cmake,${cmake_args}"

    - name: Run CTest workflow
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $env:VCPKG_DISABLE_SYSTEM_PACKAGE_CHECK=1
        $env:ORES_BUILD_PROVIDER="github"
        $env:ORES_BUILD_COMMIT="$env:GITHUB_SHA"
        $env:ORES_BUILD_NUMBER="$env:GITHUB_RUN_NUMBER"
        $env:ORES_BUILD_TIMESTAMP=Get-Date -format "yyyy/MM/dd HH:mm:ss"
        $preset="${{ inputs.family }}-${{ inputs.compiler }}-${{ inputs.buildtype }}-ninja"
        $cmake_args="build_group=Nightly,preset=$preset"
        ctest -VV --preset $preset --script "CTest.cmake,$cmake_args"

    - name: Check the script library dataset reproduces
      # Continuous only. The generator calls the shell the build above made, to
      # parse every script of ORE's library and derive its inputs; it fails when
      # the committed populate files differ from what it makes. It needs no
      # server, so it runs once the shell exists (step 5 of
      # external/ore/methodology.txt).
      if: runner.os == 'Linux' && inputs.tier == 'continuous'
      shell: bash
      run: |
        preset=${{ inputs.family }}-${{ inputs.compiler }}-${{ inputs.buildtype }}-ninja
        python3 external/ore/tools/generate_script_library.py --check \
          --shell ./build/output/${preset}/publish/bin/ores.shell

    - name: Start the transaction pooler
      # The image carries pgbouncer, so the job installs nothing. The
      # configuration is generated from the environment's own database users by
      # the script the unit uses too.
      if: runner.os == 'Linux' && inputs.tier == 'continuous'
      shell: bash
      run: ./build/scripts/start_ci_pooler.sh start 6432

    - name: Run the database suite through the transaction pooler
      # The suite is the one that exercises the prepared statements directly. It
      # runs from the built binary because the test environment is baked into
      # CTestTestfile.cmake at configure time; the binary reads its database from
      # the environment, so the port is the only thing that has to change. Cases
      # that need a direct connection carry the direct tag.
      if: runner.os == 'Linux' && inputs.tier == 'continuous'
      shell: bash
      run: |
        preset=${{ inputs.family }}-${{ inputs.compiler }}-${{ inputs.buildtype }}-ninja
        ORES_TEST_DB_HOST=127.0.0.1 ORES_TEST_DB_PORT=6432 \
          ./build/output/${preset}/publish/bin/ores.database.tests '~[direct]'

    - name: Stop the transaction pooler
      if: always() && runner.os == 'Linux' && inputs.tier == 'continuous'
      shell: bash
      run: ./build/scripts/start_ci_pooler.sh stop

    - name: Show sccache statistics
      # Read before the cache is stopped: a stopped server reports nothing, and
      # these numbers are what says whether the cache is warming. The legs that
      # keep their cache read it inside save-sccache, after the uploads.
      if: always() && inputs.persist-cache != 'true'
      shell: bash
      run: sccache --show-stats || true

    - name: Upload the package of a tag
      if: runner.os == 'Linux' && inputs.tier == 'continuous' && github.ref_type == 'tag' && inputs.buildtype == 'release'
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.family }}-${{ inputs.compiler }}-${{ inputs.buildtype }}-ninja
        path: ./build/output/${{ inputs.family }}-${{ inputs.compiler }}-${{ inputs.buildtype }}-ninja/packages/orestudio_*_amd64.deb
        if-no-files-found: error

    - name: Upload the memcheck logs when the run fails
      # A memcheck failure reports a count, not a stack: CTest says a test
      # carried "Defects: N" and the stacks stay in MemoryChecker.N.log in the
      # build tree, which the runner discards. Uploading them on failure is what
      # makes the count explainable afterwards.
      if: failure() && runner.os == 'Linux' && inputs.tier == 'nightly'
      uses: actions/upload-artifact@v7
      with:
        name: memcheck-logs-${{ inputs.family }}-${{ inputs.compiler }}-${{ inputs.buildtype }}
        if-no-files-found: ignore
        retention-days: 7
        # Every log CTest keeps, not a named few: a suite that a watchdog kills
        # reports through whichever file CTest chose to write.
        path: build/output/${{ inputs.family }}-${{ inputs.compiler }}-${{ inputs.buildtype }}-ninja/Testing/Temporary/*.log

    - name: Stage the release images
      # Only the release build is published: the debug build is several times
      # larger, and no host runs it. The runner's job container has no container
      # engine, so this stages the tree and the publish job builds the images
      # from it.
      #
      # The web bundle is part of the fleet, so a stage without it would silently
      # publish every image but ores-web. The build wires npm into CMake, so its
      # absence means the TypeScript build broke and the run should say so rather
      # than ship a fleet without the browser.
      if: runner.os == 'Linux' && inputs.tier == 'nightly' && inputs.buildtype == 'release' && inputs.compiler == 'clang'
      shell: bash
      run: |
        ./compass.sh image stage --preset ${{ inputs.family }}-${{ inputs.compiler }}-${{ inputs.buildtype }}-ninja
        if [[ ! -d build/docker-stage/web ]]; then
          echo "::error::the web bundle was not staged, so ores-web would not be published"
          exit 1
        fi

    - name: Upload the staged images
      if: runner.os == 'Linux' && inputs.tier == 'nightly' && inputs.buildtype == 'release' && inputs.compiler == 'clang'
      uses: actions/upload-artifact@v7
      with:
        # The shared libraries are most of the payload. The service binaries are
        # a few MB in total; the empty runtime directories are what the base
        # image copies. build/docker-stage/bin is left out: it fed the library
        # partition, which has already run.
        name: image-stage
        path: |
          build/docker-stage/libs
          build/docker-stage/services
          build/docker-stage/web
          build/docker-stage/log
          build/docker-stage/run
          build/docker-stage/storage
        retention-days: 1

    - name: Upload a Build Artifact
      # CTest.cmake builds no package for a macOS debug build.
      if: runner.os == 'macOS' && inputs.buildtype == 'release'
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.family }}-${{ inputs.compiler }}-${{ inputs.buildtype }}-ninja
        path: ./build/output/${{ inputs.family }}-${{ inputs.compiler }}-${{ inputs.buildtype }}-ninja/packages/OreStudio-*-Darwin.dmg
        if-no-files-found: error

    - name: Upload WiX log on failure
      if: failure() && runner.os == 'Windows' && inputs.compiler == 'msvc'
      uses: actions/upload-artifact@v7
      with:
        name: wix-log-${{ inputs.family }}-${{ inputs.compiler }}-${{ inputs.buildtype }}-ninja
        path: ./build/output/${{ inputs.family }}-${{ inputs.compiler }}-${{ inputs.buildtype }}-ninja/_CPack_Packages/win64/WIX/wix.log
        if-no-files-found: ignore

    - name: Upload artifact
      if: runner.os == 'Windows'
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.family }}-${{ inputs.compiler }}-${{ inputs.buildtype }}-ninja
        path: ./build/output/${{ inputs.family }}-${{ inputs.compiler }}-${{ inputs.buildtype }}-ninja/packages/OreStudio-*-win64.*
        if-no-files-found: error

    - name: Report disk usage after build
      if: always() && runner.os == 'Linux' && inputs.tier == 'continuous'
      shell: bash
      run: |
        df -h .
        du -sh .git llvm .sccache vcpkg-cache build/output "$RUNNER_TEMP" 2>/dev/null || true

    # The steps below ran after any CTest step that was reached, cancelled or
    # not, and they do not ask whether it was skipped: a run whose CTest step
    # never started compiled nothing, so save-sccache finds a cache too small to
    # keep and leaves the stored entry alone.
    - uses: ./.github/actions/save-sccache
      if: always() && inputs.persist-cache == 'true'
      with:
        variant: ${{ inputs.family }}-${{ inputs.compiler }}-${{ inputs.buildtype }}-ninja
