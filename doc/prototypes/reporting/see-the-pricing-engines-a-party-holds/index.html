<!--
  PROTOTYPE. Throwaway. Mock data, no backend, no build step, no session.

  The pricing engine configurations list and one configuration's page, drawn only as
  the Record screen standard (doc/knowledge/ui/record_screen_standard.org) draws a
  record screen: breadcrumb, plural title, one sentence, Refresh and Add, search, two
  filters, the table, the pager and the four states; then the record page with the
  lead line, the access mark, Edit and Delete only for a person who may, and the
  tabs Details, Products, Parameters, Reports and History with Revert.

  This page is one of two engine-facing configurations. It chooses the model and the
  engine for each product type. How the engine runs is the engine run settings, drawn
  by ../see-the-engine-settings-a-party-holds/. The Details tab says which is which
  and lists the related configurations the same report binds.
  Add, Edit and the file import are the other three prototypes of this journey group.

  Addresses: ?screen=list | record&id=c1|c2|c3&tab=details|products|parameters|reports|history
    &card=<product type> opens the product card; &class=<asset class> opens the asset class card
  Switches in the bottom bar (they reload and reset the mock data):
    ?state=all|empty|error|loading
    ?actor=viewer|analyst|admin   a viewer reads, an analyst adds and edits, only the administrator deletes
  The list adds Status and Official for. An approved configuration never changes in place:
  its Edit is Propose a change, and a pending proposal shows as a banner. A draft edits and
  deletes as the standard says. The Reports tab shows what each report needs and what is unpriced.
-->

<div class="proto-note" id="note"></div>
<div class="wrap" id="app"></div>
<div class="proto-bar" id="bar"></div>
<div id="layer"></div>

<script>
// FIXTURE. The product, model and engine triples are counted from the 110
// pricingengine*.xml files under the ORE Examples folder, the first 45 by count.
// The notes, usual values and instrument codes are this prototype's own wording.
const TRIPLES = [
  ['Swap','DiscountedCashflows','DiscountingSwapEngine',65],['CapFlooredIborLeg','BlackOrBachelier','BlackIborCouponPricer',54],
  ['CMS','LinearTSR','LinearTSRPricer',47],['EquityOption','BlackScholesMerton','AnalyticEuropeanEngine',45],
  ['CommodityForward','DiscountedCashflows','DiscountingCommodityForwardEngine',44],['Bond','DiscountedCashflows','DiscountingRiskyBondEngine',38],
  ['CrossCurrencySwap','DiscountedCashflows','DiscountingCrossCurrencySwapEngine',37],['EuropeanSwaption','BlackBachelier','BlackBachelierSwaptionEngine',37],
  ['FxForward','DiscountedCashflows','DiscountingFxForwardEngine',36],['FxOption','GarmanKohlhagen','AnalyticEuropeanEngine',36],
  ['CreditDefaultSwap','DiscountedCashflows','MidPointCdsEngine',36],['CapFloor','IborCapModel','IborCapEngine',35],
  ['BermudanSwaption','LGM','Grid',34],['EquityForward','DiscountedCashflows','DiscountingEquityForwardEngine',32],
  ['EquityOptionAmerican','BlackScholesMerton','FdBlackScholesVanillaEngine',32],['FxOptionAmerican','GarmanKohlhagen','FdBlackScholesVanillaEngine',30],
  ['CMSSpread','BrigoMercurio','Analytic',30],['CommoditySwap','DiscountedCashflows','CommoditySwapEngine',30],
  ['Swap','CrossAssetModel','AMC',18],['CrossCurrencySwap','CrossAssetModel','AMC',15],['FlexiSwap','LGM','Grid',15],
  ['YYCapFloor','YYCapModel','YYCapEngine',29],['CpiCapFloor','CpiCapModel','CpiCapEngine',24],['BondOption','Black','BlackBondOptionEngine',16]
];
const TYPES = [
  ['Swap','Rates','Swap','An interest rate swap, fixed against floating or floating against floating.'],
  ['CrossCurrencySwap','Rates','CrossCurrencySwap','A swap whose two legs pay in different currencies.'],
  ['CapFloor','Rates','CapFloor','A cap or a floor on an interest rate index.'],
  ['CMS','Rates','Swap','A leg that pays a constant maturity swap rate.'],
  ['CMSSpread','Rates','Swap','A leg that pays the spread between two constant maturity swap rates.'],
  ['EuropeanSwaption','Rates','Swaption','The right to enter a swap on one date.'],
  ['BermudanSwaption','Rates','Swaption','The right to enter a swap on any of several dates.'],
  ['FlexiSwap','Rates','Swap','A swap whose holder may choose the notional on each date.'],
  ['FxForward','FX','FxForward','An agreement to exchange two currencies on a future date.'],

  ['BondOption','Credit','Bond','An option on a bond.'],

// What the cards say. The asset class text follows the seeded descriptions; the
// instrument and product type text is this prototype's own wording.
const CLASSES = {
  Rates: { name: 'Interest Rate', code: 'interest_rates', what: 'Interest rate products: instruments whose value derives from the level or shape of a yield curve for a currency and index. Covers deposits, forward rate agreements, swaps, swaptions, caps and floors. Discounting and forward projection for every other asset class depend on these curves.' },

  Credit: { name: 'Credit', code: 'credit', what: 'Credit risk products: instruments whose value derives from the likelihood and severity of a reference entity defaulting. Covers single-name and index credit default swaps, credit-linked notes, and the spread and hazard rate curves that price them.' },

const INSTRUMENTS = {
  Swap: 'A swap exchanges two streams of cash flows on the same or on different indices. The most common form is fixed against floating; a basis swap exchanges two floating indices.',

  return `<div class="card"><div class="body">${kv('Name', esc(c.name))}${kv('Status', statusTag(c.status))}${kv('Official for', officialTag(c))}${kv('Version in force', c.status === 'approved' ? 'Version ' + c.ver : dash)}${kv('Signed off by', c.status === 'approved' ? esc(signedBy(c.versions[c.versions.length - 1])) : dash)}${kv('Variant', c.variant ? esc(c.variant) : dash)}${kv('Products', c.products.length)}${kv('Bound by', c.reports.length + ' reports')}${kv('Description', esc(c.desc), true)}${kv('Reporting row', `<span class="mono">${esc(c.cfgRow)}</span> of type <span class="mono">pricing_engines</span>`, true)}</div>${lastChanged(c)}</div>`;
}

function recordScreen(c) {
  const r = route();
  if (!c) return crumbs([['Home', LIST()], ['Reporting', LIST()], ['Pricing engine configurations', LIST()], ['Not found']]) + '<div class="notice">This pricing engine configuration does not exist.</div>';
  const tabHref = t => href({ screen: 'record', id: c.id, tab: t });
  const tabs = [['details', 'Details'], ['products', 'Products'], ['parameters', 'Parameters'], ['reports', 'Reports'], ['history', 'History']];
  const body = { details: detailsTab, products: productsTab, parameters: paramsTab, reports: reportsTab, history: historyTab }[r.tab](c);
  return `${crumbs([['Home', LIST()], ['Reporting', LIST()], ['Pricing engine configurations', LIST()], [esc(c.name)]])}
  <div class="titlebar"><div><h1>${esc(c.name)}</h1><div class="sub">${statusTag(c.status)} ${officialTag(c) === dash ? '' : officialTag(c)} version ${c.ver} · ${c.products.length} products · bound by ${c.reports.length} reports${c.variant ? ' · ' + esc(c.variant) : ''}</div></div>
    <div class="actions"><span class="access">${may('edit') ? '✎ Editable' : '🔒 Read only'}</span>${may('edit') ? `<a class="btn" href="${OTHER.change}?config=${c.id}&status=${c.status}">${G.edit} ${c.status === 'approved' ? 'Propose a change' : 'Edit'}</a>` : ''}${may('delete') && c.status !== 'approved' ? btn('Delete', 'delete', 'danger', 'data-delete') : ''}</div></div>
  ${pendingBanner(c)}${c.status === 'approved' ? '<div class="notice">This version is in force and cannot change in place. A change is proposed, approved by the approval parts model risk names, and then becomes the next version.</div>' : ''}
  <div class="tabbar">${tabs.map(([k, l]) => `<a data-nav href="${tabHref(k)}" class="${r.tab === k ? 'on' : ''}">${l}</a>`).join('')}</div>${body}`;
}

/** One product type as the configuration prices it: what it is, its instrument and its class. */
function productCard(c, p) {
  const t = typeOf(p.type), cls = t ? CLASSES[t.cls] : null, inst = t ? INSTRUMENTS[t.instrument] : null;
  const pairs = TRIPLES.filter(x => x[0] === p.type).map(x => [x[1], x[2]]);
  const known = settingsFor(p.type, p.model, p.engine);
  const params = p.params.length ? p.params.map(x => { const k = known.find(y => y.name === x.name); const note = k ? k.note : 'The documentation of this setting is not held.'; return `<div class="setting"><div class="shead"><div><b class="mono">${esc(x.name)}</b><div class="faint">${esc(x.scope)} · ${esc(p.type)}</div></div><div class="sval mono">${esc(x.value)}</div></div>
    <details class="doc" ${new URLSearchParams(location.search).get('doc') === x.name ? 'open' : ''}><summary>Documentation</summary><div class="docbody"><p class="help">${esc(note)}</p>${mode === 'advanced' ? `<div class="adv"><div>ORE argument <span class="mono">/PricingEngines/Product[@type='${esc(p.type)}']/Parameter[@name='${esc(x.name)}']</span></div><div>Format ${esc(k ? k.kind : 'text')}</div><div>Introduced in 1.8.0.7</div></div>` : ''}</div></details></div>`; }).join('') : '<p class="muted">This product carries no setting. The engine uses its own defaults.</p>';
  const pairList = pairs.length ? `<ul>${pairs.map(([m, e]) => `<li><span class="mono">${esc(m)} / ${esc(e)}</span>${m === p.model && e === p.engine ? ' <span class="tag ok">in use</span>' : ''}</li>`).join('')}</ul>` : '<p class="muted">No pair is known for this product type.</p>';
  const body = `<p class="muted">Product type <span class="mono">${esc(p.type)}</span>${cls ? ` · asset class <span class="mono">${esc(cls.code)}</span>` : ''}</p>
    <h3>What it is</h3><p>${esc(WHAT[p.type] || (t ? t.desc : 'No description is held.'))}</p>
    ${t ? `<h3>Instrument: ${esc(t.instrument)}</h3><p>${esc(inst || 'No description is held.')}</p>` : ''}
    ${cls ? `<h3>Asset class: ${esc(cls.name)}</h3><p>${esc(cls.what)}</p><p><button class="btn small" id="pc-class">Read about the ${esc(cls.name)} asset class</button></p>` : '<h3>Asset class</h3><p class="muted">This product type maps to no instrument, so it has no asset class. Leg and coupon pricers are the usual case.</p>'}
    <h3>In this configuration</h3><p><span class="mono">${esc(p.model)} / ${esc(p.engine)}</span>, with ${p.params.length} ${p.params.length === 1 ? 'setting' : 'settings'}.</p>
    <h3>Settings of this product</h3><div class="seg" role="radiogroup" aria-label="Documentation depth"><button data-pmode="simple" class="${mode === 'simple' ? 'on' : ''}">Simple</button><button data-pmode="advanced" class="${mode === 'advanced' ? 'on' : ''}">Advanced</button></div>${params}
    <h3>Known model and engine pairs</h3>${pairList}`;
  dialog(`${p.type} — how this product is priced`, body, `<button class="btn" id="d-cancel">Close</button>${may('edit') ? `<a class="btn primary" href="${OTHER.change}?config=${c.id}&open=${p.type}&status=${c.status}">${G.edit} ${c.status === 'approved' ? 'Propose a change' : 'Edit'}</a>` : ''}`);
  document.querySelectorAll('[data-pmode]').forEach(x => x.onclick = () => { mode = x.dataset.pmode; productCard(c, p); });
  const b = document.getElementById('pc-class');
  if (b && cls) b.onclick = () => assetClassCard(c, t.cls);
}
/** One asset class: what it is, and the product types of this configuration that sit in it. */
function assetClassCard(c, key) {
  const cls = CLASSES[key], types = [...new Set(c.products.map(x => x.type))].filter(x => { const t = typeOf(x); return t && t.cls === key; });
  const body = `<p class="muted">Asset class <span class="mono">${esc(cls.code)}</span></p>
    <h3>What it is</h3><p>${esc(cls.what)}</p>
    <h3>Product types this configuration prices in this class</h3>
    ${types.length ? `<ul>${types.map(x => `<li><a class="link" href="#" data-ptype="${esc(x)}">${esc(x)}</a></li>`).join('')}</ul>` : '<p class="muted">This configuration prices no product in this class.</p>'}`;
  dialog(`${cls.name} — asset class`, body, `<button class="btn" id="d-cancel">Close</button>`);
  document.querySelectorAll('[data-ptype]').forEach(x => x.onclick = e => { e.preventDefault(); const p = c.products.find(y => y.type === x.dataset.ptype); if (p) productCard(c, p); });
}

function deleteDialog(c) {
  const blocked = c.reports.length > 0;
  dialog('Delete ' + c.name + '?', blocked ? `<div class="badbox">${c.reports.length} reports bind this configuration: ${c.reports.map(esc).join(', ')}. Their next run would have no pricing engine configuration. Rebind them first.</div><div class="faint">No service refuses this delete today. The screen refuses it because the server would not.</div>` : `<div>The configuration, its products and its parameters are deleted. Its history stays.</div>${reasonField(false).replace(/<option[^>]*>Non-material update<\/option>/, '')}`, `<button class="btn" id="d-cancel">${G.cancel} Cancel</button><button class="btn danger" id="d-save" ${blocked ? 'disabled data-block="1"' : ''}>Delete</button>`);
  if (!blocked) ready('d-save');
  document.getElementById('d-save').onclick = () => { CONFIGS.splice(CONFIGS.indexOf(c), 1); closeDlg(); nav({ screen: 'list' }); };
}
function wire() {
  const r = route(), c = byId(r.id);
  document.querySelectorAll('#app [data-open]').forEach(x => { const open = e => { if (e.target.closest('a,button')) return; nav({ screen: 'record', id: x.dataset.open }); }; x.onclick = open; x.onkeydown = e => { if (e.key === 'Enter') open(e); }; });
  document.querySelectorAll('#app [data-sort]').forEach(x => x.onclick = () => { sortDir = sortKey === x.dataset.sort ? -sortDir : 1; sortKey = x.dataset.sort; render(); });
  const s = document.getElementById('search'); if (s) s.oninput = () => { search = s.value; render(); const n = document.getElementById('search'); n.focus(); n.setSelectionRange(n.value.length, n.value.length); };
  const vf = document.getElementById('varf'); if (vf) vf.onchange = () => { variantF = vf.value; render(); };
  const sf = document.getElementById('statusf'); if (sf) sf.onchange = () => { statusF = sf.value; render(); };
  const uf = document.getElementById('usedf'); if (uf) uf.onchange = () => { usedF = uf.value; render(); };
  const cl = document.getElementById('clear'); if (cl) cl.onclick = () => { search = ''; variantF = 'all'; usedF = 'any'; statusF = 'all'; render(); };
  const rt = document.getElementById('retry'); if (rt) rt.onclick = () => { const p = new URLSearchParams(location.search); p.set('state', 'all'); location.search = p.toString(); };
  const sys = document.getElementById('sys'); if (sys) sys.onclick = () => { hideSystem = !hideSystem; render(); };
  document.querySelectorAll('#app [data-delete]').forEach(x => x.onclick = () => deleteDialog(c));
  document.querySelectorAll('#app [data-product]').forEach(x => x.onclick = e => { e.preventDefault(); const p = c.products.find(y => y.type === x.dataset.product); if (p) productCard(c, p); });
  document.querySelectorAll('#app [data-class]').forEach(x => x.onclick = e => { e.preventDefault(); assetClassCard(c, x.dataset.class); });
  document.querySelectorAll('#app [data-pmode]').forEach(x => x.onclick = () => { mode = x.dataset.pmode; render(); });
  const wantCard = new URLSearchParams(location.search).get('card'), wantClass = new URLSearchParams(location.search).get('class');
  if (r.screen === 'record' && c && wantCard && !document.querySelector('.dlg')) { const p = c.products.find(y => y.type === wantCard); if (p) productCard(c, p); }
  if (r.screen === 'record' && c && wantClass && !document.querySelector('.dlg')) assetClassCard(c, wantClass);
  document.querySelectorAll('#app [data-revert]').forEach(x => x.onclick = () => revertDialog(c, Number(x.dataset.revert)));
}
function render() {
  const r = route();
  document.getElementById('app').innerHTML = r.screen === 'record' ? recordScreen(byId(r.id)) : listScreen();
  chrome('see the pricing engine configurations a party holds · ' + r.screen + ' · ' + state + ' · acting as ' + actorName, [['state', ['all', 'empty', 'error', 'loading'], state], ['actor', ['viewer', 'analyst', 'admin'], actor]]);
  wire();
}
render();

</script>
</body>
</html>
