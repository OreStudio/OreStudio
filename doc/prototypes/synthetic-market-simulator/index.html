<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Market Simulator prototype — Synthetic data generation</title>
<style>
:root{color-scheme:dark;--bg:#121214;--panel:#1a1a1e;--panel-2:#26262b;--line:#30363d;--line-soft:#21262d;--ink:#e3e3e6;--ink-dim:#a1a1aa;--ink-faint:#71717a;--accent:#58a6ff;--accent-dim:#21262d;--ok:#3fb950;--warn:#d29922;--bad:#f85149;--radius:.5rem;--mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink)}
body{margin:0;font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;padding:2.5rem 1.5rem 8rem}
h1,h2,h3{margin:0;font-weight:600}h1{font-size:1.15rem}h2{font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-dim)}
p{margin:0}ul{margin:0;padding:0;list-style:none}a{color:var(--accent);text-decoration:none}
button,input,select{font:inherit;color:inherit}button{cursor:pointer}
.mono{font-family:var(--mono)}.muted{color:var(--ink-dim)}.faint{color:var(--ink-faint)}
.wrap{max-width:1080px;margin:0 auto;display:grid;gap:14px}
.top{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px;display:grid;gap:10px}
.panel>h2{border-bottom:1px solid var(--line-soft);padding-bottom:6px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.field{display:grid;gap:4px;min-width:170px}.field label{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-faint)}
.field .value,.field select,.field input{background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:6px 8px}
table{width:100%;border-collapse:collapse;font-size:.86rem}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line-soft)}
th{font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-faint);font-weight:600}
td.num{text-align:right;font-family:var(--mono)}
.btn{background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:7px 12px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#0d1117;font-weight:600}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.tag{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:1px 8px;font-size:.72rem;color:var(--ink-dim)}
.tag.ok{color:var(--ok);border-color:#1f4d29}.tag.bad{color:var(--bad);border-color:#5a2320}.tag.warn{color:var(--warn);border-color:#4a3a17}
.notice{border:1px dashed var(--line);border-radius:var(--radius);padding:10px 12px;color:var(--ink-dim);background:#161619}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:820px){.grid2{grid-template-columns:1fr}}
.proto-note{position:fixed;top:0;left:0;right:0;z-index:60;padding:6px 14px;background:repeating-linear-gradient(45deg,#2a2113,#2a2113 10px,#241d11 10px,#241d11 20px);border-bottom:1px solid #4a3a17;color:var(--warn);font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.proto-bar{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:60;display:flex;gap:2px;align-items:center;padding:5px 7px;background:#0b0e13;border:1px solid var(--line);border-radius:999px;box-shadow:0 8px 30px rgba(0,0,0,.6);font-size:12px;max-width:95vw;flex-wrap:wrap;justify-content:center}
.proto-bar button{background:none;border:none;color:var(--ink-dim);padding:6px 10px;border-radius:999px}
.proto-bar button:hover{background:var(--panel-2);color:var(--ink)}.proto-bar button.on{background:var(--accent-dim);color:var(--ink)}
.proto-bar .label{padding:0 8px}.proto-bar .sep{color:var(--line)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.78rem}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px}
.urlbtn{display:inline-flex;align-items:baseline;gap:6px;max-width:100%;background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:3px 8px;color:var(--ink);text-align:left}
.urlbtn:hover{border-color:var(--accent)}

.oresmd-frame{width:min(1120px,96vw);height:min(840px,92vh);border:1px solid var(--line);border-radius:var(--radius);background:var(--bg)}
.pc{margin:0}.pc svg{display:block;background:var(--panel-2);border:1px solid var(--line);border-radius:6px}.pc figcaption{margin-top:6px;font-size:.78rem}.pc-legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:6px;font-size:.78rem;color:var(--ink-dim)}.pc-legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.col{display:grid;gap:10px}
.list{display:grid;gap:6px;font-size:.85rem;color:var(--ink-dim)}
.list li::before{content:"— ";color:var(--ink-faint)}
.tree{display:grid;gap:1px;font-size:.85rem}
.tnode{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:4px 6px;border-radius:4px;border-left:2px solid transparent}
.tnode:hover{background:var(--panel-2)}
.tnode.on{background:var(--accent-dim);border-left-color:var(--accent)}
.tw{width:12px;color:var(--ink-faint)}
.tname{font-weight:600}
.hero{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.pair{display:flex;align-items:center}
.ccy{display:inline-flex;align-items:center;justify-content:center;width:52px;height:52px;border-radius:50%;background:var(--panel-2);border:1px solid var(--line);font-size:.78rem;font-weight:600}
.ccy+.ccy{margin-left:-18px;background:#1f2937}
</style>

<body>

<!--
  PROTOTYPE. Throwaway. Mock data, no backend, no build step, no session.

  The ores.qt Synthetic > Market Simulator window
  (doc/knowledge/ui/synthetic_data_generation_screens.org): a composite
  authoring window. A toolbar, a namespace tree of the configured feeds on the
  left, and the selected feed's hero header, summary form and live tick chart
  on the right.

  Variants with ?variant=a|b|c: a pairs the tree with the feed table for the
  selected collection; b replaces the table with the live chart (an FX mid-price
  tick chart, or the overlaid IR curve snapshots the History spin box selects);
  c argues the cascade — one folder-scoped start/stop request for a non-leaf
  node against the per-feed request for a leaf — next to the Validate Vintage
  contributor summary.

  ?state=running|allstopped|novintage switches the mock running set. Running is
  a mix, so a tree node reads "3 of 8 running". Novintage makes Validate Vintage
  refuse every vintage-backed contributor.

  Nothing here reads a service or stores a row.
-->

<div class="proto-note" id="note"></div>
<div class="wrap" id="app"></div>
<div class="proto-bar" id="bar"></div>

<script>
const params = new URLSearchParams(location.search);
const variant = params.get('variant') || 'a';
const state = params.get('state') || '';

// Prototype plotting helper. Throwaway, dependency-free, dark-theme SVG.
// Each function returns an HTML string, so a page calls host.innerHTML = PC.line({...}).
// Prefixed PC to stay clear of page-local names; the pages also define `tag`.
const PC = (() => {
  const C = {grid:'#21262d', axis:'#30363d', text:'#71717a', dim:'#a1a1aa',
             ink:'#e3e3e6', accent:'#58a6ff', ok:'#3fb950', warn:'#d29922', bad:'#f85149'};
  const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const fmt = (v, d) => v == null ? '—' : (typeof v === 'number' ? v.toFixed(d ?? 2) : String(v));
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  // A blue -> amber ramp for a heat cell, t in 0..1.
  function heatColour(t){
    const stops = [[13,23,38],[21,60,110],[32,110,170],[88,166,255],[210,153,34],[248,81,73]];
    const p = clamp(t, 0, 1) * (stops.length - 1), i = Math.floor(p), f = p - i;
    const a = stops[i], b = stops[Math.min(stops.length - 1, i + 1)];
    return `rgb(${a.map((x, k) => Math.round(x + (b[k] - x) * f)).join(',')})`;
  }

  // Shared frame: margins, y gridlines and labels for a value axis.
  function frame(o){
    const w = o.w || 940, h = o.h || 300;
    const pad = Object.assign({l:64, r:18, t:16, b:40}, o.pad || {});
    const x0 = pad.l, x1 = w - pad.r, y0 = h - pad.b, y1 = pad.t;
    const vals = (o.series || []).flatMap(s => s.points || []).filter(v => v != null)
      .concat(o.extra || []);
    let lo = Math.min(...vals), hi = Math.max(...vals);
    if (o.zero) { lo = Math.min(lo, 0); hi = Math.max(hi, 0); }
    if (!(hi > lo)) { hi = lo + 1; }
    const span = hi - lo, l2 = lo - span * 0.08, h2 = hi + span * 0.08;
    const y = v => y0 - (v - l2) * (y0 - y1) / (h2 - l2);
    const X = o.x ? (i => x0 + o.x[i] * (x1 - x0))
                  : (i => x0 + i * (x1 - x0) / Math.max(1, (o.ticks ? o.ticks.length : 1) - 1));
    const yTicks = [];
    const steps = o.ySteps || 4;
    for (let k = 0; k <= steps; k++) {
      const v = l2 + (h2 - l2) * k / steps;
      yTicks.push(`<line x1="${x0}" y1="${y(v).toFixed(1)}" x2="${x1}" y2="${y(v).toFixed(1)}" stroke="${C.grid}"/>
        <text x="${x0 - 8}" y="${(y(v) + 3.5).toFixed(1)}" fill="${C.text}" font-size="10" text-anchor="end">${esc((o.yFmt || (v => fmt(v)))(v))}</text>`);
    }
    const xTicks = (o.ticks || []).map(t => {
      const px = o.x ? x0 + t.at * (x1 - x0) : X(t.at);
      return `<text x="${px.toFixed(1)}" y="${h - pad.b + 15}" fill="${C.text}" font-size="10" text-anchor="middle">${esc(t.label)}</text>`;
    }).join('');
    const grid = (o.xticks || []).map(t => {
      const px = o.x ? x0 + t.at * (x1 - x0) : X(t.at);
      return `<line x1="${px.toFixed(1)}" y1="${y1}" x2="${px.toFixed(1)}" y2="${y0}" stroke="${C.grid}" stroke-dasharray="2 3"/>`;
    }).join('');
    return {w, h, x0, x1, y0, y1, y, X, l2, h2, frame: yTicks.join('') + grid + xTicks};
  }

  function line(o){
    const f = frame(o);
    const bands = (o.bands || []).map(b => {
      const xa = f.x0 + b.from * (f.x1 - f.x0), xb = f.x0 + b.to * (f.x1 - f.x0);
      return `<rect x="${xa.toFixed(1)}" y="${f.y1}" width="${(xb - xa).toFixed(1)}" height="${(f.y0 - f.y1).toFixed(1)}"
        fill="${b.color || C.accent}" opacity=".08"/>` +
        (b.label ? `<text x="${((xa + xb) / 2).toFixed(1)}" y="${f.y1 + 11}" fill="${C.text}" font-size="9" text-anchor="middle">${esc(b.label)}</text>` : '');
    }).join('');
    const paths = (o.series || []).map(s => {
      let d = '', pen = false;
      s.points.forEach((v, i) => {
        if (v == null) { pen = false; return; }
        d += (pen ? 'L' : 'M') + f.X(i).toFixed(1) + ',' + f.y(v).toFixed(1) + ' ';
        pen = true;
      });
      const marks = s.markers ? s.points.map((v, i) => v == null ? '' :
        `<circle cx="${f.X(i).toFixed(1)}" cy="${f.y(v).toFixed(1)}" r="${s.r || 3.4}" fill="${s.color}"/>`).join('') : '';
      return `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="${s.width || 2}"${s.dash ? ` stroke-dasharray="${s.dash}"` : ''}/>${marks}`;
    }).join('');
    const legend = o.legend === false ? '' : `<div class="pc-legend">${(o.series || []).map(s =>
      `<span><i style="background:${s.color}"></i>${esc(s.name)}</span>`).join('')}${(o.notes || []).map(n =>
      `<span class="faint">${n}</span>`).join('')}</div>`;
    return `<figure class="pc"><svg viewBox="0 0 ${f.w} ${f.h}" width="100%" height="${f.h}" role="img" aria-label="${esc(o.title || 'chart')}">
      ${bands}${f.frame}${paths}
      ${o.yLabel ? `<text x="14" y="${(f.y0 + f.y1) / 2}" fill="${C.text}" font-size="10" transform="rotate(-90 14 ${(f.y0 + f.y1) / 2})" text-anchor="middle">${esc(o.yLabel)}</text>` : ''}
    </svg>${legend}${o.caption ? `<figcaption class="faint">${o.caption}</figcaption>` : ''}</figure>`;
  }

  function bars(o){
    const f = frame(Object.assign({zero: true}, o));
    const n = o.bars.length, bw = (f.x1 - f.x0) / n;
    const zero = f.y(0);
    const body = o.bars.map((b, i) => {
      const v = b.value == null ? null : b.value;
      const x = f.x0 + i * bw + bw * 0.18, w = bw * 0.64;
      const yv = v == null ? zero : f.y(v);
      const top = Math.min(yv, zero), hgt = Math.abs(zero - yv);
      const col = b.color || (v == null ? C.text : v >= 0 ? C.warn : C.accent);
      return `<rect x="${x.toFixed(1)}" y="${top.toFixed(1)}" width="${w.toFixed(1)}" height="${Math.max(1, hgt).toFixed(1)}" fill="${col}" opacity=".85"><title>${esc(b.label)}: ${esc(fmt(v))}</title></rect>
        <text x="${(x + w / 2).toFixed(1)}" y="${(f.h - 24)}" fill="${C.text}" font-size="9" text-anchor="middle">${esc(b.label)}</text>`;
    }).join('');
    return `<figure class="pc"><svg viewBox="0 0 ${f.w} ${f.h}" width="100%" height="${f.h}" role="img" aria-label="${esc(o.title || 'bars')}">
      ${f.frame}<line x1="${f.x0}" y1="${zero}" x2="${f.x1}" y2="${zero}" stroke="${C.axis}"/>${body}</svg>
      ${o.caption ? `<figcaption class="faint">${o.caption}</figcaption>` : ''}</figure>`;
  }

  // A surface as a shaded mesh grid: one cell per (row, column).
  function heat(o){
    const rows = o.rows, cols = o.cols;
    const cw = o.cell || 54, ch = o.cellH || 30, l = 58, t = 26;
    const w = l + cols.length * cw + (o.legend === false ? 14 : 92);
    const h = t + rows.length * ch + 34;
    const vals = [];
    rows.forEach((_, i) => cols.forEach((_, j) => { const v = o.value(i, j); if (v != null) vals.push(v); }));
    const lo = Math.min(...vals), hi = Math.max(...vals), span = (hi - lo) || 1;
    const cells = [];
    rows.forEach((r, i) => cols.forEach((c, j) => {
      const v = o.value(i, j);
      const x = l + j * cw, y = t + i * ch;
      const col = v == null ? '#161619' : heatColour((v - lo) / span);
      cells.push(`<rect x="${x}" y="${y}" width="${cw - 2}" height="${ch - 2}" rx="2" fill="${col}"><title>${esc(r.label)} · ${esc(c.label)}: ${esc(fmt(v, o.dp))}</title></rect>`);
      if (o.showValues !== false) cells.push(`<text x="${(x + (cw - 2) / 2).toFixed(1)}" y="${(y + ch / 2 + 3.5).toFixed(1)}" fill="${(v != null && (v - lo) / span > 0.55) ? '#0d1117' : C.ink}" font-size="9.5" text-anchor="middle">${esc(fmt(v, o.dp ?? 1))}</text>`);
    }));
    const rowLabels = rows.map((r, i) => `<text x="${l - 8}" y="${(t + i * ch + ch / 2 + 3.5).toFixed(1)}" fill="${C.text}" font-size="10" text-anchor="end">${esc(r.label)}</text>`).join('');
    const colLabels = cols.map((c, j) => `<text x="${(l + j * cw + (cw - 2) / 2).toFixed(1)}" y="${t - 8}" fill="${C.text}" font-size="10" text-anchor="middle">${esc(c.label)}</text>`).join('');
    const legend = o.legend === false ? '' : (() => {
      const bx = l + cols.length * cw + 14, by = t, bh = rows.length * ch - 2;
      const steps = 24, sh = bh / steps;
      let g = '';
      for (let k = 0; k < steps; k++) g += `<rect x="${bx}" y="${(by + k * sh).toFixed(1)}" width="12" height="${(sh + 1).toFixed(1)}" fill="${heatColour(1 - k / (steps - 1))}"/>`;
      return `<g>${g}<text x="${bx + 18}" y="${by + 8}" fill="${C.text}" font-size="9">${esc(fmt(hi, o.dp))}</text>
        <text x="${bx + 18}" y="${by + bh}" fill="${C.text}" font-size="9">${esc(fmt(lo, o.dp))}</text></g>`;
    })();
    return `<figure class="pc"><svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" role="img" aria-label="${esc(o.title || 'heat map')}">
      ${cells.join('')}${rowLabels}${colLabels}${legend}
      ${o.xLabel ? `<text x="${(l + cols.length * cw / 2).toFixed(1)}" y="${h - 6}" fill="${C.text}" font-size="10" text-anchor="middle">${esc(o.xLabel)}</text>` : ''}
      ${o.yLabel ? `<text x="12" y="${(t + rows.length * ch / 2).toFixed(1)}" fill="${C.text}" font-size="10" transform="rotate(-90 12 ${(t + rows.length * ch / 2).toFixed(1)})" text-anchor="middle">${esc(o.yLabel)}</text>` : ''}
    </svg>${o.caption ? `<figcaption class="faint">${o.caption}</figcaption>` : ''}</figure>`;
  }

  // A surface as an isometric wireframe: rows and columns joined over a height.
  function mesh(o){
    const w = o.w || 940, h = o.h || 420;
    const rows = o.z.length, cols = o.z[0].length;
    const vals = o.z.flat().filter(v => v != null);
    const lo = Math.min(...vals), hi = Math.max(...vals), span = (hi - lo) || 1;
    const ox = o.ox ?? w * 0.52;
    const sy = o.sy ?? Math.min(22, h / (2 * Math.max(1, (rows - 1) + (cols - 1))));
    const sx = o.sx ?? Math.min(46, (w * 0.6) / Math.max(1, (rows - 1) + (cols - 1)));
    const sz = o.sz ?? h * 0.34;
    const oy = o.oy ?? h - 26 - ((rows - 1) + (cols - 1)) * sy;
    const P = (i, j) => {
      const v = o.z[i][j];
      const z = v == null ? 0 : (v - lo) / span;
      return [ox + (j - i) * sx, oy + (i + j) * sy - z * sz, z];
    };
    const lines = [];
    for (let i = 0; i < rows; i++) {
      let d = '';
      for (let j = 0; j < cols; j++) { const p = P(i, j); d += (j ? 'L' : 'M') + p[0].toFixed(1) + ',' + p[1].toFixed(1) + ' '; }
      lines.push(`<path d="${d}" fill="none" stroke="${C.accent}" stroke-width="1.4" opacity=".75"/>`);
    }
    for (let j = 0; j < cols; j++) {
      let d = '';
      for (let i = 0; i < rows; i++) { const p = P(i, j); d += (i ? 'L' : 'M') + p[0].toFixed(1) + ',' + p[1].toFixed(1) + ' '; }
      lines.push(`<path d="${d}" fill="none" stroke="${C.warn}" stroke-width="1" opacity=".5"/>`);
    }
    const rowL = (o.rows || []).map((r, i) => { const p = P(i, 0); return `<text x="${(p[0] - 12).toFixed(1)}" y="${(p[1] + 4).toFixed(1)}" fill="${C.text}" font-size="10" text-anchor="end">${esc(r.label)}</text>`; }).join('');
    const colL = (o.cols || []).map((c, j) => { const p = P(rows - 1, j); return `<text x="${(p[0] + 10).toFixed(1)}" y="${(p[1] + 4).toFixed(1)}" fill="${C.text}" font-size="10">${esc(c.label)}</text>`; }).join('');
    const axis = `<text x="14" y="${h - 12}" fill="${C.text}" font-size="10">height: ${esc(o.zLabel || 'value')} ${esc(fmt(lo, o.dp))}–${esc(fmt(hi, o.dp))}</text>`;
    return `<figure class="pc"><svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" role="img" aria-label="${esc(o.title || 'surface mesh')}">
      ${lines.join('')}${rowL}${colL}${axis}</svg>
      <div class="pc-legend"><span><i style="background:${C.accent}"></i>expiry</span><span><i style="background:${C.warn}"></i>strike</span>${(o.notes || []).map(n => `<span class="faint">${n}</span>`).join('')}</div>
      ${o.caption ? `<figcaption class="faint">${esc(o.caption)}</figcaption>` : ''}</figure>`;
  }

  return {line, bars, heat, mesh, colours: C, heatColour};
})();

function urlButton(url){
  return `<button class="urlbtn" type="button" data-url="${url}" title="Edit in the oresmd URL editor">`+
         `<span class="mono">${url}</span><span class="edit">edit</span></button>`;
}
function openOresmdEditor(url, host){
  const ov=document.createElement('div'); ov.className='oresmd-overlay';
  const f=document.createElement('iframe'); f.className='oresmd-frame'; f.title='oresmd URL editor';
  f.src='../oresmd-url-editor/index.html?embed=1&url='+encodeURIComponent(url||'');
  ov.appendChild(f); document.body.appendChild(ov);
  function close(){ window.removeEventListener('message', onMsg); document.removeEventListener('keydown', onKey); ov.remove(); }
  function onMsg(e){ if(e.data && e.data.type==='oresmd-url'){ host.dataset.url=e.data.url; const m=host.querySelector('.mono'); if(m) m.textContent=e.data.url; close(); } }
  function onKey(e){ if(e.key==='Escape') close(); }
  window.addEventListener('message', onMsg); document.addEventListener('keydown', onKey);
  ov.addEventListener('click', e=>{ if(e.target===ov) close(); });
}
document.addEventListener('click', e=>{
  const b=e.target.closest('.urlbtn'); if(!b) return;
  openOresmdEditor(b.dataset.url||'', b);
});
function tag(text, kind){ return `<span class="tag ${kind||''}">${text}</span>`; }

// ==== page data and panels ====
// The ores.qt Market Simulator window, as mock data. One feed object drives
// the tree, the hero header, the summary form and the chart.

const COLLECTIONS = [
  {key:'basic', name:'Basic'},

// novintage is empty: a refused validation starts nothing.
const STATES = {
  running:    ['gbpusd','usdjpy','sofr','eurusd_u'],
  allstopped: [],
  novintage:  []
};

const PATH_OF = {
  basic:     ['Generation Config / Basic', 'FX Rates'],
  realistic: ['Generation Config / Realistic 2026', 'FX Rates / IR Curves'],
  uniform:   ['Generation Config / Uniform Demo', 'FX Rates']
};

const TENORS = ['1M','3M','6M','1Y','2Y','3Y','5Y','7Y','10Y'];

const NAMES = {
  EUR:'Euro', GBP:'Pound Sterling', USD:'US Dollar', JPY:'Japanese Yen', CHF:'Swiss Franc',
  AUD:'Australian Dollar', CAD:'Canadian Dollar', SEK:'Swedish Krona'
};

// Deterministic mock prices, one walk per feed. No RNG: the page must render
// the same picture on every load.
const ANCHOR = {
  eurusd:1.0842, gbpusd:1.2718, usdjpy:157.42, audusd:0.6584, usdchf:0.8961,
  eurgbp:0.8527, eurusd_b:1.0842, gbpusd_b:1.2718, eurusd_u:1.0842,
  gbpusd_u:1.2718, audusd_u:0.6584

function idOf(feed){
  return feed.type === 'fx' ? feed.id : feed.id + '.curve';
}
function titleOf(feed){
  return feed.title ?? `${NAMES[feed.base]} / ${NAMES[feed.quote]}`;
}
function subtitleOf(feed){
  return `${feed.pair ?? (feed.ccy + ' ' + feed.family)} • ${sourceOf(feed)}`;
}
function sourceOf(feed){
  const leaf = feed.type === 'fx' ? feed.id.replace(/_[bu]$/, '') : feed.id;
  return `synthetic.themes.${feed.collection}_2026.${leaf}`;
}
// The oresmd URI the tree leaf edits, as the oresmd editor would address it.
function routeOf(feed){
  const c = encodeURIComponent(feed.collection);
  return `oresmd://synthetic/collection["${c}"]/feed["${feed.id}"]`;
}
function isRunning(feed){ return runningSet().has(feed.id); }
function runningSet(){ return new Set(STATES[state] ?? STATES.running); }
function runningCount(feeds){ const s = runningSet(); return feeds.filter(f => s.has(f.id)).length; }
function feedsOf(filter){ return FEEDS.filter(filter); }
function byCollection(key){ return FEEDS.filter(f => f.collection === key); }

// A tree node's state is running, stopped or partially running. There is no
// "unknown": an empty folder is stopped, a full folder is running.
function stateOf(feeds){
  const n = runningCount(feeds), total = feeds.length;
  if (total === 0) return {kind:'stopped', text:'0 of 0 running', short:'stopped'};
  if (n === 0) return {kind:'stopped', text:`0 of ${total} running`, short:'stopped'};
  if (n === total) return {kind:'running', text:`${total} of ${total} running`, short:'running'};
  return {kind:'partial', text:`${n} of ${total} running`, short:'partial'};
}
function stateTag(st){
  const dot = st.kind === 'stopped' ? '○' : st.kind === 'partial' ? '◐' : '●';
  return tag(`${dot} ${st.text}`, st.kind === 'stopped' ? '' : st.kind);
}
function feedStateTag(feed){
  return isRunning(feed) ? tag('● Running', 'ok') : tag('○ Stopped', '');
}
function usd(v, dp){
  return v == null ? '—' : '$' + v.toFixed(dp ?? 4);
}
function num(v, dp){
  return v == null ? '—' : v.toFixed(dp ?? 2);
}
function everySeconds(feed){
  return Math.max(1, Math.round(3600 / Math.max(1, feed.ticks_per_hour)));
}
function midNow(feed){
  const r = pathOf(feed);
  return r[r.length - 1];
}

// Mock mid-price paths. A seeded LCG drives the walk, so a feed always draws
// the same picture. IR feeds have no price.
function rng(seed){
  let s = seed;
  return () => { s = (s * 1103515245 + 12345) % 2147483648; return s / 2147483648; };
}
function pathOf(feed){
  if (feed.__path) return feed.__path;
  if (feed.type !== 'fx') { feed.__path = null; return null; }
  const seed = (feed.id.split('').reduce((a, c) => a + c.charCodeAt(0), 7) % 997) + 11;
  const r = rng(seed * 7919);
  const base = ANCHOR[feed.id] ?? 1;
  const vol = base * 0.0009;
  const points = [], n = 60;
  let p = base * 0.999;
  for (let i = 0; i < n; i++) {
    const drift = (base - p) * (feed.method === 'ou' ? 0.06 : 0.004);
    p = p + drift + (r() - 0.5) * vol * 2;
    points.push(Number(p.toFixed(feed.quote === 'JPY' ? 3 : 5)));
  }
  feed.__path = points;
  return points;
}
// Mock bid/ask around the mid, for the feed table's spread columns.
function quotes(feed){
  const mid = midNow(feed), pip = feed.quote === 'JPY' ? 0.01 : 0.0001;
  return {mid, bid:Number((mid - pip).toFixed(5)), ask:Number((mid + pip).toFixed(5)), pip};
}
function pathSummary(feed){
  const r = pathOf(feed);
  if (!r) return null;
  let d = 0;
  for (let i = 1; i < r.length; i++) d += (r[i] - r[i - 1]) / r[i - 1];
  const mean = r.reduce((a, b) => a + b, 0) / r.length;
  const sd = Math.sqrt(r.reduce((a, b) => a + (b - mean) ** 2, 0) / (r.length - 1));
  return {first:r[0], last:r[r.length - 1], ret:d, sd, mean};
}

// Mock curve snapshots: one per tick, newest last. Each snapshot is a short
// rate that relaxes from initial_rate toward theta over the tenor grid, so the
// curve has a shape. The chart fades the older ones, so the read reads as a
// read over time, not a single curve.
function curveOf(feed){
  if (feed.__curve) return feed.__curve;
  const p = feed.params;
  const grid = TENORS.map((t, i) => i / (TENORS.length - 1));
  const snaps = [];
  for (let k = 0; k < 8; k++) {
    const wiggle = (k + 1) * 0.00045;
    snaps.push(grid.map(g => p.initial_rate
      + (p.theta - p.initial_rate) * (1 - Math.exp(-p.kappa * g * 8))
      + wiggle * (1 - g)));
  }
  feed.__curve = snaps;
  return snaps;
}

// The tree mirrors the namespace: Synthetic > Collection > asset class >
// instrument type > feed leaf.
function tree(feeds){
  const rows = [];
  rows.push(nodeRow(0, 'Synthetic', 'root', feeds, feeds.length));
  COLLECTIONS.forEach(c => {
    const cf = feeds.filter(f => f.collection === c.key);
    if (!cf.length) return;
    rows.push(nodeRow(1, c.name, 'collection', cf, cf.length));
    ['fx','ir'].forEach(kind => {
      const kf = cf.filter(f => f.type === kind);
      if (!kf.length) return;
      rows.push(nodeRow(2, assetLabel(kind), 'group', kf, kf.length));
      rows.push(nodeRow(3, kind === 'fx' ? 'FX Rates' : 'IR Curves', 'group', kf, kf.length));
      kf.forEach(f => rows.push(leafRow(4, f)));
    });
  });
  return `<div class="panel"><h2>Feeds — namespace tree</h2>
    <div class="tree">${rows.join('')}</div>
    <div class="notice">Selecting a non-leaf node (Root, Collection, Group) sends ONE folder-scoped start/stop request and the server fans out. A Feed leaf, or a mixed selection, uses the per-feed request.</div>
  </div>`;
}
function assetLabel(kind){
  return kind === 'fx' ? 'FX — Foreign Exchange' : 'IR — Interest Rates';
}
function nodeRow(level, name, kind, feeds, count){
  const st = stateOf(feeds);
  const on = (kind === 'root' && selected.kind === 'root') ||
             (kind === 'collection' && selected.kind === 'collection' && selected.name === name);
  return `<div class="tnode${on ? ' on' : ''}" style="padding-left:${level * 16}px">
    <span class="tw">▾</span>
    <span class="tname">${name}</span>${stateTag(st)}
    <span class="faint mono">${count} feed(s)</span>
  </div>`;
}
function leafRow(level, feed){
  const on = selected.kind === 'leaf' && selected.feedId === feed.id;
  return `<div class="tnode${on ? ' on' : ''}" style="padding-left:${level * 16}px">
    <span class="tw">·</span>
    <span class="tname">${feed.type === 'fx' ? feed.pair : feed.title}</span>${feedStateTag(feed)}
    <span class="faint mono">${sourceOf(feed)}</span>
  </div>`;
}
function selectedLeaf(){
  const f = selected.kind === 'leaf' ? FEEDS.find(x => x.id === selected.feedId) : null;
  return f ?? FEEDS.find(x => x.id === 'gbpusd');
}

function summary(feed){
  const rows = feed.type === 'fx' ? [
    ['Process', feed.process],
    ['Initial price', feed.vintage ? `from vintage ${feed.vintage.source} @ ${feed.vintage.date}` : usd(ANCHOR[feed.id.replace(/_[bu]$/, '')], 5)],
    ['Update frequency', `every ${everySeconds(feed)} s`],
    ['Components', `${feed.components}`]
  ] : [
    ['Process', feed.process],
    ['kappa', `${num(feed.params.kappa, 3)} (reversion speed)`],
    ['theta', `${(feed.params.theta * 100).toFixed(2)}% (long-run level)`],
    ['sigma', `${(feed.params.sigma * 100).toFixed(2)}% (volatility)`],
    ['initial_rate', `${(feed.params.initial_rate * 100).toFixed(2)}%`],
    ['Fixed leg frequency', feed.leg_frequency],
    ['Update frequency', `every ${everySeconds(feed)} s`]

}

// Variant b: the live tick chart (FX) and the snapshot overlay (IR), with the
// History spinner the IR case needs.
function chartPanel(feed){
  if (feed.type === 'fx') {
    const r = pathOf(feed), s = pathSummary(feed);
    const dp = feed.quote === 'JPY' ? 3 : 5;
    const ticks = r.map((_, i) => i % 12 === 0 ? {at:i / (r.length - 1), label:`${i}s`} : null).filter(Boolean);
    const colour = s.last >= s.first ? PC.colours.ok : PC.colours.bad;
    return `<div class="panel"><h2>Live tick chart — ${feed.pair}</h2>
      ${PC.line({
        title:`${feed.pair} mid`,
        series:[{name:`mid ${feed.pair}`, color:colour, points:r, width:2}],
        ticks,
        yFmt:v => v.toFixed(dp),
        yLabel:`${feed.pair} mid`,
        h:300,
        notes:[`${r.length} ticks`, `range ${num(Math.min(...r), dp)}–${num(Math.max(...r), dp)}`],
        caption:'Mock of the streaming read: a real window appends each tick as it arrives over NATS. This page draws a fixed, seeded sample.'
      })}
      <div class="row">
        <div class="field"><label>Last</label><div class="value">${num(s.last, dp)}</div></div>
        <div class="field"><label>Mean</label><div class="value">${num(s.mean, dp)}</div></div>
        <div class="field"><label>Cumulative return</label><div class="value">${(s.ret * 100).toFixed(3)}%</div></div>
        <div class="field"><label>Realised stdev</label><div class="value">${num(s.sd, dp)}</div></div>
      </div>
    </div>`;
  }
  const snaps = curveOf(feed);
  const shown = snaps.length;
  const series = snaps.map((snap, i, arr) => {
    const age = arr.length - 1 - i;
    return {
      name:i === arr.length - 1 ? 'newest' : `${age} tick(s) ago`,
      color:CHART_COLOURS[age % CHART_COLOURS.length],
      points:snap,
      width:i === arr.length - 1 ? 2.8 : 1.1,
      markers:i === arr.length - 1,
      dash:i === arr.length - 1 ? null : '4 3'
    };
  });
  const newest = snaps[snaps.length - 1];
  return `<div class="panel"><h2>Live tick chart — ${feed.title} curve snapshots</h2>
    <div class="row">
      <div class="field" style="min-width:120px"><label>History</label>
        <select><option>${shown} snapshots</option><option>4 snapshots</option><option>8 snapshots</option></select>
      </div>
      <span class="faint">Newest bold; older fade with age.</span>
    </div>
    ${PC.line({
      title:`${feed.title} snapshots`,
      series,
      x:TENORS.map((_, i) => i / (TENORS.length - 1)),
      ticks:TENORS.map((t, i) => ({at:i / (TENORS.length - 1), label:t})),
      yFmt:v => (v * 100).toFixed(2) + '%',
      yLabel:'rate',
      h:320,
      notes:[`newest ${(newest[newest.length - 1] * 100).toFixed(2)}% at 10Y`],
      caption:'Mock of the streaming read: each publication appends one curve snapshot. The overlay fades by age; History selects how many snapshots to draw.'
    })}
    <div class="notice">A real read has neither a history range nor a read as of a past instant. History here is a mock of the spin box only.</div>
  </div>`;
}

// Variant c: the cascade argument. One request per non-leaf node, then the
// Validate Vintage summary that decides which contributors may start.
function cascade(feed){
  // The cascade panel argues the collection scope: "Realistic 2026" and its
  // 11 contributors, whatever leaf the hero shows.
  const selectedFeeds = byCollection('realistic');
  const st = stateOf(selectedFeeds);
  const folder = 'synthetic.themes.realistic_2026';
  const perFeed = selected.kind === 'leaf';
  const request = perFeed
    ? `POST synthetic.v1.feed.start\n{ "source_name": "${sourceOf(feed)}" }`
    : `POST synthetic.v1.folder.start\n{ "folder": "${folder}", "scope": "subtree" }`;
  const fanout = perFeed
    ? `1 per-feed request · the server starts one feed. It answers with ${stateOf([feed]).text}.`
    : `1 folder-scoped request · the server fans out to ${selectedFeeds.length} feed(s) and answers with ${st.text}.`;
  const rows = selectedFeeds.map(f => {
    const v = vintageCheck(f);
    return `<tr>
      <td class="mono">${sourceOf(f)}</td>
      <td>${f.type === 'fx' ? 'FX' : 'IR'}</td>
      <td>${v.note}</td>
      <td>${v.ok ? tag('✓ pass', 'ok') : tag('✗ refuse', 'bad')}</td>
    </tr>`;
  }).join('');
  const passes = selectedFeeds.filter(f => vintageCheck(f).ok).length;
  return `<div class="grid2">
    <div class="panel"><h2>Cascade — one request, server-side fan-out</h2>
      <div class="row">
        <div class="field"><label>Selection</label><div class="value">${selected.kind === 'leaf' ? titleOf(feed) : 'Synthetic (root) / Realistic 2026'}</div></div>
        <div class="field"><label>Node kind</label><div class="value">${perFeed ? 'Feed leaf' : 'Collection (non-leaf)'}</div></div>
        <div class="field"><label>Request</label><div class="value">${perFeed ? 'per-feed' : 'folder-scoped'}</div></div>
        <div class="field"><label>Node state</label><div class="value">${st.text}</div></div>
      </div>
      <div class="col"><div class="mono">${request.replace(/\n/g, '<br>')}</div></div>
      <div class="notice">${fanout}</div>
      <h2 style="margin-top:6px">Start / Stop dispatch</h2>
      <table><thead><tr><th>Node</th><th>Kind</th><th>Request</th><th>State</th></tr></thead><tbody>
        ${[['Synthetic','root',FEEDS],['Realistic 2026','collection',selectedFeeds],[assetLabel(feed.type),'group',selectedFeeds.filter(f => f.type === feed.type)],[titleOf(feed),'leaf',[feed]]]
          .map(r => {
            const s = stateOf(r[2]);
            return `<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[1] === 'leaf' ? 'per-feed' : 'folder-scoped'}</td><td>${stateTag(s)}</td></tr>`;
          }).join('')}
      </tbody></table>
      <div class="notice">A mixed selection (a feed plus a folder) is not expressible as one request: the client sends the per-feed request for each leaf, and the folder request for each folder. The prototype argues for a single selection rule instead.</div>
    </div>

    <div class="panel"><h2>Validate Vintage — contributors</h2>
      <table><thead><tr><th>Contributor</th><th>Class</th><th>Check</th><th>Result</th></tr></thead><tbody>${rows}</tbody></table>
      <div class="notice">${passes} of ${selectedFeeds.length} item(s) pass (or don't need) validation.</div>
      <div class="col"><strong>Which dataset would you like to start?</strong>
        <div class="row">
          <div class="field"><label>Dataset</label><div class="value">Realistic 2026 — this party, all contributors</div></div>
          <div class="field"><label>Vintage</label><div class="value mono">ore.reference @ 2026-05-05</div></div>
        </div>
        <button class="btn primary" data-note="Start validated">Start</button>
      </div>
      <div class="notice">${passes === 0
        ? `Started 0 feed(s). Every contributor was refused; nothing was started.`
        : `Started ${passes} feed(s). ${selectedFeeds.length - passes} item(s) skipped — see the check column.`}</div>
      <div class="notice">FX checks vintage availability over NATS. IR checks the local binding-collision rule: one running feed per (currency, index family, tenor, role). The two are merged into the one count above.</div>
    </div>
  </div>`;
}

// A contributor's validation result. FX asks the vintage service; IR asks the
// local collision rule. A fixed-price feed needs neither, and passes.
function vintageCheck(feed){
  if (!feed.vintage) {
    return feed.type === 'ir'
      ? {ok:true, note:`no vintage needed; binding free for ${feed.ccy}-${feed.family}`}
      : {ok:true, note:'no vintage needed; initial price is fixed'};
  }
  if (state === 'novintage') {
    return {ok:false, note:`no observation for source=${feed.vintage.source}, date=${feed.vintage.date}`};
  }
  return {ok:true, note:`observation present for source=${feed.vintage.source}, date=${feed.vintage.date}`};
}

// ==== render ====
function set(k, v){ const p = new URLSearchParams(location.search); p.set(k, v); location.search = p.toString(); }

// Which node the hero, the summary and the chart describe. Defaults to the
// GBP/USD leaf; ?feed=<id> selects another leaf, so the IR snapshot overlay is
// reachable too.
let selected = {kind:'leaf', feedId: (params.get('feed') || 'gbpusd')};

function render(){
  const host = document.getElementById('app');
  const feed = selectedLeaf();
  const all = FEEDS;
  const rootState = stateOf(all);

  let body = toolbar();
  body += `<div class="panel"><h2>This page</h2>
    <div class="notice">Mock of the ores.qt Synthetic › Market Simulator window. ?state=running|allstopped|novintage sets which feeds the mock reports as running. Nothing here reads a service or stores a row.</div>
    <div class="row">
      <div class="field"><label>Root state</label><div class="value">${stateTag(rootState)}</div></div>
      <div class="field"><label>Running</label><div class="value">${runningCount(all)} of ${all.length} feed(s)</div></div>
      <div class="field"><label>Feeds</label><div class="value">${all.length}, ${COLLECTIONS.length} collections</div></div>
      <div class="field"><label>Root folder</label><div class="value mono">Synthetic</div></div>
    </div>
  </div>`;

  // The window shape: the tree on the left, the hero, summary and chart stacked
  // on the right. The lower panel is full width and belongs to the variant.
  const main = `<div class="col">${hero(feed)}${summary(feed)}${
    variant === 'b' ? chartPanel(feed) : variant === 'a' ? feedTable(f => f.collection === 'realistic', 'Realistic 2026') : ''}</div>`;
  body += `<div class="grid2" style="align-items:start">${tree(all)}${main}</div>`;
  if (variant === 'c') body += cascade(feed);

  body += `<div class="panel"><h2>What this prototype cannot show</h2>
    <ul class="list">
      <li>The tick chart and the snapshot overlay read a live NATS stream; this page draws a fixed, seeded sample.</li>
      <li>Validate Vintage asks the market-data service for the named observation; here the answer is a function of ?state.</li>
      <li>Starting or stopping a feed changes no row: the mock state set is the only state.</li>
      <li>Feed-start rejections (a lost race for the same ORE key, a curve collision) are a service-side answer, not a client one.</li>
    </ul>
  </div>`;

  host.innerHTML = body;

  document.getElementById('note').textContent =
    `Prototype · Market Simulator (Synthetic) · variant ${variant} · state ${state || 'running'} · mock data · nothing is stored`;

  document.getElementById('bar').innerHTML =
    `<span class="label faint">variant</span>` +
    ['a','b','c'].map(v => `<button data-v="${v}"${variant === v ? ' class="on"' : ''}>${v}</button>`).join('') +
    `<span class="sep">|</span><span class="label faint">state</span>` +
    ['running','allstopped','novintage'].map(s => `<button data-s="${s}"${(state || 'running') === s ? ' class="on"' : ''}>${s}</button>`).join('') +
    `<span class="sep">|</span><button data-v="a">reset</button>`;
}

document.addEventListener('click', e => {
  const b = e.target.closest('[data-v],[data-s],[data-feed],[data-note]');
  if (!b) return;
  if (b.dataset.v) { set('variant', b.dataset.v); return; }
  if (b.dataset.s) { set('state', b.dataset.s); return; }
  if (b.dataset.feed) { set('feed', b.dataset.feed); return; }
  const n = document.getElementById('tbn');
  if (n) n.textContent = `${b.dataset.note}: mock action, no request is sent.`;
});

render();
</script>
</body>
</html>
