<body>

<!--
  PROTOTYPE. Throwaway. Mock data, no backend, no build step, no session.

  The engine settings list and one configuration's page, drawn as the Record screen
  standard (doc/knowledge/ui/record_screen_standard.org) draws a record screen, and
  beside the pricing engines prototype: breadcrumb, plural title, one sentence, Refresh
  and Add, search, a filter, the table, the pager and the four states; then the record
  page with the access mark and the tabs Details, the five groups, Used by and History.

  Each group has a tab of its own, and each group is one part table with its own version.
  A write to any group makes the next version of the whole, and History shows one
  entry for each group changed.

  Addresses: ?screen=list | record&id=e1|e2|e3&tab=details|dates|fixings|building|execution|output|reports|history
  Switches in the bottom bar (they reload and reset the mock data):
    ?state=all|empty|error|loading
    ?actor=viewer|analyst|admin   a viewer reads, an analyst adds and edits, only the administrator deletes
    ?engine=1.8.17.0 or 1.8.16.0   the ORE build the settings are checked against
  The Simple and Advanced switch is in the page, as on the feed screens. ?mode=simple or advanced sets it, and it is remembered.
-->

<div class="proto-note" id="note"></div>
<div class="wrap" id="app"></div>
<div class="proto-bar" id="bar"></div>
<div id="layer"></div>

<script>
// The wording of every setting is drawn from the ORE 1.8.17 source and user guide: OREAnalytics/orea/app/inputparameters.{hpp,cpp},
// oreapp.cpp, OREData/ored/marketdata/csvloader.cpp and Docs/UserGuide/parameterisation/ore.tex.
// status: live (ORE reads it), ignored (ORE 1.8.17 does not read it in Setup), flag-misnamed (read, but not a flag).
const YES = (y, n) => [['yes', 'Yes', y], ['no', 'No', n]];
const IGNORED = (name, shipped) => `Neither supported ORE build, 1.8.16.0 or 1.8.17.0, reads ${name} from the Setup block. ${shipped} A document that sets it runs exactly as one that leaves it out, so setting it here changes nothing.`;
const GROUPS = [
  { id: 'dates', title: 'Dates', table: 'engine_settings_dates', changes: true, what: 'How the run reads dates.', fields: [
    { key: 'accrual_date', ore: 'accrualDate', label: 'Accrual date', kind: 'text', status: 'ignored', help: 'Not read by ORE 1.8.17.',
      desc: IGNORED('accrualDate', 'Three shipped legacy examples set it to ASOF.'), dflt: 'Not applicable. The setting has no effect.',
      values: [['ASOF', 'ASOF', 'The value the three shipped legacy examples use. It has no effect on a run.']] },
    { key: 'fixing_cutoff', ore: 'fixingCutoff', label: 'Fixing cutoff', kind: 'text', status: 'live', help: 'A date, such as 2026-10-20.',
      desc: 'Names a date up to which historical fixings are loaded from the fixing data file, even when they fall on or after the valuation date. Without it the loader keeps only fixings dated before the valuation date, and the fixing of the valuation date itself when today’s fixings are not implied. Set it when the run values as of an earlier date but the fixing file holds later fixings that the run must still see. The value is a date in the form 2026-10-20.',
      dflt: 'No cutoff. Only fixings before the valuation date load, and today’s fixing loads when it is not implied.',
      values: [['', 'A date', 'Every fixing dated on or before that date loads, in addition to the fixings that load without a cutoff. The eight shipped examples that set it use 2023-02-14.']] },
    { key: 'date_calendar', ore: 'dateCalendar', label: 'Date calendar', kind: 'text', status: 'ignored', help: 'Not read by ORE 1.8.17.',
      desc: IGNORED('dateCalendar', 'Three shipped legacy examples set it to TARGET.'), dflt: 'Not applicable. The setting has no effect.',
      values: [['TARGET', 'TARGET', 'The value the three shipped legacy examples use. It has no effect on a run.']] },
    { key: 'date_convention', ore: 'dateConvention', label: 'Date convention', kind: 'text', status: 'ignored', help: 'Not read by ORE 1.8.17.',
      desc: IGNORED('dateConvention', 'Three shipped legacy examples set it to P.'), dflt: 'Not applicable. The setting has no effect.',
      values: [['P', 'P', 'The value the three shipped legacy examples use. It has no effect on a run.']] },
    { key: 'ignore_fixing_lag', ore: 'ignoreFixingLag', label: 'Ignore fixing lag', kind: 'number', status: 'live', help: 'A number of days. Zero turns the check off.',
      desc: 'Works with Enrich index fixings. When the engine fills a gap in an index’s fixings with the previous fixing, this setting limits how old that previous fixing may be. If the previous fixing is more days older than the gap than this number, the engine does not use it as the fallback. A value of zero turns the check off, so a fixing of any age can fill the gap.',
      dflt: '0. The check is off.',
      values: [['0', '0', 'No limit. A previous fixing of any age can fill a gap.'], ['', 'A number of days, such as 3', 'A previous fixing fills a gap only when it is at most that many days older than the gap.']] }] },
  { id: 'fixings', title: 'Fixings and cash flows', table: 'engine_settings_fixings', changes: true, what: 'Which fixings and cash flows count.', fields: [
    { key: 'imply_todays_fixings', ore: 'implyTodaysFixings', label: 'Imply today’s fixings', kind: 'bool', status: 'live', help: 'Whether today’s fixings are implied.',
      desc: 'Decides what the run does about the fixing of the valuation date. When it is No, the fixing for the valuation date is loaded from the fixing file like any earlier fixing. When it is Yes, that fixing is not loaded and the engine implies it from the curves. Use Yes when the run prices off hypothetical market data, as in scenario analysis and stress testing, because a fixing from the real market would not match the hypothetical curves.',
      dflt: 'No. Today’s fixing is loaded.', values: YES('Today’s fixing is not loaded. The engine implies it from the curves.', 'Today’s fixing is loaded from the fixing file.') },
    { key: 'include_todays_cash_flows', ore: 'includeTodaysCashFlows', label: 'Include today’s cash flows', kind: 'bool', status: 'live', help: 'Whether cash flows that pay today count.',
      desc: 'Sets the global QuantLib flag that decides whether a cash flow that pays on the valuation date is part of the NPV or is treated as already matured and excluded. The choice applies to every analytic of the run. The simulation analytic has a parameter of the same name for exposure runs. Change it only when the NPV must agree with a system that treats payments on the valuation date the other way.',
      dflt: 'Not set. The engine keeps the QuantLib default.', values: YES('A cash flow that pays on the valuation date counts in the NPV.', 'A cash flow that pays on the valuation date is treated as matured and does not count.') },
    { key: 'include_reference_date_events', ore: 'includeReferenceDateEvents', label: 'Include reference date events', kind: 'bool', status: 'live', help: 'Whether events on the reference date count.',
