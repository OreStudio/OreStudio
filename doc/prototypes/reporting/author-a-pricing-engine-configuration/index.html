<body>

<!--
  PROTOTYPE. Throwaway. Mock data, no backend, no build step, no session.

  Authoring a pricing engine configuration on the standard steps UI, copied from
  doc/prototypes/setup/first-run: the rail, its marks and the step foot. Six steps
  (name it, choose the products, choose the model and engine, set the parameters,
  check it, review and save), the last one final. The rail is one computed list.
  Step 3 carries three readings of the model and engine step behind ?variant=A|B|C:
  a table, a card for each product, and a guided walk one product at a time.
  A pair that is not known to work is marked, never refused. No server check stands
  behind any finding: the page says so.

  What it is for: a draft to try a change, or a candidate for the official intraday or end of day
  configuration. Only a candidate whose coverage is complete can be submitted for sign-off.

  Addresses: ?step=1..6&variant=A|B|C&start=empty|copy&cycle=none|eod|intraday
  The product, model and engine triples are counted from 110 ORE example files;
  the notes and usual values are this page's own wording.
-->

<div class="proto-note" id="note"></div>
<div class="wrap" id="app"></div>
<div class="proto-bar" id="bar"></div>
<div id="layer"></div>

<script>
// FIXTURE. The product, model and engine triples are counted from the 110
// pricingengine*.xml files under the ORE Examples folder, the first 45 by count.
// The notes, usual values and instrument codes are this prototype's own wording.
const TRIPLES = [
  ['Swap','DiscountedCashflows','DiscountingSwapEngine',65],['CapFlooredIborLeg','BlackOrBachelier','BlackIborCouponPricer',54],
  ['CMS','LinearTSR','LinearTSRPricer',47],['EquityOption','BlackScholesMerton','AnalyticEuropeanEngine',45],
  ['CommodityForward','DiscountedCashflows','DiscountingCommodityForwardEngine',44],['Bond','DiscountedCashflows','DiscountingRiskyBondEngine',38],
  ['CrossCurrencySwap','DiscountedCashflows','DiscountingCrossCurrencySwapEngine',37],['EuropeanSwaption','BlackBachelier','BlackBachelierSwaptionEngine',37],
  ['FxForward','DiscountedCashflows','DiscountingFxForwardEngine',36],['FxOption','GarmanKohlhagen','AnalyticEuropeanEngine',36],
  ['CreditDefaultSwap','DiscountedCashflows','MidPointCdsEngine',36],['CapFloor','IborCapModel','IborCapEngine',35],
  ['BermudanSwaption','LGM','Grid',34],['EquityForward','DiscountedCashflows','DiscountingEquityForwardEngine',32],
  ['EquityOptionAmerican','BlackScholesMerton','FdBlackScholesVanillaEngine',32],['FxOptionAmerican','GarmanKohlhagen','FdBlackScholesVanillaEngine',30],
  ['CMSSpread','BrigoMercurio','Analytic',30],['CommoditySwap','DiscountedCashflows','CommoditySwapEngine',30],
  ['Swap','CrossAssetModel','AMC',18],['CrossCurrencySwap','CrossAssetModel','AMC',15],['FlexiSwap','LGM','Grid',15],
  ['YYCapFloor','YYCapModel','YYCapEngine',29],['CpiCapFloor','CpiCapModel','CpiCapEngine',24],['BondOption','Black','BlackBondOptionEngine',16]
];
const TYPES = [
  ['Swap','Rates','Swap','An interest rate swap, fixed against floating or floating against floating.'],
  ['CrossCurrencySwap','Rates','CrossCurrencySwap','A swap whose two legs pay in different currencies.'],
  ['CapFloor','Rates','CapFloor','A cap or a floor on an interest rate index.'],
  ['CMS','Rates','Swap','A leg that pays a constant maturity swap rate.'],
  ['CMSSpread','Rates','Swap','A leg that pays the spread between two constant maturity swap rates.'],
  ['EuropeanSwaption','Rates','Swaption','The right to enter a swap on one date.'],
  ['BermudanSwaption','Rates','Swaption','The right to enter a swap on any of several dates.'],
  ['FlexiSwap','Rates','Swap','A swap whose holder may choose the notional on each date.'],
  ['FxForward','FX','FxForward','An agreement to exchange two currencies on a future date.'],
  ['FxOption','FX','FxOption','A European option on an exchange rate.'],
  ['FxOptionAmerican','FX','FxOption','An American option on an exchange rate.'],
  ['Bond','Credit','Bond','A bond that carries credit risk.'],
  ['CreditDefaultSwap','Credit','CreditDefaultSwap','Protection against the default of one name.'],
  ['BondOption','Credit','Bond','An option on a bond.'],
  ['EquityOption','Equity','EquityOption','A European option on a share or an index.'],
  ['EquityOptionAmerican','Equity','EquityOption','An American option on a share or an index.'],
  ['EquityForward','Equity','EquityForward','An agreement to buy or sell a share on a future date.'],
  ['CommodityForward','Commodity','CommodityForward','An agreement to buy or sell a commodity on a future date.'],
  ['CommoditySwap','Commodity','CommoditySwap','A swap of a fixed price against a commodity price.'],
  ['YYCapFloor','Inflation','CapFloor','A cap or a floor on year-on-year inflation.'],
  ['CpiCapFloor','Inflation','CapFloor','A cap or a floor on a consumer price index.']
].map(([code, cls, instrument, desc]) => ({ code, cls, instrument, desc }));
const typeOf = c => TYPES.find(t => t.code === c);
const MODELS = [...new Set(TRIPLES.map(t => t[1]))].sort();
const enginesFor = m => [...new Set(TRIPLES.filter(t => t[1] === m).map(t => t[2]))].sort();
const ALL_ENGINES = [...new Set(TRIPLES.map(t => t[2]))].sort();
const knownPair = (m, e) => TRIPLES.some(t => t[1] === m && t[2] === e);
const usualFor = c => { const x = TRIPLES.filter(t => t[0] === c).sort((a, b) => b[3] - a[3])[0]; return x ? { model: x[1], engine: x[2], n: x[3] } : null; };
// The settings a pair is known to take. kind: select (options), text, number.
const SETTINGS = {
  'BermudanSwaption|LGM|Grid': [
    { scope: 'model', name: 'Calibration', kind: 'select', opts: ['Bootstrap', 'BestFit', 'None'], usual: 'Bootstrap', note: 'How the model is fitted to the swaption quotes.' },
    { scope: 'model', name: 'CalibrationStrategy', kind: 'select', opts: ['CoterminalATM', 'CoterminalDealStrike', 'UnderlyingATM', 'UnderlyingDealStrike'], usual: 'CoterminalATM', note: 'Which swaptions the fit uses.' },
    { scope: 'model', name: 'ReversionType', kind: 'select', opts: ['HullWhite', 'Hagan'], usual: 'HullWhite', note: 'The parameterisation of mean reversion.' },
    { scope: 'model', name: 'VolatilityType', kind: 'select', opts: ['Hagan', 'HullWhite'], usual: 'Hagan', note: 'The parameterisation of volatility.' },
    { scope: 'model', name: 'Volatility', kind: 'number', usual: '0.01', note: 'The starting volatility the fit moves from.' },
    { scope: 'model', name: 'ShiftHorizon', kind: 'number', usual: '0.5', note: 'The horizon, in years, of the shift of the state variable.' },
    { scope: 'engine', name: 'sx', kind: 'number', usual: '3.0', note: 'Width of the grid, in standard deviations, on the state axis.' },
    { scope: 'engine', name: 'sy', kind: 'number', usual: '3.0', note: 'Width of the grid, in standard deviations, on the value axis.' },
    { scope: 'engine', name: 'nx', kind: 'number', usual: '10', note: 'Number of grid points on the state axis.' },
    { scope: 'engine', name: 'ny', kind: 'number', usual: '10', note: 'Number of grid points on the value axis.' }
  ],
  'Bond|DiscountedCashflows|DiscountingRiskyBondEngine': [
    { scope: 'engine', name: 'TimestepPeriod', kind: 'text', usual: '6M', note: 'The step of the default probability grid.' }
  ],
  'Swap|DiscountedCashflows|DiscountingSwapEngine': [
    { scope: 'engine', name: 'SensitivityTemplate', kind: 'select', opts: ['IR_Analytical'], usual: 'IR_Analytical', note: 'The sensitivity method a swap offers.' }
  ]
};
const GLOBAL_KNOWN = [{ name: 'ContinueOnCalibrationError', kind: 'select', opts: ['true', 'false'], usual: 'true', note: 'Whether a failed calibration stops the run. True prices the product with the last good fit and records the error.' }];

  <div class="notice">Save writes one document, the configuration with its products and parameters, in one request. The service writes the three tables one after another with no unit of work, so a failure part way can leave a configuration without its parameters. After a failed write the screen reads the document back and shows what landed.</div>
  <div class="notice">A new record is saved with the reason new record. No operation holds a status: the draft, in review and approved states are this page's own.</div>`;
}
const BODIES = [s1, s2, s3, s4, s5, s6];
function render() {
  const rail = STEPS.map((s, i) => { const st = i < step ? 'done' : i === step ? 'current' : 'ahead'; return `<li class="railentry ${st}" data-go="${i}"><span class="railmark ${st}">${i < step ? '✓' : i + 1}</span><span>${s[1]}</span>${i === 5 ? '<span class="railtag">final</span>' : ''}</li>`; }).join('');
  const last = step === 5;
  const foot = `<div class="stepfoot">${step > 0 && !(last && D.saved) ? btn('Back', '', '', 'id="b-back"') : '<span></span>'}<span class="ml-auto"></span>${last ? (D.saved ? '' : btn('Save as draft', 'save', D.cycle ? '' : 'primary', 'id="b-save"') + (D.cycle ? ' ' + btn('Submit for sign-off', 'save', 'primary', `id="b-submit" ${blocked() ? 'disabled' : ''}`) : '')) : btn('Next: ' + STEPS[step + 1][1].toLowerCase(), '', 'primary', `id="b-next" ${valid(step) ? '' : 'disabled'}`)}</div>`;
  document.getElementById('app').innerHTML = `${crumbs([['Home', '#'], ['Reporting', '#'], ['Pricing engines', '../product-pricing/'], ['Add']])}<div class="titlebar"><div><h1>Author a pricing engine configuration</h1><div class="sub">Six steps. Every value on this page is a fixture, and nothing is written to a server.</div></div></div>
  <div class="journey"><nav class="railnav"><ol>${rail}</ol></nav><div><div class="stepcard"><h2>${step + 1}. ${STEPS[step][1]}</h2><div class="lead">${STEPS[step][2]}</div>${BODIES[step]()}</div>${foot}</div></div>`;
  chrome('author a pricing engine configuration · step ' + (step + 1) + ' of 6 · step 3 reading ' + variant, [['variant', ['A', 'B', 'C'], variant], ['start', ['empty', 'copy'], start0], ['cycle', ['none', 'eod', 'intraday'], D.cycle || 'none']]);
  wire();
}
function go(i) { step = i; maxStep = Math.max(maxStep, i); const p = new URLSearchParams(location.search); p.set('step', i + 1); history.replaceState({}, '', '?' + p.toString()); render(); }
function wire() {
  const $ = id => document.getElementById(id), qa = s => document.querySelectorAll('#app ' + s);
  qa('[data-go]').forEach(x => x.onclick = () => { const i = Number(x.dataset.go); if (i <= maxStep || i < step) go(i); });
  if ($('b-next')) $('b-next').onclick = () => { if (step === 0 && D.start === 'file') { location.href = '../bring-in-a-pricing-engines-file/'; return; } go(step + 1); };
  if ($('b-back')) $('b-back').onclick = () => go(step - 1);
  if ($('b-save')) $('b-save').onclick = () => { D.saved = { kind: 'draft', name: D.name, products: clone(D.rows) }; render(); };
  if ($('b-submit')) $('b-submit').onclick = () => { D.saved = { kind: 'submit', name: D.name, products: clone(D.rows) }; render(); };
  qa('[name=purpose]').forEach(x => x.onchange = () => { D.cycle = x.value; render(); });
  const nm = $('f-name'); if (nm) { nm.oninput = () => { D.name = nm.value; const b = $('b-next'); if (b) b.disabled = !valid(0); const h = nm.parentNode.querySelector('.help'); h.innerHTML = nameTaken() ? '<span style="color:var(--bad)">A configuration with this name exists. Choose another name.</span>' : 'The name is new in this party.'; }; }
  if ($('f-desc')) $('f-desc').oninput = e => { D.desc = e.target.value; }; if ($('f-var')) $('f-var').oninput = e => { D.variant = e.target.value; };
  qa('[name=start]').forEach(x => x.onchange = () => { D.start = x.value; if (D.start === 'copy') { const c = byId2(D.from); D.rows = clone(c.products); D.globals = clone(c.globals); } render(); });
  if ($('f-from')) $('f-from').onchange = e => { D.from = e.target.value; const c = byId2(D.from); D.rows = clone(c.products); D.globals = clone(c.globals); render(); };
  if ($('f-ts')) $('f-ts').oninput = e => { typeSearch = e.target.value; render(); const n = $('f-ts'); n.focus(); n.setSelectionRange(n.value.length, n.value.length); };
  if ($('b-trade')) $('b-trade').onclick = () => { neededNow().filter(t => typeOf(t) && !rowOf(t)).forEach(t => D.rows.push({ type: t, model: '', engine: '', params: [] })); render(); };
  qa('[data-type]').forEach(x => x.onchange = () => { if (x.checked) D.rows.push({ type: x.dataset.type, model: '', engine: '', params: [] }); else D.rows = D.rows.filter(r => r.type !== x.dataset.type); render(); });
  if ($('b-all')) $('b-all').onclick = () => { D.rows.forEach(useUsual); render(); };
  qa('[data-use]').forEach(x => x.onclick = () => { useUsual(D.rows[Number(x.dataset.use)]); render(); });
  qa('[data-m]').forEach(x => x.onchange = () => { const r = D.rows[Number(x.dataset.m)]; r.model = x.value; if (!enginesFor(r.model).includes(r.engine)) r.engine = enginesFor(r.model)[0] || ''; syncParams(r); render(); });
  qa('[data-e]').forEach(x => x.onchange = () => { const r = D.rows[Number(x.dataset.e)]; r.engine = x.value; syncParams(r); render(); });
  qa('[data-up]').forEach(x => x.onclick = () => { const i = Number(x.dataset.up); [D.rows[i - 1], D.rows[i]] = [D.rows[i], D.rows[i - 1]]; render(); });
  qa('[data-down]').forEach(x => x.onclick = () => { const i = Number(x.dataset.down); [D.rows[i + 1], D.rows[i]] = [D.rows[i], D.rows[i + 1]]; render(); });
  qa('[data-cur]').forEach(x => x.onclick = () => { D.cursor = Number(x.dataset.cur); render(); });
  qa('[data-pr]').forEach(x => x.onchange = () => { D.rows[Number(x.dataset.pr)].params[Number(x.dataset.pj)].value = x.value; });
  if ($('f-glob')) $('f-glob').onchange = e => { D.globals = e.target.value ? [{ name: GLOBAL_KNOWN[0].name, value: e.target.value }] : []; };
  qa('[data-addp]').forEach(x => x.onclick = () => { const i = x.dataset.addp, n = $('add-n-' + i).value.trim(); if (!n) return; D.rows[Number(i)].params.push({ scope: $('add-s-' + i).value, name: n, value: $('add-v-' + i).value, custom: true }); render(); });
}
render();

</script>
