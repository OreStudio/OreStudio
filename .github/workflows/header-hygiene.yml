---
name: Header hygiene
on:  # yamllint disable-line rule:truthy
  # Any change under projects/ can write a header, so this fires on all of
  # them, and on the check and this file, so an edit to either is verified
  # here too.
  push:
    branches: ["main"]
    paths:
      - "projects/**"
      - "build/scripts/check_enum_export_attributes.py"
      - "build/scripts/check_exported_types_are_compiled.py"
      - ".github/workflows/header-hygiene.yml"

  pull_request:
    branches: ["main"]
    paths:
      - "projects/**"
      - "build/scripts/check_enum_export_attributes.py"
      - "build/scripts/check_exported_types_are_compiled.py"
      - ".github/workflows/header-hygiene.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  # A visibility macro applied to an enum. The attribute does not apply to an
  # enum on any ABI, and clang-cl reports it as -Wignored-attributes, which is
  # an error under -Werror. It reached main on 2026-09-28 in
  # ores.workflow/api/include/ores.workflow.api/service/workflow_definition.hpp
  # and turned the Windows build red in ores.dq.core.lib.
  #
  # No compiler on Linux or macOS catches it, and the three continuous
  # workflows run on a schedule rather than on a pull request, so Windows --
  # the only platform that reports it -- would see it at best twelve hours
  # after the merge. The check is a source scan, so it needs no toolchain and
  # takes about a second.
  enum-attributes:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Check no visibility macro decorates an enum
        run: |
          python3 build/scripts/check_enum_export_attributes.py
  # A library that exports a type none of its own translation units compiles.
  # On the Microsoft ABI the export macro is __declspec(dllimport) for
  # consumers, so the type is imported by everyone and defined by nobody and
  # the link fails, hours into a Windows build:
  #
  #   lld-link: error: undefined symbol: __declspec(dllimport) public: __cdecl
  #     ores::workflow::service::workflow_registry::workflow_registry(void)
  #
  # ores.workflow.api's two hand-written service headers were in exactly that
  # state on 2026-09-29, and only Windows reported it: on Linux and macOS the
  # same macro is a visibility attribute that costs nothing. The scan needs no
  # toolchain and takes a fraction of a second.
  exported-types:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Check every exported type is compiled by its own library
        run: |
          python3 build/scripts/check_exported_types_are_compiled.py
