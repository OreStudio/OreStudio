<body>

<!--
  PROTOTYPE. Throwaway. Mock data, no backend, no build step, no session.

  The synthetic feeds, as one screen. Every feed here is synthetic, so no
  label says so: real market data will have its own card under Market data.

  ?screen=market|dashboard|tree|feed
    market     Market data: one Synthetic card, a screen and not a folder.
    dashboard  Market data > Synthetic, first tab. Providers, what each
               simulates, what runs, and the feeds that should run and do not.
    tree       Market data > Synthetic, second tab. The tree of providers and
               asset classes beside a paged table of feeds. Rows are picked
               and one Start or Stop applies to the pick. The server resolves
               "all matching" from the filter; the page never holds the ids.
    feed       A feed's page, a stub: it is unchanged. Its breadcrumb runs
               through the tree.

  ?state=mixed|restart|stopped|scale|search
    mixed    Bloomberg FX running; the rest stopped.
    restart  The synthetic service has just restarted: nothing runs, and the
             dashboard says how many feeds should.
    stopped  Nothing runs and no feed is meant to.
    scale    Seven providers and about 2,900 feeds.
    search   The tree's search holds "usd sofr".

  Start and Stop work on the mock: the feeds change state, every roll-up
  recomputes, and the report says started, already running, skipped.
  A feed whose series another running feed already publishes is skipped.
-->

<div class="proto-note" id="note"></div>
<div class="wrap" id="app"></div>
<div class="proto-bar" id="bar"></div>

<script>
const params = new URLSearchParams(location.search);
const SCREENS = ['market', 'dashboard', 'tree', 'feed'];
let screen = SCREENS.includes(params.get('screen')) ? params.get('screen') : 'dashboard';
const state = params.get('state') || 'mixed';
function set(key, value) {
  const p = new URLSearchParams(location.search);
  p.set(key, value);
  location.search = p.toString();
}

const FLAG = {USD:'🇺🇸',EUR:'🇪🇺',GBP:'🇬🇧',JPY:'🇯🇵',CHF:'🇨🇭',AUD:'🇦🇺',CAD:'🇨🇦',NZD:'🇳🇿',SEK:'🇸🇪',NOK:'🇳🇴',DKK:'🇩🇰',ZAR:'🇿🇦',MXN:'🇲🇽',INR:'🇮🇳',HKD:'🇭🇰',SGD:'🇸🇬',CNH:'🇭🇰',CNY:'🇨🇳',KRW:'🇰🇷',TWD:'🇹🇼',PLN:'🇵🇱',CZK:'🇨🇿',HUF:'🇭🇺',TRY:'🇹🇷',ILS:'🇮🇱',BRL:'🇧🇷',CLP:'🇨🇱',COP:'🇨🇴'};
const flag = c => FLAG[c] || '🏳';
const underlying = f => f.quote ? `<span class="flags">${flag(f.base)}${flag(f.quote)}</span>${f.base}/${f.quote}` : `<span class="flags">${flag(f.ccy)}</span>${f.ccy}`;

const BBG_FX = [['EUR','USD',1.1707],['GBP','USD',1.3576],['AUD','USD',.7196],['NZD','USD',.5903],['USD','CAD',1.3609],['USD','CHF',.7822],['USD','DKK',6.3827],['USD','INR',95.32],['USD','JPY',157.68],['USD','MXN',17.3741],['USD','NOK',9.2402],['USD','SEK',9.246],['USD','ZAR',16.6371],['USD','HKD',7.83],['USD','SGD',1.29],['USD','CNH',7.15],['USD','KRW',1440],['USD','TWD',30.5],['USD','PLN',3.65],['USD','CZK',21.2],['USD','HUF',330],['USD','TRY',44],['USD','ILS',3.6],['USD','BRL',5.45],['USD','CLP',940],['USD','COP',4100]];
const BBG_IR = [['USD','SOFR'],['EUR','ESTR'],['JPY','TONA'],['GBP','SONIA'],['CHF','SARON'],['AUD','AONIA'],['CAD','CORRA'],['CNY','SHIBOR'],['HKD','HONIA'],['SGD','SORA'],['SEK','SWESTR'],['NOK','NOWA'],['NZD','NZONIA'],['KRW','KOFR'],['INR','MIBOR'],['MXN','TIIE'],['ZAR','ZARONIA'],['DKK','DESTR'],['PLN','POLONIA'],['TWD','TAIBOR'],['CNH','HIBOR'],['CZK','CZEONIA'],['HUF','BUBORON'],['ILS','TELBORON'],['TRY','TLREF'],['BRL','CDI'],['CLP','CAMARA'],['COP','IBR']];
const ORE_FX = BBG_FX.slice(0, 13);
const ORE_IR = [['USD','LIBOR-3M'],['EUR','EURIBOR-3M'],['GBP','LIBOR-6M'],['JPY','LIBOR-6M']];
const ENGINES = ['Cox-Ingersoll-Ross', 'Vasicek', 'Hull-White', 'Black-Karasinski', 'Two-Factor Gaussian'];

const PROVIDERS = [
  {code: 'ORE', name: 'ORE', kind: 'Reference set', icon: '◫', says: 'Simulates the market data that ships with the ORE examples: the rates and FX of 5 February 2016. Use it to run the ORE example portfolios against ticks that move.'},
  {code: 'BBG', name: 'Bloomberg', kind: 'Data vendor', icon: '▣', says: 'Simulates Bloomberg’s composite FX spots and overnight and swap rates for the major currencies. Bound: every party bound to it stores its ticks.'},
  {code: 'REF', name: 'Refinitiv', kind: 'Data vendor', icon: '▣', says: 'Simulates Refinitiv composite FX quotes and money-market rates.', scale: ['R', 420]},
  {code: 'ICE', name: 'ICE', kind: 'Exchange', icon: '▣', says: 'Simulates ICE benchmark rates and futures-implied curves.', scale: ['I', 380]},
  {code: 'CME', name: 'CME', kind: 'Exchange', icon: '▣', says: 'Simulates CME FX futures and SOFR-linked curves.', scale: ['C', 610]},
  {code: 'LSE', name: 'LSE', kind: 'Exchange', icon: '▣', says: 'Simulates London Stock Exchange group FX and rate quotes.', scale: ['L', 290]},
  {code: 'EUX', name: 'Eurex', kind: 'Exchange', icon: '▣', says: 'Simulates Eurex euro-rate futures and the curves they imply.', scale: ['X', 520]},
];
const ASSET_CLASSES = [
  {code: 'FX', name: 'FX', instrument: 'FX spot', kind: 'fx', icon: '⇄'},
  {code: 'RATES', name: 'Rates', instrument: 'IR curve', kind: 'ir', icon: '⌒'},
];
const acOf = kind => ASSET_CLASSES.find(a => a.kind === kind);

let seq = 0;
const uuid = () => 'xxxxxxxx-xxxx-4xxx-8xxx-xxxxxxxxxxxx'.replace(/x/g, () => (Math.random() * 16 | 0).toString(16));
const FEEDS = [];
function fx(provider, collection, [base, quote, level], on, i) {
  FEEDS.push({id: ++seq, uuid: uuid(), kind: 'fx', provider, collection, base, quote, label: `${base}/${quote}`, value: level,
    source: `synthetic.${(collection || provider).toLowerCase().replace(/ /g, '')}.${(base + quote).toLowerCase()}`,
    series: `oresmd://fx/${base}?type=quote&instrument=fx_spot&quote=rate&ccy=${quote}`,
    engine: 'Geometric', every: 2, enabled: i % 17 !== 5, autoStart: provider !== 'ORE', running: on, ticks: on ? 1800 : 0});
}
function ir(provider, collection, [ccy, family], on, i) {
  FEEDS.push({id: ++seq, uuid: uuid(), kind: 'ir', provider, collection, ccy, label: `${ccy} ${family}`, value: .03,
    source: `synthetic.${(collection || provider).toLowerCase().replace(/ /g, '')}.${(ccy + family).toLowerCase().replace(/-/g, '')}`,
    series: `oresmd://ir/${ccy}?type=quote&instrument=ir_swap&quote=rate&tenor=1D`,
    engine: ENGINES[i % ENGINES.length], every: 60, enabled: true, autoStart: provider !== 'ORE', running: on, ticks: on ? 60 : 0});
}
const bbgOn = state === 'mixed';
BBG_FX.forEach((p, i) => fx('Bloomberg', null, p, bbgOn, i));
BBG_IR.forEach((p, i) => ir('Bloomberg', null, p, false, i));
ORE_FX.forEach((p, i) => fx('ORE', '2016 ORE Samples', p, false, i));
ORE_IR.forEach((p, i) => ir('ORE', '2016 ORE Samples', p, false, i));
if (state === 'scale') {
  for (const p of PROVIDERS.filter(p => p.scale)) {
    const [prefix, n] = p.scale;
    for (let i = 0; i < n; i++) fx(p.name, null, ['USD', prefix + String(i).padStart(3, '0'), 1 + i / 100], i % 3 === 0, i);
    for (let i = 0; i < Math.round(n / 4); i++) ir(p.name, null, ['USD', 'CURVE' + i], false, i);
  }
}
for (const f of FEEDS) f.path = [f.provider, ...(f.collection ? [f.collection] : []), acOf(f.kind).name, acOf(f.kind).instrument];

const esc = t => String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');
const fmt = v => Math.abs(v) >= 100 ? v.toFixed(2) : Math.abs(v) >= 1 ? v.toFixed(4) : v.toFixed(5);
const every = s => s < 60 ? `${s} s` : `${s / 60} min`;
const providerOf = name => PROVIDERS.find(p => p.name === name);

/* A folder is a path. Its feeds are the feeds under that path. */
const KEY = p => p.join('/');
const underPath = (f, p) => p.every((x, i) => f.path[i] === x);
function childrenOf(path) {
  if (path.length === 0) return [...new Set(FEEDS.map(f => f.path[0]))].map(n => [n]);
  const depth = path.length;
  return [...new Set(FEEDS.filter(f => underPath(f, path) && f.path.length > depth + 1).map(f => f.path[depth]))].map(n => [...path, n]);
}
const iconOf = path => {
  if (path.length === 1) return providerOf(path[0]).icon;
  const last = path[path.length - 1];
  const ac = ASSET_CLASSES.find(a => a.name === last || a.instrument === last);
  return ac ? ac.icon : '◫';
};
function roll(path) {
  const all = FEEDS.filter(f => underPath(f, path));
  const running = all.filter(f => f.running).length;
  return {total: all.length, running, fx: all.filter(f => f.kind === 'fx').length, ir: all.filter(f => f.kind === 'ir').length,
    shouldRun: all.filter(f => f.autoStart && f.enabled && !f.running).length};
}
const stateTag = r => r.total === 0 ? '<span class="tag plan">Empty</span>' : r.running === r.total ? '<span class="tag ok">Running</span>' : r.running === 0 ? '<span class="tag">Stopped</span>' : `<span class="tag warn">${r.running} of ${r.total}</span>`;

let tab = screen === 'tree' ? 'tree' : 'dashboard';
let selected = params.get('node') ? params.get('node').split('/') : ['Bloomberg'];
let provider = 'Bloomberg';
const expanded = new Set(['Bloomberg', 'ORE']);
let query = state === 'search' ? 'usd sofr' : '';
let runState = 'all';
let assetClass = 'all';
let page = 0, pageSize = 25;
let pick = {mode: 'ids', ids: new Set(), excluded: new Set()};
let toast = [];
let pending = null;
let adding = false;
let openFeed = FEEDS[0];

const resetPick = () => { pick = {mode: 'ids', ids: new Set(), excluded: new Set()}; page = 0; };
const matchesFilter = f =>
  (runState === 'all' || (runState === 'started') === f.running) &&
  (assetClass === 'all' || acOf(f.kind).code === assetClass) &&
  (!query || query.toLowerCase().split(/\s+/).every(w => `${f.label} ${f.source} ${f.path.join(' ')}`.toLowerCase().includes(w)));
/* A search reaches every folder; without one the folder chosen limits the table. */
const scoped = () => FEEDS.filter(f => (query ? true : underPath(f, selected)) && matchesFilter(f));
const pickedCount = () => pick.mode === 'all' ? scoped().length - pick.excluded.size : pick.ids.size;
const isPicked = f => pick.mode === 'all' ? !pick.excluded.has(f.id) : pick.ids.has(f.id);
const pagePick = rows => rows.length > 0 && rows.every(isPicked);

function resolvePick() {
  return pick.mode === 'all' ? scoped().filter(f => !pick.excluded.has(f.id)) : FEEDS.filter(f => pick.ids.has(f.id));
}
function ask(action, feeds, label) {
  pending = {action, feeds, label, touched: feeds.filter(f => action === 'start' ? !f.running : f.running).length};
  draw();
}
function act() {
  const {action, feeds} = pending;
  let changed = 0, already = 0, skipped = 0;
  for (const f of feeds) {
    if (action === 'start') {
      if (f.running) { already++; continue; }
      const held = FEEDS.some(o => o.running && o.series === f.series && o !== f);
      if (!f.enabled || held) { skipped++; continue; }
      f.running = true; f.ticks = 1; changed++;
    } else if (f.running) { f.running = false; changed++; } else already++;
  }
  toast = action === 'start'
    ? [`Started ${changed.toLocaleString()} feeds. ${already.toLocaleString()} were already running.`, skipped ? `${skipped.toLocaleString()} skipped: the feed is disabled, or another running feed publishes the same series.` : 'None skipped.']
    : [`Stopped ${changed.toLocaleString()} feeds. ${already.toLocaleString()} were not running.`];
  pending = null;
  resetPick();
  draw();
  setTimeout(() => { toast = []; draw(); }, 6000);
}

const crumbTrail = (...parts) => `<p class="crumbs">${parts.join(' › ')}</p>`;
const toMarket = '<a href="#" data-go="market">Market data</a>';
const toSynthetic = '<a href="#" data-go="dashboard">Synthetic</a>';

function marketScreen() {
  return `${crumbTrail('<b>Market data</b>')}
    <div class="top"><h1>Market data</h1></div><p class="muted">The prices and curves the platform receives or generates.</p>
    <div class="cards"><div class="card" data-go="dashboard"><span class="ic">◇</span><h3>Synthetic</h3><p class="muted">The feeds the platform generates: what runs by provider, and every feed in a tree you can start and stop.</p></div>
      <div class="card"><span class="ic">〜</span><h3>Curve evolution</h3><p class="muted">Read a curve or surface over a range of instants, and as it stands now.</p></div></div>
    <p class="notice">Synthetic is one screen with two tabs. The FX price feeds and IR curve feeds cards are gone: the Feed tree tab lists both. Real market data will get its own card here.</p>`;
}

function tabs() {
  return `<div class="tabs"><button class="tab ${tab === 'dashboard' ? 'on' : ''}" data-tab="dashboard">Dashboard</button><button class="tab ${tab === 'tree' ? 'on' : ''}" data-tab="tree">Feed tree</button></div>`;
}

function shouldRunBanner() {
  const total = roll([]).shouldRun;
  if (!total) return '';
  const word = state === 'restart' ? 'The synthetic service restarted and did not start them again.' : 'They are enabled and marked to start automatically.';
  return `<div class="alert"><span><b>${total.toLocaleString()} feeds should be running and are stopped.</b> ${word}</span>
    <button class="btn primary" data-startshould="1">Start them</button><button class="btn" data-showstopped="1">Show them in the tree</button></div>`;
}

function dashboardScreen() {
  const all = roll([]);
  const rows = PROVIDERS.filter(p => FEEDS.some(f => f.provider === p.name)).map(p => {
    const r = roll([p.name]);
    return `<tr class="row" data-provider="${p.name}" ${provider === p.name ? 'style="background:#1d2633"' : ''}><td><span class="ico">${p.icon}</span> <b>${p.name}</b> <span class="tag">${p.kind}</span></td>
      <td class="muted" style="max-width:420px">${p.says}</td><td class="faint">${r.fx.toLocaleString()} FX · ${r.ir.toLocaleString()} Rates</td>
      <td class="num">${r.total.toLocaleString()}</td><td>${stateTag(r)}</td>
      <td class="num">${r.shouldRun ? `<span class="tag warn">${r.shouldRun.toLocaleString()} stopped</span>` : ''}</td>
      <td><button class="btn" data-pstart="${p.name}" ${r.running === r.total ? 'disabled' : ''}>Start</button> <button class="btn" data-pstop="${p.name}" ${r.running === 0 ? 'disabled' : ''}>Stop</button></td></tr>`;
  }).join('');
  const p = providerOf(provider);
  const classes = ASSET_CLASSES.map(a => {
    const path = [provider];
    const feeds = FEEDS.filter(f => underPath(f, path) && acOf(f.kind) === a);
    const run = feeds.filter(f => f.running).length;
    return feeds.length ? `<tr><td><span class="ico">${a.icon}</span> ${a.name}</td><td>${a.instrument}</td><td class="num">${feeds.length.toLocaleString()}</td>
      <td>${stateTag({total: feeds.length, running: run})}</td><td><button class="btn link" data-treeclass="${a.code}">Open in the feed tree</button></td></tr>` : '';
  }).join('');
  return `${crumbTrail(toMarket, '<b>Synthetic</b>')}
    <div class="top"><h1>Synthetic</h1><span class="muted">${all.running.toLocaleString()} of ${all.total.toLocaleString()} feeds running</span></div>${tabs()}
    ${shouldRunBanner()}
    <div class="panel"><table><thead><tr><th>Provider</th><th>What it simulates</th><th>Holds</th><th class="num">Feeds</th><th>State</th><th class="num">Should run</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>
    <div class="panel"><div class="top"><h1>${p.name}</h1><span class="tag">${p.kind}</span>${stateTag(roll([p.name]))}</div>
      <table><thead><tr><th>Asset class</th><th>Instrument</th><th class="num">Feeds</th><th>State</th><th></th></tr></thead><tbody>${classes}</tbody></table></div>`;
}

function treeRows(path, depth) {
  return childrenOf(path).map(p => {
    const key = KEY(p), kids = childrenOf(p), open = expanded.has(key) || !!query;
    if (query && !FEEDS.some(f => underPath(f, p) && matchesFilter(f))) return '';
    const r = roll(p);
    const row = `<div class="node ${KEY(selected) === key ? 'sel' : ''}" data-node="${esc(key)}" style="padding-left:${6 + depth * 16}px">
      <span class="twisty" data-twist="${esc(key)}">${kids.length ? (open ? '▾' : '▸') : ''}</span><span class="ico">${iconOf(p)}</span><span class="name">${p[p.length - 1]}</span>
      <span class="roll"><span class="count">${r.running.toLocaleString()}/${r.total.toLocaleString()}</span><span class="meter"><i style="width:${r.total ? 100 * r.running / r.total : 0}%"></i></span></span></div>`;
    return row + (kids.length && open ? treeRows(p, depth + 1) : '');
  }).join('');
}

function pager(total) {
  const first = total === 0 ? 0 : page * pageSize + 1, last = Math.min(total, (page + 1) * pageSize);
  const pages = Math.max(1, Math.ceil(total / pageSize));
  return `<div class="pager"><span>Rows per page</span><select class="sel-box" id="size">${[25, 50, 100, 200].map(n => `<option ${n === pageSize ? 'selected' : ''}>${n}</option>`).join('')}</select>
    <span>${first.toLocaleString()}–${last.toLocaleString()} of ${total.toLocaleString()}</span>
    <button class="btn" data-page="first" ${page === 0 ? 'disabled' : ''}>«</button><button class="btn" data-page="prev" ${page === 0 ? 'disabled' : ''}>‹</button>
    <span>Page ${page + 1} of ${pages.toLocaleString()}</span>
    <button class="btn" data-page="next" ${page + 1 >= pages ? 'disabled' : ''}>›</button><button class="btn" data-page="last" ${page + 1 >= pages ? 'disabled' : ''}>»</button></div>`;
}

function treeScreen() {
  const rows = scoped();
  if (page * pageSize >= rows.length) page = 0;
  const shown = rows.slice(page * pageSize, (page + 1) * pageSize);
  const n = pickedCount();
  const pageAll = pagePick(shown);
  const offer = pick.mode === 'ids' && pageAll && rows.length > shown.length
    ? `<button class="btn link" data-pickall="1">Select all ${rows.length.toLocaleString()} that match</button>` : '';
  const allMode = pick.mode === 'all' ? `<span class="muted">Every feed that matches the filter${pick.excluded.size ? `, except ${pick.excluded.size.toLocaleString()}` : ''}. The server finds them.</span>` : '';
  const bar = n > 0 ? `<div class="pickbar"><b>${n.toLocaleString()} selected</b>${offer}${allMode}
      <span class="grow" style="margin-left:auto"></span><button class="btn" data-pickstart="1">Start</button><button class="btn" data-pickstop="1">Stop</button><button class="btn link" data-pickclear="1">Clear</button></div>` : '';
  const body = shown.map(f => `<tr class="row ${isPicked(f) ? 'picked' : ''}" data-feed="${f.id}">
      <td class="chk"><input type="checkbox" data-pick="${f.id}" ${isPicked(f) ? 'checked' : ''} aria-label="Select ${esc(f.label)}"></td>
      <td>${f.running ? '<span class="tag ok">Running</span>' : '<span class="tag">Stopped</span>'}</td><td>${f.enabled ? '<span class="tag ok">Enabled</span>' : '<span class="tag bad">Disabled</span>'}</td>
      <td>${f.label}${query ? ` <span class="faint">${f.path[0]}</span>` : ''}</td><td>${acOf(f.kind).name}</td><td>${underlying(f)}</td><td>${f.engine}</td>
      <td class="num">${every(f.every)}</td></tr>`).join('');
  const head = selected.length ? selected.join(' › ') : 'All feeds';
  const acOptions = [['all', 'All asset classes'], ...ASSET_CLASSES.map(a => [a.code, a.name])];
  return `${crumbTrail(toMarket, toSynthetic, '<b>Feed tree</b>')}
    <div class="top"><h1>Synthetic</h1></div>${tabs()}
    <div class="split"><div class="panel"><div class="tree"><div class="node ${selected.length === 0 ? 'sel' : ''}" data-node=""><span class="ico">◇</span><span class="name">All providers</span></div>${treeRows([], 1)}</div></div>
    <div class="panel">
      <div class="toolbar"><input class="search" id="q" placeholder="Search every provider by name, source or folder" value="${esc(query)}">
        <select class="sel-box" id="state" aria-label="State">${[['all', 'All'], ['started', 'Started'], ['stopped', 'Stopped']].map(([v, l]) => `<option value="${v}" ${v === runState ? 'selected' : ''}>${l}</option>`).join('')}</select>
        <select class="sel-box" id="class" aria-label="Asset class">${acOptions.map(([v, l]) => `<option value="${v}" ${v === assetClass ? 'selected' : ''}>${l}</option>`).join('')}</select>
        <button class="btn primary" id="add">Add feed</button></div>
      <p class="crumbs">${query ? `<b>${rows.length.toLocaleString()} matches in every provider</b>` : `<b>${head}</b> · ${rows.length.toLocaleString()} feeds`}</p>
      ${bar}
      <table><thead><tr><th class="chk"><input type="checkbox" id="pickpage" ${pageAll ? 'checked' : ''} aria-label="Select this page"></th><th>State</th><th>Enabled</th><th>Name</th><th>Asset class</th><th>Underlying</th><th>Engine</th><th class="num">Frequency</th></tr></thead>
        <tbody>${body || '<tr><td colspan="8" class="faint">No feed matches.</td></tr>'}</tbody></table>
      ${pager(rows.length)}</div></div>`;
}

function feedScreen() {
  const f = openFeed;
  const crumbs = [toMarket, toSynthetic, '<a href="#" data-tab="tree">Feed tree</a>', ...f.path.slice(0, -1).map((p, i) => `<a href="#" data-crumb="${esc(KEY(f.path.slice(0, i + 1)))}">${p}</a>`), `<b>${f.label}</b>`];
  return `${crumbTrail(...crumbs)}
    <div class="hero"><span style="font-size:2.2rem">${f.quote ? flag(f.base) + flag(f.quote) : flag(f.ccy)}</span><div><div class="big">${f.label}</div><div class="muted">${acOf(f.kind).name} · ${acOf(f.kind).instrument} · ${f.running ? 'Running' : 'Stopped'}</div></div></div>
    <div class="panel"><p class="notice">The feed’s page, drawn as a stub. It is unchanged: its tabs (${f.kind === 'fx' ? 'mixture and ticks' : 'process, template and ticks'}), the Simple and Advanced forms and its history. Only its address and breadcrumb change.</p>
      <dl class="kv"><dt>Provider</dt><dd>${f.provider}</dd><dt>Source</dt><dd class="mono">${f.source}</dd><dt>Series</dt><dd class="mono">${esc(f.series)}</dd><dt>Engine</dt><dd>${f.engine}</dd><dt>Frequency</dt><dd>${every(f.every)}</dd></dl></div>`;
}

function draw() {
  document.getElementById('note').textContent = `Prototype · Synthetic · screen ${screen} · state ${state} · mock data · nothing is started`;
  const body = screen === 'market' ? marketScreen() : screen === 'feed' ? feedScreen() : tab === 'tree' ? treeScreen() : dashboardScreen();
  const dialog = pending ? `<div class="dialog-back"><div class="dialog"><h1>${pending.action === 'start' ? 'Start' : 'Stop'} ${pending.label}?</h1>
      <p>${pending.action === 'start' ? `Starts ${pending.touched.toLocaleString()} of ${pending.feeds.length.toLocaleString()} feeds. The others already run.` : `Stops ${pending.touched.toLocaleString()} running feeds.`}</p>
      ${pending.action === 'stop' && pending.feeds.some(f => f.provider === 'Bloomberg') ? '<p>Every party bound to these feeds stops receiving their ticks.</p>' : ''}
      <p class="faint">One request. It carries the filter and the picked or excluded ids, and the server resolves the feeds, starts them and reports what it started, what already ran and what it skipped.</p>
      <div class="toolbar"><button class="btn primary" id="go">${pending.action === 'start' ? 'Start' : 'Stop'}</button><button class="btn" id="cancel">Cancel</button></div></div></div>` : '';
  const addDialog = adding ? `<div class="dialog-back"><div class="dialog"><h1>Add a feed</h1>
      <p class="muted">The feed goes in ${selected.length ? selected.join(' › ') : 'a provider you choose'}. Choose its kind; its own form opens next.</p>
      <div class="toolbar"><button class="btn primary" data-add="fx">FX spot</button><button class="btn primary" data-add="ir">IR curve</button><button class="btn" id="cancel-add">Cancel</button></div></div></div>` : '';
  document.getElementById('app').innerHTML = body + dialog + addDialog + (toast.length ? `<div class="toast">${toast.map(t => `<span>${t}</span>`).join('')}</div>` : '');
  wire();
  bar.querySelectorAll('[data-sc]').forEach(b => b.classList.toggle('on', b.dataset.sc === (screen === 'dashboard' || screen === 'tree' ? tab : screen)));
}

function goTree(path, patch = {}) {
  screen = 'tree'; tab = 'tree'; selected = path; Object.assign(window, patch);
  for (let i = 1; i <= path.length; i++) expanded.add(KEY(path.slice(0, i)));
  query = ''; resetPick(); draw();
}

function wire() {
  const app = document.getElementById('app');
  app.querySelectorAll('[data-go]').forEach(e => e.onclick = ev => { ev.preventDefault(); screen = 'dashboard'; tab = 'dashboard'; if (e.dataset.go === 'market') screen = 'market'; draw(); });
  app.querySelectorAll('[data-tab]').forEach(e => e.onclick = ev => { ev.preventDefault(); screen = e.dataset.tab; tab = e.dataset.tab; draw(); });
  app.querySelectorAll('[data-crumb]').forEach(e => e.onclick = ev => { ev.preventDefault(); goTree(e.dataset.crumb.split('/')); });
  app.querySelectorAll('[data-provider]').forEach(e => e.onclick = ev => { if (ev.target.closest('button')) return; provider = e.dataset.provider; draw(); });
  app.querySelectorAll('[data-pstart]').forEach(e => e.onclick = () => ask('start', FEEDS.filter(f => f.provider === e.dataset.pstart), e.dataset.pstart));
  app.querySelectorAll('[data-pstop]').forEach(e => e.onclick = () => ask('stop', FEEDS.filter(f => f.provider === e.dataset.pstop), e.dataset.pstop));
  app.querySelectorAll('[data-startshould]').forEach(e => e.onclick = () => ask('start', FEEDS.filter(f => f.autoStart && f.enabled && !f.running), 'the feeds that should run'));
  app.querySelectorAll('[data-showstopped]').forEach(e => e.onclick = () => { goTree([]); runState = 'stopped'; draw(); });
  app.querySelectorAll('[data-treeclass]').forEach(e => e.onclick = () => { assetClass = e.dataset.treeclass; goTree([provider]); });
  app.querySelectorAll('[data-twist]').forEach(e => e.onclick = ev => { ev.stopPropagation(); const k = e.dataset.twist; expanded.has(k) ? expanded.delete(k) : expanded.add(k); draw(); });
  app.querySelectorAll('[data-node]').forEach(e => e.onclick = () => { selected = e.dataset.node ? e.dataset.node.split('/') : []; query = ''; resetPick(); for (let i = 1; i <= selected.length; i++) expanded.add(KEY(selected.slice(0, i))); draw(); });
  app.querySelectorAll('[data-feed]').forEach(e => e.onclick = ev => { if (ev.target.closest('input')) return; openFeed = FEEDS.find(f => f.id == e.dataset.feed); screen = 'feed'; draw(); });
  app.querySelectorAll('[data-pick]').forEach(e => e.onchange = () => {
    const id = Number(e.dataset.pick);
    if (pick.mode === 'all') { e.checked ? pick.excluded.delete(id) : pick.excluded.add(id); }
    else { e.checked ? pick.ids.add(id) : pick.ids.delete(id); }
    draw();
  });
  const pp = document.getElementById('pickpage');
  if (pp) pp.onchange = () => {
    const rows = scoped().slice(page * pageSize, (page + 1) * pageSize);
    for (const f of rows) {
      if (pick.mode === 'all') { pp.checked ? pick.excluded.delete(f.id) : pick.excluded.add(f.id); }
      else { pp.checked ? pick.ids.add(f.id) : pick.ids.delete(f.id); }
    }
    draw();
  };
  app.querySelectorAll('[data-pickall]').forEach(e => e.onclick = () => { pick = {mode: 'all', ids: new Set(), excluded: new Set()}; draw(); });
  app.querySelectorAll('[data-pickclear]').forEach(e => e.onclick = () => { resetPick(); draw(); });
  app.querySelectorAll('[data-pickstart]').forEach(e => e.onclick = () => ask('start', resolvePick(), `${pickedCount().toLocaleString()} feeds`));
  app.querySelectorAll('[data-pickstop]').forEach(e => e.onclick = () => ask('stop', resolvePick(), `${pickedCount().toLocaleString()} feeds`));
  app.querySelectorAll('[data-page]').forEach(e => e.onclick = () => {
    const pages = Math.max(1, Math.ceil(scoped().length / pageSize));
    page = {first: 0, prev: Math.max(0, page - 1), next: Math.min(pages - 1, page + 1), last: pages - 1}[e.dataset.page]; draw();
  });
  const size = document.getElementById('size'); if (size) size.onchange = () => { pageSize = Number(size.value); page = 0; draw(); };
  const q = document.getElementById('q');
  if (q) q.oninput = () => { query = q.value; resetPick(); draw(); const again = document.getElementById('q'); again.focus(); again.setSelectionRange(again.value.length, again.value.length); };
  const st = document.getElementById('state'); if (st) st.onchange = () => { runState = st.value; resetPick(); draw(); };
  const cl = document.getElementById('class'); if (cl) cl.onchange = () => { assetClass = cl.value; resetPick(); draw(); };
  const add = document.getElementById('add'); if (add) add.onclick = () => { adding = true; draw(); };
  const ca = document.getElementById('cancel-add'); if (ca) ca.onclick = () => { adding = false; draw(); };
  app.querySelectorAll('[data-add]').forEach(e => e.onclick = () => { adding = false; toast = [`A new ${e.dataset.add === 'fx' ? 'FX spot' : 'IR curve'} feed would open its own form here.`]; draw(); setTimeout(() => { toast = []; draw(); }, 4000); });
  const goBtn = document.getElementById('go'); if (goBtn) goBtn.onclick = act;
  const cancel = document.getElementById('cancel'); if (cancel) cancel.onclick = () => { pending = null; draw(); };
}

const bar = document.getElementById('bar');
bar.innerHTML = '<span class="label faint">Screen</span>' +
  [['market', 'Market data'], ['dashboard', 'Dashboard'], ['tree', 'Feed tree']].map(([v, l]) => `<button data-sc="${v}">${l}</button>`).join('') +
  '<span class="sep">|</span><span class="label faint">State</span>' +
  ['mixed', 'restart', 'stopped', 'scale', 'search'].map(s => `<button data-s="${s}" class="${s === state ? 'on' : ''}">${s}</button>`).join('');
bar.querySelectorAll('[data-sc]').forEach(b => b.onclick = () => { screen = b.dataset.sc; tab = screen === 'tree' ? 'tree' : 'dashboard'; draw(); });
bar.querySelectorAll('[data-s]').forEach(b => b.onclick = () => set('state', b.dataset.s));

if (state === 'restart' || state === 'stopped') FEEDS.forEach(f => { f.running = false; f.ticks = 0; });
if (state === 'stopped') FEEDS.forEach(f => { f.autoStart = false; });
draw();
</script>
</body>
</html>
