---
name: RLS system tenant widenings
on:  # yamllint disable-line rule:truthy
  push:
    branches: ["main"]
    paths:
      - "projects/ores.sql/create/**"
      - "projects/ores.codegen/scripts/check_rls_system_tenant_widenings.py"
      - "projects/ores.codegen/tests/test_check_rls_system_tenant_widenings.py"
      - ".github/workflows/rls-system-tenant-widenings.yml"

  pull_request:
    branches: ["main"]
    paths:
      - "projects/ores.sql/create/**"
      - "projects/ores.codegen/scripts/check_rls_system_tenant_widenings.py"
      - "projects/ores.codegen/tests/test_check_rls_system_tenant_widenings.py"
      - ".github/workflows/rls-system-tenant-widenings.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  # A policy that also admits the system tenant lets a service's own identity
  # see every tenant, and makes the system tenant's own reads list every
  # tenant's rows. That is how the root tenant came to list every tenant's
  # parties. A service that needs a tenant's data acts inside the tenant
  # instead, so a new widening fails here unless it is a reviewed exception.
  widenings:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Check no policy widens to the system tenant unlisted
        run: |
          python3 projects/ores.codegen/scripts/check_rls_system_tenant_widenings.py
      - name: Install test dependencies
        run: |
          pip install --quiet pytest
      - name: Test the check
        run: |
          python3 -m pytest projects/ores.codegen/tests/test_check_rls_system_tenant_widenings.py -q
