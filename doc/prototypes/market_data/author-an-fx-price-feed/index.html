<style>

body{margin:0;font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;padding:2.5rem 1.5rem 8rem}
h1,h2,h3{margin:0;font-weight:600}h1{font-size:1.15rem}h2{font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-dim)}

.mono{font-family:var(--mono)}.muted{color:var(--ink-dim)}.faint{color:var(--ink-faint)}
.wrap{max-width:1080px;margin:0 auto;display:grid;gap:14px}

.field .value,.field select,.field input{background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:6px 8px}

<table class="prototype-links" style="width:100%;border-collapse:collapse;margin:0;font:500 13px/1.6 Inter,system-ui,sans-serif;color:inherit;background:rgba(127,127,127,.12);border-bottom:1px solid rgba(127,127,127,.35)">

<!--
  PROTOTYPE. Throwaway. Mock data, no backend, no build step, no session.

  Author an FX price feed — the "Edit FX Rate" MDI editor of the ores.qt
  synthetic plugin (FxSpotRateEditor.cpp). The screen authors one synthetic FX
  spot feed: the currency pair, the ORE key derived from it, the price source,
  and the stochastic process that generates the ticks. Tabs: Instrument |
  Price behaviour | Provenance.

  Variants with ?variant=a|b|c. The variant is the presentation:
    a  Instrument and Provenance tables — the pair, the derived ORE key, the
       price source, and the audit row the save would write.
    b  Price behaviour — engine, tick rate, Simple sliders (Drift, Volatility,
       and for Ornstein-Uhlenbeck Long-Term Mean and Mean Reversion Speed with
       the derived half-life), then the return-distribution and sample-paths
       charts.
    c  The Advanced GMM component editor — the μ/σ/w table, the weight sum, and
       the mixture density.

  ?state=geometric|ou|gmm|invalid switches the mock feed:
    geometric  Geometric Brownian Motion, valid pair, components sum to 1.
    ou         Ornstein-Uhlenbeck, so the half-life and the price-domain
               steady-state density apply.
    gmm        Gaussian Mixture, three components, weights sum to 1.
    invalid    base == quote with malformed codes, the weights sum to 0.95, and
               the vintage browser is disconnected ("No vintages found").

  Nothing here reads a service; every value is a mock of what the screen would
  show. Charts come from the shared PC helper; oresmd links open the URL editor.
-->

<div class="proto-note" id="note"></div>
<div class="wrap" id="app"></div>
<div class="proto-bar" id="bar"></div>

<script>
const params = new URLSearchParams(location.search);
const variant = params.get('variant') || 'a';
const state = params.get('state') || '';

// Prototype plotting helper. Throwaway, dependency-free, dark-theme SVG.
// Each function returns an HTML string, so a page calls host.innerHTML = PC.line({...}).
// Prefixed PC to stay clear of page-local names; the pages also define `tag`.
const PC = (() => {
  const C = {grid:'#21262d', axis:'#30363d', text:'#71717a', dim:'#a1a1aa',
             ink:'#e3e3e6', accent:'#58a6ff', ok:'#3fb950', warn:'#d29922', bad:'#f85149'};
  const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const fmt = (v, d) => v == null ? '—' : (typeof v === 'number' ? v.toFixed(d ?? 2) : String(v));
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  // A blue -> amber ramp for a heat cell, t in 0..1.
  function heatColour(t){
    const stops = [[13,23,38],[21,60,110],[32,110,170],[88,166,255],[210,153,34],[248,81,73]];
    const p = clamp(t, 0, 1) * (stops.length - 1), i = Math.floor(p), f = p - i;
    const a = stops[i], b = stops[Math.min(stops.length - 1, i + 1)];
    return `rgb(${a.map((x, k) => Math.round(x + (b[k] - x) * f)).join(',')})`;
  }

  // Shared frame: margins, y gridlines and labels for a value axis.
  function frame(o){
    const w = o.w || 940, h = o.h || 300;
    const pad = Object.assign({l:64, r:18, t:16, b:40}, o.pad || {});
    const x0 = pad.l, x1 = w - pad.r, y0 = h - pad.b, y1 = pad.t;
    const vals = (o.series || []).flatMap(s => s.points || []).filter(v => v != null)
      .concat(o.extra || []);
    let lo = Math.min(...vals), hi = Math.max(...vals);
    if (o.zero) { lo = Math.min(lo, 0); hi = Math.max(hi, 0); }
    if (!(hi > lo)) { hi = lo + 1; }
    const span = hi - lo, l2 = lo - span * 0.08, h2 = hi + span * 0.08;
    const y = v => y0 - (v - l2) * (y0 - y1) / (h2 - l2);
    const X = o.x ? (i => x0 + o.x[i] * (x1 - x0))
                  : (i => x0 + i * (x1 - x0) / Math.max(1, (o.ticks ? o.ticks.length : 1) - 1));
    const yTicks = [];
    const steps = o.ySteps || 4;
    for (let k = 0; k <= steps; k++) {
      const v = l2 + (h2 - l2) * k / steps;
      yTicks.push(`<line x1="${x0}" y1="${y(v).toFixed(1)}" x2="${x1}" y2="${y(v).toFixed(1)}" stroke="${C.grid}"/>
        <text x="${x0 - 8}" y="${(y(v) + 3.5).toFixed(1)}" fill="${C.text}" font-size="10" text-anchor="end">${esc((o.yFmt || (v => fmt(v)))(v))}</text>`);
    }
    const xTicks = (o.ticks || []).map(t => {
      const px = o.x ? x0 + t.at * (x1 - x0) : X(t.at);
      return `<text x="${px.toFixed(1)}" y="${h - pad.b + 15}" fill="${C.text}" font-size="10" text-anchor="middle">${esc(t.label)}</text>`;
    }).join('');
    const grid = (o.xticks || []).map(t => {
      const px = o.x ? x0 + t.at * (x1 - x0) : X(t.at);
      return `<line x1="${px.toFixed(1)}" y1="${y1}" x2="${px.toFixed(1)}" y2="${y0}" stroke="${C.grid}" stroke-dasharray="2 3"/>`;
    }).join('');
    return {w, h, x0, x1, y0, y1, y, X, l2, h2, frame: yTicks.join('') + grid + xTicks};
  }

  function line(o){
    const f = frame(o);
    const bands = (o.bands || []).map(b => {
      const xa = f.x0 + b.from * (f.x1 - f.x0), xb = f.x0 + b.to * (f.x1 - f.x0);
      return `<rect x="${xa.toFixed(1)}" y="${f.y1}" width="${(xb - xa).toFixed(1)}" height="${(f.y0 - f.y1).toFixed(1)}"
        fill="${b.color || C.accent}" opacity=".08"/>` +
        (b.label ? `<text x="${((xa + xb) / 2).toFixed(1)}" y="${f.y1 + 11}" fill="${C.text}" font-size="9" text-anchor="middle">${esc(b.label)}</text>` : '');
    }).join('');
    const paths = (o.series || []).map(s => {
      let d = '', pen = false;
      s.points.forEach((v, i) => {
        if (v == null) { pen = false; return; }
        d += (pen ? 'L' : 'M') + f.X(i).toFixed(1) + ',' + f.y(v).toFixed(1) + ' ';
        pen = true;
      });
      const marks = s.markers ? s.points.map((v, i) => v == null ? '' :
        `<circle cx="${f.X(i).toFixed(1)}" cy="${f.y(v).toFixed(1)}" r="${s.r || 3.4}" fill="${s.color}"/>`).join('') : '';
      return `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="${s.width || 2}"${s.dash ? ` stroke-dasharray="${s.dash}"` : ''}/>${marks}`;
    }).join('');
    const legend = o.legend === false ? '' : `<div class="pc-legend">${(o.series || []).map(s =>
      `<span><i style="background:${s.color}"></i>${esc(s.name)}</span>`).join('')}${(o.notes || []).map(n =>
      `<span class="faint">${n}</span>`).join('')}</div>`;
    return `<figure class="pc"><svg viewBox="0 0 ${f.w} ${f.h}" width="100%" height="${f.h}" role="img" aria-label="${esc(o.title || 'chart')}">
      ${bands}${f.frame}${paths}
      ${o.yLabel ? `<text x="14" y="${(f.y0 + f.y1) / 2}" fill="${C.text}" font-size="10" transform="rotate(-90 14 ${(f.y0 + f.y1) / 2})" text-anchor="middle">${esc(o.yLabel)}</text>` : ''}
    </svg>${legend}${o.caption ? `<figcaption class="faint">${o.caption}</figcaption>` : ''}</figure>`;
  }

  function bars(o){
    const f = frame(Object.assign({zero: true}, o));
    const n = o.bars.length, bw = (f.x1 - f.x0) / n;
    const zero = f.y(0);
    const body = o.bars.map((b, i) => {
      const v = b.value == null ? null : b.value;
      const x = f.x0 + i * bw + bw * 0.18, w = bw * 0.64;
      const yv = v == null ? zero : f.y(v);
      const top = Math.min(yv, zero), hgt = Math.abs(zero - yv);
      const col = b.color || (v == null ? C.text : v >= 0 ? C.warn : C.accent);
      return `<rect x="${x.toFixed(1)}" y="${top.toFixed(1)}" width="${w.toFixed(1)}" height="${Math.max(1, hgt).toFixed(1)}" fill="${col}" opacity=".85"><title>${esc(b.label)}: ${esc(fmt(v))}</title></rect>
        <text x="${(x + w / 2).toFixed(1)}" y="${(f.h - 24)}" fill="${C.text}" font-size="9" text-anchor="middle">${esc(b.label)}</text>`;
    }).join('');
    return `<figure class="pc"><svg viewBox="0 0 ${f.w} ${f.h}" width="100%" height="${f.h}" role="img" aria-label="${esc(o.title || 'bars')}">
      ${f.frame}<line x1="${f.x0}" y1="${zero}" x2="${f.x1}" y2="${zero}" stroke="${C.axis}"/>${body}</svg>
      ${o.caption ? `<figcaption class="faint">${o.caption}</figcaption>` : ''}</figure>`;
  }

  // A surface as a shaded mesh grid: one cell per (row, column).
  function heat(o){
    const rows = o.rows, cols = o.cols;
    const cw = o.cell || 54, ch = o.cellH || 30, l = 58, t = 26;
    const w = l + cols.length * cw + (o.legend === false ? 14 : 92);
    const h = t + rows.length * ch + 34;
    const vals = [];
    rows.forEach((_, i) => cols.forEach((_, j) => { const v = o.value(i, j); if (v != null) vals.push(v); }));
    const lo = Math.min(...vals), hi = Math.max(...vals), span = (hi - lo) || 1;
    const cells = [];
    rows.forEach((r, i) => cols.forEach((c, j) => {
      const v = o.value(i, j);
      const x = l + j * cw, y = t + i * ch;
      const col = v == null ? '#161619' : heatColour((v - lo) / span);
      cells.push(`<rect x="${x}" y="${y}" width="${cw - 2}" height="${ch - 2}" rx="2" fill="${col}"><title>${esc(r.label)} · ${esc(c.label)}: ${esc(fmt(v, o.dp))}</title></rect>`);
      if (o.showValues !== false) cells.push(`<text x="${(x + (cw - 2) / 2).toFixed(1)}" y="${(y + ch / 2 + 3.5).toFixed(1)}" fill="${(v != null && (v - lo) / span > 0.55) ? '#0d1117' : C.ink}" font-size="9.5" text-anchor="middle">${esc(fmt(v, o.dp ?? 1))}</text>`);
    }));
    const rowLabels = rows.map((r, i) => `<text x="${l - 8}" y="${(t + i * ch + ch / 2 + 3.5).toFixed(1)}" fill="${C.text}" font-size="10" text-anchor="end">${esc(r.label)}</text>`).join('');
    const colLabels = cols.map((c, j) => `<text x="${(l + j * cw + (cw - 2) / 2).toFixed(1)}" y="${t - 8}" fill="${C.text}" font-size="10" text-anchor="middle">${esc(c.label)}</text>`).join('');
    const legend = o.legend === false ? '' : (() => {
      const bx = l + cols.length * cw + 14, by = t, bh = rows.length * ch - 2;
      const steps = 24, sh = bh / steps;
      let g = '';
      for (let k = 0; k < steps; k++) g += `<rect x="${bx}" y="${(by + k * sh).toFixed(1)}" width="12" height="${(sh + 1).toFixed(1)}" fill="${heatColour(1 - k / (steps - 1))}"/>`;
      return `<g>${g}<text x="${bx + 18}" y="${by + 8}" fill="${C.text}" font-size="9">${esc(fmt(hi, o.dp))}</text>
        <text x="${bx + 18}" y="${by + bh}" fill="${C.text}" font-size="9">${esc(fmt(lo, o.dp))}</text></g>`;
    })();
    return `<figure class="pc"><svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" role="img" aria-label="${esc(o.title || 'heat map')}">
      ${cells.join('')}${rowLabels}${colLabels}${legend}
      ${o.xLabel ? `<text x="${(l + cols.length * cw / 2).toFixed(1)}" y="${h - 6}" fill="${C.text}" font-size="10" text-anchor="middle">${esc(o.xLabel)}</text>` : ''}
      ${o.yLabel ? `<text x="12" y="${(t + rows.length * ch / 2).toFixed(1)}" fill="${C.text}" font-size="10" transform="rotate(-90 12 ${(t + rows.length * ch / 2).toFixed(1)})" text-anchor="middle">${esc(o.yLabel)}</text>` : ''}
    </svg>${o.caption ? `<figcaption class="faint">${o.caption}</figcaption>` : ''}</figure>`;
  }

  // A surface as an isometric wireframe: rows and columns joined over a height.
  function mesh(o){
    const w = o.w || 940, h = o.h || 420;
    const rows = o.z.length, cols = o.z[0].length;
    const vals = o.z.flat().filter(v => v != null);
    const lo = Math.min(...vals), hi = Math.max(...vals), span = (hi - lo) || 1;
    const ox = o.ox ?? w * 0.52;
    const sy = o.sy ?? Math.min(22, h / (2 * Math.max(1, (rows - 1) + (cols - 1))));
    const sx = o.sx ?? Math.min(46, (w * 0.6) / Math.max(1, (rows - 1) + (cols - 1)));
    const sz = o.sz ?? h * 0.34;
    const oy = o.oy ?? h - 26 - ((rows - 1) + (cols - 1)) * sy;
    const P = (i, j) => {
      const v = o.z[i][j];
      const z = v == null ? 0 : (v - lo) / span;
      return [ox + (j - i) * sx, oy + (i + j) * sy - z * sz, z];
    };
    const lines = [];
    for (let i = 0; i < rows; i++) {
      let d = '';
      for (let j = 0; j < cols; j++) { const p = P(i, j); d += (j ? 'L' : 'M') + p[0].toFixed(1) + ',' + p[1].toFixed(1) + ' '; }
      lines.push(`<path d="${d}" fill="none" stroke="${C.accent}" stroke-width="1.4" opacity=".75"/>`);
    }
    for (let j = 0; j < cols; j++) {
      let d = '';
      for (let i = 0; i < rows; i++) { const p = P(i, j); d += (i ? 'L' : 'M') + p[0].toFixed(1) + ',' + p[1].toFixed(1) + ' '; }
      lines.push(`<path d="${d}" fill="none" stroke="${C.warn}" stroke-width="1" opacity=".5"/>`);
    }
    const rowL = (o.rows || []).map((r, i) => { const p = P(i, 0); return `<text x="${(p[0] - 12).toFixed(1)}" y="${(p[1] + 4).toFixed(1)}" fill="${C.text}" font-size="10" text-anchor="end">${esc(r.label)}</text>`; }).join('');
    const colL = (o.cols || []).map((c, j) => { const p = P(rows - 1, j); return `<text x="${(p[0] + 10).toFixed(1)}" y="${(p[1] + 4).toFixed(1)}" fill="${C.text}" font-size="10">${esc(c.label)}</text>`; }).join('');
    const axis = `<text x="14" y="${h - 12}" fill="${C.text}" font-size="10">height: ${esc(o.zLabel || 'value')} ${esc(fmt(lo, o.dp))}–${esc(fmt(hi, o.dp))}</text>`;
    return `<figure class="pc"><svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" role="img" aria-label="${esc(o.title || 'surface mesh')}">
      ${lines.join('')}${rowL}${colL}${axis}</svg>
      <div class="pc-legend"><span><i style="background:${C.accent}"></i>expiry</span><span><i style="background:${C.warn}"></i>strike</span>${(o.notes || []).map(n => `<span class="faint">${n}</span>`).join('')}</div>
      ${o.caption ? `<figcaption class="faint">${esc(o.caption)}</figcaption>` : ''}</figure>`;
  }

  return {line, bars, heat, mesh, colours: C, heatColour};
})();

function urlButton(url){
  return `<button class="urlbtn" type="button" data-url="${url}" title="Edit in the oresmd URL editor">`+
         `<span class="mono">${url}</span><span class="edit">edit</span></button>`;
}
function openOresmdEditor(url, host){
  const ov=document.createElement('div'); ov.className='oresmd-overlay';
  const f=document.createElement('iframe'); f.className='oresmd-frame'; f.title='oresmd URL editor';
  f.src='../oresmd-url-editor/index.html?embed=1&url='+encodeURIComponent(url||'');
  ov.appendChild(f); document.body.appendChild(ov);
  function close(){ window.removeEventListener('message', onMsg); document.removeEventListener('keydown', onKey); ov.remove(); }
  function onMsg(e){ if(e.data && e.data.type==='oresmd-url'){ host.dataset.url=e.data.url; const m=host.querySelector('.mono'); if(m) m.textContent=e.data.url; close(); } }
  function onKey(e){ if(e.key==='Escape') close(); }
  window.addEventListener('message', onMsg); document.addEventListener('keydown', onKey);
  ov.addEventListener('click', e=>{ if(e.target===ov) close(); });
}
document.addEventListener('click', e=>{
  const b=e.target.closest('.urlbtn'); if(!b) return;
  openOresmdEditor(b.dataset.url||'', b);
});
function tag(text, kind){ return `<span class="tag ${kind||''}">${text}</span>`; }

// ==== page data and panels ====
// Screen to model: ores.qt FxSpotRateEditor.cpp, the "Edit FX Rate" MDI editor.
// Tabs: Instrument | Price behaviour | Provenance. Every value below is a mock.

const CURRENCY = {EUR:'Euro', USD:'US Dollar', GBP:'Pound Sterling', JPY:'Japanese Yen', CHF:'Swiss Franc'};

const ENGINES = {
  geometric: {key:'geometric', name:'Geometric Brownian Motion', short:'GBM', domain:'return',
              blurb:'Log-normal returns with constant drift and volatility.'},
  ou:        {key:'ou', name:'Ornstein-Uhlenbeck', short:'OU', domain:'price',
              blurb:'Reverts to a long-term mean; absolute price levels, not log-returns.'},
  gmm:       {key:'gmm', name:'Gaussian Mixture', short:'GMM', domain:'return',
              blurb:'A regime mix of normal components: fat tails, skew and modes.'}
};

const COMPONENTS_OK = [
  {desc:'Normal-profile body', mu:-0.01, sigma:0.35, w:0.70},
  {desc:'Fat left tail',       mu:-0.55, sigma:0.90, w:0.20},
  {desc:'Right-skew burst',    mu: 0.60, sigma:0.55, w:0.10}
];
const COMPONENTS_BAD = [
  {desc:'Normal-profile body', mu:-0.01, sigma:0.35, w:0.65},
  {desc:'Fat left tail',       mu:-0.55, sigma:0.90, w:0.20},
  {desc:'Right-skew burst',    mu: 0.60, sigma:0.55, w:0.10}
];

const STATE = ['geometric','ou','gmm','invalid'].includes(state) ? state : 'geometric';
const VINTAGE = {source:'ORESMD · ECB reference series', date:'2026-07-24', ticks:1440};
const SIMPLE = {
  geometric: {mu:0.010, sigma:0.450, initial:1.0850},
  ou:        {mu:0.000, sigma:0.090, initial:1.0850, theta:1.0850, kappa:0.0095},
  gmm:       {mu:0.000, sigma:0.000, initial:1.0850}
};

// In-page controls, separate from the URL. ?state sets their starting values.
const ui = {
  engine: STATE === 'ou' ? 'ou' : (STATE === 'gmm' || STATE === 'invalid') ? 'gmm' : 'geometric',
  mode: (STATE === 'gmm' || STATE === 'invalid') ? 'advanced' : 'simple',
  source: STATE === 'invalid' ? 'vintage' : 'fixed',
  connected: STATE !== 'invalid',
  periodS: 300,
  paths: 8,
  seed: 20260727,
  components: (STATE === 'invalid' ? COMPONENTS_BAD : COMPONENTS_OK).map(c => Object.assign({}, c))
};

function gmmMoments(comps){
  const mu = comps.reduce((a, c) => a + c.w * c.mu, 0);
  const ex2 = comps.reduce((a, c) => a + c.w * (c.sigma * c.sigma + c.mu * c.mu), 0);
  return {mu, sigma: Math.sqrt(Math.max(0, ex2 - mu * mu))};
}

function screenModel(){
  const base  = STATE === 'invalid' ? 'US' : 'EUR';
  const quote = STATE === 'invalid' ? 'US' : 'USD';
  const components = ui.components;
  const weightSum = components.reduce((a, c) => a + c.w, 0);
  const gm = gmmMoments(components);
  const props = ui.engine === 'gmm'
    ? {mu:gm.mu, sigma:gm.sigma, initial:SIMPLE.gmm.initial}
    : SIMPLE[ui.engine];
  return {
    engine: ENGINES[ui.engine],
    props,
    base, quote,
    codesOk: /^[A-Z]{3}$/.test(base) && /^[A-Z]{3}$/.test(quote),
    differ: base !== quote,
    components, weightSum,
    weightsOk: Math.abs(weightSum - 1) < 1e-9,
    ticksPerHour: 3600 / ui.periodS,
    oreKey: `FX/RATE/${base}/${quote}`,
    uri: `oresmd://fx/${base}-${quote}?type=series`
  };
}

function normalPdf(x, mu, sigma){
  const z = (x - mu) / sigma;
  return Math.exp(-0.5 * z * z) / (sigma * Math.sqrt(2 * Math.PI));
}

// Deterministic PRNG so a seed forces the same sample paths.
function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function gauss(rnd){
  let u = 0, v = 0;
  while (u === 0) u = rnd();
  while (v === 0) v = rnd();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}

// f(x) = Σ wᵢ·N(x; μᵢ, σᵢ) in the return domain, or the steady-state price
// density N(θ, σ²/2κ) when a mean-reverting engine moves the domain.
function densityDomain(m){
  const cols = PC.colours;
  if (m.engine.domain === 'price') {
    const p = SIMPLE.ou;
    const sd = p.sigma / Math.sqrt(2 * Math.max(1e-9, p.kappa));
    const lo = p.theta - 4 * sd, hi = p.theta + 4 * sd, N = 121;
    const xs = Array.from({length:N}, (_, i) => lo + (hi - lo) * i / (N - 1));
    return {xs, series:[{name:'Steady state N(θ, σ²/2κ)', color:cols.accent,
                             points:xs.map(x => normalPdf(x, p.theta, sd)), width:2.4}]};
  }
  const comps = ui.components.length ? ui.components : [{desc:'component', mu:0, sigma:1, w:1}];
  const lo = Math.min(...comps.map(c => c.mu - 4 * c.sigma));
  const hi = Math.max(...comps.map(c => c.mu + 4 * c.sigma));
  const N = 141;
  const xs = Array.from({length:N}, (_, i) => lo + (hi - lo) * i / (N - 1));
  const palette = [cols.accent, cols.warn, cols.ok, cols.bad, '#a371f7', '#39c5cf'];
  const series = comps.map((c, i) => ({
    name:`w${i} ${c.w.toFixed(2)}`,
    color:palette[i % palette.length],
    points:xs.map(x => c.w * normalPdf(x, c.mu, c.sigma)),
    dash:'3 3', width:1.4
  }));
  series.push({name:'Mixture f(x)', color:cols.ink, width:2.4,
               points:xs.map(x => comps.reduce((a, c) => a + c.w * normalPdf(x, c.mu, c.sigma), 0))});
  return {xs, series};
}

function distributionPanel(m){
  const d = densityDomain(m);
  const ret = m.engine.domain === 'return';
  const x = d.xs.map((_, i) => i / (d.xs.length - 1));
  const ticks = [0, 0.25, 0.5, 0.75, 1].map(t => ({
    at:t, label:d.xs[Math.round(t * (d.xs.length - 1))].toFixed(ret ? 2 : 4)
  }));
  return `<div class="panel"><h2>Return distribution</h2>
    <div class="mono muted">x: ${ret ? 'Return per Update (%)' : 'Price'}</div>
    ${PC.line({
      series:d.series, x, ticks,
      yFmt:v => v.toFixed(3),
      yLabel:'f(x)',
      h:300,
      notes:[`engine ${m.engine.short}`, ret ? 'return domain' : 'steady-state price domain'],
      caption: ret
        ? 'f(x) = Σ wᵢ·N(x; μᵢ, σᵢ). Dashed curves are the weighted components; the solid curve is the mixture.'
        : 'Mean-reverting engine, so the chart leaves the return domain for the steady-state price domain: N(θ, σ²/2κ).'
    })}
  </div>`;
}

function simulate(m){
  const steps = 60;
  const rnd = mulberry32(ui.seed);
  const comps = ui.components;
  const out = [];
  for (let k = 0; k < ui.paths; k++) {
    let price = m.props.initial;
    const pts = [price];
    for (let i = 1; i < steps; i++) {
      if (m.engine.domain === 'price') {
        const p = SIMPLE.ou;
        price = price + p.kappa * (p.theta - price) + p.sigma * gauss(rnd);
      } else if (m.engine.key === 'gmm' && comps.length) {
        let u = rnd(), acc = 0, idx = comps.length - 1;
        for (let j = 0; j < comps.length; j++) { acc += comps[j].w; if (u <= acc) { idx = j; break; } }
        const c = comps[idx];
        price = price * Math.exp((c.mu + c.sigma * gauss(rnd)) / 100);
      } else {
        price = price * Math.exp((m.props.mu + m.props.sigma * gauss(rnd)) / 100);
      }
      pts.push(price);
    }
    out.push(pts);
  }
  return out;
}

function samplePanel(m){
  const paths = simulate(m);
  const steps = paths[0].length;
  const x = Array.from({length:steps}, (_, i) => i / (steps - 1));
  const palette = [PC.colours.accent, PC.colours.ok, PC.colours.warn, PC.colours.bad,
                   '#a371f7', '#39c5cf', '#db61a2', '#e3b341', '#8b949e', '#1f6feb', '#da3633', '#2ea043'];
  const series = paths.map((pts, i) => ({name:`path ${i + 1}`, color:palette[i % palette.length], points:pts, width:1.4}));
  const ticks = [0, 0.25, 0.5, 0.75, 1].map(t => ({at:t, label:`step ${Math.round(t * (steps - 1))}`}));
  return `<div class="panel"><h2>Sample paths</h2>
    <div class="row">
      <button class="btn" data-act="reseed">Reseed</button>
      <div class="field"><label>Paths</label><input id="paths" type="number" min="1" max="12" value="${ui.paths}"></div>
      <div class="field"><label>Seed</label><div class="value mono">${ui.seed}</div></div>
    </div>
    ${PC.line({
      series, x, ticks,
      yFmt:v => v.toFixed(4),
      yLabel:'Price',
      h:320,
      bands:[{from:0, to:1, color:PC.colours.accent, label:`${paths.length} mock paths`}],
      notes:[`engine ${m.engine.short}`, `update every ${ui.periodS} s`],
      caption:'Simulated with the mock engine. The seed forces the same paths until Reseed is pressed.'
    })}
  </div>`;
}

function behaviourPanel(m){
  const eng = m.engine;
  const p = m.props;
  const ticks = m.ticksPerHour;
  const hlUpdates = p.kappa > 0 ? Math.log(2) / p.kappa : Infinity;
  const hlMin = hlUpdates * ui.periodS / 60;
  const hlDays = hlMin / 1440;
  const halfLife = eng.key === 'ou'
    ? `Calculated Half-Life t½: ${Number.isFinite(hlMin) ? `${hlMin.toFixed(1)} min (${hlDays.toFixed(2)} days)` : '∞ (κ = 0, driftless random walk)'}`
    : '';
  const controls = eng.key === 'ou'
    ? slider('mu', 'Drift (μ) — average log-return per update', p.mu, -2, 2, 0.001, '%') +
      slider('sigma', 'Volatility (σ) — typical size of each move', p.sigma, 0, 3, 0.005, '%') +
      slider('theta', 'Long-Term Mean (θ)', p.theta, 0.9, 1.3, 0.001, '') +
      slider('kappa', 'Mean Reversion Speed (κ) — 0 = driftless random walk', p.kappa, 0, 0.05, 0.0005, 'per update')
    : slider('mu', 'Drift (μ) — average log-return per update', p.mu, -2, 2, 0.001, '%') +
      slider('sigma', 'Volatility (σ) — typical size of each move (log-return volatility)', p.sigma, 0, 3, 0.005, '%');
  const initial = slider('initial', 'Initial price', p.initial, 0.5, 1.5, 0.0001, '', 4);
  return `<div class="panel">
    <h2>Price behaviour</h2>
    <div class="row">
      <div class="field"><label>Engine</label>
        <select id="engine">${Object.values(ENGINES).map(e =>

    ${eng.key === 'ou' ? `<div class="notice mono">${halfLife}</div>` : ''}
    ${ui.mode === 'simple' ? `<div class="notice">Switch to Advanced mode for direct GMM component control (μ, σ, w).</div>` : ''}

}

function bind(){
  const app = document.getElementById('app');
  app.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => set('variant', b.dataset.tab));
  app.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => set('variant', b.dataset.mode === 'advanced' ? 'c' : 'b'));
  app.querySelectorAll('[data-source]').forEach(r => r.onchange = () => { ui.source = r.dataset.source; render(); });
  const eng = document.getElementById('engine');
  if (eng) eng.onchange = () => { ui.engine = eng.value; render(); };
  const per = document.getElementById('period');
  if (per) per.onchange = () => { ui.periodS = Math.max(1, Math.min(86400, Number(per.value) || 300)); render(); };
  const pn = document.getElementById('paths');
  if (pn) pn.onchange = () => { ui.paths = Math.max(1, Math.min(12, Number(pn.value) || 6)); render(); };
  app.querySelectorAll('[data-param]').forEach(s => {
    const out = document.getElementById(s.dataset.param + '-out');
    s.oninput = () => { if (out) out.textContent = Number(s.value).toFixed(Number(s.dataset.dp || 3)); };
  });
  app.querySelectorAll('[data-act]').forEach(b => b.onclick = () => {
    const act = b.dataset.act;
    if (act === 'reseed') { ui.seed = (ui.seed * 1103515245 + 12345) % 2147483647; render(); return; }
    if (act === 'add') { ui.components.push({desc:'Additional component', mu:0, sigma:0.5, w:0.05}); render(); return; }
    if (act === 'remove') {
      ui.components.splice(Number(b.dataset.i), 1);
      if (!ui.components.length) ui.components.push({desc:'Normal-profile body', mu:0, sigma:1, w:1});
      render(); return;
    }
    if (act === 'reset') { ui.components = [{desc:'Normal-profile body', mu:0, sigma:1, w:1}]; render(); return; }
    if (act === 'browse') { document.getElementById('note').textContent = 'Browse vintages: mock picker, nothing is read'; return; }
    document.getElementById('note').textContent = `${b.textContent}: mock only`;
  });
}

function render(){
  const m = screenModel();
  const active = variant === 'b' ? 'behaviour' : variant === 'c' ? 'advanced' : 'instrument';
  const body = variant === 'b' ? behaviourPanel(m)
             : variant === 'c' ? advancedPanel(m)
             : instrumentPanel(m) + provenancePanel() + validationPanel(m);
  document.getElementById('app').innerHTML = header(m) + tabs(active) + body;
  document.getElementById('note').textContent =
    `Prototype · Edit FX Rate · variant ${variant.toUpperCase()} · ${m.engine.name} · mock data · nothing is stored`;
  document.getElementById('bar').innerHTML =
    `<span class="label">Screen</span>` +
    [['a', 'instrument + provenance'], ['b', 'price behaviour'], ['c', 'advanced GMM']].map(([v, label]) =>
      `<button data-v="${v}" class="${v === variant ? 'on' : ''}">${v.toUpperCase()} ${label}</button>`).join('') +
    `<span class="sep">|</span><span class="label">State</span>` +
    [['geometric', 'geometric'], ['ou', 'ou'], ['gmm', 'gmm'], ['invalid', 'invalid']].map(([s, label]) =>
      `<button data-s="${s}" class="${s === STATE ? 'on' : ''}">${label}</button>`).join('');
  document.querySelectorAll('#bar [data-v]').forEach(b => b.onclick = () => set('variant', b.dataset.v));
  document.querySelectorAll('#bar [data-s]').forEach(b => b.onclick = () => set('state', b.dataset.s));
  bind();
}
function set(k, v){ const p = new URLSearchParams(location.search); p.set(k, v); location.search = p.toString(); }
render();
</script>
</body>
</html>
