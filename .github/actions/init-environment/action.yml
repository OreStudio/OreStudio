# yamllint disable rule:line-length
---
name: Init environment
description: >-
  Write the .env of this checkout and export its settings to the job.

# The services dial PostgreSQL directly in CI: no pooler fronts them, so their
# port must be PostgreSQL's. The private key is not exported, because a job that
# carried it would hand it to every step.

runs:
  using: composite
  steps:
    - name: Init environment
      shell: bash
      env:
        ORES_DATABASE_NAME: ores_ci
      run: |
        ./projects/ores.compass/compass.sh --no-deps env configure -y --no-pooler
        grep -v '^[[:space:]]*#' .env | grep -v '^[[:space:]]*$' \
          | grep -v 'ORES_IAM_SERVICE_JWT_PRIVATE_KEY' >> "$GITHUB_ENV"
