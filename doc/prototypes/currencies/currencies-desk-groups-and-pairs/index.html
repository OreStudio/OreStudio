<!--
  PROTOTYPE. Throwaway. Mock data from the Acme seed plus invented history;
  no backend, no build step.

  Currencies, desk groups and currency pairs: the three lists, one record of
  each kind with its tabs, the shared dialogs, and the standard Import and
  Export pair on the currencies list. Every state is reached by query parameters:
    ?screen=currencies|groups|pairs
    ?screen=currency&code=EUR&tab=details|countries|calendars|groups|history
    ?screen=group&code=G11&tab=details|members|history
    ?screen=pair&code=EUR/USD&tab=details|calendars|history
    &dialog=add|edit|delete|add-link|remove-link|revert|export
    ?screen=import&step=1|2|3|4   &file=ok|wrong   &clean=1
    &who=admin|reader
-->
<title>ORE Studio Currencies</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="prototype.css">
</head>
