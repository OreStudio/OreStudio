<body>
<table class="prototype-links" style="width:100%;border-collapse:collapse;margin:0 0 0;font:500 13px/1.6 Inter,system-ui,sans-serif;color:var(--text-primary,#e3e3e6);background:var(--bg-secondary,#1a1a1e);border-bottom:1px solid var(--border-color,#30363d)">
<tr><th style="text-align:left;padding:.45rem .9rem;font-weight:600;white-space:nowrap;background:var(--bg-accent,#26262b);border-right:1px solid var(--border-color,#30363d);width:1%">Prototype</th><td class="prototype-open" style="padding:.45rem .9rem"><a href="index.html" style="color:var(--accent,#58a6ff)">this prototype</a></td></tr>

<!--
  PROTOTYPE. Throwaway. Mock data, no backend, no build step, no session.

  The consumer's "Watch a curve or surface evolve" screen
  (doc/knowledge/journeys/market_data/journey_watch-a-curve-or-surface-evolve.org):
  the object and its time control at the top, the aligned grid of instants by
  nodes in the middle, and the added, dropped and two-instant comparison at the
  bottom, so the person reads the object, then the range, then what changed.
  One screen at two zooms: an instant, and a range.

  Variants with ?variant=a|b|c. The variant is the layout, which is the
  journey's central design question: a is a matrix of instants by nodes, b is a
  per-node sparkline list, c is a two-instant compare. ?state=stable|churn|surface
  switches the mock market: a stable curve, a curve with added and dropped
  nodes, and a surface. ?show=instant|range sets the zoom; ?a= and ?b= pick the
  compared instants. Nothing reads a service.

  Three plots read the same mock over time. evolutionChart() overlays one line
  per instant on the union of nodes, so a break marks a node that instant did
  not carry and an edge is an added or dropped node; variant b shows it.
  nodeChanges() bars the added and dropped node counts per step between
  instants; variants a and c show it. surfaceEvolution() draws the surface
  change from the first to the last instant when the data carries an expiry by
  delta grid, and otherwise falls back to a per-instant line of the ATM or
  extreme slice. The changes panel stays.
-->

<div class="proto-note" id="note"></div>
<div class="wrap" id="app"></div>
<div class="proto-bar" id="bar"></div>

<script>
const params = new URLSearchParams(location.search);
const variant = params.get('variant') || 'a';
const state = params.get('state') || 'churn';
const show = params.get('show') || 'range';
const ia = Math.min(4, parseInt(params.get('a') || '0', 10));
const ib = Math.min(4, parseInt(params.get('b') || '4', 10));

const instants = ['12:00','12:30','13:00','13:30','14:00'];
const uri = 'oresmd://ir/USD?type=series&instrument=ir_swap';

const stable = [
  {n:'fwd_start=0D&tenor=3M',  v:[4.121,4.118,4.130,4.127,4.131]},
  {n:'fwd_start=0D&tenor=6M',  v:[4.204,4.199,4.211,4.209,4.214]},
  {n:'fwd_start=0D&tenor=1Y',  v:[4.301,4.295,4.310,4.306,4.312]},
  {n:'fwd_start=0D&tenor=2Y',  v:[4.402,4.398,4.405,4.401,4.408]},
  {n:'fwd_start=0D&tenor=5Y',  v:[4.248,4.244,4.252,4.249,4.255]},
  {n:'fwd_start=0D&tenor=10Y', v:[4.185,4.181,4.190,4.187,4.192]}
];
const churn = [
  {n:'fwd_start=0D&tenor=3M',  v:[4.121,4.118,4.130,4.127,4.131]},
  {n:'fwd_start=0D&tenor=6M',  v:[4.204,4.199,4.211,4.209,4.214]},
  {n:'fwd_start=0D&tenor=9M',  v:[4.260,null,null,null,null]},
  {n:'fwd_start=0D&tenor=1Y',  v:[4.301,4.295,4.310,4.306,4.312]},
  {n:'fwd_start=0D&tenor=2Y',  v:[null,null,4.402,4.398,4.405]},
  {n:'fwd_start=0D&tenor=5Y',  v:[4.248,4.244,4.252,4.249,4.255]},
  {n:'fwd_start=0D&tenor=10Y', v:[4.185,4.181,4.190,4.187,4.192]}
];
const surfs = [
  {n:'ori=swaption&expiry=1Y&delta=ATM',   v:[13.90,13.80,14.10,14.00,14.20]},
  {n:'ori=swaption&expiry=1Y&delta=25RR',  v:[-0.90,-0.80,-1.00,-0.90,-1.10]},
  {n:'ori=swaption&expiry=2Y&delta=ATM',   v:[null,null,14.60,14.50,14.70]},
  {n:'ori=swaption&expiry=5Y&delta=ATM',   v:[15.40,15.20,15.60,15.50,15.70]},
  {n:'ori=swaption&expiry=5Y&delta=25BF',  v:[0.40,0.40,0.50,0.50,0.60]},
  {n:'ori=swaption&expiry=10Y&delta=ATM',  v:[16.20,16.00,16.40,16.30,16.50]},
  {n:'ori=swaption&expiry=30Y&delta=ATM',  v:[16.80,null,null,null,null]}
];
const nodes = state === 'surface' ? surfs : state === 'churn' ? churn : stable;
const shown = show === 'instant' ? [4] : [0,1,2,3,4];
const dec = state === 'surface' ? 2 : 3;

function urlButton(url){
  return `<button class="urlbtn" type="button" data-url="${url}" title="Edit in the oresmd URL editor">`+
         `<span class="mono">${url}</span><span class="edit">edit</span></button>`;
}
function openOresmdEditor(url, host){
  const ov=document.createElement('div'); ov.className='oresmd-overlay';
  const f=document.createElement('iframe'); f.className='oresmd-frame'; f.title='oresmd URL editor';
  f.src='../oresmd-url-editor/index.html?embed=1&url='+encodeURIComponent(url||'');
  ov.appendChild(f); document.body.appendChild(ov);
  function close(){ window.removeEventListener('message', onMsg); document.removeEventListener('keydown', onKey); ov.remove(); }
  function onMsg(e){ if(e.data && e.data.type==='oresmd-url'){ host.dataset.url=e.data.url; const m=host.querySelector('.mono'); if(m) m.textContent=e.data.url; close(); } }
  function onKey(e){ if(e.key==='Escape') close(); }
  window.addEventListener('message', onMsg); document.addEventListener('keydown', onKey);
  ov.addEventListener('click', e=>{ if(e.target===ov) close(); });
}
document.addEventListener('click', e=>{
  const b=e.target.closest('.urlbtn'); if(!b) return;
  openOresmdEditor(b.dataset.url||'', b);
});
function tag(t, k){ return `<span class="tag ${k || ''}">${t}</span>`; }
function dsp(v){ return v == null ? '.' : v.toFixed(dec); }
function diff(a, b){ return a == null || b == null ? null : b - a; }
function addedAt(i){ return nodes.filter(x => x.v[0] == null && x.v[i] != null); }
function droppedBy(i){ return nodes.filter(x => x.v[0] != null && x.v[i] == null); }

function header(){
  const attrs = state === 'surface'
    ? [['Subclass', 'vol'], ['Asset classes', 'IR, Vol'], ['Derivation', 'SURFACE_CALIBRATION (config …b72c, v2)']]
    : [['Subclass', 'yield'], ['Asset classes', 'IR, Rates'], ['Derivation', 'IR_CURVE_BOOTSTRAP (config …a41f, v3)']];
  return `
  <div class="top">
    <h1>Curve or surface: <span class="mono">${urlButton(uri)}</span></h1>
    <span class="muted">read only</span>
    <a style="margin-left:auto" href="../../../knowledge/journeys/market_data/journey_watch-a-curve-or-surface-evolve.html">the journey &rarr;</a>
  </div>
  <div class="panel">
    <h2>Object and time control</h2>
    <div class="grid2">
      <table><tbody>${attrs.map(([k, v]) => `<tr><td>${k}</td><td class="mono">${v}</td></tr>`).join('')}
        <tr><td>Nodes read</td><td class="mono">${nodes.length} <span class="faint">(shape not declared)</span></td></tr></tbody></table>
      <div class="row">
        <div class="field"><label>Show</label>
          <select id="show"><option value="instant"${show === 'instant' ? ' selected' : ''}>One instant</option><option value="range"${show === 'range' ? ' selected' : ''}>A range</option></select></div>
        <div class="field"><label>As of</label><div class="value mono">2026-10-06 14:00 <span class="faint">(ends at now)</span></div></div>
        <div class="field"><label>Step</label><select><option>30 minutes</option><option>1 hour</option></select></div>
        <div class="field"><label>Span</label><select><option>6 hours</option><option>1 day</option></select></div>
        <button class="btn primary" data-act="apply">Apply</button>
      </div>
    </div>
    <div class="notice">The instant read answers for now only, and the bucket read takes a step and a count that end at now, not a start and an end. The values come back unaligned and as text, so the browser aligns them by node and a hole in a bucket is a gap, not a typed null.</div>
  </div>`;
}

function matrix(){
  const cols = shown.map(i => `<th class="num">${instants[i]}</th>`).join('');
  const rows = nodes.map(x => {
    const cells = shown.map(i => {
      const isAdd = i > 0 && x.v[0] == null && x.v[i] != null;
      const isDrop = i > 0 && x.v[0] != null && x.v[i] == null;
      const style = isAdd ? ' style="color:var(--ok)"' : isDrop ? ' style="color:var(--bad)"' : '';
      return `<td class="num${x.v[i] == null ? ' faint' : ''}"${style}>${dsp(x.v[i])}</td>`;
    }).join('');
    const flag = x.v[0] == null ? tag('added', 'ok') : x.v[4] == null ? tag('dropped', 'bad') : tag('held');
    return `<tr><td class="mono">${x.n}</td>${cells}<td>${flag}</td></tr>`;
  }).join('');
  return `
  <div class="panel">
    <h2>Aligned view — ${show === 'instant' ? 'one instant' : 'instants by nodes'}</h2>
    <table><thead><tr><th>Node</th>${cols}<th>Across the range</th></tr></thead><tbody>${rows}</tbody></table>
    <div class="notice">The grid is the screen's own. There is no declared shape, so a node that should be there and is not cannot be told from a node that is not part of the shape at all.</div>
  </div>`;
}

function spark(v){
  const pts = v.map((x, i) => x == null ? null : [i, x]).filter(Boolean);
  if (pts.length < 2) return '<span class="faint">one point</span>';
  const w = 160, h = 30, pad = 4;
  const lo = Math.min(...pts.map(p => p[1])), hi = Math.max(...pts.map(p => p[1]));
  const span = hi - lo || 1;
  const X = i => pad + i * (w - 2 * pad) / (v.length - 1);
  const Y = x => h - pad - (x - lo) * (h - 2 * pad) / span;
  const d = pts.map((p, i) => `${i ? 'L' : 'M'}${X(p[0]).toFixed(1)},${Y(p[1]).toFixed(1)}`).join(' ');
  return `<svg viewBox="0 0 ${w} ${h}" width="160" height="30" role="img" aria-label="sparkline">
    <path d="${d}" fill="none" stroke="#58a6ff" stroke-width="1.5"></path>
    <circle cx="${X(pts[pts.length - 1][0]).toFixed(1)}" cy="${Y(pts[pts.length - 1][1]).toFixed(1)}" r="2.5" fill="#8ab4f8"></circle></svg>`;
}

function sparkList(){
  const rows = nodes.map(x => {
    const first = x.v.find(v => v != null), last = [...x.v].reverse().find(v => v != null);
    const dd = first == null || last == null ? null : last - first;
    const gaps = x.v.filter(v => v == null).length;
    return `<tr><td class="mono">${x.n}</td><td>${spark(x.v)}</td>
      <td class="num">${dsp(first)}</td><td class="num">${dsp(last)}</td>
      <td class="num">${dd == null ? '—' : (dd >= 0 ? '+' : '') + dd.toFixed(dec)}</td>
      <td>${gaps ? tag(gaps + ' gap' + (gaps > 1 ? 's' : ''), 'warn') : tag('held', 'ok')}</td></tr>`;
  }).join('');
  return `
  <div class="panel">
    <h2>Per-node evolution</h2>
    <table><thead><tr><th>Node</th><th>12:00 → 14:00</th><th class="num">First</th><th class="num">Last</th><th class="num">Move</th><th>Gaps</th></tr></thead><tbody>${rows}</tbody></table>
  </div>`;
}

function compare(){
  const rows = nodes.map(x => {
    const a = x.v[ia], b = x.v[ib], dd = diff(a, b);
    const kind = a == null && b != null ? tag('added', 'ok') : a != null && b == null ? tag('dropped', 'bad') : a == null ? tag('absent both', 'warn') : tag('both', 'ok');
    return `<tr><td class="mono">${x.n}</td><td class="num">${dsp(a)}</td><td class="num">${dsp(b)}</td>
      <td class="num"${dd != null && Math.abs(dd) > 0.02 ? ' style="color:var(--warn)"' : ''}>${dd == null ? '—' : (dd >= 0 ? '+' : '') + dd.toFixed(dec)}</td><td>${kind}</td></tr>`;
  }).join('');
  const pick = (sel, val) => `<select data-pick="${sel}">${instants.map((t, i) => `<option value="${i}"${i === val ? ' selected' : ''}>${t}</option>`).join('')}</select>`;
  return `
  <div class="panel">
    <h2>Compare two instants</h2>
    <div class="row">
      <div class="field"><label>Instant A</label>${pick('a', ia)}</div>
      <div class="field"><label>Instant B</label>${pick('b', ib)}</div>
    </div>
    <table><thead><tr><th>Node</th><th class="num">Value A ${instants[ia]}</th><th class="num">Value B ${instants[ib]}</th><th class="num">Difference</th><th>Node set</th></tr></thead><tbody>${rows}</tbody></table>
    <div class="notice">No request names two instants and returns one snapshot per instant, so this comparison is two reads the browser stitches. No subject returns the difference either.</div>
  </div>`;
}

function changesPanel(){
  const added = addedAt(ib).filter(x => !(x.v[ia] != null));
  const dropped = droppedBy(ib).filter(x => !(x.v[ia] == null));
  const rows = [
    ...added.map(x => [x.n, 'added', '(absent)', dsp(x.v[ib])]),
    ...dropped.map(x => [x.n, 'dropped', dsp(x.v[ia]), '(absent)'])
  ].map(([n, k, f, t]) => `<tr><td class="mono">${n}</td><td>${tag(k, k === 'added' ? 'ok' : 'bad')}</td><td class="num">${f}</td><td class="num">${t}</td></tr>`).join('');
  return `
  <div class="panel">
    <h2>Added and dropped nodes — ${instants[ia]} against ${instants[ib]}</h2>
    <table><thead><tr><th>Node</th><th>Change</th><th class="num">From</th><th class="num">To</th></tr></thead>
      <tbody>${rows || '<tr><td colspan="4" class="faint">no node appeared or dropped; the node set held</td></tr>'}</tbody></table>
    <div class="notice">No subject compares two instants' node sets. A node the series identity names but an instant does not carry cannot be told from a node that was never part of the shape.</div>
  </div>`;
}

// Prototype plotting helper. Throwaway, dependency-free, dark-theme SVG.
// Each function returns an HTML string, so a page calls host.innerHTML = PC.line({...}).
// Prefixed PC to stay clear of page-local names; the pages also define `tag`.
const PC = (() => {
  const C = {grid:'#21262d', axis:'#30363d', text:'#71717a', dim:'#a1a1aa',
             ink:'#e3e3e6', accent:'#58a6ff', ok:'#3fb950', warn:'#d29922', bad:'#f85149'};
  const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const fmt = (v, d) => v == null ? '—' : (typeof v === 'number' ? v.toFixed(d ?? 2) : String(v));
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  // A blue -> amber ramp for a heat cell, t in 0..1.
  function heatColour(t){
    const stops = [[13,23,38],[21,60,110],[32,110,170],[88,166,255],[210,153,34],[248,81,73]];
    const p = clamp(t, 0, 1) * (stops.length - 1), i = Math.floor(p), f = p - i;
    const a = stops[i], b = stops[Math.min(stops.length - 1, i + 1)];
    return `rgb(${a.map((x, k) => Math.round(x + (b[k] - x) * f)).join(',')})`;
  }

  // Shared frame: margins, y gridlines and labels for a value axis.
  function frame(o){
    const w = o.w || 940, h = o.h || 300;
    const pad = Object.assign({l:64, r:18, t:16, b:40}, o.pad || {});
    const x0 = pad.l, x1 = w - pad.r, y0 = h - pad.b, y1 = pad.t;
    const vals = (o.series || []).flatMap(s => s.points || []).filter(v => v != null)
      .concat(o.extra || []);
    let lo = Math.min(...vals), hi = Math.max(...vals);
    if (o.zero) { lo = Math.min(lo, 0); hi = Math.max(hi, 0); }
    if (!(hi > lo)) { hi = lo + 1; }
    const span = hi - lo, l2 = lo - span * 0.08, h2 = hi + span * 0.08;
    const y = v => y0 - (v - l2) * (y0 - y1) / (h2 - l2);
    const X = o.x ? (i => x0 + o.x[i] * (x1 - x0))
                  : (i => x0 + i * (x1 - x0) / Math.max(1, (o.ticks ? o.ticks.length : 1) - 1));
    const yTicks = [];
    const steps = o.ySteps || 4;
    for (let k = 0; k <= steps; k++) {
      const v = l2 + (h2 - l2) * k / steps;
      yTicks.push(`<line x1="${x0}" y1="${y(v).toFixed(1)}" x2="${x1}" y2="${y(v).toFixed(1)}" stroke="${C.grid}"/>
        <text x="${x0 - 8}" y="${(y(v) + 3.5).toFixed(1)}" fill="${C.text}" font-size="10" text-anchor="end">${esc((o.yFmt || (v => fmt(v)))(v))}</text>`);
    }
    const xTicks = (o.ticks || []).map(t => {
      const px = o.x ? x0 + t.at * (x1 - x0) : X(t.at);
      return `<text x="${px.toFixed(1)}" y="${h - pad.b + 15}" fill="${C.text}" font-size="10" text-anchor="middle">${esc(t.label)}</text>`;
    }).join('');
    const grid = (o.xticks || []).map(t => {
      const px = o.x ? x0 + t.at * (x1 - x0) : X(t.at);
      return `<line x1="${px.toFixed(1)}" y1="${y1}" x2="${px.toFixed(1)}" y2="${y0}" stroke="${C.grid}" stroke-dasharray="2 3"/>`;
    }).join('');
    return {w, h, x0, x1, y0, y1, y, X, l2, h2, frame: yTicks.join('') + grid + xTicks};
  }

  function line(o){
    const f = frame(o);
    const bands = (o.bands || []).map(b => {
      const xa = f.x0 + b.from * (f.x1 - f.x0), xb = f.x0 + b.to * (f.x1 - f.x0);
      return `<rect x="${xa.toFixed(1)}" y="${f.y1}" width="${(xb - xa).toFixed(1)}" height="${(f.y0 - f.y1).toFixed(1)}"
        fill="${b.color || C.accent}" opacity=".08"/>` +
        (b.label ? `<text x="${((xa + xb) / 2).toFixed(1)}" y="${f.y1 + 11}" fill="${C.text}" font-size="9" text-anchor="middle">${esc(b.label)}</text>` : '');
    }).join('');
    const paths = (o.series || []).map(s => {
      let d = '', pen = false;
      s.points.forEach((v, i) => {
        if (v == null) { pen = false; return; }
        d += (pen ? 'L' : 'M') + f.X(i).toFixed(1) + ',' + f.y(v).toFixed(1) + ' ';
        pen = true;
      });
      const marks = s.markers ? s.points.map((v, i) => v == null ? '' :
        `<circle cx="${f.X(i).toFixed(1)}" cy="${f.y(v).toFixed(1)}" r="${s.r || 3.4}" fill="${s.color}"/>`).join('') : '';
      return `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="${s.width || 2}"${s.dash ? ` stroke-dasharray="${s.dash}"` : ''}/>${marks}`;
    }).join('');
    const legend = o.legend === false ? '' : `<div class="pc-legend">${(o.series || []).map(s =>
      `<span><i style="background:${s.color}"></i>${esc(s.name)}</span>`).join('')}${(o.notes || []).map(n =>
      `<span class="faint">${n}</span>`).join('')}</div>`;
    return `<figure class="pc"><svg viewBox="0 0 ${f.w} ${f.h}" width="100%" height="${f.h}" role="img" aria-label="${esc(o.title || 'chart')}">
      ${bands}${f.frame}${paths}
      ${o.yLabel ? `<text x="14" y="${(f.y0 + f.y1) / 2}" fill="${C.text}" font-size="10" transform="rotate(-90 14 ${(f.y0 + f.y1) / 2})" text-anchor="middle">${esc(o.yLabel)}</text>` : ''}
    </svg>${legend}${o.caption ? `<figcaption class="faint">${o.caption}</figcaption>` : ''}</figure>`;
  }

  function bars(o){
    const f = frame(Object.assign({zero: true}, o));
    const n = o.bars.length, bw = (f.x1 - f.x0) / n;
    const zero = f.y(0);
    const body = o.bars.map((b, i) => {
      const v = b.value == null ? null : b.value;
      const x = f.x0 + i * bw + bw * 0.18, w = bw * 0.64;
      const yv = v == null ? zero : f.y(v);
      const top = Math.min(yv, zero), hgt = Math.abs(zero - yv);
      const col = b.color || (v == null ? C.text : v >= 0 ? C.warn : C.accent);
      return `<rect x="${x.toFixed(1)}" y="${top.toFixed(1)}" width="${w.toFixed(1)}" height="${Math.max(1, hgt).toFixed(1)}" fill="${col}" opacity=".85"><title>${esc(b.label)}: ${esc(fmt(v))}</title></rect>
        <text x="${(x + w / 2).toFixed(1)}" y="${(f.h - 24)}" fill="${C.text}" font-size="9" text-anchor="middle">${esc(b.label)}</text>`;
    }).join('');
    return `<figure class="pc"><svg viewBox="0 0 ${f.w} ${f.h}" width="100%" height="${f.h}" role="img" aria-label="${esc(o.title || 'bars')}">
      ${f.frame}<line x1="${f.x0}" y1="${zero}" x2="${f.x1}" y2="${zero}" stroke="${C.axis}"/>${body}</svg>
      ${o.caption ? `<figcaption class="faint">${o.caption}</figcaption>` : ''}</figure>`;
  }

  // A surface as a shaded mesh grid: one cell per (row, column).
  function heat(o){
    const rows = o.rows, cols = o.cols;
    const cw = o.cell || 54, ch = o.cellH || 30, l = 58, t = 26;
    const w = l + cols.length * cw + (o.legend === false ? 14 : 92);
    const h = t + rows.length * ch + 34;
    const vals = [];
    rows.forEach((_, i) => cols.forEach((_, j) => { const v = o.value(i, j); if (v != null) vals.push(v); }));
    const lo = Math.min(...vals), hi = Math.max(...vals), span = (hi - lo) || 1;
    const cells = [];
    rows.forEach((r, i) => cols.forEach((c, j) => {
      const v = o.value(i, j);
      const x = l + j * cw, y = t + i * ch;
      const col = v == null ? '#161619' : heatColour((v - lo) / span);
      cells.push(`<rect x="${x}" y="${y}" width="${cw - 2}" height="${ch - 2}" rx="2" fill="${col}"><title>${esc(r.label)} · ${esc(c.label)}: ${esc(fmt(v, o.dp))}</title></rect>`);
      if (o.showValues !== false) cells.push(`<text x="${(x + (cw - 2) / 2).toFixed(1)}" y="${(y + ch / 2 + 3.5).toFixed(1)}" fill="${(v != null && (v - lo) / span > 0.55) ? '#0d1117' : C.ink}" font-size="9.5" text-anchor="middle">${esc(fmt(v, o.dp ?? 1))}</text>`);
    }));
    const rowLabels = rows.map((r, i) => `<text x="${l - 8}" y="${(t + i * ch + ch / 2 + 3.5).toFixed(1)}" fill="${C.text}" font-size="10" text-anchor="end">${esc(r.label)}</text>`).join('');
    const colLabels = cols.map((c, j) => `<text x="${(l + j * cw + (cw - 2) / 2).toFixed(1)}" y="${t - 8}" fill="${C.text}" font-size="10" text-anchor="middle">${esc(c.label)}</text>`).join('');
    const legend = o.legend === false ? '' : (() => {
      const bx = l + cols.length * cw + 14, by = t, bh = rows.length * ch - 2;
      const steps = 24, sh = bh / steps;
      let g = '';
      for (let k = 0; k < steps; k++) g += `<rect x="${bx}" y="${(by + k * sh).toFixed(1)}" width="12" height="${(sh + 1).toFixed(1)}" fill="${heatColour(1 - k / (steps - 1))}"/>`;
      return `<g>${g}<text x="${bx + 18}" y="${by + 8}" fill="${C.text}" font-size="9">${esc(fmt(hi, o.dp))}</text>
        <text x="${bx + 18}" y="${by + bh}" fill="${C.text}" font-size="9">${esc(fmt(lo, o.dp))}</text></g>`;
    })();
    return `<figure class="pc"><svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" role="img" aria-label="${esc(o.title || 'heat map')}">
      ${cells.join('')}${rowLabels}${colLabels}${legend}
      ${o.xLabel ? `<text x="${(l + cols.length * cw / 2).toFixed(1)}" y="${h - 6}" fill="${C.text}" font-size="10" text-anchor="middle">${esc(o.xLabel)}</text>` : ''}
      ${o.yLabel ? `<text x="12" y="${(t + rows.length * ch / 2).toFixed(1)}" fill="${C.text}" font-size="10" transform="rotate(-90 12 ${(t + rows.length * ch / 2).toFixed(1)})" text-anchor="middle">${esc(o.yLabel)}</text>` : ''}
    </svg>${o.caption ? `<figcaption class="faint">${o.caption}</figcaption>` : ''}</figure>`;
  }

  // A surface as an isometric wireframe: rows and columns joined over a height.
  function mesh(o){
    const w = o.w || 940, h = o.h || 420;
    const rows = o.z.length, cols = o.z[0].length;
    const vals = o.z.flat().filter(v => v != null);
    const lo = Math.min(...vals), hi = Math.max(...vals), span = (hi - lo) || 1;
    const ox = o.ox ?? w * 0.52;
    const sy = o.sy ?? Math.min(22, h / (2 * Math.max(1, (rows - 1) + (cols - 1))));
    const sx = o.sx ?? Math.min(46, (w * 0.6) / Math.max(1, (rows - 1) + (cols - 1)));
    const sz = o.sz ?? h * 0.34;
    const oy = o.oy ?? h - 26 - ((rows - 1) + (cols - 1)) * sy;
    const P = (i, j) => {
      const v = o.z[i][j];
      const z = v == null ? 0 : (v - lo) / span;
      return [ox + (j - i) * sx, oy + (i + j) * sy - z * sz, z];
    };
    const lines = [];
    for (let i = 0; i < rows; i++) {
      let d = '';
      for (let j = 0; j < cols; j++) { const p = P(i, j); d += (j ? 'L' : 'M') + p[0].toFixed(1) + ',' + p[1].toFixed(1) + ' '; }
      lines.push(`<path d="${d}" fill="none" stroke="${C.accent}" stroke-width="1.4" opacity=".75"/>`);
    }
    for (let j = 0; j < cols; j++) {
      let d = '';
      for (let i = 0; i < rows; i++) { const p = P(i, j); d += (i ? 'L' : 'M') + p[0].toFixed(1) + ',' + p[1].toFixed(1) + ' '; }
      lines.push(`<path d="${d}" fill="none" stroke="${C.warn}" stroke-width="1" opacity=".5"/>`);
    }
    const rowL = (o.rows || []).map((r, i) => { const p = P(i, 0); return `<text x="${(p[0] - 12).toFixed(1)}" y="${(p[1] + 4).toFixed(1)}" fill="${C.text}" font-size="10" text-anchor="end">${esc(r.label)}</text>`; }).join('');
    const colL = (o.cols || []).map((c, j) => { const p = P(rows - 1, j); return `<text x="${(p[0] + 10).toFixed(1)}" y="${(p[1] + 4).toFixed(1)}" fill="${C.text}" font-size="10">${esc(c.label)}</text>`; }).join('');
    const axis = `<text x="14" y="${h - 12}" fill="${C.text}" font-size="10">height: ${esc(o.zLabel || 'value')} ${esc(fmt(lo, o.dp))}–${esc(fmt(hi, o.dp))}</text>`;
    return `<figure class="pc"><svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" role="img" aria-label="${esc(o.title || 'surface mesh')}">
      ${lines.join('')}${rowL}${colL}${axis}</svg>
      <div class="pc-legend"><span><i style="background:${C.accent}"></i>expiry</span><span><i style="background:${C.warn}"></i>strike</span>${(o.notes || []).map(n => `<span class="faint">${n}</span>`).join('')}</div>
      ${o.caption ? `<figcaption class="faint">${esc(o.caption)}</figcaption>` : ''}</figure>`;
  }

  return {line, bars, heat, mesh, colours: C, heatColour};
})();

// The short name of a node: its tenor (curves) or expiry then delta (surfaces).
function nodeLabel(n){
  const t = /(?:^|&)(?:tenor|expiry)=([^&]+)/.exec(n);
  const d = /(?:^|&)delta=([^&]+)/.exec(n);
  if (!t) return n;
  return d ? `${t[1]} ${d[1]}` : t[1];
}
// A tenor or expiry as months, so 3M < 6M < 1Y < 10Y. Unknown keys sort last.
function nodeOrder(n){
  const t = /(?:^|&)(?:tenor|expiry)=([^&]+)/.exec(n);
  if (!t) return 1e9;
  const k = /^(\d+)([DWMY])$/.exec(t[1]);
  if (!k) return 1e9;
  return +k[1] * ({D: 1, W: 7, M: 30, Y: 365}[k[2]]);
}
// The union of the nodes at any instant, ordered, with an x position in 0..1.
function axisColumns(){
  const keys = [...new Set(nodes.map(x => x.n))];
  keys.sort((a, b) => nodeOrder(a) - nodeOrder(b) || a.localeCompare(b));
  return keys.map((key, i) => ({key, label: nodeLabel(key), at: keys.length <= 1 ? 0.5 : i / (keys.length - 1)}));
}

// One line per instant over the union of nodes. A null breaks the line, so an
// edge is a node the instant added or dropped.
function evolutionChart(){
  const cols = axisColumns();
  const byKey = new Map(nodes.map(x => [x.n, x]));
  const palette = ['#58a6ff', '#3fb950', '#d29922', '#f85149', '#a371f7'];
  const isRate = state !== 'surface';
  const series = instants.map((t, ti) => ({
    name: t,
    color: palette[ti % palette.length],
    markers: true,
    points: cols.map(c => { const nd = byKey.get(c.key); return nd ? nd.v[ti] : null; })
  }));
  const added = [], dropped = [];
  for (let i = 1; i < instants.length; i++) {
    addedAt(i).forEach(x => { if (!added.some(e => e.n === x.n)) added.push({n: x.n, label: nodeLabel(x.n), at: instants[i]}); });
    droppedBy(i).forEach(x => { if (!dropped.some(e => e.n === x.n)) dropped.push({n: x.n, label: nodeLabel(x.n), at: instants[i - 1]}); });
  }
  const move = [];
  if (added.length) move.push('Added: ' + added.map(e => `${e.label} at ${e.at}`).join(', '));
  if (dropped.length) move.push('Dropped: ' + dropped.map(e => `${e.label} after ${e.at}`).join(', '));
  const caption =
    `One line per instant, aligned on the union of ${cols.length} nodes, ${instants[0]} to ${instants[instants.length - 1]}. ` +
    `A break is a node the instant did not carry. ` +
    (move.length ? move.join('. ') + '.' : 'The node set held across the range.');
  return `<div class="panel">
    <h2>Curve evolution — one line per instant</h2>
    ${PC.line({
      series,
      x: cols.map(c => c.at),
      ticks: cols.map(c => ({at: c.at, label: c.label})),
      yFmt: v => isRate ? v.toFixed(1) + '%' : v.toFixed(1),
      yLabel: isRate ? 'rate (%)' : 'vol',
      h: 320,
      caption
    })}
  </div>`;
}

// Added (positive) and dropped (negative) node counts on each step.
function nodeChanges(){
  const steps = [];
  for (let i = 1; i < instants.length; i++) {
    const add = nodes.filter(x => x.v[i - 1] == null && x.v[i] != null).map(x => nodeLabel(x.n));
    const drop = nodes.filter(x => x.v[i - 1] != null && x.v[i] == null).map(x => nodeLabel(x.n));
    steps.push({to: instants[i], add, drop});
  }
  const bars = [];
  steps.forEach(s => {
    bars.push({label: `+ ${s.to}`, value: s.add.length, color: PC.colours.ok});
    bars.push({label: `− ${s.to}`, value: -s.drop.length, color: PC.colours.bad});
  });
  const totalAdd = steps.reduce((n, s) => n + s.add.length, 0);
  const totalDrop = steps.reduce((n, s) => n + s.drop.length, 0);
  const detail = steps.filter(s => s.add.length || s.drop.length).map(s =>
    `${s.to}: ${[s.add.length ? s.add.join(', ') + ' added' : '', s.drop.length ? s.drop.join(', ') + ' dropped' : ''].filter(Boolean).join(', ')}`).join('. ');
  const caption =
    `Nodes that appeared (positive, green) and nodes that went absent (negative, red) on each step, over ${nodes.length} nodes. ` +
    `${totalAdd} added and ${totalDrop} dropped across the range. ` + (detail ? detail + '.' : 'No node appeared or dropped; the node set held.');
  return `<div class="panel">
    <h2>Added and dropped nodes per step</h2>
    ${PC.bars({
      bars,
      h: 260,
      yFmt: v => { const r = Math.round(v); return Math.abs(v - r) < 1e-9 ? (r > 0 ? '+' + r : String(r)) : ''; },
      caption
    })}
  </div>`;
}

// The surface change from the first to the last instant. The mock carries an
// expiry by delta grid, so the change is a heat map; a grid with one dimension
// falls back to a per-instant line of the ATM or extreme slice.
function surfaceEvolution(){
  const first = instants[0], last = instants[instants.length - 1], li = instants.length - 1;
  const uniq = xs => [...new Set(xs)];
  const rows = uniq(surfs.map(x => (/expiry=([^&]+)/.exec(x.n) || [])[1]).filter(Boolean))
    .sort((a, b) => nodeOrder('expiry=' + a) - nodeOrder('expiry=' + b));
  const cols = uniq(surfs.map(x => (/delta=([^&]+)/.exec(x.n) || [])[1]).filter(Boolean));
  const order = ['ATM', '25RR', '25BF'];
  cols.sort((a, b) => (order.indexOf(a) < 0 ? 99 : order.indexOf(a)) - (order.indexOf(b) < 0 ? 99 : order.indexOf(b)) || a.localeCompare(b));
  if (!surfs.length || (!rows.length && !cols.length)) return '';
  const find = (e, d) => surfs.find(x => x.n.includes('expiry=' + e) && x.n.includes('delta=' + d));

  if (rows.length >= 2 && cols.length >= 1) {
    const cell = (i, j) => { const x = find(rows[i], cols[j]); return x && x.v[0] != null && x.v[li] != null ? x.v[li] - x.v[0] : null; };
    const cells = [];
    rows.forEach((e, i) => cols.forEach((d, j) => { const v = cell(i, j); if (v != null) cells.push(v); }));
    if (!cells.length) return '';
    const added = uniq(surfs.filter(x => x.v[0] == null && x.v.some(v => v != null)).map(x => nodeLabel(x.n)));
    const dropped = uniq(surfs.filter(x => x.v[0] != null && x.v[li] == null).map(x => nodeLabel(x.n)));
    const notes = [];
    if (added.length) notes.push('appeared: ' + added.join(', '));
    if (dropped.length) notes.push('dropped: ' + dropped.join(', '));
    return `<div class="panel">
      <h2>Surface evolution — change from ${first} to ${last}</h2>
      ${PC.heat({
        rows: rows.map(e => ({label: e})),
        cols: cols.map(d => ({label: d})),
        value: cell,
        dp: 2,
        xLabel: 'delta',
        yLabel: 'expiry',
        caption: `Each cell is the value at ${last} minus the value at ${first}. Rows are expiry, columns are delta. ` +
          `A dark cell is a node absent at one end or both. ` + (notes.length ? notes.join('; ') + '.' : 'The grid held at both ends.')
      })}
    </div>`;
  }

  const dim = rows.length ? {kind: 'expiry', values: rows} : {kind: 'delta', values: cols};
  const reps = dim.values.map(v => {
    const cand = surfs.filter(x => x.n.includes(`${dim.kind}=${v}`));
    if (!cand.length) return null;
    return cand.find(x => x.n.includes('delta=ATM')) || cand.slice().sort((a, b) => Math.abs(b.v[0] ?? 0) - Math.abs(a.v[0] ?? 0))[0];
  });
  const labels = reps.map((x, i) => x ? nodeLabel(x.n) : dim.values[i]);
  const palette = ['#58a6ff', '#3fb950', '#d29922', '#f85149', '#a371f7'];
  const series = instants.map((t, ti) => ({
    name: t,
    color: palette[ti % palette.length],
    markers: true,
    points: reps.map(x => x ? x.v[ti] : null)
  }));
  const caption =
    `The data supports one dimension only (${dim.kind}), so this is the ATM or extreme slice per instant, not a surface change. ` +
    `Aligned on ${labels.length} ${dim.kind} values, ${first} to ${last}. A break is a node the instant did not carry.`;
  return `<div class="panel">
    <h2>Surface evolution — ${dim.kind} slice per instant</h2>
    ${PC.line({
      series,
      x: labels.map((_, i) => labels.length <= 1 ? 0.5 : i / (labels.length - 1)),
      ticks: labels.map((l, i) => ({at: labels.length <= 1 ? 0.5 : i / (labels.length - 1), label: l})),
      yFmt: v => v.toFixed(1),
      yLabel: 'vol',
      h: 300,
      caption
    })}
  </div>`;
}

function render(){
  const app = document.getElementById('app');
  const base = variant === 'b' ? sparkList() : variant === 'c' ? compare() : matrix();
  const extra = variant === 'b' ? evolutionChart() : nodeChanges();
  const surf = state === 'surface' ? surfaceEvolution() : '';
  app.innerHTML = header() + base + extra + surf + changesPanel();
  document.getElementById('note').textContent =
    `Prototype · watch a curve or surface evolve · variant ${variant.toUpperCase()} · market: ${state} · zoom: ${show} · read only`;
  document.getElementById('bar').innerHTML =
    `<span class="label">Layout</span>` +
    ['a','b','c'].map(v => `<button data-v="${v}" class="${v === variant ? 'on' : ''}">${v.toUpperCase()} ${v === 'a' ? 'matrix' : v === 'b' ? 'sparklines' : 'compare'}</button>`).join('') +
    `<span class="sep">|</span><span class="label">Zoom</span>` +
    ['instant','range'].map(s => `<button data-z="${s}" class="${s === show ? 'on' : ''}">${s}</button>`).join('') +
    `<span class="sep">|</span><span class="label">Market</span>` +
    ['stable','churn','surface'].map(s => `<button data-s="${s}" class="${s === state ? 'on' : ''}">${s}</button>`).join('');
  document.querySelectorAll('#bar [data-v]').forEach(b => b.onclick = () => set('variant', b.dataset.v));
  document.querySelectorAll('#bar [data-z]').forEach(b => b.onclick = () => set('show', b.dataset.z));
  document.querySelectorAll('#bar [data-s]').forEach(b => b.onclick = () => set('state', b.dataset.s));
  document.querySelectorAll('[data-pick]').forEach(s => s.onchange = () => set(s.dataset.pick, s.value));
  const sh = document.getElementById('show');
  if (sh) sh.onchange = () => set('show', sh.value);
  document.querySelectorAll('[data-act]').forEach(b => b.onclick = () => {
    document.getElementById('note').textContent = `${b.textContent}: the range always ends at now — there is no start and end`;
  });
}
function set(k, v){ const p = new URLSearchParams(location.search); p.set(k, v); location.search = p.toString(); }
render();
</script>
</body>
</html>
