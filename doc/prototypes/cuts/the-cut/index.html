    function surfaceSelect() {
        var r = reportForRecord();
        var chosen = S.sel || r.sel || '';
        var pinned = S.pin || r.pinned || '';
        /* Only the kinds a rule can resolve are offered here. A flash cut or one
           an ad-hoc process names answers to no schedule, so a report reaches it by
           pinning one of its cuts. */
        var kinds = CUT_TYPES.filter(function (t) { return t.resolution !== 'the_cut_named'; })
            .map(function (t) { return t.code; }).map(function (k) {
            var d = KIND_DECL[k];
            return '<tr class="pick' + (chosen === k && !pinned ? ' sel' : '') + '" data-sel="' + k + '">' +
                '<td class="key">' + esc(k) + '<span class="sub">' + esc(d.name) + '</span></td>' +
                '<td>' + esc(d.resolves) + '</td>' +
                '<td>' + (d.requires_auth ? badge('Signed', 'pending') : badge('Not signed', 'inactive')) +
                (d.indicative ? ' ' + badge('Indicative', 'indicative') : '') + '</td></tr>';
        }).join('');
        var cuts = CUTS.filter(function (c) { return c.state !== 'draft'; }).slice(0, 5).map(function (c) {
            return '<tr class="pick' + (pinned === c.id ? ' sel' : '') + '" data-pin-cut="' + c.id + '">' +
                '<td class="key">' + esc(c.label) + '<span class="sub">' + esc(SCOPE_LONG) + '</span></td>' +
                '<td>' + stateBadge(c) + '</td><td>' + esc(c.auth_by || '\u2014') + '</td></tr>';
        }).join('');
        var preview = (function () {
            var probe = { sel: chosen, pinned: pinned, date: r.date };
            var v = resolve(probe);
            return previewPanel(probe, v, true);
        })();
        return reportFrame(r, S.tab === 'market' ? reportMarketTab(r) : reportDefinitionTab(r),
            '<div class="backdrop"></div><div class="dialog">' +
            '<div class="head"><h2>What this report prices from</h2>' +
            '<p class="note">A kind of cut, or one cut. The run resolves it before it gathers anything, ' +
            'and records the cut it resolved.</p></div>' +
            '<div class="body">' +
            '<div class="panel"><table class="rows"><thead><tr><th>Selection kind</th>' +
            '<th>Resolves to</th><th>Authorisation</th></tr></thead><tbody>' + kinds + '</tbody></table></div>' +
            '<p class="rule">A selection names an occasion, and the rows here are the kinds whose rule ' +
            'can resolve one: the three end of day types, the open, the verification and the live view. ' +
            'LIVE is the one whose instant comes from the run, so its cut does not exist until a run ' +
            'mints it. A flash cut, or one an ad-hoc process names, answers to no schedule, so it is ' +
            'pinned below instead of selected by kind.' +
            '</p>' +
            '<div class="spacer"></div>' +
            '<div class="panel"><h2>Or one specific cut <span class="sub">pin the report to a body</span></h2>' +
            '<table class="rows"><thead><tr><th>Cut</th><th>State</th><th>Authoriser</th></tr></thead>' +
            '<tbody>' + cuts + '</tbody></table>' +
            '<p class="rule">A pinned report prices from that body whatever the date, which is the one way ' +
            'to reproduce an earlier result on purpose.</p></div>' +
            '<div class="spacer"></div>' + preview +
            '<div class="gap"><b>Gap.</b> The definition has no field for the selection, the kinds have no ' +
            'vocabulary in the store, and <code>reporting.v1.ops.resolve_cut</code> does not exist, so ' +
            'neither the list\u2019s badge nor this preview has a source.</div>' +
            '</div>' +
            '<div class="foot"><div class="footrow"><button class="btn">Cancel</button>' +
            '<button class="btn primary">Save the selection</button></div>' +
            '<p class="rule">The selection is written with the definition, in one version, with a change ' +
            'reason. It moves what the report prices from and not how the engine runs.</p>' +
            '</div></div>');
    }

    /* ---------------------------------------------------------------- */
    /* Surface 5: the run that names the cut.                             */
    /* ---------------------------------------------------------------- */

    function surfaceRun() {
        var verdict = S.verdict || (S.fcase === 'refused' ? 'refused'
            : S.fcase === 'taken' ? 'refused-taken'
            : S.fcase === 'missing' ? 'refused-missing'
            : S.fcase === 'live' ? 'cannot-retake'
            : S.fcase === 'incomplete' ? 'refused-incomplete' : 'reproduced');
        /* A run of a LIVE report minted its own body; a run of the other kinds
           resolved a selection to a cut that already existed. */
        var live = S.fcase === 'live';
        var cut = live ? byId('c8')
            : (S.fcase === 'in-use' || S.fcase === 'flash') ? byId('c3')
            : byId(CONFIG_CUT);
        var report = live ? reportById('r3') : reportById('r1');
        if (S.fcase === 'missing') report = reportForRecord();
        var refused = verdict.indexOf('refused') === 0;
        var head = refused ? runRefused(verdict, cut, report) : runPriced(verdict, cut, report);
        var runId = refused ? '#4831' : (live ? '#4820' : '#4823');
        return '<p class="crumbs">Home <span class="sep">&rsaquo;</span> Reporting ' +
            '<span class="sep">&rsaquo;</span> Reports <span class="sep">&rsaquo;</span> ' +
            esc(report.name) + ' <span class="sep">&rsaquo;</span> Runs ' +
            '<span class="sep">&rsaquo;</span> ' + runId + '</p>' +
            '<div class="pagehead"><div><h1>Run ' + runId + '</h1>' +
            '<p class="lead">' + esc(report.name) + ' &middot; on-demand &middot; ' +
            (refused ? 'refused' : 'completed clean') + ' &middot; ' +
            (refused ? 'just now' : (live ? '28 minutes ago' : '1 day ago')) + '</p></div>' +
            '<div class="actions"><button class="btn">Refresh</button></div></div>' +
            resolvedFrom(report, cut, live, refused) +
            comparisonStrip(verdict) + head;
    }

    /* The sentence that says what the run resolved, before the card says what it
       priced from: the selection is what the person set, the cut is what the run
       did with it. */
    function resolvedFrom(report, cut, live, refused) {
        var sel = report.sel || '';
        if (!sel)
            return '<div class="notice warn"><b>This report selects no cut.</b> ' +
                'Its run has no body to value, and the refusal above says so.</div>';
        if (refused)
            return '<div class="notice error"><b>The selection resolved to nothing usable.</b> ' +
                'It selected <span class="mono">' + esc(sel) + '</span>' + (report.pinned ? ', pinned' : '') +
                ', and the run was refused before the engine was reached. The sentence is the one the ' +
                'report page shows before the press.</div>';
        return '<div class="notice info"><b>Resolved from the report\u2019s selection.</b> ' +
            'The report selected <span class="mono">' + esc(sel) + '</span>' +
            (report.pinned ? ', pinned to one cut' : '') + ', and the run resolved it to ' +
            '<span class="mono">' + esc(cut.label) + '</span>' +
            (live ? ', which this run minted at its own instant.' : '.') +
            ' The run records the cut, so the result names its body even after the selection moves.</div>';
    }

    /* Every comparison verdict is one link away, so a reviewer reads all five. */
    function comparisonStrip(current) {
        var opts = [['Reproduced', 'reproduced'], ['Differs', 'differs'],
                    ['Cannot: engine version', 'cannot-engine'],
                    ['Cannot: a part is gone', 'cannot-part'],
                    ['Cannot: retaken body', 'cannot-retake'],
                    ['Refused: a cut not authorised', 'refused-taken'],
                    ['Refused: an incomplete body', 'refused-incomplete'],
                    ['Refused: no cut named', 'refused']];
        return '<div class="listtools"><span class="faint" style="font-size:12px">Compare with:</span>' +
            opts.map(function (o) {
                var on = o[1] === current;
                return '<a href="' + q({ surface: 'run', verdict: o[1], fcase: '' }) + '"' +
                    (on ? ' style="color:var(--ink);border-color:var(--accent)"' : '') +
                    ' class="' + (on ? 'toggle on' : 'toggle') + '">' + esc(o[0]) + '</a>';
            }).join('') + '</div>';
    }

    function runRefused(verdict, cut, report) {
        var why, market;
        if (verdict === 'refused-missing') {
            why = 'No ' + (report && report.sel ? KIND_DECL[report.sel].name.toLowerCase() : 'cut') +
                ' cut of ' + (report ? coverDate(report) : '') + ' exists for these books. ' +
                'Somebody must take one.';
            market = 'nothing: no such cut';
        } else if (verdict === 'refused-taken') {
            why = 'The cut is taken and nobody has authorised it. The body is fixed and no run may price ' +
                'from it. The request waits on Finance.';
            market = 'the cut ' + byId('c5').label + ', taken';
        } else if (verdict === 'refused-incomplete') {
            why = 'The cut holds no complete body. It has 3 gaps, and the take resumes once they are closed.';
            market = 'the cut ' + byId('c4').label + ', incomplete';
        } else {
            why = 'The configuration names no cut, so a run has no body to value.';
            market = 'no cut named';
        }
        return '<div class="notice error"><b>This run was refused, and it says why.</b> ' + esc(why) +
            ' <b>It was refused before the engine was reached</b>, so nothing was priced and no result ' +
            'exists.</div>' +
            '<div class="panel"><h2>The runs of this report, and the body each met</h2>' +
            '<table class="rows"><thead><tr><th>Run</th><th>What the run resolves</th><th>State</th>' +
            '<th>What happened</th></tr></thead><tbody>' +
            '<tr><td class="key">#4831<span class="sub">just now</span></td><td>' + esc(market) + '</td>' +
            '<td>' + badge('Refused', 'bad') + '</td><td>' + esc(why) + '</td></tr>' +
            '<tr><td class="key">#4823<span class="sub">1 day ago</span></td>' +
            '<td>' + esc(byId(CONFIG_CUT).label) + '</td><td>' + badge('Completed', 'ok') + '</td>' +
            '<td>Priced from the cut named beside it</td></tr>' +
            '</tbody></table></div>' +
            '<div class="spacer"></div>' +
            '<div class="panel"><h2>The cut it priced from</h2><p class="sentence">This run never reached ' +
            'the body. A run that was refused has no cut to name, and that is the answer.</p></div>' +
            '<div class="gap"><b>Gap.</b> The gathering steps read the store, not a cut, so the refusal ' +
            'cannot be raised by the server today. <code>reporting.v1.ops.check_cut_consumable</code> is ' +
            'missing.</div>';
    }

    function runPriced(verdict, cut, report) {
        var live = !!(report && report.sel === 'LIVE');
        var v = verdictBox(verdict, cut, live);
        return '<div class="notice success"><b>The run priced from the cut its selection resolved.</b> ' +
            'The run, its package and its numbers are that body at ' + dt(cut.instant) + '.</div>' +
            '<div class="panel"><h2>The runs of this report, and the body each met</h2>' +
            '<table class="rows"><thead><tr><th>Run</th><th>Body the run resolves</th><th>State</th>' +
            '<th>Comparison</th></tr></thead><tbody>' +
            (live
                ? '<tr><td class="key">#4820<span class="sub">28 minutes ago</span></td>' +
                  '<td class="mono">' + esc(cut.label) + '</td><td>' + badge('Completed', 'ok') + '</td>' +
                  '<td>Not compared: a later body</td></tr>' +
                  '<tr><td class="key">#4818<span class="sub">2 hours ago</span></td>' +
                  '<td class="mono">LIVE.ACME-LONDON.2026-10-07T07:12:00Z</td>' +
                  '<td>' + badge('Completed', 'ok') + '</td>' +
                  '<td class="dim">Another body: the report ran again</td></tr>' + ''
                : '<tr><td class="key">#4823<span class="sub">1 day ago</span></td>' +
                  '<td class="mono">' + esc(cut.label) + '</td><td>' + badge('Completed', 'ok') + '</td>' +
                  '<td>Compared with #4819</td></tr>') +
            '<tr><td class="key">#4822<span class="sub">1 day ago</span></td>' +
            '<td class="mono">' + esc(cut.label) + '</td>' +
            '<td>' + badge('Completed with errors', 'caution') + '</td>' +
            '<td class="dim">Not compared: the run reported errors</td></tr>' +
            '<tr><td class="key">#4819<span class="sub">1 day ago</span></td>' +
            '<td class="mono">' + esc(cut.label) + '</td><td>' + badge('Completed', 'ok') + '</td>' +
            '<td class="dim">The original run</td></tr>' +
            '</tbody></table></div>' +
            '<div class="spacer"></div>' + cutCard(cut) + '<div class="spacer"></div>' + v;
    }

    function cutCard(c) {
        return '<div class="panel"><h2>The cut it priced from ' +
            '<span class="sub">run #4823 &middot; read from the run, never from the configuration</span></h2>' +
            '<div class="facts">' +
            fact('Cut', '<span class="mono">' + esc(c.label) + '</span>') +
            fact('Kind', esc(c.kind)) +
            fact('Timepoint', '<span class="mono">' + dt(c.instant) + '</span>') +
            fact('Scope', esc(SCOPE_LONG)) +
            fact('Deals valued', c.deals.toLocaleString('en-GB')) +
            fact('Market data values read', c.values.toLocaleString('en-GB')) +
            fact('Taken by', esc(c.taken_by)) +
            (decl(c).requires_auth
                ? fact('Authorised by', esc(c.auth_by) + ' on ' + dt(c.auth_at))
                : fact('Basis', 'No authorisation required by its kind')) +
            fact('Engine version', '<span class="mono">' + esc(c.engine) + '</span>') +
            '</div>' +
            (indicativeOutput(c)
                ? '<p class="sentence">' + badge('Indicative output', 'indicative') + ' The kind fixes ' +
                  'indicative values, so every figure this run produced is marked indicative. ' +
                  'The body is complete and reproduces; the values are not official.</p>'
                : '') +
            '<p class="sentence">The market roles inside the body: pricing resolves to ' +
            '<b>USD-SOFR-3M &middot; ACME London</b> at <b>' + dt(c.instant) + '</b>, publish record ' +
            '<b>8f2a4c19</b>, and simulation to <b>EUR-ESTR-6M</b> at the same as-of, publish record ' +
            '<b>2c40f8d1</b>.</p>' +
            '<p class="rule">The run names the cut it used, not the cut the configuration names today: the ' +
            'configuration may move, and a result that moved with it would be unreadable.</p>' +
            '<div class="gap"><b>Gap.</b> <code>report_instance</code> carries <code>priced_at</code> and ' +
            '<code>price_note</code> and nothing that names a cut or an engine version. A run cannot answer ' +
            'this card\u2019s question today.</div></div>';
    }

    function verdictBox(verdict, c, live) {
        if (verdict === 'differs') {
            return '<div class="verdict bad"><h3>Differs: the body and the engine are the same, and the result moved</h3>' +
                '<p>Run #4823 and the run it is compared with priced from ' + esc(c.label) + ' with ' +
                esc(c.engine) + '. One figure differs, which is a defect in the engine or in the code and ' +
                'not a movement of the market.</p>' +
                '<table class="diff"><thead><tr><th>Figure</th><th>#4819</th><th>#4823</th>' +
                '<th>Difference</th></tr></thead><tbody>' +
                '<tr><td>NPV &middot; total</td><td class="n">12,481,902.44</td>' +
                '<td class="n">12,481,903.11</td><td class="moved">+0.67</td></tr>' +
                '<tr><td>Delta &middot; USD</td><td class="n">-1,882,441.00</td>' +
                '<td class="n">-1,882,441.00</td><td class="n same">&mdash;</td></tr>' +
                '</tbody></table></div>';
        }
        if (verdict.indexOf('cannot') === 0) {
            var reason = (verdict === 'cannot-retake' && live)
                ? { t: 'Cannot be compared: the report was run twice on LIVE',
                    p: 'Each run minted a cut at its own instant, ' + dt(c.instant) + ' and ' +
                       '07 Oct 2026 07:12Z, so the two share no body at all. The first result is ' +
                       'reproduced by naming the cut the first run recorded, which is a selection of ' +
                       'that specific cut.' }
                : verdict === 'cannot-engine'
                ? { t: 'Cannot be compared: the engine version differs',
                    p: 'The original run used ORE-Studio-7.0 and today serves ORE-Studio-7.1. The body is the ' +
                       'same and the software is not, so the two are not one result computed twice. ' +
                       'A rerun on a host still serving 7.0 would reproduce it.' }
                : verdict === 'cannot-part'
                ? { t: 'Cannot be compared: a part of the body is no longer served',
                    p: 'The body records a fixed snapshot of USD-SOFR-3M at 06 Oct 16:00Z, and the store no ' +
                       'longer serves a series it resolved. The cut kept the identity of a snapshot nothing ' +
                       'materialised, so the values cannot be read back.' }
                : { t: 'Cannot be compared: the body was retaken',
                    p: 'The original run priced from EOD.ACME-LONDON.2026-10-06 and the comparison names ' +
                       'EOD.ACME-LONDON.2026-10-06.2. A retaken body is a different body, and its figures are ' +
                       'comparable only as a movement.' };
            return '<div class="verdict caution"><h3>' + esc(reason.t) + '</h3><p>' + esc(reason.p) + '</p>' +
                '<p style="margin-top:8px">The statement is what an auditor writes down: the body, the two ' +
                'runs and the reason the same number cannot be produced.</p></div>';
        }
        return '<div class="verdict ok"><h3>Reproduced: one result computed twice</h3>' +
            '<p>Run #4823 and run #4819 priced from ' + esc(c.label) + ' with ' + esc(c.engine) +
            ', and every figure is equal. The cut is the body in both, and the engine is the same software, ' +
            'which is the definition the cluster quotes.</p>' +
            '<table class="diff"><thead><tr><th>Figure</th><th>#4819</th><th>#4823</th>' +
            '<th>Difference</th></tr></thead><tbody>' +
            '<tr><td>NPV &middot; total</td><td class="n">12,481,902.44</td>' +
            '<td class="n">12,481,902.44</td><td class="n same">&mdash;</td></tr>' +
            '<tr><td>Delta &middot; USD</td><td class="n">-1,882,441.00</td>' +
            '<td class="n">-1,882,441.00</td><td class="n same">&mdash;</td></tr>' +
            '</tbody></table></div>';
    }

    /* ---------------------------------------------------------------- */
    /* Surfaces 7 and 8: the cut types, as reference data.                */
    /* ---------------------------------------------------------------- */

    /* The cuts of a type, grouped. The group is the period one step above the
       type's frequency, so a daily type reads by month, a monthly one by year,
       a yearly one as a single group, and an on-demand one by day. */
    function groupFor(t, c) {
        var day = c.instant.slice(0, 10);
        var month = c.instant.slice(0, 7);
        var year = c.instant.slice(0, 4);
        if (t.freq === 'daily') return { key: month, label: mon(month) };
        if (t.freq === 'monthly') return { key: year, label: 'Year ' + year };
        if (t.freq === 'yearly') return { key: 'all', label: 'Every year' };
        return { key: day, label: dt(day + 'T00:00:00Z').slice(0, 11) };
    }

    function mon(m) {
        var names = ['January', 'February', 'March', 'April', 'May', 'June', 'July',
                     'August', 'September', 'October', 'November', 'December'];
        return names[Number(m.slice(5, 7)) - 1] + ' ' + m.slice(0, 4);
    }

    function cutsOfType(code) {
        return CUTS.filter(function (c) { return c.code === code; })
            .sort(function (a, b) { return a.instant < b.instant ? 1 : -1; });
    }

    function surfaceTypes() {
        var rows = CUT_TYPES.map(function (t) {
            return '<tr class="pick" data-type="' + t.code + '">' +
                '<td class="key">' + esc(t.code) + '<span class="sub">' + esc(t.name) + '</span></td>' +
                '<td>' + esc(t.family) + '</td>' +
                '<td class="dim">' + esc(t.auth) + '</td>' +
                '<td>' + (t.indicative ? badge('Indicative', 'indicative')
                    : badge('Official', 'inactive')) + '</td>' +
                '<td class="num">' + t.months + ' months<span class="sub">' + esc(t.dest) + '</span></td>' +
                '<td class="num">' + cutsOfType(t.code).length + '</td></tr>';
        }).join('');
        return typesFrame('<div class="panel"><table class="rows"><thead><tr>' +
            '<th>Type</th><th>Family</th><th>Authorisation</th><th>Values</th>' +
            '<th>Retention</th><th>Cuts</th></tr></thead><tbody>' + rows + '</tbody></table>' +
            '<div class="pager"><span>1\u2013' + CUT_TYPES.length + ' of ' + CUT_TYPES.length + '</span>' +
            '<span class="right">Page size <span class="dash">15</span></span></div></div>' +
            '<p class="sentence"><b>What a type is.</b> Reference data a person maintains: what the ' +
            'occasion is for, whether a cut of it is signed, whether its values are indicative, the rule ' +
            'by which a report resolves a selection of it, and how long its cuts are kept.</p>' +
            '<p class="rule"><b>The family.</b> End of day, start of day, verification, intraday and ' +
            'consumer. A family fixes the body rule and where the instant comes from; a type inside it ' +
            'fixes the rest. The three end of day types share one body and differ in their occasion and ' +
            'their retention.</p>' +
            '<div class="gap"><b>Gap.</b> No cut type lookup exists: these six rules live in a knowledge ' +
            'page and in this fixture. Nothing reads them at a take, at a resolution or at an archive.</div>');
    }

    function typesFrame(body) {
        return '<p class="crumbs">Home <span class="sep">&rsaquo;</span> Reference data ' +
            '<span class="sep">&rsaquo;</span> Cut types</p>' +
            '<div class="pagehead"><div><h1>Cut types</h1>' +
            '<p class="lead">The occasions a cut is taken for, the rules each carries, and the cuts ' +
            'already taken of each.</p></div>' +
            '<div class="actions"><span class="access">Editable</span>' +
            '<button class="btn">Refresh</button><button class="btn">Import</button>' +
            '<button class="btn">Export</button><button class="btn primary">Add</button></div></div>' +
            '<div class="listtools"><div class="searchbox"><input placeholder="Search the code or the name">' +
            '</div><select><option>Family: all</option><option>End of day</option>' +
            '<option>Start of day</option><option>Verification</option><option>Intraday</option>' +
            '<option>Consumer</option></select></div>' + body;
    }

    function surfaceType() {
        var t = typeByCode(S.type || 'EOD') || CUT_TYPES[0];
        var cuts = cutsOfType(t.code);
        var groups = [];
        cuts.forEach(function (c) {
            var g = groupFor(t, c);
            var found = null;
            groups.forEach(function (x) { if (x.key === g.key) found = x; });
            if (!found) { found = { key: g.key, label: g.label, cuts: [] }; groups.push(found); }
            found.cuts.push(c);
        });
        var body = '';
        if (!groups.length) {
            body = '<div class="tblstate"><b>No cuts of this type yet.</b>' +
                'A cut of this type is taken on its occasion, and reported here once it exists.</div>';
        } else {
            body = groups.map(function (g) {
                return '<div class="panel" style="margin:0 0 16px"><h2>' + esc(g.label) +
                    ' <span class="sub">' + g.cuts.length + ' cut' + (g.cuts.length === 1 ? '' : 's') +
                    '</span></h2><table class="rows"><thead><tr><th>Cut</th><th>Timepoint</th>' +
                    '<th>State</th><th>Taker</th><th>Authoriser</th><th>Runs</th></tr></thead><tbody>' +
                    g.cuts.map(function (c) {
                        return '<tr class="pick" data-cut="' + c.id + '"><td class="key">' + esc(c.label) +
                            '</td><td class="mono nowrap">' + dt(c.instant) + '</td>' +
                            '<td>' + stateBadge(c) + indicativeTag(c) + '</td>' +
                            '<td>' + esc(c.taken_by) + '</td>' +
                            '<td>' + (c.auth_by || '<span class="dash">&mdash;</span>') + '</td>' +
                            '<td class="num">' + c.runs + '</td></tr>';
                    }).join('') + '</tbody></table></div>';
            }).join('');
        }
        return '<p class="crumbs">Home <span class="sep">&rsaquo;</span> Reference data ' +
            '<span class="sep">&rsaquo;</span> Cut types <span class="sep">&rsaquo;</span> ' +
            esc(t.code) + '</p>' +
            '<div class="pagehead"><div><h1>' + esc(t.name) + '</h1>' +
            '<p class="lead">' + esc(t.code) + ' &middot; version 4 &middot; family ' + esc(t.family) +
            '</p></div><div class="actions"><span class="access">Editable</span>' +
            '<button class="btn">Edit</button><button class="btn">Delete</button></div></div>' +
            '<div class="tabs"><span class="on">Details</span><span>Cuts</span><span>History</span></div>' +
            '<div class="card"><p class="sentence">' + esc(t.desc) + '</p>' +
            '<div class="facts">' +
            fact('Family', esc(t.family)) +
            fact('Repeats', esc(t.freq)) +
            fact('Authorisation', esc(t.auth)) +
            fact('Values', t.indicative ? 'Indicative' : 'Official') +
            fact('Resolution rule', '<span class="mono" style="word-break:break-all">' +
                esc(t.resolution) + '</span>') +
            fact('Retention', t.months + ' months &middot; ' + esc(t.dest)) +
            fact('Legal hold on take', t.hold ? 'Yes' : 'No') +
            fact('Order', String(t.order)) +
            '</div>' +
            '<p class="rule"><b>The rules are the type\u2019s.</b> A cut copies its type\u2019s ' +
            'authorisation and retention when it is taken, so a later change to the type does not move a ' +
            'body already fixed. The resolution rule is read from the type at the moment of the ' +
            'resolution, because a report must follow the rule in force when it runs.</p></div>' +
            '<div class="spacer"></div>' +
            '<p class="sentence"><b>The cuts of this type, grouped.</b> The group is the period one step ' +
            'above the type\u2019s frequency: a daily type reads by month, a monthly type by year, a ' +
            'yearly type as one group, and an on-demand type by day. ' + esc(t.name) + ' repeats ' +
            esc(t.freq) + ', so its cuts are grouped ' +
            (t.freq === 'daily' ? 'by month' : (t.freq === 'monthly' ? 'by year'
                : (t.freq === 'yearly' ? 'as one group' : 'by day'))) + '.</p>' +
            body +
            '<div class="gap"><b>Gap.</b> The type is a fixture. No lookup holds the rules, and nothing ' +
            'reads a type\u2019s retention when a cut is taken or archived.</div>';
    }

    /* ---------------------------------------------------------------- */
    /* Surfaces 9 and 10: the named cut times, as reference data.        */
    /* ---------------------------------------------------------------- */

    var CUT_TIMES = [
        { code: 'CUT-LONDON-1600', name: 'London close', time: '16:00', tz: 'Europe/London',
          centre: 'London', kinds: 'End of day, Independent verification',
          source: 'our convention', books: 3, pairs: 14, cuts: 8 },
        { code: 'CUT-LONDON-0800', name: 'London open', time: '08:00', tz: 'Europe/London',
          centre: 'London', kinds: 'Start of day', source: 'our convention', books: 3, pairs: 0, cuts: 3 },
        { code: 'CUT-NEWYORK-1700', name: 'New York close', time: '17:00', tz: 'America/New_York',
          centre: 'New York', kinds: 'End of day', source: 'our convention', books: 1, pairs: 6, cuts: 2 },
        { code: 'CUT-TOKYO-1500', name: 'Tokyo close', time: '15:00', tz: 'Asia/Tokyo',
          centre: 'Tokyo', kinds: 'End of day', source: 'our convention', books: 1, pairs: 4, cuts: 1 },
        { code: 'EXPIRY-TOKYO-1500', name: 'Tokyo expiry cut', time: '15:00', tz: 'Asia/Tokyo',
          centre: 'Tokyo', kinds: 'Option expiry', source: 'our convention', books: 0, pairs: 9, cuts: 0 },
        { code: 'EXPIRY-NEWYORK-1000', name: 'New York expiry cut', time: '10:00', tz: 'America/New_York',
          centre: 'New York', kinds: 'Option expiry', source: 'our convention', books: 0, pairs: 11, cuts: 0 }
    ];

    function surfaceTimes() {
        if (S.fcase === 'loading')
            return timesFrame('<div class="tblstate"><b>Loading&hellip;</b>Reading the cut times.</div>');
        if (S.fcase === 'error')
            return timesFrame('<div class="notice error"><b>The cut times could not be read.</b> ' +
                'refdata.v1.cut_times.list answered with an error. <button class="btn small">Retry</button></div>');
        var rows = CUT_TIMES.map(function (t) {
            return '<tr class="pick" data-time="' + t.code + '">' +
                '<td class="key">' + esc(t.code) + '<span class="sub">' + esc(t.name) + '</span></td>' +
                '<td class="mono nowrap">' + esc(t.time) + '</td>' +
                '<td class="mono">' + esc(t.tz) + '</td>' +
                '<td>' + esc(t.centre) + '</td>' +
                '<td class="dim">' + esc(t.kinds) + '</td>' +
                '<td class="num">' + t.books + '</td>' +
                '<td class="num">' + t.pairs + '</td></tr>';
        }).join('');
        return timesFrame('<div class="panel"><table class="rows"><thead><tr><th>Cut time</th>' +
            '<th>Time of day</th><th>Timezone</th><th>Centre</th><th>Kinds it serves</th>' +
            '<th>Books</th><th>Currency pairs</th></tr></thead><tbody>' + rows + '</tbody></table>' +
            '<div class="pager"><span>1\u2013' + CUT_TIMES.length + ' of ' + CUT_TIMES.length + '</span>' +
            '<span class="right">Page size <span class="dash">15</span></span></div></div>' +
            '<p class="sentence"><b>What a cut time is.</b> A label for a time of day, with the clock that ' +
            'reads it. The end of day kind reads the centre\u2019s close from here, and an option\u2019s expiry ' +
            'reads a cut code from the same list, which is the second sense of the word.</p>' +
            '<p class="rule"><b>Our convention, not a published fact.</b> The times on this page are ours. ' +
            'No public source we verified fixes the close of a firm\u2019s business day or an option\u2019s ' +
            'expiry instant, and the cluster records the same position.</p>' +
            '<div class="gap"><b>Gap.</b> No cut time table exists. ' +
            '<code>currency_pair.default_cut_code</code> is a field the pair\u2019s entity page plans and no ' +
            'column holds, and the option expiry reads a list nothing holds either.</div>');
    }

    function timesFrame(body) {
        return '<p class="crumbs">Home <span class="sep">&rsaquo;</span> Reference data ' +
            '<span class="sep">&rsaquo;</span> Cut times</p>' +
            '<div class="pagehead"><div><h1>Cut times</h1>' +
            '<p class="lead">The times of day a cut is fixed at, with the clock that reads each one.</p></div>' +
            '<div class="actions"><span class="access">Editable</span>' +
            '<button class="btn">Refresh</button><button class="btn">Import</button>' +
            '<button class="btn">Export</button><button class="btn primary">Add</button></div></div>' +
            '<div class="listtools"><div class="searchbox"><input placeholder="Search the code or the name">' +
            '</div><select><option>Centre: all</option><option>London</option><option>New York</option>' +
            '<option>Tokyo</option></select></div>' + body;
    }

    function surfaceTime() {
        var t = CUT_TIMES[0];
        if (S.fcase === 'error')
            return timesFrame('<div class="notice error"><b>The cut time could not be read.</b> ' +
                'refdata.v1.cut_times.get answered with an error. <button class="btn small">Retry</button></div>');
        return '<p class="crumbs">Home <span class="sep">&rsaquo;</span> Reference data ' +
            '<span class="sep">&rsaquo;</span> Cut times <span class="sep">&rsaquo;</span> ' +
            esc(t.code) + '</p>' +
            '<div class="pagehead"><div><h1>' + esc(t.name) + '</h1>' +
            '<p class="lead">' + esc(t.code) + ' &middot; version 3</p></div>' +
            '<div class="actions"><span class="access">Editable</span>' +
            '<button class="btn">Edit</button><button class="btn">Delete</button></div></div>' +
            '<div class="tabs"><span class="on">Details</span><span>Used by</span><span>History</span></div>' +
            '<div class="card">' +
            '<div class="facts">' +
            fact('Code', '<span class="mono">' + esc(t.code) + '</span>') +
            fact('Name', esc(t.name)) +
            fact('Time of day', '<span class="mono">' + esc(t.time) + '</span>') +
            fact('Timezone', '<span class="mono">' + esc(t.tz) + '</span>') +
            fact('Centre', esc(t.centre)) +
            fact('Kinds it serves', esc(t.kinds)) +
            fact('Source of the time', esc(t.source)) +
            fact('Daylight saving', 'Follows the timezone, so the instant moves and the name does not') +
            '</div>' +
            '<p class="sentence">A cut time fixes a time of day rather than an instant. The instant it ' +
            'produces depends on the date, because the clock moves twice a year, and the name stays the same.</p>' +
            '<h3>What uses it</h3>' +
            '<div class="panel"><table class="rows"><thead><tr><th>What</th><th>How it uses the cut time</th>' +
            '<th class="num">Count</th></tr></thead><tbody>' +
            '<tr><td class="key">Books</td><td>The close their end of day cut is fixed at</td>' +
            '<td class="num">' + t.books + '</td></tr>' +
            '<tr><td class="key">Currency pairs</td><td>The default cut code their options inherit</td>' +
            '<td class="num">' + t.pairs + '</td></tr>' +
            '<tr><td class="key">Cuts taken</td><td>The instant each one fixed, on this date</td>' +
            '<td class="num">' + t.cuts + '</td></tr>' +
            '</tbody></table></div>' +
            '<p class="rule">A cut time cannot be deleted while a book or a pair names it. The count is how ' +
            'a person answers that question before pressing Delete.</p>' +
            lastChanged('m.oduya', '2026-10-02T11:14:00Z', 'common.non_material_update') +
            '<div class="gap"><b>Gap.</b> No such entity exists. The row is drawn from the pair\u2019s planned ' +
            '<code>default_cut_code</code> and from the option-expiry page\u2019s description of the same row.</div>' +
            '</div>';
    }

    /* ---------------------------------------------------------------- */
    /* Render.                                                            */
    /* ---------------------------------------------------------------- */

    function render() {
        var area = 'Reporting';
        if (S.surface === 'times' || S.surface === 'time' ||
            S.surface === 'types' || S.surface === 'type') area = 'Reference data';
        document.getElementById('shell').innerHTML = shell(area);
        document.getElementById('bar').innerHTML = bar();
        var app = document.getElementById('app');
        switch (S.surface) {
        case 'reports': app.innerHTML = surfaceReports(); break;
        case 'report': app.innerHTML = surfaceReport(); break;
        case 'select': app.innerHTML = surfaceSelect(); break;
        case 'record': app.innerHTML = surfaceRecord(); break;
        case 'take': app.innerHTML = surfaceTake(); break;
        case 'run': app.innerHTML = surfaceRun(); break;
        case 'types': app.innerHTML = surfaceTypes(); break;
        case 'type': app.innerHTML = surfaceType(); break;
        case 'times': app.innerHTML = surfaceTimes(); break;
        case 'time': app.innerHTML = surfaceTime(); break;
        default: app.innerHTML = surfaceList();
        }
        window.scrollTo(0, 0);
    }

    document.addEventListener('click', function (e) {
        var go = e.target.closest('[data-go]');
        if (go) {
            e.preventDefault();
            location.search = go.getAttribute('data-go');
            return;
        }
        var cut = e.target.closest('[data-cut]');
        if (cut) {
            e.preventDefault();
            location.search = q({ surface: 'record', tab: 'body', cut: cut.getAttribute('data-cut'), fcase: '' });
            return;
        }
        var rp = e.target.closest('[data-report]');
        if (rp) {
            e.preventDefault();
            location.search = q({ surface: 'report', tab: 'definition', report: rp.getAttribute('data-report'),
                fcase: '' });
            return;
        }
        var sel = e.target.closest('[data-sel]');
        if (sel) {
            e.preventDefault();
            location.search = q({ surface: 'select', tab: 'definition', sel: sel.getAttribute('data-sel'),
                pin: '' });
            return;
        }
        var pc = e.target.closest('[data-pin-cut]');
        if (pc) {
            e.preventDefault();
            location.search = q({ surface: 'select', tab: 'definition',
                sel: 'EOD', pin: pc.getAttribute('data-pin-cut') });
            return;
        }
        var ty = e.target.closest('[data-type]');
        if (ty) {
            e.preventDefault();
            location.search = q({ surface: 'type', fcase: '', type: ty.getAttribute('data-type') });
            return;
        }
        var t = e.target.closest('[data-time]');
        if (t) {
            e.preventDefault();
            location.search = q({ surface: 'time', fcase: '' });
            return;
        }
        var k = e.target.closest('[data-kind]');
        if (k) {
            e.preventDefault();
            location.search = q({ surface: 'take', step: '1',
                fcase: k.getAttribute('data-kind') === 'FLASH' ? 'flash' : '' });
            return;
        }
        var r = e.target.closest('[data-run]');
        if (r) {
            e.preventDefault();
            location.search = q({ surface: 'run', fcase: '', verdict: 'reproduced' });
        }
    });

    render();
})();
</script>
</body>
</html>
