---
name: Shell recipe provenance
on:  # yamllint disable-line rule:truthy
  push:
    branches: ["main"]
    paths:
      - "projects/ores.shell/scripts/library/**"
      - "doc/recipes/shell/**"
      - "projects/ores.codegen/scripts/check_shell_recipe_sources.py"
      - "projects/ores.codegen/tests/test_check_shell_recipe_sources.py"
      - ".github/workflows/shell-recipe-provenance.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  # A recipe under scripts/library is the tangle of a document under
  # doc/recipes/shell, and its header names that document. Delete or rename the
  # document and leave the recipe, and the recipe survives as an orphan.
  # Nothing regenerates it, so it keeps the verbs and the arguments of the day
  # it was written, and replaying it against the live fleet fails on a command
  # or a signature that has since moved on. This job fails when a recipe has no
  # document behind it.
  recipe-provenance:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Check every shell recipe names a document that exists
        run: |
          python3 projects/ores.codegen/scripts/check_shell_recipe_sources.py
      - name: Install test dependencies
        run: |
          pip install --quiet pytest
      - name: Test the check
        run: |
          python3 -m pytest projects/ores.codegen/tests/test_check_shell_recipe_sources.py -q
