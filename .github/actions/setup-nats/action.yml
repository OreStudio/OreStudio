---
name: Setup NATS server
description: >-
  Unpack the vendored nats-server release and put it on PATH.

# Same setup on every CI platform: unpack the vendored nats-server release
# (external/nats, pinned v2.14.3) and put it on PATH, so every platform runs the
# same binary instead of its package manager's version -- no brew, no apt, no
# GitHub download.

runs:
  using: composite
  steps:
    - name: Setup NATS server
      if: runner.os != 'Windows'
      shell: bash
      run: ./build/scripts/setup_nats_server.sh

    - name: Setup NATS server
      if: runner.os == 'Windows'
      shell: pwsh
      run: ./build/scripts/setup_nats_server.ps1
