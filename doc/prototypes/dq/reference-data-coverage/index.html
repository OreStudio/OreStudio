<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reference data coverage journey prototype — ORE Studio</title>
<link rel="stylesheet" href="prototype.css">
</head>
<body>

<!--
  PROTOTYPE. Throwaway. Mock data, no backend, no build step.

  Is my reference data complete? The roster by level, the members of one
  bundle, the single reason a member is not ready, the preview of what a
  publish would write, and the same rows read again afterwards.

    ?bundle=<code>     the bundle whose members are drawn
                       (system_core, world, crypto, tenant_defaults,
                        party_essentials, risk_management)
    ?empty=1           a database nothing has published into
    ?preview=1         the preview panel open
    ?publish=1         a publish running, and its receipt
    ?history=1         the history panel open, which is always empty
    ?gaps=0            hide the notes on what the server does not serve

  Three of the six bundles carry mock members. The rest list their names and
  open no table, which is what a real screen would do before the coverage
  operation exists.
-->

<div class="proto-note">Prototype · mock data · reads no server</div>

<header class="top">
  <h1>Reference data coverage</h1>
  <span class="where" id="tenant"></span>
  <span class="spacer"></span>
  <span class="where" id="asof"></span>
</header>

<div class="layout">
  <nav class="roster" id="roster" aria-label="Bundles by level"></nav>
  <main class="detail" id="detail"></main>
</div>

<div class="proto-bar" id="proto-bar"></div>

<script src="prototype.js"></script>
</body>
</html>
