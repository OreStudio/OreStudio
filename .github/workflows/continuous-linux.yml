# yamllint disable rule:line-length
---
name: Continuous Linux

env:
  VCPKG_BINARY_SOURCES: 'clear;files,${{ github.workspace }}/vcpkg-cache,readwrite'
  SCCACHE_DIR: '${{ github.workspace }}/.sccache'

on:  # yamllint disable-line rule:truthy
  schedule:
    # The matrix is linux-clang debug and release only. The slower job ran in
    # 2h54m on the last green run (2026-09-08, run 34218351651), so three hours
    # is the tightest interval that does not queue a run behind its predecessor.
    # The relevance-guard below skips runs when no code changed.
    - cron: '0 */3 * * *'
  push:
    tags:
      - '*'
  workflow_dispatch:

jobs:
  guard:
    name: relevance-guard
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      should_build: ${{ steps.guard.outputs.should_build }}
    steps:
      - uses: ./.github/actions/relevance-guard
        id: guard

  image:
    name: ci-image-ref
    needs: guard
    if: needs.guard.outputs.should_build == 'true'
    # The build runs in the CI image that build/docker/ci describes. The tag
    # holds a hash of the image inputs, so the build takes the image of the
    # commit it builds. ci-image.yml publishes that tag when the inputs change
    # on main.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      ref: ${{ steps.ref.outputs.ref }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            build/docker/ci
          sparse-checkout-cone-mode: false

      - name: Name the image
        id: ref
        run: |
          ref="$(build/docker/ci/build.sh --image ghcr.io/orestudio/ores-ci --print-ref)"
          echo "ref=${ref}" >> "$GITHUB_OUTPUT"
          echo "Image: ${ref}"

  validate-sql:
    name: validate-sql-schema
    needs: guard
    if: needs.guard.outputs.should_build == 'true'
    # The validation needs no compiler and no database, so it runs beside the
    # build, not before it.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Validate SQL Schema
        run: |
          pip install --quiet pystache
          ./projects/ores.sql/utility/validate_schemas.sh

  build:
    needs: [guard, image]
    if: needs.guard.outputs.should_build == 'true'
    name: ${{matrix.family}}-${{matrix.compiler}}-${{matrix.buildtype}}-ninja
    concurrency:
      group: ci-${{github.ref}}-${{github.job}}-${{matrix.family}}-${{matrix.compiler}}-${{matrix.buildtype}}-ninja
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    # The image has the compilers, CMake, Node.js, PostgreSQL, valgrind and the
    # system packages, so the job installs none of them. vcpkg packages are not
    # in the image; the vcpkg binary cache restores them.
    container:
      image: ${{ needs.image.outputs.ref }}
    # A container job runs its steps with sh, but the runner runs them with
    # bash -e. The steps use [[ and process substitution, which sh does not
    # have. Plain "bash" would also add pipefail, which the steps do not expect.
    defaults:
      run:
        shell: bash -e {0}
    environment: CI
    # The repository's default token is read-only; deleting the sccache entry
    # before saving its replacement needs actions: write.
    permissions:
      contents: read
      actions: write
    strategy:
      fail-fast: false
      matrix:
        name: [linux-clang]
        buildtype: [debug, release]
        include:
          - name: linux-clang
            family: linux
            compiler: clang
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Trust the workspace
        # The container runs as root and the runner owns the workspace, so git
        # refuses the repository without this.
        run: git config --global --add safe.directory "${GITHUB_WORKSPACE}"

      - name: Point the caches at the container workspace
        # github.workspace holds the runner path, /home/runner/work, but the
        # container mounts the workspace at /__w. The cache steps save the
        # container path, so vcpkg and sccache must write there.
        run: |
          echo "VCPKG_BINARY_SOURCES=clear;files,${GITHUB_WORKSPACE}/vcpkg-cache,readwrite" >> "$GITHUB_ENV"
          echo "SCCACHE_DIR=${GITHUB_WORKSPACE}/.sccache" >> "$GITHUB_ENV"

      - name: Check every Boost header has a vcpkg port behind it
        # Boost arrives as per-library ports, so a new library compiles for
        # whoever added it and fails on a clean install with a missing header.
        # That turned every continuous build red at one translation unit on
        # 2026-09-28. This runs before the build so the failure names the port
        # in seconds instead of after twenty minutes of compiling.
        run: python3 build/scripts/check_boost_dependencies.py

      - name: Use clang for the C ports
        # The image has clang first on PATH. CC and CXX send the vcpkg C ports
        # to it too.
        if: ${{ matrix.compiler == 'clang' }}
        run: |
          llvm_major="$(sed -n 's/^LLVM_MAJOR=//p' build/docker/ci/versions.env)"
          echo "CC=/usr/lib/llvm-${llvm_major}/bin/clang" >> "$GITHUB_ENV"
          echo "CXX=/usr/lib/llvm-${llvm_major}/bin/clang++" >> "$GITHUB_ENV"

      - name: Restore sccache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.SCCACHE_DIR }}
          # Saves use a run-unique key, pruned to the newest entry per variant,
          # so restore by prefix and take that entry.
          #
          # The key is deliberately not scoped to this workflow. Continuous and
          # the Nightly Build compile the same variant with the same settings —
          # both pass code_coverage=1 on debug and neither passes anything on
          # release — so one entry serves both, and scoping it would store the
          # same objects twice. See nightly-linux.yml for the differences
          # between the two tiers and why none of them reaches a compile line.
          key: sccache-${{matrix.family}}-${{matrix.compiler}}-${{matrix.buildtype}}-ninja-${{ github.run_id }}
          restore-keys: |
            sccache-${{matrix.family}}-${{matrix.compiler}}-${{matrix.buildtype}}-ninja-

      - name: Ccache for gh actions
        uses: hendrikmuhs/ccache-action@v1.2.26
        with:
          variant: sccache
          key: ${{matrix.family}}-${{matrix.compiler}}-${{matrix.buildtype}}-ninja
          # The nightly workflow shares these entries and explains the budget.
          # Keep the two caps equal, or each workflow cuts the other's entry
          # down when it saves.
          max-size: ${{ matrix.buildtype == 'debug' && '4000M' || '1600M' }}
          save: false

      - uses: ./.github/actions/setup-postgres

      - uses: ./.github/actions/install-compass

      - uses: ./.github/actions/init-environment

      - uses: ./.github/actions/setup-nats

      - uses: ./.github/actions/start-nats

      - uses: ./.github/actions/create-database

      - name: Cache vcpkg binary packages
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/vcpkg-cache
          key: vcpkg-${{matrix.family}}-${{matrix.compiler}}-${{matrix.buildtype}}-ninja-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-${{matrix.family}}-${{matrix.compiler}}-${{matrix.buildtype}}-ninja-

      - name: run-vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          doNotCache: false

      - name: Run CTest workflow
        id: ctest
        # The job limit is 360 minutes. A job that reaches it is torn down about
        # thirty seconds later, which is nowhere near enough to upload a
        # multi-gigabyte compiler cache, so the cache steps below never finish.
        # Cap this step instead, leaving the rest of the job free for the cache
        # delete and save.
        timeout-minutes: 350
        run: |
          export CMAKE_BUILD_PARALLEL_LEVEL=$(nproc)
          export CTEST_PARALLEL_LEVEL=$(nproc)
          export PATH=${PATH}:/usr/sbin
          export ZIC=1
          export ORES_BUILD_PROVIDER="github"
          export ORES_BUILD_COMMIT="${GITHUB_SHA}"
          export ORES_BUILD_NUMBER="${GITHUB_RUN_NUMBER}"
          export ORES_BUILD_TIMESTAMP=`date "+%Y/%m/%d %H:%M:%S"`
          export preset=${{matrix.family}}-${{matrix.compiler}}-${{matrix.buildtype}}-ninja
          # Continuous proves the tree builds and the suites pass. The debug
          # build also collects coverage, so that Continuous and the Nightly
          # Build measure the same configuration. The release build of a tag
          # is the Linux package of that release, so only it runs cpack.
          export cmake_args="build_group=Continuous,preset=${preset}"
          if [[ "${{github.ref_type}}" != "tag" || "${{matrix.buildtype}}" != "release" ]]; then
              cmake_args="${cmake_args},package=0"
          fi
          if [[ "${{matrix.buildtype}}" == "debug" ]]; then
              cmake_args="${cmake_args},code_coverage=1,compress_debug_sections=1"
          fi
          df -h .
          du -sh .git llvm .sccache vcpkg-cache build/output "$RUNNER_TEMP" 2>/dev/null || true
          ctest -VV --preset ${preset} --script "CTest.cmake,${cmake_args}"

      - name: Check the script library dataset reproduces
        # The generator calls the shell the build above made, to parse every
        # script of ORE's library and derive its inputs; it fails when the
        # committed populate files differ from what it makes. It needs no
        # server, so it runs once the shell exists (step 5 of
        # external/ore/methodology.txt).
        run: |
          preset=${{matrix.family}}-${{matrix.compiler}}-${{matrix.buildtype}}-ninja
          python3 external/ore/tools/generate_script_library.py --check \
            --shell ./build/output/${preset}/publish/bin/ores.shell

      - name: Start the transaction pooler
        # The image carries pgbouncer, so the job installs nothing, as its
        # comment above promises. The configuration is generated from the
        # environment's own database users by the script the unit uses too.
        run: ./build/scripts/start_ci_pooler.sh start 6432

      - name: Run the database suite through the transaction pooler
        # The suite is the one that exercises the prepared statements directly.
        # It runs from the built binary because the test environment is baked
        # into CTestTestfile.cmake at configure time; the binary reads its
        # database from the environment, so the port is the only thing that has
        # to change. Cases that need a direct connection carry the direct tag.
        run: |
          preset=${{matrix.family}}-${{matrix.compiler}}-${{matrix.buildtype}}-ninja
          ORES_TEST_DB_HOST=127.0.0.1 ORES_TEST_DB_PORT=6432 \
            ./build/output/${preset}/publish/bin/ores.database.tests '~[direct]'

      - name: Stop the transaction pooler
        if: always()
        run: ./build/scripts/start_ci_pooler.sh stop

      - name: Upload the package of a tag
        if: ${{ github.ref_type == 'tag' && matrix.buildtype == 'release' }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{matrix.family}}-${{matrix.compiler}}-${{matrix.buildtype}}-ninja
          path: ./build/output/${{matrix.family}}-${{matrix.compiler}}-${{matrix.buildtype}}-ninja/packages/orestudio_*_amd64.deb
          if-no-files-found: error

      - name: Report disk usage after build
        if: ${{ always() && steps.ctest.outcome != 'skipped' }}
        run: |
          df -h .
          du -sh .git llvm .sccache vcpkg-cache build/output "$RUNNER_TEMP" 2>/dev/null || true

      - uses: ./.github/actions/save-sccache
        if: ${{ always() && steps.ctest.outcome != 'skipped' }}
        with:
          variant: ${{matrix.family}}-${{matrix.compiler}}-${{matrix.buildtype}}-ninja

  attach_package:
    name: Attach packages to the release
    needs: build
    # Attach what passed, so one failed build does not cost the others.
    if: ${{ !cancelled() && github.ref_type == 'tag' && needs.build.result != 'skipped' }}
    # A called workflow can only downgrade the token its caller passes, so the
    # caller grants what the attachment asks for. Without this line the platform
    # refuses the whole workflow at start, before any job runs.
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/attach-package.yml
    with:
      pattern: linux-*-release-ninja
