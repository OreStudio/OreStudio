<!--
  PROTOTYPE. Throwaway. Mock data, no backend, no build step, no fetch.

  Manage the conventions. This page owns the whole conventions interaction of a
  conventions configuration, and the two prototypes that used to repeat it hand
  the work here:

    doc/prototypes/reporting/create-a-report/            step 2 links here
    doc/prototypes/reporting/change-what-a-report-runs/  its conventions row
                                                         links here

  THE SCREEN IS A TABLE

  One row per convention kind, and the columns a person needs to decide which
  row to open: the kind, the name of the convention in use, what its terms say,
  and one button. The step-per-kind wizard that used to be here is gone. A table
  because the question "what does this report read?" is answered by scanning 25
  rows, not by walking 25 steps.

  A row holds the party's document for that kind. Today the database holds none
  for any party, so every row reads none and says what a run does instead: it
  falls back to the curated document for the kind. That is the state the screen
  handles first, and the page says so above the table.

  NO NAME IS STORED, SO THE NAME IS DERIVED

  No convention table carries a name and none carries a description. Both are
  read off the terms:

    index-based   named by its index, e.g. AED-EIBORON
    terms-based   named by its calendar, convention, day count and settlement
                  days, e.g. AED · ModifiedFollowing · ACT/360 · 2d
    frequency     added where the kind states one, because two swap rows differ
                  only in it
    identifier    a kind whose table carries no calendar and no day count is
                  named by the identifier terms it does carry, e.g. an FX option
                  by its FX convention, its delta type and its switch tenor

  The fields differ by kind, because the tables do: FRA carries an index and
  nothing else, deposit carries index_based and a full accrual terms set, FX
  option carries no calendar at all, commodity future carries 51 term columns.
  The rule is therefore stated per kind, and the table names the fields it read
  under every name. The pages state the fact that breaks the idea of a name as
  an identity: the curated swap table holds 320 rows stating 201 distinct sets
  of terms, so a derived name repeats.

  THREE PAGES, THREE JOBS

    index.html                     the table, one row per kind
    index.html?kind=swap           one kind: its current document, the
                                   alternatives read from the curated table,
                                   which one is the default, and the way to
                                   author a new one
    index.html?screen=create       authoring, which leaves the report flow

  The alternatives block on a kind's page has three readings behind
  ?variant=A|B|C. The rest of that page is identical across the three, so a
  reader compares one block:

    A  described list   every alternative with its derived name and its terms in
                        words, the one in use marked
    B  compare          the document in use beside a candidate, field by field,
                        with the fields that differ marked; for the swap family
                        of 320 rows, where a list cannot be read
    C  search, filter   a search over the derived name and the description, and
                        filters for the kinds whose curated table is long

  REACHABLE STATES, all behind the bar at the foot of the page

    ?state=acme       no document anywhere: every row reads none. The database
                      state.
    ?state=several    a fixture: swap holds two documents, CDS one, deposit one
                      that matches the marked default, and every other kind
                      still none
    ?state=change     the fixture above plus a pick that has not been written

  ?kind=<code> opens a kind, ?cand=<row key> picks the candidate variant B
  compares, ?from=create-a-report|change-what-a-report-runs decides where the
  back link goes, and ?seed=<row key> starts the create form from a curated row.

  WHAT THE PAGE REFUSES TO INVENT

  No default is modelled anywhere, so the default mark on a kind's page is a
  fixture and says so, and the page states where a real one would have to live.
  No operation is called. The create route states the write it would make and
  exactly what was checked about that write, and it claims nothing about whether
  the write works.
-->
