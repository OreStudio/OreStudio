<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>See who changed a curve prototype — Market data journeys</title>
<style>
:root{color-scheme:dark;--bg:#121214;--panel:#1a1a1e;--panel-2:#26262b;--line:#30363d;--line-soft:#21262d;--ink:#e3e3e6;--ink-dim:#a1a1aa;--ink-faint:#71717a;--accent:#58a6ff;--accent-dim:#21262d;--ok:#3fb950;--warn:#d29922;--bad:#f85149;--radius:.5rem;--mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink)}
body{margin:0;font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;padding:2.5rem 1.5rem 8rem}
h1,h2,h3{margin:0;font-weight:600}h1{font-size:1.15rem}h2{font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-dim)}
p{margin:0}ul{margin:0;padding:0;list-style:none}a{color:var(--accent);text-decoration:none}
button,input,select{font:inherit;color:inherit}button{cursor:pointer}
.mono{font-family:var(--mono)}.muted{color:var(--ink-dim)}.faint{color:var(--ink-faint)}
.wrap{max-width:1080px;margin:0 auto;display:grid;gap:14px}
.top{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px;display:grid;gap:10px}
.panel>h2{border-bottom:1px solid var(--line-soft);padding-bottom:6px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.field{display:grid;gap:4px;min-width:170px}.field label{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-faint)}
.field .value,.field select,.field input{background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:6px 8px}
table{width:100%;border-collapse:collapse;font-size:.86rem}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line-soft)}
th{font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-faint);font-weight:600}
td.num{text-align:right;font-family:var(--mono)}
.btn{background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:7px 12px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#0d1117;font-weight:600}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.tag{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:1px 8px;font-size:.72rem;color:var(--ink-dim)}
.tag.ok{color:var(--ok);border-color:#1f4d29}.tag.bad{color:var(--bad);border-color:#5a2320}.tag.warn{color:var(--warn);border-color:#4a3a17}
.notice{border:1px dashed var(--line);border-radius:var(--radius);padding:10px 12px;color:var(--ink-dim);background:#161619}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:820px){.grid2{grid-template-columns:1fr}}
.proto-note{position:fixed;top:0;left:0;right:0;z-index:60;padding:6px 14px;background:repeating-linear-gradient(45deg,#2a2113,#2a2113 10px,#241d11 10px,#241d11 20px);border-bottom:1px solid #4a3a17;color:var(--warn);font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.proto-bar{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:60;display:flex;gap:2px;align-items:center;padding:5px 7px;background:#0b0e13;border:1px solid var(--line);border-radius:999px;box-shadow:0 8px 30px rgba(0,0,0,.6);font-size:12px;max-width:95vw;flex-wrap:wrap;justify-content:center}
.proto-bar button{background:none;border:none;color:var(--ink-dim);padding:6px 10px;border-radius:999px}
.proto-bar button:hover{background:var(--panel-2);color:var(--ink)}.proto-bar button.on{background:var(--accent-dim);color:var(--ink)}
.proto-bar .label{padding:0 8px}.proto-bar .sep{color:var(--line)}
.urlbtn{display:inline-flex;align-items:baseline;gap:6px;max-width:100%;background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:3px 8px;color:var(--ink);text-align:left}
.urlbtn:hover{border-color:var(--accent)}
.urlbtn .mono{overflow-wrap:anywhere}
.urlbtn .edit{color:var(--accent);font-size:10px;letter-spacing:.06em;text-transform:uppercase}
.oresmd-overlay{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:18px}
.oresmd-frame{width:min(1120px,96vw);height:min(840px,92vh);border:1px solid var(--line);border-radius:var(--radius);background:var(--bg)}
</style>
</head>
<body>
<table class="prototype-links" style="width:100%;border-collapse:collapse;margin:0;font:500 13px/1.6 Inter,system-ui,sans-serif;color:inherit;background:rgba(127,127,127,.12);border-bottom:1px solid rgba(127,127,127,.35)">
<tr><th style="text-align:left;padding:.4rem .8rem;font-weight:600;white-space:nowrap;border-right:1px solid rgba(127,127,127,.35)">Prototype</th><td style="padding:.4rem .8rem;width:100%"><a href="index.html" style="color:inherit">this prototype</a></td></tr>
<tr><th style="text-align:left;padding:.4rem .8rem;font-weight:600;white-space:nowrap;border-right:1px solid rgba(127,127,127,.35);border-top:1px solid rgba(127,127,127,.35)">Gemini review</th><td class="prototype-review" style="padding:.4rem .8rem;border-top:1px solid rgba(127,127,127,.35)">none</td></tr>
</table>


<!--
  PROTOTYPE. Throwaway. Mock data, no backend, no build step, no session.

  The auditor's "See who changed a curve, and when" screen
  (doc/knowledge/journeys/market_data/journey_see-who-changed-a-curve.org):
  the series and its provenance at the top, the blueprint changes, the builds,
  the per-point provenance and the manual adjustments in the middle, and the
  approvals and publishes at the bottom.

  Variants with ?variant=a|b|c: a is one merged timeline, b is one table per
  kind, c is a two-panel compare of one version against the one before.
  ?state=rich|empty|manual switches the trail. Nothing here calls a service.
-->

<div class="proto-note" id="note"></div>
<div class="wrap" id="app"></div>
<div class="proto-bar" id="bar"></div>

<script>
const params = new URLSearchParams(location.search);
const variant = params.get('variant') || 'a';
const state = params.get('state') || 'rich';

const series = {uri:'oresmd://ir/USD?type=series&instrument=ir_swap', subclass:'yield',
  derivation:'IR_CURVE_BOOTSTRAP', config:'...a41f (v3)', modifiedBy:'a.reyes', performedBy:'a.reyes',
  reason:'curve.recalibrate', commentary:'Fed repricing'};

const blueprint = [
  {version:'v3', at:'2026-10-06 13:40', actor:'a.reyes', field:'derivation_config_version', from:'2', to:'3'},
  {version:'v2', at:'2026-10-05 09:12', actor:'m.oduya', field:'derivation_config_id', from:'...9b02', to:'...a41f'},
  {version:'v1', at:'2026-10-04 08:05', actor:'j.silva', field:'derivation_config_version', from:'1', to:'2'}
];
const builds = [
  {at:'2026-10-06 14:00', source:'ir_curve.usd', points:34, actor:'—'},
  {at:'2026-10-06 13:30', source:'ir_curve.usd', points:34, actor:'—'},
  {at:'2026-10-06 11:00', source:'manual', points:1, actor:'j.silva'},
  {at:'2026-10-06 09:00', source:'bloomberg', points:12, actor:'—'}
];
const manual = [
  {node:'fwd_start=0D&tenor=2Y', value:4.4050, source:'manual', reason:'curve.trader_override', actor:'j.silva', at:'2026-10-06 11:00'},
  {node:'fwd_start=0D&tenor=5Y', value:4.2500, source:'manual', reason:'—', actor:'a.reyes', at:'2026-10-06 10:20'}
];
const lineage = {config:'...a41f (v3)', asof:'2026-10-06 13:58', sourceSeries:'raw_ir_usd_swap_grid', node:'fwd_start=0D&tenor=2Y'};
const approvals = state === 'empty' ? [] :
  [{state:'approved', by:'a.reyes', at:'2026-10-06 16:58', decidedBy:'m.oduya', decidedAt:'2026-10-06 17:05', decision:'approve', comment:'Stale pillar confirmed.'}];
const publishes = state === 'empty' ? [] :
  [{version:'v4', by:'m.oduya', at:'2026-10-06 17:00'}, {version:'v3', by:'a.reyes', at:'2026-10-05 09:30'}];
const compare = {
  left:{version:'v3', at:'2026-10-06 13:40', by:'a.reyes', performed:'a.reyes', config:'...a41f', configVersion:'3', reason:'curve.recalibrate', commentary:'Fed repricing'},
  right:{version:'v2', at:'2026-10-05 09:12', by:'m.oduya', performed:'m.oduya', config:'...9b02', configVersion:'2', reason:'curve.recalibrate', commentary:'roll to the new config'},
  diff:[['derivation_config_version','2','3'], ['derivation_config_id','...9b02','...a41f'], ['change_commentary','roll to the new config','Fed repricing']]
};

const tag = (t, k) => `<span class="tag ${k || ''}">${t}</span>`;
const events = [
  ...blueprint.map(r => ({at:r.at, kind:'blueprint', actor:r.actor, head:`${r.version} ${r.field}`, detail:`${r.from} -> ${r.to}`})),
  ...builds.map(b => ({at:b.at, kind:'build', actor:b.actor, head:`${b.source} build`, detail:`${b.points} points`})),
  ...manual.map(m => ({at:m.at, kind:'manual', actor:m.actor, head:m.node, detail:`${m.value.toFixed(4)} ${m.reason}`})),
  ...approvals.map(a => ({at:a.at, kind:'approval', actor:a.by, head:`${a.state} request`, detail:`${a.decidedBy} ${a.decision} - ${a.comment}`})),
  ...publishes.map(p => ({at:p.at, kind:'publish', actor:p.by, head:`published ${p.version}`, detail:'no publish subject exists'}))
].sort((x, y) => (x.at < y.at ? 1 : -1));

function urlButton(url){
  return `<button class="urlbtn" type="button" data-url="${url}" title="Edit in the oresmd URL editor">`+
         `<span class="mono">${url}</span><span class="edit">edit</span></button>`;
}
function openOresmdEditor(url, host){
  const ov=document.createElement('div'); ov.className='oresmd-overlay';
  const f=document.createElement('iframe'); f.className='oresmd-frame'; f.title='oresmd URL editor';
  f.src='../oresmd-url-editor/index.html?embed=1&url='+encodeURIComponent(url||'');
  ov.appendChild(f); document.body.appendChild(ov);
  function close(){ window.removeEventListener('message', onMsg); document.removeEventListener('keydown', onKey); ov.remove(); }
  function onMsg(e){ if(e.data && e.data.type==='oresmd-url'){ host.dataset.url=e.data.url; const m=host.querySelector('.mono'); if(m) m.textContent=e.data.url; close(); } }
  function onKey(e){ if(e.key==='Escape') close(); }
  window.addEventListener('message', onMsg); document.addEventListener('keydown', onKey);
  ov.addEventListener('click', e=>{ if(e.target===ov) close(); });
}
document.addEventListener('click', e=>{
  const b=e.target.closest('.urlbtn'); if(!b) return;
  openOresmdEditor(b.dataset.url||'', b);
});
function header(){
  return `
  <div class="top">
    <h1>Curve trail: ${urlButton(series.uri)}</h1>
    ${state === 'empty' ? tag('never published', 'warn') : tag('trail read', 'ok')}
    <a style="margin-left:auto" href="../../../knowledge/journeys/market_data/journey_see-who-changed-a-curve.html">the journey &rarr;</a>
  </div>
  <div class="panel">
    <h2>Series and provenance</h2>
    <div class="row">
      <div class="field"><label>Subclass</label><div class="value">${series.subclass}</div></div>
      <div class="field"><label>Derivation</label><div class="value">${series.derivation}</div></div>
      <div class="field"><label>Config</label><div class="value mono">${series.config}</div></div>
      <div class="field"><label>Modified by</label><div class="value">${series.modifiedBy}</div></div>
      <div class="field"><label>Performed by</label><div class="value">${series.performedBy}</div></div>
      <div class="field"><label>Change reason</label><div class="value mono">${series.reason}</div></div>
      <div class="field" style="flex:1"><label>Commentary</label><div class="value">${series.commentary}</div></div>
    </div>
    <div class="notice">The series, the lineage and the feed binding are versioned, so each carries an actor per version. Observation rows are not, so a build has no actor.</div>
  </div>`;
}

function blueprintTable(){
  return `<table><thead><tr><th>Version</th><th>When</th><th>Actor</th><th>Field</th><th>From</th><th>To</th></tr></thead><tbody>
    ${blueprint.map(r => `<tr><td class="mono">${r.version}</td><td class="mono">${r.at}</td><td>${r.actor}</td><td class="mono">${r.field}</td><td class="faint">${r.from}</td><td>${r.to}</td></tr>`).join('')}
  </tbody></table>`;
}
function buildsTable(){
  return `<table><thead><tr><th>Observation time</th><th>Source</th><th class="num">Points</th><th>Actor</th></tr></thead><tbody>
    ${builds.map(b => `<tr><td class="mono">${b.at}</td><td>${b.source === 'manual' ? tag('manual', 'warn') : b.source}</td><td class="num">${b.points}</td><td class="faint">${b.actor}</td></tr>`).join('')}
  </tbody></table>`;
}
function manualTable(){
  return `<table><thead><tr><th>Node</th><th class="num">Value</th><th>Source</th><th>Reason</th><th>Written by</th><th>When</th></tr></thead><tbody>
    ${manual.map(m => `<tr><td class="mono">${m.node}</td><td class="num">${m.value.toFixed(4)}</td><td>${m.source}</td><td class="mono">${m.reason}</td><td>${m.actor}</td><td class="mono">${m.at}</td></tr>`).join('')}
  </tbody></table>
  <div class="notice">No column marks a point manual, so this panel treats a source that names no producer channel as manual. The observation row keeps no actor, so the writer is read from the write's change reason.</div>`;
}
function approvalsTable(){
  if (!approvals.length) return `<div class="notice">No market-data approval kind is seeded (iam.role_grant is the only one), so no request can name this object. The panel is empty.</div>`;
  return `<table><thead><tr><th>State</th><th>Requested by</th><th>Requested at</th><th>Decided by</th><th>Decided at</th><th>Decision</th></tr></thead><tbody>
    ${approvals.map(a => `<tr><td>${tag(a.state, 'ok')}</td><td>${a.by}</td><td class="mono">${a.at}</td><td>${a.decidedBy}</td><td class="mono">${a.decidedAt}</td><td>${a.decision} - ${a.comment}</td></tr>`).join('')}
  </tbody></table>`;
}
function publishesTable(){
  if (!publishes.length) return `<div class="notice">No publish operation exists, so the trail holds no publish acts. This panel is empty by construction.</div>`;
  return `<table><thead><tr><th>Published version</th><th>Published by</th><th>Published at</th></tr></thead><tbody>
    ${publishes.map(p => `<tr><td class="mono">${p.version}</td><td>${p.by}</td><td class="mono">${p.at}</td></tr>`).join('')}
  </tbody></table>
  <div class="notice">No publish subject exists; these rows are the design target, not a read the server answers today.</div>`;
}
function lineagePanel(){
  return `
  <div class="panel">
    <h2>Per-point provenance</h2>
    <div class="row">
      <div class="field"><label>Point</label><div class="value mono">${lineage.node}</div></div>
      <div class="field"><label>Derivation config</label><div class="value mono">${lineage.config}</div></div>
      <div class="field"><label>Source as-of</label><div class="value mono">${lineage.asof}</div></div>
      <div class="field"><label>Source series</label><div class="value mono">${lineage.sourceSeries}</div></div>
    </div>
    <div class="notice">Only a derived point has a lineage row. The lineage read takes the row's id, not the observation, so the screen matches the rest by hand.</div>
  </div>`;
}

function timeline(){
  return `
  <div class="panel">
    <h2>Merged timeline (newest first)</h2>
    <table><thead><tr><th>When</th><th>Kind</th><th>Actor</th><th>Object</th><th>Detail</th></tr></thead><tbody>
    ${events.map(e => `<tr><td class="mono">${e.at}</td><td>${tag(e.kind, e.kind === 'publish' ? 'warn' : '')}</td><td>${e.actor}</td><td class="mono">${e.head}</td><td class="muted">${e.detail}</td></tr>`).join('')}
    </tbody></table>
    <div class="notice">One timeline is the shortest read, but each kind carries a different actor and lifetime; the merged view hides which rows the server can answer.</div>
  </div>`;
}

function perKind(){
  const panel = (title, body) => `<div class="panel"><h2>${title}</h2>${body}</div>`;
  return panel('Blueprint changes', blueprintTable()) + panel('Builds', buildsTable()) +
    panel('Manual adjustments', manualTable()) + panel('Approvals', approvalsTable()) + panel('Publishes', publishesTable());
}

function comparePanel(){
  const side = (v, label, kind) => `
  <div class="panel">
    <h2>${label} ${kind}</h2>
    <table><tbody>
      <tr><td>When</td><td class="mono">${v.at}</td></tr>
      <tr><td>Modified by</td><td>${v.by}</td></tr>
      <tr><td>Performed by</td><td>${v.performed}</td></tr>
      <tr><td>Config</td><td class="mono">${v.config} (v${v.configVersion})</td></tr>
      <tr><td>Change reason</td><td class="mono">${v.reason}</td></tr>
      <tr><td>Commentary</td><td>${v.commentary}</td></tr>
    </tbody></table>
  </div>`;
  return `
  <div class="grid2">${side(compare.left, 'Selected version', tag(compare.left.version, 'ok'))}${side(compare.right, 'Previous version', tag(compare.right.version, ''))}</div>
  <div class="panel">
    <h2>Field-level difference</h2>
    <table><thead><tr><th>Field</th><th>${compare.right.version}</th><th>${compare.left.version}</th><th>Change</th></tr></thead><tbody>
    ${compare.diff.map(d => `<tr><td class="mono">${d[0]}</td><td class="faint">${d[1]}</td><td>${d[2]}</td><td>${tag('changed', 'warn')}</td></tr>`).join('')}
    </tbody></table>
    <div class="notice">The field diff exists for the series row. It does not exist for a point, because market_observation registers no history provider.</div>
  </div>`;
}

function render(){
  const app = document.getElementById('app');
  let body;
  if (variant === 'b') body = perKind();
  else if (variant === 'c') body = comparePanel();
  else body = timeline();
  app.innerHTML = header() + body + (state === 'manual' ? manualStateNote() : '') + lineagePanel();
  document.getElementById('note').textContent = `Prototype · curve trail · variant ${variant.toUpperCase()} · trail: ${state} · every row names its actor and time where the server keeps one`;
  document.getElementById('bar').innerHTML =
    `<span class="label">Variant</span>` +
    ['a','b','c'].map(v => `<button data-v="${v}" class="${v===variant?'on':''}">${v.toUpperCase()}</button>`).join('') +
    `<span class="sep">|</span><span class="label">Trail</span>` +
    ['rich','empty','manual'].map(s => `<button data-s="${s}" class="${s===state?'on':''}">${s}</button>`).join('');
  document.querySelectorAll('#bar [data-v]').forEach(b => b.onclick = () => set('variant', b.dataset.v));
  document.querySelectorAll('#bar [data-s]').forEach(b => b.onclick = () => set('state', b.dataset.s));
}
function manualStateNote(){
  return `
  <div class="panel">
    <h2>Manual point and its actor</h2>
    <p>fwd_start=0D&amp;tenor=2Y at 4.4050 was written by <a href="#">j.silva</a> at 2026-10-06 11:00 under reason <span class="mono">curve.trader_override</span>.</p>
    <div class="notice">${tag('inferred', 'warn')} market_observation carries no version and no actor, so the writer is inferred from the write's change reason and the source string. The screen says so rather than claiming a version.</div>
  </div>`;
}
function set(k, v){ const p = new URLSearchParams(location.search); p.set(k, v); location.search = p.toString(); }
render();
</script>
</body>
</html>
