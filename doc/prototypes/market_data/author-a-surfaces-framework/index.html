<!--
  PROTOTYPE. Throwaway. Mock data, no backend, no build step, no session.

  The "Author a surface's framework" screen
  (doc/knowledge/journeys/market_data/journey_author-a-surfaces-framework.org):
  the two axes at the top, the grid and the quoting convention that read from
  them in the middle, and the interpolation, the extrapolation and the
  parametric model at the bottom, so the person reads the shape before the
  maths. No surface model exists, so nothing on this page is written.

  The design question is the axis definition. Variants with ?variant=a|b|c:
  a is two label ladders, b is the full grid preview, c is a
  convention-first form. ?state=proposed|nostrike switches the mock: nostrike
  is a surface with no strike-label vocabulary defined, so no label can be
  validated or ordered. ?smile=3|5|rrbf chooses the smile point set — a
  3-point smile, a 5-point smile, or the ATM/RR/BF combination — and that
  choice decides the second axis and how many columns the grid has.
  ?repr=delta|rrbf|strike|sabr|svi chooses the representation the same quotes
  are read in, so the screen can argue a reparameterisation as a change of
  axes rather than a change of numbers. Nothing reads a service.

  The smile point set comes before the grid, and so does the delta: the smile
  panel names each point's delta, the convention that resolves it and the
  strike it lands on, because a 25-delta point is a different strike under
  forward, spot or premium-adjusted delta. A surface cannot be read back
  unless both the set and the convention are stored.

  The framework plot states the shape the axes allow before any number exists.
  A PC.heat draws the declared grid: expiry rows by the chosen smile columns,
  shaded where the framework can name both, empty where it cannot. Two PC.bars
  draw the ladders that decide that grid, expiry spacing and delta order.
-->

<div class="proto-note" id="note"></div>
<div class="wrap" id="app"></div>
<div class="proto-bar" id="bar"></div>

<script>
const params = new URLSearchParams(location.search);
const variant = params.get('variant') || 'a';
const state = params.get('state') || 'proposed';

const expiries = [
  {label:'1M',  kind:'tenor', date:'2026-11-06', dayCount:'A365'},
  {label:'3M',  kind:'tenor', date:'2027-01-06', dayCount:'A365'},
  {label:'6M',  kind:'tenor', date:'2027-04-06', dayCount:'A365'},
  {label:'1Y',  kind:'tenor', date:'2027-10-06', dayCount:'A365'},
  {label:'2Y',  kind:'tenor', date:'2028-10-06', dayCount:'A365'},
  {label:'5Y',  kind:'IMM',   date:'2031-12-17', dayCount:'A365'},
  {label:'10Y', kind:'IMM',   date:'2036-12-17', dayCount:'A365'},
  {label:'30Y', kind:'IMM',   date:'2056-12-17', dayCount:'A365'}
];
const quoteLabels = [
  {label:'ATM',  kind:'ATM',           order:0},
  {label:'25RR', kind:'risk reversal', order:1},
  {label:'25BF', kind:'butterfly',     order:2},
  {label:'10RR', kind:'risk reversal', order:3},
  {label:'10BF', kind:'butterfly',     order:4}
];
// Decoded from the oresmd URIs when no vocabulary exists: text, no order.
const rawLabels = ['25BF','ATM','10RR','25RR','10BF'];

// Volatility points in percent; null is a cell the series holds no point for.
const grid = [
  [22.6, -1.4, 0.6, -2.8, 1.1],
  [22.1, -1.5, 0.7, -3.0, 1.2],
  [21.8, -1.6, 0.8, -3.1, 1.3],
  [21.4, -1.7, 0.8, -3.3, 1.4],
  [20.7, -1.8, 0.9, -3.4, 1.5],
  [19.8, -2.0, 1.0, -3.7, 1.6],
  [18.9, -2.2, 1.1, null, null],
  [null, null, 1.2, null, 1.8]
];
const quoted = grid.flat().filter(v => v !== null).length;
const missing = grid.flat().length - quoted;
const noVocab = state === 'nostrike';

// The smile is a choice before it is a grid: a 3-point smile (25P/ATM/25C), a
// 5-point smile (the 10s and the 25s), or the ATM/RR/BF combination the points
// arrive as. The chosen set is the second axis.
const smile = params.get('smile') || '5';
const repr = params.get('repr') || 'delta';
const SMILE_SETS = {
  '3': {name:'3-point smile', points:[
    {label:'25P', side:'put',  delta:25, x:-1},
    {label:'ATM', side:'atm',  delta:0,  x:0},
    {label:'25C', side:'call', delta:25, x:1}]},
  '5': {name:'5-point smile', points:[
    {label:'10P', side:'put',  delta:10, x:-2},
    {label:'25P', side:'put',  delta:25, x:-1},
    {label:'ATM', side:'atm',  delta:0,  x:0},
    {label:'25C', side:'call', delta:25, x:1},
    {label:'10C', side:'call', delta:10, x:2}]},
  'rrbf': {name:'ATM / RR / BF combination', combination:true, points:[
    {label:'ATM',  side:'atm', delta:0,  x:0},
    {label:'25RR', side:'rr',  delta:25, x:-1},
    {label:'25BF', side:'bf',  delta:25, x:0},
    {label:'10RR', side:'rr',  delta:10, x:-2},
    {label:'10BF', side:'bf',  delta:10, x:0}]}
};
const SET = SMILE_SETS[smile] || SMILE_SETS['5'];
const REPRS = {
  delta:'delta ladder (3 or 5 points)',
  rrbf:'ATM / RR / BF combination',
  strike:'absolute strike ladder',
  sabr:'SABR parameters',
  svi:'SVI parameters'
};
// The ATM level per expiry, and a skewed smile over the moneyness step x.
const ATM_VOL = [22.6, 22.1, 21.8, 21.4, 20.7, 19.8, 18.9, 18.5];
const SMILE_SKEW = -0.55, SMILE_CURV = 0.45;
function smileVol(i, x){ return ATM_VOL[i] + SMILE_SKEW * x + SMILE_CURV * x * x; }
// One point per (expiry row, column): the chosen delta smile, or the stored
// combination grid when the ATM/RR/BF set is in force.
function pointValue(i, j){
  if (noVocab) return null;
  if (SET.combination) return grid[i][j] == null ? null : grid[i][j];
  return smileVol(i, SET.points[j].x);
}
// The delta the point names, as a call delta: ATM sits at 0.50, so a 25-delta
// put and call sit at 0.75 and 0.25, and a 10-delta at 0.90 and 0.10.
function callDelta(pt){
  if (pt.side === 'atm') return 0.5;
  if (pt.side === 'put') return 1 - pt.delta / 100;
  return pt.delta / 100;
}

function urlButton(url){
  return `<button class="urlbtn" type="button" data-url="${url}" title="Edit in the oresmd URL editor">`+
         `<span class="mono">${url}</span><span class="edit">edit</span></button>`;
}
function openOresmdEditor(url, host){
  const ov=document.createElement('div'); ov.className='oresmd-overlay';
  const f=document.createElement('iframe'); f.className='oresmd-frame'; f.title='oresmd URL editor';
  f.src='../oresmd-url-editor/index.html?embed=1&url='+encodeURIComponent(url||'');
  ov.appendChild(f); document.body.appendChild(ov);
  function close(){ window.removeEventListener('message', onMsg); document.removeEventListener('keydown', onKey); ov.remove(); }
  function onMsg(e){ if(e.data && e.data.type==='oresmd-url'){ host.dataset.url=e.data.url; const m=host.querySelector('.mono'); if(m) m.textContent=e.data.url; close(); } }
  function onKey(e){ if(e.key==='Escape') close(); }
  window.addEventListener('message', onMsg); document.addEventListener('keydown', onKey);
  ov.addEventListener('click', e=>{ if(e.target===ov) close(); });
}
document.addEventListener('click', e=>{
  const b=e.target.closest('.urlbtn'); if(!b) return;
  openOresmdEditor(b.dataset.url||'', b);
});
function tag(text, kind){ return `<span class="tag ${kind||''}">${text}</span>`; }
function vol(v){ return v === null ? '—' : v.toFixed(1); }

function header(){
  return `
  <div class="top">
    <h1>Surface framework: USD / 5Y swaption (proposed)</h1>
    <span class="muted">candidate · no framework stored</span>
    <a style="margin-left:auto" href="../../../knowledge/journeys/market_data/journey_author-a-surfaces-framework.html">the journey &rarr;</a>
  </div>
  <div class="panel">
    <h2>Series and identity</h2>
    <div class="row">
      <div class="field"><label>Asset class</label><div class="value">rates</div></div>
      <div class="field"><label>Series subclass</label><div class="value">volatility</div></div>
      <div class="field" style="flex:1"><label>Volatility series (oresmd URI)</label><div class="value mono">${urlButton('oresmd://vol/USD?type=surface&amp;instrument=swaption')}</div></div>
      <div class="field"><label>Framework stored</label><div class="value">${tag('no','bad')}</div></div>
    </div>
    <div class="notice">No surface model is stored today. This page states the framework the desk needs; the cells below are read from the series' points.</div>
  </div>`;
}

function ladders(){
  const right = frameworkCols();
  return `
  <div class="grid2">
    <div class="panel">
      <h2>Expiry axis — tenor ladder</h2>
      <table><thead><tr><th>#</th><th>Tenor</th><th>Date kind</th><th>Expiry date</th></tr></thead>
      <tbody>${expiries.map((e, i) => `<tr><td class="mono">${i}</td><td class="mono">${e.label}</td><td class="muted">${e.kind}</td><td class="faint">${e.date}</td></tr>`).join('')}</tbody></table>
      <div class="row"><button class="btn" data-add="expiry">Add expiry</button><span class="faint">Tenor codes come from the reference list.</span></div>
    </div>
    <div class="panel">
      <h2>Strike or delta axis — label ladder</h2>
      ${noVocab ? `<div class="notice" style="border-color:#5a2320">${tag('no strike-label vocabulary','bad')} The labels below are the text decoded from the point URIs. Nothing names them, so the screen can neither validate nor order them.</div>` : ''}
      <table><thead><tr><th>#</th><th>Label</th><th>Kind</th><th>Order</th></tr></thead>
      <tbody>${right.map((l, i) => `<tr><td class="mono">${i}</td><td class="mono">${l.label}</td><td class="muted">${l.kind}</td><td>${noVocab ? tag('unknown','warn') : l.order}</td></tr>`).join('')}</tbody></table>
      <div class="row"><button class="btn" data-add="label">Add label</button><span class="faint">Labels are free text inside a URI today.</span></div>
    </div>
  </div>`;
}

function gridPreview(){
  if(noVocab) return `
  <div class="panel">
    <h2>Grid preview</h2>
    <div class="notice" style="border-color:#5a2320">${tag('no grid','bad')} The second axis has no vocabulary, so a cell cannot be named. ${quoted} points carry a decodable label, but the axis order is unknown and the 40 cells cannot be laid out.</div>
  </div>`;
  const cols = frameworkCols();
  return `
  <div class="panel">
    <h2>Grid preview — ${expiries.length} expiries &times; ${cols.length} ${SET.name} labels = ${expiries.length * cols.length} cells</h2>
    <table><thead><tr><th>Expiry</th>${cols.map(l => `<th class="num">${l.label}</th>`).join('')}</tr></thead>
    <tbody>${expiries.map((e, r) => `<tr><td class="mono">${e.label}</td>${cols.map((c, j) => {
      const v = pointValue(r, j);
      return `<td class="cell"${v === null ? ' style="color:var(--bad);background:none"' : ''}>${vol(v)}</td>`;
    }).join('')}</tr>`).join('')}</tbody></table>
    <div class="row"><span>${tag(quoted + ' quoted','ok')}</span><span>${tag(missing + ' missing','bad')}</span>
      <span class="faint">Cells with no point at the series are the desk's to fill or exclude.</span></div>
    <div class="notice">Quote type: volatility. Expiry dates: IMM and tenor dates. Day count: A365. The system previews how many cells the axes produce.</div>
  </div>`;
}

// The declared second axis: the chosen smile set (3-point, 5-point or the
// ATM/RR/BF combination), or the decoded text when no vocabulary exists. The
// columns are always the declared axis, never the order points arrive in.
function frameworkCols(){
  if (noVocab) return rawLabels.map((l, i) => ({label:l, kind:'(decoded text)', order:i}));
  if (!SET.combination) return SET.points.map((p, i) =>
    ({label:p.label, kind:`${p.delta ? p.delta + 'd ' : ''}${p.side}`, order:i, point:p}));
  return quoteLabels;
}

// The grid the two axes admit, not the points the series holds. A cell is
// shaded only where the framework can name the expiry and the label together;
// every other combination is null and renders as an empty cell.
function frameworkGrid(){
  const cols = frameworkCols();
  const cells = expiries.length * cols.length;
  const value = (i, j) => pointValue(i, j);
  const caption = noVocab
    ? `Shape the axes allow: ${expiries.length} expiry rows by ${cols.length} columns of decoded text. No strike-label vocabulary exists, so the strike column stays empty: no label carries an order, so no combination is quotable. The empty cells state a missing vocabulary, not a missing quote.`
    : `Shape the axes allow: ${expiries.length} expiries by ${cols.length} ${SET.name} columns = ${cells} cells. The smile point set decides how many columns the surface has; the grid states the shape the convention admits, not fitted values.`;

  return `
  <div class="panel">
    <h2>Framework grid — what the axes allow</h2>
    <div class="row"><span class="faint">Rows are the expiry ladder, columns are the quote-label ladder. The plot shows the shape, not the stored points.</span></div>
    ${PC.heat({rows:expiries, cols, value, dp:1, xLabel:'quote / delta label', yLabel:'expiry', legend:!noVocab, caption})}
  </div>`;
}

// The two ladders that decide the grid, as bars: the expiry spacing and the
// label order. A ladder with no spacing or no order cannot lay a grid out.
function axisLadders(){
  const DAY = 86400000;
  const gaps = expiries.map((e, i) =>
    i === 0 ? null : Math.round((Date.parse(e.date) - Date.parse(expiries[i - 1].date)) / DAY));
  const order = frameworkCols().map((l, i) => ({label:l.label,
    value:noVocab ? null : (l.point ? l.point.delta : (l.order == null ? i : l.order))}));
  return `
  <div class="panel">
    <h2>Axis ladders — the spacing that decides the grid</h2>
    <div class="grid2">
      <div>${PC.bars({bars:expiries.map((e, i) => ({label:e.label, value:gaps[i]})), h:220,
        yFmt:v => v.toFixed(0),
        caption:`Days from the previous expiry. ${expiries[0].label} has no predecessor, so its bar is empty. The 2Y-to-5Y and 10Y-to-30Y steps are wide, so the expiry rows are not evenly spaced.`})}</div>
      <div>${PC.bars({bars:order, h:220, yFmt:v => v.toFixed(0),
        caption: noVocab
          ? 'Decoded text only. No label carries an order, so the ladder cannot be ordered and every bar is empty.'
          : 'The declared order of each quote label. The vocabulary gives the ladder its ordinals, and the grid columns follow them.'})}</div>
    </div>
  </div>`;
}

function conventionFirst(){
  const right = frameworkCols();
  return `
  <div class="panel">
    <h2>Quoting convention first</h2>
    <div class="row">
      <div class="field"><label>Label meaning</label><select><option>delta</option><option>strike</option><option>ATM / RR / BF combination</option></select></div>
      <div class="field"><label>Delta convention</label><select><option>forward</option><option>spot</option><option>premium-adjusted</option></select></div>
      <div class="field"><label>ATM type</label><select><option>forward</option><option>delta-neutral</option></select></div>
      <div class="field"><label>Quote type</label><select><option>volatility</option><option>price</option><option>normal volatility</option></select></div>
    </div>
    <div class="row">
      <div class="field"><label>Expiry dates</label><select><option>IMM</option><option>tenor dates</option></select></div>
      <div class="field"><label>Day count</label><select><option>A365</option><option>ACT/360</option><option>ACT/ACT</option></select></div>
      <div class="field"><label>Currency</label><div class="value">USD</div></div>
    </div>
  </div>
  <div class="panel">
    <h2>Axes the convention implies</h2>
    <div class="row">
      <div class="field" style="flex:1"><label>Expiry axis</label><div class="value mono">${expiries.map(e => e.label).join(', ')}</div></div>
      <div class="field" style="flex:1"><label>Label axis</label><div class="value mono">${right.map(l => l.label).join(', ')}</div></div>
    </div>
    <div class="notice">${noVocab
      ? tag('labels unresolved','bad') + ' The convention names deltas, but no strike-label vocabulary exists, so the second axis stays the decoded text.'
      : `A delta convention orders the 25 and 10 pillars around ATM; ${quoted} of ${expiries.length * quoteLabels.length} cells carry a point.`}</div>
  </div>`;
}

// The smile point set and how a delta is determined. A surface quote is a
// point at a delta, and the delta depends on the convention: the same 25-delta
// point is a different strike under forward, spot or premium-adjusted delta.
function smilePanel(){
  const pts = SET.points;
  const rows = pts.map((p, i) => `<tr>
    <td class="mono">${p.label}</td>
    <td>${p.side}</td>
    <td class="num">${p.side === 'atm' ? '0.50 (ATMF)' : `${p.side === 'put' ? '−' : '+'}${p.delta}`}</td>
    <td class="num">${callDelta(p).toFixed(2)}</td>

          <option value="5"${smile === '5' ? ' selected' : ''}>5-point smile (10s and 25s)</option>
          <option value="rrbf"${smile === 'rrbf' ? ' selected' : ''}>ATM / RR / BF combination</option>
        </select></div>
      <div class="field"><label>Delta type</label><select>
        <option>forward</option><option>spot</option><option>premium-adjusted spot</option><option>driftless</option></select></div>
      <div class="field"><label>ATM definition</label><select>
        <option>forward ATMF (delta 0.50)</option><option>delta-neutral straddle</option></select></div>
      <div class="field"><label>Delta shift</label><select>
        <option>none</option><option>+0.5%</option><option>+1.0%</option></select></div>
      <div class="field"><label>Delta units</label><select><option>percent</option><option>decimal</option></select></div>
    </div>
    <table><thead><tr><th>Label</th><th>Side</th><th class="num">Delta quoted</th><th class="num">Call delta</th><th>Determined by</th><th>Strike</th></tr></thead>
    <tbody>${rows}</tbody></table>
    <div class="grid2">
      <div>${SET.combination
        ? `<div class="notice">The combination set quotes ATM plus a risk reversal and a butterfly, not a delta per point. Switch to a 3- or 5-point smile to read the delta ladder.</div>`
        : PC.line({series:smileSeries, x, ticks, yFmt:v => v.toFixed(1), yLabel:'vol %', h:260,
            caption:'One line per delta point over the expiry ladder: the smile the set defines, at the quoted deltas.'})}</div>
      <div class="notice" style="align-self:start">The delta is not a free label: it is the convention plus the forward. The screen shows the delta each point is quoted at, and the strike it resolves to under the selected convention. ${
        noVocab ? 'No strike-label vocabulary exists, so the resolved strikes cannot be stored.' : 'Without a stored convention the resolved strike cannot be re-read, which is the gap this journey argues for.'}</div>
    </div>

// Reparameterisation: the same quotes expressed in another representation. An
// exact re-expression changes the axes only; a refit changes the numbers.
function reparameterisePanel(){

    ['5Y',  '0.0488', '0.50', '−0.35', '0.44', '4.6'],

  const labels = {sabr:['Expiry','alpha','beta','rho','nu','RMSE bp'], svi:['Expiry','a','b','rho','m','sigma']};
  const isParam = repr === 'sabr' || repr === 'svi';
  const head = (labels[repr] || []).map(h => `<th class="${h.startsWith('RMSE') ? 'num' : ''}">${h}</th>`).join('');

  return `

    <div class="row">
      <div class="field"><label>Represent as</label>
        <select data-sel="repr">

        </select></div>
      <div class="field"><label>Method</label><select>
        <option>exact re-expression (lossless)</option><option>least-squares refit</option><option>fit in total variance</option></select></div>
      <div class="field"><label>Tolerance</label><input value="1 bp" style="width:80px"></div>
      <button class="btn primary" id="reparam">Reparameterise</button>
      <span class="faint" id="reparam-note"></span>
    </div>
    ${isParam ? `<table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table>` : ''}
    <div class="notice">Current representation: <span class="mono">${REPRS[repr]}</span>. ${
      isParam
        ? 'The delta ladder is replaced by a parameter set per expiry, so the surface is re-read by model, not by pillar. No model kind and no parameter set is stored today, so a refitted surface cannot be re-read.'

// Prototype plotting helper. Throwaway, dependency-free, dark-theme SVG.
// Each function returns an HTML string, so a page calls host.innerHTML = PC.line({...}).
// Prefixed PC to stay clear of page-local names; the pages also define `tag`.
const PC = (() => {
  const C = {grid:'#21262d', axis:'#30363d', text:'#71717a', dim:'#a1a1aa',
             ink:'#e3e3e6', accent:'#58a6ff', ok:'#3fb950', warn:'#d29922', bad:'#f85149'};
  const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const fmt = (v, d) => v == null ? '—' : (typeof v === 'number' ? v.toFixed(d ?? 2) : String(v));
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  // A blue -> amber ramp for a heat cell, t in 0..1.
  function heatColour(t){
    const stops = [[13,23,38],[21,60,110],[32,110,170],[88,166,255],[210,153,34],[248,81,73]];
    const p = clamp(t, 0, 1) * (stops.length - 1), i = Math.floor(p), f = p - i;
    const a = stops[i], b = stops[Math.min(stops.length - 1, i + 1)];
    return `rgb(${a.map((x, k) => Math.round(x + (b[k] - x) * f)).join(',')})`;
  }

  // Shared frame: margins, y gridlines and labels for a value axis.
  function frame(o){
    const w = o.w || 940, h = o.h || 300;
    const pad = Object.assign({l:64, r:18, t:16, b:40}, o.pad || {});
    const x0 = pad.l, x1 = w - pad.r, y0 = h - pad.b, y1 = pad.t;
    const vals = (o.series || []).flatMap(s => s.points || []).filter(v => v != null)
      .concat(o.extra || []);
    let lo = Math.min(...vals), hi = Math.max(...vals);
    if (o.zero) { lo = Math.min(lo, 0); hi = Math.max(hi, 0); }
    if (!(hi > lo)) { hi = lo + 1; }
    const span = hi - lo, l2 = lo - span * 0.08, h2 = hi + span * 0.08;
    const y = v => y0 - (v - l2) * (y0 - y1) / (h2 - l2);
    const X = o.x ? (i => x0 + o.x[i] * (x1 - x0))
                  : (i => x0 + i * (x1 - x0) / Math.max(1, (o.ticks ? o.ticks.length : 1) - 1));
    const yTicks = [];
    const steps = o.ySteps || 4;
    for (let k = 0; k <= steps; k++) {
      const v = l2 + (h2 - l2) * k / steps;
      yTicks.push(`<line x1="${x0}" y1="${y(v).toFixed(1)}" x2="${x1}" y2="${y(v).toFixed(1)}" stroke="${C.grid}"/>
        <text x="${x0 - 8}" y="${(y(v) + 3.5).toFixed(1)}" fill="${C.text}" font-size="10" text-anchor="end">${esc((o.yFmt || (v => fmt(v)))(v))}</text>`);
    }
    const xTicks = (o.ticks || []).map(t => {
      const px = o.x ? x0 + t.at * (x1 - x0) : X(t.at);
      return `<text x="${px.toFixed(1)}" y="${h - pad.b + 15}" fill="${C.text}" font-size="10" text-anchor="middle">${esc(t.label)}</text>`;
    }).join('');
    const grid = (o.xticks || []).map(t => {
      const px = o.x ? x0 + t.at * (x1 - x0) : X(t.at);
      return `<line x1="${px.toFixed(1)}" y1="${y1}" x2="${px.toFixed(1)}" y2="${y0}" stroke="${C.grid}" stroke-dasharray="2 3"/>`;
    }).join('');
    return {w, h, x0, x1, y0, y1, y, X, l2, h2, frame: yTicks.join('') + grid + xTicks};
  }

  function line(o){
    const f = frame(o);
    const bands = (o.bands || []).map(b => {
      const xa = f.x0 + b.from * (f.x1 - f.x0), xb = f.x0 + b.to * (f.x1 - f.x0);
      return `<rect x="${xa.toFixed(1)}" y="${f.y1}" width="${(xb - xa).toFixed(1)}" height="${(f.y0 - f.y1).toFixed(1)}"
        fill="${b.color || C.accent}" opacity=".08"/>` +
        (b.label ? `<text x="${((xa + xb) / 2).toFixed(1)}" y="${f.y1 + 11}" fill="${C.text}" font-size="9" text-anchor="middle">${esc(b.label)}</text>` : '');
    }).join('');
    const paths = (o.series || []).map(s => {
      let d = '', pen = false;
      s.points.forEach((v, i) => {
        if (v == null) { pen = false; return; }
        d += (pen ? 'L' : 'M') + f.X(i).toFixed(1) + ',' + f.y(v).toFixed(1) + ' ';
        pen = true;
      });
      const marks = s.markers ? s.points.map((v, i) => v == null ? '' :
        `<circle cx="${f.X(i).toFixed(1)}" cy="${f.y(v).toFixed(1)}" r="${s.r || 3.4}" fill="${s.color}"/>`).join('') : '';
      return `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="${s.width || 2}"${s.dash ? ` stroke-dasharray="${s.dash}"` : ''}/>${marks}`;
    }).join('');
    const legend = o.legend === false ? '' : `<div class="pc-legend">${(o.series || []).map(s =>
      `<span><i style="background:${s.color}"></i>${esc(s.name)}</span>`).join('')}${(o.notes || []).map(n =>
      `<span class="faint">${n}</span>`).join('')}</div>`;
    return `<figure class="pc"><svg viewBox="0 0 ${f.w} ${f.h}" width="100%" height="${f.h}" role="img" aria-label="${esc(o.title || 'chart')}">
      ${bands}${f.frame}${paths}
      ${o.yLabel ? `<text x="14" y="${(f.y0 + f.y1) / 2}" fill="${C.text}" font-size="10" transform="rotate(-90 14 ${(f.y0 + f.y1) / 2})" text-anchor="middle">${esc(o.yLabel)}</text>` : ''}
    </svg>${legend}${o.caption ? `<figcaption class="faint">${o.caption}</figcaption>` : ''}</figure>`;
  }

  function bars(o){
    const f = frame(Object.assign({zero: true}, o));
    const n = o.bars.length, bw = (f.x1 - f.x0) / n;
    const zero = f.y(0);
    const body = o.bars.map((b, i) => {
      const v = b.value == null ? null : b.value;
      const x = f.x0 + i * bw + bw * 0.18, w = bw * 0.64;
      const yv = v == null ? zero : f.y(v);
      const top = Math.min(yv, zero), hgt = Math.abs(zero - yv);
      const col = b.color || (v == null ? C.text : v >= 0 ? C.warn : C.accent);
      return `<rect x="${x.toFixed(1)}" y="${top.toFixed(1)}" width="${w.toFixed(1)}" height="${Math.max(1, hgt).toFixed(1)}" fill="${col}" opacity=".85"><title>${esc(b.label)}: ${esc(fmt(v))}</title></rect>
        <text x="${(x + w / 2).toFixed(1)}" y="${(f.h - 24)}" fill="${C.text}" font-size="9" text-anchor="middle">${esc(b.label)}</text>`;
    }).join('');
    return `<figure class="pc"><svg viewBox="0 0 ${f.w} ${f.h}" width="100%" height="${f.h}" role="img" aria-label="${esc(o.title || 'bars')}">
      ${f.frame}<line x1="${f.x0}" y1="${zero}" x2="${f.x1}" y2="${zero}" stroke="${C.axis}"/>${body}</svg>
      ${o.caption ? `<figcaption class="faint">${o.caption}</figcaption>` : ''}</figure>`;
  }

  // A surface as a shaded mesh grid: one cell per (row, column).
  function heat(o){
    const rows = o.rows, cols = o.cols;
    const cw = o.cell || 54, ch = o.cellH || 30, l = 58, t = 26;
    const w = l + cols.length * cw + (o.legend === false ? 14 : 92);
    const h = t + rows.length * ch + 34;
    const vals = [];
    rows.forEach((_, i) => cols.forEach((_, j) => { const v = o.value(i, j); if (v != null) vals.push(v); }));
    const lo = Math.min(...vals), hi = Math.max(...vals), span = (hi - lo) || 1;
    const cells = [];
    rows.forEach((r, i) => cols.forEach((c, j) => {
      const v = o.value(i, j);
      const x = l + j * cw, y = t + i * ch;
      const col = v == null ? '#161619' : heatColour((v - lo) / span);
      cells.push(`<rect x="${x}" y="${y}" width="${cw - 2}" height="${ch - 2}" rx="2" fill="${col}"><title>${esc(r.label)} · ${esc(c.label)}: ${esc(fmt(v, o.dp))}</title></rect>`);
      if (o.showValues !== false) cells.push(`<text x="${(x + (cw - 2) / 2).toFixed(1)}" y="${(y + ch / 2 + 3.5).toFixed(1)}" fill="${(v != null && (v - lo) / span > 0.55) ? '#0d1117' : C.ink}" font-size="9.5" text-anchor="middle">${esc(fmt(v, o.dp ?? 1))}</text>`);
    }));
    const rowLabels = rows.map((r, i) => `<text x="${l - 8}" y="${(t + i * ch + ch / 2 + 3.5).toFixed(1)}" fill="${C.text}" font-size="10" text-anchor="end">${esc(r.label)}</text>`).join('');
    const colLabels = cols.map((c, j) => `<text x="${(l + j * cw + (cw - 2) / 2).toFixed(1)}" y="${t - 8}" fill="${C.text}" font-size="10" text-anchor="middle">${esc(c.label)}</text>`).join('');
    const legend = o.legend === false ? '' : (() => {
      const bx = l + cols.length * cw + 14, by = t, bh = rows.length * ch - 2;
      const steps = 24, sh = bh / steps;
      let g = '';
      for (let k = 0; k < steps; k++) g += `<rect x="${bx}" y="${(by + k * sh).toFixed(1)}" width="12" height="${(sh + 1).toFixed(1)}" fill="${heatColour(1 - k / (steps - 1))}"/>`;
      return `<g>${g}<text x="${bx + 18}" y="${by + 8}" fill="${C.text}" font-size="9">${esc(fmt(hi, o.dp))}</text>
        <text x="${bx + 18}" y="${by + bh}" fill="${C.text}" font-size="9">${esc(fmt(lo, o.dp))}</text></g>`;
    })();
    return `<figure class="pc"><svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" role="img" aria-label="${esc(o.title || 'heat map')}">
      ${cells.join('')}${rowLabels}${colLabels}${legend}
      ${o.xLabel ? `<text x="${(l + cols.length * cw / 2).toFixed(1)}" y="${h - 6}" fill="${C.text}" font-size="10" text-anchor="middle">${esc(o.xLabel)}</text>` : ''}
      ${o.yLabel ? `<text x="12" y="${(t + rows.length * ch / 2).toFixed(1)}" fill="${C.text}" font-size="10" transform="rotate(-90 12 ${(t + rows.length * ch / 2).toFixed(1)})" text-anchor="middle">${esc(o.yLabel)}</text>` : ''}
    </svg>${o.caption ? `<figcaption class="faint">${o.caption}</figcaption>` : ''}</figure>`;
  }

  // A surface as an isometric wireframe: rows and columns joined over a height.
  function mesh(o){
    const w = o.w || 940, h = o.h || 420;
    const rows = o.z.length, cols = o.z[0].length;
    const vals = o.z.flat().filter(v => v != null);
    const lo = Math.min(...vals), hi = Math.max(...vals), span = (hi - lo) || 1;
    const ox = o.ox ?? w * 0.52;
    const sy = o.sy ?? Math.min(22, h / (2 * Math.max(1, (rows - 1) + (cols - 1))));
    const sx = o.sx ?? Math.min(46, (w * 0.6) / Math.max(1, (rows - 1) + (cols - 1)));
    const sz = o.sz ?? h * 0.34;
    const oy = o.oy ?? h - 26 - ((rows - 1) + (cols - 1)) * sy;
    const P = (i, j) => {
      const v = o.z[i][j];
      const z = v == null ? 0 : (v - lo) / span;
      return [ox + (j - i) * sx, oy + (i + j) * sy - z * sz, z];
    };
    const lines = [];
    for (let i = 0; i < rows; i++) {
      let d = '';
      for (let j = 0; j < cols; j++) { const p = P(i, j); d += (j ? 'L' : 'M') + p[0].toFixed(1) + ',' + p[1].toFixed(1) + ' '; }
      lines.push(`<path d="${d}" fill="none" stroke="${C.accent}" stroke-width="1.4" opacity=".75"/>`);
    }
    for (let j = 0; j < cols; j++) {
      let d = '';
      for (let i = 0; i < rows; i++) { const p = P(i, j); d += (i ? 'L' : 'M') + p[0].toFixed(1) + ',' + p[1].toFixed(1) + ' '; }
      lines.push(`<path d="${d}" fill="none" stroke="${C.warn}" stroke-width="1" opacity=".5"/>`);
    }
    const rowL = (o.rows || []).map((r, i) => { const p = P(i, 0); return `<text x="${(p[0] - 12).toFixed(1)}" y="${(p[1] + 4).toFixed(1)}" fill="${C.text}" font-size="10" text-anchor="end">${esc(r.label)}</text>`; }).join('');
    const colL = (o.cols || []).map((c, j) => { const p = P(rows - 1, j); return `<text x="${(p[0] + 10).toFixed(1)}" y="${(p[1] + 4).toFixed(1)}" fill="${C.text}" font-size="10">${esc(c.label)}</text>`; }).join('');
    const axis = `<text x="14" y="${h - 12}" fill="${C.text}" font-size="10">height: ${esc(o.zLabel || 'value')} ${esc(fmt(lo, o.dp))}–${esc(fmt(hi, o.dp))}</text>`;
    return `<figure class="pc"><svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" role="img" aria-label="${esc(o.title || 'surface mesh')}">
      ${lines.join('')}${rowL}${colL}${axis}</svg>
      <div class="pc-legend"><span><i style="background:${C.accent}"></i>expiry</span><span><i style="background:${C.warn}"></i>strike</span>${(o.notes || []).map(n => `<span class="faint">${n}</span>`).join('')}</div>
      ${o.caption ? `<figcaption class="faint">${esc(o.caption)}</figcaption>` : ''}</figure>`;
  }

  return {line, bars, heat, mesh, colours: C, heatColour};
})();
function render(){
  const body = variant === 'b' ? frameworkGrid() + gridPreview() + axisLadders() + ladders()
             : variant === 'c' ? conventionFirst() + frameworkGrid() + axisLadders()
             : ladders() + frameworkGrid() + gridPreview() + axisLadders();
  document.getElementById('app').innerHTML = header() + smilePanel() + body + reparameterisePanel() + maths() + footer();
  document.getElementById('preview').onclick = () => {
    document.getElementById('preview-note').textContent = noVocab
      ? 'preview incomplete: the label axis has no vocabulary' : `preview: ${quoted} of ${missing + quoted} cells quoted`;
  };
  const rp = document.getElementById('reparam');
  if (rp) rp.onclick = () => {
    document.getElementById('reparam-note').textContent = `reparameterised to ${REPRS[repr]} — nothing stored`;
  };
  document.querySelectorAll('#app [data-sel]').forEach(s => s.onchange = () => set(s.dataset.sel, s.value));
  document.getElementById('note').textContent = `Prototype · author a surface's framework · variant ${variant.toUpperCase()} · ${SET.name} · ${REPRS[repr]} · ${noVocab ? 'no strike-label vocabulary' : 'labels proposed'} · nothing written`;
  document.getElementById('bar').innerHTML =
    `<span class="label">Axis definition</span>` +
    ['a','b','c'].map(v => `<button data-v="${v}" class="${v === variant ? 'on' : ''}">${v.toUpperCase()}</button>`).join('') +
    `<span class="sep">|</span><span class="label">Smile</span>` +
    [['3','3-point'],['5','5-point'],['rrbf','ATM/RR/BF']].map(([s, t]) => `<button data-sm="${s}" class="${s === smile ? 'on' : ''}">${t}</button>`).join('') +
    `<span class="sep">|</span><span class="label">Labels</span>` +
    [['proposed','proposed'],['nostrike','none']].map(([s, t]) => `<button data-s="${s}" class="${s === state ? 'on' : ''}">${t}</button>`).join('');
  document.querySelectorAll('#bar [data-v]').forEach(b => b.onclick = () => set('variant', b.dataset.v));
  document.querySelectorAll('#bar [data-sm]').forEach(b => b.onclick = () => set('smile', b.dataset.sm));
  document.querySelectorAll('#bar [data-s]').forEach(b => b.onclick = () => set('state', b.dataset.s));
  document.querySelectorAll('#app [data-add]').forEach(b => b.onclick = () => {
    b.textContent = b.dataset.add === 'expiry' ? 'expiry added — pick a tenor' : 'label added — pick a label';
  });
}
function set(k, v){ const p = new URLSearchParams(location.search); p.set(k, v); location.search = p.toString(); }
render();
</script>
</body>
</html>
