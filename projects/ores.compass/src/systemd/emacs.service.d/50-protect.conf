# Deployed by `compass systemd deploy` to
# ~/.config/systemd/user/emacs.service.d/50-protect.conf.
# Source of truth: projects/ores.compass/src/systemd/emacs.service.d/50-protect.conf.
#
# WS-5 (unprivileged half) of systemd-resource-management-plan.org: give
# the interactive Emacs daemon priority over everything else on the box --
# CPUWeight so it stays responsive under a build/Claude-session burst, and
# MemoryMin/MemoryLow so the kernel reclaims other cgroups' memory before
# touching Emacs's.
#
# IMPORTANT CAVEAT (see the plan's WS-5 section): MemoryMin/MemoryLow are
# clamped by ancestor cgroups. This drop-in has no effect until a matching
# budget is also set on user-1000.slice (the root half of WS-5, deployed
# separately since it requires root -- see
# /etc/systemd/system/user-1000.slice.d/50-marco.conf in the plan). Verify
# propagation actually took with:
#   systemctl --user show emacs.service -p MemoryMin -p MemoryLow
#   systemd-cgtop --user

[Service]
MemoryMin=1G
MemoryLow=2G
CPUWeight=10000
