name: Agent CPU evaluation

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      corpus:
        description: Fixture corpus
        type: choice
        options: [all, original, holdout, review]
        default: all
      require_handling:
        description: Fail the job on handling failures (blocked capabilities remain blocked)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: agent-cpu-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evaluate:
    name: CPU model / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
        working-directory: projects/ores.agent
    env:
      CPU_REPORTS: ${{ github.workspace }}/build/output/agent-cpu
      CPU_EVAL_CORPUS: ${{ inputs.corpus || 'all' }}
      CPU_EVAL_REQUIRE_HANDLING: ${{ inputs.require_handling && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set isolated CPU root
        run: echo "CPU_ROOT=$RUNNER_TEMP/ores-agent-cpu" >> "$GITHUB_ENV"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: projects/ores.agent/package-lock.json
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ env.CPU_ROOT }}/models
            ${{ env.CPU_ROOT }}/downloads
          key: agent-cpu-${{ runner.os }}-${{ hashFiles('projects/ores.agent/inference-lock.json') }}
      - name: Build and verify agent
        run: |
          npm ci --ignore-scripts
          npm run verify
          python -m unittest discover -s tests -p "*_test.py"
      - name: Install and configure CPU inference
        id: configure
        run: |
          python scripts/install-inference.py "$CPU_ROOT" --cpu
          node scripts/configure-inference.mjs "$CPU_ROOT"
      - name: Start CPU inference
        run: node "$CPU_ROOT/service.mjs" start "$CPU_ROOT/service.json"
      - name: Evaluate real model with fixture data
        run: node evals/cpu-ci.mjs run "$CPU_ROOT" "$CPU_REPORTS"
      - name: Stop CPU inference
        if: always() && steps.configure.outcome == 'success'
        run: |
          if [ -f "$CPU_ROOT/service.json" ]; then
            node "$CPU_ROOT/service.mjs" stop "$CPU_ROOT/service.json"
          fi
      - name: Collect redacted inference logs
        if: always() && steps.configure.outcome == 'success'
        run: node evals/cpu-ci.mjs collect "$CPU_ROOT" "$CPU_REPORTS"
      - name: Upload fixture reports and diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agent-cpu-${{ matrix.os }}
          path: build/output/agent-cpu/
          if-no-files-found: warn
          retention-days: 14
