<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Published curves — prototype</title>
<style>
:root{
  color-scheme:dark;
  --bg:#121214;--panel:#1a1a1e;--panel-2:#26262b;--line:#30363d;--line-soft:#21262d;--line-strong:#4a5568;
  --ink:#e3e3e6;--ink-dim:#a1a1aa;--ink-faint:#71717a;
  --accent:#58a6ff;--accent-bright:#8ab4f8;--accent-dim:#21262d;
  --ok:#22c55e;--warn:#eab308;--stale:#e3b341;--bad:#ef4444;--info:#3b82f6;--violet:#a855f7;--inactive:#6b7280;
  --radius:8px;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
h1,h2,h3{margin:0;font-weight:600}
p{margin:0}
button{font:inherit;color:inherit}
a{color:var(--accent-bright);text-decoration:none}
.mono{font-family:var(--mono)}
.dim{color:var(--ink-dim)}
.faint{color:var(--ink-faint)}
.dash{color:var(--ink-faint)}
.nowrap{white-space:nowrap}

/* Prototype chrome, deliberately unlike the design on trial. */
.proto-note{position:fixed;top:0;left:0;right:0;z-index:60;padding:4px 16px;background:#2a2113;border-bottom:1px solid #4a3a17;color:var(--warn);font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.proto-bar{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:60;display:flex;align-items:center;flex-wrap:wrap;justify-content:center;gap:4px;max-width:96vw;padding:4px 8px;background:#0b0e13;border:1px solid var(--line);border-radius:999px;font-size:12px}
.proto-bar button{background:none;border:none;color:var(--ink-dim);padding:4px 8px;border-radius:999px;cursor:pointer}
.proto-bar button:hover{background:var(--panel-2);color:var(--ink)}
.proto-bar button.on{background:var(--accent-dim);color:var(--ink)}
.proto-bar .label{padding:0 8px;color:var(--ink-faint);white-space:nowrap}
.proto-bar .sep{color:var(--line)}

/* A gap the screen draws because the server does not answer yet. */
.gap{margin-top:16px;border-left:2px solid var(--warn);padding:4px 0 4px 12px;font-size:12px;color:var(--ink-dim)}
.gap b{color:var(--warn)}
body.nogaps .gap{display:none}

/* The application shell, as the product draws it. */
.shell-head{position:fixed;top:26px;left:0;right:0;z-index:50;height:44px;display:flex;align-items:center;gap:16px;padding:0 16px;background:var(--bg);border-bottom:1px solid var(--line);font-size:13px}
.shell-head .brand{font-weight:600;letter-spacing:-.01em}
.shell-head nav{display:flex;gap:4px;flex-wrap:wrap}
.shell-head nav span{color:var(--ink-dim);padding:4px 8px;border-radius:6px}
.shell-head nav span.on{color:var(--ink);background:var(--panel-2)}
.shell-head .who{margin-left:auto;color:var(--ink-dim);white-space:nowrap}
.shell-head .who b{color:var(--ink);font-weight:500}

.page{padding:86px 24px 96px;max-width:1180px;margin:0 auto}
.crumbs{font-size:12px;color:var(--ink-faint);margin:0 0 8px}
.crumbs .sep{padding:0 4px}
.crumbs a{color:var(--ink-dim)}
.crumbs a:hover{color:var(--ink);text-decoration:underline}
.pagehead{display:flex;align-items:flex-start;gap:16px;margin:0 0 16px;flex-wrap:wrap}
.pagehead h1{font-size:24px;font-weight:600;letter-spacing:-.02em}
.pagehead .lead{margin:4px 0 0;color:var(--ink-dim);font-size:13px}
.pagehead .actions{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* Buttons, marks, badges, notices. */
.btn{display:inline-flex;align-items:center;gap:8px;white-space:nowrap;border:1px solid var(--line);background:var(--panel-2);border-radius:var(--radius);padding:8px 16px;font-size:13px;cursor:pointer}
.btn:hover:not(:disabled){border-color:var(--line-strong)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#06121f;font-weight:600}
.btn.ghost{background:none;border-color:transparent;color:var(--ink-dim)}
.btn.ghost:hover:not(:disabled){color:var(--ink);background:var(--panel-2)}
.btn.small{padding:4px 12px;font-size:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.on{border-color:var(--accent);color:var(--accent-bright)}
.badge{display:inline-block;border:1px solid currentColor;border-radius:999px;padding:0 8px;font-size:12px;line-height:20px;white-space:nowrap}
.badge.ok{color:var(--ok)}
.badge.pending{color:var(--info)}
.badge.caution{color:var(--warn)}
.badge.bad{color:var(--bad)}
.badge.inactive{color:var(--inactive)}
.badge.class{color:var(--violet)}
.badge.mono{font-family:var(--mono);font-size:11px}
.access{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;padding:0 8px;font-size:12px;color:var(--ink-dim)}
.notice{border-radius:var(--radius);padding:12px 16px;font-size:13px;margin:0 0 16px;border:1px solid}
.notice.info{background:#12161f;border-color:#24344d}
.notice.success{background:#12281d;border-color:#23543a;color:#a8e6c4}
.notice.warn{background:#2a2113;border-color:#4a3a17;color:#efd39a}
.notice.error{background:#2b1614;border-color:#5c2a24;color:#f0b7ae}
.notice b{font-weight:600}

/* Cards and panels. */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:24px}
.card h2{font-size:18px;font-weight:600;margin:0 0 4px}
.card .lede{margin:0 0 24px;color:var(--ink-dim);font-size:13px}
.card h3{font-size:13px;font-weight:600;margin:24px 0 8px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.panel h2{font-size:13px;font-weight:600;margin:0 0 12px}
.panel h2 .sub{font-weight:400;color:var(--ink-faint)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:820px){.grid2{grid-template-columns:1fr}}

/* Lists: tools, tables, pager. */
.listtools{display:flex;gap:8px;align-items:center;margin:0 0 12px;flex-wrap:wrap}
.searchbox{position:relative;flex:1 1 240px;max-width:360px}
.searchbox input{width:100%;background:#0e1218;border:1px solid var(--line);border-radius:var(--radius);color:var(--ink);padding:8px 12px;font:inherit;font-size:13px}
.listnote{font-size:12px;color:var(--ink-faint);margin:0 0 8px}
.rows{width:100%;border-collapse:collapse;font-size:13px}
.rows th{text-align:left;color:var(--ink-faint);font-weight:500;font-size:11px;letter-spacing:.05em;text-transform:uppercase;padding:0 12px 8px 0;border-bottom:1px solid var(--line);white-space:nowrap}
.rows th.sortable{cursor:pointer}
.rows th.sortable:hover{color:var(--ink)}
.rows th .caret{color:var(--accent-bright);padding-left:4px}
.rows td{padding:10px 12px 10px 0;border-bottom:1px solid var(--line-soft);vertical-align:middle}
.rows tr.pick{cursor:pointer}
.rows tr.pick:hover td{background:#1e1e23}
.rows tr.candidate td{background:#17171b}
.rows tr.ended td{background:#161619}
.rows .key{font-family:var(--mono);color:var(--ink)}
.rows .num{font-family:var(--mono);text-align:right;font-variant-numeric:tabular-nums}
.rows .sub{display:block;font-size:12px;color:var(--ink-faint);margin-top:2px}
.rows .same{color:var(--ink-faint)}
.rows td.subject{white-space:normal;min-width:300px;width:36%}
.rows td.subject .key{font-weight:500}
.tblstate{padding:40px 24px;text-align:center;color:var(--ink-dim);font-size:13px;border:1px solid var(--line);border-radius:var(--radius);background:var(--panel)}
.tblstate b{color:var(--ink);display:block;margin-bottom:8px;font-size:14px}
.tblstate .btn{margin-top:16px}
.pager{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:12px;color:var(--ink-dim);flex-wrap:wrap}
.pager .count{margin-right:auto}

/* A custom select: native selects cannot be styled, so none is used. */
.sel{position:relative;display:inline-block}
.sel-trigger{display:inline-flex;align-items:center;justify-content:space-between;gap:8px;white-space:nowrap;cursor:pointer;background:#0e1218;border:1px solid var(--line);border-radius:var(--radius);padding:8px 12px;font-size:13px;min-width:180px;text-align:left}
.sel-trigger .chev{color:var(--ink-faint)}
.sel-menu{position:absolute;left:0;top:calc(100% + 4px);z-index:30;min-width:100%;max-height:260px;overflow:auto;background:var(--panel);border:1px solid var(--line-strong);border-radius:var(--radius);padding:4px}
.sel-menu button{display:block;width:100%;text-align:left;background:none;border:none;border-radius:6px;padding:4px 8px;font-size:13px;cursor:pointer;white-space:nowrap}
.sel-menu button:hover,.sel-menu button.on{background:var(--panel-2)}

/* Tabs. */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:0 0 16px;flex-wrap:wrap}
.tabs button{background:none;border:none;border-bottom:2px solid transparent;color:var(--ink-dim);padding:8px 12px;cursor:pointer;font-size:13px}
.tabs button:hover{color:var(--ink)}
.tabs button.on{color:var(--ink);border-bottom-color:var(--accent)}

/* Fields and the details grid. */
.fields{display:grid;grid-template-columns:repeat(3,1fr);gap:16px 24px;margin:0}
@media(max-width:760px){.fields{grid-template-columns:1fr 1fr}}
.fields dt{font-size:12px;color:var(--ink-dim);margin:0 0 4px}
.fields dd{margin:0;font-size:13px}
.fields dd.mono{font-family:var(--mono);font-size:12px;word-break:break-all}
.lastchanged{margin-top:24px;border-top:1px solid var(--line);padding-top:12px;font-size:12px;color:var(--ink-dim)}
.field{display:block;margin:0 0 16px}
.field>.lbl{display:block;font-size:12px;color:var(--ink-dim);margin:0 0 4px}
.field>.lbl .req{color:var(--ink-faint)}
.field textarea{width:100%;min-height:80px;resize:vertical;background:#0e1218;border:1px solid var(--line);border-radius:var(--radius);color:var(--ink);padding:8px 12px;font:inherit;font-size:13px}
.field.bad textarea{border-color:var(--bad)}
.field .msg{font-size:12px;color:var(--bad);margin:4px 0 0}
.hint{font-size:12px;color:var(--ink-faint);margin:4px 0 0}
.choice{display:flex;align-items:flex-start;gap:12px;padding:8px 0;cursor:pointer}
.choice .dot{width:16px;height:16px;margin-top:2px;flex:0 0 16px;border-radius:999px;border:1px solid var(--line-strong)}
.choice.on .dot{border-color:var(--accent);background:radial-gradient(var(--accent) 40%,transparent 45%)}
.choice .nm{font-weight:500}
.choice .sub{font-size:12px;color:var(--ink-faint)}
.stepfoot{margin-top:24px;border-top:1px solid var(--line);padding-top:16px;display:flex;align-items:center;gap:8px}
.stepfoot .ml-auto{margin-left:auto}
a.btn{color:var(--ink)}
a.btn.primary{color:#06121f}

/* The point-by-point difference. */
.diff{width:100%;border-collapse:collapse;font-size:13px}
.diff th{text-align:left;font-size:11px;font-weight:500;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-faint);padding:0 12px 8px 0;border-bottom:1px solid var(--line);white-space:nowrap}
.diff td{padding:8px 12px 8px 0;border-bottom:1px solid var(--line-soft);font-family:var(--mono);font-size:12px;vertical-align:middle}
.diff td:first-child{font-family:inherit;font-size:13px;color:var(--ink);width:200px}
.diff th.num,.diff td.num{text-align:right;font-variant-numeric:tabular-nums}
.diff tr.changed td{background:#14171b}
.diff tr.added td{background:#141b17}
.diff tr.dropped td{background:#1b1414}
.diff tr.unchanged td{color:var(--ink-faint)}
.diff .was{color:var(--bad);text-decoration:line-through}
.diff .now{color:var(--ok)}
.diff .mark{font-family:inherit}
.summary{display:flex;gap:16px;flex-wrap:wrap;align-items:baseline;font-size:13px;margin:0 0 12px}
.summary .stat{color:var(--ink-dim)}
.summary .stat b{color:var(--ink);font-family:var(--mono);font-weight:500}

/* A chart, as the application draws one: plain SVG, axes in mono. */
.chartpanel{border:1px solid var(--line);border-radius:var(--radius);background:var(--panel);padding:16px;margin:0 0 16px}
.chartpanel h3{font-family:var(--mono);font-size:12px;font-weight:600;color:var(--ink);margin:0 0 8px}
.chartlegend{margin:0 0 8px}
.chartlegend .legendline{font-size:12px;color:var(--ink-faint);font-style:italic}
.chart{width:100%;max-width:760px;height:auto;display:block;overflow:visible}
.histchart svg.chart{width:auto;max-width:none;height:130px;display:block}
.chart text{font-family:var(--mono);font-size:11px;fill:var(--ink-faint)}
.chart .grid{stroke:var(--line-soft);stroke-width:1}
.chart .axis{stroke:var(--line);stroke-width:1}
.chartempty{border:1px dashed var(--line);border-radius:var(--radius);padding:24px;text-align:center;color:var(--ink-dim);font-size:13px}
.chartempty b{display:block;color:var(--ink);margin-bottom:4px}
.chartbeside{display:grid;grid-template-columns:minmax(380px,5fr) minmax(420px,6fr);gap:16px;align-items:start}
@media(max-width:1020px){.chartbeside{grid-template-columns:1fr}}

/* History: the event chart, then the rail. */
.histwrap{border:1px solid var(--line);border-radius:var(--radius);background:var(--panel);padding:16px;margin:0 0 16px}
.histwrap h3{font-family:var(--mono);font-size:12px;font-weight:600;margin:0 0 12px}
.histchart{overflow-x:auto}
.histlegend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--ink-dim);margin:12px 0 0}
.histlegend .sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:middle}
.histtools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:0 0 8px}
.histrail{list-style:none;margin:0;padding:0}
.histrail li{display:grid;grid-template-columns:104px 40px 1fr;gap:12px;padding:12px 0;border-bottom:1px solid var(--line-soft)}
.histrail li.marked{background:#141b23}
.histrail .gutter{font-size:12px;color:var(--ink-faint);text-align:right}
.histrail .gutter .cur{display:block;font-size:10px;color:var(--accent-bright);letter-spacing:.04em;margin-top:2px}
.histrail .face{display:flex;align-items:flex-start;justify-content:center}
.avatar{display:inline-flex;align-items:center;justify-content:center;flex:0 0 28px;width:28px;height:28px;border-radius:50%;background:var(--panel-2);border:1px solid var(--line);font-size:10px;color:var(--ink-dim)}
.histrail .head{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;font-size:13px}
.histrail .head .rec{font-family:var(--mono);font-size:12px;color:var(--ink-dim)}
.histrail .head .why{font-family:var(--mono);font-size:11px;color:var(--ink-faint)}
.histrail .note{margin:4px 0 0;font-size:13px;color:var(--ink-dim)}
.histrail details{margin-top:6px}
.histrail summary{cursor:pointer;font-size:12px;color:var(--accent-bright)}
.histrail .detailline{font-size:12px;color:var(--ink-faint);margin:2px 0 0}
.daydiv{font-size:12px;font-weight:600;color:var(--ink-dim);padding:16px 0 8px;border-bottom:1px solid var(--line);margin-top:8px}
.daydiv:first-child{margin-top:0;padding-top:0}
.person{display:inline-flex;align-items:center;gap:8px}
.rows.queue .askedfor{white-space:normal}
.rows.queue .askedfor .subjectline{display:block;margin-top:6px}
.rows.queue .askedfor .subjectline .key{font-weight:500}
.rows.queue .why{max-width:26rem}
.kindcode{font-family:var(--mono);font-size:11px;color:var(--ink-faint);margin-left:6px}
a.bare{color:var(--ink-dim);text-decoration:underline;text-decoration-color:var(--line-strong)}
a.bare:hover{color:var(--ink)}
</style>
</head>
<body>

<!--
  PROTOTYPE. Throwaway. Mock data, no backend, no build step, no session.

  The published-curve screens, as two surfaces on one page:

    ?surface=list    the tenant's published sets: the list, its states, and the
                     record page a row opens, with four tabs
    ?surface=queue   the Requests queue with the subject in the row, and the
                     request page a decider opens

  The record page's tabs are Details, Published points, Compare as of and
  History, and the tab is in the address with the comparison's as-of:

    ?surface=list&curve=USD-SOFR-3M&party=ACME+London&tab=details
    ?surface=list&curve=USD-SOFR-3M&party=ACME+London&tab=points
    ?surface=list&curve=USD-SOFR-3M&party=ACME+London&tab=compare&asof=<instant>
    ?surface=list&curve=USD-SOFR-3M&party=ACME+London&tab=history

  The other parameters:

    ?state=none|nomatch|loading|error     the list's states
    ?show=candidates&ended=1              what the list draws beside the sets in use
    ?points=changed|same|added            the comparison's state
    ?unchanged=1                          whether the comparison draws unchanged points
    ?chart=one|none                       a chart that cannot be drawn, and why
    ?fparty=<party>&q=<text>&page=<n>&size=<n>&sort=<col>&dir=1|-1   the list's tools
    ?open=r1&decision=approve|refuse|hold&actor=<username>           the queue and its answer
    ?gaps=0                                hide the server-gap notes

  A change is written to the query string, so any surface, tab and state can be
  linked directly. Every control is prototype chrome.
-->
<div class="proto-note" id="note">Prototype · mock data · reads no server</div>
<header class="shell-head" id="shell"></header>
<main class="page" id="app"></main>
<div class="proto-bar" id="bar"></div>

<script>
(function () {
    'use strict';

    /* ---------------------------------------------------------------- */
    /* The query string is the state, as every prototype here does.       */
    /* ---------------------------------------------------------------- */

    var Q = new URLSearchParams(location.search);

    var S = {
        surface: Q.get('surface') || 'list',
        curve: Q.get('curve') || '',
        party: Q.get('party') || '',
        tab: Q.get('tab') || 'details',
        asof: Q.get('asof') || '',
        points: Q.get('points') || '',
        show: Q.get('show') || 'published',
        ended: Q.get('ended') === '1',
        unchanged: Q.get('unchanged') === '1',
        chart: Q.get('chart') || '',
        state: Q.get('state') || '',
        open: Q.get('open') || '',
        q: Q.get('q') || '',
        partyFilter: Q.get('fparty') || 'all',
        page: Number(Q.get('page') || 0),
        size: Number(Q.get('size') || 15),
        sort: Q.get('sort') || 'published_at',
        dir: Q.get('dir') === '1' ? 1 : -1,
        kind: Q.get('kind') || 'all',
        actor: Q.get('actor') || 'n.haugen',
        chosen: Q.get('chosen') || '',
        comment: Q.get('comment') || '',
        decision: Q.get('decision') || null,
        tried: false,
        menu: ''
    };
    if (Q.get('gaps') === '0') { document.body.classList.add('nogaps'); }

    /* ---------------------------------------------------------------- */
    /* The mock tenant, read as literals.                                */
    /* ---------------------------------------------------------------- */

    var NOW = Date.parse('2026-10-07T09:00:00Z');
    var TABS = ['details', 'points', 'compare', 'history'];

    var PEOPLE = {
        'a.reyes': { name: 'A. Reyes', role: 'Market data maker', decides: [] },
        'j.silva': { name: 'J. Silva', role: 'Market data analyst', decides: [] },
        'm.oduya': { name: 'M. Oduya', role: 'Head of market risk', decides: ['marketdata'] },
        'k.mori': { name: 'K. Mori', role: 'Middleware operations', decides: ['refdata'] },
        'n.haugen': { name: 'N. Haugen', role: 'Tenant administrator', decides: ['marketdata', 'iam', 'refdata'] }
    };
    var KIND_AREA = { marketdata: 'Market data', iam: 'Access', refdata: 'Reference data' };
    var PARTIES = ['ACME London', 'ACME New York', 'ACME Hong Kong'];
    var MARKET_RISK = 'Market Risk';
    var SERIES = 'oresmd://ir/USD?type=series&instrument=discount&quote=rate&curve_id=USD-SOFR-ACME';

    /* A published set: the detail row of the request that authorises it. Every
       fact a history reads is here, because the row is the whole record. */
    var SETS = [
        { curve: 'USD-SOFR-3M', party: 'ACME London', asof: '2026-10-06T16:00:00Z',
          raised_at: '2026-10-06T15:05:00Z', raised_by: 'a.reyes',
          approved_at: '2026-10-06T16:12:00Z', approved_by: 'm.oduya',
          approved_comment: 'Checked against the 16:00 quotes.',
          published_at: '2026-10-06T16:41:00Z', published_by: 'a.reyes',
          request: '8f1c…a41', points: 12, series: SERIES, state: 'published' },
        { curve: 'EUR-ESTR-6M', party: 'ACME London', asof: '2026-10-06T16:00:00Z',
          raised_at: '2026-10-06T14:10:00Z', raised_by: 'j.silva',
          approved_at: '2026-10-06T15:58:00Z', approved_by: 'm.oduya',
          approved_comment: 'The rebuild agrees with the quotes.',
          published_at: '2026-10-06T16:44:00Z', published_by: 'j.silva',
          request: '7b02…c19', points: 12,
          series: 'oresmd://ir/EUR?type=series&instrument=discount&quote=rate&curve_id=EUR-ESTR-ACME',
          state: 'published' },
        { curve: 'USD-SOFR-3M', party: 'ACME New York', asof: '2026-10-06T21:00:00Z',
          raised_at: '2026-10-06T20:50:00Z', raised_by: 'j.silva',
          approved_at: '2026-10-06T21:00:00Z', approved_by: 'm.oduya',
          approved_comment: 'New York closed on the 21:00 snapshot.',
          published_at: '2026-10-06T21:02:00Z', published_by: 'a.reyes',
          request: '9a31…4de', points: 12,

    /* ---------------------------------------------------------------- */

    function esc(v) {
        return String(v === null || v === undefined ? '' : v)
            .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;');
    }
    function person(id) { return PEOPLE[id] || { name: id, role: '', decides: [] }; }
    function badge(kind, text) { return '<span class="badge ' + kind + '">' + esc(text) + '</span>'; }
    function dash(v) { return v === '' || v === null || v === undefined ? '<span class="dash">—</span>' : esc(v); }
    function mono(v) { return '<span class="mono">' + esc(v) + '</span>'; }

    function exact(iso) {
        var d = new Date(iso);
        var months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
        function two(n) { return n < 10 ? '0' + n : String(n); }
        return two(d.getUTCDate()) + ' ' + months[d.getUTCMonth()] + ' ' + d.getUTCFullYear() +
            ', ' + two(d.getUTCHours()) + ':' + two(d.getUTCMinutes()) + ' UTC';
    }
    function clock(iso) {
        var d = new Date(iso);
        function two(n) { return n < 10 ? '0' + n : String(n); }
        return two(d.getUTCHours()) + ':' + two(d.getUTCMinutes()) + ':' + two(d.getUTCSeconds());
    }
    function dayName(iso) {
        var d = new Date(iso);
        var days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
        var months = ['January', 'February', 'March', 'April', 'May', 'June', 'July',
            'August', 'September', 'October', 'November', 'December'];
        return days[d.getUTCDay()] + ', ' + d.getUTCDate() + ' ' + months[d.getUTCMonth()] + ' ' + d.getUTCFullYear();
    }
    function dayKey(iso) { return iso.slice(0, 10); }
    function rel(iso) {
        var d = Date.parse(iso) - NOW;
        var future = d > 0;
        var mins = Math.round(Math.abs(d) / 60000);
        var text;
        if (mins < 1) { return 'just now'; }
        if (mins < 60) { text = mins + (mins === 1 ? ' minute' : ' minutes'); }
        else {
            var hours = Math.round(mins / 60);
            if (hours < 48) { text = hours + (hours === 1 ? ' hour' : ' hours'); }
            else {
                var days = Math.round(hours / 24);
                text = days + (days === 1 ? ' day' : ' days');
            }
        }
        return future ? 'in ' + text : text + ' ago';
    }
    function when(iso) { return '<span title="' + esc(exact(iso)) + '">' + esc(rel(iso)) + '</span>'; }
    function rate(v) { return v.toFixed(4); }
    /* The years the pillar spans, so the table can hold the discount factor it
       implies at the published rate. */
    function tenorYears(tenor) {
        var n = Number(tenor.replace(/[A-Z]/g, ''));
        var unit = tenor.slice(-1);
        if (unit === 'W') { return n / 52; }
        if (unit === 'M') { return n / 12; }
        if (unit === 'Y') { return n; }
        return n;
    }
    function discountFactor(tenor, ratePct) {
        return (1 / Math.pow(1 + ratePct / 100, tenorYears(tenor))).toFixed(6);
    }
    function bp(v) { return (v >= 0 ? '+' : '−') + Math.abs(v).toFixed(1); }
    function initials(name) {
        return name.split(/[\s.]+/).filter(function (p) { return p.length > 0; })
            .map(function (p) { return p[0]; }).join('').slice(0, 2).toUpperCase();
    }

    function setStateBadge(code) {
        var cls = code === 'published' ? 'ok' : code === 'withdrawn' ? 'bad' : 'inactive';
        var text = code === 'published' ? 'Published' : code === 'withdrawn' ? 'Withdrawn' : 'Superseded';
        return badge(cls, text);
    }
    function stateName(code) {
        return { waiting: 'Waiting', held: 'Held', approved: 'Approved', refused: 'Refused' }[code] || code;
    }
    function stateBadge(code) {
        var cls = code === 'approved' ? 'ok' : code === 'refused' ? 'bad' : code === 'held' ? 'caution' : 'pending';
        return badge(cls, stateName(code));
    }

    function listRows() {
        var rows = SETS.slice();

    function compareRows(a, b) {
        var key = S.sort;
        function val(r) {
            if (key === 'published_at') { return r.published_at || r.built_at || ''; }
            if (key === 'asof') { return r.asof; }
            if (key === 'points') { return r.points; }
            if (key === 'state') { return r.state || r.kind; }
            return String(r[key] || '').toLowerCase();
        }
        var x = val(a), y = val(b);
        return (x < y ? -1 : x > y ? 1 : 0) * S.dir;
    }

    function filteredRows() {
        return listRows().filter(function (r) {
            if (S.partyFilter !== 'all' && r.party !== S.partyFilter) { return false; }
            if (!S.q) { return true; }
            var hay = (r.curve + ' ' + r.party + ' ' + (r.published_by || '') + ' ' + (r.built_by || '')).toLowerCase();
            return hay.indexOf(S.q.toLowerCase()) >= 0;
