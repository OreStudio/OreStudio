# yamllint disable rule:line-length
---
name: Start NATS server
description: >-
  Start the NATS server with the configuration env configure generated, and wait
  until it answers.

# env configure already generated the per-checkout TLS certs and nats-<label>.conf
# (compass nats certs / compass nats init) -- start it with that config, matching
# local dev exactly, so tests that need a live NATS (eventing integration tests)
# don't hang or fail with a connection error.

runs:
  using: composite
  steps:
    - name: Start NATS server
      shell: bash
      run: |
        nats_conf="$(ls build/config/nats-*.conf | head -n1)"
        nats-server --config "$nats_conf" &
        monitor_port="$(grep '^ORES_NATS_MONITOR_PORT=' .env | cut -d= -f2- | tr -d '"')"
        ready=false
        for i in $(seq 1 30); do
          if curl -sf "http://localhost:${monitor_port}/varz" > /dev/null; then
            ready=true
            break
          fi
          sleep 1
        done
        if [ "$ready" != "true" ]; then
          echo "::error::nats-server did not become ready within 30s"
          exit 1
        fi
