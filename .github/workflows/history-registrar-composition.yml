---
name: History-provider registrar composition
on:  # yamllint disable-line rule:truthy
  push:
    branches: ["main"]
    paths:
      - "projects/*/core/**"
      - "projects/ores.codegen/scripts/check_history_registrar_composition.py"
      - "projects/ores.codegen/tests/test_check_history_registrar_composition.py"
      - ".github/workflows/history-registrar-composition.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  # A component generates one history-provider registrar per audited entity,
  # and something has to call each of them to put the provider in the dispatch
  # registry. A registrar nothing calls leaves the entity's history verb
  # answering "No history provider registered for entity_type", while the
  # generated code, the build and every other subject look healthy. This job
  # fails when a registrar of a checked component is left uncomposed.
  history-registrars:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Check every generated history-provider registrar is composed
        run: |
          python3 projects/ores.codegen/scripts/check_history_registrar_composition.py
      - name: Install test dependencies
        run: |
          pip install --quiet pytest
      - name: Test the check
        run: |
          python3 -m pytest projects/ores.codegen/tests/test_check_history_registrar_composition.py -q
