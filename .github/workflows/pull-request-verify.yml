---
name: Pull request verification
on:  # yamllint disable-line rule:truthy
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

# The half of the gate set that compiles and runs the tree. It is deliberately
# a workflow of its own, and deliberately unfiltered: the fast gates in
# codegen-drift.yml narrow themselves to generated paths, so a pull request
# that changes only C++ -- the change that broke main on 2026-09-29, when a
# renamed field stopped compiling in another component -- would not have
# started any check at all.
#
# The classifier decides what runs. A documentation or web change starts
# neither job; a C++ change configures, builds every target and runs ctest; a
# change to a service starts the services as well. See
# projects/ores.codegen/src/codegen/change_classification.py for the table, and
# tests/test_change_classification.py for the cases that pin it.

jobs:
  classify:
    name: classify the change
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      cpp: ${{ steps.classify.outputs.cpp }}
      db: ${{ steps.classify.outputs.db }}
      services: ${{ steps.classify.outputs.services }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The classifier diffs against the base branch's merge base, which a
          # shallow checkout does not have; without it the decision would fall
          # back to asking for everything, which is safe but deaf.
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Classify the change
        id: classify
        run: |
          git fetch --no-tags origin "${{ github.base_ref }}" || true
          python3 projects/ores.codegen/scripts/classify_changes.py \
            --base "origin/${{ github.base_ref }}" \
            --github-output "$GITHUB_OUTPUT"

  verify:
    name: build, test and start the services
    needs: classify
    if: needs.classify.outputs.cpp == 'true'
    uses: ./.github/workflows/cpp-verify.yml
    with:
      services: ${{ needs.classify.outputs.services == 'true' }}
