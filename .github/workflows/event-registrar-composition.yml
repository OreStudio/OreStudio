---
name: Event registrar composition
on:  # yamllint disable-line rule:truthy
  push:
    branches: ["main"]
    paths:
      - "projects/*/service/**"
      - "projects/ores.codegen/scripts/check_event_registrar_composition.py"
      - "projects/ores.codegen/tests/test_check_event_registrar_composition.py"
      - ".github/workflows/event-registrar-composition.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  # A component generates one event-mapping registrar per entity, and something
  # has to call each of them. An entity whose registrar nothing calls publishes
  # nothing, so its consumers follow a stale record while the generated code
  # looks present. The service builds, starts and serves, and only the events
  # are missing. This job fails when a registrar of a checked component is left
  # uncomposed.
  event-registrars:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Check every generated event registrar is composed
        run: |
          python3 projects/ores.codegen/scripts/check_event_registrar_composition.py
      - name: Install test dependencies
        run: |
          pip install --quiet pytest
      - name: Test the check
        run: |
          python3 -m pytest projects/ores.codegen/tests/test_check_event_registrar_composition.py -q
