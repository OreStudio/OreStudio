        if (verdict === 'differs') {
            return '<div class="verdict bad"><h3>Differs: the body and the engine are the same, and the result moved</h3>' +
                '<p>Run #4823 and the run it is compared with priced from ' + esc(c.label) + ' with ' +
                esc(c.engine) + '. One figure differs, which is a defect in the engine or in the code and ' +
                'not a movement of the market.</p>' +
                '<table class="diff"><thead><tr><th>Figure</th><th>#4819</th><th>#4823</th>' +
                '<th>Difference</th></tr></thead><tbody>' +
                '<tr><td>NPV &middot; total</td><td class="n">12,481,902.44</td>' +
                '<td class="n">12,481,903.11</td><td class="moved">+0.67</td></tr>' +
                '<tr><td>Delta &middot; USD</td><td class="n">-1,882,441.00</td>' +
                '<td class="n">-1,882,441.00</td><td class="n same">&mdash;</td></tr>' +
                '</tbody></table></div>';
        }
        if (verdict.indexOf('cannot') === 0) {
            var reason = verdict === 'cannot-engine'
                ? { t: 'Cannot be compared: the engine version differs',
                    p: 'The original run used ORE-Studio-7.0 and today serves ORE-Studio-7.1. The body is the ' +
                       'same and the software is not, so the two are not one result computed twice. ' +
                       'A rerun on a host still serving 7.0 would reproduce it.' }
                : verdict === 'cannot-part'
                ? { t: 'Cannot be compared: a part of the body is no longer served',
                    p: 'The body records a fixed snapshot of USD-SOFR-3M at 06 Oct 16:00Z, and the store no ' +
                       'longer serves a series it resolved. The cut kept the identity of a snapshot nothing ' +
                       'materialised, so the values cannot be read back.' }
                : { t: 'Cannot be compared: the body was retaken',
                    p: 'The original run priced from EOD.ACME-LONDON.2026-10-06 and the comparison names ' +
                       'EOD.ACME-LONDON.2026-10-06.2. A retaken body is a different body, and its figures are ' +
                       'comparable only as a movement.' };
            return '<div class="verdict caution"><h3>' + esc(reason.t) + '</h3><p>' + esc(reason.p) + '</p>' +
                '<p style="margin-top:8px">The statement is what an auditor writes down: the body, the two ' +
                'runs and the reason the same number cannot be produced.</p></div>';
        }
        return '<div class="verdict ok"><h3>Reproduced: one result computed twice</h3>' +
            '<p>Run #4823 and run #4819 priced from ' + esc(c.label) + ' with ' + esc(c.engine) +
            ', and every figure is equal. The cut is the body in both, and the engine is the same software, ' +
            'which is the definition the cluster quotes.</p>' +
            '<table class="diff"><thead><tr><th>Figure</th><th>#4819</th><th>#4823</th>' +
            '<th>Difference</th></tr></thead><tbody>' +
            '<tr><td>NPV &middot; total</td><td class="n">12,481,902.44</td>' +
            '<td class="n">12,481,902.44</td><td class="n same">&mdash;</td></tr>' +
            '<tr><td>Delta &middot; USD</td><td class="n">-1,882,441.00</td>' +
            '<td class="n">-1,882,441.00</td><td class="n same">&mdash;</td></tr>' +
            '</tbody></table></div>';
    }

    /* ---------------------------------------------------------------- */
    /* Surface 6 and 7: the named cut times, as reference data.           */
    /* ---------------------------------------------------------------- */

    var CUT_TIMES = [
        { code: 'CUT-LONDON-1600', name: 'London close', time: '16:00', tz: 'Europe/London',
          centre: 'London', kinds: 'End of day, Independent verification',
          source: 'our convention', books: 3, pairs: 14, cuts: 8 },
        { code: 'CUT-LONDON-0800', name: 'London open', time: '08:00', tz: 'Europe/London',
          centre: 'London', kinds: 'Start of day', source: 'our convention', books: 3, pairs: 0, cuts: 3 },
        { code: 'CUT-NEWYORK-1700', name: 'New York close', time: '17:00', tz: 'America/New_York',
          centre: 'New York', kinds: 'End of day', source: 'our convention', books: 1, pairs: 6, cuts: 2 },
        { code: 'CUT-TOKYO-1500', name: 'Tokyo close', time: '15:00', tz: 'Asia/Tokyo',
          centre: 'Tokyo', kinds: 'End of day', source: 'our convention', books: 1, pairs: 4, cuts: 1 },
        { code: 'EXPIRY-TOKYO-1500', name: 'Tokyo expiry cut', time: '15:00', tz: 'Asia/Tokyo',
          centre: 'Tokyo', kinds: 'Option expiry', source: 'our convention', books: 0, pairs: 9, cuts: 0 },
        { code: 'EXPIRY-NEWYORK-1000', name: 'New York expiry cut', time: '10:00', tz: 'America/New_York',
          centre: 'New York', kinds: 'Option expiry', source: 'our convention', books: 0, pairs: 11, cuts: 0 }
    ];

    function surfaceTimes() {
        if (S.fcase === 'loading')
            return timesFrame('<div class="tblstate"><b>Loading&hellip;</b>Reading the cut times.</div>');
        if (S.fcase === 'error')
            return timesFrame('<div class="notice error"><b>The cut times could not be read.</b> ' +
                'refdata.v1.cut_times.list answered with an error. <button class="btn small">Retry</button></div>');
        var rows = CUT_TIMES.map(function (t) {
            return '<tr class="pick" data-time="' + t.code + '">' +
                '<td class="key">' + esc(t.code) + '<span class="sub">' + esc(t.name) + '</span></td>' +
                '<td class="mono nowrap">' + esc(t.time) + '</td>' +
                '<td class="mono">' + esc(t.tz) + '</td>' +
                '<td>' + esc(t.centre) + '</td>' +
                '<td class="dim">' + esc(t.kinds) + '</td>' +
                '<td class="num">' + t.books + '</td>' +
                '<td class="num">' + t.pairs + '</td></tr>';
        }).join('');
        return timesFrame('<div class="panel"><table class="rows"><thead><tr><th>Cut time</th>' +
            '<th>Time of day</th><th>Timezone</th><th>Centre</th><th>Kinds it serves</th>' +
            '<th>Books</th><th>Currency pairs</th></tr></thead><tbody>' + rows + '</tbody></table>' +
            '<div class="pager"><span>1\u2013' + CUT_TIMES.length + ' of ' + CUT_TIMES.length + '</span>' +
            '<span class="right">Page size <span class="dash">15</span></span></div></div>' +
            '<p class="sentence"><b>What a cut time is.</b> A label for a time of day, with the clock that ' +
            'reads it. The end of day kind reads the centre\u2019s close from here, and an option\u2019s expiry ' +
            'reads a cut code from the same list, which is the second sense of the word.</p>' +
            '<p class="rule"><b>Our convention, not a published fact.</b> The times on this page are ours. ' +
            'No public source we verified fixes the close of a firm\u2019s business day or an option\u2019s ' +
            'expiry instant, and the cluster records the same position.</p>' +
            '<div class="gap"><b>Gap.</b> No cut time table exists. ' +
            '<code>currency_pair.default_cut_code</code> is a field the pair\u2019s entity page plans and no ' +
            'column holds, and the option expiry reads a list nothing holds either.</div>');
    }

    function timesFrame(body) {
        return '<p class="crumbs">Home <span class="sep">&rsaquo;</span> Reference data ' +
            '<span class="sep">&rsaquo;</span> Cut times</p>' +
            '<div class="pagehead"><div><h1>Cut times</h1>' +
            '<p class="lead">The times of day a cut is fixed at, with the clock that reads each one.</p></div>' +
            '<div class="actions"><span class="access">Editable</span>' +
            '<button class="btn">Refresh</button><button class="btn">Import</button>' +
            '<button class="btn">Export</button><button class="btn primary">Add</button></div></div>' +
            '<div class="listtools"><div class="searchbox"><input placeholder="Search the code or the name">' +
            '</div><select><option>Centre: all</option><option>London</option><option>New York</option>' +
            '<option>Tokyo</option></select></div>' + body;
    }

    function surfaceTime() {
        var t = CUT_TIMES[0];
        if (S.fcase === 'error')
            return timesFrame('<div class="notice error"><b>The cut time could not be read.</b> ' +
                'refdata.v1.cut_times.get answered with an error. <button class="btn small">Retry</button></div>');
        return '<p class="crumbs">Home <span class="sep">&rsaquo;</span> Reference data ' +
            '<span class="sep">&rsaquo;</span> Cut times <span class="sep">&rsaquo;</span> ' +
            esc(t.code) + '</p>' +
            '<div class="pagehead"><div><h1>' + esc(t.name) + '</h1>' +
            '<p class="lead">' + esc(t.code) + ' &middot; version 3</p></div>' +
            '<div class="actions"><span class="access">Editable</span>' +
            '<button class="btn">Edit</button><button class="btn">Delete</button></div></div>' +
            '<div class="tabs"><span class="on">Details</span><span>Used by</span><span>History</span></div>' +
            '<div class="card">' +
            '<div class="facts">' +
            fact('Code', '<span class="mono">' + esc(t.code) + '</span>') +
            fact('Name', esc(t.name)) +
            fact('Time of day', '<span class="mono">' + esc(t.time) + '</span>') +
            fact('Timezone', '<span class="mono">' + esc(t.tz) + '</span>') +
            fact('Centre', esc(t.centre)) +
            fact('Kinds it serves', esc(t.kinds)) +
            fact('Source of the time', esc(t.source)) +
            fact('Daylight saving', 'Follows the timezone, so the instant moves and the name does not') +
            '</div>' +
            '<p class="sentence">A cut time fixes a time of day rather than an instant. The instant it ' +
            'produces depends on the date, because the clock moves twice a year, and the name stays the same.</p>' +
            '<h3>What uses it</h3>' +
            '<div class="panel"><table class="rows"><thead><tr><th>What</th><th>How it uses the cut time</th>' +
            '<th class="num">Count</th></tr></thead><tbody>' +
            '<tr><td class="key">Books</td><td>The close their end of day cut is fixed at</td>' +
            '<td class="num">' + t.books + '</td></tr>' +
            '<tr><td class="key">Currency pairs</td><td>The default cut code their options inherit</td>' +
            '<td class="num">' + t.pairs + '</td></tr>' +
            '<tr><td class="key">Cuts taken</td><td>The instant each one fixed, on this date</td>' +
            '<td class="num">' + t.cuts + '</td></tr>' +
            '</tbody></table></div>' +
            '<p class="rule">A cut time cannot be deleted while a book or a pair names it. The count is how ' +
            'a person answers that question before pressing Delete.</p>' +
            lastChanged('m.oduya', '2026-10-02T11:14:00Z', 'common.non_material_update') +
            '<div class="gap"><b>Gap.</b> No such entity exists. The row is drawn from the pair\u2019s planned ' +
            '<code>default_cut_code</code> and from the option-expiry page\u2019s description of the same row.</div>' +
            '</div>';
    }

    /* ---------------------------------------------------------------- */
    /* Render.                                                            */
    /* ---------------------------------------------------------------- */

    function render() {
        var area = 'Reporting';
        if (S.surface === 'times' || S.surface === 'time') area = 'Reference data';
        document.getElementById('shell').innerHTML = shell(area);
        document.getElementById('bar').innerHTML = bar();
        var app = document.getElementById('app');
        switch (S.surface) {
        case 'record': app.innerHTML = surfaceRecord(); break;
        case 'take': app.innerHTML = surfaceTake(); break;
        case 'pick': app.innerHTML = surfacePick(); break;
        case 'run': app.innerHTML = surfaceRun(); break;
        case 'times': app.innerHTML = surfaceTimes(); break;
        case 'time': app.innerHTML = surfaceTime(); break;
        default: app.innerHTML = surfaceList();
        }
        window.scrollTo(0, 0);
    }

    document.addEventListener('click', function (e) {
        var go = e.target.closest('[data-go]');
        if (go) {
            e.preventDefault();
            location.search = go.getAttribute('data-go');
            return;
        }
        var cut = e.target.closest('[data-cut]');
        if (cut) {
            e.preventDefault();
            location.search = q({ surface: 'record', tab: 'body', cut: cut.getAttribute('data-cut'), fcase: '' });
            return;
        }
        var p = e.target.closest('[data-pick]');
        if (p) {
            e.preventDefault();
            location.search = q({ surface: 'pick', pick: p.getAttribute('data-pick') });
            return;
        }
        var t = e.target.closest('[data-time]');
        if (t) {
            e.preventDefault();
            location.search = q({ surface: 'time', fcase: '' });
            return;
        }
        var k = e.target.closest('[data-kind]');
        if (k) {
            e.preventDefault();
            location.search = q({ surface: 'take', step: '1',
                fcase: k.getAttribute('data-kind') === 'FLASH' ? 'indicative' : '' });
            return;
        }
        var r = e.target.closest('[data-run]');
        if (r) {
            e.preventDefault();
            location.search = q({ surface: 'run', fcase: '', verdict: 'reproduced' });
        }
    });

    render();
})();
</script>
</body>
</html>
