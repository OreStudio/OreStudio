<!--
  PROTOTYPE. Throwaway. Mock data, no backend, no build step.

  What this report runs, from
  doc/knowledge/journeys/reporting/journey_change_what_a_report_runs.org:
  a market-risk owner or a tenant administrator changes the set of analytics a
  report configuration carries, and reads what the change does and does not
  reach.

  The screen is a three step wizard:

    1  the definition and the five configurations it binds, each with what it
       supplies and a link to the screen that holds its data. Only conventions
       has a screen today: PATHS.conventions, /refdata/conventions. The other
       four are stated as missing, never drawn as working links.
    2  the analytics, as a switchboard of all fourteen types, one row each, with
       the on/off control, the display order and the parameters summarised.
    3  review and save: what the change reaches, that past runs keep their
       configuration, that a run either side of the change is not comparable,
       and the exact write.

  Adding an analytic is a flow of its own, because setting one up inline in the
  switchboard is too busy. It has three screens: the list of the fourteen types,
  the detail with one control per parameter, and the effect. The detail screen is
  the novel part, so the variants are three readings of that screen only:

    A  document      the explanation as a short page, the parameters in one
                     column below it
    B  two columns   explanation and calculation left, parameters and the
                     effect right
    C  guided        one parameter at a time with the explanation beside it,
                     advancing, with a summary at the end

  Switch with ?variant=A|B|C, deep-link a wizard step with ?step=1|2|3, and open
  one flow screen with ?screen=list|detail|effect&analytic=<code>. The buttons in
  the foot bar do the same.

  Nothing here reads a server. An analytic is turned off by setting active to
  false, never by deleting the row, and the page says so. pfe reads a cube that
  simulation writes, so pfe on without simulation is marked on the switchboard
  and refused in the flow; the rule lives in the ACME seeder and in no service,
  so a build could not rely on a server check. No operation says which runs were
  made with which configuration version, so the run placement here is an
  inference from start times. The complex editors for simulation and pfe -- the
  cube, the shift and the time grid -- are drawn as plain fields and are
  deferred.
-->
