---
name: Shell command composition
on:  # yamllint disable-line rule:truthy
  push:
    branches: ["main"]
    paths:
      - "projects/ores.shell/**"
      - "projects/ores.codegen/scripts/check_shell_command_composition.py"
      - "projects/ores.codegen/tests/test_check_shell_command_composition.py"
      - ".github/workflows/shell-command-composition.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  # A component generates one shell command unit per entity, and something has
  # to call each unit's register_commands(). A unit nothing calls never reaches
  # the menu, so every recipe for that entity aborts with "Wrong command" while
  # the generated code looks present. The shell builds and starts, and only the
  # verbs are missing. This job fails when a unit of a checked component is left
  # unregistered.
  shell-commands:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Check every generated shell command unit is registered
        run: |
          python3 projects/ores.codegen/scripts/check_shell_command_composition.py
      - name: Install test dependencies
        run: |
          pip install --quiet pytest
      - name: Test the check
        run: |
          python3 -m pytest projects/ores.codegen/tests/test_check_shell_command_composition.py -q
