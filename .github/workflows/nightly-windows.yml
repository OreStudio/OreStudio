# yamllint disable rule:line-length
---
name: Nightly Windows

env:
  VCPKG_BINARY_SOURCES: 'clear;files,${{ github.workspace }}/vcpkg-cache,readwrite'
  SCCACHE_DIR: '${{ github.workspace }}/.sccache'

on:  # yamllint disable-line rule:truthy
  schedule:
    # Windows left the continuous tier: the matrix (msvc/clang x debug/release)
    # takes 5-8h, which cannot fit GitHub's six-hour job limit on a continuous
    # cadence. It runs once a night, an hour after the Nightly Build.
    - cron: '0 1 * * *'
  push:
    tags:
      - '*'
  workflow_dispatch:

jobs:
  guard:
    name: relevance-guard
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      should_build: ${{ steps.guard.outputs.should_build }}
    steps:
      - uses: actions/checkout@v7
        # The guard is a local action, and a local action is read from the
        # workspace: skip this checkout and the job fails before its first step
        # with "Can't find 'action.yml'". Only a scheduled run reads the tree,
        # so the shallow clone of a manual or tag run is wasted work, but the
        # job cannot tell its action apart without it.
        with:
          fetch-depth: 0

      - uses: ./.github/actions/relevance-guard
        id: guard

  build:
    needs: guard
    if: needs.guard.outputs.should_build == 'true'
    name: ${{matrix.family}}-${{matrix.compiler}}-${{matrix.buildtype}}-ninja
    concurrency:
      group: ci-${{github.ref}}-${{github.job}}-${{matrix.family}}-${{matrix.compiler}}-${{matrix.buildtype}}-ninja
      cancel-in-progress: false
    runs-on: windows-latest
    environment: CI
    # Default GitHub Actions job timeout (360m) has been observed cutting
    # windows-msvc-release-ninja off at ~89% built with a cold sccache (run
    # 29757071366: 5h55m spent still compiling, cancelled mid-build, not a
    # real failure). sccache is deliberately not persisted across runs here
    # (see the Ccache step's comment), so a cold-cache Release build needs
    # real headroom beyond 6h.
    timeout-minutes: 480
    strategy:
      fail-fast: false
      matrix:
        name: [windows-msvc, windows-clang]
        # No debug builds: every Windows leg fails on a compile error, and the
        # debug legs take the longest. Add debug back when the release legs
        # pass.
        buildtype: [release]
        include:
          - name: windows-msvc
            family: windows
            compiler: msvc
          - name: windows-clang
            family: windows
            compiler: clang
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      # sccache is NOT cached across runs on this platform (deliberately —
      # see story canary_ctest_ignores_cancellation): GitHub's actions/cache
      # is capped at a fixed 10 GB per repository, shared across every
      # OS/compiler/buildtype variant. Linux CI jobs run on every PR, so
      # they get the shared quota; Windows only runs on a schedule/tag push
      # and doesn't need to compete for it. Revisit if/when sccache moves to
      # an external cache backend (see the sccache_external_cache_backend
      # backlog capture) that isn't quota-shared.
      - name: Install NSIS
        if: ${{ matrix.compiler == 'clang' }}
        run: choco install nsis

      - name: Enable Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1.13.0

      - name: Use the Clang Visual Studio ships
        # The runner image's MSVC standard library refuses any compiler older than
        # the Clang that ships with it (error STL1000 in yvals_core.h), and no
        # standalone LLVM release exists for Windows that satisfies it. The
        # toolchain that always matches the image's STL is the one inside Visual
        # Studio, so the leg uses that and installs nothing.
        if: ${{ matrix.compiler == 'clang' }}
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $component = 'Microsoft.VisualStudio.Component.VC.Llvm.Clang'
          $find = { & $vswhere -latest -products * -requires $component -find 'VC\Tools\Llvm\x64\bin\clang++.exe' }

          $clang = & $find
          if (-not $clang) {
              Write-Host "The Visual Studio instance lacks the Clang component; adding it."
              $instance = & $vswhere -latest -products * -property installationPath
              $setup = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\setup.exe'
              & $setup modify --installPath $instance --add $component --quiet --norestart --wait | Out-Null
              $clang = & $find
          }
          if (-not $clang) {
              Write-Error 'No clang++.exe came with Visual Studio, so the clang leg cannot build.'
              exit 1
          }
          $dir = Split-Path $clang
          (& $clang --version 2>&1 | Select-Object -First 1) | Write-Host
          $dir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      # sccache is NOT kept across runs on this platform (deliberately -- see
      # story canary_ctest_ignores_cancellation): GitHub's actions/cache is
      # capped at a fixed 10 GB per repository, shared across every
      # OS/compiler/buildtype variant. Linux CI jobs run on every PR, so they get
      # the shared quota; Windows only runs on a schedule/tag push and doesn't need
      # to compete for it. Revisit if/when sccache moves to an external cache
      # backend (see the sccache_external_cache_backend backlog capture) that
      # isn't quota-shared.
      - uses: ./.github/actions/setup-sccache
        with:
          variant: ${{matrix.family}}-${{matrix.compiler}}-${{matrix.buildtype}}-ninja
          restore: 'false'
          max-size: '1000M'

      - uses: ./.github/actions/build-leg
        with:
          family: ${{matrix.family}}
          compiler: ${{matrix.compiler}}
          buildtype: ${{matrix.buildtype}}
          tier: nightly
          persist-cache: 'false'

  attach_package:
    name: Attach packages to the release
    needs: build
    # Attach what passed, so one failed build does not cost the others.
    if: ${{ !cancelled() && github.ref_type == 'tag' && needs.build.result != 'skipped' }}
    # A called workflow can only downgrade the token its caller passes, so the
    # caller grants what the attachment asks for. Without this line the platform
    # refuses the whole workflow at start, before any job runs.
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/attach-package.yml
    with:
      pattern: windows-*-release-ninja
