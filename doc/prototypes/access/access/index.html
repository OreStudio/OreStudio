<head>
<meta charset="utf-8">
<!--
  PROTOTYPE. Throwaway. Mock people, no backend, no build step.

  The access screens: a member's own access, a tenant administrator's grant
  and revoke, and the role catalogue with its permission picker. The roles and
  the permission catalogue are the deployment's real seed data; the people and
  their grants are mock. The bar at the bottom switches who is signed in.
-->
<title>ORE Studio Access</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
/* Layout: the product's own shell — a header with the areas, one working column, and a prototype bar pinned below.
   Colour and type are the web app's tokens (projects/ores.web/packages/web/src/styles.css), so the prototype is judged
   on its words and structure rather than on a new look. The product is dark only, and so is this. */
:root {
  color-scheme: dark;
  --bg: #121214;
  --raised: #1a1a1e;
  --overlay: #26262b;
  --line-subtle: #21262d;
  --line: #30363d;
  --line-strong: #4a5568;
  --ink: #e3e3e6;
  --ink-muted: #a1a1aa;
  --ink-faint: #71717a;
  --ink-inverse: #0d1117;
  --accent: #58a6ff;
  --accent-bright: #8ab4f8;
  --accent-dim: #1b2a3d;
  --up: #3fb950;
  --up-strong: #238636;
  --down-strong: #da3633;
  --purple: #8957e5;
  --down: #f85149;
  --warn: #d29922;
  --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  --mono: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  --radius: 0.5rem;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { background: var(--bg); color: var(--ink); }
body { margin: 0; font: 14px/1.5 var(--sans); padding-bottom: 7rem; }
button, input, select { font: inherit; color: inherit; }
a { color: var(--accent); text-decoration: none; }
a:hover { color: var(--accent-bright); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { margin: 0; text-wrap: balance; font-weight: 600; letter-spacing: -0.01em; }
h1 { font-size: 1.375rem; }
h2 { font-size: 1rem; }
h3 { font-size: 0.875rem; }
p { margin: 0; }
.muted { color: var(--ink-muted); }
.faint { color: var(--ink-faint); }
.num { font-variant-numeric: tabular-nums; }

/* Header */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--raised); border-bottom: 1px solid var(--line); }
.top-inner { max-width: 72rem; margin: 0 auto; padding: 0.5rem 1rem; display: flex; align-items: center; gap: 1.25rem; flex-wrap: wrap; }
.brand { font-weight: 700; letter-spacing: 0.02em; display: flex; align-items: center; gap: 0.5rem; white-space: nowrap; }
.brand-mark { width: 1.25rem; height: 1.25rem; border-radius: 4px; background: linear-gradient(135deg, var(--accent), #1f6feb); }
.place { font-size: 12px; color: var(--ink-muted); border-left: 1px solid var(--line); padding-left: 1rem; white-space: nowrap; }
.menu { display: flex; gap: 0.25rem; flex-wrap: wrap; flex: 1; min-width: 0; }
.menu button { background: none; border: 0; padding: 0.375rem 0.625rem; border-radius: 6px; color: var(--ink-muted); cursor: pointer; }
.menu button:hover { background: var(--overlay); color: var(--ink); }
.menu button[aria-current="page"] { color: var(--ink); background: var(--overlay); }
.menu button.soon { color: var(--ink-faint); }
.me { display: flex; align-items: center; gap: 0.5rem; background: none; border: 1px solid transparent; border-radius: 999px; padding: 0.125rem 0.625rem 0.125rem 0.125rem; cursor: pointer; }
.me:hover { border-color: var(--line); }
.avatar { width: 1.75rem; height: 1.75rem; border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-weight: 700; background: var(--accent-dim); color: var(--accent-bright); }
.me-menu { position: absolute; right: 1rem; top: 3.25rem; width: 16rem; background: var(--overlay); border: 1px solid var(--line); border-radius: var(--radius); padding: 0.5rem; box-shadow: 0 12px 32px rgba(0,0,0,0.45); }
.me-menu .who { padding: 0.5rem; border-bottom: 1px solid var(--line); margin-bottom: 0.25rem; }
.me-menu button { display: block; width: 100%; text-align: left; background: none; border: 0; padding: 0.4rem 0.5rem; border-radius: 6px; cursor: pointer; }
.me-menu button:hover { background: var(--raised); }

/* Page */
main { max-width: 72rem; margin: 0 auto; padding: 1.5rem 1rem; display: grid; gap: 1.5rem; }
.crumbs { font-size: 12px; color: var(--ink-faint); display: flex; gap: 0.375rem; flex-wrap: wrap; }
.crumbs button { background: none; border: 0; padding: 0; color: var(--accent); cursor: pointer; }
.head { display: flex; align-items: flex-end; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
.head > div { min-width: 0; display: grid; gap: 0.25rem; }
.actions { display: flex; gap: 0.5rem; flex-wrap: wrap; }
.btn { border: 1px solid var(--line); background: var(--raised); padding: 0.4375rem 0.875rem; border-radius: 6px; cursor: pointer; white-space: nowrap; }
.btn:hover { border-color: var(--line-strong); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #0d1117; font-weight: 600; }
.btn.primary:hover { background: var(--accent-bright); border-color: var(--accent-bright); }
.btn.danger { color: var(--down); }
.btn.danger.solid { background: #b62324; border-color: #b62324; color: #fff; }
.btn[disabled] { opacity: 0.45; cursor: not-allowed; }
.card { background: var(--raised); border: 1px solid var(--line); border-radius: var(--radius); }
.pad { padding: 1.25rem; }
.grid { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fit, minmax(15rem, 1fr)); }
.stat { display: grid; gap: 0.25rem; }
.stat .big { font-size: 1.75rem; font-weight: 600; font-variant-numeric: tabular-nums; }
.stat .label { font-size: 12px; color: var(--ink-muted); text-transform: uppercase; letter-spacing: 0.06em; }
.list { display: grid; }
.row { display: flex; align-items: center; gap: 0.75rem; padding: 0.75rem 1.25rem; border-top: 1px solid var(--line-subtle); }
.row:first-child { border-top: 0; }
.row > .grow { flex: 1; min-width: 0; }
.dot { width: 0.5rem; height: 0.5rem; border-radius: 50%; flex: none; }
.dot.ok { background: var(--up); } .dot.warn { background: var(--warn); } .dot.bad { background: var(--down); } .dot.idle { background: var(--ink-faint); }
.chip { display: inline-flex; align-items: center; gap: 0.3rem; font-size: 11px; padding: 0.0625rem 0.5rem; border-radius: 999px; border: 1px solid var(--line); color: var(--ink-muted); white-space: nowrap; }
.chip { font-weight: 600; }
.chip.production { color: #0d1117; border-color: var(--accent); background: var(--accent); }
.chip.evaluation { color: #fff; border-color: var(--purple); background: var(--purple); }
.chip.automation { color: var(--ink-muted); border-color: var(--line-strong); background: var(--overlay); }
.chip.active { color: #fff; border-color: var(--up-strong); background: var(--up-strong); }
.chip.suspended { color: #1a1300; border-color: var(--warn); background: var(--warn); }
.chip.setting-up { color: #0d1117; border-color: var(--accent-bright); background: var(--accent-bright); }
.chip.failed { color: #fff; border-color: var(--down-strong); background: var(--down-strong); }
.chip.view { color: var(--ink-muted); font-weight: 500; }
.section-title { font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-faint); }
.tiles { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fill, minmax(14rem, 1fr)); }
.tile { text-align: left; background: var(--raised); border: 1px solid var(--line); border-radius: var(--radius); padding: 1rem; cursor: pointer; display: grid; gap: 0.375rem; align-content: start; }
.tile:hover { border-color: var(--line-strong); }
.tile.soon { cursor: default; opacity: 0.7; }
.tile.soon:hover { border-color: var(--line); }
.tile .t { font-weight: 600; }

/* Health */
.health { display: grid; gap: 1.5rem; grid-template-columns: repeat(auto-fit, minmax(12rem, 1fr)); align-items: start; }
.verdict { display: flex; gap: 0.75rem; align-items: center; }
.verdict .mark { width: 2.25rem; height: 2.25rem; border-radius: 50%; display: grid; place-items: center; flex: none; font-weight: 700; }
.verdict.ok .mark { background: #12361d; color: var(--up); border: 1px solid #1f5d2b; }
.verdict.warn .mark { background: #3a2a0a; color: var(--warn); border: 1px solid #6b4e12; }
.activity { border-left: 2px solid var(--up-strong); padding-left: 0.75rem; display: grid; gap: 0.5rem; font-size: 13px; }
.activity .when { font-size: 12px; color: var(--ink-faint); }

/* Tables */
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; font-weight: 500; color: var(--ink-muted); font-size: 12px; padding: 0.625rem 0.75rem; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 0.625rem 0.75rem; border-bottom: 1px solid var(--line-subtle); vertical-align: middle; }
tbody tr { cursor: pointer; }
tbody tr:hover { background: #1f1f24; }
tbody tr[aria-selected="true"] { background: var(--accent-dim); }
td.code { font-family: var(--mono); font-size: 12px; color: var(--ink-muted); }
.toolbar { display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: center; padding: 0.75rem; border-bottom: 1px solid var(--line); }
.toolbar input[type=search], .toolbar select, .field input, .field select { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 0.375rem 0.625rem; }
.toolbar input[type=search] { flex: 1; min-width: 10rem; }
.toolbar label { display: inline-flex; gap: 0.375rem; align-items: center; color: var(--ink-muted); font-size: 13px; }
.foot { display: flex; justify-content: space-between; align-items: center; gap: 0.75rem; padding: 0.625rem 0.75rem; font-size: 12px; color: var(--ink-muted); flex-wrap: wrap; }
.progress { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; width: 6rem; }
.progress > span { display: block; height: 100%; background: var(--accent); }

/* Tabs */
.tabs { display: flex; gap: 0.25rem; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.tabs button { background: none; border: 0; border-bottom: 2px solid transparent; padding: 0.5rem 0.75rem; color: var(--ink-muted); cursor: pointer; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
dl { display: grid; grid-template-columns: repeat(auto-fit, minmax(12rem, 1fr)); gap: 1rem; margin: 0; }
dt { font-size: 12px; color: var(--ink-faint); }
dd { margin: 0.125rem 0 0; }

/* Dialog */
.scrim { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: grid; place-items: center; padding: 1rem; z-index: 20; }
.dialog { width: min(32rem, 100%); background: var(--raised); border: 1px solid var(--line); border-radius: var(--radius); padding: 1.25rem; display: grid; gap: 1rem; }
.field { display: grid; gap: 0.375rem; }
.field label { font-size: 13px; color: var(--ink-muted); }
.field input, .field select { width: 100%; }
.form-grid { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fit, minmax(14rem, 1fr)); }
.warnbox { border: 1px solid #7a2a28; background: #2a1414; border-radius: 6px; padding: 0.75rem; color: #ffb4ad; font-size: 13px; }
.note { border: 1px solid var(--line); background: var(--bg); border-radius: 6px; padding: 0.75rem; font-size: 13px; color: var(--ink-muted); }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: 6.5rem; background: var(--overlay); border: 1px solid var(--line); padding: 0.5rem 1rem; border-radius: 6px; z-index: 30; }

/* Prototype bar */
.proto { position: fixed; left: 0; right: 0; bottom: 0; background: #0b0b0d; border-top: 1px dashed var(--line-strong); padding: 0.5rem 1rem calc(0.5rem + env(safe-area-inset-bottom, 0px)); z-index: 10; }
.proto-inner { max-width: 72rem; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 0.5rem 1rem; align-items: center; font-size: 12px; color: var(--ink-faint); }
.proto strong { color: var(--warn); letter-spacing: 0.06em; }
.proto .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.proto .seg button { background: none; border: 0; padding: 0.25rem 0.625rem; color: var(--ink-muted); cursor: pointer; }
.proto .seg button[aria-pressed="true"] { background: var(--overlay); color: var(--ink); }
.proto .why { margin-left: auto; background: none; border: 1px solid var(--line); border-radius: 6px; padding: 0.25rem 0.625rem; color: var(--ink-muted); cursor: pointer; }
.proto .why[aria-pressed="true"] { background: var(--overlay); color: var(--ink); border-color: var(--line-strong); }
.why-head { display: flex; justify-content: space-between; align-items: center; gap: 0.5rem; }
.why-close { background: none; border: 1px solid var(--line); border-radius: 6px; padding: 0.125rem 0.5rem; color: var(--ink-muted); cursor: pointer; }
.why-panel { position: fixed; right: 1rem; bottom: 4.5rem; width: min(26rem, calc(100% - 2rem)); max-height: 60vh; overflow: auto; background: var(--overlay); border: 1px solid var(--line); border-radius: var(--radius); padding: 1rem; z-index: 15; font-size: 13px; display: grid; gap: 0.625rem; }
.why-panel ul { margin: 0; padding-left: 1.1rem; display: grid; gap: 0.375rem; color: var(--ink-muted); }
@media (prefers-reduced-motion: no-preference) { .tile, .btn, tbody tr { transition: border-color .15s, background .15s; } }
@media (max-width: 40rem) { .place { display: none; } .hide-sm { display: none; } }
/* Access */
.face { border-radius: 50%; object-fit: cover; flex: none; background: var(--accent-dim); }
.who-cell { display: flex; align-items: center; gap: 0.625rem; }
.inline-face { display: inline-flex; align-items: center; gap: 0.375rem; vertical-align: middle; }
.head > .actions { display: flex; }
.chip[data-person-link] { color: var(--ink); }
.held { display: grid; gap: 0; }
.attr { font-size: 12px; color: var(--ink-faint); }
.areas { display: grid; gap: 0.5rem; }
.area { border: 1px solid var(--line); border-radius: var(--radius); background: var(--raised); }

.area > summary::-webkit-details-marker { display: none; }

.tick { color: var(--up); font-weight: 700; }
.none { color: var(--line-strong); }
.other { font-size: 12px; color: var(--ink-muted); }
.cb { width: 1rem; height: 1rem; accent-color: var(--accent); cursor: pointer; }

.everything { border: 1px solid #1f5d2b; background: #12361d; border-radius: var(--radius); padding: 0.875rem 1rem; display: flex; gap: 0.75rem; align-items: center; }

.diff { display: flex; gap: 0.75rem; font-size: 13px; }

.pick.held-already { opacity: 0.5; cursor: default; }
.chips { display: flex; gap: 0.25rem; flex-wrap: wrap; }

textarea { font: inherit; color: inherit; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 0.375rem 0.625rem; width: 100%; min-height: 4rem; }
.answer { border-left: 2px solid var(--accent); padding-left: 0.75rem; font-size: 13px; }
</style>
</head>

    const who = personOf(r.login);
    const role = roleOf(r.role);
    const self = r.login === PERSONAS[state.persona].login;
    return `
      <div class="crumbs"><button data-go="requests">Requests</button><span>/</span><span>${esc(who.name)}</span></div>
      <div class="head"><div class="who-cell" style="display:flex">${face(r.login, 56)}<div><h1>${esc(who.name)} asks for ${esc(label(r.role))}</h1><p class="muted">Asked ${esc(r.asked)} · waiting ${esc(r.age)}</p></div></div></div>
      <div class="card pad" style="display:grid;gap:0.75rem">
        <div class="answer"><div class="faint" style="font-size:12px">Why they need it</div>${esc(r.why)}</div>
        <dl><div><dt>They hold now</dt><dd>${who.grants.length ? who.grants.map((g) => esc(label(g.role))).join(', ') : 'No role'}</dd></div><div><dt>${esc(label(r.role))} is for</dt><dd>${esc(role.description)}</dd></div></dl>
      </div>
      <div style="display:grid;gap:0.75rem"><h2>What ${esc(label(r.role))} would let them do</h2>
        ${areas(role.codes, { readOnly: true, login: r.login, onlyGranted: true, plain: true })}</div>
      <div class="card pad" style="display:grid;gap:0.75rem">
        <h2>Your answer</h2>
        ${self ? '<p class="warnbox">You asked for this yourself, so another administrator answers it.</p>' : ''}
        <div class="field"><label for="answer">Reason <span class="faint">(needed to refuse; ${esc(who.name.split(' ')[0])} reads it)</span></label><textarea id="answer"></textarea></div>
        <div class="actions"><button class="btn primary" id="approve" ${self ? 'disabled' : ''}>Give ${esc(label(r.role))}</button><button class="btn danger" id="refuse" disabled>Refuse</button></div>
      </div>`;
  }

  /* The catalogue by area. Read-only for a member's own access; ticks for a role's bundle. */
  function areas(set, opts) {
    const filter = (state.filter || '').trim().toLowerCase();
    const out = [];
    for (const [component, resources] of TREE) {
      const whole = set.has(`${component}::*`) || set.has('*');
      let rows = [...resources.entries()].sort((a, b) => a[0].localeCompare(b[0]));
      if (filter) rows = rows.filter(([r]) => r.includes(filter) || component.includes(filter) || (COMPONENT_NAMES[component] || '').toLowerCase().includes(filter));
      const held = (r, a) => covers(set, `${component}::${r}:${a}`);
      if (opts.onlyGranted || (opts.edit && state.onlyTicked)) rows = rows.filter(([r, acts]) => [...acts].some((a) => held(r, a)));
      if (rows.length === 0) continue;
      const total = [...resources.values()].reduce((n, a) => n + a.size, 0);
      const have = [...resources.entries()].reduce((n, [r, a]) => n + [...a].filter((x) => held(r, x)).length, 0);
      const cell = (r, a, acts) => {
        if (!acts.has(a)) return '<td class="act none">·</td>';
        if (opts.readOnly) return `<td class="act">${held(r, a) ? '<span class="tick" title="' + (opts.plain ? '' : esc(rolesGranting(opts.login, `${component}::${r}:${a}`).join(', '))) + '">✓</span>' : '<span class="none">–</span>'}</td>`;
        return `<td class="act"><input type="checkbox" class="cb" data-code="${component}::${r}:${a}" ${held(r, a) ? 'checked' : ''} ${whole ? 'disabled' : ''} aria-label="${esc(r + ' ' + a)}"></td>`;
      };
      out.push(`
        <details class="area" ${filter || opts.onlyGranted || (opts.edit && state.onlyTicked) ? 'open' : ''}>
          <summary><span class="caret">▸</span><span class="grow"><strong>${esc(COMPONENT_NAMES[component] || component)}</strong> <span class="faint code" style="font-size:12px">${esc(component)}</span></span>
            ${opts.edit ? `<label class="other" onclick="event.stopPropagation()"><input type="checkbox" class="cb" data-code="${component}::*" ${set.has(component + '::*') ? 'checked' : ''}> All of it</label>` : ''}
            <span class="muted num" style="font-size:12px">${whole ? 'All ' + total : have + ' of ' + total}</span></summary>
          <div class="grid-wrap"><table class="perm-grid"><thead><tr><th>What</th>${MAIN.map((a) => `<th class="act">${a[0].toUpperCase() + a.slice(1)}</th>`).join('')}<th class="oth">Other</th></tr></thead><tbody>
            ${rows.map(([r, acts]) => {
              const others = [...acts].filter((a) => !MAIN.includes(a));
              return `<tr><td class="res">${esc(r.replace(/_/g, ' '))}</td>${MAIN.map((a) => cell(r, a, acts)).join('')}
                <td class="other">${others.map((a) => opts.readOnly ? (held(r, a) ? '✓ ' : '– ') + esc(a) : `<label><input type="checkbox" class="cb" data-code="${component}::${r}:${a}" ${held(r, a) ? 'checked' : ''} ${whole ? 'disabled' : ''}> ${esc(a)}</label>`).join(' ')}</td></tr>`;
            }).join('')}
          </tbody></table></div>
        </details>`);
    }
    return `<div class="areas">${out.join('') || '<p class="muted">Nothing matches.</p>'}</div>`;
  }

  /* ---------- People ---------- */
  function peopleList() {
    return `
      <div class="head"><div><h1>People</h1><p class="muted">Who can sign in to Acme Corporation, and the roles each one holds.</p></div></div>
      <div class="card"><div class="table-wrap"><table><thead><tr><th>Name</th><th>Roles</th><th class="hide-sm">Last signed in</th></tr></thead><tbody>
        ${people.map((p) => `<tr data-person="${p.login}"><td><div class="who-cell">${face(p.login, 36)}<div><div>${esc(p.name)}</div><div class="faint" style="font-size:12px">${esc(p.login)} · ${esc(p.title)}</div></div></div></td>
          <td><div class="chips">${p.grants.length ? p.grants.map((g) => `<span class="chip view">${esc(label(g.role))}</span>`).join('') : '<span class="faint">No role</span>'}</div></td><td class="hide-sm muted">${esc(p.last)}</td></tr>`).join('')}
      </tbody></table></div></div>`;
  }

  function person() {
    const p = personOf(state.person);
    const self = p.login === PERSONAS[state.persona].login;
    return `
      <div class="crumbs"><button data-go="people">People</button><span>/</span><span>${esc(p.name)}</span></div>
      <div class="head"><div class="who-cell" style="display:flex">${face(p.login, 56)}<div><h1>${esc(p.name)}</h1><p class="muted">${esc(p.login)} · ${esc(p.title)}</p></div></div>
        <div class="actions"><button class="btn primary" id="grant">Give a role</button></div></div>
      <div class="card">
        <div class="pad" style="padding-bottom:0.5rem"><h2>Roles held</h2></div>
        <div class="table-wrap"><table><thead><tr><th>Role</th><th>Given by</th><th>On</th><th>Why</th><th></th></tr></thead><tbody>
          ${p.grants.length === 0 ? '<tr><td colspan="5" class="muted">No role. They can sign in but do nothing yet.</td></tr>' : p.grants.map((g, i) => `<tr><td><strong>${esc(label(g.role))}</strong><div class="faint" style="font-size:12px">${esc(roleOf(g.role).description)}</div></td>
            <td>${byLine(g.by)}</td><td class="muted">${esc(g.on)}</td><td>${esc(g.reason)}${g.note ? `<div class="faint" style="font-size:12px">${esc(g.note)}</div>` : ''}</td>
            <td style="text-align:right"><button class="btn danger" data-revoke="${i}" ${self && roleOf(g.role).codes.has('*') ? 'disabled title="You cannot take your own administration away"' : ''}>Take away</button></td></tr>`).join('')}
        </tbody></table></div>
      </div>
      <p class="note">A change reaches ${esc(p.name.split(' ')[0])} within 30 minutes, when their sign-in next renews. Signing in again applies it at once.</p>
      <div style="display:grid;gap:0.75rem"><h2>What these roles let them do</h2>${grantsOf(p.login).has('*') ? '<div class="everything"><span class="mark">✓</span><strong>Everything</strong></div>' : areas(grantsOf(p.login), { readOnly: true, login: p.login, onlyGranted: true })}</div>`;
  }

  function grantDialog() {
    const p = personOf(state.person);
    const offered = roles.filter((r) => !r.service);
    $('dialog-host').innerHTML = `<div class="scrim"><div class="dialog" role="dialog" aria-modal="true" aria-label="Give a role">
      <h2 class="who-cell">${face(p.login, 32)}Give ${esc(p.name)} a role</h2>
      <div class="picker">${offered.map((r) => { const has = p.grants.some((g) => g.role === r.name); return `
        <label class="pick ${has ? 'held-already' : ''}"><input type="radio" name="role" value="${r.name}" ${has ? 'disabled' : ''}>
          <span><strong>${esc(label(r.name))}</strong>${has ? ' <span class="faint">· already held</span>' : ''}<div class="muted" style="font-size:13px">${esc(r.description)}</div>
          <div class="faint" style="font-size:12px">${r.codes.has('*') ? 'Every permission' : r.codes.size + ' permissions'}</div></span></label>`; }).join('')}</div>
      ${reasonFields()}
      <div class="actions" style="justify-content:flex-end"><button class="btn" data-close>Cancel</button><button class="btn primary" id="do-grant" disabled>Give role</button></div>
    </div></div>`;
    const ok = () => { $('do-grant').disabled = !document.querySelector('input[name=role]:checked') || $('reason').value === ''; };
    document.querySelectorAll('input[name=role]').forEach((el) => el.addEventListener('change', ok));
    $('reason').addEventListener('change', ok);
    $('do-grant').onclick = () => {
      const role = document.querySelector('input[name=role]:checked').value;
      p.grants.push({ role, by: PERSONAS[state.persona].login, on: '4 Oct 2026', reason: $('reason').value, note: $('note').value });
      closeDialog(); toast(`${label(role)} given to ${p.name}.`); render();
    };
    bindClose();
  }

  function revokeDialog(i) {
    const p = personOf(state.person);
    const g = p.grants[i];
    $('dialog-host').innerHTML = `<div class="scrim"><div class="dialog" role="dialog" aria-modal="true" aria-label="Take a role away">
      <h2 class="who-cell">${face(p.login, 32)}Take ${esc(label(g.role))} away from ${esc(p.name)}?</h2>
      <p class="muted">The grant is closed, not deleted, so who held the role and when stays on record.</p>
      ${reasonFields()}
      <div class="actions" style="justify-content:flex-end"><button class="btn" data-close>Cancel</button><button class="btn danger solid" id="do-revoke" disabled>Take away</button></div>
    </div></div>`;
    $('reason').addEventListener('change', () => { $('do-revoke').disabled = $('reason').value === ''; });
    $('do-revoke').onclick = () => { p.grants.splice(i, 1); closeDialog(); toast(`${label(g.role)} taken away from ${p.name}.`); render(); };
    bindClose();
  }

  function reasonFields() {
    return `<div class="form-grid"><div class="field"><label for="reason">Why</label><select id="reason"><option value="">Choose a reason</option>${REASONS.map((r) => `<option>${r}</option>`).join('')}</select></div>
      <div class="field"><label for="note">Note <span class="faint">(optional)</span></label><input id="note" placeholder="For example: covering the settlement desk"></div></div>`;
  }
  function closeDialog() { $('dialog-host').innerHTML = ''; }
  function bindClose() { document.querySelectorAll('[data-close]').forEach((b) => { b.onclick = closeDialog; }); document.querySelector('.scrim').onclick = (e) => { if (e.target.classList.contains('scrim')) closeDialog(); }; }

  /* ---------- Roles ---------- */
  function roleList() {
    const shown = roles.filter((r) => state.showService || !r.service);
    const hidden = roles.filter((r) => r.service).length;
    return `
      <div class="head"><div><h1>Roles</h1><p class="muted">What each role lets people do. Give a role to someone from People.</p></div>
        <div class="actions"><button class="btn primary" id="new-role">New role</button></div></div>
      <div class="card">
        <div class="toolbar"><label><input type="checkbox" id="show-service" ${state.showService ? 'checked' : ''}> Show service roles</label><span class="faint">${state.showService ? '' : hidden + ' service roles hidden. They belong to the platform\'s own services, not to people.'}</span></div>
        <div class="table-wrap"><table><thead><tr><th>Role</th><th>Lets people</th><th class="num">People</th></tr></thead><tbody>
          ${shown.map((r) => `<tr data-role="${r.name}"><td><strong>${esc(label(r.name))}</strong>${r.service ? ' <span class="chip view">Service</span>' : ''}<div class="faint" style="font-size:12px">${esc(r.description)}</div></td>
            <td class="muted">${r.codes.has('*') ? 'Do everything' : r.service ? '—' : r.codes.size + ' things'}</td><td class="num">${holders(r.name).length}</td></tr>`).join('')}
        </tbody></table></div></div>`;
  }

  function role() {
    const r = roleOf(state.role);
    if (state.draft === null) state.draft = new Set(r.codes);
    const d = state.draft;
    const added = [...d].filter((c) => !r.codes.has(c));
    const removed = [...r.codes].filter((c) => !d.has(c));
    const who = holders(r.name);
    const locked = r.codes.has('*') || r.service;
    return `
      <div class="crumbs"><button data-go="roles">Roles</button><span>/</span><span>${esc(label(r.name))}</span></div>
      <div class="head"><div><h1>${esc(label(r.name))}</h1><p class="muted">${esc(r.description)}</p></div>
        <div class="actions"><button class="btn" id="edit-details">Rename or describe</button><button class="btn danger" id="delete-role" ${who.length ? 'disabled title="Take it away from everyone first"' : ''}>Delete role</button></div></div>
      <div class="card pad" style="display:grid;gap:0.5rem"><h2>Held by</h2>
        <div class="chips">${who.length ? who.map((p) => `<button class="chip view" data-person-link="${p.login}" style="cursor:pointer;padding-left:0.125rem">${face(p.login, 20)}${esc(p.name)}</button>`).join('') : '<span class="faint">Nobody yet.</span>'}</div></div>
      ${locked ? `<div class="everything"><span class="mark">✓</span><div><strong>${r.service ? 'A service role' : 'Everything'}</strong><div class="muted" style="font-size:13px">${r.service ? 'It belongs to a platform service and is not changed here.' : 'This role grants every permission. Its bundle is not edited here.'}</div></div></div>` : `
      <div style="display:grid;gap:0.75rem">
        <div class="head"><div><h2>What it lets people do</h2><p class="muted">Tick what the role allows. "All of it" covers an area, including what is added to it later.</p></div></div>
        <div class="toolbar card"><input type="search" id="filter" placeholder="Find: currencies, trades, portfolios" value="${esc(state.filter)}"><label><input type="checkbox" id="only-ticked" ${state.onlyTicked ? 'checked' : ''}> Only what it allows</label></div>
        ${areas(d, { edit: true })}
        <div class="sticky-save"><div class="diff">${added.length || removed.length ? `<span class="add">+${added.length} added</span><span class="rem">−${removed.length} removed</span>` : '<span class="muted">No changes</span>'}</div>
          <div class="actions"><button class="btn" id="discard" ${added.length || removed.length ? '' : 'disabled'}>Discard</button><button class="btn primary" id="save-bundle" ${added.length || removed.length ? '' : 'disabled'}>Save${who.length ? ' for ' + who.length + (who.length === 1 ? ' person' : ' people') : ''}</button></div></div>
      </div>`}`;
  }

  function saveDialog() {
    const r = roleOf(state.role);
    const d = state.draft;
    const added = [...d].filter((c) => !r.codes.has(c));
    const removed = [...r.codes].filter((c) => !d.has(c));
    const who = holders(r.name);
    const line = (c) => `<li><span class="code" style="font-family:var(--mono);font-size:12px">${esc(c)}</span> <span class="faint">${esc(DESCRIPTION.get(c) || '')}</span></li>`;
    $('dialog-host').innerHTML = `<div class="scrim"><div class="dialog" role="dialog" aria-modal="true" aria-label="Save the role">
      <h2>Save ${esc(label(r.name))}?</h2>
      ${who.length ? `<p class="muted">${who.map((p) => byLine(p.login)).join(', ')} ${who.length === 1 ? 'holds' : 'hold'} this role. The change reaches them within 30 minutes.</p>` : ''}
      ${added.length ? `<div><div class="diff"><span class="add">Allows</span></div><ul style="margin:0.25rem 0 0;padding-left:1.1rem">${added.slice(0, 8).map(line).join('')}${added.length > 8 ? `<li class="faint">and ${added.length - 8} more</li>` : ''}</ul></div>` : ''}
      ${removed.length ? `<div><div class="diff"><span class="rem">No longer allows</span></div><ul style="margin:0.25rem 0 0;padding-left:1.1rem">${removed.slice(0, 8).map(line).join('')}${removed.length > 8 ? `<li class="faint">and ${removed.length - 8} more</li>` : ''}</ul></div>` : ''}
      ${reasonFields()}
      <div class="actions" style="justify-content:flex-end"><button class="btn" data-close>Cancel</button><button class="btn primary" id="do-save" disabled>Save</button></div>
    </div></div>`;
    $('reason').addEventListener('change', () => { $('do-save').disabled = $('reason').value === ''; });
    $('do-save').onclick = () => { r.codes = new Set(d); state.draft = null; closeDialog(); toast(`${label(r.name)} saved.`); render(); };
    bindClose();
  }

  function newRoleDialog(existing) {
    const r = existing ? roleOf(existing) : null;
    $('dialog-host').innerHTML = `<div class="scrim"><div class="dialog" role="dialog" aria-modal="true" aria-label="${r ? 'Rename or describe' : 'New role'}">
      <h2>${r ? 'Rename or describe ' + esc(label(r.name)) : 'New role'}</h2>
      <div class="field"><label for="rname">Name</label><input id="rname" value="${r ? esc(r.name) : ''}" placeholder="For example: Settlements"></div>
      <div class="field"><label for="rdesc">What it is for</label><textarea id="rdesc">${r ? esc(r.description) : ''}</textarea></div>
      ${r ? '' : '<p class="muted">The role starts allowing nothing. You choose what it allows next.</p>'}
      <div class="actions" style="justify-content:flex-end"><button class="btn" data-close>Cancel</button><button class="btn primary" id="do-role">${r ? 'Save' : 'Create role'}</button></div>
    </div></div>`;
    $('do-role').onclick = () => {
      const name = $('rname').value.trim();
      if (!name) return;
      if (r) { r.description = $('rdesc').value; closeDialog(); render(); return; }
      roles.unshift({ name, description: $('rdesc').value || 'No description yet', codes: new Set(), service: false });
      closeDialog(); go('role', { role: name, draft: null, filter: '', onlyTicked: false });
    };
    bindClose();
  }

  function home() {
    const me = PERSONAS[state.persona];
    if (!me.admin) return `<div class="head"><div><h1>Good morning, Daniel</h1><p class="muted">Most areas are not in this release yet.</p></div></div>
      <div class="tiles"><button class="tile" data-go="mine"><span class="t">My access</span><span class="muted">The roles you hold and what they let you do.</span></button></div>`;
    return `<div class="head"><div><h1>Good morning, Priya</h1><p class="muted">Acme Corporation</p></div></div>
      <div class="tiles"><button class="tile" data-go="people"><span class="t">People</span><span class="muted">${people.length} people, and the roles each holds.</span></button>
        <button class="tile" data-go="requests"><span class="t">Requests</span><span class="muted">${waiting().length ? waiting().length + ' waiting for an answer.' : 'Nothing waiting.'}</span></button>
        <button class="tile" data-go="roles"><span class="t">Roles</span><span class="muted">${roles.filter((r) => !r.service).length} roles, and what each lets people do.</span></button></div>`;
  }

  function soon(what) { return `<div class="head"><div><h1>${esc(what)}</h1><p class="muted">Not part of this prototype.</p></div></div>`; }

  function render() {
    renderHeader();
    const s = state.screen;
    $('app').innerHTML = s === 'mine' ? mine() : s === 'people' ? peopleList() : s === 'person' ? person() : s === 'roles' ? roleList() : s === 'requests' ? requestQueue() : s === 'request' ? request() : s === 'role' ? role() : s === 'home' ? home() : soon(s.replace('soon:', ''));
    bind();
  }

  function bind() {
    document.querySelectorAll('[data-go]').forEach((b) => { b.onclick = () => { const g = b.dataset.go; if (g === 'roles' || g === 'people' || g === 'requests') go(g); else if (['mine', 'home'].includes(g)) go(g); else go('soon:' + (b.textContent || g)); }; });
    document.querySelectorAll('[data-person]').forEach((tr) => { tr.onclick = () => go('person', { person: tr.dataset.person }); });
    document.querySelectorAll('[data-person-link]').forEach((b) => { b.onclick = () => go('person', { person: b.dataset.personLink }); });
    document.querySelectorAll('[data-role]').forEach((tr) => { tr.onclick = () => go('role', { role: tr.dataset.role, draft: null, filter: '', onlyTicked: false }); });
    document.querySelectorAll('[data-revoke]').forEach((b) => { b.onclick = () => revokeDialog(Number(b.dataset.revoke)); });
    if ($('grant')) $('grant').onclick = grantDialog;
    if ($('ask-role')) $('ask-role').onclick = askDialog;
    document.querySelectorAll('[data-withdraw]').forEach((b) => { b.onclick = () => { requests.find((r) => r.id === Number(b.dataset.withdraw)).state = 'withdrawn'; toast('Request withdrawn.'); render(); }; });
    document.querySelectorAll('[data-request]').forEach((tr) => { tr.onclick = () => go('request', { request: tr.dataset.request }); });
    if ($('answer')) {
      const r = requests.find((x) => x.id === Number(state.request));
      $('answer').oninput = () => { $('refuse').disabled = $('answer').value.trim() === ''; };
      $('approve').onclick = () => {
        personOf(r.login).grants.push({ role: r.role, by: PERSONAS[state.persona].login, on: '4 Oct 2026', reason: 'Asked for it', note: r.why });
        Object.assign(r, { state: 'approved', answer: $('answer').value.trim(), by: PERSONAS[state.persona].login });
        toast(`${label(r.role)} given to ${personOf(r.login).name}.`); go('requests');
      };
      $('refuse').onclick = () => { Object.assign(r, { state: 'refused', answer: $('answer').value.trim(), by: PERSONAS[state.persona].login }); toast('Refused. They will read your reason.'); go('requests'); };
    }
    if ($('ask')) { $('ask').oninput = (e) => { state.ask = e.target.value; const pos = e.target.selectionStart; render(); $('ask').focus(); $('ask').setSelectionRange(pos, pos); }; }
    if ($('show-service')) $('show-service').onchange = (e) => { state.showService = e.target.checked; render(); };
    if ($('new-role')) $('new-role').onclick = () => newRoleDialog();
    if ($('edit-details')) $('edit-details').onclick = () => newRoleDialog(state.role);
    if ($('delete-role')) $('delete-role').onclick = () => { roles = roles.filter((r) => r.name !== state.role); toast('Role deleted.'); go('roles'); };
    if ($('filter')) $('filter').oninput = (e) => { state.filter = e.target.value; const pos = e.target.selectionStart; render(); $('filter').focus(); $('filter').setSelectionRange(pos, pos); };
    if ($('only-ticked')) $('only-ticked').onchange = (e) => { state.onlyTicked = e.target.checked; render(); };
    if ($('discard')) $('discard').onclick = () => { state.draft = null; render(); };
    if ($('save-bundle')) $('save-bundle').onclick = saveDialog;
    document.querySelectorAll('.cb[data-code]').forEach((cb) => {
      cb.onchange = () => {
        const code = cb.dataset.code;
        if (cb.checked) {
          state.draft.add(code);
          if (code.endsWith('::*')) { const c = code.slice(0, -3); for (const x of [...state.draft]) if (x.startsWith(c + '::') && x !== code) state.draft.delete(x); }
        } else state.draft.delete(code);
        const open = [...document.querySelectorAll('details.area')].map((d) => d.open);
        render();
        document.querySelectorAll('details.area').forEach((d, i) => { if (open[i]) d.open = true; });
      };
    });
  }

  $('me').onclick = () => { const m = $('me-menu'); m.hidden = !m.hidden; $('me').setAttribute('aria-expanded', String(!m.hidden)); };
  document.addEventListener('click', (e) => { if (!e.target.closest('#me') && !e.target.closest('#me-menu')) closeMe(); });

  function personaBar() {
    $('persona-seg').innerHTML = [['party', 'Daniel, a trader'], ['tenant', 'Priya, the tenant administrator']].map(([id, text]) => `<button aria-pressed="${state.persona === id}" data-persona="${id}">${text}</button>`).join('');
    document.querySelectorAll('[data-persona]').forEach((b) => { b.onclick = () => { state.persona = b.dataset.persona; personaBar(); go(state.persona === 'tenant' ? 'people' : 'mine'); }; });
  }

  const WHY = `<div class="why-head"><h3>What this prototype argues</h3><button class="why-close" id="why-close">Hide</button></div>
    <ul>
      <li><strong>Permissions are read by area, not as a list.</strong> The catalogue holds ${CATALOGUE.length - 1} permissions in ${TREE.size} areas, and almost every one is a read, a write or a delete of one thing. So each area is a grid: what, then Read, Write, Delete. The wireframe's flat list of codes does not survive the real catalogue.</li>
      <li><strong>"Can I…?" answers the member's real question</strong>, and names the role that allows it. A member rarely wants the whole list.</li>
      <li><strong>Everything is said as Everything.</strong> The tenant administrator role grants every permission; listing ${CATALOGUE.length - 1} ticks would hide that.</li>
      <li><strong>Service roles are hidden by default.</strong> ${SERVICE_ROLES.length} of the seeded roles belong to the platform's services. They are not offered to people and are not edited here.</li>
      <li><strong>Giving and taking away carry a reason.</strong> The grant row records who, when and why; the server does not yet take the reason on assign and revoke, so that is a small server change.</li>
      <li><strong>A change is stated honestly:</strong> it reaches the person within 30 minutes, when their sign-in renews, because refresh reads the permissions again.</li>
      <li><strong>Saving a role shows the difference first,</strong> and who holds it, because one save changes access for everyone with the role.</li>
      <li><strong>Every account shows its picture</strong>: in the header, the people list, a person's page, who gave a role, and who holds a role.</li>
      <li><strong>Asking lives in My access.</strong> A member asks for a role and says why; the request waits, can be withdrawn, and its answer is read where it was asked. Roles that grant everything are not offered.</li>
      <li><strong>The administrator answers from Requests,</strong> oldest first, with what the role would let the person do in view. A refusal needs a reason the person reads. Nobody answers their own request.</li>
      <li><strong>A request is held as its own record, not a waiting workflow.</strong> The workflow engine cannot wait on a person; a request row (who, which role, why, its state, who answered and why) needs no engine change, and giving the role reuses the ordinary grant.</li>
      <li><strong>Words, not codes.</strong> "Give a role" and "Take away" rather than assign and revoke; codes stay visible, small, for people who know them.</li>
    </ul>`;
  function setWhy(open) { const w = $('why'); w.hidden = !open; w.innerHTML = open ? WHY : ''; $('why-btn').setAttribute('aria-pressed', String(open)); $('why-btn').setAttribute('aria-expanded', String(open)); if (open) $('why-close').onclick = () => setWhy(false); }
  $('why-btn').onclick = () => setWhy($('why').hidden);

  /* A link can open a screen directly, for review: #persona=tenant&screen=role&role=Operations */
  const hash = new URLSearchParams(location.hash.slice(1));
  for (const key of ['persona', 'screen', 'person', 'role', 'request']) if (hash.get(key)) state[key] = hash.get(key);
  personaBar();
  render();
})();
</script>
</body>
</html>
